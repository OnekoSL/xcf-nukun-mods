en-US:
  STR_WERECAT_TAMING: "Werecat Taming"
  STR_WERECAT_TAMING_UFOPEDIA: "After studying live Werecats and refining our animal handling procedures, we believe we can condition a captured specimen for limited X-Com field service. A Werecat will never replace a standard agent and cannot be trusted with delicate equipment, but it is fast, stealthy and brutally effective in close combat."
  STR_WERECAT_TRAINING: "Werecat Conditioning"
  STR_WERECAT_TRAINING_UFOPEDIA: "A live captured Werecat can now be assigned to the Husbandry workshop for conditioning. The process turns one captive Werecat into a loyal X-Com Werecat operative. It remains a feral close-combat specialist: fast, alert and dangerous with its claws, but unsuitable for normal weapons, armor or delicate field equipment."
  STR_WERECAT_AGENT: "Werecat"
  STR_XCOM_WERECAT_ARMOR: "UNARMORED (WERECAT)"
  STR_XCOM_WERECAT_ARMOR_UNDERWATER: "UNARMORED (WERECAT) (Underwater)"
  STR_XCOM_WERECAT_ARMOR_UFOPEDIA: "A conditioned Werecat relies on speed, senses and claws rather than conventional gear. It is best used as a mobile melee hunter and scout."
  STR_WERECAT_SCOUT_HARNESS: "Werecat Scout Harness"
  STR_WERECAT_SCOUT_CLAWS: "Sharpened Werecat Claws"
  STR_XCOM_WERECAT_SCOUT_ARMOR: "SCOUT HARNESS (WERECAT)"
  STR_XCOM_WERECAT_SCOUT_ARMOR_UNDERWATER: "SCOUT HARNESS (WERECAT) (Underwater)"
  STR_XCOM_WERECAT_SCOUT_ARMOR_UFOPEDIA: "A lightweight durathread harness preserves the Werecat's mobility and carries compact sensors for reconnaissance and hunting. Sharpened claws permit faster attacks and strike harder than its natural claws. The Werecat becomes faster and more enduring, but remains only lightly protected. An olive-green field tint identifies this equipment in combat."
  STR_WERECAT_COMBAT_HARNESS: "Werecat Combat Harness"
  STR_WERECAT_COMBAT_CLAWS: "Werecat Alloy Claws"
  STR_XCOM_WERECAT_COMBAT_ARMOR: "COMBAT HARNESS (WERECAT)"
  STR_XCOM_WERECAT_COMBAT_ARMOR_UNDERWATER: "COMBAT HARNESS (WERECAT) (Underwater)"
  STR_XCOM_WERECAT_COMBAT_ARMOR_UFOPEDIA: "This heavy harness protects the chest, flanks and back with fitted alien-alloy plates. Alloy claws give its slower strikes substantially greater penetrating force. It makes the Werecat substantially more resilient, but restricts mobility, endurance and evasiveness. A steel-gray field tint identifies this equipment in combat."
