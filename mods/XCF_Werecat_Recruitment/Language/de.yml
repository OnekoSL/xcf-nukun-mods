de:
  STR_WERECAT_TAMING: "Werkatzenzaehmung"
  STR_WERECAT_TAMING_UFOPEDIA: "Nach der Untersuchung lebender Werkatzen und mit unseren verbesserten Verfahren fuer den Umgang mit Tieren glauben wir, ein gefangenes Exemplar fuer einen begrenzten X-Com-Felddienst abrichten zu koennen. Eine Werkatze ersetzt keinen normalen Agenten und ist fuer heikle Ausruestung ungeeignet, doch sie ist schnell, unauffaellig und im Nahkampf aeusserst gefaehrlich."
  STR_WERECAT_TRAINING: "Werkatzenabrichtung"
  STR_WERECAT_TRAINING_UFOPEDIA: "Eine lebend gefangene Werkatze kann jetzt in der Viehhaltung zur Abrichtung eingeteilt werden. Das Verfahren macht aus einer gefangenen Werkatze eine loyale X-Com-Werkatze. Sie bleibt ein wildes Nahkampf-Spezialwesen: schnell, wachsam und mit ihren Krallen gefaehrlich, aber ungeeignet fuer normale Waffen, Ruestungen oder heikle Feldausruestung."
  STR_WERECAT_AGENT: "Werkatze"
  STR_XCOM_WERECAT_ARMOR: "UNGERUESTET (WERKATZE)"
  STR_XCOM_WERECAT_ARMOR_UNDERWATER: "UNGERUESTET (WERKATZE) (Unterwasser)"
  STR_XCOM_WERECAT_ARMOR_UFOPEDIA: "Eine abgerichtete Werkatze verlaesst sich auf Geschwindigkeit, Sinne und Krallen statt auf konventionelle Ausruestung. Sie eignet sich am besten als beweglicher Nahkaempfer und Spaeher."
  STR_WERECAT_SCOUT_HARNESS: "Werkatzen-Spaehgeschirr"
  STR_WERECAT_SCOUT_CLAWS: "Geschaerfte Werkatzenkrallen"
  STR_XCOM_WERECAT_SCOUT_ARMOR: "SPAEHGESCHIRR (WERKATZE)"
  STR_XCOM_WERECAT_SCOUT_ARMOR_UNDERWATER: "SPAEHGESCHIRR (WERKATZE) (Unterwasser)"
  STR_XCOM_WERECAT_SCOUT_ARMOR_UFOPEDIA: "Ein leichtes Geschirr aus Durathread erhaelt die Beweglichkeit der Werkatze und traegt kompakte Sensoren fuer Aufklaerung und Jagd. Geschaerfte Krallen erlauben schnellere Angriffe und treffen haerter als die Naturkrallen. Die Werkatze wird schneller und ausdauernder, bleibt aber nur leicht geschuetzt. Im Einsatz kennzeichnet eine olivgruene Faerbung diese Ausruestung."
  STR_WERECAT_COMBAT_HARNESS: "Werkatzen-Kampfgeschirr"
  STR_WERECAT_COMBAT_CLAWS: "Werkatzen-Legierungsklauen"
  STR_XCOM_WERECAT_COMBAT_ARMOR: "KAMPFGESCHIRR (WERKATZE)"
  STR_XCOM_WERECAT_COMBAT_ARMOR_UNDERWATER: "KAMPFGESCHIRR (WERKATZE) (Unterwasser)"
  STR_XCOM_WERECAT_COMBAT_ARMOR_UFOPEDIA: "Dieses schwere Geschirr schuetzt Brust, Flanken und Ruecken mit angepassten Platten aus Alienlegierungen. Legierungsklauen verleihen den langsameren Hieben erheblich mehr Durchschlagskraft. Es macht die Werkatze wesentlich widerstandsfaehiger, schraenkt jedoch Beweglichkeit, Ausdauer und Ausweichvermoegen ein. Im Einsatz kennzeichnet eine stahlgraue Faerbung diese Ausruestung."
