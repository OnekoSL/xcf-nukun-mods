  STR_CULT_INVESTIGATION_BLACK_LOTUS_DESCRIPTION: "Wir haben einen Unterschlupf von Black Lotus lokalisiert, der fuer illegale und moeglicherweise verheerende Aktivitaeten genutzt wird. Wir muessen alle Anwesenden ausschalten oder festsetzen - idealerweise lebend fuer spaetere Verhoere."
  STR_CULT_INVESTIGATION_BRIEFING: "Wir haben einen Unterschlupf eines Kults geortet, der fur illegale und womoglich destruktive Zwecke genutzt wird. Wir mussen alle Insassen auer Gefecht setzen, wenn moglich lebendig fur spatere Verhore. Um die Mission abzubrechen, lassen Sie die XCom-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_CULT_INVESTIGATION_CHURCH_OF_DAGON_DESCRIPTION: "Wir haben einen Unterschlupf der Kirche Dagons lokalisiert, der fuer illegale und moeglicherweise verheerende Aktivitaeten genutzt wird. Wir muessen alle Anwesenden ausschalten oder festsetzen, idealerweise lebend fuer spaetere Verhoere."
  STR_CULT_INVESTIGATION_EXALT_DESCRIPTION: "Wir haben einen Unterschlupf von EXALT lokalisiert, der fuer illegale und moeglicherweise verheerende Aktivitaeten genutzt wird. Wir muessen alle Anwesenden ausschalten oder festsetzen - idealerweise lebend fuer spaetere Verhoere."
  STR_CULT_INVESTIGATION_THE_BRAINSUCKED: "Brainsucked-Versteck"
  STR_CULT_INVESTIGATION_THE_BRAINSUCKED_BRIEFING: "Wir haben ein sicheres Haus geortet, in dem sich ehemalige Cyberweb-Mitglieder sammeln. Ihre Absichten gegenueber unserer Zivilisation wirken feindselig, und ihr Verhalten ist unberechenbar. Wir muessen alle Anwesenden ueberwaeltigen und moeglichst lebend fuer Verhoere sichern. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CULT_INVESTIGATION_THE_BRAINSUCKED_DESCRIPTION: "Wir haben ein sicheres Haus geortet, in dem sich ehemalige Cyberweb-Mitglieder sammeln. Ihre Absichten gegenueber unserer Zivilisation wirken feindselig, und ihr Verhalten ist unberechenbar. Wir muessen alle Anwesenden ueberwaeltigen und moeglichst lebend fuer Verhoere sichern."
  STR_CULT_INVESTIGATION_ZSRR_DESCRIPTION: "Wir haben einen Unterschlupf der Morgenroete lokalisiert, der fuer illegale und moeglicherweise verheerende Aktivitaeten genutzt wird. Wir muessen alle Anwesenden ausschalten oder festsetzen - idealerweise lebend fuer spaetere Verhoere."
  STR_CULT_MANOR_BLACK_LOTUS_ASSAULT: "Black-Lotus-Anwesen"
  STR_CULT_MANOR_BLACK_LOTUS_ASSAULT_: "Black-Lotus-Anwesen-{0}"
  STR_CULT_MANOR_BLACK_LOTUS_ASSAULT_BRIEFING: "Sie stehen kurz davor, eine grosse, permanente Basis von Black Lotus zu stuermen. Die Organisation beherrscht das umliegende Gebiet politisch, also ist X-Com bei diesem Einsatz auf sich allein gestellt. Nehmen Sie alle Kultmitglieder fest oder schalten Sie sie aus. Falls Sie den Rueckzug antreten muessen, sammeln Sie die verbleibenden Agenten in der gruenen Ausgangszone und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CULT_MANOR_BLACK_LOTUS_ASSAULT_DESCRIPTION: "Black Lotus hat in dieser Stadt eine permanente Basis eingerichtet. Wir muessen sie zerstoeren, bevor sie unserer Sache zu sehr schadet. Da die Umgebung politisch bereits von der Gruppe dominiert wird, ist X-Com bei dieser Operation auf sich allein gestellt."
  STR_CULT_MANOR_CHURCH_OF_DAGON_ASSAULT: "Anwesen der Kirche Dagons"
  STR_CULT_MANOR_CHURCH_OF_DAGON_ASSAULT_: "Anwesen der Kirche Dagons-{0}"
  STR_CULT_MANOR_CHURCH_OF_DAGON_ASSAULT_BRIEFING: "Sie stehen kurz davor, eine grosse, dauerhafte Basis der Kirche Dagons zu stuermen. Sie hat das umliegende Gebiet politisch dominiert, daher ist X-Com bei diesem Einsatz auf sich allein gestellt. Nehmen Sie alle Kultmitglieder fest oder schalten Sie sie aus. Falls Sie sich zum Rueckzug entschliessen, sammeln Sie die verbleibenden Agenten in der gruenen Ausgangszone und klicken Sie auf das Symbol Mission abbrechen."
  STR_CULT_MANOR_CHURCH_OF_DAGON_ASSAULT_DESCRIPTION: "Die Kirche Dagons hat in dieser Stadt eine dauerhafte Basis eingerichtet. Wir muessen sie zerstoeren, bevor sie unserer Sache zu grossen Schaden zufuegt. Das umliegende Gebiet steht bereits unter ihrem politischen Einfluss, daher ist X-Com bei dieser Operation auf sich allein gestellt."
  STR_CULT_MANOR_EXALT_ASSAULT: "EXALT-Anwesen"
  STR_CULT_MANOR_EXALT_ASSAULT_: "EXALT-Anwesen-{0}"
  STR_CULT_MANOR_EXALT_ASSAULT_BRIEFING: "Sie stehen kurz davor, eine grosse, permanente Basis von EXALT zu stuermen. Die Organisation beherrscht das umliegende Gebiet politisch, also ist X-Com bei diesem Einsatz auf sich allein gestellt. Nehmen Sie alle Kultmitglieder fest oder schalten Sie sie aus. Falls Sie den Rueckzug antreten muessen, sammeln Sie die verbleibenden Agenten in der gruenen Ausgangszone und klicken Sie auf das Symbol 'Mission abbrechen'."
