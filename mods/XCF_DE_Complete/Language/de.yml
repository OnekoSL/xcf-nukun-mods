  DIMX: "Dim. X"
  MAP_UAC_MOON_CAVE_LAB: "VAST-Mondhoehle"
  STR_ABDUCTOR_FRAME: "Abductor-Huellenrahmen"
  STR_ABOMINATION_AUTOPSY_UFOPEDIA: "Dieses Untier sollte nicht leben konnen. Es hat keinen Mund oder Verdauungssystem. Was seine Muskulatur war, hat sich kurz nach dem Tod verflussigt. Chemische Analyse der Uberreste ergab, dass es Molekule enthalt, die in ihrer Struktur menschliche Aminosauren nachahmen. Seine bizarre Biologie macht es fast immun gegen Saure, aber sehr verwundbar gegen Feuerschaden."
  STR_ABYSSAL_ARTIFACT_DELIVERY: "Lieferung eines abyssalen Artefakts"
  STR_ABYSSAL_ARTIFACT_DELIVERY_BRIEFING: "Wir stehen kurz davor, ein Treffen zwischen der Kirche Dagons und Boten der Deep Ones zu unterbrechen. Die Aliens werden nach 5 Runden an Land gehen, richten Sie sich also darauf ein. Wenn Sie alle Kultisten davor ausschalten, gilt die Mission als erfolgreich - die Deep Ones und ihre Geschenke werden dann allerdings nicht in unsere Haende fallen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_ABYSSAL_ARTIFACT_DELIVERY_DESCRIPTION: "Die Kirche Dagons erwartet Besuch von jenen Tiefenbewohnern, die sie verehrt. Waehrend des Treffens werden Deep Ones dem oertlichen Kultfuehrer ein wertvolles Artefakt ueberreichen. Sorgen Sie dafuer, dass dieses Paket den Strand nicht unkontrolliert verlaesst.{NEWLINE}Der Strand wird von Agenten der Kirche aufmerksam ueberwacht, daher ist es am kluegsten, wenn wir uns als gewoehnliche Strandgaeste tarnen. Das schraenkt unsere Ausruestung erheblich ein, ist aber die einzige realistische Moeglichkeit, das Treffen abzufangen."
  STR_ABYSSAL_URN: "Abyssale Urne"
  STR_ABYSSAL_URN_OPENING: "Abyssale Urne oeffnen"
  STR_ABYSSAL_URN_UFOPEDIA: "Dieses verzierte Gefaess wird offenbar von Deep Ones verwendet, um Materialien fuer kulturelle oder diplomatische Zwecke zu lagern. Es besteht aus Aqua-Plastics und wird nach dem Oeffnen automatisch geborgen."
  STR_ACADEMY_TOWER_ASSAULT_BRIEFING: "Die Gold-Akademie hat ein Kulturzentrum in dieser Stadt eingerichtet, wirbt viele neue Rekruten an und starkt ihre politischen Verknupfungen. Wir haben Info uber psionische Maschinerie nahe der Spitze des Turms, zweifellos mit bosen Absichten installiert. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_ACID_PISTOL_CLIP_UFOPEDIA: "Diese Mischung hochreaktiver biologischer Verbindungen wird als Munition fur die Saurepistole benutzt. Sie ist voll mit Mikroorganismen, die standig den hochstmoglichen Sauregrad dieses Mikrobioms aufrechterhalten."
  STR_ADVANCED_FLIGHT_TRAINING_PREREQUISITE: "Voraussetzung: Fortgeschrittene Flugausbildung"
  STR_ADVANCED_FLIGHT_TRAINING_UFOPEDIA: "Kommandant, unsere hausintern ausgebildeten Piloten schlagen sich so gut, dass wir etwas sehr viel Anspruchsvolleres versuchen koennen. Ich hoffe, wir bekommen bald echte Kampfflugzeuge, also brauchen wir auch echte Kampfpiloten! Es klingt verrueckt, aber angesichts der Zaehigkeit unserer Agenten und der mysterioesen Methoden der Stabsaerztin halte ich das in vernuenftiger Zeit fuer machbar.{NEWLINE}Ein fortgeschrittener Trainingssimulator wird gerade installiert, Kommandant. Moechten Sie ihn ausprobieren?{NEWLINE}{NEWLINE}[Training erfordert: Mut 40, Reaktionen 50, Nervenkraft 50]{NEWLINE}{NEWLINE}HINWEIS: Manche Flugzeuge koennen nur von Agenten mit Fortgeschrittener Flugausbildung geflogen werden!"
  STR_ADVANCED_HEALING_SPRAY_UFOPEDIA: "Diese Ausfuhrung des Heilspray nutzt elerium-angereichertes Lebend-Gewebe gemischt mit quasi-intelligenten Mikropartikeln. Diese anorganischen Verbindungen formen spontan ein einfaches Gitter um alle Gewebeverletzungen, wahrend die biologischen Wirkmittel sie verschlieen. Dieser Mechanismus reduziert die Menge des notigen Materials sehr, und erlaubt daher mehr Ladungen in kleiner Verpackung."
  STR_ADVANCED_LASER_HAND_WEAPONS_MANUFACTURING: "Konstruktion fortschrittlicher Laserwaffen"
  STR_ADVANCED_LASER_WEAPONS_UFOPEDIA: "Unser neues Verstaendnis alienhafter Energiespeicherung und -erzeugung hat uns die Entwicklung fortschrittlicher Laserwaffen ermoeglicht. Diese neue Linie von Strahlwaffen wird mit E-115-Batterien betrieben und erreicht dadurch deutlich hoehere Leistung."
  STR_ADVANCED_UNDERWATER_OPERATIONS_UFOPEDIA: "Mit dem neuen U-Boot-Modul 'Trident' konnen wir bis zu 15 Agenten in noch groere Tiefen befordern.{NEWLINE}Achtung: Alle Hunde auf Unterwasser-Missionen werden ertrinken!"
  STR_AETHER_NEXUS_ASSAULT: "Aether Nexus"
  STR_AETHER_NEXUS_ASSAULT_: "Aether Nexus"
  STR_AETHER_NEXUS_BRIEFING: "Wir stehen kurz davor, den zentralen Knotenpunkt der Reclamation of Aether zu stuermen, der fuer einen grossen Teil der weltweiten Geisteraktivitaet verantwortlich ist. Der Feind hat unseren Zug vorausgeahnt und eine Horde Geister losgelassen, um die lokale Bevoelkerung zu terrorisieren und Zeit zu gewinnen. Wir muessen die Lage unter Kontrolle bringen und die Anlage ausschalten, damit die Schreckensherrschaft des Kults endet. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_AETHER_NEXUS_COMPLETED: "Der Aether Nexus ist gesichert."
  STR_AETHER_NEXUS_DESCRIPTION: "Dieses unscheinbare Buerogebaeude ist in Wahrheit das geheime Hauptquartier der Reclamation of Aether. Im Inneren steht arkane Technik, mit der spektrale Entitaeten beschworen werden. Wir muessen den Ort stuermen, den Kult zerschlagen und seine Geheimnisse offenlegen. Das Gelaende wird sowohl von Menschen als auch von Geistern verteidigt, und wegen der dichten Besiedlung der Umgebung hat der Schutz der Zivilisten oberste Prioritaet."
  STR_AFTER_THE_END: "Nach dem Ende"
  STR_AFTER_THE_END_DESCRIPTION: "Kraefte des Rats operieren nun von unserer alten Forschungsbasis in Dimension X aus und durchkaemmen den Planeten nach verbliebenen Widerstandsnestern. Sie haben eine grosse Militaeroperation begonnen, richten ihre Bemuehungen aber vor allem darauf aus, keine unnoetige Aufmerksamkeit der Einheimischen zu erregen. Doch kann man sich auf ihrer eigenen Welt wirklich vor ihnen verstecken? Was werden diese Aliens tun, wenn sie unseren Kampf beobachten? Solche Fragen scheinen die militaerische Fuehrung zu beschaeftigen, doch fuer Zweifel ist es zu spaet. Sich selbst ueberlassen, koennten Cyberweb-Fluechtlinge genauso gut einen politischen Zwischenfall ausloesen."
