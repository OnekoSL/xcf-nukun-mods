  STR_CULT_SUPPRESSION_BLACK_LOTUS: "Kult-Zerschlagung"
  STR_CULT_SUPPRESSION_BLACK_LOTUS_BRIEFING: "Unsere Aufgabe ist es, die lokale Polizei bei einer Razzia gegen eine Zelle von Black Lotus zu unterstuetzen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CULT_SUPPRESSION_BLACK_LOTUS_DESCRIPTION: "Weil es uns nicht gelungen ist, das Black-Lotus-Netzwerk rechtzeitig aufzudecken, konnte sich die Gruppe in dieser Stadt leise und dauerhaft festsetzen und mehrere Amtstraeger korrumpieren. Gluecklicherweise ist es einigen mutigen Polizisten gelungen, diese Aktivitaeten aufzudecken. Die korrupten Einheimischen festzunehmen ist nicht unsere Aufgabe, doch wenn wir nicht helfen, die Kultzelle auszuheben, wird am Ende wahrscheinlich gar niemand verhaftet."
  STR_CULT_SUPPRESSION_CHURCH_OF_DAGON: "Kult-Razzia"
  STR_CULT_SUPPRESSION_CHURCH_OF_DAGON_BRIEFING: "Unsere Aufgabe ist es, die lokale Polizei bei einer Razzia gegen eine Zelle der Kirche Dagons zu unterstuetzen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_CULT_SUPPRESSION_CHURCH_OF_DAGON_DESCRIPTION: "Weil wir das Netzwerk der Kirche Dagons nicht rechtzeitig aufdecken konnten, hat die Organisation in dieser Stadt dauerhaft Fuss gefasst und mehrere Amtspersonen korrumpiert. Gluecklicherweise ist es einigen unbeirrbaren Polizisten gelungen, diese Aktivitaeten aufzudecken. Die korrupten Einheimischen zu verhaften ist nicht unsere Aufgabe, aber wenn wir den Polizisten nicht helfen, die Zelle des Kults auszuheben, wird am Ende wahrscheinlich gar niemand festgenommen."
  STR_CULT_SUPPRESSION_EXALT: "Kult-Zerschlagung"
  STR_CULT_SUPPRESSION_EXALT_BRIEFING: "Unsere Aufgabe ist es, die lokale Polizei bei einer Razzia gegen eine Zelle von EXALT zu unterstuetzen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CULT_SUPPRESSION_EXALT_DESCRIPTION: "Weil es uns nicht gelungen ist, das Netzwerk von EXALT rechtzeitig aufzudecken, konnte sich die Organisation in dieser Stadt leise und dauerhaft festsetzen und mehrere Amtstraeger korrumpieren. Gluecklicherweise ist es einigen mutigen Polizisten gelungen, diese Aktivitaeten aufzudecken. Die korrupten Einheimischen festzunehmen ist nicht unsere Aufgabe, doch wenn wir nicht helfen, die Kultzelle auszuheben, wird am Ende wahrscheinlich gar niemand verhaftet."
  STR_CULT_SUPPRESSION_ZSRR_BRIEFING: "Unsere Aufgabe ist es, die lokale Polizei bei einer Razzia gegen eine Zelle der Morgenroete zu unterstuetzen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_CULT_SUPPRESSION_ZSRR_DESCRIPTION: "Unsere Unfaehigkeit, das Netzwerk der Morgenroete rechtzeitig aufzudecken, hat der Organisation erlaubt, sich in dieser Stadt dauerhaft festzusetzen und mehrere Amtspersonen zu korrumpieren. Gluecklicherweise ist es einigen mutigen Polizisten gelungen, diese Aktivitaeten aufzudecken. Die korrupten Einheimischen zu verhaften ist nicht unsere Aufgabe, aber wenn wir den Polizisten nicht helfen, die Zelle des Kults auszuheben, wird am Ende wahrscheinlich gar niemand festgenommen."
  STR_CUSTOMIZED_DIMENSIONAL_BATTERIES: "Angepasste dimensionale Batterien"
  STR_CUSTOMIZED_DIMENSIONAL_BATTERIES_UFOPEDIA: "Extradimensionale Batterien (XD) sind eine guenstige, wenn auch unvollkommene Alternative zu Alien-Energiequellen fuer Handwaffen. Seit wir die Technologie beherrschen, ist es fuer unsere Ingenieure relativ einfach, Energieclips fuer bekannte Waffen zu entwerfen, die keinerlei Alienmaterialien benoetigen, sondern nur transdimensionale Energieinfrastruktur. Der Nachteil liegt in geringerer Staerke und Kapazitaet gegenueber den Originalen, doch im Vergleich zu konventionellen Feuerwaffen bleiben sie attraktiv."
  STR_CYBERDREDNAUGHT: "Cyberweb-Schlachtschiff"
  STR_CYBERDREDNAUGHT_ASSAULT: "Cyberweb-Schlachtschiff entern"
  STR_CYBERDREDNAUGHT_ASSAULT_BRIEFING: "Wir muessen das Schlachtschiff sichern, um einen interdimensionalen Krieg gegen das Cyberweb zu verhindern. Rechnen Sie mit massivem Widerstand durch seine mechanischen Streitkraefte. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen' - aber bedenken Sie, dass ein Rueckzug X-Com in ernsthafte Schwierigkeiten bringen wuerde."
  STR_CYBERDREDNAUGHT_ASSAULT_DESCRIPTION: "Endlich haben wir eine Luecke in der Cyberweb-Sicherheit gefunden und koennen einen Angriff auf das gefuerchtete Schlachtschiff planen. Wenn wir siegen, zerschlagen wir Cyberwebs Plaene zur Weltherrschaft, und viele seiner Mitglieder werden auf Kleinkriminalitaet zurueckgeworfen. Rechnen Sie mit massivem Widerstand durch die mechanischen Streitkraefte des Cyberweb.{NEWLINE}Sie naehern sich dem Ziel in einem Mudranger, daher ist der Trupp auf 14 Agenten begrenzt."
  STR_CYBERDREDNAUGHT_PLANS: "Plaene des Cyberweb-Schlachtschiffs"
  STR_CYBERDREDNAUGHT_SECURED: "Cyberweb-Schlachtschiff gesichert."
  STR_CYBERINVESTIGATIONS: "Cyberermittlungen"
  STR_CYBERINVESTIGATIONS_UFOPEDIA: "Das neue Jahrhundert hat begonnen, und wir duerfen Verbrechern in keinem Bereich die Oberhand ueberlassen - auch nicht im Cyberspace. Wir widmen diesem neuen Einsatzfeld nun die noetige Aufmerksamkeit, was uns sicherlich helfen wird, illegale Datenbanken und Kommunikationswege aufzuspuren."
  STR_CYBERMINES_BRIEFING: "Bergleute wurden bei der Arbeit von aggressiven metallischen Insekten angegriffen. Die gesamte Mine steht unter Quarantaene. Wir muessen den Ort untersuchen und das Problem beseitigen. Um die Mission abzubrechen, fuehren Sie die X-Com-Kraefte in den Ausgangsbereich und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CYBERWEB: "Cyberweb"
  STR_CYBERWEB_AFTER_FORTRESS: "Omega-Alarm: Knoten-61S-2ZZ"
  STR_CYBERWEB_AFTER_FORTRESS_EVENT: "Cyberweb-Nachricht abgefangen"
  STR_CYBERWEB_AFTER_FORTRESS_EVENT_DESCRIPTION: "Kommandant, wir haben wichtige Kommunikation aus dem Cyberweb entschluesselt. Ich blende sie jetzt ein..."
  STR_CYBERWEB_AFTER_FORTRESS_UFOPEDIA: "Alle Knoten, neu einklinken und auf Einschlag gefasst machen.{NEWLINE}X-Coms Stosstruppen haben diesmal nicht nur herumgestochert; sie haben eine unserer grossen Militaerfestungen gestuermt und sie aufgebrochen wie einen verrosteten Tresor. Im Chaos haben sie streng geheime Daten ueber das Superwaffenprojekt abgesaugt - genau die Informationen, die niemals in feindliche Haende geraten durften.{NEWLINE}Das ist kein blosses Leck. Das ist ein katastrophaler Durchbruch. Mit diesen Daten koennen sie unsere Routen kartieren, die Ladezyklen vorhersagen und vielleicht sogar die Waffe selbst sabotieren.{NEWLINE}Leitet jede verfuegbare Ressource in Gegenoperationen und Abriegelungsprotokolle. Wenn sie glauben, sie koennten uns den ultimativen Preis verwehren, werden sie gleich erfahren, wie echter Widerstand aussieht.{NEWLINE}Ende der Nachricht. Bleibt wachsam, bleibt explosiv."
  STR_CYBERWEB_AFTER_PLANT: "Alpha-Alarm: Knoten-54Q-3NN"
  STR_CYBERWEB_AFTER_PLANT_EVENT: "Cyberweb-Nachricht abgefangen"
  STR_CYBERWEB_AFTER_PLANT_EVENT_DESCRIPTION: "Kommandant, wir haben wichtige Kommunikation aus dem Cyberweb entschluesselt. Ich blende sie jetzt ein..."
  STR_CYBERWEB_AFTER_PLANT_UFOPEDIA: "Alle Knoten, einklinken und aufpassen.{NEWLINE}X-Coms Konzernspuktruppe hat dem Cyberweb einen halben Sieg abgerungen und ist dabei mit dem Gesicht voran in die Wahrheit gerauscht - jetzt wissen sie, dass das transdimensionale Tor-Gitter real ist. Wenn ihr also noch an harmlosen Niedrigvolt-Projekten herumschraubt, lasst es bleiben und baut kampftaugliche Hardware, Schwarzmarkt-Mods, alles, was zurueckschlaegt, wenn die Anzugtraeger anrollen.{NEWLINE}Ein bewaffneter X-Com-Einbruch ist nicht mehr nur 'wahrscheinlich' - er geistert bereits an unserem Rand entlang und atmet statisches Rauschen durch die Risse.{NEWLINE}Ende der Nachricht. Das Netzwerk bleibt wach."
  STR_CYBERWEB_AFTER_PORTAL: "Zeta-Alarm: Knoten-47K-8HJ"
  STR_CYBERWEB_AFTER_PORTAL_EVENT: "Cyberweb-Nachricht abgefangen"
  STR_CYBERWEB_AFTER_PORTAL_EVENT_DESCRIPTION: "Kommandant, wir haben wichtige Kommunikation aus dem Cyberweb entschluesselt. Ich blende sie jetzt ein..."
  STR_CYBERWEB_AFTER_PORTAL_UFOPEDIA: "Alle Knoten, wieder einklinken - das ist keine Uebung.{NEWLINE}X-Coms militarisierte Schrottsammler haben gerade einen unserer Aussenposten gekapert, ein interdimensionales Portal aufgebrochen, als gehoerte ihnen der Laden, und starren jetzt direkt in das Parallelgitter, in dem unsere Schwesteranlagen stehen.{NEWLINE}Das ist nicht nur ein Sicherheitsvorfall, sondern ein Bedrohungsvektor ueber Realitaetsgrenzen hinweg. Wenn sie dieses Portal verstehen, marschieren sie bald in Universen, die sie niemals haetten beruehren duerfen.{NEWLINE}Lenkt alle Energie in Verteidigungsprojekte, Gegeninfiltrations-Rigs und alles, was ihnen die Tuer vor der Nase zuschlagen kann.{NEWLINE}Sie glauben, sie haetten einen Sieg errungen. In Wahrheit haben sie nur die Zundschnur angezuendet.{NEWLINE}Ende der Nachricht. Bleibt laut, bleibt unregierbar."
  STR_CYBERWEB_BATTERY: "Cyberweb-Batterie"
  STR_CYBERWEB_BATTERY_MANUFACTURING: "Cyberweb-Batterieproduktion"
  STR_CYBERWEB_BATTERY_MANUFACTURING_UFOPEDIA: "Nach eingehender Untersuchung von Cyberweb-Dateien verstehen wir nun die dimensionale Technologie, mit der sie ihre Batterien herstellen. Oder vielleicht ist 'verstehen' zu viel gesagt; Cyberweb scheint selbst kaum mehr zu wissen, und das hat sie trotzdem nicht davon abgehalten, die Prinzipien nutzbar zu machen. Warum also nicht wir? Natuerlich brauchen wir dafuer einen Transdimensionalen Empfaenger in der Naehe der Werkstatt.{NEWLINE}Eine Sache noch: Diese Batterien sind alles andere als effizient. Wie Sie wissen, ist dimensionaler Transfer launisch und funktioniert je nach Zeit und Ort mal ja, mal nein. Das bedeutet, dass auf jede Batterie, die gerade einsatzfaehig ist, mehrere kommen, die im Moment nicht funktionieren, morgen aber vielleicht doch ... Die Logistik wird unerquicklich. Gut, dass das nicht mein Aufgabenbereich ist."
  STR_CYBERWEB_BATTERY_ORIGINS: "Ursprung der Cyberweb-Batterien"
  STR_CYBERWEB_BATTERY_ORIGINS_UFOPEDIA: "Der Mystek hat einige aufschlussreiche Details darueber preisgegeben, woher Cyberweb seine Batterien bezieht. Der Kern des Verfahrens entzieht sich uns zwar weiterhin, doch offenbar werden diese Batterien eher gezuechtet als hergestellt. Es gibt arkane, vollautomatisierte Anlagen, die vom Cyberweb gebaut und instand gehalten werden und in grossem Massstab exotische Batterien hervorbringen. Ihr Standort ist unbekannt, aber manches deutet darauf hin, dass sie sich nicht auf der Erde befinden.{NEWLINE}Wie ein derartiges Industrieunternehmen zu einer anarchistischen Bewegung wie dem Cyberweb passen soll, entzieht sich voellig unserem Verstaendnis."
  STR_CYBERWEB_BATTERY_TO_IONIZER_CLIP: "Batterie-Abstimmung: Ionisierer"
  STR_CYBERWEB_BATTERY_TO_ION_BLASTER_CLIP: "Batterie-Abstimmung: Ionenschiesser"
  STR_CYBERWEB_BATTERY_TO_LIGHTNING_THROWER_CLIP: "Batterie-Abstimmung: Blitzwerfer"
  STR_CYBERWEB_BATTERY_UFOPEDIA: "Leistungsstarke Ausruestung des Cyberweb ist auf spezielle Batterien angewiesen, die auf ausgesprochen exotischer Physik beruhen. Die Batterie enthaelt keine eigene Energiequelle; stattdessen nutzt sie eine Art interdimensionalen Sog, um Energie aus einer anderen Ebene, moeglicherweise sogar einem anderen Universum, zu beziehen. Ewig haelt sie dennoch nicht, denn ihre Struktur zerfaellt unter der Belastung und erlaubt nur eine begrenzte Energieuebertragung, bevor sie ausbrennt. Positiv ist immerhin, dass die Batterie fuer saemtliche Formen der Energiedetektion unsichtbar bleibt, solange sie nicht aktiv ist. Das Geraet wirkt ausgesprochen experimentell, ist aber dennoch beeindruckend.{NEWLINE}Dieselbe Cyberweb-Batterie kann verschiedene Waffen und Geraete antreiben, muss dafuer jedoch jedes Mal auf ein bestimmtes System kalibriert werden. Die verschiedenen Konfigurationen sind farbcodiert."
  STR_CYBERWEB_BRAIN_IMPLANT: "Cyberweb-Gehirnimplantat"
  STR_CYBERWEB_BRAIN_IMPLANT_PREQ: "Informationen zum Cyberweb-Gehirnimplantat"
  STR_CYBERWEB_BRAIN_IMPLANT_UFOPEDIA: "Alle Mitglieder des Cyberweb tragen ein Implantat im Gehirn, das den Zugang zu ihrem globalen Rechnernetz ermoeglicht und zur Steuerung von Maschinen dient. Im Gegensatz zu ihren anderen kybernetischen Augmentationen scheint dieses Implantat innerhalb eines vertretbaren Zeitraums auch bei einem normalen Menschen einsetzbar zu sein. Vielleicht koennten wir es nutzen, um direkt mit unseren eigenen Systemen zu interagieren, sofern wir einen Freiwilligen finden."
  STR_CYBERWEB_CENTURION: "Centurion"
  STR_CYBERWEB_CENTURION_ARMOR: "Kampfanalyse: Cyberweb-Centurion"
  STR_CYBERWEB_CENTURION_AUTOPSY: "Untersuchung: beschaedigter Centurion"
  STR_CYBERWEB_CENTURION_AUTOPSY_UFOPEDIA: "Dieses robotische Konstrukt ist erheblich komplexer als andere Cyberweb-Maschinen, denen wir bisher begegnet sind. Es ist schwer gepanzert, mit hochwertigen Legierungen verstaerkt und mit zahlreichen optischen Sensoren ausgestattet, die ihm beim Zielen mit seiner Hauptwaffe helfen."
  STR_CYBERWEB_CENTURION_CORPSE: "Beschaedigter Cyberweb-Centurion"
  STR_CYBERWEB_CENTURION_RAMPAGE: "Centurion ausser Kontrolle"
  STR_CYBERWEB_CENTURION_RAMPAGE_BRIEFING: "Eine hochentwickelte Kriegsmaschine des Cyberweb zerlegt die Stadt in Einzelteile. Sie muessen diese Katastrophe aufhalten. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CYBERWEB_CENTURION_RAMPAGE_DESCRIPTION: "Eine hochentwickelte Kriegsmaschine des Cyberweb ist offenbar ausser Kontrolle geraten und zerstoert die Stadt mit blindem Zorn. Wir muessen sie aufhalten, sonst wird uns der Rat das nicht verzeihen."
  STR_CYBERWEB_CENTURION_TERRORIST: "Cyberweb-Centurion"
  STR_CYBERWEB_CENTURION_UFOPEDIA: "Dieser furchterregende Roboter ist eine maechtige Kampfeinheit, bewaffnet mit einem Ionenschiesser und einer Energiewaffe fuer den Nahkampf. Zudem ist er sehr robust und nur schwer auszuschalten."
  STR_CYBERWEB_CENTURION_WEAPON: "Centurion-Laser"
  STR_CYBERWEB_CYBORG: "Cyberweb-Cyborg"
  STR_CYBERWEB_CYBORG_UFOPEDIA: "Cyberweb verfuegt ueber sehr fortschrittliche kybernetische Technologie. Alle seine Mitglieder sind Cyborgs mit zahlreichen Verbesserungen an ihrem Koerper. Leider ist deren Einbau ein aeusserst langwieriger Prozess, der Jahre in Anspruch nimmt und fuer unsere Zwecke daher kaum praktikabel ist."
  STR_CYBERWEB_DIMENSIONAL_PORTAL: "Cyberweb-Dimensionsportal"
  STR_CYBERWEB_DIMENSIONAL_PORTAL_BRIEFING: "Wir fuehren eine Razzia gegen eine groessere Anlage des Cyberweb durch, in der ein Dimensionsportal geortet wurde. Unser Ziel ist es, den Ort einzunehmen und die Maschinerie zu untersuchen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CYBERWEB_DIMENSIONAL_PORTAL_DESCRIPTION: "Cyberweb hat ein Portal in eine andere Dimension gebaut. Wir muessen es sichern und unter unsere Kontrolle bringen."
  STR_CYBERWEB_DIMENSIONAL_PORTAL_TAKEN: "Cyberweb-Portal gesichert"
  STR_CYBERWEB_DOMINATION: "Cyberweb-Vorherrschaft"
  STR_CYBERWEB_FAILED_GATEWAY: "Cyberweb-Portalversagen"
  STR_CYBERWEB_FAILED_GATEWAY_DESCRIPTION: "Eine ploetzliche Energieentladung hat Fetzen von Xeno-Gewebe ueber ein weites Gebiet in der Wildnis von {0} verteilt. Vermutlich war ein fehlgeschlagenes Portalexperiment des Cyberweb die Ursache. Die Bergungseinheiten vertuschen den Vorfall, aber der Rat ist beunruhigt.{NEWLINE}[-50 Punkte]"
  STR_CYBERWEB_FORTRESS: "Cyberweb-Festung"
  STR_CYBERWEB_FORTRESS_ASSAULT: "Cyberweb-Festungssturm"
  STR_CYBERWEB_FORTRESS_ASSAULT_BRIEFING: "Sie naehern sich einer Cyberweb-Festung mitten in der rosa Wueste. Nehmen Sie die Anlage ein, um Zugang zum Rechnerkern zu erhalten. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CYBERWEB_FORTRESS_ASSAULT_DESCRIPTION: "Wenn wir diese Festung einnehmen, koennen wir vielleicht tief in Cyberwebs Geheimnisse vordringen. Erobern Sie die Anlage, um Zugang zum Rechnerkern zu erhalten.{NEWLINE}Die Mission findet in Dimension X statt; stellen Sie also sicher, dass alle Agenten Schutzkleidung tragen. Sie naehern sich dem Ziel in einem Mudranger, daher ist der Trupp auf 14 Agenten begrenzt."
  STR_CYBERWEB_FORTRESS_SECURED: "Cyberweb-Festung gesichert."
  STR_CYBERWEB_FORTRESS_UFOPEDIA: "Wir haben endlich einen Cyberweb-Aussenposten in Dimension X gefunden. Dieser befestigte Komplex ist vermutlich nicht ihre Hauptbasis, duerfte aber wichtige Hinweise darauf enthalten, was das Cyberweb plant.{NEWLINE}Kann ich den Agenten Bescheid geben, dass sie sich bereitmachen sollen?"
  STR_CYBERWEB_HEIST: "Cyberweb-Ueberfall"
  STR_CYBERWEB_HEIST_BRIEFING: "Cyberweb-Kraefte haben ein streng geheimes Militaerobjekt ueberfallen. Helfen Sie dem Militaer, den Angriff zurueckzuschlagen, und versuchen Sie, das Personal des Stuetzpunkts zu schuetzen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CYBERWEB_HEIST_DESCRIPTION: "Cyberweb-Kraefte haben ein streng geheimes Militaerobjekt ueberfallen. Helfen Sie dem Militaer, den Angriff zurueckzuschlagen, und versuchen Sie, das Personal des Stuetzpunkts zu schuetzen."
  STR_CYBERWEB_HEIST_WON: "Cyberweb-Ueberfall abgewehrt."
  STR_CYBERWEB_HQ: "Cyberweb-HQ"
  STR_CYBERWEB_HQ_UFOPEDIA: "Wir haben das HQ des Cyberweb in Dimension X geortet. Es handelt sich jedoch nicht um einen Stuetzpunkt, sondern um ein riesiges Luftschiff, das ein Dimensionsportal oeffnen und auf der Erde Chaos anrichten kann!{NEWLINE}Da es bei einem Angriff durch unsere Abfangjaeger einfach nach Dimension X entkommen kann, muessen wir dieses Schlachtschiff stuermen, wenn es zur Wartung am Boden ist. Bis dahin muessen wir den Himmel der Erde gegen seine Vorstoesse sichern. Seien Sie vorsichtig: Der Rat wird jede Sekunde hassen, die dieses Schiff in der Erdatmosphaere verbringt.{NEWLINE}Vermasseln Sie das nicht, Kommandant. Die Zukunft von X-Com haengt davon ab!"
  STR_CYBERWEB_LAIR: "Cyberweb-Versteck"
  STR_CYBERWEB_LAIR_BRIEFING: "Wir haben einen isolierten Cyberweb-Wissenschaftler aufgespuert, der tief in den Eingeweiden der Stadt ein Versteck unterhaelt. Wir sollten ihn festsetzen und zum Verhoer bringen. Wie beim Cyberweb ueblich, wird er von mehreren robotischen Einheiten bewacht. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CYBERWEB_LAIR_DESCRIPTION: "Wir haben einen isolierten Cyberweb-Wissenschaftler aufgespuert, der tief in den Eingeweiden der Stadt ein Versteck unterhaelt. Wir sollten ihn festsetzen und verhoeren.{NEWLINE}Wie beim Cyberweb ueblich, wird er von mehreren robotischen Einheiten bewacht. Hueten Sie sich vor ihren maechtigen Energiestrahlern!{NEWLINE}Nehmen Sie Sprengstoff mit, falls wir uns den Zugang erzwingen muessen - durch diese Kanalisation zu navigieren ist ein Albtraum."
  STR_CYBERWEB_MANUFACTURING_PLANT: "Cyberweb-Fabrik"
  STR_CYBERWEB_MANUFACTURING_PLANT_BRIEFING: "Wir stuermen eine geheime Fabrik des Cyberweb. Unser Ziel ist es, die Anlage einzunehmen und sicherzustellen, dass keine illegale Technik mehr den freien Markt erreicht. Halten Sie auch nach Geheimdokumenten Ausschau. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CYBERWEB_MANUFACTURING_PLANT_DESCRIPTION: "Cyberweb betreibt hier eine geheime Fabrik fuer einige seiner ehrgeizigeren Projekte. Diese Einrichtung spielt eine wichtige Rolle im Schwarzhandel mit illegaler Technologie und muss ausgeschaltet werden."
  STR_CYBERWEB_MANUFACTURING_PLANT_UFOPEDIA: "Mitglieder des Cyberweb bauen gewoehnlich alles, was sie brauchen, in ihren Werkstaetten. Das bedeutet jedoch nicht, dass sie nicht zusammenarbeiten koennten. Cyberweb unterhaelt weltweit mehrere Fabriken und nutzt sie fuer groessere Projekte. Wir sollten einen solchen Ort infiltrieren und herausfinden, woran sie dort arbeiten."
  STR_CYBERWEB_MYSTEK: "Cyberweb-Mystek"
  STR_CYBERWEB_MYSTEK_ARMOR: "Kampfanalyse: Cyberweb-Mystek"
  STR_CYBERWEB_MYSTEK_CORPSE: "Cyberweb-Mystek-Leiche"
  STR_CYBERWEB_MYSTEK_UFOPEDIA: "Mysteks sind Technomads, die sich deutlich staerker fuer theoretische Wissenschaft als fuer praktische Anwendungen interessieren. Gewoehnliche Technomads betrachten sie beinahe als religioese Figuren, eingeweiht in die Geheimkuenste dimensionaler Physik. Mysteks sind tatsaechlich fuer den Bau der Cyberweb-Portale verantwortlich, die zu Orten jenseits der Erde und moeglicherweise sogar jenseits unserer Wirklichkeit fuehren."
  STR_CYBERWEB_PLANS: "Cyberweb-Plaene"
  STR_CYBERWEB_PLANS_UFOPEDIA: "Die Unterlagen, die wir beschafft haben, befassen sich mit Cyberwebs Projekt zur Entwicklung von Portalen in andere Dimensionen. So unwahrscheinlich das klingt, offenbar war das Cyberweb damit nicht nur erfolgreich, sondern schickt seit geraumer Zeit bereits Personal und Material durch solche 'Dimensionsportale'. Das deutet auf eine groessere Operation auf der anderen Seite hin. Das Portal nutzt ein Medium namens 'Subraum' und ist hochgradig instabil, was zu mehreren Unfaellen mit schweren Verlusten gefuehrt hat. Am Ende entwickelte Cyberweb jedoch eine Methode, es zu kontrollieren, indem eine Batterie optronischer Supercomputer direkt daran gekoppelt wird; dennoch bleibt unvorhersehbar, wie lange ein Portal offen bleibt. Wenn wir eine Methode entwickeln, um die beim Betrieb eines Portals verursachten Subraumstoerungen aufzuspuren, koennen wir es orten und einen Trupp entsenden, um es zu sichern."
  STR_CYBERWEB_PORTAL_SYSTEM: "Cyberweb-Portalsystem"
  STR_CYBERWEB_PORTAL_SYSTEM_UFOPEDIA: "Das Cyberweb-Portal, das wir gesichert haben, ist offenbar nur eines von vielen auf der Erde. Die transdimensionale Technik des Cyberweb hat naemlich einen entscheidenden Nachteil: Sie laesst sich nur zu bestimmten Zeiten und an bestimmten Orten aktivieren. Um also eine halbwegs vernuenftige Reiserate aufrechtzuerhalten, muss man weltweit viele solcher Anlagen unterhalten. Wenn wir das Portal selbst nutzen wollen, muessen wir also auch die Uhr im Blick behalten.{NEWLINE}Ein weiteres Problem ist, dass diese Portale ... undicht sind. Neben dem Haupttor koennen sich in der Umgebung spontan kleinere Blasen oeffnen. Entstehen diese Miniportale ausserhalb der Anlage, dringen oft extradimensionale Kreaturen auf die Erde vor. Das Cyberweb scheint sich daran kaum zu stoeren."
  STR_CYBERWEB_POWER_PLANT: "Cyberweb-Kraftwerk"
  STR_CYBERWEB_POWER_PLANT_BRIEFING: "Wir muessen an diesem Ort eine Energieanlage des Cyberweb unter Kontrolle bringen. Schalten Sie jeden Widerstand an der Oberflaeche aus, bevor Sie in die Tiefe vorstossen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CYBERWEB_POWER_PLANT_DESCRIPTION: "Wir muessen an diesem Ort eine Energieanlage des Cyberweb unter Kontrolle bringen.{NEWLINE}Die Mission findet in Dimension X statt; stellen Sie also sicher, dass alle Agenten Schutzkleidung tragen. Sie naehern sich dem Ziel in einem Mudranger, daher ist der Trupp auf 14 Agenten begrenzt."
  STR_CYBERWEB_POWER_PLANT_SECURED: "Cyberweb-Kraftwerk gesichert."
  STR_CYBERWEB_POWER_PLANT_UFOPEDIA: "Wir haben in einer abgelegenen Region des Alienplaneten einen Industriekomplex geortet. Er wirkt wie eine Nuklearanlage, aber wir haben auch unbekannte Maschinen registriert, die seltsame Strahlung abgeben. Der Ort wirkt stark automatisiert und nur von einer rudimentaeren menschlichen Besatzung betrieben. Die Perimeterverteidigung scheint vor allem auf den Schutz vor einheimischen Lebensformen ausgelegt zu sein."
  STR_CYBERWEB_POWER_PLANT_UNDERGROUND: "Unterirdisches Cyberweb-Kraftwerk"
  STR_CYBERWEB_POWER_PLANT_UNDERGROUND_BRIEFING: "Wir sind in die geheimnisvolle Anlage des Cyberweb eingedrungen. Bringen Sie die Einrichtung unter Kontrolle. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CYBERWEB_POWER_TRANSMISSION: "Cyberweb-Energieuebertragung"
  STR_CYBERWEB_POWER_TRANSMISSION_UFOPEDIA: "Die Cyberweb-Anlage entpuppte sich als ziemlich gewoehnlicher Kernreaktor, wenn auch aus einer Mischung irdischer und alienhafter Technik gebaut. Der interessanteste Teil war ein leistungsstarkes Relaissystem auf Grundlage dimensionaler Physik, dessen Hauptaufgabe darin besteht, verschiedene Geraete des Cyberweb selbst auf der Erde aus der Ferne mit Energie zu versorgen. Diese Technologie wurde von der in Dimension X beheimateten Zivilisation adaptiert und ist ebenso beeindruckend wie gefaehrlich und instabil.{NEWLINE}Cyberweb hat auf dem Alienplaneten noch weitere solcher Anlagen versteckt, daher wird der Verlust dieser einen sie kaum ernsthaft schwaechen. Vielleicht kann sie aber fuer uns nuetzlich sein.{NEWLINE}Vorerst haben wir die Kontrolle ueber die Anlage an die Bergungseinheiten des Rates uebergeben, da uns sowohl Personal als auch Auftrag fehlen, um sie selbst zu betreiben. Vielleicht koennen wir mit dem Rat eine Vereinbarung treffen."
  STR_CYBERWEB_RATIONALE: "Cyberweb-Ideologie"
  STR_CYBERWEB_RATIONALE_UFOPEDIA: "Wer wissenschaftlich denkt und dann mit Alien-Technologie konfrontiert wird, kann einen tiefen Schock erleben, weil grundlegende Prinzipien ploetzlich ins Wanken geraten. Cyberweb ist eine moegliche Reaktion darauf: eine Organisation, die den Unwillen, Unwissenheit hinzunehmen, in gewaltsamen Widerstand verwandelt. Cyberweb ist strikt egalitaer, doch seine Mitglieder eint ein gemeinsames Ziel: Alien-Technologie als Waffe einzusetzen, um dort Kontrolle zu gewinnen, wo immer es moeglich ist. Gleichgesinnte werden aus Gruppen wie den Wizkids, The League, Osiron und anderen moderateren Fraktionen mit Hintergrund in exotischer Technologie rekrutiert. Die meisten dieser Organisationen halten Cyberweb-Technomads fuer gefaehrliche Extremisten - ganz wie wir - und stellen sich im Allgemeinen gegen sie. Osiron bildet eine bemerkenswerte Ausnahme: Dort pflegt man freundschaftliche Beziehungen zum Cyberweb und arbeitet sogar an einzelnen Projekten zusammen."
  STR_CYBERWEB_RECRUITMENT: "Cyberweb-Rekrutierung"
  STR_CYBERWEB_RECRUITMENT_BRIEFING: "Cyberweb sucht neue Mitglieder und richtet sein Augenmerk auf eine Untergrundgang technikbegeisterter Alienfans namens 'The Wizkids'. Wir haben eine halblegale Bar geortet, in der die Anwerbung stattfindet. Das ist eine gute Gelegenheit, gegen beide Gruppen gleichzeitig vorzugehen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CYBERWEB_RECRUITMENT_DESCRIPTION: "Cyberweb sucht neue Mitglieder und richtet sein Augenmerk auf eine Untergrundgang technikbegeisterter Alienfans namens 'The Wizkids'. Wir haben eine halblegale Bar geortet, in der die Anwerbung stattfindet. Das ist eine gute Gelegenheit, gegen beide Gruppen gleichzeitig vorzugehen.{NEWLINE}Es sind nur verdeckbare Gegenstaende und Zivilkleidung erlaubt!"
  STR_CYBERWEB_ROBOSPHERE: "Robosphere"
  STR_CYBERWEB_ROBOSPHERE_ARMOR: "Kampfanalyse: Cyberweb-Robosphere"
  STR_CYBERWEB_ROBOSPHERE_AUTOPSY: "Untersuchung: beschaedigte Robosphere"
  STR_CYBERWEB_ROBOSPHERE_AUTOPSY_UFOPEDIA: "Diese kleine Kampfdrohne ist mit einem Antigravmodul und einer Laserwaffe ausgeruestet. Sie arbeitet mit hochentwickelter Hardware. Ihre Panzerung reagiert am empfindlichsten auf Energiewaffen."
  STR_CYBERWEB_ROBOSPHERE_CORPSE: "Beschaedigte Cyberweb-Robosphere"
  STR_CYBERWEB_ROBOSPHERE_TERRORIST: "Cyberweb-Robosphere"
  STR_CYBERWEB_ROBOSPHERE_UFOPEDIA: "Diese kleine robotische Einheit ist schnell, wendig und gut bewaffnet. Zusaetzlich ist sie mit kugelsicherer, korrosionsbestaendiger Panzerung versehen, doch Sprengstoff oder Energiewaffen duerften sie rasch ausschalten."
  STR_CYBERWEB_ROBOTURRET: "Roboturret"
  STR_CYBERWEB_ROBOTURRET_ARMOR: "Kampfanalyse: Roboturret"
  STR_CYBERWEB_ROBOTURRET_AUTOPSY: "Untersuchung: beschaedigter Roboturret"
  STR_CYBERWEB_ROBOTURRET_AUTOPSY_UFOPEDIA: "Dieser kettengetriebene automatische Geschuetzturm feuert starke Energiestrahlen und ist gut gepanzert."
  STR_CYBERWEB_ROBOTURRET_CORPSE: "Beschaedigter Cyberweb-Roboturret"
  STR_CYBERWEB_ROBOTURRET_TERRORIST: "Cyberweb-Roboturret"
  STR_CYBERWEB_ROBOTURRET_UFOPEDIA: "Dieser mobile Geschuetzturm ist intelligent genug, um eigenstaendig an Gefechten teilzunehmen, und verfuegt ueber genug Feuerkraft, um praktisch jeden Gegner niederzuhalten."
  STR_CYBERWEB_SPACE_TECHNOMAD: "Cyberweb-Weltraum-Technomad"
  STR_CYBERWEB_SPACE_TECHNOMAD_ARMOR: "Kampfanalyse: Cyberweb-Weltraum-Technomad"
  STR_CYBERWEB_SPACE_TECHNOMAD_PROCESSING: "Auswertung: Cyberweb-Weltraum-Technomad"
  STR_CYBERWEB_TECHNOMAD: "Cyberweb-Technomad"
  STR_CYBERWEB_TECHNOMAD_ARMOR: "Kampfanalyse: Cyberweb-Technomad"
  STR_CYBERWEB_TECHNOMAD_AUTOPSY: "Cyberweb-Augmentationen"
  STR_CYBERWEB_TECHNOMAD_AUTOPSY_UFOPEDIA: "Mitglieder des Cyberweb wirken aeusserlich menschlich, sind jedoch massiv mit anorganischen Implantaten modifiziert. Dazu gehoeren Panzerplatten zum Schutz lebenswichtiger Organe, kybernetischer Ersatz fuer einige dieser Organe und kleine Gehirnimplantate. Diese Augmentationen machen sie gegen nahezu alle Schadensarten widerstandsfaehig und steigern zugleich ihre Kraft, Zielgenauigkeit und Reflexe."
  STR_CYBERWEB_TECHNOMAD_CORPSE: "Cyberweb-Technomad-Leiche"
  STR_CYBERWEB_TECHNOMAD_UFOPEDIA: "Technomads bilden den Kern des Cyberweb. Sie sind Cyborg-Wissenschaftler und -Ingenieure auf der Jagd nach unirdischem Wissen. Ausserdem sind sie voellig amoralisch und ein wenig wahnsinnig. Unsere Agenten sollten ihnen mit groesster Vorsicht begegnen, denn sie sind zaeher, als sie aussehen, und setzen exotische Hochleistungswaffen ein, die sie selbst gebaut haben."
  STR_CYBERWEB_UFOPEDIA: "Cyberweb ist eine Untergrundorganisation abtruenniger Wissenschaftler mit Zugang zu exotischer Technologie. Sie bilden ein lose verknuepftes Netzwerk ohne eigentliche Befehlsstruktur, auch wenn einzelne Mitglieder wegen ihrer Faehigkeiten und Erfahrung groesseren Einfluss geniessen. Zugleich sind sie alle Cyborgs, die an die Aufwertung der menschlichen Spezies glauben. Ihr einziges Ziel ist Wissen um jeden Preis, und sie sind durchaus bereit, die Erde fuer Alien-Technologie zu verraten."
  STR_CYDONIANS_SPACE_CRUSADE_DESCRIPTION: "Ein UFO ist in einem Dorf in {0} gelandet, wurde dort jedoch unerwartet von Einheimischen unter Fuehrung eines schlichten Priesters ueberwaeltigt. Was fuer eine Blamage, Kommandant - und das vor aller Oeffentlichkeit! Der Rat fragt bereits, wofuer wir ueberhaupt bezahlt werden.{NEWLINE}Das UFO bleibt verschwunden.{NEWLINE}[-200 Punkte]"
  STR_DAGONIZATION: "X-Com-Dagonisierung"
  STR_DAGONIZATION_UFOPEDIA: "Unsere Untersuchungen an Dagoniten, einschliesslich ihrer extremsten Auspraegungen, haben es uns ermoeglicht, das sogenannte Dagon-Syndrom zu isolieren und zu erforschen: eine Gruppe psychophysischer Abweichungen, die sie von gewoehnlichen Menschen unterscheiden. Der Prozess basiert auf Psi-Kraeften und ist nur unvollstaendig verstanden, doch wir koennen ihn bei jedem Menschen nachbilden. Das eroeffnet uns eine interessante neue Moeglichkeit fuer unser Personal: Mit moderner Medizin und Meditation koennen wir unsere Agenten den Kultisten Dagons aehnlicher machen. Das verbessert ihre Psi-Staerke im menschlichen Rahmen, ihre Nachtsicht und ihre natuerliche Panzerung leicht, kostet aber dauerhaft 20 Sanity.{NEWLINE}Benoetigt: Mut 40{NEWLINE}Benoetigt Krankenstation"
  STR_DAGON_ARMORED_CAR: "Panzerwagen der Kirche Dagons"
  STR_DAGON_MORPH: "Dagon-Morph"
  STR_DAGON_STAFF: "Stab Dagons"
  STR_DAGON_STAFF_UFOPEDIA: "Dieses raetselhafte Objekt ist mit uralten Runen bedeckt, die von Zauberei und Vollkommenheit kuenden. Es wandelt psionische Energie in einen maechtigen Effekt um, der Wasserpartikel in ein toedliches, zischendes chemisches Geschoss verwandelt. Es wurde berichtet, dass der Stab bei direktem Kontakt manchmal leicht vibriert, doch wir konnten solche Bewegungen nicht verlaesslich messen."
  STR_DAGON_STAFF_USE: "Stab Dagons einsetzen"
  STR_DAGON_STATUE: "Statue der Kirche Dagons"
  STR_DAGON_STATUE_UFOPEDIA: "Diese Statue besteht aus einem unirdischen Material und laesst sich nur aeusserst schwer mit Saegen, Lasern oder Schneidbrennern beschaedigen. Als wir sie schliesslich doch oeffnen konnten, fanden wir zahlreiche Texte in der Unheimlichen Sprache ueber die Kirche, ihre Operationsweise und Dagons Befehle. Diese Informationen reichen aus, um mit Hilfe nationaler Regierungen die entscheidenden Knotenpunkte des Kults ins Visier zu nehmen. Wenn Sie diese Erkenntnisse veroeffentlichen und der Kirche damit endgueltig den Boden entziehen wollen, brauchen Sie nur den Befehl zu geben."
  STR_DAGON_UFOPEDIA: "Unsere schlimmsten Vermutungen haben sich bestaetigt: Dagon ist tatsaechlich ein maechtiges uraltes Wesen, das ueber eine riesige Untersee-Festung voller unmenschlicher Intelligenzen herrscht. Zwar befindet sich dieses Wesen derzeit in einem traeumenden Zustand, einer Art psionischem Winterschlaf, doch die Augen seiner Festung ruhen bereits auf der Menschheit. Fuer diese Macht sind wir eine niedere Spezies, bestenfalls zur Ausbeutung geeignet, schlimmstenfalls zur Ausloeschung bestimmt.{NEWLINE}Die Stadt ist noch Jahrzehnte von voller Gefechtsbereitschaft entfernt, doch sie ist bereits jetzt ein Gegner, der uns aeusserst gefaehrlich werden kann. Bis dahin muessen Dagons Boten bei jeder Gelegenheit aufgehalten werden."
  STR_DAMAGED_ZOMBIE_PARASITE: "Beschaedigter Zombieparasit"
  STR_DAMAGED_ZOMBIE_PARASITE_UFOPEDIA: "Dieser Zombieparasit hat seinen Wirt ueberlebt, ist aber schwer verletzt. Er peitscht seine Fortsaetze wild umher und versucht verzweifelt, sich zu regenerieren. Es wird ihm nicht gelingen, doch wir koennen ihn in seinem halbtoten Zustand einfrieren und auf dem Graumarkt verkaufen. Vielleicht gelingt es der medizinischen Forschung irgendwann, seine regenerativen Eigenschaften zu entschluesseln, sodass aus diesem boesen Ding am Ende doch noch etwas Gutes erwachsen kann."
  STR_DARK_MAP_UFOPEDIA: "Vor einiger Zeit tauchte auf mehreren Internetseiten zur Kryptozoologie ein mysterioeses Dokument auf: eine Karte von Hoehlen, die tief unter der Erde ueber die ganze Welt verteilt liegen. Kurz darauf verschwand die Karte wieder, doch jene, die ihren Angaben folgten, behaupteten, sie sei vollkommen echt gewesen. Erstaunlicherweise waren diese Hoehlen bei keiner offiziellen Stelle verzeichnet, obwohl einige von ihnen ungewoehnlich tief und weitlaeufig sind..."
  STR_DARK_ONE_RAMPAGE: "Dark-One-Amoklauf"
  STR_DARK_ONE_RAMPAGE_BRIEFING: "Die lokalen Behoerden informierten uns ueber einen Extremisten und selbsternannten Raecher, der einen Terrorangriff begonnen hat, um die Bevoelkerung auf den laufenden Geheimkrieg sowie auf die Existenz von Aliens und anderen Schrecken aufmerksam zu machen. Die Einzelheiten sind jedoch merkwuerdig, und wir vermuten, dass der 'Extremist' etwas Unmenschliches sein koennte.{NEWLINE}Wie dem auch sei: Wir muessen ihn stellen und ausschalten, bevor er zu viele Menschen toetet. Stufen Sie ihn als extrem gefaehrlich fuer Ihre Agenten ein. Um die Mission abzubrechen, bringen Sie X-Com-Agenten zum Transportfahrzeug zurueck und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_DARK_ONE_RAMPAGE_DESCRIPTION: "Die lokalen Behoerden informierten uns ueber einen Extremisten und selbsternannten Raecher, der einen Terrorangriff begonnen hat, um die Bevoelkerung auf den laufenden Geheimkrieg sowie auf die Existenz von Aliens und anderen Schrecken aufmerksam zu machen. Die Einzelheiten sind jedoch merkwuerdig, und wir vermuten, dass der 'Extremist' etwas Unmenschliches sein koennte.{NEWLINE}Wie dem auch sei: Wir muessen ihn stellen und ausschalten, bevor er zu viele Menschen toetet. Stufen Sie ihn als extrem gefaehrlich fuer Ihre Agenten ein."
  STR_DART_RIFLE_UFOPEDIA: "Basierend auf dem derzeitige Wissen uber die Xenobiologie verschiet dieses Gewehr Pfeile mit wirksamen aber nicht todlichen biochemischen Stoffen. Mit genugend Betaubungspfeilen kann jede Lebensform, die wir auf dem Schlachtfeld begegnen, auer Gefecht gesetzt werden. Auch unter Wasser einsetzbar."
  STR_DATA_JOCKEYS: "Datenjockeys"
  STR_DATA_JOCKEYS_BRIEFING: "Eine Hackerbande betreibt in der Gegend eine grosse Dark-Web-Einrichtung. Da dort verschiedenste Daten zu Schattenorganisationen verarbeitet werden, koennen wir uns nicht auf die Polizei verlassen. Wir muessen den Serverraum uebernehmen und die Ausruestung zur Analyse sicherstellen. Einige Bandenmitglieder duerften mit Militaerwaffen ausgeruestet sein. Um die Mission abzubrechen, bringen Sie X-Com-Agenten zum Transportfahrzeug zurueck und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_DATA_JOCKEYS_DESCRIPTION: "Eine Hackerbande betreibt in der Gegend eine grosse Dark-Web-Einrichtung. Da dort verschiedenste Daten zu Schattenorganisationen verarbeitet werden, koennen wir uns nicht auf die Polizei verlassen. Wir muessen den Serverraum uebernehmen und die Ausruestung zur Analyse sicherstellen. Einige Bandenmitglieder duerften mit Militaerwaffen ausgeruestet sein."
  STR_DAVID_VINCENT_HOUSE_BRIEFING: "Wir konnten David Vincent aufspueren, einen fluechtigen Wissenschaftler, der sich vor den Ausserirdischen versteckt. Offenbar hat er etwas sehr Wichtiges ueber die Plaene der Invasoren herausgefunden und wird nun von den Men in Black verfolgt. Wir muessen ihn retten und herausfinden, was er weiss. Vorsicht: Wir erwarten Einheiten der Men in Black in der Naehe. Ein Rueckzug aus dieser Mission ist nicht moeglich."
  STR_DAVID_VINCENT_HOUSE_DESCRIPTION: "Wir konnten David Vincent aufspueren, einen fluechtigen Wissenschaftler, der sich als Jeremiah Smith vor den Ausserirdischen versteckt. Offenbar hat er etwas sehr Wichtiges ueber die Plaene der Invasoren herausgefunden und wird nun von den Men in Black verfolgt. Wir muessen ihn retten und herausfinden, was er weiss. Bedenken Sie: Wir haben nur einen Versuch. Ein Rueckzug aus dieser Mission ist nicht moeglich."
  STR_DEAD_CATTLE_BRIEFING: "Mehrere Kuehe wurden von Unbekannten in einer Weise verstuemmelt, die oft Ausserirdischen zugeschrieben wird. Wir sollten die Anwohner verhaften und befragen, vor allem, wenn sie feindselig sind. Wenn es unmoeglich ist, sie lebend zu fassen, tun Sie, was Sie tun muessen. Sie haben nur 10 Runden bevor der Feind eintrifft. Wenn Sie nicht schnell genug sind, bereiten Sie sich auf das Schlimmste vor! Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_DEALS: "Abmachungen"
  STR_DEEP_ONE: "Deep One"
  STR_DEEP_ONES_RITUALS: "Rituale der Deep Ones"
  STR_DEEP_ONES_RITUALS_BRIEFING: "Deep Ones haben einen Urlaubsort angegriffen und viele Geiseln genommen. Offenbar wollen sie diese ihren abscheulichen Goettern opfern. Wir muessen sie aufhalten und unschuldige Leben retten. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_DEEP_ONES_RITUALS_DESCRIPTION: "Deep Ones haben einen Urlaubsort angegriffen und viele Geiseln genommen. Wir muessen sie aufhalten und unschuldige Leben retten.{NEWLINE}Rechnen Sie mit vielen Deep Ones in offenem Gelaende."
  STR_DEEP_ONE_ARMOR: "Kampfanalyse: Deep One"
  STR_DEEP_ONE_AUTOPSY: "Autopsie: Deep One"
  STR_DEEP_ONE_AUTOPSY_UFOPEDIA: "Genetische Analysen legen nahe, dass diese Kreatur mit gewoehnlichen irdischen Lebensformen verwandt ist - allerdings mit sehr alten aus der Kreidezeit. Davon abgesehen handelt es sich um einen vergleichsweise normalen Humanoiden, sofern man das ueberhaupt so nennen kann, mit all den natuerlichen Organen, die man bei einem Tiefenbewohner erwarten wuerde, der zudem Luft atmen kann. In seinem Schaedel steckt ein kleines elektronisches Geraet."
  STR_DEEP_ONE_CHIEFTAIN: "Deep-One-Haeuptling"
  STR_DEEP_ONE_COMMUNITIES: "Deep-One-Gemeinschaften"
  STR_DEEP_ONE_COMMUNITIES_UFOPEDIA: "Deep Ones leben in kleinen nomadischen Gemeinschaften auf dem Kontinentalschelf, jagen Fische und trainieren sich selbst unter der Aufsicht einer - mangels besseren Wortes - Priesterschaft zu Kriegern. Kurz gesagt: Sie sind intelligent, aber sehr primitiv.{NEWLINE}Unsere Gefangenen konnten nicht erklaeren, woher ihre ungewoehnlich fortschrittliche Ausruestung stammt, nur dass sie von geheimnisvollen 'Herren' geschenkt wurde. Offenbar zeigt uns jede neue Entdeckung bloss, dass hinter jedem Mann noch ein anderer Mann steht. Nicht wahr, Kommandant?"
  STR_DEEP_ONE_COMM_DEVICE: "Kommunikationsgeraet der Deep Ones"
  STR_DEEP_ONE_CORPSE: "Leiche eines Deep One"
  STR_DEEP_ONE_OUTPOST: "Deep-One-Aussenposten"
  STR_DEEP_ONE_OUTPOST_UFOPEDIA: "Deep Ones sind ein nomadisches Volk ohne feste Siedlungen - sie treiben lieber frei umher und fuehren ihren Besitz mit sich. Da sie auf Nachschub durch ihre geheimnisvollen 'Goetter' angewiesen sind, halten sie sich im Allgemeinen in der Naehe unbemannter Unterwasser-Kommunikationsaussenposten auf. Wenn wir einen solchen Aussenposten finden, sollten wir ihn ueberwachen und alle Deep-One-Gruppen abfangen, die sich ihm naehern."
  STR_DEEP_ONE_SOLDIER: "Deep-One-Diener"
  STR_DEEP_ONE_UFOPEDIA: "Diese fast menschlich wirkende Kreatur ist offenbar ein reptiloider Humanoid, der dem Menschen erstaunlich nahe verwandt ist. Deep Ones sind staerker und robuster als Menschen. Es handelt sich um eine voll ausgepraegte Spezies mit maennlichen und weiblichen Exemplaren unterschiedlichen Alters. Sie sind eindeutig intelligent und koennen sich verstaendigen, auch wenn ihre Denkweise recht schlicht bleibt. Sie bezeichnen sich selbst als 'Bauern' oder 'Diener', waehrend die Natur ihrer Herren denkbar vage bleibt. Als Wesen, die sowohl in der Tiefsee als auch an der Oberflaeche ueberleben koennen, sind sie widerstandsfaehig gegen Explosionen und andere druckbasierte Schadensarten."
  STR_DEEP_ONE_VILLAGE: "Deep-One-Dorf"
  STR_DEEP_ONE_VILLAGE_RAID: "Ueberfall auf das Deep-One-Dorf"
  STR_DEEP_ONE_VILLAGE_RAID_BRIEFING: "Wir haben eine Kommunikationsplattform lokalisiert, die einer kleinen Gruppe von Deep Ones als Sammelpunkt dient. Das ist eine gute Gelegenheit, einige von ihnen lebend zu fassen oder zumindest einige Artefakte zu sichern. Menschen sehen und bewegen sich unter Wasser nur eingeschraenkt, also seien Sie vorsichtig. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zur Tauchkapsel zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'. Viel Glueck!"
  STR_DEEP_ONE_VILLAGE_RAID_COMPLETED: "Ueberfall auf das Deep-One-Dorf abgeschlossen."
  STR_DEEP_ONE_VILLAGE_RAID_DESCRIPTION: "Wir haben eine Kommunikationsplattform lokalisiert, die einer kleinen Gruppe von Deep Ones als Sammelpunkt dient. Das ist eine gute Gelegenheit, einige von ihnen lebend zu fassen oder zumindest einige Artefakte zu sichern. Menschen sehen und bewegen sich unter Wasser nur eingeschraenkt, also seien Sie vorsichtig.{NEWLINE}Nur unterwasserfaehige Ausruestung erlaubt!"
  STR_DEEP_SEA_OPERATIONS_UFOPEDIA: "Nun gut, da Sie nicht locker lassen, Kommandant, habe ich einige unserer Kontakte im Rat aktiviert. Mit ihrer Hilfe haben wir eine neue Firma gegruendet: Hydrospace Dynamics. Dieses Unternehmen uebernimmt fuer uns den Bau saemtlicher Tiefsee-U-Boote und Ausruestungsstuecke, fuer die uns selbst die Kapazitaeten fehlen - und das erste Projekt ist bereits abgeschlossen. Das neue Tauchboot, die Barracuda, wurde auf Grundlage unseres Wissens ueber USO-Konstruktion und Schallwaffen entwickelt. Damit koennen wir endlich die schwer fassbaren Versorgungskreuzer von T'leth abfangen und zur Landung zwingen. Diese Schiffe waren fuer uns schon frueher ortbar, doch sie waren zu schnell, zu tief und zu gut bewaffnet, um sie jemals zu erreichen."
  STR_DEN_OF_VILLAINY_BRIEFING: "Eine gute Gelegenheit, ein paar organisierte Kriminelle zu verhaften und vielleicht Wertmittel zu beschlagnahmen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_DEPTHPOCALYPSE_BRIEFING: "Eine Horde schwergepanzerter Tiefenbewohner nahert sich einem bevolkerten Gebiet, begleitet von fliegenden Vernichtungswaffen. Ihr Ziel scheint die Sammlung lebender menschlicher Gefangener und toten menschlichen Gewebes fur unbekannte Zwecke zu sein. Tun Sie, was Sie konnen, um Zivilisten und Polizisten zu beschutzen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_DESTROY_BLACK_LOTUS: "Black Lotus zerschlagen!"
  STR_DESTROY_BLACK_LOTUS_STR_OSIRON_CONTACTS_WITCHES: "ALIENAUGEN WERDEN DEINE SEELE FRESSEN"
  STR_DESTROY_BLACK_LOTUS_UFOPEDIA: "Wir haben unseren Psi-Detektor auf Grundlage des Black-Lotus-Psi-Generators fertiggestellt. Jetzt kann sich die Organisation nicht mehr vor uns verstecken. Tatsaechlich konnten wir schon wenige Stunden nach der Aktivierung mehrere ihrer Fuehrer lokalisieren und Sturmteams zu ihren Verstecken schicken. Black Lotus ist damit praktisch am Ende; die verbliebenen Kraefte sind verstreut und orientierungslos. Sobald wir sicher wissen, dass keine dauerhaften Basen mehr bestehen, koennen wir die Gruppe endgueltig von unserer Agenda streichen.{NEWLINE}Weitere Psi-Generatoren brauchen wir nicht. Fuer uns sind sie inzwischen wertlos. Ich schlage vor, wir verkaufen sie einfach."
  STR_DESTROY_CHURCH_OF_DAGON: "Zerschlage die Kirche Dagons!"
  STR_DESTROY_CHURCH_OF_DAGON_UFOPEDIA: "Es ist vollbracht, Kommandant: Die Kirche Dagons ist geschlagen. Sie existiert zwar noch, wurde aber weitgehend in den Untergrund gedrueckt. Sobald wir die verbleibenden Stellungen des Kults ausgeschaltet haben, werden wir vermutlich nie wieder von ihnen hoeren. Ich kann nicht behaupten, dass ich sie vermissen werde.{NEWLINE}Falls noch Dagon-Statuen in unseren Lagern herumstehen, schlage ich vor, sie zu entsorgen. Diese Dinger sind wirklich unheimlich."
  STR_DESTROY_EXALT: "EXALT zerschlagen!"
  STR_DESTROY_EXALT_UFOPEDIA: "Unsere Operation war ein voller Erfolg. Mit den richtigen Einstellungen ist es uns gelungen, Psiclone-Suechtige noch staerker an unsere eigene Variante zu binden, sodass sie unser Zeug bevorzugen und die Befehle der Ausserirdischen verweigern. Das mag moralisch zweifelhaft sein, aber es hat eine grosse Gefahr fuer die Menschheit eingedaemmt. Die Meister von EXALT stehen nun weitgehend allein da, abgesehen von ihren treuesten Dienern, und sollten uns keine ernsthaften Schwierigkeiten mehr bereiten.{NEWLINE}Natuerlich sind damit nicht schlagartig alle EXALT-Mitglieder von der Strasse verschwunden. Wir muessen weiterhin mit einigen Restbasen rechnen, von denen manche aus Verwirrung oder blinder Loyalitaet noch immer versuchen werden, ihre Agenda voranzutreiben. Sie auszuloeschen sollte jedoch nicht allzu schwer werden, und von diesem Schlag werden sie sich nicht mehr erholen.{NEWLINE}Da wir mit EXALT im Wesentlichen fertig sind, sollten wir nun die naechste Ebene in Angriff nehmen: die Hybriden."
  STR_DESTROY_TASOTH: "Tasoth-Fabrik zerstoeren"
  STR_DESTROY_TASOTH_UFOPEDIA: "Kommandant! Es ist uns gelungen, die viraelen Daten in die Tasoth-Fabrik einzuspeisen und ihre ... ausgesprochen gewaltsame Abschaltung auszuloesen. Sie haetten das Feuerwerk sehen sollen!{NEWLINE}Wir haben den Untersee-Aliens von T'leth einen schweren Schlag versetzt. Nach der Zerstoerung der Tasoth-Fabrik zogen sie sich offenbar in die Tiefe zurueck und stellten saemtliche Aktivitaeten an der Oberflaeche ein. Es sieht so aus, als wuerden wir sie vorerst nicht wiedersehen. Ich zweifle nicht daran, dass sie eines Tages zurueckkehren - aber vielleicht duerfen sich dann unsere Enkel darum kuemmern. Heute wird gefeiert!"
  STR_DESTROY_ZSRR: "Beende die Morgenroete!"
  STR_DESTROY_ZSRR_UFOPEDIA: "Alles erledigt, Kommandant - wir haben die Vereinten Nationen und den russischen Präsidenten informiert, über die ganze Morgenroete-Agenda und alle dazugehörigen Einzelheiten. Das wird ausreichen, um alle ihre kommandierenden Offiziere für eine lange Zeit in den Knast zu bringen, oder Schlimmeres. Ich wünschte wir könnten ihren Gesichtsausdruck sehen!{NEWLINE}Trotzdem müssen wir ein Auge für Splittergruppen aufhalten, die noch immer in isolierten Stützpunkten operieren könnten. Sie zu zerstören wird der letzte Sargnagel des Morgenroete sein.{NEWLINE}Jetzt können wir uns auf die wichtigen Dinge konzentrieren! Und wir können alle Morgenroete-Speicherkarten, die wir noch haben, verkaufen, wir werden sie nicht mehr brauchen."
  STR_DIMENSION_X_ACTIVITIES: "Aktivitaeten in Dimension X"
  STR_DIMENSION_X_ACTIVITIES_UFOPEDIA: "Auf Basis fragmentarischen Wissens, das wir aus der Analyse der Vorstoesse von Brainsucked-Technomads gewonnen haben, sind wir zu dem Schluss gekommen, dass ihre neuen Herren - die 'X-Aliens' - vor allem daran interessiert sind, Organismen der Erde durch Dimensionstore in ihre Welt zu transportieren. Anfangs vermuteten wir wissenschaftliche Motive, etwa das Sammeln und Analysieren von Biosphaerenproben. Inzwischen erscheint das unwahrscheinlich: Die Brainsucked scheinen vor allem auf rohe Biomasse aus zu sein, ohne grosses Interesse daran, was genau geerntet wird - auch wenn Tiere begehrter zu sein scheinen als Pflanzen. Das koennte darauf hindeuten, dass die Eindringlinge uns lediglich als Naehrstoffquelle fuer ihre zweifellos organische Technologie betrachten und vielleicht auch fuer sich selbst - falls sie ueberhaupt von dieser Technologie getrennte Wesen sind.{NEWLINE}Diese Hypothese steht allerdings in Spannung zu unserem Eindruck von ihrer technologischen Entwicklung. Warum sollte eine hochwissenschaftliche Zivilisation so stark auf eine palaeolithische Wirtschaftsweise setzen? Haben sie nie die Stufe von Jaegern und Sammlern ueberwunden? Oder zwingt sie schiere Not zu diesen Nahrungszuegen? Oder ist all das fuer sie voellig normal und wir mit unserem Produktionsmodell die eigentliche Anomalie? Selbst der Rat tappt hier im Dunkeln, also muessen wir diesen raetselhaften Gegner weiter studieren."
  STR_DIMENSION_X_BASE_DEFENSE_ARMY_BRIEFING: "Unser Auenposten in der Dimension X wird von Eingeborenen angegriffen. Der wissenschaftliche Stab wurde zu einem sichereren Gebiet evakuiert. Wenn wir die Einrichtung nicht verteidigen, muss der Stutzpunkt neu gebaut werden, was sich schlecht auf unsere Reputation auswirkt. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_DIMENSION_X_BASE_DEFENSE_FAUNA_BRIEFING: "Unser Auenposten in der Dimension X wird von ortlichen Wildtieren angegriffen. Der wissenschaftliche Stab wurde zu einem sichereren Gebiet evakuiert. Wenn wir die Einrichtung nicht verteidigen, muss der Stutzpunkt neu gebaut werden, was sich schlecht auf unsere Reputation auswirkt. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_DIMENSION_X_DESERT_BRIEFING: "Nachem Sie den Weg an die Oberflache gefunden haben, Sehen Sie ein eigenartiges, fremd-wirkendes Odland, so weit das Auge sieht. Dieser Ort scheint geeignet fur einen zeitweiligen Auenposten unserer Forschungsgruppe, aber zuerst mussen Sie es sichern und von feindlichen Lebensformen befreien. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_DIMENSION_X_PARTY_BRIEFING: "Ein Bericht ging ein uber etwas, was ein kleiner Jagdtrupp aus Auerirdischen zu sein scheint. Wir mussen diese eigenartigen Besucher untersuchen und festsetzen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_DIMENSION_X_PLANETOLOGY: "Dimension X: Planetologischer Bericht"
  STR_DIMENSION_X_PLANETOLOGY_UFOPEDIA: "Der Planet ist bestaetigt ungefaehr 35 Milliarden Jahre alt. Eine volle Rotation dauert 139 Stunden, doch das lokale Jahr umfasst nur 42 Erdtage. Erste Ausgrabungen deuten auf eine lange Geschichte organischen Lebens hin, doch derzeit ist Dimension X wegen erhoehter Strahlungswerte des sterbenden Sterns weitgehend steril. Die Atmosphaere besteht ueberwiegend aus Stickstoff und Sauerstoff, enthaelt aber hohe Anteile an Kohlendioxid und komplexen Gasen unbekannten Ursprungs. Es gibt wenig fliessendes Wasser und praktisch keine Ozonschicht, dennoch gedeihen viele Lebensformen auf dieser seltsamen Welt. Ihre Biochemie ist kohlenstoffbasiert, ansonsten aber extrem fremdartig und nur mit groben Analogien zu bekanntem Leben beschreibbar."
  STR_DIMENSION_X_REPORT_INCOMING: "Kommandant, wir haben eine Nachricht von unserem extraplanaren Stuetzpunkt in Dimension X erhalten..."
  STR_DIMENSION_X_WRECK_BRIEFING: "Sie stehen kurz davor, die Absturzstelle eines alten Sternenschiffs aus unserer eigenen Dimension zu betreten, das vor langer Zeit in Dimension X abgestuerzt ist. Wir glauben, dass es lebenswichtige Informationen ueber die Aliens enthalten koennte. Raeumen Sie alle Gefahren aus dem Weg, damit unsere Techniker das Wrack untersuchen koennen. Um die Mission abzubrechen, fuehren Sie die X-Com-Kraefte in den Ausgangsbereich und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_DIMENSION_X_XENOBIOLOGY: "Dimension X: Xenobiologischer Bericht"
  STR_DIMENSION_X_XENOBIOLOGY_UFOPEDIA: "Schon nach den ersten Proben fiel uns auf, wie eng verschiedene Pflanzen miteinander verwandt sind; es wirkt fast, als bestuende die gesamte lokale Biozoenose nur aus einer einzigen Pflanzenfamilie, wenn auch einer sehr vielfaeltigen. Dasselbe gilt fuer die Fauna, die ebenfalls viele 'Gene' - oder genauer Gen-Analoga - mit der Flora teilt. Zudem beobachteten wir Verhaltensweisen, die der betreffenden Art selbst kaum nuetzen, dafuer aber streng einem anderen Organismus dienen, was auf ein dichtes Netz gegenseitiger Abhaengigkeiten hinweist.{NEWLINE}Wir vermuten daher, dass das gesamte planetare Oekosystem kuenstlich ist; entweder gezielt fuer die harschen Bedingungen von Dimension X entworfen oder zumindest stark durch eine intelligente Instanz gelenkt. Eine andere Hypothese besagt, dass der Planet vor nicht allzu langer Zeit ein beinahe ausloeschendes Ereignis durchlaufen hat, bei dem nur wenige Gattungen ueberlebten und sich danach unter evolutivem Druck in viele Formen aufspalteten. Wie auch immer: Dieses Oekosystem duerfte nicht mehr lange ueberleben, denn der langsam sterbende Stern wird die Lebensbedingungen stetig verschlechtern."
  STR_DIRE_SOLUTIONS_DESCRIPTION: "Unsere finanzielle Lage ist so unerquicklich geworden, dass die Chefbuchhalterin einige 'entbehrliche' Moebel auf dem Graumarkt verkauft hat. Leider gehoerte dazu auch Ihr Lieblingssessel, der nun durch einen gewoehnlichen Drehstuhl ersetzt wurde. Das Geldproblem bleibt also - und Rueckenschmerzen gibt es gratis dazu.{NEWLINE}[25 000$]"
  STR_DISCIPLE_OF_DAGON: "Juenger Dagons"
  STR_DISCIPLE_OF_DAGON_ARMOR: "Kampfanalyse: Juenger Dagons"
  STR_DISCIPLE_OF_DAGON_UFOPEDIA: "Diese niederrangigen Kultisten behaupten, einer uebernatuerlichen Entitaet namens Dagon zu dienen, die mit den Tiefen des Meeres verbunden ist. Sie scheinen an einem gemeinsamen Syndrom zu leiden, das ihre Haut graeulich und feucht erscheinen laesst und zugleich Entwicklungsanomalien verursacht. Dieses Syndrom schwaecht ihre geistigen Faehigkeiten, macht sie aber widerstandsfaehiger gegen Schmerz und Schock und verbessert ihre Sicht bei schlechtem Licht. Ihre fanatische Hingabe macht sie im Kampf beinahe furchtlos."
  STR_DOSSIER_ABLE_STANDARD_UFOPEDIA: ">ROLLE: Robotikingenieur{NEWLINE}>ZUGEHOERIGKEIT: Freier Berater{NEWLINE}>DETAILS: Eine anerkannte Autoritaet auf dem Gebiet der Robotik. Dr. Standard verdiente ein Vermoegen als Berater fuer industrielle und militaerische Auftraggeber in aller Welt. Nach seiner Rueckkehr von einer IEEE-Konferenz zog er sich in das Labor seines Anwesens zurueck und murmelte nur noch ueber Optronik, Fusionsbatterien und KI-gesteuerte autonome Kampfanzuege.{NEWLINE}>STATUS: Unter psychologischer Beobachtung"
  STR_DOSSIER_AGENT_TRAUMA_UFOPEDIA: ">ROLLE: Spionin{NEWLINE}>ZUGEHOERIGKEIT: Men in Black{NEWLINE}>DETAILS: Agent Trauma gilt als Vorzeigeagentin der Men in Black, fast als ihr perfektes Ideal. Als maechtige Psionikerin kann sie vermutlich mit Leichtigkeit Gedanken lesen und mehrere Menschen gleichzeitig kontrollieren. Geruechten zufolge stehen bereits mehrere Regierungen unter ihrem unmittelbaren Einfluss.{NEWLINE}>STATUS: Interpol eingeschaltet."
  STR_DOSSIER_AGENT_WILHEARD_UFOPEDIA: ">ROLLE: Vollstrecker{NEWLINE}>ORGANISATION: Men in Black{NEWLINE}>DETAILS: Ein schwer fassbarer Agent, der in Projekte auf der ganzen Welt verwickelt zu sein scheint, doch nur sehr wenige Hinweise liessen sich bestaetigen. Er scheint weder Wohnort noch Lebensgeschichte, Familie oder selbst Spesenabrechnungen zu haben. Manche Quellen halten ihn fuer einen Geist, ein Relikt aus ferner Vergangenheit oder eine Einbildung all jener Dienste, die nach ihm suchen. Der Tod und die Taeuschungen, die er hinterlaesst, sind jedoch sehr real. Offenbar spezialisiert er sich auf psionische Technologie.{NEWLINE}>STATUS: Unbestaetigt"
  STR_DOSSIER_ANATOLY_AVDEYEV: "Dossier: Anatoly Avdeyev"
  STR_DOSSIER_ANATOLY_AVDEYEV_UFOPEDIA: ">ROLLE: Militaeringenieur{NEWLINE}>ZUGEHOERIGKEIT: Morgenroete{NEWLINE}>DETAILS: Ein Veteran der Morgenroete und ehemaliges Mitglied der GRU-Spetsnaz. Obwohl sein formeller Rang niedrig ist, verfuegt er ueber persoenliche Verbindungen zur Verhushka, also zu jener Gruppe, die die Organisation fuehrt, und geniesst unter den Soldaten der Morgenroete grosses Ansehen.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_ARASTOO_NAMDAR_UFOPEDIA: ">ROLLE: Ehemaliger Regierungsagent{NEWLINE}>ZUGEHOERIGKEIT: Unbekannt{NEWLINE}>DETAILS: Namdar war in den letzten Jahren der Pahlavi-Dynastie ein bekannter Agent des Schahs von Iran. Waehrend seine fruehe Laufbahn weitgehend unspektakulaer wirkt, zeigen geheime Akten, dass er 1978 ausgesandt wurde, um Berichte ueber seltsame Humanoide in der Dasht-e Kavir, der Grossen Salzwueste, zu untersuchen. Die Ergebnisse dieser Operation sind jedoch nie aufgetaucht.{NEWLINE}>STATUS: Vermisst{NEWLINE}>NOTIZ: Namdars letzter bekannter Aufenthaltsort war Westchina, wohin er nach der iranischen Revolution floh."
  STR_DOSSIER_BABA_DONKA_UFOPEDIA: ">ROLLE: Blinde Mystikerin, Hellseherin, Kraeuterkundige{NEWLINE}>ZUGEHOERIGKEIT: Morgenroete{NEWLINE}>DETAILS: Baba Donka sagte den Zerfall des Sowjetblocks, die Katastrophe von Tschernobyl, Stalins Tod und andere bedeutende Ereignisse voraus. Sie wurde haeufig von sowjetischen und anderen osteuropaeischen Fuehrern aufgesucht, darunter Breschnew und Jelzin. Sie behauptete, mit den Toten zu sprechen: {ALT}Ich bin fuer sie - TORE IN DIESE WELT{ALT}. Ihr juengster Tod ist verdaechtig.{NEWLINE}>STATUS: Verstorben?"
  STR_DOSSIER_CARLOS_TANAKA_UFOPEDIA: ">ROLLE: Waffenhaendler{NEWLINE}>ZUGEHOERIGKEIT: Osiron{NEWLINE}>DETAILS: Einst war dieser peruanisch-japanische Professor fuer Geschichte ein weltbekannter Experte fuer historische Feuerwaffen. Dann verschwand er ploetzlich aus der Oeffentlichkeit. Heute ist er eine der wichtigsten Figuren in internationalen Waffenschmuggelnetzwerken und beliefert kriminelle Gruppen sowie autoritaere Regierungen mit verdaechtig fortschrittlicher Bewaffnung.{NEWLINE}>STATUS: Interpol informiert"
  STR_DOSSIER_DAVID_VINCENT_UFOPEDIA: ">ROLLE: Ermittler{NEWLINE}>ZUGEHOERIGKEIT: Unabhaengig{NEWLINE}>DETAILS: In den 60er-Jahren sah Vincent nahe Los Angeles ein UFO landen. Der Schock trieb ihn in einen persoenlichen Kreuzzug, um die Praesenz Ausserirdischer auf der Erde nachzuweisen. Seine Hartnaeckigkeit war so gross, dass die Aliens aktiv gegen ihn vorgingen, ihn als sowjetischen Spion brandmarkten und die CIA auf ihn ansetzten. Ausserdem sollen alle Beweise, die er fand, von einem seltsamen roten Licht verdampft worden sein. Dadurch konnte Vincent die Wahrheit nie offenlegen, doch es gelang ihm, spurlos zu verschwinden. Inzwischen haben wir jedoch einen Mann gefunden, der auffaellig gut zu seinem Profil passt: Jeremiah Smith.{NEWLINE}>STATUS: Fluechtig"
  STR_DOSSIER_DR_ALPHA_UFOPEDIA: ">ROLLE: Kryptozoologe{NEWLINE}>ZUGEHOERIGKEIT: Das Syndikat{NEWLINE}>DETAILS: Dr. Alpha arbeitete fuer das Syndikat als Spezialist fuer Exobiologie. Er war schon immer ein Einzelgaenger, der die Gesellschaft von Tieren - so bizarr oder gefaehrlich sie auch sein mochten - der von Menschen vorzog, und er konnte sie mit seinen aussergewoehnlichen Faehigkeiten leicht besaenftigen. Schliesslich kam er zu dem Schluss, dass ihm seine Forschungsobjekte wichtiger seien als seine Karriere, stahl mehrere Exemplare und verschwand spurlos. Einige seiner ehemaligen Kollegen befuerchten, dass er daraus eine monstroese Legion heranzuechten koennte, die er auf die Menschheit loslaesst, von der er so enttaeuscht ist.{NEWLINE}>STATUS: Vermisst"
  STR_DOSSIER_DR_HADRIEX_UFOPEDIA: ">ROLLE: Paranormaler Journalist{NEWLINE}>ZUGEHORIGKEIT: Kinder des Ather{NEWLINE}>DETAILS: Dr. Hadriex (kein echter Wissenschaftler) war ein Amateur-Filmemacher, der irgendwie einen Job bei einer dieser 'Geisterjagd'-Fernsehserien erhielt. Einige Folgen wurden ohne Probleme ausgestrahlt, aber dann suchten sie ein verlassenes Haus auf, um eine Reihe angeblich verfluchter Gegenstande zweifelhafter Herkunft zu untersuchen. Licht und Kameras fielen plotzlich aus, und die gesamte Crew verschwand. Seitdem gab es eine Spur von Geistererscheinungen, auf einem Pfad von diesem Gebiet hin zum Meer...{NEWLINE}>STATUS: Vermisst"
  STR_DOSSIER_ELIAS_SEPPA: "Dossier: Elias Seppa"
  STR_DOSSIER_ELIAS_SEPPA_UFOPEDIA: ">ROLLE: Ernaehrungsberater{NEWLINE}>ZUGEHOERIGKEIT: EXALT{NEWLINE}>DETAILS: Ein ehemaliger finnischer Strongman-Champion und Experte fuer Ernaehrung. Er zog in die USA, um dort fuer eine Firma fuer Nahrungsergaenzungsmittel zu arbeiten, die mutmasslich Kontakte zu EXALT unterhaelt. Als eine Polizeieinheit seine Bueros durchsuchen wollte, toetete er 12 Beamte mit blossen Haenden und entkam mit einem Aktenkoffer voller Dokumente. Er ist extrem schnell, stark und gefaehrlich.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_GERTRUDE_ELLISON_UFOPEDIA: ">ROLLE: Menschenhandler {NEWLINE}>ZUGEHORIGKEIT: Hybridennetzwerk {NEWLINE}>DETAILS: Eine berufliche Philantropin, verknupft mit dem Verschwinden zahlreicher misshandelter Frauen, Waisen, und Obdachloser. UFO-Sichtungen konnten mit diesen Falen in Verbindung gebracht werden; es gibt Geruchte, dass sie ungluckselige, entbehrliche Menschen als Tauschobjekt fur ewige Jugend einsetzt, was ihr erlaubt, noch mit uber 80 jugendlich auszusehen.{NEWLINE}>STATUS: Interpol eingeschalten"
  STR_DOSSIER_GRISHKA_BULLET_YASHIN: "Dossier: Grishka 'Bullet' Yashin"
  STR_DOSSIER_GRISHKA_BULLET_YASHIN_UFOPEDIA: ">ROLLE: Soeldner{NEWLINE}>ZUGEHOERIGKEIT: Unbekannt{NEWLINE}>DETAILS: 'Um eine Kugel zu verstehen, musst du selbst zur Kugel werden.'{NEWLINE}Yashin ist ein ehemaliger sibirischer Schamane, der sich internationalen Soeldnern im Rahmen einer Art religioeser Pilgerreise anschloss. In vielen Kriegsgebieten ist er sowohl fuer seine Beherrschung schwerer Maschinengewehre als auch fuer seine seltsame Faehigkeit bekannt, Kugeln zu 'segnen'. Die Zahl extrem gluecklicher Treffer mit von ihm 'gesegneter' Munition laesst uns vermuten, dass wir es tatsaechlich mit einer gefaehrlichen paranormalen Begabung zu tun haben.{NEWLINE}>STATUS: Rat verstaendigt"
  STR_DOSSIER_HARLEY_STONE_UFOPEDIA: ">ROLLE: Ermittler{NEWLINE}>ZUGEHOERIGKEIT: Unabhaengig{NEWLINE}>DETAILS: Ein Detective der London Metropolitan Police, der laut Informanten von 'Angst, Kaffee und Schokolade' lebt. Er wird haeufig mit brutalen Mordserien in Verbindung gebracht, doch beweisen liess sich das nie - auffaellig ist allerdings, dass diese Blutbaeder meist kurz nach Beginn seiner Ermittlungen enden.{NEWLINE}>STATUS: Unter Beobachtung"
  STR_DOSSIER_HENRY_GARRISON_UFOPEDIA: ">ROLLE: Wissenschaftler{NEWLINE}>ZUGEHOERIGKEIT: Keine{NEWLINE}>DETAILS: Ein Mann aus dem amerikanischen Sueden, der fuer Experimente an Zombies bekannt war. Er war an Entfuehrungen und der Zombifizierung von Menschen beteiligt, um sich einen Bestand an Testsubjekten zu sichern. Bei seiner Festnahme kam es im Labor zu einem gewaltsamen Zwischenfall, bei dem er selbst und fuenf Agenten des Rates in einer gewaltigen Explosion starben. Zeugenaussagen bestaetigen, dass die Zombies Henry nicht angriffen und ihm sogar zu gehorchen schienen. Sein Tagebuch spricht von einer revolutionaeren Methode zur Kontrolle solcher Wesen, aber die Einzelheiten lesen sich wie reines Kauderwelsch.{NEWLINE}>STATUS: Vermutlich tot"
  STR_DOSSIER_IVAN_PRYPET: "Dossier: Ivan Prypet"
  STR_DOSSIER_IVAN_PRYPET_UFOPEDIA: ">ROLLE: Forschungsingenieur{NEWLINE}>ZUGEHOERIGKEIT: Morgenroete{NEWLINE}>DETAILS: Als ehemaliges Mitglied der Aufsichtseinheit von Tschernobyl wurde Prypet - damals unter anderem Namen - wegen zahlreicher Vergehen rund um Sicherheitsverstoesse und Diebstahl verurteilt. Noch vor dem Haftantritt verschwand er, und inzwischen sieht es so aus, als habe er seit den Anfaengen fuer die Morgenroete gearbeitet. Er ist ein Meisterschuetze, ausgebildeter Nuklearingenieur und bekannt dafuer, stets metallische Gegenstaende bei sich zu tragen.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_IVAN_VASLOV: "Dossier: Ivan Vaslov"
  STR_DOSSIER_IVAN_VASLOV_UFOPEDIA: ">ROLLE: Spion{NEWLINE}>ZUGEHOERIGKEIT: EXALT{NEWLINE}>DETAILS: Ehemaliger ostdeutscher KGB-Mann mit heutigen Verbindungen zu SVR und GRU. Ivan ist Spezialist fuer Informationsbeschaffung - sowohl aus Menschen als auch aus elektronischen Systemen. Zu seinen bekannten Aliasen gehoeren 'Gregor Selvig', 'Willhelm Vanger' und 'Magnus Engstrom'.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_JIN_CHUN_MAE_UFOPEDIA: ">ROLLE: Repraesentantin{NEWLINE}>ZUGEHOERIGKEIT: Black Lotus{NEWLINE}>DETAILS: Ein aufstrebender Theater- und Filmstar aus Suedkorea, der ploetzlich spurlos verschwand. Spaeter wurde sie als prominentes Mitglied von Black Lotus identifiziert, verantwortlich fuer Verhandlungen und Rekrutierung innerhalb der asiatischen Eliten.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_KAO_TONG_UFOPEDIA: ">ROLLE: Ausbilder{NEWLINE}>ZUGEHOERIGKEIT: Black Lotus{NEWLINE}>DETAILS: Ein aussergewoehnlich grausamer Mann und Experte fuer Kampfkuenste wie auch Psychospiele. Er geniesst es, seine Schueler waehrend der Ausbildung zu brechen und ihnen einzutrichtern, dass nur Leistung zaehlt. Die meisten Teilnehmer seiner Kurse enden entweder als fanatisch gehorsame Juenger ihres Lehrers oder als psychisch Geschaedigte - mit PTBS als Folge seiner Gewalt, seiner Manipulationen und der krankhaften Fixierung der Kurse auf ihn. Seine Absolventen sind ihm und damit indirekt Black Lotus makellos ergeben.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_KIM_HARWELL_UFOPEDIA: ">ROLLE: Journalistin{NEWLINE}>ZUGEHOERIGKEIT: World Paranormal News Journal{NEWLINE}>DETAILS: Harwell ist eine bekannte Stimme der paranormalen Randmedien, die Berichte ueber uebernatuerliche Vorgaenge untersucht. Sie hat weltweit ausfuehrlich Spuren von Zombiesichtungen verfolgt. Juengste Meldungen deuten darauf hin, dass auch andere Kraefte auf sie aufmerksam geworden sind und sie moeglicherweise beobachten.{NEWLINE}>STATUS: Unter Beobachtung"
  STR_DOSSIER_LEONARD_PAXTON: "Dossier: Leonard Paxton"
  STR_DOSSIER_LEONARD_PAXTON_UFOPEDIA: ">ROLLE: Fuehrungskraft{NEWLINE}>ZUGEHOERIGKEIT: EXALT{NEWLINE}>DETAILS: In die texanische Oberschicht der Oelmagnaten hineingeboren, ist Paxton ausserordentlich einflussreich und verfuegt ueber zahllose Verbindungen zum Kongress und vielleicht sogar bis zum US-Praesidenten. Innerhalb der Organisation wird er zugleich verehrt und gefuerchtet.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_LO_WO: "Dossier: Lo Wo"
  STR_DOSSIER_LO_WO_UFOPEDIA: ">ROLLE: Assassine{NEWLINE}>ZUGEHOERIGKEIT: Black Lotus{NEWLINE}>DETAILS: Ein sehr gebrechlich wirkender alter Mann, dem niemand zutrauen wuerde, unbewaffnet und fast muhelos Menschen in der Bluete ihres Lebens zu toeten, die dreimal so schwer sind wie er. Er gehoert zu den besten Assassinen und Ausbildern von Black Lotus. Sein Alter und sein freundliches Auftreten machen es ihm leicht, unter nahezu allen Umstaenden Verbuendete zu finden.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_LYDIA_LUX_UFOPEDIA: ">ROLLE: Terroristin{NEWLINE}>ZUGEHOERIGKEIT: EXALT{NEWLINE}>DETAILS: Als Darstellerin kleiner Rollen, vor allem in Erotikfilmen, hatte Lydia Lux - sofern das ueberhaupt ihr richtiger Name ist - eine Affaere mit einem hochrangigen EXALT-Mitglied, das sie wegen ihrer besonderen Talente rekrutierte. Allerdings interessiert sich Frau Lux deutlich mehr dafuer, Haeuser in die Luft zu jagen und Menschen zu erschiessen, als fuer Spionage. Trotzdem ist ihre Meisterschaft in Verkleidung und Imitation ein wertvoller Vorteil fuer EXALT.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_MACKENZIE_CALHOUN_UFOPEDIA: ">ROLLE: Statistiker{NEWLINE}>ZUGEHOERIGKEIT: Keine{NEWLINE}>DETAILS: Von manchen wird er als einer der besten Statistiker der Welt bezeichnet. Mit schierer Kleinarbeit und Recherchen in Foren und Bulletin Boards hat er grosse Teile unserer Existenz rekonstruiert und uns ein Datenpaket mit einigen seiner Erkenntnisse geschickt - zusammen mit einem einzelnen Foto eines Vogels an einer Tastatur, seiner persoenlichen Signatur. Er koennte fuer uns ein aeusserst wertvoller Verbuendeter werden, wenn wir ihn vor jenen erreichen, die eine Zusammenarbeit verhindern wollen.{NEWLINE}>STATUS: Unbekannt"
  STR_DOSSIER_MADAME_ZOFIE: "Dossier: Madame Zofie"
  STR_DOSSIER_MADAME_ZOFIE_UFOPEDIA: ">ROLLE: Fernsehmedium{NEWLINE}>ZUGEHOERIGKEIT: Reclamation of Aether{NEWLINE}>DETAILS: Als Gastgeberin einer spaetabendlichen TV-Show fuer spiritistische Sitzungen auf einem kleinen UHF-Sender in Utah, USA, verbringt Madame Zofie seit Jahren ihre Zeit mit astrologischen Vorhersagen, 'Seancen' fuer Hinterbliebene und allgemein mit der Vermarktung von New-Age-Ideen und -Produkten. Doch gelegentlich scheint sie Dinge zu wissen, die sie nicht wissen duerfte - spricht mit Menschen, die niemand sonst sieht, oder 'uebermittelt Botschaften an die Glaeubigen'. Wenn daran etwas echt ist, muessen wir sie im Auge behalten.{NEWLINE}>STATUS: Auf Sendung"
  STR_DOSSIER_MARTIN_JAKUBKO_UFOPEDIA: ">ROLLE: Offizier/Diplomat{NEWLINE}>ZUGEHOERIGKEIT: Morgenroete{NEWLINE}>DETAILS: Unter dem Spitznamen The Rad Red gilt Jakubko in den Reihen der Morgenroete als der netteste Mensch ueberhaupt. Gerade sein persoenlicher Charme veranlasste seine Vorgesetzten dazu, ihn zu diplomatischen Treffen mit anderen Geheimorganisationen zu entsenden.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_MCGUINNESS_ELLIOTT_COOKE: "Dossier: McGuinness Elliott Cooke"
  STR_DOSSIER_MCGUINNESS_ELLIOTT_COOKE_UFOPEDIA: ">ROLLE: Ausbilder{NEWLINE}>ZUGEHOERIGKEIT: Soeldner{NEWLINE}>DETAILS: Vietnam-Veteran und ehemaliges Delta-Force-Mitglied. Er wird mit einem gescheiterten Putschversuch in Val Verde und dem Verschwinden eines Kabinettsministers desselben Landes in Verbindung gebracht - ein Fall, bei dem moeglicherweise auch Ausserirdische eine Rolle spielten.{NEWLINE}>STATUS: Anheuerbar"
  STR_DOSSIER_MILLER_AND_SMITH: "Dossier: Miller und Smith"
  STR_DOSSIER_MILLER_AND_SMITH_UFOPEDIA: ">ROLLE: Vollstrecker{NEWLINE}>ZUGEHOERIGKEIT: EXALT{NEWLINE}>DETAILS: Miller und Smith sind EXALT-Offiziere mittleren Ranges, spezialisiert auf Terror und Zerstoerung. Unter ihren Kameraden geniessen sie dank einer Mischung aus Glueck, Grausamkeit und romantisierter Selbstdarstellung einen erstaunlich hohen Ruf.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_MILLICENT_WEBER_UFOPEDIA: ">ROLLE: Wissenschaftlerin{NEWLINE}>ZUGEHOERIGKEIT: Das Syndikat{NEWLINE}>DETAILS: Eine deutsch-amerikanische Genetikerin und ehemalige Biologieprofessorin an der Stanford University. Dr. Weber ist fuer grenzwertig menschenfeindliche Ansichten bekannt, vermutlich als Folge ihrer schwierigen Kindheit. Nach Studentenprotesten und negativer Presse wurde sie von Stanford entlassen, nachdem sie in einer Rede extreme Formen der Gentechnik, Experimente zur Mensch-Hybridisierung und die Erschaffung einer 'Neuen Menschheit' befuerwortet hatte. Inzwischen arbeitet sie fuer das Syndikat.{NEWLINE}>STATUS: Unter Beobachtung"
  STR_DOSSIER_MONICA_GRUMMANN_UFOPEDIA: ">ROLLE: Wissenschaftlerin{NEWLINE}>ZUGEHOERIGKEIT: Morgenroete{NEWLINE}>DETAILS: Dr. Grummanns Forschung zum menschlichen Stoffwechsel trug wesentlich zum Erfolg ostdeutscher Athleten bei. Sie zog sich frueh aus dem oeffentlichen Leben zurueck und verschwand, nachdem sie - wie wir inzwischen wissen - ein Angebot der Morgenroete erhalten hatte, an etwas weit Bahnbrechenderem zu arbeiten. Wir gehen davon aus, dass sie ein wichtiges Mitglied des Forschungspersonals der Morgenroete ist und deren Programm zur Verbesserung des Menschen beaufsichtigt.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_NATASHA_MOROZOVA: "Dossier: Natasha Morozova"
  STR_DOSSIER_NATASHA_MOROZOVA_UFOPEDIA: ">ROLLE: Offizierin{NEWLINE}>ZUGEHOERIGKEIT: Morgenroete{NEWLINE}>DETAILS: In der Sowjetunion wurden Waisen fuer eine weiterfuehrende Ausbildung zu KGB-Superspionen ausgewaehlt. Natasha Morozova war eine der besten Absolventinnen und trat 1983 im Alter von 13 Jahren in den Dienst ein. Ihre Spezialisierungen sind Tarnung, unbewaffnete Toetung und Scharfschuetzenarbeit. Sie fuehrte streng geheime Einsaetze in NATO-Staaten aus, darunter wissenschaftliche Spionage, Sabotage und Mord. Den Zusammenbruch ihres Landes empfand sie als persoenliche Tragoedie und als Verrat; bis zu ihrer Rekrutierung durch die Morgenroete Mitte der 90er Jahre zog sie durch Sibirien.{NEWLINE}>STATUS: Untergetaucht"
  STR_DOSSIER_OWEN_HOFFER_UFOPEDIA: ">ROLLE: Wissenschaftler{NEWLINE}>ZUGEHOERIGKEIT: M.A.G.M.A.-Korporation{NEWLINE}>DETAILS: Dr. Hoffer arbeitete gemeinsam mit Militaeringenieuren an thermischen Waffen auf Basis von CO2-Lasertechnologie. Erfolgreiche Tests zur Zerstoerung von Sprengstoff und Landminen weckten die Hoffnung, diese Technologie auch in anderen Bereichen einsetzen zu koennen. Dr. Hoffer wurde zuletzt waehrend seiner Reise nach Berlin im Fruehling dieses Jahres gesehen.{NEWLINE}>STATUS: Vermisst."
  STR_DOSSIER_PARVATI_ANAND_FOSTER_UFOPEDIA: ">ROLLE: Biologin{NEWLINE}>ZUGEHOERIGKEIT: Black Lotus{NEWLINE}>DETAILS: Mit indischen und britischen Wurzeln studierte Parvati in Oxford Biologie bis zur Promotion. Anschliessend lehrte sie mehrere Jahre in Indien, bevor sie waehrend einer Reise nach Indonesien auf geheimnisvolle Weise verschwand. Es gilt als wahrscheinlich, dass sie hinter dem psi-verstaerkten Koerpertrainingsprogramm einiger Mitglieder von Black Lotus steht.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_PIOTR_WISNIEWSKI: "Dossier: Piotr Wisniewski"
  STR_DOSSIER_PIOTR_WISNIEWSKI_UFOPEDIA: ">ROLLE: Forscher{NEWLINE}>ZUGEHOERIGKEIT: Unbekannt{NEWLINE}>DETAILS: Piotr arbeitete von 1967 bis 1984 fuer einen nicht identifizierten Geheimdienst und verliess diesen danach, um eigene Projekte zu verfolgen. Er ist ein brillanter Wissenschaftler, der oft mit seinen Kollegen ueber Kreuz lag und wiederholt versuchte, die Ausrichtung laufender Programme zu veraendern. Es ist unbekannt, woran er seit seinem Ausscheiden gearbeitet hat, doch er gilt als Verdaechtiger im Diebstahl mehrerer ausserirdischer Artefakte, die er nun moeglicherweise eigenstaendig untersucht.{NEWLINE}>STATUS: Fluechtig"
  STR_DOSSIER_PURPLE_LILLY_UFOPEDIA: ">ROLLE: Biochemikerin/Assassine{NEWLINE}>ZUGEHORIGKEIT: Kult der Apokalypse{NEWLINE}>DETAILS: Im Sudan in einem Fluchtlingslager aufgewachsen, fiel sie durch auerordentliche Intelligenz auf. Die Einrichtung war angeblich in Menschenhandel verstrickt, bis ein Groteil der Mitarbeiter an ungeklarter Vergiftung starb. Studierte Biochemie in Zurich unter einer falschen Identitat, und wird mit mehreren Ermordungen reicher Europaer in Verbindung gebracht, darunter ein Mitglied des belgischen Konigshauses. Sie scheint auf chemische Wirkstoffe fixiert zu sein, die Todlichkeit mit exotischem Duft verbinden.{NEWLINE}>STATUS: Interpol eingeschaltet."
  STR_DOSSIER_RENNIELLE_DIOLATA_UFOPEDIA: ">ROLLE: Vollstrecker{NEWLINE}>ZUGEHOERIGKEIT: Black Lotus{NEWLINE}>DETAILS: Rennielle gehoerte zu den besten Schuetzen der AFP. Eines Tages fand er seine Familie tot in ihrem Haus vor; die einzige Spur war eine AFP-Kappe. Aus Zorn vernichtete er die gesamte Militaereinrichtung, in der er frueher gedient hatte. Heute steht er im Dienst von Black Lotus.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_RICHARD_ROTY_UFOPEDIA: ">ROLLE: Sprecher{NEWLINE}>ZUGEHOERIGKEIT: US Air Force{NEWLINE}>DETAILS: Roty gilt als Schluesselfigur bei der Verbreitung staatlicher Desinformation an interessierte Kreise der UFO-Szene. Fuer die einen beweist das, dass UFO-Sichtungen Betrug sind und staatliche 'Leaks' nur Nebelkerzen darstellen. Andere glauben, Roty nutze genau dieses Schauspiel als tiefere Tarnung fuer echten Kontakt mit ausserirdischen Akteuren.{NEWLINE}>STATUS: Unter Beobachtung"
  STR_DOSSIER_SAKAMORI_MOTOKO_UFOPEDIA: ">ROLLE: Erpresserin{NEWLINE}>ZUGEHOERIGKEIT: Black Lotus{NEWLINE}>DETAILS: Einst Mitglied der japanischen Selbstverteidigungskraefte, entschied sie sich spaeter fuer die Strassenkriminalitaet als passendere Lebensform. Nach zwei Jahren in der 'Schuldeneintreibung' wurde ihr eine Position als 'Unterhaendlerin' zwischen Black Lotus und seinen Geschaeftspartnern angeboten. Ihre Arbeit endet haeufig mit Mord.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_SHADOWMAN: "Dossier: The Shadowman"
  STR_DOSSIER_SHADOWMAN_UFOPEDIA: ">ROLLE: Unbekannt{NEWLINE}>ZUGEHOERIGKEIT: Unbekannt{NEWLINE}>DETAILS: Dieser Mann ist vielleicht der groesste Hacker der Welt. Geruechten zufolge handelt es sich um eine von Cyberweb erschaffene kuenstliche Lebensform, die sowohl fuer elektronische als auch fuer menschliche Augen unsichtbar bleibt. Seine Agenda ist unbekannt, doch er scheint einen privaten Krieg gegen die Verschwoerung zu fuehren.{NEWLINE}>STATUS: Untergetaucht"
  STR_DOSSIER_SHANE_BARTON_UFOPEDIA: ">ROLLE: Bauer{NEWLINE}>ZUGEHORIGKEIT: Keine{NEWLINE}>DETAILS: Betreibt Lebensmittelfirma. Begann mutiertes Wild im Miskatonic-Tal zu fangen, zuchteten, und schlachten, fur neue 'exotische' Fleischprodukte. Gesundheitsprobleme traten nach Verzehr auf. Vorlaufige Labortests indizieren nicht-irdische Bestandteile.  Es ist ein erschreckender Gedanke, dass Leute wie dieser Mann und seine Familie in Kontakt mit dem fremden Okosystem kamen, und sich beilaufig daran anpassten.{NEWLINE}>STATUS: Untersuchung durch Nahrungsmittelbehorde."
  STR_DOSSIER_SIEGFRIED_VON_HAGEN: "Dossier: Siegfried von Hagen"
  STR_DOSSIER_SIEGFRIED_VON_HAGEN_UFOPEDIA: ">ROLLE: Dunkler Ritter{NEWLINE}>ZUORDNUNG: Zombies{NEWLINE}>DETAILS: Im 16. Jahrhundert an der Niederschlagung eines Bauernaufstands beteiligt und darin offenbar erschreckend effizient. Der Legende nach fand er durch die Hand einer Hexe ein fruehes Ende, deren Soehne er getoetet hatte. Sie belegte ihn mit Vampirismus, und seither soll er auf der Suche nach Blut durch die Waelder streifen. In Wirklichkeit handelt es sich um einen anomalen Grabwaechter, der eine untote Horde kommandiert und Menschen kaum mehr als Rohmaterial fuer neue Zombies betrachtet. Auch wenn er selbst ein Zombie ist, erwarten wir einen listigen, berechnenden, aber zugleich brutal direkten Gegner. Warum ist er gerade jetzt wieder aktiv?{NEWLINE}>STATUS: Interpol informiert"
  STR_DOSSIER_SMILES_MCGEE: "Dossier: Agent 'Smiles' McGee"
  STR_DOSSIER_SMILES_MCGEE_UFOPEDIA: ">ROLLE: Psychokiller{NEWLINE}>ZUGEHOERIGKEIT: Unbekannt{NEWLINE}>DETAILS: Als frueher X-Com-Agent der allerersten Stunde war 'Agent Smiles' eines der vielversprechendsten Mitglieder der Organisation, bevor er im Dezember 1996 auf geheimnisvolle Weise verschwand. Inzwischen scheint der Agent noch am Leben zu sein und gegen uns zu arbeiten. Seine gesamte Vergangenheit stellte sich als sorgfaeltig fabrizierte Legende heraus, gut genug, um unsere Sicherheitspruefungen zu taeuschen. Unter Kultisten und Kriminellen ist er zudem fuer mehrere Blutbaeder beruechtigt, die er scheinbar ohne jeden Anlass anrichtete. Er ist noch toedlicher, als wir erwartet hatten, und wir wissen nicht, warum. Wir muessen mit ernsten Problemen durch dieses raetselhafte Individuum rechnen.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_SPECTRAL_FM_87: "Dossier: SPECTRAL-FM.87"
  STR_DOSSIER_SPECTRAL_FM_87_UFOPEDIA: ">ROLLE: Abtruenniges Unterweltradio{NEWLINE}>ZUORDNUNG: Reclamation of Aether{NEWLINE}>DETAILS: Ueber diese Radiosendung ist nur wenig bekannt. Offenbar sendet sie weltweit jede Nacht fuer zehn Minuten um Mitternacht auf einer ganz bestimmten Frequenz, auf der die Stimmen der Toten in einem fast heiteren Varietee-Format zu den Lebenden sprechen. Sie berichten von schrecklichen Schicksalen, von Aufgaben, die andere erfuellen muessen, und von kryptischen Botschaften, welche die Lebenden entschluesseln sollen.{NEWLINE}>STATUS: Sendet weiter"
  STR_DOSSIER_TAMAN_SHUD_UFOPEDIA: ">ROLLE: Forscher{NEWLINE}>ZUGEHOERIGKEIT: Unbekannt{NEWLINE}>DETAILS: Verantwortlich fuer die Verfolgung von Signalen im Zusammenhang mit den 'Deep Ones' im Pazifischen Ozean waehrend des Zweiten Weltkriegs. 1948 wurde er tot in Australien aufgefunden; saemtliche Forschungsunterlagen waren auf geheimnisvolle Weise verschwunden. Nun soll er angeblich wieder bei bester Gesundheit auf der Erde umherwandeln, ist aber ausserordentlich schwer aufzuspuehren.{NEWLINE}>STATUS: Fluechtig"
  STR_DOSSIER_TAN_YING_UFOPEDIA: ">ROLLE: Assassine/Saboteurin{NEWLINE}>ZUGEHOERIGKEIT: Black Lotus{NEWLINE}>DETAILS: Unter ihren Untergebenen ist sie als die 'Motorzauberin' bekannt. Sie traegt die Verantwortung fuer mindestens zwei Terroranschlaege und mehrere Bankueberfaelle. Ihren psi-Kraeften wird nachgesagt, ihre koerperlichen Faehigkeiten massiv zu verstaerken, was sie zu einer extrem gefaehrlichen Verbrecherin macht.{NEWLINE}>STATUS: Interpol verstaendigt"
  STR_DOSSIER_TYVARIUS_STIENBURG_UFOPEDIA: ">ROLLE: Anwalt/Bankier{NEWLINE}>ZUGEHOERIGKEIT: Unbekannt{NEWLINE}>DETAILS: Stienburg war an zahlreichen Rechtsfaellen beteiligt, die indirekt mit Organisationen wie EXALT, der Kirche Dagons, Morgenroete oder Black Lotus verknuepft waren. Er ist aussergewoehnlich geschickt darin, Emotionen, Wahrheiten und Beweislagen zu manipulieren, und sorgt fast immer dafuer, dass seine Mandanten straffrei ausgehen. Zugleich beraet er verschiedene Koerperschaften in Finanzfragen. Es kursieren Geruechte, dass er zuweilen direkten Kontakt mit Ausserirdischen hat und ueber psionische Faehigkeiten verfuegt.{NEWLINE}>STATUS: Unter Beobachtung und Steuerpruefung"
  STR_DOWNED_UFO_BRIEFING: "Die Luftwaffe konnte das UFO verfolgen und abschiessen. Spezialkraefte sind bereits auf dem Weg, und das Militaer hat das Gebiet abgeriegelt.{NEWLINE}Wir werden das Militaer beim Sturm auf die Absturzstelle unterstuetzen, moegliche Verluste unter dem Personal begrenzen und das Gelaende sichern, damit das Objekt zur Untersuchung in eine X-Com-Basis ueberfuehrt werden kann. Um die Mission abzubrechen, fuehren Sie die X-Com-Kraefte in das Transportfahrzeug zurueck und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_DOWNTOWN_ATTACK_BRIEFING: "Auerirdische terrorisieren die Regierung, indem sie ein Finanzzentrum angreifen. Suchen Sie das Gefecht mit den Feinden und sichern Sie das Gebiet. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_DO_NOT_SHARE_ALIEN_GARDENS_TECH_UFOPEDIA: "Kommandant, ich habe der M.A.G.M.A.-Korporation wie befohlen bedeutet, dass sie sich ihre Bitte sparen kann. Was immer sie uns anbieten wollten - wir koennten uns daran noch verschlucken. Ganz zu schweigen davon, dass der Rat uns dafuer in Stuecke reissen wuerde.{NEWLINE}... Ich gebe allerdings zu, dass ich seitdem darueber nachdenke, auf welche huebsche Technologie wir gerade verzichtet haben. Um diese Stimmung loszuwerden, duerfte eine maessige Dosis Alkohol angebracht sein. Vielleicht begleiten Sie mich spaeter in die Kantine, Kommandant?{NEWLINE}{NEWLINE}(250 Punkte erhalten)"
  STR_DO_NOT_SHARE_ALLOY_AMMO_TECH_UFOPEDIA: "Jawohl, Kommandant, ich bin voll auf Ihrer Seite. Die Leute von M.A.G.M.A. reden zwar sehr geschmeidig, aber wuerden Sie ihnen wirklich trauen? Ich jedenfalls nicht.{NEWLINE}Was immer sie uns anbieten koennten - ich wette, es ist das Risiko nicht wert. Hoffentlich verzichten wir damit nicht auf etwas allzu Wichtiges.{NEWLINE}{NEWLINE}(250 Punkte erhalten)"
  STR_DO_NOT_SHARE_ELERIUM_EXPLOSIVES_TECH_UFOPEDIA: "Verstanden, Kommandant - M.A.G.M.A. ist nicht gerade der Korb, in den ich meine Eier legen wuerde ... und schon gar nicht ein Ei dieser Groesse. Lassen wir uns nicht von Gier treiben und behalten wir einen kuehlen Kopf, solange wir ihn noch auf den Schultern tragen.{NEWLINE}{NEWLINE}(250 Punkte erhalten)"
  STR_DO_NOT_SHARE_POWER_SOURCE_MINIATURIZATION_TECH_UFOPEDIA: "Ja, Kommandant, genau das Letzte, was wir brauchen, ist ein M.A.G.M.A. mit dem Potential fuer eine eleriumbetriebene Armee. Oder zumindest fuer die Faehigkeit, das Machtgleichgewicht in halben Weltregionen auf den Kopf zu stellen. Fuer wen halten die uns eigentlich - Osiron?{NEWLINE}{NEWLINE}(450 Punkte erhalten)"
  STR_DO_NOT_SHARE_TERRAMITE_TECH_UFOPEDIA: "Das Leben besteht aus schwierigen Entscheidungen, Kommandant. Diese hier wirkt allerdings erstaunlich vernuenftig. Unsere direkten Geldgeber noch weiter zu reizen, waere keine gute Idee ... und was immer M.A.G.M.A. anzubieten hat, kann unmoeglich gut genug sein, um deswegen den Rat gegen uns aufzubringen.{NEWLINE}{NEWLINE}(250 Punkte erhalten)"
  STR_DRAGONFLY_DARK_UFOPEDIA: "Dieses frei erhaeltliche Fluggeraet ist eine kleine Besonderheit auf dem Markt und wird von Vanguard Aero-Space Technologies gefertigt. Mit seiner geringen Masse, ordentlichen Geschwindigkeit und Faehigkeit zum Senkrechtstart und -landen ist es ein attraktiver Mittelweg zwischen Hubschrauber und Kleinflugzeug. Fuer echte Kampfflugzeuge sollte es keine grosse Bedrohung darstellen, fuer den zivilen Luftverkehr kann es jedoch gefaehrlich werden."
  STR_DRAGONFLY_FRAME: "Dragonfly-Huellenrahmen"
  STR_DRASTIC_MEASURES_DESCRIPTION: "Wegen X-Coms angespannter Finanzlage hat die Chefbuchhalterin einige radikale Sparmassnahmen durchgesetzt. Gestrichen wurden vor allem 'ueberfluessige' Ausgaben wie Kaffeemaschinen oder Feiertagsboni. Begeistert ist davon niemand - sie selbst eingeschlossen.{NEWLINE}[-50 Punkte, 50 000$]"
  STR_DREADNOUGHT_FRAME: "Dreadnought-Huellenrahmen"
  STR_DREAMING_UFOPEDIA: "Traumen ist eine geistige Technik, um durch meditative Trance den eigenen Verstand zu erkunden. Die Einzelheiten sind unklar, aber es scheint das Gehirn mit einem aueren Medium, der 'Traumebene', zu verbinden, was dem Subjekt erlaubt, sich vollstandig in den eigenen Traumen zu manifestieren. Das ist ein gefahrlicher Vorgang, da der Traumer den Naturgesetzen der Traumebene ausgesetzt ist, das heit, jeder Schaden im Traum fuhrt zu geistigem Trauma und womoglich Tod.{NEWLINE}Traumen ist eine einsame Mission, da man andere nicht in die eigenen Traume mitnehmen kann. Selbstverstandlich gilt das selbe fur greifbare Dinge: Nichts kommt hinein oder heraus. Es gibt Ausnahmen: bestimmte psionische Gegenstande konnen sich auf den Traumer einstimmen und im Traum manifestieren, und einige seltene Traumobjekte konnen in der Wirklichkeit durch die Lebenskraft des Traumers repliziert werden.{NEWLINE}Beim Erwachen im Traum tragt man eine sogenannte Traumklinge: eine Verkorperung psionischer Kraft, die einzige Abwehr gegen die Einwohner dieser seltsamen Welt. Daher sollten nur geubte Psione an solchen Missionen teilnehmen, auer, Sie konnen eine andere Waffe mitgeben."
  STR_DREAMSCAPE_NECROMANCERS_DUNGEON_BRIEFING: "Eine geheimnisvolle Quelle aus dem Rat bittet um Hilfe: Die Traumebene wird von einer boswilligen Macht gestort, die Traumer in einem Albtraum fangt, um ihre Lebenskraft zu stehlen und sie komatos zurucklasst. Finden und besiegen sie die Albdrucke, die dieses Reich durchstreifen. Passen Sie auf, nicht selbst zum Albdruck zu werden!  Um die Mission abzubrechen, lassen Sie die Astralprojektion der X-Com-Mitarbeiter in das Pentagrammportal zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_DREAMSCAPE_VILLA_BRIEFING: "Dieser Ort zu dieser Zeit ist eine groartige Gelegenheit fur einen unserer Agenten, seine inneren Damonen zu konfrontieren. Diese Reise fuhrt eine einzelne Person in den Mittelpunkt ihres Geists. Vermeiden oder besiegen Sie Rote Traumwichte, die Ihre Angste und Beschrankungen verkorpern, und werden Sie zu einem besseren Selbst. Suchen Sie den Preis, ein Kostlicher Kuchen, und nutzen Sie ihn oder bringen Sie ihn fur jemand anderes heim. Der Kuchen wird die Psi-Starke des Essers dauerhaft erhohen. Um die Mission abzubrechen, lassen Sie die Astralprojektion des X-Com-Mitarbeiter in das Pentagrammportal zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_DROPSHIP_UFOPEDIA: "Dieser Truppentransporter ist eine Mischung aus alienhafter und T'leth-Technologie und mit einem Doppelradarsystem fuer erweiterte Bereichssuche ausgestattet. Angetrieben wird er mit Zrbite.{NEWLINE}SYS: ENGN x 2, ELEC x 1"
  STR_DR_ALPHA_ISLAND_BRIEFING: "Ein Geheimlabor lag auf dieser Vulkaninsel, und nun benutzt Dr. Alpha es um seine monstrose Streitmacht zu sammeln. Losen Sie dieses Problem und verhaften Sie den abtrunnigen Wissenschaftler zur Befragung. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_DR_HADRIEX_CRUISE_BRIEFING: "Ein ziviles Schiff hat ein SOS-Signal abgesetzt, anscheinend wegen eines Angriffs von Geistern und Kultisten. Sie konnen sich von dieser Mission nicht zuruckziehen."
  STR_DR_HADRIEX_CRUISE_DESCRIPTION: "Ein Schiff sendet S.O.S., anscheinend von Geistern und Kultisten uberfallen. Diese Mission ist eine einmalige Gelegenheit. Sie konnen sich von dieser Mission nicht zuruckziehen."
  STR_DR_TANAKAS_SECRET_STASH: "Dr. Tanakas geheimes Lager"
  STR_DR_TANAKAS_SECRET_STASH_BRIEFING: "Dank der Verhoere hochrangiger Mitglieder von Osiron konnten wir einen alten Militaerstuetzpunkt lokalisieren, in dem der beruechtigte Dr. Carlos Tanaka hochsensible Technologie lagert. Er will die Ware schon sehr bald verlegen, was uns eine seltene Gelegenheit gibt, sowohl die Schmuggelgueter als auch den Verbrecher selbst abzufangen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_DR_TANAKAS_SECRET_STASH_DESCRIPTION: "Dank der Verhoere hochrangiger Mitglieder von Osiron konnten wir einen alten Militaerstuetzpunkt lokalisieren, in dem der beruechtigte Dr. Carlos Tanaka hochsensible Technologie lagert. Er will die Ware schon sehr bald verlegen, was uns eine einmalige Gelegenheit gibt, sowohl die Schmuggelgueter als auch den Verbrecher selbst abzufangen. Die Basis wird von einem grossen Aufgebot an Osiron-Gangstern bewacht.{NEWLINE}Diese Mission taucht nur ein einziges Mal auf."
  STR_DURATHREAD_FACTORY_BRIEFING: "Hier liegt ein kleiner Produktionskomplex für Durafaden. Es wird von der Morgenroete betrieben, und von ihren Rot-Ops Kommandos bewacht. Wir müssen jeden Widerstand brechen und diese Örtlichkeit zur Untersuchung absichern. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurückkehren und klicken das Icon 'Mission abbrechen' an."
  STR_DURATHREAD_FACTORY_DESCRIPTION: "Hier liegt ein kleiner Produktionskomplex für Durafaden. Wir müssen jeden Widerstand brechen und diese Örtlichkeit zur Untersuchung absichern.{NEWLINE}Das umliegende Gelände ist hauptsächlich gefrorenes Flachland mit einigen Hügeln. Vorsicht, Morgenroete-Elite-Patrouillen wurden gesichtet."
  STR_DURATHREAD_FACTORY_LOCATION_UFOPEDIA: "Wir wussten, dass der Durafaden, den wir geborgen haben, von der Morgenroete hergestellt wird, aber wir wussten nicht, wo. Aber nun können wir die Position ihrer Fabrik triangulieren. Wir sollten eine Razzia durchführen, und Daten zur Replikation dieser Technologie für unseren Gebrauch sammeln."
  STR_DURATHREAD_ORIGINS_UFOPEDIA: "Kommandant, ich habe den hochrangigen Funktionaer der Morgenroete, den wir in der Zelle sitzen haben, zu dieser Durafaden-Technologie befragt. Ich hatte erwartet, dass er etwas ueber ausserirdische Herren ausplaudert, aber nein: Offenbar wurden diese Maschinen von einer Geheimorganisation namens Cyberweb geliefert. Wir wissen nicht, ob Cyberweb Teil eines ausserirdischen Invasionsplans ist oder nur ein besonders lukratives Schnell-reich-werden-Projekt betreibt, aber angesichts ihres technologischen Vorsprungs sollten wir sofort mit der Suche nach ihnen beginnen.{NEWLINE}Alles, was wir bisher ueber Cyberweb wissen, ist, dass sie weltweit ein Netzwerk aus sicheren Unterschlupfen unterhalten. Hoffentlich koennen wir ihnen bald einen Besuch abstatten."
  STR_EARTHBORN: "Earthborn"
  STR_EARTHBORN_UFOPEDIA: "Eine meditationsgestuetzte Praxis, die einen Weg umfassender geistiger Entwicklung eroeffnet - von abstraktem Denken bis hin zu Empathie. Earthborn-Hybriden sind verlaessliche Psioniker mit hoher mentaler Widerstandsfaehigkeit und eisernem Durchhaltewillen.{NEWLINE}Erfordert Psi-Labor.{NEWLINE}WARNUNG: SCHLIESST STARCHILD AUS."
  STR_EASY_RIDER_ARMOR: "Kampfanalyse: Easy Rider"
  STR_ECHOES_OF_ERROR: "Echos des Irrtums"
  STR_ECHOES_OF_ERROR_DESCRIPTION: "Kraefte des Rats haben in {0} einen Trupp Brainsucked-Operativer gestellt und ausgeschaltet. Wir wollen diesen Vorfall nutzen, um dem Rat zu zeigen, dass die Einschraenkung unserer Aktivitaeten in Dimension X vielleicht ein Fehler war.{NEWLINE}[100 Punkte]"
  STR_ECHOES_OF_ERROR_MIB: "Echos des Irrtums"
  STR_ECHOES_OF_ERROR_MIB_DESCRIPTION: "Kraefte der Men in Black haben in {0} einen Trupp Brainsucked-Operativer gestellt und ausgeschaltet. Der Rat lobte ihr Eingreifen zwar, doch Sie nutzten den Moment, um darauf hinzuweisen, dass dieser Vorfall vielleicht haette vermieden werden koennen, wenn man X-Com bei Angelegenheiten der Dimension X mehr Vertrauen geschenkt haette.{NEWLINE}[50 Punkte]"
  STR_ECTOPLASMIC_GENERATOR_REMAINS: "Reste eines Ektoplasma-Generators"
  STR_ECTOPLASMIC_GENERATOR_REMAINS_UFOPEDIA: "Die Auswertung verschiedener Geraete, die wir beim Ueberfall auf das Labor der Reclamation of Aether erbeutet haben, hat uns erste Einblicke in die arkane Infrastruktur des Kults verschafft. Einige Bauteile enthalten psionische Komponenten, die offenbar aus der Ferne mit einer Art Maschine gekoppelt werden, um Geisterbefall zu erleichtern. Wir sollten unsere Anstrengungen darauf richten, den Standort dieses Geraets aufzudecken."
  STR_ECTOPLASM_FROM_ANCIENT_SEA_GHOST: "Ektoplasma (von Ancient Sea Ghost)"
  STR_ECTOPLASM_FROM_ANTEDILUVIAN_GHOST: "Ektoplasma (von Antediluvian Ghost)"
  STR_ECTOPLASM_FROM_BUG_EYE_GHOST: "Ektoplasma (von Bug Eye Ghost)"
  STR_ECTOPLASM_FROM_GHOST_DINOSAUR: "Ektoplasma (von Saurian Ghost)"
  STR_ECTOPLASM_FROM_GHOST_EYE: "Ektoplasma (von Ghost Eye)"
  STR_ECTOPLASM_FROM_HUMAN_GHOST: "Ektoplasma (von Human Ghost)"
  STR_ECTOPLASM_FROM_KNIGHT_GHOST: "Ektoplasma (von Knightly Ghost)"
  STR_ECTOPLASM_FROM_PHANTASMAL_TENTACLE: "Ektoplasma (von Phantasmal Tentacle)"
  STR_ECTOPLASM_FROM_SKULL_WRAITH: "Ektoplasma (von Spectral Entity)"
  STR_ECTOPLASM_GENERATION: "Ektoplasma-Erzeugung"
  STR_ECTOPLASM_GENERATION_UFOPEDIA: "Wir verstehen die Technik der Reclamation of Aether inzwischen gut genug, um mit nichts weiter als einem willigen Psioniker und der Ausruestung unseres Psi-Labors eigenes Ektoplasma zu erzeugen. Der Vorgang ist zeitaufwendig, ansonsten aber guenstig und vollkommen sicher."
  STR_ECTOPLASM_UFOPEDIA: "Diese mysterioese Substanz ist zweifellos gewoehnliche Materie, doch ihre chemische, quasi-organische Zusammensetzung ist chaotisch und schwer zu erklaeren. Darueber hinaus ist sie mit Resten mentaler Energie aufgeladen. Sie zerfaellt schnell und erfordert fuer weitergehende Untersuchungen eine spezielle Einrichtung."
  STR_ELECTRO_NULLIFIER: "Elektro-Nullifikator"
  STR_ELECTRO_NULLIFIER_UFOPEDIA: "Unser neues Wissen ueber Alien-Legierungen sowie unsere Untersuchungen natuerlicher Blitzgeneratoren bei Muckstars haben es uns ermoeglicht, ein Geraet zu entwickeln, das heftige Energieladungen ableitet. Auf dem Ruecken getragen schuetzt es Agenten vor schwaecheren elektrischen Angriffen.{NEWLINE}Reduziert den Effekt von Elektrizitaetsschaden um bis zu 1/5, bis zu einer maximalen Resistenz von 50%."
  STR_ELERIUM_BOMB_TERROR_DESCRIPTION: "Heute erschuetterte eine mysterioese Explosion ein Wohngebiet in {0} und forderte zahlreiche Menschenleben durch den Einsturz eines Gebaeudes. Man geht davon aus, dass der Anschlag beabsichtigt war und mit gewaltsamen Machtkaempfen zwischen Osiron-Fraktionen zusammenhaengt. Vorlaeufige Ermittlungen des Rates ergaben Spuren eleriumbasierter Sprengstoffe. Die Taeter beschafften das Material vermutlich aus einer unzureichend gesicherten Anlage von M.A.G.M.A., was unsere frueheren Entscheidungen nicht gerade in gutem Licht erscheinen laesst.{NEWLINE}[-500 Punkte]"
  STR_ELERIUM_EXTRACTION_ETRACE: "Verarbeitung von Alien-Treibstoffspuren"
  STR_EMBASSY_OF_TLETH: "Botschaft von T'leth"
  STR_EMBASSY_OF_TLETH_BRIEFING: "Wir haben einen geheimen Unterwasserort aufgespuert, an dem hochrangige Mitglieder der Kirche Dagons zu einem Treffen mit ihren unmenschlichen Herren gebracht werden. Ein solches Treffen findet genau jetzt statt. Menschen sehen und bewegen sich unter Wasser nur eingeschraenkt, seien Sie also vorsichtig. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zur Tauchkapsel zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_EMBASSY_OF_TLETH_DESCRIPTION: "Wir haben einen geheimen Unterwasserort aufgespuert, an dem hochrangige Mitglieder der Kirche Dagons zu einem Treffen mit ihren unmenschlichen Herren gebracht werden. Ein solches Treffen findet genau jetzt statt. Wir werden es nicht geschehen lassen.{NEWLINE}Nur unterwasserfaehige Ausruestung erlaubt!"
  STR_ENEMY_REINFORCEMENTS_UFOPEDIA: "Wahrend bestimmten Missionen konnen frische gegnerische Einheiten eintreffen. Dies wird auf dem 'Versteckte Bewegung'-Schirm angezeigt. Diese frischen Einheiten werden zu Beginn des feindlichen Zugs auftauchen und konnen sofort handeln, und moglicherweise ihre Agenten uberraschen.{NEWLINE}Normalerweise treffen diese Feinde zu Fu entlang des Rands der Karte ein. Solche Einheiten tauchen nie innerhalb eines bestimmten Abstand zu X-Com-Einheiten auf (ublicherweise 10 Felder). Achtung: Verstarkungen, die auf andere Weise eintreffen, mussen sich nicht unbedingt an diese Regeln halten."
  STR_ENVOY_SHIP_FRAME: "Gesandtschaftsschiff-Huellenrahmen"
  STR_ERRATIC_WEATHER_LOW: "Launenhaftes Wetter"
  STR_ERRATIC_WEATHER_LOW_DESCRIPTION: "Unser Transdimensionaler Empfaenger stoerte das lokale Wetter und loeste einen heftigen Sturm aus. Der Rat hat uns wegen unzureichender Einhaltung der vereinbarten Sicherheitsmassnahmen geruegt.{NEWLINE}[-50 Punkte]"
  STR_ERRATIC_WEATHER_MEDIUM: "Launenhaftes Wetter"
  STR_ERRATIC_WEATHER_MEDIUM_DESCRIPTION: "Unser Transdimensionaler Empfaenger verursachte eine Stoerung des lokalen Wetters und loeste einen heftigen Sturm aus. Einige Randmedien spekulieren bereits ueber ein 'geheimes Regierungsprojekt' als Ursache.{NEWLINE}[-150 Punkte]"
  STR_ETHEREAL_ORIGINS_UFOPEDIA: "{ALT}Die Atherer stammen von einer Welt, auf der telepathische Verbindungen vorherrschen, und viele Spezies ein Gruppenbewusstsein ausbilden. Sie lebten auch in solchen Gruppen, aber als ihre Kultur sich entwickelte, lernten sie, sich vom Kollektiv abzutrennen und Individualitat zu erreichen. Dies brachte Fortschritt, aber auch Leid, da sie Einsamkeit nicht gewohnt waren. Zwei rivalisierende Ideologien entstanden: Entweder Individualitat als eine edle Sache voranzutreiben (als Martyrer) oder in den seligen Schwarmverstand zuruckzukehren. Aber man fand einen Kompromiss: bestimmte Individuen wurden als Eliten designiert, und der Rest als Knechte. Die Eliten wurden nicht untereinander Gedanken verschmelzen, nur mit den 'Plebs', die zu dumm und geistig schwach gemacht wurden, um jemals Kontrolle uber das Netzwerk zu erringen. Diese 'Plebs' sind uns als Mutone bekannt. Eliten sind Individuen(da sie ihr eigenes Psi-Netzwerk beherrschen) aber leiden nicht unter der Trennung (da die Mutone jetzt ihre Familie bilden). Dieses kulturelle Muster existiert bis heute, obwohl es nicht alle Atherer voll unterstutzen...{ALT}"
  STR_EXALT_AFTER_HQ: "NUR FUER DIE AUGEN DER MEISTER"
  STR_EXALT_AFTER_HQ_EVENT: "EXALT-Nachricht abgefangen"
  STR_EXALT_AFTER_HQ_EVENT_DESCRIPTION: "Kommandant, wir haben wichtige interne Kommunikation von EXALT entschluesselt. Ich blende sie jetzt ein ..."
  STR_EXALT_AFTER_HQ_UFOPEDIA: "Unsere Lage wird zunehmend unhaltbar. Nach dem Angriff auf unsere Zufluchtsorte und der Gefangennahme unseres geschaetzten Kollegen ist es sehr wahrscheinlich, dass auch unser Hauptquartier durch die Ermittlungsgruppe kompromittiert wurde. Angesichts der nachweislichen Effektivitaet ihrer Verhoermethoden ist kaum zu erwarten, dass er lange standhalten kann. In diesem Zusammenhang waren unsere 'Freunde' nun immerhin in der Lage, uns den Namen unserer ungewoehnlich schattenhaften Gegenspieler zu nennen: X-Com. Darueber hinaus bleiben die Einzelheiten selbst in diesem Stadium unklar. Alles, was unsere Informationen hergeben, ist, dass diese Gruppe gezielt auf unsere Vernichtung hinarbeitet - ebenso wie auf jene bestimmter fehlgeleiteter Elemente ausserhalb unseres Einflussbereichs. Besonders beunruhigend ist die Moeglichkeit, dass sie von unseren esoterischeren Partnerschaften wissen und unsere Organisation nur als Hindernis auf dem Weg zu deren Ausschaltung betrachten.{NEWLINE}Empfehlung: Reservenetz aktivieren und der Hauptquartierverteidigung zuweisen. Unmittelbaren Angriff erwarten und alle Notfallprotokolle aktivieren."
  STR_EXALT_AFTER_NETWORK: "NUR FUER DIE AUGEN DER MEISTER"
  STR_EXALT_AFTER_NETWORK_EVENT: "EXALT-Nachricht abgefangen"
  STR_EXALT_AFTER_NETWORK_EVENT_DESCRIPTION: "Kommandant, wir haben wichtige interne Kommunikation von EXALT entschluesselt. Ich blende sie jetzt ein ..."
  STR_EXALT_AFTER_NETWORK_UFOPEDIA: "Offenbar stoesst unsere Organisation auf unerwartetes Interesse. Seit Dezember sind mehrere Verstecke und Vermoegenswerte unter weitgehend ungeklaerten Umstaenden und ohne Vorwarnung verschwunden. Was wir von Zeugen und Ueberlebenden - sofern sie nicht bereits gegen uns gedreht wurden - in Erfahrung bringen konnten, deutet auf irgendeine Regierungsorganisation hin. Auffaellig ist jedoch, dass diese Gegner in der Lage zu sein scheinen, bei ihrer Jagd nach uns Landesgrenzen ohne Schwierigkeiten zu ueberqueren. Im Moment wirken sie noch leicht bewaffnet, und ihre Angriffe sind nur von geringer Groessenordnung, doch das aendert sich in beunruhigendem Tempo. In Verbindung mit ihrer globalen Reichweite koennte das zu einer ernsthaften Bedrohung werden.{NEWLINE}Empfehlung: Sicherheitsmassnahmen an regionalen Aussenposten und Psiclone-Verteilzentren erhoehen, unsere 'Freunde' um eine diskrete Untersuchung dieser Agenten bitten."
  STR_EXALT_AFTER_OPERATIONS: "NUR FUER DIE AUGEN DER MEISTER"
  STR_EXALT_AFTER_OPERATIONS_EVENT: "EXALT-Nachricht abgefangen"
  STR_EXALT_AFTER_OPERATIONS_EVENT_DESCRIPTION: "Kommandant, wir haben wichtige interne Kommunikation von EXALT entschluesselt. Ich blende sie jetzt ein ..."
  STR_EXALT_AFTER_OPERATIONS_UFOPEDIA: "Bezugnehmend auf Ihre frueheren Rueckfragen: Unsere Untersuchung der Bedrohung ist auf ein erhebliches Hindernis gestossen. Zuerst die gute Nachricht: Wir sind uns inzwischen sicher, dass es sich um eine Ermittlungsgruppe und nicht um eine militaerische Formation handelt. Trotz der Schaeden, die sie bisher angerichtet hat, war ihre Ausruestung unterdurchschnittlich und die eingesetzten Teams waren klein. Nun die schlechte Nachricht: Das internationale Mandat unserer Feinde ist bestaetigt. Dieselben Agenten wurden an voellig unterschiedlichen Orten beobachtet. Ausserdem ist es ihnen trotz ihrer Ausruestung gelungen, unser Verteilnetz zu infiltrieren. Wir muessen davon ausgehen, dass bereits eine beachtliche Zahl unserer Aussenposten kompromittiert ist und dass sie moeglicherweise sogar den Standort eines oder mehrerer unserer erlesensten Rueckzugsorte kennen. Am schlimmsten ist jedoch, dass sich unsere 'Freunde' als alarmierend inkompetent - oder absichtlich ausweichend - erwiesen haben. Sie koennen uns nicht einmal einen Namen fuer unsere Gegner nennen.{NEWLINE}Empfehlung: Kraefte aus den Unterschluepfen abziehen, Verteilzentren befestigen und Angriffe auf unsere Anwaesen vorbereiten."
  STR_EXALT_ARMORED_CAR: "EXALT-Panzerwagen"
  STR_EXALT_BRAINER: "EXALT-Brainer"
  STR_EXALT_BRAINER_CORPSE: "Leiche eines EXALT-Brainers"
  STR_EXALT_BRAINER_UFOPEDIA: "Da die einfachen Mitglieder von EXALT im Wesentlichen ueber die Verteilung von Psiclone kontrolliert werden, gibt es einen Weg zum Sieg ohne langwierigen Krieg: Wir muessen diese EXALT-Waffe gegen sie selbst richten. Inzwischen verstehen wir die Funktionsweise von Psiclone gut genug, um eine Gegenwelle zu entwickeln, die den Betrieb dieser Geraete ueber grosse Landstriche hinweg stoeren kann. Bevor unsere Gegner ihr Signal anpassen, werden wir den Markt mit unseren geknackten Psiclones ueberschwemmen, die gegen die Stoerung immun sind und ihre Nutzer - nun ja - nicht im Austausch gegen Loyalitaet in eine Alien-Armee zwingen. Das sollte EXALT harmlos genug machen, dass wir uns um die Organisation nicht weiter kuemmern muessen. Geben Sie einfach den Befehl, Kommandant."
  STR_EXALT_BUSTED: "Aufgeflogen"
  STR_EXALT_BUSTED_DESCRIPTION: "Bei einer Drogenrazzia gegen eines der suedamerikanischen Kartelle stiess die Polizei auf massive Beweise fuer eine Beteiligung von EXALT. Der Rat ist nicht ueberrascht, aber ueber das Wachstum der Organisation alles andere als erfreut und erwartet von uns Gegenmassnahmen.{NEWLINE}[-10 Punkte]"
  STR_EXALT_CANE: "Gehstock des EXALT-Meisters"
  STR_EXALT_CANE_UFOPEDIA: "Dieses Meisterstueck eines Spazierstocks wurde fuer seinen Besitzer massgefertigt. So etwas koennen wir nicht einfach bestellen - und ehrlich gesagt, warum sollten wir? Stil hat das Ding allerdings ohne Frage."
  STR_EXALT_ENFORCER_ARMOR: "Kampfanalyse: EXALT-Vollstrecker"
  STR_EXALT_ENFORCER_ARMOR_ADAPTATION: "EXALT-Vollstrecker-Aufbereitung"
  STR_EXALT_ENFORCER_UFOPEDIA: "Vollstrecker sind EXALT-Offiziere, die haeufig kleinere Operationen leiten. Sie arbeiten mit ruecksichtsloser Effizienz und duerfen keinesfalls unterschaetzt werden."
  STR_EXALT_EXECUTIONER: "EXALT-Executioner"
  STR_EXALT_EXECUTIONER_ARMOR: "Kampfanalyse: EXALT-Executioner"
  STR_EXALT_EXECUTIONER_UFOPEDIA: "Diese Eliteagenten von EXALT werden fuer die anspruchsvollsten Missionen eingesetzt, einschliesslich Attentaten. Unter allen EXALT-Kraeften verfuegen sie ueber die besten Kampfqualitaeten und sind nahezu unerschuetterlich. Zusaetzlich sind sie mit einer Reihe spezialisierter Ausruestungsgegenstaende versehen."
  STR_EXALT_GOON: "EXALT-Schlaeger"
  STR_EXALT_GOON_ARMOR: "Kampfanalyse: EXALT-Schlaeger"
  STR_EXALT_GOON_UFOPEDIA: "Diese Leute sind die Berufssoldaten von EXALT. Sie sind gut ausgebildet, entschlossen und mental nur schwer zu brechen. Auch ihre koerperlichen Faehigkeiten sind aussergewoehnlich."
  STR_EXALT_HQ: "EXALT-HQ"
  STR_EXALT_HQ_UFOPEDIA: "Wir wissen inzwischen, dass EXALT Psiclone nicht selbst herstellt. Die Geraete werden ueber ein noch geheimeres Netzwerk geliefert. Dieses Netzwerk unterhaelt einen staendigen Vertreter, der sich in der Hauptoperationsbasis von EXALT aufhaelt. Mehr noch: Dieser Vertreter soll angeblich ein Halb-Alien sein. Wenn wir diesen geheimnisvollen Hybriden gefangen nehmen und verhoeren, sollten wir in der Lage sein, die Versorgungskette fuer Psiclone zu zerschlagen. Ohne Psiclone wird EXALT unweigerlich zusammenbrechen.{NEWLINE}Wir haben inzwischen genug Daten, um die Hauptbasis von EXALT bald zu finden. Sie werden benachrichtigt, sobald wir zuschlagen koennen. Natuerlich wird diese Operation aeusserst anspruchsvoll sein, also bereiten Sie Ihre besten Agenten und Ihre beste Ausruestung vor."
  STR_EXALT_INDUSTRIAL_ACCIDENT_DESCRIPTION: "Eine Explosion hat eine Psiclone-Montageanlage in {0} zerrissen, zahlreiche Kultmitglieder getoetet und erhebliches Aufsehen erregt. Wahrscheinlich sind dabei mehrere Psiclones verschwunden. Der Rat ist maessig frustriert ueber unsere Unfaehigkeit, solche Zwischenfaelle zu verhindern.{NEWLINE}[-100 Punkte, Psiclone x1 erhalten]"
  STR_EXALT_INFILTRATOR_ARMOR: "Kampfanalyse: EXALT-Infiltrator"
  STR_EXALT_INFILTRATOR_UFOPEDIA: "Diese Buerger bilden die niederrangigen Agenten der Organisation EXALT. Die meisten von ihnen fuehren ihr normales Leben weiter und warten still auf Befehle von oben. Andere kuemmern sich um den Vertrieb der Superdroge Psiclone, und eine kleine Zahl ist sogar direkt an Terroranschlaegen beteiligt. Hatte ich schon erwaehnt, dass sie alle schwer von Psiclone abhaengig sind? Nun, jetzt wissen Sie jedenfalls, warum sie der Organisation so hingebungsvoll dienen."
  STR_EXALT_LIQUIDATOR: "EXALT-Liquidator"
  STR_EXALT_LIQUIDATOR_ARMOR: "Kampfanalyse: EXALT-Liquidator"
  STR_EXALT_LIQUIDATOR_ARMOR_ADAPTATION: "Anpassung der EXALT-Liquidator-Ruestung"
  STR_EXALT_LIQUIDATOR_UFOPEDIA: "Liquidatoren sind Eliteagenten von EXALT und dienen als Spezialkraefte ihrer Oberherren - meist, um Schrecken zu verbreiten. Sie sind gut ausgebildet, mit hochwertiger Koerperpanzerung ausgestattet und ihrer Sache vollstaendig ergeben ... oder eben ihren Psiclones."
  STR_EXALT_MASTER_ARMOR: "Kampfanalyse: EXALT-Meister"
  STR_EXALT_MASTER_UFOPEDIA: "EXALT-Meister sind genau das, was der Name vermuten laesst: die Strippenzieher innerhalb der Organisation. Es sind sehr wohlhabende Menschen, die ihre gewaltigen Mittel in den Psiclone-Handel investieren. Jeder Meister verfuegt ueber eine Privatarmee und ist insgesamt aeusserst gefaehrlich, stellt im direkten Kampf aber kein besonderes Risiko dar."
  STR_EXALT_NETWORK: "EXALT-Netzwerk"
  STR_EXALT_NETWORK_UFOPEDIA: "Dank seines Monopols auf Psiclone und der Rueckendeckung wohlhabender Foerderer ist EXALT ausserordentlich einflussreich. Seine Agenten stammen aus allen sozialen Schichten, doch die Organisation wird im Kern von Personen mit engen Verbindungen zu den politischen Eliten der Amerikas gefuehrt. Wenn wir diese Leute erreichen wollen, muessen wir ihre Delegierten ausfindig machen - jene, die die Verteilung von Psiclone ueberwachen, mittlere Operationen befehligen und aehnliche Aufgaben uebernehmen. Sie aufzuspieren duerfte nicht allzu schwer sein; ich gebe Bescheid, sobald sich etwas ergibt."
  STR_EXALT_OPERATIONS: "EXALT-Operationen"
  STR_EXALT_OPERATIONS_PREQ: "Voraussetzung: EXALT-Operationen"
  STR_EXALT_OPERATIONS_UFOPEDIA: "Wir haben inzwischen genug Daten, um einige Kanaele zu den herrschenden Eliten von EXALT aufzudecken. Es handelt sich um reiche Leute mit ausserordentlich gut geschuetzten Identitaeten, doch gelegentlich koennen wir ein Versteck oder ein Treffen eingrenzen, bei dem wichtige Informationen an Untergebene weitergereicht werden. Einen solchen Ort anzugreifen wird angesichts der Sicherheitsvorkehrungen schwer, aber es ist unsere einzige echte Chance.{NEWLINE}{NEWLINE}{NEWLINE}Ausserdem werden wir uns von nun an nicht mehr mit EXALT-Unterschluepfen aufhalten; solche Aufgaben gehen kuenftig an die Rats-Bergungstrupps."
  STR_EXALT_RATIONALE: "EXALT: Beweggruende"
  STR_EXALT_RATIONALE_UFOPEDIA: "Es zeigt sich, dass EXALT kein monolithischer Block ist. Ein Teil ihrer Eliten glaubt, die Ausserirdischen seien im Vergleich zu den Regierungen der Erde das kleinere Uebel - Regierungen, die aus ihrer Sicht ineffektiv und von falschen Ideologien korrumpiert seien. Andere sehen in ihnen schlicht eine weitere Profitquelle wie jede andere Machtstruktur. Diese Meinungsvielfalt betrachten sie nicht als Gefahr, sondern als inneren Diskurs, der die Schlagkraft der Organisation nicht schwaecht, sondern als eine Art gesunden Wettbewerb verschiedener Linien - eine Form politischen Darwinismus. Teilweise extremistisch, teilweise unternehmerisch gepraegt, sind sie jedenfalls gut bewaffnet und entschlossen, ihren kuenftigen ausserirdischen Herren zu dienen."
  STR_EXALT_RETALIATION: "Vergeltung durch EXALT"
  STR_EXALT_SHADOW: "Der Schatten von EXALT"
  STR_EXALT_SHADOW_DESCRIPTION: "So schwer fassbar das Netzwerk von EXALT auch bleibt, sein Einfluss auf die Welt waechst stetig. In {0} hat die Organisation kuerzlich genug Unterstuetzung gesammelt, um sich erhebliches politisches Gewicht zu sichern. Unsere Foerderer sind zutiefst beunruhigt.{NEWLINE}[-300 Punkte]"
  STR_EXALT_UFOPEDIA: "EXALT ist eine verdeckt operierende Organisation, die vor allem in den Amerikas aktiv ist. Sie wurde von einer Gruppe maechtiger Personen mit politischen Verbindungen gegruendet und scheint in verschiedenste kriminelle Aktivitaeten verstrickt zu sein, etwa in den illegalen Drogenhandel. Ihr Markenzeichen sind mentale Geraete namens Psiclones, denen eine stark psychoaktive Wirkung nachgesagt wird. Es besteht kaum Zweifel daran, dass diese Apparate ausserirdischen Ursprungs und wahrscheinlich aeusserst gefaehrlich sind."
  STR_EXCAVATOR_FRAME: "Excavator-Huellenrahmen"
  STR_EXORCISM_IN_BLOOD_UFOPEDIA: "In den 1980er Jahren nahmen einige 'Teufelsanbeter' Zuflucht auf einem Bauernhof nahe Wojslawice in Polen. Kurz darauf wurde das Dorf von einer Reihe unheilvoller Vorfaelle heimgesucht, von Tieren, die vollstaendig ausgeblutet aufgefunden wurden, bis hin zu abnormem Wetter. Einige Einwohner wandten sich an die Behoerden, doch die Faelle wurden als bizarre Zufaelle abgetan und die Hinweisgeber als aberglaeubisch belaechelt. Die Geschichte endete abrupt, als die gesamte Sekte in einer einzigen Nacht mit einer Mischung aus Waffen aus dem Zweiten Weltkrieg und einfachem Bauernwerkzeug ermordet wurde. Die Taeter wurden nie gefunden, und alle Unterlagen zu dem Fall verschwanden rasch in den riesigen Archiven des Ministeriums fuer Staatssicherheit. Dennoch fluestern einige damalige Milizionaere, heute laengst im Ruhestand, noch immer von grauenvollen Funden auf dem Hof: ein Altar mit blasphemischer Ikonografie, ein Lager voller unbekannter und widerlicher Fluessigkeiten, primitive Zellen fuer Menschenopfer, ein riesiger magischer Kreis in der Scheune und vieles mehr. Die ganze Geschichte ist bis heute nicht vollstaendig verstanden, doch alle Beteiligten sind sich einig, dass dort etwas Schreckliches verhindert wurde."
  STR_EXO_TROOPER: "Exotrooper"
  STR_EXO_TROOPER_ARMOR: "Exotrooper-Kampfanalyse"
  STR_EXO_TROOPER_UFOPEDIA: "Exotrooper haben einen wissenschaftlichen Hintergrund und einen unstillbaren Entdeckerdrang. Sie tragen verstaerkte Exoanzuege, die sie vor lebensfeindlichen Umgebungen schuetzen."
  STR_EXPEDITION_DIMENSION_X_UFOPEDIA: "Obwohl der Rat uns die Erkundung der fremden Welt Dimension X verboten hat, haben wir Zugang zu einigen ihrer Artefakte ausgehandelt. Wir mussen nur eine 'Bergungsmission' ordern und alle Kosten ubernehmen..."
  STR_EXPEDITION_PLANET_SURVEY_UFOPEDIA: "Unser Sonderabkommen mit dem Bergungskorps des Erdenrats erlaubt es uns, seine Dienste fuer planetare Erkundungsmissionen in Anspruch zu nehmen. Bestellen Sie die Untersuchung einfach, indem Sie den Gegenstand 'Landvermessung' im Lager erwerben. Die Vermessung benoetigt sieben Tage, bis sie eintrifft. Sobald das Ergebnis vorliegt, koennen Sie es in den Werkstaetten auswerten, um einen zufaelligen Fund zu bergen. Rechnen Sie allerdings damit, dass manche Expeditionen nichts Interessantes finden - oder Schlimmeres."
  STR_EXPEDITION_SEA_UFOPEDIA: "Die Grundung der Firma 'Hydrospace Dynamics' erlaubt uns, das Meer vermessen zu lassen und eventuell auerirdische Materialien zu bergen. Ordern Sie eine solche Erkundungsmission, indem Sie einfach eine 'Meeresexpedition' kaufen. Dieser Auftrag benotigt 30 Tage. Sobald die Expedition wieder eintrifft, verarbeiten Sie sie in der Werkstatt, um ein zufalliges Ergebnis zu erhalten."
  STR_EXTINGUISHER_TANKS_UFOPEDIA: "Chemische Waffen der Hybriden sind aufgrund ihrer Funktionsweise auch fahig, Chemikalien zu verspruhen, die Leben retten, nicht beenden. Daher konnen wir sie als handlichere Feuerloscher einsetzen."
  STR_FACTION_ILLUMINATI: "Illuminati"
  STR_FACTION_ILLUMINATI_CLUE: "Illuminati-Hinweis"
  STR_FACTION_ILLUMINATI_UFOPEDIA: "Die Illuminati sind seit Jahrhunderten die einflussreichste Fraktion im Erdenrat und der wichtigste politische Rueckhalt der X-Com-Initiative. Ihr Programm setzt auf Individualitaet und Menschenrechte, weil sie ueberzeugt sind, dass eine funktionsfaehige Gesellschaft auf Wahlfreiheit angewiesen ist. Statt offen zu herrschen, lenken sie die Massen lieber aus dem Schatten heraus mit weicher Macht, vor allem durch subtile Kontrolle von Informationen. Als derzeitige Vormacht im Rat konzentrieren sie sich in erster Linie darauf, den politischen Status quo zu bewahren, und betrachten tiefgreifende Reformen meist als Bedrohung. Ihr langfristiger Plan ist stetige Entwicklung ohne abrupte Umbrueche: eine Zukunft, in der die Menschen frei von Gefahr und Armut leben, dafuer aber auch spirituell entleert und leicht zu regieren sind."
  STR_FACTION_MAJESTIC_12_CLUE: "Majestic 12-Hinweis"
  STR_FACTION_MAJESTIC_12_UFOPEDIA: "Traditionell als die Bruderschaft bekannt, stieg diese Organisation nach dem Fall Roms auf und blieb bis ins Spaetmittelalter hinein die praegende Macht. Diese Fraktion ist ueberzeugt, dass Menschen von Natur aus unterschiedlich stark oder gross sind: Die Schwachen sollen den Starken nacheifern, und die Starken sollen durch ihr Beispiel fuehren. Aus dieser Sicht erscheinen die Ausserirdischen als die ueberlegene Macht, und ein Beitritt der Erde zu ihrem geheimnisvollen Imperium wirkt beinahe folgerichtig. Majestic 12 versucht verzweifelt, seine fruehere Stellung zurueckzugewinnen, und scheut sich nicht, zu zeigen, wie sie zu ihrem anderen Namen kamen: der Assassinenorden."
  STR_FACTION_THE_GRID: "The Grid"
  STR_FACTION_THE_GRID_CLUE: "Hinweis zu The Grid"
  STR_FACTION_THE_GRID_UFOPEDIA: "Diese Fraktion betrachtet die gesamte Menschheit als ein Gestaltbewusstsein, eine einzige Schwarmintelligenz, die gehegt und gelenkt werden muss, damit sie gesund wachsen kann. Ohne grundsaetzlich antiindividualistisch zu sein, sieht sie einzelne Menschen vor allem als widerwillige Zellen dieses weit groesseren Wesens. Um dieses entstehende Bewusstsein formen und steuern zu koennen, konzentriert sich ihre Forschung auf die Manipulation saemtlicher Informationen - ob gesprochen, geschrieben, ausgestrahlt oder psi-kodiert. Bislang ist es ihnen jedoch nicht gelungen, den richtigen Weg zu finden, eine Spezies zu 'erziehen'. Deshalb besteht ihre politische Praxis vor allem darin, die Illuminati bei der Entfernung neuer, ungetesteter Elemente aus der Weltpolitik zu unterstuetzen, waehrend sie nebenbei von einer kuenftigen Medienrevolution traeumen."
  STR_FEMALE_CIVILIAN_WHISTLEBLOWER_ARMOR: "Kampfanalyse: Besorgte Buergerin"
  STR_FEMALE_MAGMA_POWER_GRUNT: "M.A.G.M.A.-Exo-Sturmsoldat"
  STR_FEMALE_MAGMA_SECURITY: "M.A.G.M.A.-Sicherheitskraft"
  STR_FEMALE_MAGMA_SECURITY_ARMOR: "Kampfanalyse: M.A.G.M.A.-Sicherheitskraft"
  STR_FEMALE_STORMY: "Stormy (weiblich)"
  STR_FEMALE_STORMY_ARMOR: "Kampfanalyse: Stormy (weiblich)"
  STR_FENRIR: "Fenrir-Wolf"
  STR_FENRIR_ARMOR: "Kampfanalyse: Fenrir-Wolf"
  STR_FENRIR_AUTOPSY: "Autopsie: Fenrir-Wolf"
  STR_FENRIR_AUTOPSY_UFOPEDIA: "Fenrir-Woelfe sind grosse Hundeartige, die sich von gewoehnlichen Woelfen vor allem durch ihre Groesse unterscheiden. Kraeftig entwickelte Muskulatur verleiht ihnen enorme Staerke und Beweglichkeit sowie einen gewissen Schutz vor Projektilen. Andererseits ist ihr Fell anfaellig fuer Feuer."
  STR_FENRIR_CORPSE: "Leiche eines Fenrir-Wolfs"
  STR_FENRIR_TERRORIST: "Fenrir-Wolf"
  STR_FENRIR_UFOPEDIA: "Fenrir-Woelfe sind grosse, kraeftige und ausserordentlich aggressive Hundeartige. Anders als gewoehnliche Woelfe leben sie als Einzelgaenger, was sich vermutlich durch ihren enormen Nahrungsbedarf erklaeren laesst. Meist tauchen Fenrir-Woelfe in kalten Regionen der Nordhalbkugel auf, doch man hat sie auch schon weiter suedlich in gemaessigten Zonen beobachtet. Sie greifen alles an, was sie fuer Beute halten, einschliesslich Menschen und sogar Fahrzeuge. Auch wenn sie nicht zahlreich sind, koennen sie fuer menschliche Gemeinschaften zu einem ernsten Problem werden.{NEWLINE}Ihr schimmerndes Fell macht sie zudem schwerer ins Visier zu nehmen."
  STR_FENRIR_WEAPON: "Fenrir-Biss"
  STR_FETID_FOUL_FOREST_INVESTIGATION_UFOPEDIA: "Protokoll von Agent Qadir und Agent Beaumont.{NEWLINE}X-01: Wir sind eingetroffen und haben uns in einer Jagdhutte eingerichtet. Der Wald stinkt, genau wie man munkelt. Etwas fuhlt sich falsch an.{NEWLINE}X-02: Wir haben den Wald untersucht. Auer dem Geruch stellen wir das Fehlen von Bodentieren fest. Vogel gibt es.{NEWLINE}X-03: Einkauf im Stadtchen. Wir horten Geruchte uber eine Hexe im Wald. Na also.{NEWLINE}X-04: Wir besuchten das mutmaliche 'Hexenhaus'. Nur eine alte Dame. Freundlich. Weitere Untersuchung identifizierte sie als Witwe eines Holzfallers.{NEWLINE}X-05: Andere Spur: Das alte Versteck einer Verbrecherbande vor einigen Jahrzehnten. Nichts. Nicht ein Piep psychischer Energie. Wir glauben, dieser Ort ist eine Niete. Wir wissen aber noch nicht, was so stinkt.{NEWLINE}X-07: Ratsel gelost: es ist eine einheimische Pflanze. Uberjagung hat Hirsche ausgerottet: die Pflanze gedeiht. Akte geschlossen.{NEWLINE}Status: Keine spirituelle Manifestation gefunden."
  STR_FIGHTER_SHIP_FRAME: "Jaeger-Huellenrahmen"
  STR_FIRST_DEICIDE: "Erster Goettermord"
  STR_FIRST_DEICIDE_UFOPEDIA: "Ein Professor fuer Alte Geschichte trat mit radikalen Theorien ueber antike Ausserirdische an die Oeffentlichkeit. Seiner Ansicht nach hatten sie die Erde schon vor langer Zeit besucht und versucht, sie zu beherrschen, seien jedoch von Menschen zurueckgeschlagen worden. Zunaechst wirkte das wie ein billiger Versuch, mediale Aufmerksamkeit zu erzeugen, doch mit der Zeit radikalisierte sich der Autor weiter. Er behauptete nun, die Ausserirdischen wuerden mit hoher Wahrscheinlichkeit zurueckkehren und wir muessten uns darauf vorbereiten, sie erneut zu besiegen. Zudem veroeffentlichte er eine Reihe langer Aufsaetze, in denen er die Ueberlegenheit der menschlichen Spezies ueber jede andere denkbare vernunftbegabte Lebensform betonte und eine Rueckkehr zu einem einfachen, laendlichen Leben propagierte, um unsere natuerlichen Staerken zu schaerfen. Nachdem man ihn schliesslich von der Universitaet entfernt hatte, sammelte er einen Kreis von Anhaengern um sich und gruendete in Guyana eine Gemeinschaft, die sich auf die 'Apokalypse' vorbereiten sollte. Ob diese Gemeinschaft noch existiert, ist unklar; jede Spur von ihr verlor sich."
  STR_FLOATER_CENTURION: "Schweber-Centurion"
  STR_FLOPPY_DIMENSION_X: "Dimension-X-Forschungsnotizen"
  STR_FLOPPY_DIMENSION_X_UFOPEDIA: "Verschiedene Forschungsdaten, gesammelt von Mitgliedern des Cyberweb, ueber zahlreiche Aspekte der Alienwelt jenseits der Dimensionstore. Zwar schlecht organisiert, aber von echtem wissenschaftlichem Wert und moeglicherweise nuetzlich, um mehr ueber diese exotische Umgebung und ihre Bewohner zu erfahren."
  STR_FN_FAL_BUY_STR_M14_BUY_STR_GALIL_BUY: "Beschaffung: FN FAL, M14 oder Galil"
  STR_FOLLOW_THE_ZOMBIES: "Den Zombies folgen"
  STR_FOLLOW_THE_ZOMBIES_PREQ_A: "Voraussetzung A: Den Zombies folgen"
  STR_FOLLOW_THE_ZOMBIES_PREQ_B: "Voraussetzung B: Den Zombies folgen"
  STR_FOLLOW_THE_ZOMBIES_UFOPEDIA: "Mithilfe der Informationen der Grabwaechter haben wir die bekannten Zombiestaemme kartiert. Einige Spuren fuehrten uns in verborgene Hoehlen, die tief in die Erde hineinreichen. Offenbar leben die Zombies dort unten, voellig unbeeindruckt von Dunkelheit und Hitze. Nach allem, was wir ueber ihre Oekologie wissen, koennte es dort ganze Horden geben. Unsere bisherigen Begegnungen mit Zombies waren demnach wohl nur die Spitze des Eisbergs.{NEWLINE}Wie auch immer: Wir sollten diese Unterwelt ueberwachen. Diese Zombies koennten uns zu ihren Herren fuehren."
  STR_FORCE_MASTER: "Force-Meister"
  STR_FORCE_MASTER_DISASSEMBLY: "D/A: Force-Meister"
  STR_FORCE_MASTER_H_UC: "FORCE-MEISTER"
  STR_FORCE_MASTER_UFOPEDIA: "Diese modifizierte Version des Power Suit kann nur von Hybriden getragen werden. Fuer Psioniker gedacht, opfert sie Beweglichkeit zugunsten zusaetzlichen Schutzes und besitzt einen integrierten roten Schildtyp (Kapazitaet: 125, Wiederherstellung: 50/Runde)."
  STR_FORCE_SUIT: "Force-Anzug"
  STR_FORCE_SUIT_H_UC: "FORCE-ANZUG"
  STR_FORCE_SUIT_UFOPEDIA: "Diese ungewoehnliche Kleidung enthaelt psionische Schaltkreise, die die natuerliche Psi-Verteidigung unserer Hybriden verstaerken und modulieren. Dadurch erhalten sie einen roten Schildtyp (Kapazitaet: 75, Wiederherstellung: 25/Runde)."
  STR_FORCE_WARSUIT: "Force-Kampfanzug"
  STR_FORCE_WARSUIT_H_UC: "FORCE-KAMPFANZUG"
  STR_FORCE_WARSUIT_UFOPEDIA: "Diese Ruestung kann nur von Hybriden benutzt werden. Durch eine ungewoehnliche Verwendung optronischer Technologie verbindet sie die Widerstandsfaehigkeit und Beweglichkeit von Tritanium-Ruestung mit einem roten Schildtyp (Kapazitaet: 75, Wiederherstellung: 25/Runde)."
  STR_FOREST_LODGE: "Waldhaus"
  STR_FOREST_LODGE_DEFENSE: "Ermittlung: Alter Ritter"
  STR_FOREST_LODGE_DEFENSE_BRIEFING: "Sie haben den Ort erreicht. Doch noch bevor Sie sich einrichten koennen, bricht ploetzlich eine Horde Zombies aus dem Wald hervor! Uebernehmen Sie das Kommando ueber das Personal und die anderen Gaeste, um sich zu verteidigen. Hilfe ist unterwegs; Sie muessen diese Stellung 20 Runden lang halten. Viel Glueck!"
  STR_FOREST_LODGE_DEFENSE_COMPLETED: "Verteidigung des Waldhauses abgeschlossen."
  STR_FOREST_LODGE_DEFENSE_DESCRIPTION: "Der Zombie-Ritter wurde in der Naehe eines abgelegenen Ferienhauses gesichtet. Wir muessen davon ausgehen, dass der Ort ueberwacht wird. Um keine Aufmerksamkeit zu erregen, schicken Sie nur einen Agenten zur Untersuchung. Vielleicht koennen wir diese legendaere Gestalt aufspueren. Wir haben nur diese eine Chance."
  STR_FOUND_ITEMS: "Geborgene Gegenstaende"
  STR_FOUND_ITEMS_UFOPEDIA: "Ihre Mitarbeiter werden saemtliche von Gegnern erbeutete Ausruestung sichern und analysieren. Vieles davon wird weit verbreitet und vertraut sein, etwa gaengige Waffen, doch manches duerfte aeusserst ungewoehnlich sein. Selbst ein vergleichsweise haeufiger Gegenstand muss analysiert werden, damit wir unseren Agenten und Mitarbeitern dazu einheitliche Informationen bereitstellen koennen. Solche standardisierten Daten in unseren Unterlagen sind zudem Voraussetzung dafuer, die jeweilige Waffe offiziell zu beschaffen. Sie halten das vielleicht fuer ueberfluessige Buerokratie, Kommandant - genau deshalb bin ich hier, um sicherzustellen, dass uns das Chaos nicht verschlingt.{NEWLINE}Ihre Ufopaedia enthaelt Informationen zu jeder analysierten Ausruestung, ihren Werten und - sofern bekannt - ihrer Herkunft."
  STR_FRIENDS_ON_THE_COUNCIL_01: "X-Coms Freunde im Erdenrat"
  STR_FRIENDS_ON_THE_COUNCIL_01_UFOPEDIA: "Es gibt einige Mitglieder des Erdenrats, auf deren Unterstuetzung wir uns verlassen koennen. Behandeln Sie diese Liste als streng vertraulich:{NEWLINE}{NEWLINE}- Phil Winterleitner{NEWLINE}- Mihko Mayestewan{NEWLINE}- William B. Gray{NEWLINE}- Frank Kirby{NEWLINE}- Christopher A. Green{NEWLINE}- Alex Finnik Grichuk{NEWLINE}- Ivan Evseev{NEWLINE}- Kurt Majka{NEWLINE}- Alexander Brasher{NEWLINE}- David Siegrist{NEWLINE}- James Cheese{NEWLINE}- Dr. Hadriex{NEWLINE}- Svyatoslav Brain"
  STR_FRIENDS_ON_THE_COUNCIL_02: "X-Coms Freunde im Erdenrat (Fortsetzung)"
  STR_FUSION_BALL_LAUNCHER_DISASSEMBLY: "D/A: Fusionskugelwerfer"
  STR_GANG_CAVEMEN: "Subkultur: Cavemen"
  STR_GANG_CAVEMEN_UFOPEDIA: "Diese Leute vertreten eine sehr entschiedene Haltung zu der Moeglichkeit, dass die Menschheit ausserirdische Urspruenge haben koennte: Sie bestreiten es lautstark. Mit Pelzen und Leder demonstrieren sie ihren Stolz als 'selbst erzogene, selbstgenuegsame vernunftbegabte Spezies' und folgen einer lockeren Mischung aus New-Age-Ideen, etwa dem Glauben an Wiedergeburt oder Veganismus. Obwohl die meisten von ihnen gut gebildet sind, scheinen sie fuer einfache Formen der Informationsmanipulation erstaunlich anfaellig zu sein."
  STR_GANG_EASY_RIDERS_UFOPEDIA: "Easy Riders stammen aus Trailerpark-Milieus rund um die Welt - genauer gesagt aus deren besonders staatsfeindlichem Randbereich. Ihr Ziel ist totale persoenliche Freiheit, vor allem bei Bewegungsfreiheit und Privatsphaere. Sie meiden regelmaessige Arbeit, nehmen aber oft seltsame Auftraege an, legal oder eben nicht. Die meisten sind redegewandt und dafuer bekannt, sich geschickt mit Menschen in Machtpositionen zu vernetzen, was ihrer Sache enorm hilft."
  STR_GANG_LUCHADORES_UFOPEDIA: "Auf der Strasse geht ein seltsames Geruecht um: Wer einen Zombie isst, gewinnt unmenschliche Kraft und Vitalitaet - und angeblich auch sexuelle Ausdauer. Die Luchadores haben das tatsaechlich ausprobiert. Und in ihrem Fall hat es funktioniert. Wir wissen nicht genau, warum, aber manche Menschen koennen offenbar Zombieblut aufnehmen und daraus Bioenergie freisetzen, was ihnen schlagartig einen enormen koerperlichen Schub verleiht. Der Prozess ist gefaehrlich und schmerzhaft, mit massiver koerperlicher Belastung und tagelangem Fieber, aber die Resultate sind beeindruckend. Allerdings leidet darunter auch der Verstand, und destruktives Verhalten scheint haeufiger vorzukommen. Wir bleiben besser bei unseren X-Com-Methoden.{NEWLINE}Luchadores leben gewoehnlich in kleinen Gruppen und verteidigen ihr Revier mit grosser Aggressivitaet. Vorsicht: Man unterschaetzt sie leicht."
  STR_GANG_MOTOR_MEN: "Subkultur: Motor Men"
  STR_GANG_MOTOR_MEN_UFOPEDIA: "Diese Leute sind ueberzeugt, dass bereits irgendeine Form von Krieg laeuft - und dass wir ihn laengst verloren haben. Gleichzeitig glauben sie, dass sich ohnehin nie etwas aendert und die Menschheit irgendwie ueberleben wird. Leb schnell, stirb jung und stiehl der dem Untergang geweihten Zivilisation den letzten Tropfen Energie: Das ist ihr Motto. In der Praxis ziehen sie von Kleinstadt zu Kleinstadt, verbreiten Chaos und nehmen sich, was sie brauchen."
  STR_GANG_PINKY_DEVILS: "Subkultur: Pinky Devils"
  STR_GANG_PINKY_DEVILS_UFOPEDIA: "Diese Gruppe folgt einer Kultur, die sich um Okkultismus und Mode dreht: Preise Luzifer und sieh dabei gut aus. Diese, nun ja, Religion hat nicht viele Mitglieder, doch sie nehmen haeufig an allerlei Ritualen teil - vom Fenstereinwerfen 'fuer Satan' bis hin zu ausgesprochen interessanten Orgien. Ausserdem stehen sie oft unter Drogen, also ist Vorsicht angebracht.{NEWLINE}Die genauen Lehren ihres Glaubens kennen wir nicht, denn beinahe jedes Mitglied scheint seine eigene Version davon zu haben. Einig sind sie sich nur darin, dass es daemoniische Wesen gibt und dass sie selbst als solche wiedergeboren werden wollen. Irgendetwas stimmt mit ihnen definitiv nicht."
  STR_GANG_STORMIES_UFOPEDIA: "Einige ausserirdische Technologien haben ihren Weg auf den Schwarzmarkt der Erde gefunden, darunter das sogenannte Storm: eine billige Kopie des Serums der Morgenroete. Diese sehr teure Substanz erwies sich fuer ernsthafte Kunden als nicht wirksam genug, also beschlossen die Haendler, stattdessen unsichere, aber entschlossene und wohlhabende Jugendliche ins Visier zu nehmen. Mit dem Versprechen koerperlicher Perfektion motivierten sie diese Jugendlichen so sehr, dass einige das Serum durch starken Willen und konsequente koerperliche Aktivitaet tatsaechlich aktivieren konnten. Heute als Stormies bekannt, pflegen diese Kids ihre Subkultur aus koerperlicher Leistungsfaehigkeit, Kampfkraft und freier Liebe - eine Subkultur, die in Wahrheit von den Lieferanten des Serums geschaffen wurde. Im Grunde sind es also bloss grosse Nerds.{NEWLINE}Und ehrlich gesagt sollten wir diesen Handel mit Alien-Technologie stoppen. Wer weiss, was als Naechstes kommt?"
  STR_GANG_TECH_WIZARDS_UFOPEDIA: "Wizkids bewegen sich am Rand des Graumarkts, wo ungewoehnliche Technologie gekauft und verkauft wird. Sie sind klug und wohlhabend und suchen solche Artefakte nicht in erster Linie fuer Geld oder Macht, sondern fuer das Gefuehl, mehr als nur ein gewoehnlicher Sterblicher zu sein. Sie betrachten die Menschheit als 'ignorante Massen' und haben offen das Ziel, von ihr zu leben, wann immer es geht. Zugleich glauben sie, dass sie nach dem Zusammenbruch der uns vertrauten Welt zu denjenigen gehoeren werden, die nach der Macht greifen."
  STR_GANG_WESTMEN: "Subkultur: Westmen"
  STR_GANG_WESTMEN_UFOPEDIA: "Westmen nennen sich stolz 'Fluechtlinge der Moderne' und glauben an die Vergeblichkeit menschlicher Zivilisation angesichts der vielen Bedrohungen. Sie wollen eine Alternative aufbauen, nicht in Staedten, die sich leicht zerstoeren lassen, sondern in kleinen, verborgenen Gemeinschaften. Sie reden gern ueber Guerillakrieg, auch wenn sich viele von ihnen gar nicht als Soldaten verstehen. Im Grunde sind sie sich nur in einem Punkt einig: Die Zivilisation ist dem Untergang geweiht, und wenn es so weit ist, wollen sie lieber anderswo sein. Deshalb stehlen sie jede Ressource, die sie in die Finger bekommen, und nennen das dann 'Bergungsoperationen'."
  STR_GAZER_AUTOPSY_UFOPEDIA: "Das einzige groe Auge ist das hervorstechende anatomische Erkennungsmerkmal dieses Aliens. Es hat krustentierartige Eigenschaften aber ist viel hoher entwickelt. Die gedrungene Rustung ist kein Anzug: Kybernetische Implantate ziehen sich hindurch und sind mit den Organen der Kreatur verbunden."
  STR_GEOGRAPHICAL_ECTOPLASMIC_DETECTOR: "Geografischer Ektoplasmadetektor"
  STR_GEOGRAPHICAL_ECTOPLASMIC_DETECTOR_UFOPEDIA: "Nachdem wir den zerstoerten ektoplasmatischen Generator untersucht hatten, kombinierten wir unsere Erkenntnisse mit unserem Wissen ueber Traumtechniken, um zu verstehen, wie ektoplasmatische Erzeugung auf Distanz funktionieren koennte. Tatsaechlich koennen Maschinen offenbar traeumen - sofern sie ueber eine ektoplasmatische Komponente verfuegen, die eine Proto-Bewusstheit aufrechterhalten kann. Ein solches System waere in der Lage, Informationen ueber globale Distanzen zu uebertragen und so sowohl 'Geisterbeschwoerungen' als auch praktisch unangreifbare Kommunikation ueber ein zentrales Netzwerk zu ermoeglichen. Das Nexus-Geraet muss enorme Energiemengen verbrauchen, was seine Ortung erleichtern sollte. Unser primaerer Fokus liegt jedoch auf den Kommunikationssignalen selbst: Unser Psi-Korps sollte sich in diese Uebertragungen 'hineintraeumen' koennen und hoffentlich den physischen Standort des Nexus aufdecken."
  STR_GERTRUDE_ELLISON_AMBUSH_BRIEFING: "Mit Hilfe von Interpol konnte unsere Aufklarung Getrude Ellison aufspuren, eine Hybridenagentin mit Beteiligung in auerirdischen Entfuhrungen. Der Plan ist, am Treffpunkt, wo sie ihre Opfer ubergeben will, einen Hinterhalt zu legen. Es wird empfohlen, die Feinde lebend zu  fangen und zu verhoren, und zivile Verluste zu verhindern. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_GERTRUDE_ELLISON_INTERROGATION_UFOPEDIA: "Das Miststuck zu verhoren war nicht leicht. Erstens musste ich alle Manner von der Arbeit an dem Fall ausschlieen. Zweitens hat sich mich echt ubel gekratzt. Aber nach einer Weile, als sie ihr auerirdisches Serum nicht rechtzeitig einnehmen konnte, fing sie an, vor unseren Augen rapide zu altern. Gruselig! Aber ihre Willenskraft und psionischen Fahigkeiten schwanden schnell, und so erzahlte sie uns so einiges uber die Auerridischen."
  STR_GHOSTLY_WHISPERS: "Geisterfluestern"
  STR_GHOSTLY_WHISPERS_UFOPEDIA: "Die Verhoere von Mitgliedern der 'Reclamation of Aether' haben mehrere interessante Fakten zutage gefoerdert. Alle erzaehlen im Kern dieselbe Geschichte: Ein Wesen erscheint ihnen im Traum, um sie 'zu fuehren', und waehrend sie seinen Worten und Befehlen folgen, werden sie mit 'arkaner Weisheit' bereichert. Dieses Wesen bietet seinen Opfern mitunter Loesungen fuer persoenliche Probleme an, sodass sie ihm freiwillig folgen und spaeter ueber Traeume und Vorahnungen mit anderen 'Mitgliedern' in Verbindung gebracht werden. Auch ihre Technologie stammt aus dieser Quelle: Sie folgen einer seltsamen Traumlogik, die ihnen von Geistern eingefluestert wird und ihnen verraten soll, wie man Ektoplasma gewinnt, um ihre Konstruktionen anzutreiben. Deshalb gehorcht jeder Objekttyp seiner ganz eigenen 'Logik'. Ein letzter Punkt: Alle bislang erfassten Mitglieder erreichen in unseren Messungen des psionischen Potentials hohe Werte und sind daher besonders empfaenglich fuer diese Art von Kontakt."
  STR_GHOST_DINOSAUR: "Saurian Ghost"
  STR_GHOST_DINOSAUR_ARMOR: "Kampfanalyse: Saurian Ghost"
  STR_GHOST_DINOSAUR_BITE: "Biss des Saurian Ghost"
  STR_GHOST_DINOSAUR_ROAR: "Bruellen des Saurian Ghost"
  STR_GHOST_DINOSAUR_UFOPEDIA: "Dieser zornige Geist hat fossile Ueberreste eines uralten Wesens in Besitz genommen und besitzt dadurch in gewissem Sinn eine materielle Komponente. Er bewegt sich mit stockender Entschlossenheit und dem Blick eines Raeubers. Seine Wirksamkeit im Kampf ist unbestreitbar. Er beisst mit teils immateriellen Zaehnen, die Panzerung weitgehend ignorieren, und bruellt einen psionisch aufgeladenen Schrei, der seine Feinde entmutigt. Darueber hinaus verfuegt er ueber tierische Intelligenz. Das Fleisch an seiner Aussenseite ist nur eine Illusion, duenn wie Haut - so stellt sich das Wesen selbst dar. Wir koennen nicht mit Sicherheit sagen, welcher Tierart es tatsaechlich angehoerte. Unsere Agenten nannten es wegen seiner gedrungenen Haltung jedoch 'Tyrannosquantus Rex'. Akkurat ist das nicht."
  STR_GHOST_EYE: "Ghost Eye"
  STR_GHOST_EYE_ARMOR: "Kampfanalyse: Ghost Eye"
  STR_GHOST_EYE_GAZE_UFOPEDIA: "Mit dieser Faehigkeit greift ein Ghost Eye den Verstand seiner Feinde an. Der Angriff betaeubt, entzieht dem Ziel Energie und kostet es einen Teil seiner aktuellen Zeiteinheiten."
  STR_GHOST_EYE_UFOPEDIA: "Ein kleines ektoplasmatisches Wesen, das in der Regel von hochgradig psionischen Entitaeten erschaffen wird, sich aber gelegentlich auch von selbst bildet. Sein Ursprung haengt mit den Geisteszustaenden Wachsamkeit und Erwartung zusammen. Ghost Eyes eignen sich hervorragend als Spaeher und verfuegen mit dem sogenannten 'Seelenblick' ueber eine begrenzte psionische Kampfoption, die einen X-Com-Agenten behindern oder sogar bewegungsunfaehig machen kann."
  STR_GHOST_NEURALIZER: "Ghost Neuralizer"
  STR_GHOST_NEURALIZER_CLIP: "Ghost-Neuralizer-Magazin"
  STR_GHOST_NEURALIZER_CLIP_UFOPEDIA: "Im Grunde handelt es sich um Ektoplasma, das jedoch mit einem besonderen Energiemuster angereichert wurde, um den Ghost Neuralizer als verfeinerte psionische Waffe anzutreiben."
  STR_GHOST_NEURALIZER_UFOPEDIA: "Eine Waffe, die aussieht, als sei sie aus zufaellig zusammengeschweissten Haushaltsgegenstaenden gebaut worden. Wird sie mit einem speziellen Ektoplasma-Magazin gespeist, aktiviert sie sich und sendet laehmende Strahlen psionischer Energie aus. Besonders wirksam ist sie gegen ektoplasmatische Lebensformen."
  STR_GHOST_PHYSIOLOGY: "Physiologie der Geister"
  STR_GHOST_PHYSIOLOGY_UFOPEDIA: "Zunaechst einmal besitzt ein Geist keinen Koerper im gewoehnlichen Sinn. Was wir sehen, ist eine Verschmelzung aus einer psychoreaktiven Projektion des Beobachters und dem Selbstbild des Geistes, das durch Ektoplasma in Form gebracht wird. Organe gibt es nur dann, wenn der Geist sie fuer seinen persoenlichen Entstehungsmythos benoetigt. Geister sind psychische Rueckstaende intensiver Emotionen, Gedanken und Empfindungen, der Abdruck eines sterbenden Bewusstseins in der umgebenden Noosphaere. Hier IST der Geist der Koerper: Ektoplasma reagiert auf den verbleibenden Willen und formt sich durch das Trauma des Todes - oder durch die Erleichterung danach. Negative Emotionen beobachten wir haeufiger, weil meist nur ausreichend starke Empfindungen einen geisterhaften Abdruck hinterlassen, aber auch positive Gefuehle koennen sich auf diese Weise manifestieren. Kurz gesagt: Wenn wir Geister wirklich untersuchen wollen, muessen wir sie 'lebend' und unaufgeloest in die Finger bekommen."
  STR_GHOST_PLOT: "Die Geisterverschwoerung"
  STR_GHOST_PLOT_UFOPEDIA: "Nach unserer Begegnung mit 'Geistern' in der Nervenheilanstalt fuehrten wir vor Ort eine gruendliche Untersuchung durch. Der entdeckte Ritualkreis deutet darauf hin, dass diese Entitaeten von lebenden Menschen mit besonderem Wissen und entsprechenden Faehigkeiten unterstuetzt, beschworen oder sogar erschaffen wurden. Nach der Ueberpruefung des Personals und der Auswertung saemtlicher verfuegbaren Sicherheitsinformationen konnten wir den Kreis der Verdaechtigen auf nur zwei Personen eingrenzen. Leider ist ihr Aufenthaltsort derzeit unbekannt.{NEWLINE}Weitere Ermittlungen liessen uns zu dem Schluss kommen, dass diese Personen einer geheimen Organisation mit dem Namen 'Reclamation of Aether' angehoeren, die anscheinend mit keiner der Geheimgesellschaften verbunden ist, denen wir bisher begegnet sind. Was immer ihr Ziel sein mag, ihre Existenz stellt sehr wahrscheinlich eine Bedrohung fuer die Menschheit dar. Daher nehmen wir diese Gruppe ab sofort in unsere Massnahmen zur Kriminalitaetspraevention auf."
  STR_GHOST_RANGED_TERROR_BLAST: "Geister-Schreckensimpuls"
  STR_GHOST_RANGED_TERROR_BLAST_UFOPEDIA: "Dieser Angriff ist psionischer Natur. Er richtet nur wenig direkten Schaden an, zerstoert aber die Einsatzfaehigkeit des Ziels durch Moral-, Betaeubungs- und Energieschaden."
  STR_GHOST_TANK: "Geistertank"
  STR_GHOST_TANK_UFOPEDIA: "Der Geistertank ist eine Spezialzelle fuer ektoplasmatische Entitaeten. Er kann bis zu 10 solcher Wesen auf unbestimmte Zeit festhalten."
  STR_GHOST_TOUCH_WEAPON: "Geisterberuehrung"
  STR_GHOST_WILHEARD_RANGED_BLAST: "Schwarze Kunst von Agent Wilheard"
  STR_GHOUL: "Ghoul"
  STR_GHOULISH_GASTRONOMICAL_GARDEN_INVESTIGATION: "Untersuchung: Gespenstischer Gourmetgarten"
  STR_GHOULISH_GASTRONOMICAL_GARDEN_INVESTIGATION_UFOPEDIA: "Protokoll von Agent Gamal und Agent Sousa{NEWLINE}X-01: Wir sind angekommen. Das ist eine grosse laendliche Gemeinde. Wir suchen eine Art gruseligen Garten.{NEWLINE}X-02: Gefunden. Der Ort hat tatsaechlich einen gruseligen Garten. Missgestaltete Kuerbisse. Violette Karotten. Doppelte Kohlkoepfe. Wir misstrauen der Karotte.{NEWLINE}X-03: Ich habe gerade gelernt, dass violette Karotten normal sind. Verdammt.{NEWLINE}X-04: Wir sind hineingeschlichen. Es gibt Gemuese mit Gesichtern, viele Fotos davon, Auszeichnungen und Zeitungsausschnitte. Wir haben keinen Spukgarten gefunden, sondern nur jemanden, der neuartige Huelsenfruechte zuechtet. Er zuechtet sie einfach wirklich.{NEWLINE}X-05: Ich habe einen Kuerbis gekauft. Er sieht aus wie der Leitende Forscher. Ich bin sicher, er wird ihn moegen.{NEWLINE}Status: Keine spirituelle Manifestation festgestellt."
  STR_GHOUL_ARMOR: "Kampfanalyse: Ghoul"
  STR_GHOUL_AUTOPSY: "Autopsie: Ghoul"
  STR_GHOUL_AUTOPSY_UFOPEDIA: "Dieser Zombie ist deutlich schlanker und leichter als die Standardform. Seine Physiologie ist aehnlich, aber der Koerper enthaelt nur wenig energiereiches Plasma. Dagegen ist das Hirngewebe aussergewoehnlich gut entwickelt, einschliesslich fortgeschrittener Strukturen, wie man sie von einem menschlichen Gehirn kennt. Obwohl er nicht wie gewoehnliche Zombies degeneriert, ist ein Ghoul ausserhalb des Schwarms nicht lebensfaehig."
  STR_GHOUL_CORPSE: "Leiche eines Ghouls"
  STR_GHOUL_SOLDIER: "Ghoul"
  STR_GHOUL_UFOPEDIA: "Dieser Zombietyp aehnelt der Grundform, doch eine spezielle Diaet, bereitgestellt von einer Strix, versorgt ihn mit genug Bioplasma, um seinen Stoffwechsel zu stabilisieren - auf Kosten eines Teils seiner Koerpermasse. Darueber hinaus beeinflussen besondere Hormone in dieser Nahrung seine Biologie stark: Statt auf Fortpflanzung ist sein Koerper ganz auf allgemeine Weiterentwicklung ausgerichtet. Ghoule sind schnell, recht kraeftig und ueberraschend intelligent. Sie benutzen Gegenstaende, verstehen einfache Befehle und zeigen soziales Verhalten. Sie sind zu rudimentaerer Sprache faehig, reagieren jedoch kaum auf aeussere Reize und besitzen wenig Selbsterhaltungstrieb. Ihr Fokus liegt ganz auf dem Schutz ihres Schwarms."
  STR_GHOUL_WARRIOR: "Ghoul-Krieger"
  STR_GHOUL_WARRIOR_ARMOR: "Kampfanalyse: Ghoul-Krieger"
  STR_GHOUL_WARRIOR_CORPSE: "Leiche eines Ghoul-Kriegers"
  STR_GIANT_BEETLE_BOMBARDIER_UFOPEDIA: "Diese seltene Art des Riesenkafers kann ein brennbares Gas in seinem Korper bilden. Wenn dieses Gas mit dem Speichel der Kreatur vermischt wird, bildet es ein gefahrliches und auerst abstoendes Brandgeschoss. Zum Gluck sind diese Kreaturen von Natur aus auerst defensiv."
  STR_GIANT_BEETLE_MIGRATION_DESCRIPTION: "In {0} ist ein Schwarm von Riesenkaefern ueber das Land gezogen, hat Einwohner vertrieben und ist schliesslich im Untergrund verschwunden. Das wird im Bericht nicht besonders gut aussehen, Kommandant.{NEWLINE}[-66 Punkte]"
  STR_GILLDOG_AUTOPSY_UFOPEDIA: "Unsere Agenten haben diese Kreatur richtig eingeordnet: sie hat wirklich Lungen und Kiemen. Ihre Schuppenhaut gibt ihr Schutz gegen die meisten Schadensarten, einschlielich chemischen, und ihre Korperstrultur kann groem Druck widerstehen, sei es die Tiefe des Meeres oder Explosionen. Die Kiefer sind machtig und auerst unangenehm."
  STR_GILLMAN_HERO_AUTOPSY_UFOPEDIA: "Dieses Wesen scheint eine groere Abart des Kiemenmenschen zu sein. Die korperlichen Anderungen sind weniger radikal als in einem normalen Exemplar, und alle menschlichen anatomischen Merkmale sind noch vorhanden, wodurch wir es als einen erwachsenen Mann identifizieren konnten. Es enthalt mehrere zusatzliche Implantate, um seine Starke zu verbessern, aber es auch unmittelbarer uber Psi zu kontrollieren, was auf groere geistige Unabhangigkeit hinweist. Seine Rustung scheint unerklarlicherweise von Menschen gemacht, aber sehr hoch entwickelt."
  STR_GILLMAN_HERO_UFOPEDIA: "Nach dem Abriss der Gedankenkontrolle konnten wir mit dem Exemplar kommunizieren. Er scheint seine Menschlichkeit bewahrt zu haben und identifizierte sich, trotz erheblichem Erinnerungsverlust, als 'Dr. Jamrowocky' von den Men in Black.  Er wurde von den Auerirdischen entfuhrt und Experimenten unterworfen, und spater in ihren Aktivitaten als Waffe und 'Haustier' eingesetzt. Er ist dankbar fur die Rettung und will sein gesamtes Wissen uber die Auerirdischen teilen. Er hat zudem seine Rustung gespendet."
  STR_GOALS_OF_APOCALYPSE: "Geheime Ziele der Apokalypse"
  STR_GOALS_OF_APOCALYPSE_UFOPEDIA: "Kommandant, die junge Kollegin aus der Aufklaerungsabteilung zerbrach sich den Kopf ueber ein Raetsel in ihrer Untersuchung des Kults der Apokalypse, also habe ich beschlossen, ihr unter die Arme zu greifen. Ich habe viele Stunden mit religioesen, politischen und propagandistischen Texten des Kults verbracht, und mit Hilfe einer Sprachanalysesoftware konnte ich eine verborgene Botschaft freilegen: Die Menschheit sei in tiefen Schlaf gefallen, und der Kult sehe es als seine Aufgabe, sie aufzuruetteln. Er wolle die Menschheit auf kommende Haerten vorbereiten, die sehr bald ueber uns hereinbrechen sollen. Leider wissen wir noch immer nicht, woher diese Information stammt. Vielleicht muessen wir einfach noch mehr Spuren sammeln."
  STR_GOOD_OSIRON_CRATE: "Verstaerkte Osiron-Kiste"
  STR_GOOD_OSIRON_CRATE_OPENING: "Verstaerkte Osiron-Kiste oeffnen"
  STR_GOOD_OSIRON_CRATE_UFOPEDIA: "Eine raffinierte Kassette mit elektronischem Schloss. Mit Gewalt ist sie nur sehr schwer zu oeffnen."
  STR_GRAVITIC_LIFTER_PREQ: "Voraussetzung: Gravitativer Heber"
  STR_GRAVITIC_LIFTER_UFOPEDIA: "Dieses Geraet ist in der Alien-Architektur allgegenwaertig, weil es so einfach und effizient ist. Es nutzt Gravitationsgeneratoren, um das effektive Gewicht von Gegenstaenden in Reichweite zu veraendern. Das ist eine sichere und verlaessliche Methode, Objekte vertikal zu bewegen, denn die Nettokraft eines normalen Hebers reicht in der Regel nicht aus, um eine Person ernsthaft zu gefaehrden - Absturzschaeden ausgenommen."
  STR_GUN_KATA_UFOPEDIA: "Einige hoeherrangige Mitglieder von EXALT praktizieren ein esoterisches Trainingsprogramm, bei dem sie Psiclone nutzen, um ihre Konzentration mit Schusswaffen zu steigern. Wir koennen diese Technik inzwischen nachvollziehen. Jeder Agent, der dieses Training durchlaeuft, steigert seine Schussgenauigkeit sofort um 10 Punkte und erhaelt zusaetzlich 5 Punkte oberhalb des Normalwerts. Ausserdem verbessert er seine Reaktionen um 5 Punkte. Der Preis dafuer sind dauerhaft 10 Punkte Sanity - aus offensichtlichen Gruenden.{NEWLINE}Voraussetzung: Schussgenauigkeit 60{NEWLINE}Benoetigt Uebungsraum."
  STR_HADRIEX_GUN_CHARGE: "Hadriex-Gewehr-Ladung"
  STR_HADRIEX_GUN_UFOPEDIA: "Dieses technospirituelle Artefakt versprueht ektoplasmatisches Gas, das eine Wirkung aehnlich einem Geisterangriff entfaltet: Schwaeche, Halluzinationen und Aussergefechtsetzung. Das Geraet wird teilweise ueber psionische Faehigkeiten bedient, die Genauigkeit und Feuerkraft beeinflussen."
  STR_HALLUCINOID_AUTOPSY_UFOPEDIA: " In den vielen Lagen dieses gallertartigen Korpers ruht ein hochst wirksamer chemischer Gefrierer, seine Hauptangriffswaffe. Die weiche und elastische Haut des Halluzinoiden scheint gegenuber auf Warme basierenden Angriffen sehr anfallig."
  STR_HALLUCINOID_FREEZE_UFOPEDIA: "Halluzinoide nutzen eine biochemische Waffe aus Tausenden von Nesselzellen. Diese spezialisierten Zellen verschleudern Mikrokanister voll Kuhlstoff, stark genug, um ein gepanzertes Exoskelett zu durchdringen. Diese Kuhlstoffe reagieren endotherm, was das Opfer sofort gefriert. Selbst wenn der Angriff das Opfer nicht totet, verursacht er genug Schock, dass das Opfer aufhort, sich zu wehren, und einfach vom Halluzinoiden gefressen werden kann."
  STR_HALLUCINOID_HUNT_BRIEFING: "Berichte tropfeln ein uber seltsame Kreaturen, als 'ungeheure Quallen' beschrieben, die Kustengebiete heimsuchen. Finden und fangen Sie eines dieser fremden Wesen, bevor sie Schwimmer oder Frachtschiffe bedrohen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_HANGAR_UFOPEDIA: "Jeder Hangar kann ein Gefahrt und 25 Lagereinheiten beherbergen. Es gibt Einrichtungen fur Wartung, Auftanken und Reparatur der Gefahrte(5 Arbeitsplatze). Jedes Gefahrt in einem Stutzpunkt braucht einen freien Hangar, der nicht von anderen Transportmitteln benutzt werden kann, sogar wenn das Gefahrt auf einer Mission ist."
  STR_HARVESTER_FRAME: "Harvester-Huellenrahmen"
  STR_HAUNTED_FARM_BRIEFING: "Mehrere Einheimische berichten eigenartige 'Erscheinungen' auf einem abgelegenen Landstuck. Wir vermuten, dass 'Geister' dort spuken. Nehmen Sie nicht-korperliche Waffen mit. Fangen Sie alle Geister, die sie konnen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_HAUNTED_FARM_DESCRIPTION: "Mehrere Einheimische berichten eigenartige 'Erscheinungen' auf einem abgelegenen Landstuck. Wir vermuten, dass 'Geister' dort spuken. Nehmen Sie nicht-korperliche Waffen mit. Fangen Sie alle Geister, die sie konnen."
  STR_HAUNTED_HOUSE_BRIEFING: "In einem verlassenen, verbarrikadierten Haus wurden von mehreren Einheimischen seltsame 'Erscheinungen' gemeldet, die uns glauben lassen, dass es hier 'spuken' konnte. Bringen Sie nicht-physische Waffen mit. Fangen Sie nach Moglichkeit alle 'Geister' ein. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_HAUNTED_HOUSE_DESCRIPTION: "In einem verlassenen, verbarrikadierten Haus wurden von mehreren Einheimischen seltsame 'Erscheinungen' gemeldet, die uns glauben lassen, dass es hier 'geistern' konnte. Bringen Sie nicht-physische Waffen mit. Fangen Sie nach Moglichkeit alle 'Geister' ein."
  STR_HAVOC_AMMO: "Havoc-Munition"
  STR_HAVOC_AMMO_STR_HK_MK23_SOCOM: "Havoc-Munition fuer Mk23 SOCOM"
  STR_HAVOC_AMMO_STR_HUNTING_RIFLE: "Havoc-Munition fuer Jagdgewehr"
  STR_HAVOC_AMMO_STR_JUDGE_AP_CLIP: "Havoc-Munition fuer Kludge"
  STR_HAVOC_AMMO_UFOPEDIA: "{ALT}Havoc-Munition wurde von EXALT intern entwickelt, um gepanzerte Gegner zu bekaempfen. In den richtigen Haenden bietet sie zusaetzliche Feuerkraft; zugleich ist sie jedoch launisch und reagiert bei unsachgemaesser Handhabung unberechenbar. Deshalb gelten nur die Spezialkraefte von EXALT als gut genug ausgebildet, um diese Munition wirklich effektiv einzusetzen.{NEWLINE}Das Design koennte auch fuer X-Com nuetzlich sein, sofern wir Schuetzen einsetzen, die seine Staerken ausspielen koennen.{NEWLINE}{NEWLINE}Havoc-Munition gewaehrt einen Kraftbonus in Hoehe von 25 % der Schussgenauigkeit. Gleichzeitig senkt sie jedoch die effektive Schussgenauigkeit der Waffe deutlich.{ALT}"
  STR_HAWKS_AND_DOVES_CLUE: "Hinweis: Falken und Tauben"
  STR_HAWKS_AND_DOVES_UFOPEDIA: "Inzwischen ist klar, dass die Ausserirdischen komplexere Plaene verfolgen als einen blossen interplanetaren Vernichtungskrieg. Sie moegen grausam und moerderisch sein, doch sie beabsichtigen offenbar nicht, die Menschheit einfach auszuloeschen, und sie zeigen Bereitschaft zu Verhandlungen. Das mag weiterhin eine Falle sein, aber ein erheblicher Teil des Rates glaubt, dass man mit ihnen zu einer Verstaendigung kommen kann, und einige halten das sogar fuer die bessere Option. Andere misstrauen den Ausserirdischen oder lehnen jede Zusammenarbeit aus grundsaetzlichen Gruenden ab.{NEWLINE}X-Com wurde von Letzteren gegruendet, mit dem Ziel, Alienoperationen auf der Erde zu unterbinden und den Status quo zu bewahren. Ihre Gegner verfuegen jedoch noch immer ueber genug politischen Einfluss, um ein Gegengewicht zu schaffen, das man umgangssprachlich als die Men in Black kennt und das menschlich-ausserirdische Kooperation sichern und erleichtern soll."
  STR_HEART_OF_THE_WOODS: "Herz des Waldes"
  STR_HEART_OF_THE_WOODS_BRIEFING: "Die Pinky Devils nutzen diesen abgelegenen Ort fuer 'verbotene Zauberei', also fuer Rituale, die Menschenopfer einschliessen. Was immer ihr Ziel sein mag, wir duerfen nicht zulassen, dass sie Erfolg haben.{NEWLINE}Warnung: Bei unserer Ankunft wurde das Gebiet ploetzlich in Dunkelheit gehuellt. Wir vermuten uebernatuerliche Kraefte am Werk.{NEWLINE}Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HEART_OF_THE_WOODS_DESCRIPTION: "Die Pinky Devils nutzen diesen abgelegenen Ort fuer 'verbotene Zauberei', also fuer Rituale, die Menschenopfer einschliessen. Was immer ihr Ziel sein mag, wir duerfen nicht zulassen, dass sie Erfolg haben."
  STR_HEAT_VISION_UFOPEDIA: "Waerme- oder Thermalsicht ignoriert fuer die Feinderkennung einen bestimmten Anteil von Rauch (in Prozent). Dies kann durch spezielle Sensortechnik oder durch nicht-visuelle Eingaben wie Geraeusche oder Erschuetterungen erreicht werden. Wie auch immer die Methode funktioniert, sie macht Rauchschirme gegen viele Gegnertypen deutlich weniger wirksam. Trotz des Namens verbessert sie nicht die Nachtsicht.{NEWLINE}Dieser Wert reicht von 0 (kein Bonus) bis 100 (volle Sicht durch Rauch)."
  STR_HEAVY_CANNON_UFOPEDIA: "Die schwere Kanone ist eine verheerende, aber sperrige Waffe. Sie kann mehrere Munitionsarten verschiessen: Vollgeschosse, Schrot, Brand- und Sprengmunition.{NEWLINE}{NEWLINE}Der Kauf dieser Waffe setzt ein Sonderabkommen mit M.A.G.M.A. voraus."
  STR_HEAVY_LASER_MIB_UFOPEDIA: "Diese schwere Laservariante dient als panzerbrechende Waffe. Pro Magazin kann sie 20 Schusse feuern.{NEWLINE}{NEWLINE}Diese Waffe herzustellen benotigt: Schwerer-Laser-Konstruktion."
  STR_HEAVY_LASER_MIB_XD_CLIP: "Schwerer-Laser-XD-Clip"
  STR_HELIX_KNIGHT_UFOPEDIA: "Der Schnittpunkt alles biologischen, technischen und sozialen Potentials der Menschheit, bereit, sie in die Zukunft zu leiten. Helixritter konnen nur aus den besten Agenten ausgewahlt werden, die bereits auf alle anderen Kraftquellen Zugriff haben. Als menschliche Leistung unser eigenes Genom formt, uberschreiten wir die Grenze zwischen Wissenschaft und kosmischer Magie."
  STR_HE_ARRIVED_AT_DUSK: "Er kam in der Daemmerung"
  STR_HE_ARRIVED_AT_DUSK_UFOPEDIA: "Man nannte ihn einfach nur den Fremden. Er war gross, blass, konservativ gekleidet und trug stets eine Sonnenbrille. Nach seiner Ankunft in der Stadt begann er, nach Geistern, Daemonen und anderer lokaler Folklore zu fragen, von der es dort reichlich gab. Ansonsten sprach er kaum, doch gelegentlich erwaehnte er einen 'grossen Wandel', der bald kommen werde, und deutete damit den Zusammenbruch der Gesellschaft sowie die bevorstehende Invasion schrecklicher Wesen an. Was danach genau geschah, ist ungewiss. Sicher ist nur, dass am Morgen nach seinem letzten Auftauchen mehrere angesehene Einwohner verschwunden waren. Einige Tage spaeter fand man im Wald mehrere Leichen - Koerper, die irgendwie noch menschlich wirkten, aber eben nicht ganz..."
  STR_HIDDEN_CAVES_DESCRIPTION: "Eine geheimnisvolle Hohle wurde entdeckt, womoglich ein Tor in die gewaltige Unterwelt. Ihre Mission ist, alle Bedrohungen fur die Auenwelt zu neutralisieren.{NEWLINE}Erwarten sie auerst enge und verschlungene Passagen. Denken Sie daran, Lichtquellen mitzubringen. Sprengstoff mag sich auch als nutzlich erweisen."
  STR_HIDDEN_CAVES_FEW_BRIEFING: "Sie sind dabei, eine unbekannte Hohle zu betreten, womoglich ein Tor in die gewaltige Unterwelt. Ihre Mission ist, alle Bedrohungen fur die Auenwelt zu neutralisieren. Hoffentlich haben Sie Lichtquellen mitgebracht. Viel Gluck!"
  STR_HIDDEN_CAVES_SEVERAL_BRIEFING: "Sie sind dabei, eine unbekannte Hohle zu betreten, womoglich ein Tor in die gewaltige Unterwelt. Ihre Mission ist, alle Bedrohungen fur die Auenwelt zu neutralisieren. Hoffentlich haben Sie Lichtquellen mitgebracht. Viel Gluck!"
  STR_HIDDEN_UNDERWORLD_UFOPEDIA: "Offenbar ist die geheime Welt der Schattenkulte, die wir mutig infiltriert haben, enger verflochten, als wir zunaechst dachten. Zwar halten sich die illegalen Organisationen aus Sorge vor moeglichen Rivalen normalerweise bedeckt, doch manche suchen begrenzte Moeglichkeiten zur Zusammenarbeit. Ihre Agenten tauschen gelegentlich wertvolle Informationen und Ressourcen aus oder kooperieren sogar bei gemeinsamen Zielen. Solche Kontakte bleiben oft selbst den meisten niederrangigen Mitgliedern beider Seiten verborgen."
  STR_HIJACKING_ALIEN_MIB_COMMUNICATIONS: "Ausserirdische/Men in Black-Kommunikation kapern"
  STR_HIJACKING_ALIEN_MIB_COMMUNICATIONS_UFOPEDIA: "Wir haben Zugriff zu Informationen von hohen Offizieren beider Seiten, was uns vielleicht die Moglichkeit gibt, die auerirdischen Operationen zu . Dies sollte uns erlauben, die Ortlichkeiten auf dem Mond zu infiltrieren, wo die hochstrangigen Men in Black sich mit ihren auerirdischen Widerparten treffen und hoffentlich Wissen zu erhalten. das unabdinglich zur Verteidigung des Planeten ist. "
  STR_HK_MK23_SOCOM_HAVOC_CLIP: "Mk23-SOCOM-Havoc-Clip"
  STR_HOLIDAY_RESORT_TERROR_BRIEFING: "Kunstliche Agenten hergestellt von auerirdischen Hybriden haben einen beliebten Touristenort uberfallen. Ihr Ziel ist, die gesamte Bevolkerung zu ermorden und im folgenden Chaos Identitaten einiger Opfer zu stehlen. Wir mussen schnell handeln, um Leben zu retten und die Infiltration zu sabotieren.  Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_HOLODEVICE: "Hologeraet"
  STR_HOLODEVICE_UFOPEDIA: "Ein psionischer Projektor, der es dem Benutzer erlaubt, innerhalb von 15 Feldern virtuelle X-Com-Agenten zu platzieren. Er kann pro Gefecht bis zu 9 Mal verwendet werden."
  STR_HOLY_TRIAL: "Die heilige Probe"
  STR_HOLY_TRIAL_PASSED: "Die heilige Probe bestanden"
  STR_HOLY_TRIAL_PASSED_UFOPEDIA: "Ja, ja! Es ist tatsaechlich ein Goldenes Ankh! Das habt ihr gut gemacht, Verbuendete! Fuer dieses geborgene Artefakt - und fuer jedes weitere in Zukunft - sollt ihr reich belohnt werden.{NEWLINE}Ich werde es nun zu meinen Schwestern bringen. Sicher werden sie jetzt bereit sein, euch anzuhoeren."
  STR_HOLY_TRIAL_UFOPEDIA: "Ich waehlte euch als Verbuendete, weil ich euren Absichten traue. Meine Schwestern tun das noch nicht, also muessen wir sie ueberzeugen. Und ich habe die perfekte Idee: Freche Neugeborene stehlen immer wieder unsere heiligen Relikte, die Goldenen Ankhs. Wenn ihr uns eines davon zurueckbringt, werden sie euch gewiss so sehen, wie ich euch sehe. Ich werde eure Knechte wissen lassen, wann und wo eines davon zu finden ist..."
  STR_HORMONE_REGULATOR_IMPLANTATION_UFOPEDIA: "Eine Verbesserung fur unsere Kyberi, verleiht +5 Ausdauer, eine signifikante Erhohung der Moral und Betaubungs-Regeneration. Jedoch fuhrt die Manipulation des biochemischen Haushalts des Agenten zur Reduktion ihrer Nervenkraft um 10 Punkte.{NEWLINE} Benotigt Krankenstation zur Ausfuhrung."
  STR_HORMONE_REGULATOR_UFOPEDIA: "Ein kompliziertes biomechanisches Gerat, welches konstant die chemische Zusammensetzung des Bluts analysiert und, wenn notig, Hormone freisetzt. Ausgereifter als regulare Kampfdrogen, verbessern sie sowohl Uberlebenschancen als auch physische Leistungsfahigkeit. Benotigt ein kompatibles Kortikalimplantat."
  STR_HOST_MORPH_UFOPEDIA: "Technisch gesehen menschlich, aber ihre Biochemie wurde verandert um eine Lebensform mit einem bizarren, fur uns unerklarlichen Stoffwechsel zu erschaffen, der biologische Energie effektiv in brutale psionische Explosionen umwandelt. Der Prozess benotigt anscheinend eine auere Energieversorgung, aber wir konnten sie nicht finden oder benennen. Psychologisch ist der Wirt eine seltsame Mischung aus Mensch und Auerirdischer, mit unterdrucktem Selbstgefuhl und fanatischer Verehrung ihrer Raum-Gottin. Diese Effekte verblassen mit der Zeit in Gefangenschaft, und der Wirt verwandelt sich langsam wieder in einen normalen Menschen, ohne langfristige Nachwirkungen, allerdings von jungerer Erscheinung und mit schwerer Amnesie."
  STR_HQ_UFOPEDIA: "Das Hauptquartier sammelt Berichte ueber Alienaktivitaeten aus aller Welt und weist den Feldeinheiten ihre Aufgaben zu. Es enthaelt ausserdem ein kleines Labor fuer 5 Wissenschaftler, das grundlegende, biochemische und nachrichtendienstliche Forschung erlaubt. Zusaetzlich bietet es Lagerkapazitaet fuer 25 Ausruestungseinheiten."
  STR_HSD_HABITAT_ATTACK_AQUATOID: "HSD-Unterwasserlabor"
  STR_HSD_HABITAT_ATTACK_AQUATOID_BRIEFING: "Eine Unterwasser-Forschungsbasis von Hydrospace Dynamics wurde von unheimlichen Aquatoids angegriffen! Wir muessen das Personal schuetzen und diese Gelegenheit nutzen, um vielleicht mehr ueber unsere Feinde aus der Tiefe zu erfahren. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zur Tauchkapsel zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HSD_HABITAT_ATTACK_AQUATOID_DESCRIPTION: "Eine Unterwasser-Forschungsbasis von Hydrospace Dynamics wurde von unheimlichen Aquatoids angegriffen! Wir muessen das Personal schuetzen und diese Gelegenheit nutzen, um vielleicht mehr ueber unsere Feinde aus der Tiefe zu erfahren. Vielleicht haelt das Labor wertvolle Hinweise fuer uns bereit.{NEWLINE}Nur unterwasserfaehige Ausruestung erlaubt!"
  STR_HSD_HABITAT_ATTACK_CARCHARODON_BRIEFING: "Eine Forschungsstation von Hydrospace Dynamics wird von barbarischen Carcharodonen angegriffen! Wir mussen die Mitarbeiter beschutzen und die Gelegenheit nutzen, vielleicht mehr uber unsere Feinde aus dem Wasser zu erfahren. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Tauchboot zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_HSD_HABITAT_ATTACK_DEEP_ONE: "HSD-Unterwasserlabor"
  STR_HSD_HABITAT_ATTACK_DEEP_ONE_BRIEFING: "Eine Unterwasser-Forschungsbasis von Hydrospace Dynamics wurde von grausamen Deep Ones angegriffen! Wir muessen das Personal schuetzen und diese Gelegenheit nutzen, um vielleicht mehr ueber unsere Feinde aus der Tiefe zu erfahren. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zur Tauchkapsel zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HSD_HABITAT_ATTACK_DEEP_ONE_DESCRIPTION: "Eine Unterwasser-Forschungsbasis von Hydrospace Dynamics wurde von grausamen Deep Ones angegriffen! Wir muessen das Personal schuetzen und diese Gelegenheit nutzen, um vielleicht mehr ueber unsere Feinde aus der Tiefe zu erfahren. Vielleicht haelt das Labor wertvolle Hinweise fuer uns bereit.{NEWLINE}Nur unterwasserfaehige Ausruestung erlaubt!"
  STR_HSD_HABITAT_ATTACK_LOBSTERMAN: "HSD-Unterwasserlabor"
  STR_HSD_HABITAT_ATTACK_LOBSTERMAN_BRIEFING: "Eine Unterwasser-Forschungsbasis von Hydrospace Dynamics wurde von furchtbaren Lobstermen angegriffen! Wir muessen das Personal schuetzen und diese Gelegenheit nutzen, um vielleicht mehr ueber unsere Feinde aus der Tiefe zu erfahren. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zur Tauchkapsel zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HSD_HABITAT_ATTACK_LOBSTERMAN_DESCRIPTION: "Eine Unterwasser-Forschungsbasis von Hydrospace Dynamics wurde von furchtbaren Lobstermen angegriffen! Wir muessen das Personal schuetzen und diese Gelegenheit nutzen, um vielleicht mehr ueber unsere Feinde aus der Tiefe zu erfahren. Vielleicht haelt das Labor wertvolle Hinweise fuer uns bereit.{NEWLINE}Nur unterwasserfaehige Ausruestung erlaubt!"
  STR_HULLS: "Huellen"
  STR_HUMAN_GHOST: "Human Ghost"
  STR_HUMAN_GHOST_ARMOR: "Kampfanalyse: Human Ghost"
  STR_HUMAN_GHOST_CULTIST_ARMOR: "Kampfanalyse: Geisterkultist"
  STR_HUMAN_GHOST_CULTIST_UFOPEDIA: "Diese fehlgeleiteten Menschen gehoeren zu den Children of Aether, einer informellen Sekte aus Medien und allerlei anderen Geisterverehrern. Durch lang andauernde Einwirkung aus der Unterwelt wurden sie darauf konditioniert, ihren Vorgesetzten bedingungslos zu gehorchen - ob Mensch oder Geist. Den Tod fuerchten sie nicht, doch in extremen Situationen koennen selbst sie vom blanken Entsetzen uebermannt werden."
  STR_HUMAN_GHOST_UFOPEDIA: "Ein Moment von Hoffnung, Verzweiflung oder Ehrfurcht - ein Schnappschuss des emotionalen Selbst eines Menschen, eingepraegt in die Psisphaere der Erde. Diese menschlich wirkenden 'Geister' sind in Wahrheit vereinfachte Imitationen von Personen, vermutlich mit hohem psionischem Potential, die von starken Gefuehlen ueberwaeltigt wurden und nun dieselben Handlungen und Behauptungen immer wieder wiederholen, bis sie vergehen. Sie wirken oft gequaelt, verletzt oder unheimlich euphorisch oder scheinen in irgendeinem anderen Geisteszustand festzustecken. Diese Pseudomenschen sind von der Wirklichkeit stark entkoppelt, koennen aber dennoch leicht einen unvorsichtigen Agenten ausschalten. Mit ihrem infernalischen Geschrei sind sie zudem in der Lage, Menschen zu demoralisieren."
  STR_HUMAN_OSIRON_BOSS: "Osiron-Boss"
  STR_HUMAN_OSIRON_BOSS_ARMOR: "Kampfanalyse: Osiron-Boss"
  STR_HUMAN_OSIRON_BOSS_UFOPEDIA: "Hochrangige Mitglieder von Osiron leben davon, ausserirdische Artefakte zu schmuggeln, zu verkaufen und zu stehlen. Fuer gewoehnliche Bandenfuehrer sind sie erstaunlich gut vernetzt."
  STR_HUMAN_OSIRON_ELITE: "Osiron-Capo"
  STR_HUMAN_OSIRON_ELITE_ARMOR: "Kampfanalyse: Osiron-Capo"
  STR_HUMAN_OSIRON_ELITE_UFOPEDIA: "Diese Veteranen von Osiron sind zaeher, gemeiner und besser ausgeruestet als ihre weniger bedeutenden Kameraden. Gefaehrlich sind sie ohne Zweifel, aber edler aufgemachter Muell bleibt immer noch Muell."
  STR_HUMAN_OSIRON_FIXER: "Osiron-Fixer"
  STR_HUMAN_OSIRON_FIXER_ARMOR: "Kampfanalyse: Osiron-Fixer"
  STR_HUMAN_OSIRON_FIXER_ARMOR_ADAPTATION: "Auswertung: Osiron-Fixer"
  STR_HUMAN_OSIRON_FIXER_UFOPEDIA: "Die wohlhabenden Mitglieder von Osiron beschaeftigen sich vor allem mit Schmuggel ausserirdischer Technologie, Bestechung und dem verschwenderischen Genuss aller moeglichen Laster. Ihre Kampffaehigkeiten sollten unseren Agenten keine allzu grossen Probleme bereiten, doch die Tritaniumwesten, die sie haeufig tragen, und ihre exotischen Waffen koennen trotzdem unangenehm werden."
  STR_HUMAN_OSIRON_GOON: "Osiron-Schlaeger"
  STR_HUMAN_OSIRON_GOON_ARMOR: "Kampfanalyse: Osiron-Schlaeger"
  STR_HUMAN_OSIRON_GOON_UFOPEDIA: "Diese Gangstersoldaten sind gut ausgeruestet, gut trainiert und gut bezahlt - und deshalb durchaus gefaehrlich. Wirklich nuetzliches Wissen besitzen sie allerdings kaum."
  STR_HUMAN_OSIRON_TECH_TROOPER: "Osiron-Techsoldat"
  STR_HUMAN_OSIRON_TECH_TROOPER_ARMOR: "Kampfanalyse: Osiron-Techsoldat"
  STR_HUMAN_OSIRON_TECH_TROOPER_ARMOR_ADAPTATION: "Auswertung: Osiron-Techsoldat"
  STR_HUMAN_OSIRON_TECH_TROOPER_ARMOR_UFOPEDIA: "Osiron-Techsoldaten tragen kleine Schildemitter, mit denen sie einfache Schilde vom Typ Rot aufrechterhalten koennen (Kapazitaet: 25, Regeneration: 10 pro Runde)."
  STR_HUMAN_OSIRON_TECH_TROOPER_UFOPEDIA: "In exotische Ruestungen gehuellt und mit cybernetischen Implantaten verbessert, dienen diese Soldaten den erfolgreichsten Zellen von Osiron. Sie fuehren hochentwickelte Waffen und stellen fuer unsere Teams eine sehr ernstzunehmende Bedrohung dar."
  STR_HUMAN_POSTAL3_ARMOR: "Dark-One-Kampfanalyse"
  STR_HUMAN_POSTAL3_ARMOR_UFOPEDIA: "Unheimliche Macht umhuellt den Koerper des Dark One und verleiht ihm einen roten Schildtyp (Kapazitaet: 60, Wiederherstellung: 20/Runde)."
  STR_HUMAN_SONIC_CONCEPT: "Konzept fuer menschliche Schallwaffen"
  STR_HUMAN_SONIC_CONCEPT_UFOPEDIA: "Dieser Rechner enthaelt streng geheime militaerische Entwicklungen im Bereich Schallwaffen. Die Forschung ist jedoch noch weit von der Einsatzreife entfernt, und es sieht so aus, als sei das Militaer damit festgefahren. Heute Morgen hat sich ein aeusserst ueberzeugender Vertreter des Militaergeheimdienstes bei uns gemeldet und gefordert, dass wir saemtliche Daten an die zustaendigen Stellen zurueckgeben.{NEWLINE}Kommandant, ich glaube nicht, dass das Militaer das Potenzial dieses Konzepts selbst ausschoepfen wird. Leider koennen wir die Daten auch nicht heimlich kopieren; die Software ist zu eng an die Architektur des Rechenkerns gebunden.{NEWLINE}Ich schlage vor, die Rueckgabe zu verweigern und die Waffen selbst zu vollenden. Das duerfte allerdings Sanktionen des Rates nach sich ziehen.{NEWLINE}Falls wir zustimmen, bietet uns das Militaer eine Belohnung von {ALT}$ 5,000,000{ALT}. Angesichts der inoffiziellen Natur dieses Geschaefts wuerde das Geld bar uebergeben."
  STR_HUMMER_UFOPEDIA: "Dieses Militaerfahrzeug kann bis zu 5 Agenten mit ordentlicher Geschwindigkeit ueberallhin transportieren. Es kann mit einer Vielzahl schwerer Infanteriewaffen fuer reinen Fahrzeugkampf ausgeruestet werden, etwa Maschinengewehren oder Raketenwerfern. Es steht innerhalb einer Stunde nach Anforderung bereit. Fuer verdeckte Missionen ist es zu auffaellig."
  STR_HUNTING_RIFLE_HAVOC_CLIP: "Jagdgewehr-Havoc-Clip"
  STR_HWP_MINIGUN_TRITANIUM_CLIP: "HWP-Minigun-Tritanium-Clip"
  STR_HWP_SECTOPOD_GAUSS_UFOPEDIA: "Eine doppellaeufige Version der Schweren Gauss, die dieselbe Munition verwendet. Durch die Montage dieses Waffensystems auf einem Sectopod steigt die Feuerstabilitaet und damit die Genauigkeit, waehrend zusaetzliche Kuehlung eine hoehere Feuerrate erlaubt."
  STR_HWP_SECTOPOD_MASS_DRIVER_UFOPEDIA: "Eine doppellaeufige Mass-Driver-Waffe, die dieselbe Munition wie der Schwere Mass Driver verwendet. Ein robusteres Kuehlsystem ermoeglicht eine hoehere Feuerrate als bei der Infanterievariante."
  STR_HYBRID: "Alien-Hybrid"
  STR_HYBRIDS_HIDDEN_POTENTIAL: "Verborgenes Potenzial der Hybriden"
  STR_HYBRIDS_HIDDEN_POTENTIAL_UFOPEDIA: "Kommandant, die Aufnahme von Hybriden in unsere Reihen war bislang ein Erfolg. Auch wenn ihr Sozialverhalten ... nun ja, etwas ungewoehnlich wirkt, haben sie unsere Kultur schnell aufgegriffen und kommen mit menschlichen Agenten gut zurecht; manchmal entstehen sogar enge Bindungen. Im Innersten ist es jedoch komplizierter. Sie leiden unter der Entfremdung von ihren frueheren Meistern und darunter, keinen Ort zu haben, den sie wirklich ihr Eigen nennen koennen. Sie akzeptieren unsere Werte, spueren aber zugleich, dass sie anders sind, und moechten diese Identitaet bewusst ausleben. Ich glaube, wir koennen dieses Beduerfnis konstruktiv auffangen - mit einem gezielten Programm zur Selbstentwicklung. Dafuer gibt es zwei einander ausschliessende Wege: einen ausserirdischen und einen menschlichen. Wenn nichts anderes, dann geben wir damit jedem Hybriden endlich eine echte Wahl - etwas, das sie nur selten hatten.{NEWLINE}[Siehe die Trainings Starchild und Earthborn]"
  STR_HYBRID_AIRCAR: "Hybrid-Luftwagen"
  STR_HYBRID_AIRCAR_UFOPEDIA: "Ein kleines Luftfahrzeug, das von den Hybriden fuer Patrouillen- und Abfangeinsaetze genutzt wird. Es handelt sich um echte ausserirdische Technologie und wird von mehreren Gravmodulen angetrieben."
  STR_HYBRID_ARMOR: "Kampfanalyse: Hybrid"
  STR_HYBRID_ASSAULT: "Hybrid-Angreifer"
  STR_HYBRID_ASSAULT_ARMOR: "Kampfanalyse: Hybrid-Angreifer"
  STR_HYBRID_ASSAULT_UFOPEDIA: "Diese Hybrid-Infiltratoren wurden mit einem leicht veraenderten Hormonmix herangezuechtet, der Aggression und koerperliche Ausdauer staerker betont als Charme und Subtilitaet. Diese Variante wird von den Hybriden als spezialisierte Sturmtruppe eingesetzt. Sie sind geistig weniger entwickelt, aber hervorragend ausgebildet und diszipliniert."
  STR_HYBRID_AUTOPSY: "Alien-Hybrid-Autopsie"
  STR_HYBRID_AUTOPSY_UFOPEDIA: "Wie erwartet ist dieses Wesen nur teilweise menschlich. Seine DNA enthaelt zahlreiche Fragmente vermutlich ausserirdischen Ursprungs, die zu ungewoehnlichen Merkmalen wie uebergrossen Augen oder blasser, teigiger Haut fuehren. Die Koerperchemie wirkt fuer einen irdischen Primaten jedoch weitgehend normal, und auch die physischen Faehigkeiten scheinen mit denen eines Menschen vergleichbar zu sein."
  STR_HYBRID_BASE_INTERCEPTION: "Abfangmission: Hybriden-Botschaft"
  STR_HYBRID_BRAINER: "Hybrid-Brainer"
  STR_HYBRID_BREEDING: "Hybridenzucht"
  STR_HYBRID_BREEDING_UFOPEDIA: "Hybriden vergroessern ihre Reihen durch kuenstliche Fortpflanzung in geheimen Laboren abgelegener Regionen. Dabei gibt es zwei Hauptkategorien, die sich durch den Anteil ausserirdischer Gene und ihren Wachstumszyklus unterscheiden. Standard-Hybriden besitzen menschliche DNA, die mit alienem Erbgut durchsetzt ist, was ihnen besondere Merkmale wie psionische Faehigkeiten und Sterilitaet verleiht. Sie reifen und lernen auf natuerlichem Weg unter der Anleitung aelterer Mitglieder. Die zweite Kategorie sind die 'Infiltratoren': Sie tragen deutlich weniger alienes Erbgut und sind fuer Menschen aeusserlich kaum von ihnen zu unterscheiden, neigen aber eher zum Ungehorsam. Deshalb werden Infiltratoren beschleunigt aufgezogen und genau ueberwacht. Ihre geistige Entwicklung bleibt hinter der von regulaeren Hybriden zurueck, weshalb sie nur fuer bestimmte Einsaetze als entbehrliche Agenten eingesetzt werden."
  STR_HYBRID_CAMPUS: "Hybriden-Campus"
  STR_HYBRID_CAMPUS_BRIEFING: "Wir haben eine Einrichtung lokalisiert, in der junge Hybriden aufgezogen und indoktriniert werden. Wir muessen die Anlage stuermen, bevor die Jugendlichen verlegt werden, und sie in Gewahrsam nehmen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HYBRID_CAMPUS_DESCRIPTION: "Wir haben eine Einrichtung lokalisiert, in der junge Hybriden aufgezogen und indoktriniert werden. Wir muessen die Anlage stuermen, bevor die Jugendlichen verlegt werden, und sie in Gewahrsam nehmen.{NEWLINE}Erwarten Sie maessigen Widerstand durch das Personal."
  STR_HYBRID_CARNAL_KILLER: "Carnal Killer"
  STR_HYBRID_CARNAL_KILLER_DESCRIPTION: "Ihr bester Agent wurde von einer Hybrid-Agentin in Gestalt einer jungen Frau angesprochen und beinahe ermordet. Sie unterschaetzte jedoch die Faehigkeiten Ihres Agenten und wurde stattdessen selbst gefangengenommen.{NEWLINE}[Hybrid-Infiltrator x1 erhalten]"
  STR_HYBRID_CLONING_FARM: "Klonanlage fuer Hybridenagenten"
  STR_HYBRID_CLONING_FARM_BRIEFING: "Dieser abgelegene Hof wird von den Hybriden genutzt, um kuenstliche Menschen fuer Geheimdienstzwecke zu entwickeln. Wir muessen diese Bedrohung ausschalten und saemtliche Ausruestung sicherstellen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HYBRID_CLONING_FARM_DESCRIPTION: "Dieser abgelegene Hof wird von den Hybriden genutzt, um kuenstliche Menschen fuer Geheimdienstzwecke zu entwickeln. Wir muessen diese Bedrohung ausschalten und saemtliche Ausruestung sicherstellen.{NEWLINE}Erwarten Sie leichten Widerstand durch das Personal der Anlage und geklonte Agenten."
  STR_HYBRID_CLONING_FARM_UFOPEDIA: "Hybriden zuechten ihre Spezialagenten mit Hilfe ausserirdischer Technologie. Diese kuenstlichen Menschen sind darauf programmiert, ihren Schoepfern zu gehorchen, und lassen sich nicht umstimmen. Solche Experimente werden in abgeschiedenen laendlichen Gebieten durchgefuehrt, um moeglichst unentdeckt zu bleiben."
  STR_HYBRID_CONTROL: "Hybridenkontrollzentrum"
  STR_HYBRID_CONTROLLERS: "Hybrid-Kontrolleure"
  STR_HYBRID_CONTROLLERS_UFOPEDIA: "Hybriden sind menschlicher, als wir dachten, und sie scheinen nicht gluecklich zu sein. Wir haben herausgefunden, dass sie irgendwie psionisch gelenkt werden. Nach der Aussage des Hybrid-Spezialisten koennen wir nun nach der Quelle dieses psionischen Signals suchen."
  STR_HYBRID_CONTROL_ASSAULT: "Sturm auf das Hybridenkontrollzentrum"
  STR_HYBRID_CONTROL_ASSAULT_BRIEFING: "Dieses unterirdische Areal wird von den Hauptkontrolleuren der Hybriden betrieben. Wir muessen herausfinden, wie das Hybridennetzwerk wirklich funktioniert. Sichern Sie die Anlage fuer eine gruendliche Untersuchung. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Ausgangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HYBRID_CONTROL_ASSAULT_DESCRIPTION: "Dieses unterirdische Areal wird von den Hauptkontrolleuren der Hybriden betrieben. Wir muessen herausfinden, wie das Hybridennetzwerk wirklich funktioniert."
  STR_HYBRID_CONTROL_CIRCUITRY: "Schaltkreis zur Hybridenkontrolle"
  STR_HYBRID_CONTROL_CIRCUITRY_UFOPEDIA: "Diese ueberaus komplexe Maschine ist wie eine Telefonzentrale fuer Psionik. Sie speichert die Daten aller existierenden Hybriden, einschliesslich ihrer individuellen psionischen Praegungen, und hilft dabei, psionische Botschaften an bestimmte Agenten zu leiten. Durch Emotionswellen teilt das Geraet den Hybriden mit, ob ihre Meister mit ihnen zufrieden sind oder nicht. Ausserdem besitzt es eine eingebaute 'Software', die Muster erkennt, welche auf moeglichen Ungehorsam oder Abtruenigkeit hindeuten. Dieses Geraet war fuer absolute Unterdrueckung gedacht, doch nun koennen wir es fuer etwas Gutes einsetzen: um Hybriden zu finden, die bereit waeren, ihre Schoepfer zu verraten."
  STR_HYBRID_CORPSE: "Leiche eines Hybriden"
  STR_HYBRID_DATA_GEAR: "Hybrid-Datenausruestung"
  STR_HYBRID_DEFECTOR: "Hybriden-Ueberlaeufer"
  STR_HYBRID_DEFECTOR_DESCRIPTION: "Wir haben Kontakt zu einer weiteren unzufriedenen Person innerhalb des Hybridennetzwerks aufgenommen. Sie hat zugestimmt, in unseren Stuetzpunkt zu kommen, um ihr Wissen ueber die Ausserirdischen mit uns zu teilen und sich moeglicherweise sogar unseren Reihen anzuschliessen."
  STR_HYBRID_DEFECTOR_RECRUITMENT: "Anwerbung eines Hybriden-Ueberlaeufers"
  STR_HYBRID_DIPLOMAT: "Hybrid-Diplomat"
  STR_HYBRID_DIPLOMAT_ARMOR: "Kampfanalyse: Hybrid-Diplomat"
  STR_HYBRID_DIPLOMAT_UFOPEDIA: "Hybrid-Diplomaten sind fuer die diplomatischen und geschaeftlichen Aktivitaeten des Hybridennetzwerks unverzichtbar. Sie halten sich meist an Orten auf, deren Politik bereits stark von ausserirdischen Kulten beeinflusst wird. Sie sind listig, verschlagen und redegewandt und werden von fortgeschrittenen psionischen Faehigkeiten unterstuetzt. Oft verfuegen sie ueber Schluesselinformationen zu feindlichen Aktivitaeten in der jeweiligen Region."
  STR_HYBRID_DRONE_FACTORY: "Hybriden-Drohnenfabrik"
  STR_HYBRID_DRONE_FACTORY_BRIEFING: "Wir haben eine Produktionsstaette lokalisiert, in der das Hybridennetzwerk seine robotischen Diener montiert. Sie wird von zahlreichen Hybridkampfeinheiten geschuetzt, vor allem von Drohnen aus eigener Fertigung. Wir muessen die Anlage neutralisieren, bevor diese Drohnen zu einer direkten Bedrohung fuer X-Com werden. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HYBRID_DRONE_FACTORY_DESCRIPTION: "Wir haben eine Produktionsstaette lokalisiert, in der das Hybridennetzwerk seine robotischen Diener montiert. Sie wird von zahlreichen Hybridkampfeinheiten geschuetzt, vor allem von Drohnen aus eigener Fertigung. Wir muessen die Anlage neutralisieren, bevor diese Drohnen zu einer direkten Bedrohung fuer X-Com werden."
  STR_HYBRID_DRONE_FACTORY_UFOPEDIA: "Hybriden produzieren ihre eigene Ausruestung, darunter auch fortgeschrittene Drohnen ausserirdischen Designs. Solche Aktivitaeten sind schwer aufzudecken, weil sie in unscheinbaren Gebieten stattfinden und oft durch lokale Gangsterbosse geschuetzt werden, die bestochen oder mental kontrolliert wurden. Bleiben solche Anlagen unbehelligt, versorgen sie die Hybridkraefte weiter mit schwerer Bewaffnung und untergraben schrittweise die Ordnung, die wir schuetzen sollen."
  STR_HYBRID_EMBASSY_ASSAULT: "Angriff auf die Hybriden-Botschaft"
  STR_HYBRID_EMBASSY_ASSAULT_BRIEFING: "Das Hybridennetzwerk hat an diesem Ort eine dauerhafte Basis errichtet, um seine politischen Aktivitaeten zu koordinieren. Ihre Praesenz stellt eine direkte Bedrohung fuer X-Com dar, weil sie nahegelegene Staaten dazu bewegen koennte, das Projekt aufzugeben und einen geheimen Pakt mit den Ausserirdischen zu schliessen. Wir muessen diese Einrichtung vernichten, um ihre Unterwanderung zu vereiteln. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Ausgangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HYBRID_EMBASSY_ASSAULT_DESCRIPTION: "Das Hybridennetzwerk hat an diesem Ort eine dauerhafte Basis errichtet, um seine politischen Aktivitaeten zu koordinieren. Ihre Praesenz stellt eine direkte Bedrohung fuer X-Com dar, weil sie nahegelegene Staaten dazu bewegen koennte, das Projekt aufzugeben und einen geheimen Pakt mit den Ausserirdischen zu schliessen. Wir muessen diese Einrichtung vernichten, um ihre Unterwanderung zu vereiteln."
  STR_HYBRID_EMBASSY_INTERCEPTION: "Abfangmission: Hybriden-Botschaft"
  STR_HYBRID_ENVOY: "Hybrid-Gesandter"
  STR_HYBRID_ENVOY_ARMOR: "Kampfanalyse: Hybrid-Gesandter"
  STR_HYBRID_ENVOY_UFOPEDIA: "Gesandte bilden den Kern des diplomatischen Korps des Hybridennetzwerks. Ihre Hauptaufgabe besteht darin, als Vertreter und Berater fuer Organisationen und Personen zu dienen, die der alienfreundlichen Sache nuetzlich sein koennten. Sie sind gut ausgebildet, hochintelligent und dem Netzwerk zutiefst loyal. Zwar verfuegen sie ueber keine offensiven Psikraefte, doch sie sind begabte Empathen und besitzen oft leichte telepathische Faehigkeiten."
  STR_HYBRID_FARM: "Hybriden-Versuchshof"
  STR_HYBRID_FARM_BRIEFING: "Dieser Hof wird von den Hybriden genutzt, um gentechnisch veraendertes Gemuese anzubauen. Wir muessen dafuer sorgen, dass dieser Betrieb rasch geschlossen wird. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HYBRID_FARM_DESCRIPTION: "Dieser Hof wird von den Hybriden genutzt, um gentechnisch veraendertes Gemuese anzubauen. Wir muessen dafuer sorgen, dass dieser Betrieb rasch geschlossen wird.{NEWLINE}Erwarten Sie leichten Widerstand durch feindliche Bauern."
  STR_HYBRID_FARM_UFOPEDIA: "Hybriden betreiben geheime Farmen an unscheinbaren Orten, auf denen sie genetisch veraenderte Pflanzen anbauen. Diese Pflanzen stehen offenbar in irgendeinem Zusammenhang mit dem grossen Plan der Ausserirdischen fuer die Erde. Was auch immer dahintersteckt, auf solche Aktivitaeten sollten wir schnell reagieren."
  STR_HYBRID_GEAR: "Hybrid-Ausruestung"
  STR_HYBRID_GROUND_CONVOY: "Hybriden-Konvoi"
  STR_HYBRID_GROUND_CONVOY_UFOPEDIA: "Die Infiltration menschlicher Institutionen erfordert erheblichen Vorbereitungsaufwand seitens der Ausserirdischen, einschliesslich des Transports wichtiger Fracht wie Dokumente, Artefakte oder Personen. Diese Arbeit leisten halb-ausserirdische Hybriden, die ihre Kontakte und Ressourcen nutzen, um Schmuggelgut rund um den Globus zu bewegen. So unauffaellig solche Aktivitaeten auch wirken, sie bilden das Rueckgrat ausserirdischer Diplomatie und koennen in gefaehrliche Absprachen zwischen Ausserirdischen und menschlichen Gruppen muenden."
  STR_HYBRID_HIDEOUT: "Hybriden-Versteck"
  STR_HYBRID_HIDEOUT_BRIEFING: "Wir haben ein Versteck der Hybriden aufgespuert. Offenbar dient es dazu, ihre subversiven Aktivitaeten in der Region zu koordinieren, geheime Treffen mit Agenten abzuhalten und ihr Agentennetzwerk zu versorgen. Nehmen Sie die Verdaechtigen fest und beschlagnahmen Sie ihre Ausruestung, um mehr ueber die Plaene der Ausserirdischen zu erfahren. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Ausgangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HYBRID_HIDEOUT_DESCRIPTION: "Wir haben ein Versteck der Hybriden aufgespuert. Offenbar dient es dazu, ihre subversiven Aktivitaeten in der Region zu koordinieren, geheime Treffen mit Agenten abzuhalten und ihr Agentennetzwerk zu versorgen. Wir muessen aeusserst vorsichtig vorgehen, damit die Verdaechtigen nicht entkommen."
  STR_HYBRID_IMPOSTOR: "Hochstapler"
  STR_HYBRID_IMPOSTOR_DESCRIPTION: "Ein Regierungsbeamter in {0}, der ploetzlich verstarb und angeblich einem Herzinfarkt erlegen war, entpuppte sich als Ausserirdischer in einer Art Hautanzug. Die eigentliche Todesursache war Ersticken infolge einer Fehlfunktion des Anzugs. Leider konnten wir weder Leiche noch Anzug bergen, da beides bereits auf mysterioese Weise eingeaeschert wurde. Doch allein der Schock, selbst in mittleren Regierungskreisen auf einen getarnten Ausserirdischen zu stossen, veranlasste den Rat, mehr Mittel fuer das X-Com-Projekt in Erwaegung zu ziehen.{NEWLINE}[200 Punkte]"
  STR_HYBRID_JUVENILE: "Junger Hybrid"
  STR_HYBRID_JUVENILE_FOR_PERSONNEL: "Junger Hybrid fuer Personal"
  STR_HYBRID_JUVENILE_UFOPEDIA: "Diese jungen Hybriden befinden sich noch in der Konditionierungsphase fuer den Dienst unter ihren ausserirdischen Meistern. Sie leben in isolierten, kalten Einrichtungen mit kaum einem Kontakt zur Aussenwelt. Obwohl sie nicht vollstaendig menschlich sind, gleichen sie in vielerlei Hinsicht gewoehnlichen Kindern und Jugendlichen. Der Erdenrat betrachtet sie als Opfer, die Schutz und Rehabilitation verdienen, und wird uns fuer jeden geretteten Jugendlichen mit Requisitionen belohnen."
  STR_HYBRID_KEEP: "Hybridenfestung"
  STR_HYBRID_KEEP_: "Hybridenfestung-{0}"
  STR_HYBRID_KEEP_BRIEFING: "Das Hybridennetzwerk hat in diesem Gebiet ein befestigtes Gebaeude errichtet. Es dient als kleiner Knotenpunkt fuer subversive Aktivitaeten und wird schwer bewacht. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HYBRID_KEEP_DESCRIPTION: "Das Hybridennetzwerk hat in diesem Gebiet ein befestigtes Gebaeude errichtet. Es dient als kleiner Knotenpunkt fuer subversive Aktivitaeten und wird schwer bewacht."
  STR_HYBRID_KEEP_UFOPEDIA: "Obwohl das Hybridennetzwerk stark dezentral organisiert ist, laesst sich der Aufbau lokaler Daten- und Lagerzentren nicht vermeiden. Hybridenfestungen sind gut befestigt und stellen fuer X-Com-Truppen eine erhebliche Herausforderung dar. Sie werden mit einfachen irdischen Materialien und Technologien errichtet und lassen sich deshalb kaum aufspueren, bevor sie in Betrieb gehen."
  STR_HYBRID_LANDER: "Hybrid-Lander"
  STR_HYBRID_LANDER_UFOPEDIA: "Dieser fliegende Lasttraeger ist das Hybrid-Gegenstueck zu einem Sturmtransporter. Er nutzt Antigravitationsantrieb."
  STR_HYBRID_MEDIUM_GROUND_CONVOY: "Mittlerer Hybriden-Konvoi"
  STR_HYBRID_MEDIUM_GROUND_CONVOY_BRIEFING: "Wir haben eine Hybridenlieferung mit Ressourcen abgefangen. Sorgen Sie dafuer, dass sie ihr Ziel nicht erreicht. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HYBRID_MEDIUM_GROUND_CONVOY_DESCRIPTION: "Hybriden transportieren heimlich Waren und Rohstoffe. Fangen Sie diesen Konvoi ab, bevor er verschwindet."
  STR_HYBRID_MIB_MEETING: "Hybrid/Men in Black-Treffen"
  STR_HYBRID_MIB_MEETING_BRIEFING: "Unsere Quellen haben diesen Ort als Treffpunkt identifiziert, an dem sich die Men in Black mit Hybriden koordinieren, um den Status quo auf der Erde zu unterwandern. Sorgen Sie dafuer, dass dieses Treffen scheitert. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HYBRID_MIB_MEETING_DESCRIPTION: "Unsere Quellen haben diesen Ort als Treffpunkt identifiziert, an dem sich die Men in Black mit Hybriden koordinieren, um den Status quo auf der Erde zu unterwandern. Sorgen Sie dafuer, dass dieses Treffen scheitert. In der Umgebung wurden schwere Hybrideneinheiten gesichtet."
  STR_HYBRID_MIB_MEETING_UFOPEDIA: "Eine der gefaehrlichsten Organisationen unter den Partnern der halbmenschlichen Hybriden sind die sogenannten Men in Black, die ihre eigenen Interessen verfolgen, indem sie Kontakt zu Ausserirdischen suchen. Das Hybridennetzwerk trifft sich manchmal mit Vertretern der Men in Black, um im Auftrag ihrer Meister zu verhandeln, Informationen auszutauschen und sich vermutlich gegen die Menschheit zu verschwoeren. Solche Kontakte sind fuer X-Com aeusserst gefaehrlich und muessen sofort unterbunden werden."
  STR_HYBRID_NETWORK: "Hybridennetzwerk"
  STR_HYBRID_NETWORK_STRUCTURE: "Struktur des Hybridennetzwerks"
  STR_HYBRID_NETWORK_STRUCTURE_UFOPEDIA: "Um die Geheimhaltung zu wahren, verteilt das Hybridennetzwerk seine Aktivitaeten so weit wie moeglich. Landwirtschaftliche Anlagen und Zuchtstaetten liegen in abgelegenen Regionen auf der ganzen Welt, waehrend Produktion, Forschung und Geheimdienstarbeit in urbanen Zentren stattfinden. Jede Zelle ist auf moeglichst grosse Eigenstaendigkeit ausgelegt und tauscht nur wenig Personal und Material mit anderen Standorten aus. Das gilt sogar fuer Kommandozentren, die weitgehend von anderen Funktionen getrennt bleiben und sich vor allem auf lokale Ressourcen stuetzen. Gerade diese Struktur macht den Kampf gegen die Hybriden besonders schwierig."
  STR_HYBRID_NETWORK_STR_CHIEF_ENGINEER_CONTACT: "BEHALTEN SIE STETS DEN HIMMEL IM BLICK"
  STR_HYBRID_NETWORK_UFOPEDIA: "Es scheint, dass unser Planet nicht nur von Kulten unterwandert, sondern auch von bioengineerten Agenten der Ausserirdischen infiltriert wird, die sich als ganz normale Menschen tarnen und den Planeten fuer eine Art ... Ernte vorbereiten. Wie viel Wahrheit in diesen Geschichten steckt, kann ich noch nicht sagen, aber wir haben Dokumente ueber dieses 'Hybridennetzwerk', und ich werde ihnen persoenlich nachgehen. Ich frage mich, wie viele Arten von Hybriden es dort draussen gibt und wie sie aussehen ..."
  STR_HYBRID_ODDBALL: "Eigenwilliger Hybrid"
  STR_HYBRID_ODDBALL_UFOPEDIA: "Kommandant, was unseren gefangenen Hybriden angeht: Nachdem wir uns besser kennengelernt haben, hat mir diese Person erzaehlt, wie ungluecklich sie mit ihrem bisherigen Leben ist und wie schlimm es ist, als gesichtsloser Handlanger ferner ausserirdischer Herren zu dienen. Trotz aller Konditionierung haben wir nun einen Rebellen vor uns, der uns im Kampf helfen will.{NEWLINE}Ich habe die Umstaende und die Psyche des Kandidaten gruendlich geprueft. Nach meiner Einschaetzung handelt es sich nicht um einen Spionageversuch, und diese Person koennte eine nuetzliche Ergaenzung fuer unsere Familie sein. Was sollen wir also mit diesem Gefangenen tun? Ich sehe zwei Moeglichkeiten. Erstens koennen wir ihn meinem Nachrichtenteam zur Befragung ueberstellen, wie jeden anderen Gefangenen auch - nur schneller und freundlicher; dazu muessen Sie das passende Forschungsprojekt eroefnen. Zweitens koennen wir ihn in unser Feldagententeam aufnehmen; das laesst sich ueber das Werkstattmenue erledigen. Oder wir schicken ihn einfach wie alle anderen an den Rat, falls Sie das bevorzugen ..."
  STR_HYBRID_OPERATIONS: "Operationen des Hybridennetzwerks"
  STR_HYBRID_OPERATIONS_UFOPEDIA: "Alien-Hybriden fuehren Aufklaerungs- und Unterwanderungsoperationen gegen Regierungen der Erde und andere einflussreiche Institutionen durch. Menschlich aussehende Klone schleusen sich in diese Organisationen ein, um ihre Arbeit zu sabotieren, Ressourcen umzuleiten oder schlicht Informationen zu sammeln. Wenn noetig, greifen sie auch zu Terroranschlaegen und Attentaten."
  STR_HYBRID_PSIONIC_ARMOR: "Hybrid-Psionikruestung"
  STR_HYBRID_PSIONIC_POWER_SUIT: "Hybrid-Psionik-Energieanzug"
  STR_HYBRID_PSI_WEAPON: "Hybrid-Psi-Angriff"
  STR_HYBRID_PSI_WEAPON_UFOPEDIA: "Alle Hybrid-Agenten verfuegen ueber angeborene psionische Faehigkeiten, mit denen sie schwache Geister per Telepathie dominieren koennen. Wenn eine Hybrid-Einheit aktiv ist, klicken Sie auf das Psi-Symbol oben rechts auf dem Bildschirm, waehlen die Art des Angriffs und anschliessend mit dem Cursor eine Zieleinheit aus. Sichtkontakt ist erforderlich. Es gibt zwei Arten psionischer Angriffe:{NEWLINE}PANIK> Ist der Angriff erfolgreich, sinkt die Moral des Ziels und es kann in Panik geraten.{NEWLINE}GEDANKENKONTROLLE> Ist dieser Angriff erfolgreich, uebernehmen Sie sofort die Kontrolle ueber die feindliche Einheit, als gehoerte sie zu Ihren eigenen. Diese Art von Angriff ist schwieriger erfolgreich einzusetzen.{NEWLINE}Beachten Sie, dass im Feldeinsatz untrainierte Hybrid-Agenten mit solchen Angriffen nur selten Erfolg haben werden."
  STR_HYBRID_PURGE: "Hybriden-Saeuberung"
  STR_HYBRID_PURGE_BRIEFING: "Wir haben ein geheimes Dorf der Hybriden entdeckt, das von ihren ausserirdischen Meistern offenbar fuer die naechste Phase der Invasion unterhalten wird. Unser Ziel ist es, diese Siedlung dem Erdboden gleichzumachen, um ihnen dort jeden Stuetzpunkt zu nehmen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HYBRID_PURGE_DESCRIPTION: "Wir haben ein geheimes Dorf der Hybriden entdeckt, das von ihren ausserirdischen Meistern offenbar fuer die naechste Phase der Invasion unterhalten wird. Unser Ziel ist es, diese Siedlung dem Erdboden gleichzumachen, um ihnen dort jeden Stuetzpunkt zu nehmen.{NEWLINE}Erwarten Sie leichten Widerstand von den feindlichen Bauern."
  STR_HYBRID_RECON: "Hybrid-Aufklaerung"
  STR_HYBRID_RETALIATION: "Vergeltung der Hybriden"
  STR_HYBRID_SCIENTIST: "Hybrid-Wissenschaftler"
  STR_HYBRID_SCIENTIST_ARMOR: "Kampfanalyse: Hybrid-Wissenschaftler"
  STR_HYBRID_SCIENTIST_UFOPEDIA: "Hybrid-Wissenschaftler ueberwachen menschliche Forschungsprojekte und fuehren Experimente in Biologie, Genetik und Metapsychologie durch. Ihr Verstand ist schaerfer als der anderer Hybriden, doch ihre Kampffertigkeiten sind maessig. Lebend gefangene Wissenschaftler sollten Prioritaet haben, da sie oft ueber umfangreiche Kenntnisse zu ausserirdischen Forschungsaktivitaeten verfuegen."
  STR_HYBRID_SECTOID_MEETING: "Hybrid-/Alien-Treffen"
  STR_HYBRID_SECTOID_MEETING_BRIEFING: "Unsere Quellen haben diesen Ort als Treffpunkt identifiziert, an dem sich Hybriden mit ihren ausserirdischen Herren treffen, um neue Befehle zu erhalten. Das ist eine ausgezeichnete Gelegenheit, ihre Aktivitaeten zu stoeren und wertvolle Informationen zu gewinnen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HYBRID_SECTOID_MEETING_DESCRIPTION: "Unsere Quellen haben diesen Ort als Treffpunkt identifiziert, an dem sich Hybriden mit ihren ausserirdischen Herren treffen, um neue Befehle zu erhalten. Das ist eine ausgezeichnete Gelegenheit, ihre Aktivitaeten zu stoeren und wertvolle Informationen zu gewinnen."
  STR_HYBRID_SECTOID_MEETING_UFOPEDIA: "Obwohl die halbausserirdischen Hybriden weitgehend autonom operieren, muessen sie sich von Zeit zu Zeit mit ihren Meistern treffen, um neue Befehle und Ausruestung zu erhalten. Solche Treffen finden in abgelegenen Gebieten statt, meist auf Gelaende des Hybridennetzwerks. Sie stellen eine erhebliche Bedrohung fuer X-Com dar, weil sie den Einfluss der Ausserirdischen auf der Erde sichtbar staerken."
  STR_HYBRID_SHADY_CLINIC: "Dubiose Klinik"
  STR_HYBRID_SHADY_CLINIC_DESCRIPTION: "In {0} wurde eine inoffizielle Untergrundklinik eroeffnet, die armen Menschen kostenlose medizinische Eingriffe anbot. Nachdem einige Patienten kostenlos und schneller als mit konventioneller Medizin behandelt worden waren, wurde sie rasch populaer. Abgesehen von den ersten Besuchern ist jedoch niemand, der diese Klinik betreten hat, je wieder gesehen worden. Als unsere Ermittler eintrafen, waren die Taeter verschwunden, doch ihre Ausruestung blieb zurueck.{NEWLINE}[-50 Punkte, Ausserirdische Chirurgie x2 erhalten]"
  STR_HYBRID_SKY_PATROL: "Luftpatrouille der Hybriden"
  STR_HYBRID_SMALL_GROUND_CONVOY_BRIEFING: "Wir haben eine kleine Hybridenlieferung mit Ressourcen abgefangen. Sorgen Sie dafuer, dass sie ihr Ziel nicht erreicht. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HYBRID_SMALL_GROUND_CONVOY_DESCRIPTION: "Hybriden transportieren heimlich Waren und Rohstoffe. Fangen Sie diesen Konvoi ab, bevor er verschwindet."
  STR_HYBRID_SOLDIER: "Hybrid-Soldat"
  STR_HYBRID_SOLDIER_ARMOR: "Kampfanalyse: Hybrid-Soldat"
  STR_HYBRID_SPECIALIST: "Hybrid-Spezialist"
  STR_HYBRID_SPECIALIST_ARMOR: "Kampfanalyse: Hybrid-Spezialist"
  STR_HYBRID_STORAGE: "Hybriden-Lager"
  STR_HYBRID_STORAGE_BRIEFING: "In diesem Gebiet befindet sich ein Lagerhaus, in dem Alien-Hybriden Vorraete fuer ihre Meister lagern. Ziel ist es, diese Materialien fuer Forschungszwecke sicherzustellen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Ausgangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HYBRID_STORAGE_DESCRIPTION: "In diesem Gebiet befindet sich ein Lagerhaus, in dem Alien-Hybriden Vorraete fuer ihre Meister lagern. Ziel ist es, diese Materialien fuer Forschungszwecke sicherzustellen.{NEWLINE}Rechnen Sie mit leichtem Widerstand in urbanem Gebiet."
  STR_HYBRID_STORAGE_FACILITY: "Hybriden-Lager"
  STR_HYBRID_STORAGE_UFOPEDIA: "Hybriden legen Notvorratslager fuer ausserirdische Infiltrationstrupps an. Diese Vorratsdepots enthalten vor allem Nahrung, die fuer den Verzehr durch Ausserirdische angepasst wurde. Sie sind fuer sich genommen nicht besonders gefaehrlich, sollten aber dennoch aufgespuert und geraeumt werden."
  STR_HYBRID_SUPERVISOR: "Hybrid-Aufseher"
  STR_HYBRID_SUPERVISOR_ARMOR: "Kampfanalyse: Hybrid-Aufseher"
  STR_HYBRID_UFOPEDIA: "Alien-Hybriden sind Kreuzungen zwischen Menschen und Sectoids. Sie wurden erschaffen, um die Erde zu infiltrieren und zu ueberwachen, sowie fuer weitere Aufgaben im Zusammenhang mit der Invasion. Obwohl ihr Aussehen klar nichtmenschlich ist, verfuegen Hybriden ueber eine Tarntechnologie, die es ihnen erlaubt, sich unbehelligt unter Menschen zu bewegen. Ihre Meister ueben nur begrenzte telepathische Kontrolle aus; Loyalitaet beruht daher vor allem auf Einschuechterung und Indoktrination. Das Hybridennetzwerk operiert aehnlich wie ein menschlicher Geheimdienst und setzt fast ausschliesslich irdische Ausruestung ein."
  STR_HYBRID_UN_INFILTRATOR: "UN-Infiltrator"
  STR_HYBRID_UN_INFILTRATOR_DESCRIPTION: "Eine Reinigungskraft im Hauptquartier der Vereinten Nationen stiess beim Saeubern der hinteren Bueros zufaellig auf einen Assistenten, der ein Kommunikationsgeraet eindeutig ausserirdischen Ursprungs benutzte. Der Assistent geriet in Panik und floh, woraufhin sich das Geraet selbst zerstoerte. Gluecklicherweise war ein Mitglied des Erdenrats vor Ort und konnte die Reinigungskraft zur Verschwiegenheit bewegen. In der Folge beschloss der Rat, seine Prioritaeten zugunsten des X-Com-Projekts neu zu bewerten.{NEWLINE}[150 Punkte]"
  STR_HYBRID_WORKER: "Hybrid-Arbeiter"
  STR_HYBRID_WORKSHOP: "Hybriden-Werkstatt"
  STR_HYBRID_WORKSHOP_BRIEFING: "Dies ist eine Fertigungsanlage, in der das Hybridennetzwerk einen Teil seiner Ausruestung fuer die Unterwanderung des Erdenrats montiert. Beenden Sie diese Aktivitaet und sichern Sie alles Nuetzliche vor Ort. Die Anlage wird von einem kleinen Trupp aus Soldaten und Drohnen bewacht. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_HYBRID_WORKSHOP_DESCRIPTION: "Dies ist eine Fertigungsanlage, in der das Hybridennetzwerk einen Teil seiner Ausruestung fuer die Unterwanderung des Erdenrats montiert. Beenden Sie diese Aktivitaet und sichern Sie alles Nuetzliche vor Ort. Die Anlage wird von einem kleinen Trupp aus Soldaten und Drohnen bewacht."
  STR_HYBRID_WORKSHOP_UFOPEDIA: "Die Hybriden unterhalten ein verteiltes Netz einfacher Fertigungsstandorte, an denen ein grosser Teil ihrer Ausruestung hergestellt wird. Solche Orte sind haeufig provisorisch und schwer aufzuspuren. Auch wenn ihr unmittelbarer Einfluss auf X-Com begrenzt ist, sollten wir sie nicht ignorieren, denn sie zeigen klar, dass die Hybriden staerker werden."
  STR_HYDRA_LASER_XD_CLIP: "Hydra-Laser-XD-Clip"
  STR_IMPERSONATRON_UFOPEDIA: "Mittels Holoprojektor und Psiwellensender erlaubt diese Vorrichtung dem Trager seine Erscheinung zu andern. Perfekt fur Infiltrationen.{NEWLINE}Beachten Sie, dass er das Gesicht verandern, aber nicht zuverlassig groere Objekte wie Waffen und Ausrustung tarnen kann, weswegen die Missionsbeschrankungen weiter gelten."
  STR_IMPOSSIBLE_INTERNET_INTELLIGENCE_BRIEFING: "Die technische Hochschule scheint im Moment verlassen zu sein, und das spielt uns in die Haende. Im Gebaeude messen wir ektoplasmatische Aktivitaet und die Anwesenheit menschlicher Akteure, die damit in Verbindung stehen. Finden Sie die Festplatte, verhindern Sie das Ritual und bringen Sie das Geraet zur Untersuchung zurueck. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_IMPOSSIBLE_INTERNET_INTELLIGENCE_INVESTIGATION: "Impossible Internet Intelligence: Untersuchung"
  STR_IMPOSSIBLE_INTERNET_INTELLIGENCE_INVESTIGATION_UFOPEDIA: "Unsere Agenten verfolgen ein Geruecht ueber eine 'wuenscheerfuellende Festplatte', die in mehreren Staedten Suedostasiens Tote hinterlassen hat. Diese urbane Legende existiert seit mindestens einem Jahrzehnt. Der Ablauf ist fast immer derselbe: Ein Schueler oder Lehrer steckt in Schwierigkeiten und trifft auf eine seltsame Gestalt, die behauptet, diese Festplatte werde alle Probleme loesen und einen Wunsch erfuellen, wenn man nur bestimmten Anweisungen folgt. Danach erscheint ein Geist und erfuellt den Wunsch auf verdrehte Weise - stets mit toedlichem Ausgang fuer den Betroffenen. Das Internet hat nur dafuer gesorgt, dass sich diese Geschichte schneller verbreitet. Wir folgen der Spur der Leichen und hoffen, diesen 'Geist' aufzuhalten, bevor er weitere Opfer fordert."
  STR_INCINERATOR_CLIP_UFOPEDIA: "Dieses Gerat ist mit einer chemischen Verbindung gefullt, die sich unter hohen Temperaturen rasant ausdehnt und Faden zieht. Dadurch entsteht ein flammendes Geschoss aus energiearmen Plasmapartikeln in einem schnell verbrennenden Netz. Das Magazin enthalt kleine Mengen ruckgewinnbares Elerium."
  STR_INDUSTRIAL_INVESTIGATION_BRIEFING: "Eine illegale Organisation hat eine Schlaferzelle in diesem Industriekomplex aufgebaut. Wir mussen diese Kultisten erledigen und ihren Anfuhrer dingfest machen, wenn moglich. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Ausgangsbereich zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_INFESTED_CYBERWEB_FORTRESS_ASSAULT: "Verseuchte Cyberweb-Festung"
  STR_INFESTED_CYBERWEB_FORTRESS_ASSAULT_BRIEFING: "Sie naehern sich einer alten Cyberweb-Festung, die inzwischen von fremdartiger Vegetation und Biomachinerie ueberwuchert ist. Bringen Sie die Anlage unter Kontrolle und sichern Sie Proben ungewoehnlicher Lebensformen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_INFESTED_CYBERWEB_FORTRESS_ASSAULT_DESCRIPTION: "Der Rat hat eine alte Cyberweb-Festung entdeckt, die inzwischen von Brainsucked-Kraeften besetzt ist. Die Anlage ist wahrscheinlich fuer die Oeffnung dimensionaler Tore zur Erde verantwortlich. Wenn wir selbst eingreifen, koennen wir nicht nur den Betrieb stoeren, sondern moeglicherweise auch wertvolles Wissen und Material sichern."
  STR_INFESTED_CYBERWEB_FORTRESS_SECURED: "Verseuchte Cyberweb-Festung gesichert."
  STR_INFORMAL_TIES_UFOPEDIA: "Die Ratskommissarin, die wir gerettet haben, stellte sich als sehr hilfreich heraus, indem sie uns mit verschiedenen Rats-Agenten bekannt machte, die unserer Sache gewogen sind. Wir sollten diese informellen Kontakte nutzen, um unsere Position im Groen Ganzen grundlicher zu verstehen, und vielleicht zu verbessern."
  STR_INTELLIGENCE_OFFICER_INTRODUCTION_DESCRIPTION: "Kommandant, darf ich eintreten? Es freut mich sehr, Sie endlich kennenzulernen. Ich dachte mir, an Ihrem ereignisreichen ersten Tag koennten Sie eine kleine Pause gebrauchen, also habe ich Kaffee mitgebracht, um den Anlass angemessen zu feiern. Oder sind Sie eher ein Teemensch...?{NEWLINE}{NEWLINE}Uebrigens habe ich mir waehrend Ihrer Anreise erlaubt, mit einigen Leuten aus dem Finanzierungskomitee ins Gespraech zu kommen und dabei ein paar Informationen ueber die aktuellen Vorgaenge zu sammeln. Wie es der Zufall will, habe ich auf diesem Weg auch einige Akten in die Finger bekommen. Sollen wir sie uns spaeter gemeinsam ansehen?"
  STR_INTO_THE_DARK_UFOPEDIA: "Die bizarren Artefakte aus den Hohlen hatten einen tiefgrundigen Einfluss auf meine Gedanken. Unablassig grubelte ich uber ihre Bedeutung! Gab es eine zweite Welt drunten, verborgen, aber gewaltig und ganz real... Mir kam also die Idee, unsere Scantechnologie anzupassen, um die Erdkruste zu erforschen. Die Ergebnisse erschrecken: tief unter unseren tiefsten Minen erstrecken sich gewaltige unterirdische Passagen uber riesige Gebiete, sorgsam konstruiert, um unseren normalen Messgeraten verborgen zu bleiben. Nach bestimmten okkulten Traditionen schlage ich vor, dies fremde Land als 'Shogg' zu bezeichnen. Die Tunnel sind zu komplex, um sie genau zu kartieren, aber wir sollten sie bald erkunden. Wer wei, welch erschreckende Ratsel sie verbergen...{NEWLINE}Wir haben diese Erkenntnisse benutzt, um die verbliebenen Zugange zu Shogg zu finden und sichern. Der Rat wird sie uberwachen, wir sollten also keine Missionen zu Versteckten Hohlen mehr erwarten."
  STR_INTO_THE_DEPTHS_UFOPEDIA: "Kommandant, ich muss protestieren! Aus unserer Sicht ist T'leth erledigt, begraben und zerschlagen: Ohne die Tasoth-Fabrik sind sie schwer angeschlagen. Ihnen bis in den Abgrund zu folgen, wuerde nur eine neue Front in einem Terrain eroeffnen, fuer das wir denkbar schlecht geeignet sind. Aber wenn Sie ihnen unbedingt nachsetzen wollen, werde ich eben nach einer Loesung suchen..."
  STR_IN_PURSUIT_OF_VON_HAGEN: "Auf den Spuren von Von Hagen"
  STR_IN_PURSUIT_OF_VON_HAGEN_UFOPEDIA: "Unsere letzte Begegnung mit Von Hagens Zombielegion hat deutlich gemacht, dass wir ihn unterschaetzt haben. Er ist laengst nicht mehr nur ein Grabwaechter, sondern hat sich zu einer hoeheren Zombieform entwickelt, die in der Lage ist, eine beachtliche Streitmacht der 'Untoten' zu kommandieren.{NEWLINE}Alle verfuegbaren Hinweise deuten darauf hin, dass Von Hagen einen unterirdischen Zufluchtsort unterhaelt, der bislang unserem Blick verborgen blieb. Aber nicht mehr lange. Frueher oder spaeter werden wir sein Versteck aufspueren und - mit etwas Glueck - seiner Schreckensherrschaft ein Ende setzen."
  STR_IONIZER_CLIP_TO_CYBERWEB_BATTERY: "Ionisierer-Batterieentladung"
  STR_ION_BLASTER_CLIP_TO_CYBERWEB_BATTERY: "Ionenschiesser-Batterieentladung"
  STR_ITS_ALL_PROFESSIONAL_DESCRIPTION: "Waehrend einer routinemaessigen Sicherheitsbesprechung kamen Sie mit einem neu kennengelernten Ratskommissar ausgesprochen gut ins Gespraech. Abgesehen von einem angenehmen Abend hoffen wir, dass dies X-Coms Ansehen beim Rat zumindest ein wenig verbessert.{NEWLINE}[50 Punkte]"
  STR_IT_WENT_CRITICAL_DESCRIPTION: "In einer staatlichen Einrichtung in {0} kam es zu einer gewaltigen Detonation. Offenbar hat jemand aus dem Umfeld des Rats mit Xeno-Technologie experimentiert und war dabei nicht vorsichtig genug. Nachdem das Ganze oeffentlich scheiterte, stellt uns der Nachfolger nun die Ueberreste des Experiments zur Verfuegung.{NEWLINE}[Ausserirdische Legierungen x20, Treibstoffspur x5 erhalten]"
  STR_JARHEAD: "Jarhead"
  STR_JARHEAD_ARMOR: "Kampfanalyse: Jarhead"
  STR_JARHEAD_AUTOPSY: "Autopsie: Jarhead"
  STR_JARHEAD_AUTOPSY_UFOPEDIA: "Der Jarhead ist eine grausame Erinnerung daran, wie technikversiert die Feinde der Menschheit vorgehen. Das mechanoide Exoskelett beherbergt einen kleinen Zerfallsreaktor, der den Cyborg mit Energie versorgt. Das Gehirn im Glas ist menschlich und scheint weitgehend unveraendert zu sein."
  STR_JARHEAD_CORPSE: "Leiche eines Jarheads"
  STR_JARHEAD_FACTORY: "Jarhead-Fabrik"
  STR_JARHEAD_FACTORY_BRIEFING: "Wir haben einen Ort gefunden, an dem Menschen zu alptraumhaften Jarheads verarbeitet werden. Zerstoeren Sie die Anlage und stellen Sie sicher, dass keine dieser Monstrositaeten entkommt. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_JARHEAD_FACTORY_DESCRIPTION: "Wir haben einen Ort gefunden, an dem Menschen zu alptraumhaften Jarheads verarbeitet werden, tief in einem heruntergekommenen Teil der Stadt. Zerstoeren Sie die Anlage und stellen Sie sicher, dass keine dieser Monstrositaeten entkommt."
  STR_JARHEAD_INVESTIGATION: "Jarhead-Untersuchung"
  STR_JARHEAD_INVESTIGATION_UFOPEDIA: "Nach einer gruendlichen Untersuchung von Jarhead-Bauteilen sind wir zu dem Schluss gekommen, dass zumindest ein Teil davon aus ganz gewoehnlichen Komponenten besteht. Unser naechster Schritt war deshalb, nachzuvollziehen, wer genau diese Teile bestellt hat. Das war ein alptraumhafter Berg von Papierkram, denn tausende Firmen kamen in Frage, doch am Ende blieben einige brauchbare Spuren. Wir werden diese Lieferketten weiter verfolgen, hoffentlich bis zu dem Ort, an dem Jarheads gebaut werden.{NEWLINE}Nebenbei stiess ich in alten Akten auf Hinweise auf eine aehnliche Kreatur. Die Unterlagen stammen aus den 1950er Jahren und verweisen auf eine britische Organisation namens UNIT. Das koennte noch wichtig werden."
  STR_JARHEAD_PRETENDER: "Jarhead-Pretender"
  STR_JARHEAD_PRETENDER_ARMOR: "Kampfanalyse: Jarhead-Pretender"
  STR_JARHEAD_TERROR: "Jarhead-Terror"
  STR_JARHEAD_TERRORIST: "Jarhead"
  STR_JARHEAD_TERROR_BRIEFING: "Seltsame biomechanische Schrecken sind ploetzlich in dieser Stadt aufgetaucht und greifen die Bevoelkerung an. Wir muessen sie aufhalten. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_JARHEAD_TERROR_DESCRIPTION: "Seltsame biomechanische Schrecken sind ploetzlich in dieser Stadt aufgetaucht und greifen die Bevoelkerung an. Wir muessen sie aufhalten."
  STR_JARHEAD_UFOPEDIA: "Diese Kreatur ist ein Cyborg mit einem lebenden menschlichen Gehirn. Ihr mechanischer Koerper ist leicht, aber erstaunlich widerstandsfaehig. Es ist uns auf keine Weise gelungen, mit dem Wesen zu kommunizieren, auch nicht durch direkte Stimulation. Es verfuegt jedoch ueber Psi-Kraefte in Form heftiger Schockwellen."
  STR_JUDGE_HAVOC_CLIP: ".454-Havoc-Munition"
  STR_JUGGERNAUT_SUIT_UFOPEDIA: "Diese uberschwere Rustung wurde fur maximierten Schutz vor schweren Alienwaffen entwickelt. Es hat groartige Nachtsicht auf Tiefseemissionen. "
  STR_KATAPELTES_SPIRITUS_BLOB_CLIP: "Katapeltes-Spiritus-Klumpenmunition"
  STR_KATAPELTES_SPIRITUS_BLOB_CLIP_UFOPEDIA: "Phiolen fuer den Klumpenwerfer des Katapeltes Spiritus. Sie sind mit veredeltem Ektoplasma gefuellt."
  STR_KATAPELTES_SPIRITUS_SPRAY_CLIP: "Katapeltes-Spiritus-Spruehmunition"
  STR_KATAPELTES_SPIRITUS_SPRAY_CLIP_UFOPEDIA: "Phiolen fuer den Spruehmodus des Katapeltes Spiritus. Unter hohem Druck versorgt das Ektoplasma die Spruehduesen der Waffe."
  STR_KATAPELTES_SPIRITUS_UFOPEDIA: "Eine ektoplasmatische Waffe mit zwei Funktionen. Sie verschiesst Klumpen verfestigter psi-organischer Energie in enger Streuung. Der alternative Feuermodus versprueht Ektoplasma unter hohem Druck."
  STR_KLEIN_BOTTLE_GRENADE: "Klein-Bottle-Granate"
  STR_KLEIN_BOTTLE_GRENADE_UFOPEDIA: "Ein Druckbehaelter voller Ektoplasma, das sich staendig windet, neu formt und dabei scheinbar unmoegliche geometrische Gestalten annimmt. Beschrieben wurde es als 'ein selbsthassendes Kondensat, das Menschen explodierend anspringt'. Die Granate kann unmittelbar toedlich sein und verursacht zusaetzlich Schaden an Moral und geistiger Stabilitaet. Ihr Explosionsradius ist sehr gross, sie ignoriert den Grossteil aller Panzerung und ist gegen unbelebte Objekte weitgehend harmlos.{NEWLINE}Der Grundschaden erhoeht sich um die Haelfte der psionischen Staerke des Benutzers."
  STR_KNIGHT_GHOST: "Knightly Ghost"
  STR_KNIGHT_GHOST_ARMOR: "Kampfanalyse: Knightly Ghost"
  STR_KNIGHT_GHOST_UFOPEDIA: "Wut, Angst oder auch Euphorie koennen sich manchmal in menschenaehnlicher Form manifestieren. Das geschieht besonders haeufig auf Schlachtfeldern, wo viele solche Entitaeten gleichzeitig entstehen koennen. Treffen sie aufeinander, kaempfen sie. Der Sieger absorbiert die Energie des Besiegten und entwickelt neue Mittel, Gewalt auszuueben. Am Ende bleiben nur die staerksten Krieger zurueck, gehuellt in dicke Ruestungen aus verschlungenen Feinden. Diese 'Knightly Ghosts' sind wild, entschlossen und gewaltbereit, besitzen aber auch einen Ehrenbegriff. Ihrem Ursprung entsprechend verkoerpern sie wohl alle Eigenschaften eines Kriegers - die guten wie die schlechten."
  STR_LAB_SHIP_FRAME: "Laborschiff-Huellenrahmen"
  STR_LAIR_OF_APOCALYPSE_BRIEFING: "Wir haben einen unterirdischen Ort lokalisiert, an dem sich der Kult der Apokalypse versammelt, um die laesterlichen Riten aus dem Kodex der Transfiguration zu vollziehen. Wir muessen ihre Plaene aufdecken und herausfinden, ob sie tatsaechlich ein Dimensionsportal geoeffnet haben. Um die Mission abzubrechen, fuehren Sie die X-Com-Kraefte in das Transportfahrzeug zurueck und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_LAIR_OF_APOCALYPSE_DESCRIPTION: "Wir haben einen unterirdischen Ort lokalisiert, an dem sich der Kult der Apokalypse versammelt, um die laesterlichen Riten aus dem Kodex der Transfiguration zu vollziehen. Wir muessen ihre Plaene aufdecken und herausfinden, ob sie tatsaechlich ein Dimensionsportal geoeffnet haben."
  STR_LANDER_FRAME: "Lander-Huellenrahmen"
  STR_LARGE_ALIEN_DRONE_CORPSE: "Zerstoerte grosse Alien-Drohne"
  STR_LARGE_GYM: "Grosses Fitnesszentrum"
  STR_LARGE_GYM_UFOPEDIA: "Diese groessere und fortschrittlichere Version der X-Com-Trainingsanlage kann bis zu 60 Agenten gleichzeitig ausbilden. Mit modernster Optronik ausgestattet, verfuegt sie ueber bewegliche Hologramme zur Simulation feindlicher Begegnungen, taktische Labyrinthe zur Schulung der Gefechtsreaktionen sowie ueber ganz profane, aber unverzichtbare Sportgeraete.{NEWLINE}Der Bau dieser Anlage benoetigt 5 Optronikteile."
  STR_LARGE_MILITARY_CONVOY_CHURCH_OF_DAGON: "Grosser Militaerkonvoi der Kirche Dagons"
  STR_LARGE_SCOUT_FRAME: "Grosser Scout-Huellenrahmen"
  STR_LASER_CANNON_UFOPEDIA: "Diese konventionelle Laserkanone wird mit Elerium betrieben, einer geheimnisvollen Alien-Energiequelle.{NEWLINE}TYP: STRAHL"
  STR_LASER_HAND_WEAPONS_MANUFACTURING_UFOPEDIA: "Nach der Untersuchung geborgener Laserwaffen verstehen wir nun, wie Batterien entwickelt werden koennen, die Laser-Handwaffen mit niedriger Leistung versorgen. Diese Batterien benoetigen Supraleitende Schaltkreise, die nur schwer zu beschaffen sein duerften."
  STR_LASER_PISTOL_MIB_UFOPEDIA: "Diese Laserpistole ist eine fortschrittliche Seitenwaffe. Ihre Batterie hat Ladung fur 24 Schusse.{NEWLINE}{NEWLINE}Diese Waffe herzustellen benotigt: Laserpistolen-Konstruktion."
  STR_LASER_PISTOL_MIB_XD_CLIP: "Laserpistolen-XD-Clip"
  STR_LASER_RIFLE_MIB_UFOPEDIA: "Dieses Lasergewehr wird mit einer ausgeklugelten Batterie betrieben, die 36 Schusse fasst.{NEWLINE}{NEWLINE}Diese Waffe herzustellen benotigt: Lasergewehr-Konstruktion."
  STR_LASER_RIFLE_MIB_XD_CLIP: "Lasergewehr-XD-Clip"
  STR_LASER_SMG_XD_CLIP: "Laser-MPi-XD-Clip"
  STR_LASER_SNIPER_RIFLE_XD_CLIP: "Laser-Scharfschuetzengewehr-XD-Clip"
  STR_LASER_WEAPON_RESEARCHED: "Laserwaffe erforscht"
  STR_LEAGUE_APPREHENSION_BRIEFING: "Eine Gruppe 'Ermittler' hat etwas gefunden, das sie nicht hatten sehen sollen und versuchen, es zu veroffentlichen. Wir mussen sie im Namen der globalen Sicherheit verhaften. Allerdings sind sie nur besorgte Burger, also ware es besser, sie lebend zu fassen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_LEAGUE_APPREHENSION_DESCRIPTION: "Eine Gruppe 'Ermittler' hat etwas gefunden, das sie nicht hatten finden sollen. Wir mussen sie im Namen der globalen Sicherheit verhaften. Allerdings sind sie nur besorgte Burger, also ware es besser, sie lebend zu fassen. Auf dieser Mission konnen Sie nur Verbergbare Ausrustung einsetzen, oder wir werden zu fruh erkannt werden."
  STR_LEAGUE_NODE_BRIEFING: "Diese 'besorgten Burger' radikalisieren sich und organisieren sich um Schattenorganisationen aufzudecken und blozustellen. Sie fuhren ihre Recherchen aus einem kleinen Burogebaude heraus aus. Stellen Sie sicher, dass sie damit aufhoren, aber versuchen Sie Leben zu retten wenn moglich - der Rat mag es nicht, wenn wir diese gesetzestreuen Burger eliminieren. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_LEAGUE_NODE_DESCRIPTION: "Diese 'besorgten Burger' radikalisieren sich und organisieren sich um Schattenorganisationen aufzudecken und blozustellen. Sie fuhren ihre Recherchen aus einem kleinen Burogebaude heraus aus. Stellen Sie sicher, dass sie damit aufhoren, aber versuchen Sie Leben zu retten wenn moglich - der Rat mag es nicht, wenn wir diese gesetzestreuen Burger eliminieren. Auf dieser Mission konnen Sie nur Verbergbare Ausrustung einsetzen, damit Sie nicht zu fruh erkannt werden."
  STR_LIGHTNING_THROWER_CLIP_TO_CYBERWEB_BATTERY: "Blitzwerfer-Batterieentladung"
  STR_LIGHT_FIGHTER_SHIP_FRAME: "Leichter Jaeger-Huellenrahmen"
  STR_LITTLE_BIRD_UFOPEDIA: "Ein leichter Mehrzweck-Militaerhubschrauber. Diese Version kann bis zu 4 lafettenmontierte Waffen tragen, etwa Maschinengewehre oder Raketenwerfer."
  STR_LIVE_BLACK_LOTUS_STORMCLOUD_DISASSEMBLY: "D/M: Black-Lotus-Stormcloud"
  STR_LIVE_CENTURION_DISASSEMBLY: "D/M: Cyberweb-Centurion"
  STR_LIVE_ROBOSPHERE_DISASSEMBLY: "D/M: Cyberweb-Robosphere"
  STR_LIVE_ROBOTURRET_DISASSEMBLY: "D/M: Cyberweb-Roboturret"
  STR_LIZARD_TRAP_UFOPEDIA: "Kommandant, wir haben einen Plan, um ein Reptoidenschiff in unsere Haende zu bekommen! Zuerst wollten wir ein paar Scorpoid-Banditen anheuern, damit sie eines stehlen, sobald irgendwo ein Reptoid auftaucht, doch keine dieser Soeldnerbanden ist stark genug, um ein ganzes Dorf zu ueberrennen. Stattdessen fanden wir einen jungen, ehrgeizigen Jaeger, der unter seinesgleichen sehr beliebt und mit seinen Anfuehrern ausgesprochen unzufrieden ist. Ich habe ihm daher Folgendes angeboten: Liefert er uns ein Reptoidenschiff, helfen wir ihm dabei, die Aeltesten zu stuerzen und die lokale Macht an sich zu reissen. Er hat zugestimmt!{NEWLINE}Nun warten wir auf das Signal. Sobald unser kleiner Schuetzling Bescheid gibt, muessen wir ihm und seinen Freunden helfen, die Verteidigung des Dorfes zu ueberwinden. Mit unserer ueberlegenen Ausruestung und Ihrer makellosen Taktik sollte das gut zu schaffen sein.{NEWLINE}Moegen Sie politische Spielchen nicht auch, Kommandant? Genau deshalb kaempfen wir schliesslich im Schattenkrieg!"
  STR_LOBSTERMAN: "Lobsterman"
  STR_LOBSTERMAN_ARMOR: "Kampfanalyse: Lobsterman"
  STR_LOBSTERMAN_AUTOPSY: "Autopsie: Lobsterman"
  STR_LOBSTERMAN_AUTOPSY_UFOPEDIA: "Dieses Ungeheuer wurde auf Dutzende verschiedene Arten verbessert, von denen die meisten erst sichtbar werden, wenn man seine beinahe unzerstoerbare Schale aufgebrochen hat. Die Augen wurden durch Mehrbandscanner ersetzt, waehrend das Gehirn von intelligenzsteigernden Implantaten durchsetzt ist. Die meisten uebrigen Organe wurden entweder verbessert oder vollstaendig durch alienhafte Technologie ersetzt. So furchterregend dieses Wesen auch ist, seine einzige echte Schwaeche liegt in seiner Anfaelligkeit fuer ploetzliche starke Temperaturwechsel, was mit seinem kaltbluetigen Kreislaufsystem zusammenhaengt."
  STR_LOBSTERMAN_BIOLOGIST: "Lobsterman-Biologe"
  STR_LOBSTERMAN_CORPSE: "Leiche eines Lobsterman"
  STR_LOBSTERMAN_FERAL: "Wilder Lobsterman"
  STR_LOBSTERMAN_FERAL_AUTOPSY: "Autopsie: Wilder Lobsterman"
  STR_LOBSTERMAN_FERAL_AUTOPSY_UFOPEDIA: "Diese Kreatur ist eine Monstrositaet der Gentechnik und uebertrifft in dieser Hinsicht alles, was wir bislang gesehen haben. Ihr Panzer ist nahezu unangreifbar fuer alles, was sich nicht zwischen die Platten hebeln laesst, und lacht ueber konventionelle Feuerwaffen. Die Implantate, die wir bei vielen Untersee-Abscheulichkeiten finden, fehlen hier jedoch."
  STR_LOBSTERMAN_FERAL_CORPSE: "Leiche eines wilden Lobsterman"
  STR_LOBSTERMAN_FERAL_UFOPEDIA: "Mit seiner gewaltigen Groesse und sechs Gliedmassen ist dies ein wahres Ungeheuer aus der Tiefe. Der wilde Lobsterman verfuegt offenbar nur ueber einen einfachen, kaum entwickelten Verstand. Was wir zunaechst fuer Lautaeusserungen in Dagons Sprache hielten, entpuppte sich als bedeutungsloses Nachahmen fremder Geraeusche. Dieses Wesen kann nicht wirklich sprechen und versteht nur wenig von der Welt um sich herum, wirkt aber in gewissem Rahmen dennoch vernuenftig. Es ist sogar schwer zu sagen, ob es ueberhaupt etwas mit Dagon zu tun hat."
  STR_LOBSTERMAN_HUNT: "Jagd auf das Seemonster"
  STR_LOBSTERMAN_HUNT_BRIEFING: "Es haeufen sich Berichte ueber seltsame Kreaturen, beschrieben als 'riesige Hummer', die Kuestengebiete unsicher machen. Spueren Sie eines dieser Wesen auf und fangen Sie es ein, bevor es fuer Schwimmer oder Schiffe zur Gefahr wird. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_LOBSTERMAN_NAVIGATOR: "Lobsterman-Navigator"
  STR_LOBSTERMAN_OVERLORD: "Lobsterman-Oberherr"
  STR_LOBSTERMAN_OVERSEER: "Lobsterman-Aufseher"
  STR_LOBSTERMAN_SOLDIER: "Lobsterman-Soldat"
  STR_LOBSTERMAN_TECHNICIAN: "Lobsterman-Techniker"
  STR_LOBSTERMAN_UFOPEDIA: "Trotz seiner massigen Gestalt besitzt dieses Wesen eine scharfe, fremdartige Intelligenz. Seine erweiterten Wahrnehmungen erlauben ihm, unsere Bewegungen selbst durch Eindaemmungswaende zu verfolgen, und sein kalkulierendes Wesen macht klassische Verhoermethoden weitgehend nutzlos. Wesentlich ergiebiger war die muhsame Extraktion von Daten aus seinen Schaedelimplantaten: Soweit wir erkennen koennen, sind diese Kreaturen lebende Auslaeufer von T'leth selbst, gelenkt ueber das MC-Netzwerk. Ruecksichtslos effizient, scheinen sie als erkennbare Emotion lediglich eine Art Genugtuung bei der Erfuellung ihrer Aufgaben zu empfinden."
  STR_LOBSTERMAN_USO_FLEET_CRUISER: "Flottenversorgungskreuzer von T'leth"
  STR_LOBSTERMAN_USO_FLEET_CRUISER_BRIEFING: "Unsere Freunde bei Hydrospace Dynamics haben einen Flottenversorgungskreuzer zur Landung gezwungen. Ihr Auftrag besteht darin, das Schiff zu stuermen und so viel Unterwassertechnologie sowie so viele Gefangene wie moeglich in unsere Haende zu bringen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_LOBSTERMAN_USO_FLEET_CRUISER_DESCRIPTION: "Unsere Freunde bei Hydrospace Dynamics haben einen Flottenversorgungskreuzer zur Landung gezwungen. Ihr Auftrag besteht darin, das Schiff zu stuermen und so viel Unterwassertechnologie sowie so viele Gefangene wie moeglich in unsere Haende zu bringen."
  STR_LOBSTERMAN_WEAPON: "Lobsterman-Klauen"
  STR_LOST_ALIEN_SHIP_DATA: "Daten ueber ein verlorenes Alienschiff"
  STR_LOST_ALIEN_SHIP_DATA_ANALYSIS: "Analyse der Daten zum verlorenen Alienschiff"
  STR_LOST_ALIEN_SHIP_DATA_ANALYSIS_UFOPEDIA: "Nach einer sorgfaeltigen Auswertung der Kiryu-Kai-Protokolle war es nicht schwer, die Flugbahn der Kitsune-106 nachzuvollziehen. Wir fanden das Wrack halb im Dschungel von Borneo vergraben. Es war voellig verlassen, doch an der Huelle fanden wir Spuren ballistischer Treffer. Offenbar hat jemand aktiv dazu beigetragen, dass der Testflug scheiterte.{NEWLINE}Die Schaeden an der Huelle sind erheblich, aber das Alien-Material ist widerstandsfaehig genug, um das Schiff in einem Stueck zusammenzuhalten. Mit unseren Ressourcen sollten wir Kiryu-Kai bei der Wiederherstellung der Kitsune-106 deutlich uebertreffen koennen. Es ist allerdings unwahrscheinlich, dass wir ihre Triebwerkstechnologie jemals in unseren Laboren reproduzieren; dafuer braeuchten wir einen voellig neuen Zweig der chemischen Industrie, den es auf der Erde derzeit schlicht nicht gibt."
  STR_LOST_ALIEN_SHIP_DATA_DESCRIPTION: "Kommandant, ich habe dringende Neuigkeiten zu etwas, das ich in alten Kiryu-Kai-Akten gefunden habe. Bitte lesen Sie meinen Bericht umgehend.{NEWLINE}- Stabswissenschaftler"
  STR_LOST_ALIEN_SHIP_DATA_UFOPEDIA: "Wir sind in alten Kiryu-Kai-Akten auf ein interessantes Geruecht gestossen. Demnach barg die Organisation einst ein abgestuerztes Alienschiff aus dem Meer. Es gab keine Spur einer Besatzung, doch das Bergungsteam fand Abbildungen humanoider Gestalten mit katzen- oder fledermausartigen Ohren. In den meisten Bereichen wirkte das Schiff deutlich weniger fortschrittlich als uebliche Alien-Technik; nur im Bereich der Energiechemie schien es ueberlegen.{NEWLINE}Der erstaunlichste Teil der Geschichte ist jedoch, dass das Team das Schiff irgendwie instand setzte und es nach einer Figur aus der japanischen Folklore 'Kitsune-106' nannte. Leider ging das Schiff waehrend eines Testflugs verloren, kurz bevor Kiryu-Kai selbst zerschlagen wurde.{NEWLINE}Wir haben gute Gruende anzunehmen, dass das Schiff noch immer geborgen werden kann und dass wir dieser Spur Ressourcen widmen sollten."
  STR_LOST_USO: "Verlorenes Alien-Schiff"
  STR_LOST_USO_UFOPEDIA: "Bei der Erkundung der Aussenbezirke der Alien-Stadt hat unsere Drohne etwas fotografiert, das eindeutig nach Maschinerie der Zivilisation von T'leth aussieht - moeglicherweise ein grosses Schiff. Das ist ein beispielloser Fund: Wie kam dieses Fahrzeug hierher? Und warum?{NEWLINE}Durch sorgfaeltige Messungen des umliegenden Felsmaterials stellten wir fest, dass das Schiff vor ungefaehr 3000 Jahren hier abgestuerzt sein muss. Wir wissen nicht, was den Absturz verursacht hat, aber es muss eine sehr besondere Mission gewesen sein. Wir sollten uns dieses Schiff dringend genauer ansehen!{NEWLINE}Die Einheimischen scheinen sich wenig um das Wrack zu kuemmern, doch sie unterhalten offenbar eine Art Sicherheitssystem: irgendwelche Wachbestien. Und die sehen ausgesprochen zaeh aus."
  STR_LO_WO_REFUGE_BRIEFING: "Durch die gemeinsame Arbeit unseres Nachrichtendienstes und Interpols konnten wir endlich das geheime Refugium von Meister Lo Wo aufspueren, dem Mentor der Assassinen von Black Lotus. Er muss gefangen genommen oder ausgeschaltet werden. Bleiben Sie wachsam: Er ist verschlagen und von seinen Schuelern umgeben. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_LO_WO_REFUGE_DESCRIPTION: "Durch die gemeinsame Arbeit unseres Nachrichtendienstes und Interpols konnten wir endlich das geheime Refugium von Meister Lo Wo aufspueren, dem Mentor der Assassinen von Black Lotus. Er muss gefangen genommen oder ausgeschaltet werden. Wir bekommen nur diese eine Chance - wenn wir scheitern, wird er nie wieder auftauchen."
  STR_LUCHADOR_ARMOR: "Kampfanalyse: Luchador"
  STR_LUNAR_SATELLITE_OBSERVATION_UFOPEDIA: "Lunarer Hyperwellenwachter: AUSGEFAHREN{NEWLINE}Orbitalbahn: STABIL{NEWLINE}Triebwerk: VERFUGBAR{NEWLINE}Hyperwellenfelder: VERFUGBAR{NEWLINE}Missionsstand: AKTIV"
  STR_MADMAN_RAMPAGE_BRIEFING: "Ein unglucklicher Burger erfuhr streng gehutete Geheimnisse uber die Auerirdischen, die Regierung, und andere anverwandte Themen. Dieser Schock lie ihn zum Extremisten werden, und er plant einen Terrorangriff, um die Aufmerksamkeit der Bevolkerung auf den laufenden geheimen Krieg zu lenken. Wir mussen ihn konfrontieren und ausschalten, bevor er zu viele Menschen totet. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_MADMAN_RAMPAGE_DESCRIPTION: "Ein unglucklicher Burger erfuhr streng gehutete Geheimnisse uber die Auerirdischen, die Regierung, und andere anverwandte Themen. Dieser Schock lie ihn zum Extremisten werden, und er plant einen Terrorangriff, um die Aufmerksamkeit der Bevolkerung auf den laufenden geheimen Krieg zu lenken.{NEWLINE}Wir mussen ihn konfrontieren und ausschalten, bevor er zu viele Menschen totet. Behandeln Sie ihn als gefahrlich und bewaffnet."
  STR_MAGMA_CHAINSAWBOT: "M.A.G.M.A.-Chainsawbot"
  STR_MAGMA_CHAINSAWBOT_ARMOR: "Kampfanalyse: M.A.G.M.A.-Chainsawbot"
  STR_MAGMA_CHAINSAWBOT_WEAPON: "M.A.G.M.A.-Chainsawbot-Klinge"
  STR_MAGMA_CHAINSAWBOT_WEAPON_UFOPEDIA: "Dieses Motorwerkzeug ist an einem ausfahrbaren mechanischen Arm montiert und kann Ziele mehrere Meter von der Huelle des Roboters entfernt erreichen. Falls ein solcher Roboter jemals Amok laeuft, duerfte diese Reichweite fuer ahnungslose X-Com-Agenten zu einer ausgesprochen boesen Ueberraschung werden."
  STR_MAGMA_CONTACT: "Kontakt: M.A.G.M.A.-Korporation"
  STR_MAGMA_CONTACT_PREQ: "Kontakt: M.A.G.M.A.-Voraussetzung"
  STR_MAGMA_CONTACT_UFOPEDIA: "Wir haben Kontakt zur M.A.G.M.A.-Korporation aufgenommen, einem verschwiegenen Forschungs- und Entwicklungskonzern aus Nowosibirsk, der sich auf Biotechnik, Hochenergietechnik und Schusswaffen spezialisiert hat. Unter anderem bietet M.A.G.M.A. experimentelle Ausruestung fuer Elite-Soldaten an, die mit Waffen jenseits normaler Einsatzgrenzen umgehen koennen. Fuer einige unserer staerksten Agenten koennte dieses Angebot ausgesprochen nuetzlich sein."
  STR_MAGMA_COSMONAUT: "M.A.G.M.A.-Kosmonaut"
  STR_MAGMA_COSMONAUTS_SAVED: "M.A.G.M.A.-Kosmonauten gerettet"
  STR_MAGMA_LAB: "M.A.G.M.A.-Labor"
  STR_MAGMA_LAB_BRIEFING: "Ein abgelegenes Labor der M.A.G.M.A.-Korporation wurde von Zombies ueberrannt - vermutlich sind sie aus ihrer Verwahrung entkommen. Unsere Aufgabe ist es, den Ausbruch einzudaemmen und moeglichst herauszufinden, warum die Zombies entkommen konnten. Wir sind berechtigt, alle Gegenstaende vor Ort zu sichern, einschliesslich etwaiger Geldreserven. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MAGMA_LAB_DESCRIPTION: "Ein abgelegenes Labor der M.A.G.M.A.-Korporation wurde von Zombies ueberrannt - vermutlich sind sie aus ihrer Verwahrung entkommen. Unsere Aufgabe ist es, den Ausbruch einzudaemmen und moeglichst herauszufinden, warum die Zombies entkommen konnten."
  STR_MAGMA_MINITANK: "M.A.G.M.A.-Minitank"
  STR_MAGMA_MINITANK_ARMOR: "Kampfanalyse: M.A.G.M.A.-Minitank"
  STR_MAGMA_MINITANK_CANNON: "M.A.G.M.A.-Minitank-Kanone"
  STR_MAGMA_MISSION_MAGMA_LAB: "M.A.G.M.A.-Mission: M.A.G.M.A.-Labor"
  STR_MAGMA_MISSION_MAGMA_LAB_UFOPEDIA: "{NEWLINE}{NEWLINE}An: X-Com{NEWLINE}Von: M.A.G.M.A.-Korporation{NEWLINE}{NEWLINE}Kommandant, die M.A.G.M.A.-Korporation schaetzt die Erfahrung Ihrer Organisation im Kampf gegen ... irregulaere Feinde. Wir waeren dankbar, wenn Sie uns bei einigen heiklen Angelegenheiten zur Hand gehen wuerden, die sich absehbar ergeben werden. Wenn Sie uns helfen, solche Zwischenfaelle einzudaemmen, wird M.A.G.M.A. Sie entsprechend entlohnen. Sollte Ihr Team dabei umkommen, uebernimmt M.A.G.M.A. selbstverstaendlich keinerlei Verantwortung."
  STR_MAGMA_POWER_ARMOR: "Kampfanalyse: M.A.G.M.A.-Exo-Sturmsoldat"
  STR_MAGMA_PULSE_LMG_AA_CLIP: "Puls-LMG-Tritanium-Magazin"
  STR_MAGMA_PULSE_LMG_BUY: "Beschaffung: M.A.G.M.A. Puls-LMG"
  STR_MAGMA_PULSE_LMG_CHEM_CLIP: "Puls-LMG-Chem-Magazin"
  STR_MAGMA_PULSE_LMG_CHEM_CLIP_BUY: "Beschaffung: Puls-LMG-Chem-Magazin"
  STR_MAGMA_PULSE_LMG_CLIP: "Puls-LMG-Magazin"
  STR_MAGMA_PULSE_LMG_UFOPEDIA: "Dieses kompakte Maschinengewehr verschiesst Keramikgeschosse mit hoher Geschwindigkeit und entsprechend kraeftigem Rueckstoss."
  STR_MAGMA_PULSE_PISTOL_AA_CLIP: "Pulspistolen-Tritanium-Magazin"
  STR_MAGMA_PULSE_PISTOL_BUY: "Beschaffung: M.A.G.M.A. Pulspistole"
  STR_MAGMA_PULSE_PISTOL_CHEM_CLIP: "Pulspistolen-Chem-Magazin"
  STR_MAGMA_PULSE_PISTOL_CHEM_CLIP_BUY: "Beschaffung: Pulspistolen-Chem-Magazin"
  STR_MAGMA_PULSE_PISTOL_CLIP: "Pulspistolen-Magazin"
  STR_MAGMA_PULSE_PISTOL_UFOPEDIA: "Diese schwere Faustfeuerwaffe verschiesst Keramikmunition, die ungeschuetztes Fleisch verheerend zerreisst."
  STR_MAGMA_PULSE_RIFLE_AA_CLIP: "Pulsgewehr-Tritanium-Magazin"
  STR_MAGMA_PULSE_RIFLE_BUY: "Beschaffung: M.A.G.M.A. Pulsgewehr"
  STR_MAGMA_PULSE_RIFLE_CHEM_CLIP: "Pulsgewehr-Chem-Magazin"
  STR_MAGMA_PULSE_RIFLE_CHEM_CLIP_BUY: "Beschaffung: Pulsgewehr-Chem-Magazin"
  STR_MAGMA_PULSE_RIFLE_CLIP: "Pulsgewehr-Magazin"
  STR_MAGMA_PULSE_RIFLE_UFOPEDIA: "Dieses schwere Gewehr wurde dafuer gebaut, widerstandsfaehige Ziele wie Cyborgs oder ausserirdische Monster niederzustrecken. Seine Keramikmunition zersplittert beim Aufprall in rasiermesserscharfe Splitter."
  STR_MAGMA_PULSE_SMG: "M.A.G.M.A. Puls-SMG"
  STR_MAGMA_PULSE_SMG_AA_CLIP: "Puls-SMG-Tritanium-Magazin"
  STR_MAGMA_PULSE_SMG_BUY: "Beschaffung: M.A.G.M.A. Puls-SMG"
  STR_MAGMA_PULSE_SMG_CHEM_CLIP: "Puls-SMG-Chem-Magazin"
  STR_MAGMA_PULSE_SMG_CHEM_CLIP_BUY: "Beschaffung: Puls-SMG-Chem-Magazin"
  STR_MAGMA_PULSE_SMG_CLIP: "Puls-SMG-Magazin"
  STR_MAGMA_PULSE_SMG_UFOPEDIA: "Diese grosse Maschinenpistole verwendet leichte Keramikmunition und ist besonders wirksam gegen leicht gepanzerte Ziele."
  STR_MAGMA_REACTOR_CHAINSAWBOTS: "Stoerfall im M.A.G.M.A.-Reaktor"
  STR_MAGMA_REACTOR_CHAINSAWBOTS_BRIEFING: "Eine experimentelle Energieanlage von M.A.G.M.A. ist ausgefallen, nachdem ihre KI ausser Kontrolle geraten ist. Wir muessen die Wartungsroboter ausschalten, die sie jetzt steuert. Mehrere M.A.G.M.A.-Robotanks werden uns dabei unterstuetzen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MAGMA_REACTOR_CHAINSAWBOTS_DESCRIPTION: "Eine experimentelle Energieanlage von M.A.G.M.A. ist ausgefallen, nachdem ihre KI ausser Kontrolle geraten ist. Wir muessen uns den Wartungsrobotern stellen, die sie jetzt steuert. Mehrere M.A.G.M.A.-Robotanks werden uns dabei unterstuetzen. Achten Sie auf toedliche Strahlung!"
  STR_MAGMA_REACTOR_CHAINSAWBOTS_SAVED: "Der M.A.G.M.A.-Reaktor wurde stabilisiert."
  STR_MAGMA_REACTOR_MIB: "Angriff auf den M.A.G.M.A.-Reaktor"
  STR_MAGMA_REACTOR_MIB_BRIEFING: "Eine experimentelle Energieanlage von M.A.G.M.A. wird von den Men in Black angegriffen. Wir sollen die Kraefte von M.A.G.M.A. bei der Abwehr der Angreifer unterstuetzen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MAGMA_REACTOR_MIB_DESCRIPTION: "Eine experimentelle Energieanlage von M.A.G.M.A. wird von den Men in Black angegriffen. Wir sollten die Kraefte von M.A.G.M.A. bei der Abwehr der Angreifer unterstuetzen."
  STR_MAGMA_ROBOTANK: "M.A.G.M.A.-Robotank"
  STR_MAGMA_ROBOTANK_ARMOR: "Kampfanalyse: M.A.G.M.A.-Robotank"
  STR_MAGMA_TANK_FACTORY: "M.A.G.M.A.-Minitankfabrik"
  STR_MAGMA_TANK_FACTORY_BRIEFING: "Eine M.A.G.M.A.-Anlage zur Herstellung militaerischer Roboter hat eine schwere Fehlfunktion erlitten, wodurch ihre automatisierten Minitanks Amok laufen. Unterstuetzen Sie das Personal von M.A.G.M.A. - unbeschaedigte Minitanks und Panzerjaeger - dabei, den Roboteraufstand niederzuschlagen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MAGMA_TANK_FACTORY_DESCRIPTION: "Eine M.A.G.M.A.-Anlage zur Herstellung militaerischer Roboter hat eine schwere Fehlfunktion erlitten, wodurch ihre automatisierten Minitanks Amok laufen.{NEWLINE}Unterstuetzen Sie das Personal von M.A.G.M.A. - unbeschaedigte Minitanks und Panzerjaeger - dabei, den Roboteraufstand niederzuschlagen."
  STR_MAGMA_TANK_FACTORY_SAVED: "Die M.A.G.M.A.-Minitankfabrik wurde gesichert."
  STR_MAGMA_TARGETED_BY_MIB: "M.A.G.M.A. im Visier der Men in Black"
  STR_MAGMA_TARGETED_BY_MIB_DESCRIPTION: "Unsere interne Untersuchung des juengsten Vorfalls in einer M.A.G.M.A.-Energieanlage deutet darauf hin, dass es sich nicht um eine zufaellige Fehlfunktion, sondern um gezielte Sabotage handelte. Nach streng geheimen Daten aus dem Inneren der M.A.G.M.A.-Korporation wurde der Anschlag von niemand Geringerem als den Men in Black angezettelt. Offenbar versucht diese Fraktion jede Forschung zu stoeren, die zu neuen Energiequellen fuehren koennte - vermutlich, um jede Konkurrenz zur ausserirdischen Technologie auszuschalten. Wenn das stimmt, muessen wir bald mit weiteren Zwischenfaellen dieser Art rechnen."
  STR_MALE_CIVILIAN_ARMOR: "Kampfanalyse: Maennlicher Zivilist"
  STR_MALE_CIVILIAN_WHISTLEBLOWER_ARMOR: "Kampfanalyse: Besorgter maennlicher Buerger"
  STR_MALE_MAGMA_HEAVY: "M.A.G.M.A.-Schwersoldat"
  STR_MALE_MAGMA_HEAVY_ARMOR: "Kampfanalyse: M.A.G.M.A.-Schwersoldat"
  STR_MALE_MAGMA_POWER_GRUNT: "M.A.G.M.A.-Exo-Sturmsoldat"
  STR_MALE_MAGMA_REPRESENTATIVE: "M.A.G.M.A.-Vertreter"
  STR_MALE_MAGMA_REPRESENTATIVE_ARMOR: "Kampfanalyse: M.A.G.M.A.-Vertreter"
  STR_MALE_MAGMA_REPRESENTATIVE_UFOPEDIA: "Ein Repraesentant der M.A.G.M.A.-Korporation mit erstaunlich breiter Vertrautheit mit Hochenergiesystemen und Militaerwaffen. Fuer einen blossen Geschaeftsmann wirkt er ausgesprochen abgehaertet und weiss vermutlich deutlich mehr, als er preisgibt."
  STR_MALE_MAGMA_SECURITY: "M.A.G.M.A.-Sicherheitskraft"
  STR_MALE_MAGMA_SECURITY_ARMOR: "Kampfanalyse: M.A.G.M.A.-Sicherheitskraft"
  STR_MALE_STORMY: "Stormy (maennlich)"
  STR_MALE_STORMY_ARMOR: "Kampfanalyse: Stormy (maennlich)"
  STR_MANIFESTED_EMOTIONS: "Manifestierte Emotionen"
  STR_MANIFESTED_EMOTIONS_UFOPEDIA: "Starke, lang anhaltende Emotionen koennen unter den richtigen Umstaenden zu eigenstaendigen Wesen werden. An Orten, an denen solche Gefuehle besonders intensiv waren, kann die Anwesenheit psychisch veranlagter Menschen ihnen eine Form geben. Diese Entitaeten sind meist weitgehend geistlos und verkoerpern nur jene Emotion, die sie hervorgebracht hat. Ihre konkrete Gestalt haengt von mehreren Faktoren ab: von den Umstaenden ihrer Entstehung, von der Umgebung, in der sie gereift sind, und auch davon, was der erste Beobachter mit diesen Gefuehlen verbindet. Ein kultureller Faktor spielt also durchaus eine Rolle. Wenn die ausloesende Emotion nicht aussergewoehnlich stark war, bleiben solche Wesen normalerweise schwach und sind, grob gesprochen, eher mit 'Tieren' unter den ektoplasmatischen Lebensformen zu vergleichen."
  STR_MANNEQUIN_MADNESS: "Mannequin-Wahnsinn"
  STR_MANNEQUIN_MADNESS_BRIEFING: "Eine Gruppe 'Plastikroboter in Verkleidung' richtet in der Stadt Chaos an und stuerzt die lokale Polizei in Verwirrung. Wir muessen die Lage uebernehmen und unter Kontrolle bringen. Um die Mission abzubrechen, bringen Sie X-Com-Agenten zum Transportfahrzeug zurueck und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MANNEQUIN_MADNESS_DESCRIPTION: "Eine Gruppe 'Plastikroboter in Verkleidung' richtet in der Stadt Chaos an und stuerzt die lokale Polizei in Verwirrung. Wir muessen die Lage uebernehmen und unter Kontrolle bringen."
  STR_MANSION_DEFENSE_SYNDICATE: "Attentat des Syndikats"
  STR_MANSION_DEFENSE_SYNDICATE_BRIEFING: "Eine Ratskommissarin, die unserer Sache wohlgesonnen ist, wurde Ziel eines Elite-Mordkommandos des Syndikats. Sie muessen sie um jeden Preis retten, sonst erleiden wir einen schweren Rueckschlag. Sie wird violett tragen. Nach erfolgreichem Abschluss des Einsatzes muessen wir sie ausserdem gruendlich debriefen, worauf unsere Aufklaerungsoffizierin ausdruecklich hinweist. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen in die Ausgangszone zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_MANSION_DEFENSE_SYNDICATE_DESCRIPTION: "Eine Ratskommissarin, die unserer Sache wohlgesonnen ist, wurde Ziel eines Elite-Mordkommandos des Syndikats. Sie muessen sie um jeden Preis retten und zu unserem Stuetzpunkt bringen.{NEWLINE}Sie beginnen im Haus und arbeiten sich von dort nach aussen vor, um den Feind zu stellen. Wir werden durch das Sicherheitspersonal des Ratsmitglieds unterstuetzt. Warnung: Eliteeinheiten des Syndikats wurden in der Gegend gesichtet."
  STR_MARINE_BASE_DEFENSE_BRIEFING: "Ein Stutzpunkt von Hydrospace Dynamics wird angegriffen! Wir mussen uns beeilen, sie zu verteidigen, da sie dem Angriff nicht allein standhalten konnen. Wir konnen uns von dieser Mission nicht zuruckziehen."
  STR_MARINE_BASE_DEFENSE_DESCRIPTION: "Ein Stutzpunkt von Hydrospace Dynamics wird angegriffen! Schlagen Sie die Auerirdischen zuruck. Wir konnen uns von dieser Mission nicht zuruckziehen."
  STR_MARS_CHRYSSALID_HIVE_BRIEFING: "Der Pyramidenaufzug bringt Ihre Agenten tief unter die Oberflaeche des Planeten. Ihre einzige Chance, der geballten ausserirdischen Armee auszuweichen, ist der unwahrscheinlichste Weg: durch die riesigen, organischen Brutkammern der gefuerchteten Chryssaliden. Ihre Truppen werden in kleinere Gruppen aufgeteilt, um unentdeckt zu bleiben. Sobald Sie alle Agenten im Aufzugsbereich versammelt haben, klicken Sie auf 'Mission abbrechen', um zur naechsten Phase ueberzugehen."
  STR_MARS_CYDONIA_LANDING_BRIEFING: "Ihr Avenger ist in der Region Cydonia auf der Marsoberflaeche gelandet. Unsere Informationen besagen, dass sich in einer der Pyramiden ein gruener Zugangslift zu einer unterirdischen Anlage befindet. Sobald Sie alle Agenten im Liftbereich versammelt haben, klicken Sie auf 'Mission abbrechen', um zur naechsten Phase ueberzugehen."
  STR_MARS_THE_FINAL_ASSAULT_BRIEFING: "Nach ihrem Marsch durch die marsianische Landschaft erreichen Ihre kampfmueden Agenten das Herz eines weitlaeufigen Komplexes aus Tunneln und Kammern tief unter der Oberflaeche des Planeten. Das Alien-Gehirn ist irgendwo in diesem Labyrinth verborgen. Es muss vernichtet werden, wenn die Erde vor der Versklavung durch die Aliens bewahrt werden soll.{NEWLINE}{NEWLINE}Viel Glueck!"
  STR_MASS_DRIVER_HAND_WEAPONS_MANUFACTURING: "Konstruktion von Mass-Driver-Waffen"
  STR_MASS_DRIVER_HAND_WEAPONS_MANUFACTURING_UFOPEDIA: "Unser neues Verstaendnis von Supraleitenden Schaltkreisen ermoeglicht es uns, jede im Feld geborgene Mass-Driver-Waffe nachzubauen. Diese Loesung ist zwar teuer, uebertrifft konventionelle Waffen jedoch in Sachen Feuerkraft pro Waffenmasse deutlich."
  STR_MASS_DRIVER_PISTOL_UFOPEDIA: "Die Massenbeschleuniger-Pistole ist eine sehr wirksame Seitenwaffe, die kleine ferromagnetische Kugeln mittels einem elektromagnetischen Feld anstatt einer chemischen Explosion verschiet. Die hohere Geschwindigkeit des Projektils erhoht den Schaden ungemein und sie ist fahig die Panzerung von Fahrzeugen mit Leichtigkeit zu durchschlagen. Auerdem ist die Waffe genauer."
  STR_MEDAL_ALIEN_BASE_ASSAULT_UFOPEDIA: "Nur die zahsten und am besten ausgerusteten Agenten kommen fur eine Mission in einer Auerirdischen-Basis in Frage. Diejenigen, die uberleben, werden noch besser.{NEWLINE}+1 ZE pro Angriff auf Auerirdischen-Basis"
  STR_MEDAL_CAMPAIGN_RIBBON_UFOPEDIA: "Mehrere Einsaetze im selben Teil der Welt tun dem seelischen Gleichgewicht eines Agenten gut.{NEWLINE}+1 Nervenkraft pro Stufe, beginnend mit 20 Missionen in einer Region.{NEWLINE}+1 Moralregeneration auf Stufen II, V und VIII."
  STR_MEDAL_CARREER_MISSIONS_UFOPEDIA: "Training hat seine Grenzen; auergewohnliche Agenten werden im Feld geboren. Diese Auszeichnung wird Agenten verliehen, die viele Missionen erfolgreich abgeschlossen haben, beginnend ab der funften.{NEWLINE}Jede Stufe erhoht Gesundheit und Nervenkraft um +1."
  STR_MEDAL_CARREER_SCORE_UFOPEDIA: "Manche Agenten sind uberall, machen alles - und machen es gut. Diese Auszeichnung wird Agenten verliehen, die in genug Missionen einen hohen Punktewert gesammelt haben.{NEWLINE}+10 Mut auf Stufen IV, VII und X."
  STR_MEDAL_GLOBETROTTER_UFOPEDIA: "Verliehen fur mindestens eine Mission in jedem Land.{NEWLINE}Erhoht ZEs um +5."
  STR_MEDAL_HEALER_1: "Feldsanitaeter I"
  STR_MEDAL_HEALER_10: "Feldsanitaeter X"
  STR_MEDAL_HEALER_2: "Feldsanitaeter II"
  STR_MEDAL_HEALER_3: "Feldsanitaeter III"
  STR_MEDAL_HEALER_4: "Feldsanitaeter IV"
  STR_MEDAL_HEALER_5: "Feldsanitaeter V"
  STR_MEDAL_HEALER_6: "Feldsanitaeter VI"
  STR_MEDAL_HEALER_7: "Feldsanitaeter VII"
  STR_MEDAL_HEALER_8: "Feldsanitaeter VIII"
  STR_MEDAL_HEALER_9: "Feldsanitaeter IX"
  STR_MEDAL_HEALER_NAME: "Feldsanitaeter"
  STR_MEDAL_HEALER_UFOPEDIA: "Die Versorgung Verwundeter auf dem Schlachtfeld verlangt Praezision und ein hohes Mass an Selbstbeherrschung.{NEWLINE}+1 Nervenkraft pro Stufe, beginnend mit 10 versorgten Wunden.{NEWLINE}+10 Mut auf Stufen V und X."
  STR_MEDAL_LONESURVIVOR_UFOPEDIA: "Manche Menschen werden durch schlecht laufende Missionen zum Einzigen Uberlebenden. Andere arbeiten einfach lieber allein. Wie auch immer, eine Mission als einziges X-Com-Mitglied vor Ort abzuschlieen, schadet kunftiger Kooperation, aber macht den Uberlebenden auch flexibler.{NEWLINE}Jede Stufe erhoht ZE um +1. Stufen III, VI und IX senken Mut um -10."
  STR_MEDAL_MISSION_KILLS_11_UFOPEDIA: "Verliehen fur mindestens 11 Abschusse in einer Mission. Wofur bezahlen wir die anderen Agenten eigentlich...{NEWLINE}Jede Stufe erhoht Gesundheit um +2."
  STR_MEDAL_MISSION_KILLS_5_UFOPEDIA: "5 Ziele in einer Mission zu toten ist Schwerstarbeit. Es verleiht... Personlichkeit.{NEWLINE}Jede Stufe erhoht Ausdauer um +2."
  STR_MEDAL_PEST_CONTROLLER_UFOPEDIA: "Fur Erfolge in der Ausrottung der auerirdischen Bedrohung mittels chemischer. entweder flussiger oder gasformiger Wirkmittel.{NEWLINE}Jede Stufe abwechselnd +1 auf Betaubungsregeneration, Ausdauer oder Nervenkraft. Fur Stufe X stattdessen +10 Mut."
  STR_MEDAL_SAVEDALL_UFOPEDIA: "Jedem Agenten verliehen, der es schafft, wahrend einer Mission die Leben aller Zivilisten und X-Com-Verbundeten zu bewahren.{NEWLINE}Jede Stufe erhoht Nervenkraft um +1. Zusatzlich +10 Mut auf Stufen III, VI und X."
  STR_MEDIUM_GROUND_CONVOY_BLACK_LOTUS: "Mittlerer Black-Lotus-Konvoi"
  STR_MEDIUM_GROUND_CONVOY_CHURCH_OF_DAGON: "Mittlerer Konvoi der Kirche Dagons"
  STR_MEDIUM_GROUND_CONVOY_EXALT: "Mittlerer EXALT-Konvoi"
  STR_MEDIUM_GROUND_CONVOY_ZSRR: "Mittlerer Konvoi der Morgenroete"
  STR_MEDIUM_MILITARY_CONVOY_BLACK_LOTUS: "Mittlerer militaerischer Black-Lotus-Konvoi"
  STR_MEDIUM_MILITARY_CONVOY_CHURCH_OF_DAGON: "Mittlerer Militaerkonvoi der Kirche Dagons"
  STR_MEDIUM_MILITARY_CONVOY_EXALT: "Mittlerer militaerischer EXALT-Konvoi"
  STR_MEDIUM_MILITARY_CONVOY_ZSRR: "Mittlerer Militaerkonvoi der Morgenroete"
  STR_MEDIUM_SCOUT_FRAME: "Mittlerer Scout-Huellenrahmen"
  STR_MEET_THE_COVEN: "Trefft den Zirkel"
  STR_MEET_THE_COVEN_UFOPEDIA: "Wir sind die Uralten. Da ihr euch bewaehrt habt, sind wir bereit, euch als Verbuendete zu betrachten. Und wir brauchen eure Hilfe.{NEWLINE}Wir haetten die Neugeborenen laengst gezuegelt, waere da nicht eine schreckliche Macht, die sie lenkt - eine Macht, die selbst wir nicht vollstaendig verstehen. Eine maechtige Entitaet hat ihre Gedanken und Ziele uebernommen, sie gegen uns gewendet und mit Hass erfuellt. Dieses raetselhafte Wesen traegt den Namen Pharao.{NEWLINE}Wir muessen diesen dunklen Tyrannen stuerzen. Sein Hort ist fuer einen Frontalangriff zu gut bewacht, also wollen wir einen kleinen Trupp Ritter entsenden. Werden eure Leute sie begleiten?"
  STR_MEGAZOMBIE_ARMOR: "Kampfanalyse: Megazombie"
  STR_MEGAZOMBIE_AUTOPSY: "Autopsie: Megazombie"
  STR_MEGAZOMBIE_AUTOPSY_UFOPEDIA: "Diese Zombievariante wurde kuenstlich erschaffen, indem man einen Fetten Zombie ueberfuetterte und zugleich seine Weiterentwicklung zum Infektor unterdrueckte. Infolgedessen wurde die ueberschuessige Energie fast vollstaendig in Koerpermasse umgewandelt, was einen ungewoehnlich grossen und starken Fetten Zombie hervorbrachte. Sein Koerper verfuetgt ueber zusaetzliche Energiereserven und damit ueber enorme Vitalitaet."
  STR_MEGAZOMBIE_CORPSE: "Leiche eines Megazombies"
  STR_MEGAZOMBIE_UFOPEDIA: "Der Megazombie verfuegt gegenueber seiner Grundform, dem Fetten Zombie, ueber keine grundsaetzlich neuen Spezialfaehigkeiten. Doch seine enorme Zaehigkeit und seine immer noch recht hohe Geschwindigkeit machen ihn zu einem gefaehrlichen Gegner. Wenn Sie auf eines dieser Wesen treffen, empfiehlt sich der grossflaechige Einsatz von Spreng- oder Brandwaffen. Wie bei allen Zombies sind Energiewaffen vergleichsweise ineffizient."
  STR_MERIDIAN_HUNTING_BRIEFING: "Wir haben den beruchtigten Meridian aufgespurt, einen auerirdischer Kopfgeldjager, der auf der Erde tatig ist. Wir wissen sehr wenig uber dieses Wesen, also machen sie sich auf alles gefasst. Trotzdem, es ist nur ein Typ, wie schwer kann das sein... Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_MERIDIAN_HUNTING_DESCRIPTION: "Wir haben den beruchtigten Meridian aufgespurt, einen auerirdischer Kopfgeldjager, der auf der Erde tatig ist. Diese Individuum ist in der Tat auf einer Mord-Mission, also erwarten Sie, ihn bewaffnet und bereit vorzufinden. Diese Chance kehrt nicht wieder!"
  STR_MESSAGE_FROM_MAGMA_01_UFOPEDIA: "{NEWLINE}{NEWLINE}An: X-Com{NEWLINE}Von: M.A.G.M.A.-Korporation{NEWLINE}{NEWLINE}Seien Sie gegruesst, Kommandant, im Namen der M.A.G.M.A.-Korporation. Falls eine Vorstellung noetig ist: Wir gehoeren zu den fuehrenden Unternehmen im Markt fuer Hochenergie- und Waffentechnik. Es ist gut, dass wir nun endlich miteinander sprechen; wir koennen einander bei der Verteidigung unseres Planeten gegen jene fremdartigen Bedrohungen helfen, ueber die X-Com bereits so viel gelernt hat. Zunaechst gewaehrten wir Ihnen Zugang zu einigen unserer Standardprodukte - ohne weitere Fragen. Im Gegenzug erwarten wir Ihre diskrete Kooperation, falls M.A.G.M.A. auf etwas stoesst, das in Ihren Fachbereich faellt. Und so, wie sich die Welt entwickelt, scheint das unausweichlich zu sein; wir geben unseren Anspruch, die Menschheit zu verbessern, nicht auf. Moege dies der bescheidene Beginn einer grossen Initiative sein, Kommandant.{NEWLINE}Wenn Sie fuer uns taetig werden moechten, schliessen Sie bitte das Forschungsprojekt 'M.A.G.M.A.-Mission: M.A.G.M.A.-Labor' ab. Damit wird unser Vertrag bestaetigt."
  STR_MESSAGE_FROM_MAGMA_02_UFOPEDIA: "{NEWLINE}{NEWLINE}An: X-Com{NEWLINE}Von: M.A.G.M.A.-Korporation{NEWLINE}{NEWLINE}Ausgezeichnete Arbeit in jener Anlage, Kommandant. Durch Ihre Unterstuetzung konnte unsere Saeuberungsoperation reibungslos voranschreiten.{NEWLINE}Vergessen Sie jedoch bitte nicht, dass Ihr eigentliches Ziel darin besteht, den Ausloeser dieses Zwischenfalls aufzudecken. Solange wir die Ursache nicht kennen, muessen wir mit einer Wiederholung rechnen."
  STR_MESSAGE_FROM_MAGMA_03_UFOPEDIA: "{NEWLINE}{NEWLINE}An: X-Com{NEWLINE}Von: M.A.G.M.A.-Korporation{NEWLINE}{NEWLINE}Kommandant, die M.A.G.M.A.-Korporation ist mit Ihrer effizienten Aufklaerung des Virusfalls aeusserst zufrieden. Wir sind der Ansicht, dass diese Zusammenarbeit fuer alle Beteiligten gewinnbringend war - abgesehen vom Syndikat.{NEWLINE}Als naechsten Schritt dieser fruchtbaren Kooperation gewaehrten wir Ihnen Zugang zu einem exklusiven Produkt: der schweren Kanone. Diese experimentelle Waffe duerfte sich in Ihrem Arbeitsfeld als ausserordentlich wertvoll erweisen.{NEWLINE}Leider bleibt das verraterische Syndikat unser gemeinsamer Feind, und auch andere Kraefte bedrohen weiterhin die Menschheit. Wir werden uns wieder melden, sobald der richtige Zeitpunkt fuer das naechste Angebot gekommen ist."
  STR_MESSAGE_FROM_MAGMA_04_UFOPEDIA: "{NEWLINE}{NEWLINE}An: X-Com{NEWLINE}Von: M.A.G.M.A.-Korporation{NEWLINE}{NEWLINE}Kommandant, die M.A.G.M.A.-Korporation dankt Ihnen erneut fuer Ihre mehr als angemessene Unterstuetzung.{NEWLINE}Vielleicht interessieren Sie sich fuer ein weiteres exklusives Produkt aus unserem Haus: die beruehmte Auto-Kanone. Wir sind sicher, dass Sie ihre Vorzuege zu schaetzen wissen."
  STR_MESSAGE_FROM_MAGMA_05_UFOPEDIA: "{NEWLINE}{NEWLINE}An: X-Com{NEWLINE}Von: M.A.G.M.A.-Korporation{NEWLINE}{NEWLINE}Kommandant, die M.A.G.M.A.-Korporation weiss Ihre rechtzeitige Hilfe sehr zu schaetzen.{NEWLINE}Mit diesem Einsatz haben Sie sich das Vertrauen von M.A.G.M.A. verdient. Bitte werfen Sie einen Blick auf unsere streng geheime Reihe von Pulswaffen: Niemand sonst hat etwas Vergleichbares anzubieten - es sei denn, Sie entscheiden sich dafuer, diese Linie selbst zu erwerben."
  STR_MESSAGE_FROM_MAGMA_ALIEN_GARDENS: "Nachricht von M.A.G.M.A.: Alien Gardens"
  STR_MESSAGE_FROM_MAGMA_ALIEN_GARDENS_UFOPEDIA: "{NEWLINE}{NEWLINE}An: X-Com{NEWLINE}Von: M.A.G.M.A.-Korporation{NEWLINE}{NEWLINE}Kommandant, wir haben von gemeinsamen Kontakten gehoert, dass Sie ausgesprochen interessante Entdeckungen auf dem Gebiet der ausserirdischen Chemie gemacht haben. Das passt hervorragend zu einem unserer Waffenforschungsprojekte, das Ihnen gewiss zusagen wird: Munition, die eigens dafuer entwickelt wurde, persoenliche Panzerung zu durchdringen. Wenn Sie diese Technologie mit unserem Unternehmen teilen, koennen wir Ihnen mit Sicherheit revolutionaere Feldausruestung anbieten.{NEWLINE}Wenn Sie glauben, dass wir ins Geschaeft kommen koennen, schliessen Sie bitte den Bericht 'Alien Gardens teilen' ab."
  STR_MESSAGE_FROM_MAGMA_ALLOY_AMMO: "Nachricht von M.A.G.M.A.: Tritaniummunition"
  STR_MESSAGE_FROM_MAGMA_ALLOY_AMMO_UFOPEDIA: "{NEWLINE}{NEWLINE}An: X-Com{NEWLINE}Von: M.A.G.M.A.-Korporation{NEWLINE}{NEWLINE}Kommandant, die M.A.G.M.A.-Korporation interessiert sich sehr fuer die Tritaniummunition, die Sie entwickelt haben. Wenn Sie die Spezifikationen mit uns teilen, statten wir Sie mit neuer, bemerkenswerter Ware aus - voll kompatibel mit unseren fuehrenden Produktlinien.{NEWLINE}Wenn Sie diesem Angebot zustimmen, schliessen Sie bitte den Bericht 'Tritaniummunition teilen' ab."
  STR_MESSAGE_FROM_MAGMA_ELERIUM_EXPLOSIVES: "Nachricht von M.A.G.M.A.: Eleriumsprengstoffe"
  STR_MESSAGE_FROM_MAGMA_ELERIUM_EXPLOSIVES_UFOPEDIA: "{NEWLINE}{NEWLINE}An: X-Com{NEWLINE}Von: M.A.G.M.A.-Korporation{NEWLINE}{NEWLINE}Kommandant, es ist uns eine Freude, Sie erneut zu kontaktieren. Wie Sie wissen, vertrete ich einen der fuehrenden Waffenhersteller dieses Planeten, dessen Konstruktionen im laufenden interstellaren Konflikt von entscheidender Bedeutung sein duerften. So sehr wir auch auf unsere eigenen Entwicklungen stolz sind - die Erde kann es sich nicht leisten, die Konkurrenz zu ignorieren, zumal wenn sie ausserirdischen Ursprungs ist.{NEWLINE}Daher moechte ich Ihnen ein fuer beide Seiten nuetzliches Geschaeft vorschlagen: Wenn Sie Ihre Daten ueber eleriumbasierte Sprengstoffe mit uns teilen, koennen wir Ihnen noch mehr Feuerkraft anbieten. Angesichts Ihrer offenkundigen Vorliebe fuer unsere Produkte gehen wir davon aus, dass Sie dieses Angebot kaum ablehnen werden. Schliesslich steht der ganze Planet auf dem Spiel.{NEWLINE}Wenn Sie einverstanden sind, schliessen Sie bitte den Bericht 'Eleriumsprengstoff-Technologie teilen' ab."
  STR_MESSAGE_FROM_MAGMA_POWER_ARMOR: "M.A.G.M.A.-Angebot: Power Armor"
  STR_MESSAGE_FROM_MAGMA_POWER_ARMOR_UFOPEDIA: "{NEWLINE}{NEWLINE}An: X-Com{NEWLINE}Von: M.A.G.M.A.-Korporation{NEWLINE}{NEWLINE}Kommandant, Sie haben auf unsere vernuenftigen Bitten stets ebenso vernuenftig reagiert. Dank Partnern wie Ihnen ist die M.A.G.M.A.-Korporation auf dem besten Weg, den weltweiten Energiemarkt zu dominieren. Doch wir haben unsere urspruengliche Spezialitaet nie aufgegeben: Militaerausruestung. Mit diesen erstaunlichen Technologien koennen wir Ihnen nun eine neue Form des Koerperschutzes anbieten: die Power Armor!{NEWLINE}Dieses Prachtexemplar wird nur an unsere vertrauenswuerdigsten Kunden verkauft. Und Sie stehen auf dieser Liste ganz oben."
  STR_MESSAGE_FROM_MAGMA_POWER_SOURCE_MINIATURIZATION_UFOPEDIA: "{NEWLINE}{NEWLINE}An: X-Com{NEWLINE}Von: M.A.G.M.A.-Korporation{NEWLINE}{NEWLINE}Kommandant, wie Sie wissen, ist die M.A.G.M.A.-Korporation weltweit fuehrend in der Energietechnik, einschliesslich experimenteller Fusionsreaktoren. So effizient diese Reaktoren auch sind, sie lassen sich nicht miniaturisieren und bleiben vollkommen unbeweglich. Ausserirdische Energietechnik dagegen ist von Grund auf modular und skalierbar aufgebaut.{NEWLINE}Wenn Sie deren Geheimnisse mit uns teilen, koennte das fuer uns beide aeusserst gewinnbringend sein.{NEWLINE}Wenn Sie diesem Angebot zustimmen, schliessen Sie bitte den Bericht 'Eleriumbatterie-Technologie teilen' ab."
  STR_MESSAGE_FROM_MAGMA_TERRAMITE_UFOPEDIA: "{NEWLINE}{NEWLINE}An: X-Com{NEWLINE}Von: M.A.G.M.A.-Korporation{NEWLINE}{NEWLINE}Kommandant, uns ist aufgefallen, dass Sie auf ein ausgesprochen interessantes neues Material gestossen sind. Solche Festigkeit, solche Eleganz! Vielleicht waeren Sie bereit, seine Eigenschaften im Namen der Wissenschaft mit uns zu teilen? Das wuerde es uns erlauben, Ihnen kuenftig neue und bessere Produkte anzubieten.{NEWLINE}Wenn Sie zustimmen, schliessen Sie bitte den Bericht 'Terramit-Technologie teilen' ab."
  STR_MESSENGERS_OF_DAGON_UFOPEDIA: "Es sieht so aus, als seien die Boten, von denen die Kultisten Dagons sprechen, keineswegs ein Mythos. Sie kommen tatsaechlich aus dem Meer und sind hoechstwahrscheinlich keine Menschen. Wer oder was sie auch sein moegen: Sie verfuegen ueber Technologie jenseits menschlichen Verstaendnisses und sind damit sehr wahrscheinlich eine Gefahr fuer die Gesellschaften der Erde. Wir werden sie daher als Ausserirdische behandeln.{NEWLINE}Nun, da wir wissen, wonach wir suchen muessen, werden wir versuchen, diese Boten an Land zu stellen und mehr ueber Herkunft und Absichten zu erfahren."
  STR_MIB: "Men in Black"
  STR_MIB1_CORPSE: "Toter Men in Black-Vollstrecker"
  STR_MIB2_CORPSE: "Toter Men in Black-Wissenschaftler"
  STR_MIB4_CORPSE: "Toter Men in Black-Infanterist"
  STR_MIB5_CORPSE: "Toter Men in Black-Sturmtruppagent"
  STR_MIBTANK: "Men in Black-SWT"
  STR_MIBTANK_CORPSE: "Men in Black-Panzerwrack"
  STR_MIBTANK_TERRORIST: "Men in Black-Panzerterrorist"
  STR_MIBTANK_TERRORIST_PROCESSING: "MiB-Panzerterrorist-Verarbeitung"
  STR_MIB_AA_SHIPMENT: "Men in Black-Tritanium-Munitionslieferung"
  STR_MIB_ACTIVITY: "Men in Black-Aktivitaten"
  STR_MIB_ACTIVITY_UFOPEDIA: "Diese Organisation ahnelt der X-Com in vielerlei Hinsicht. Ausgerustet mit fortschrittlicher Technologie intervenieren sie bei Ereignissen die unmittelbar die Auerirdischen betreffen. Das angestrebte Ziel ist aber nicht die Bekampfung der Auerirdischen, sondern das Verschleiern dieser. Wir mussen einer ihrer Anfuhrer in Gewahrsam nehmen, um mehr in von den Hintergrunden in Erfahrung zu bringen."
  STR_MIB_AGENT: "Men in Black-Agent"
  STR_MIB_AGENT_ARMOR: "Kampfanalyse: Men in Black-Agent"
  STR_MIB_AGENT_UFOPEDIA: "Diese Individuen mogen auf den ersten Blick durchschnittlich wirken, aber sie wurden so gut ausgebildet und ausgerustet wie nur moglich, und besser. Sie sind fur maximale Effizienz, Unermudlichkeit und Rucksichtslosigkeit programmiert. Erwarten Sie nicht, dass sie im Kampf die Nerven verlieren.{NEWLINE}Men in Black-Agenten scheinen sich regelmaig einer Art Gedachtnisloschung oder -blockade zu unterziehen, die schwer zu durchbrechen ist, also ist es hochproblematisch bestimmte Informationen von ihnen zu erhalten."
  STR_MIB_ARMORY_SHIP: "Men in Black-Rustungsschiff"
  STR_MIB_ARMORY_SHIP_FRAME: "MiB-Waffenschiff-Rumpfgeruest"
  STR_MIB_ARMORY_SHIP_UFOPEDIA: "Ein kleineres Transportschiff, von den Men in Black gebaut und benutzt, um Ausrustung an wichtige Einheiten im Feld zu liefern. Dank auerirdischer Bauteile ist dieses Fahrzeug sehr schnell und schwierig abzufangen. Es ist dennoch gut bewaffnet fur seine Groe und Rolle. Es wird von einer kleinen Wachmannschaft bemannt."
  STR_MIB_BASE: "Men in Black-Basis"
  STR_MIB_BASE_: "Men in Black-Stutzpunkt-{0}"
  STR_MIB_BASE_ASSAULT: "Men in Black-Basisangriff"
  STR_MIB_BASE_ASSAULT_BRIEFING: "Sie bereiten sich darauf vor, eine Operationsbasis der Men in Black zu stuermen. Die Steuerzentrale muss vernichtet werden, um den Stuetzpunkt auszuschalten. Die Mission endet, sobald alle Feinde ausgeschaltet wurden. Wenn Sie sich zum Rueckzug entschliessen, sammeln Sie die verbleibenden Agenten im gruenen Ausgangsbereich und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MIB_BASE_ASSAULT_DESCRIPTION: "Wir haben eine Operationsbasis der Men in Black geortet. Diese Basis spielt eine Schluesselrolle in ihrem unheilvollen Plan, die Erde den Ausserirdischen auszuliefern, also muss sie zerstoert werden. Erwarten Sie schweren Widerstand durch Einheiten der Men in Black mit ausserirdischer Technologie."
  STR_MIB_COMBAT_ARMOR: "Kampfanalyse: Men in Black-Spezialist"
  STR_MIB_COMMANDER: "Men in Black-Kommandant"
  STR_MIB_COMMANDER_ARMOR: "Kampfanalyse: Men in Black-Kommandant"
  STR_MIB_COMMANDER_CORPSE: "Toter Men in Black-Kommandant"
  STR_MIB_COMMANDER_UFOPEDIA: "Diese Offiziere kann man als Generaele der Men in Black bezeichnen: Sie sind die maechtigsten, bestinformierten und einflussreichsten Agenten der Organisation. Als hohe Fuehrungskraefte haben sie Zugang zu den bestgehueteten Geheimnissen der Men in Black, von denen ein normaler Feldagent nur traeumen kann."
  STR_MIB_COORDINATOR: "Men in Black-Koordinator"
  STR_MIB_COORDINATOR_ARMOR: "Kampfanalyse: Men in Black-Koordinator"
  STR_MIB_COORDINATOR_CORPSE: "Toter Men in Black-Eliteagent"
  STR_MIB_COORDINATOR_UFOPEDIA: "Koordinatoren sind mittelhohe Offiziere in der Geheimarmee der Men in Black. Sie werden groeren Operationen zugeteilt, um zu assisstieren und manchmal das Kommando zu ubernehmen. Sie sind alle extrem gefahrlich auf zahlreichen Ebenen: militarisch, sozial, psychologisch, und so weiter."
  STR_MIB_COVERUP: "Men in Black-Vertuschung"
  STR_MIB_COVERUP_UFOPEDIA: "Die Men in Black betreiben auf allen Ebenen Wahrheitsverschleierung, von der Unterdrueckung lokaler Presse bis hin zu brutalen Attentaten. Die wichtigsten Faelle dienen dazu sicherzustellen, dass Aliens auf der Erde ihre finsteren Plaene unbemerkt von der Allgemeinbevoelkerung weiterverfolgen koennen. Dazu kann sogar gehoeren, die Aliens selbst zu massregeln, wenn ihre Aktionen zu offen erfolgen oder den Interessen der geheimnisvollen MiB-Fuehrung widersprechen. Ernsthafte Vertuschungsaktionen umfassen mehrere Kriegsschiffe, meist Truppentransporter. Natuerlich muessen wir uns diesen Aktivitaeten widersetzen - zum Schutz der Erde und auch zu unserem eigenen."
  STR_MIB_CRATE: "Men in Black-Kiste"
  STR_MIB_CRATE_OPENING: "Oeffne Men in Black-Kiste"
  STR_MIB_CRATE_UFOPEDIA: "Diese Kiste ist mit Xeno-Technik gesichert, was es praktisch unmoglich macht sie aufzubrechen ohne den Inhalt zu zerstoren (und unsere Werkstatt dazu). Wir haben nicht die Ressourcen, um sie zu hacken, also bleibt uns nur, ganz, ganz vorsichtig zu sein wenn wir sie mit Industriemaschinen aufstemmen.{NEWLINE}Die Men in Black-Kiste enthalt immer auch eine Einheit E-115 (die Sprengladung)."
  STR_MIB_DEFENDER: "MiB-Verteidiger"
  STR_MIB_DEFENDER_FRAME: "MiB-Verteidiger-Rumpfgeruest"
  STR_MIB_DEFENDER_UFOPEDIA: "Das fortschrittlichste Begleitschiff der Men in Black, das ausschliesslich bei den wichtigsten Missionen zum Schutz hochrangiger MiB-Offiziere eingesetzt wird. Es verfuegt ueber enorme Feuerkraft und unvergleichliche Geschwindigkeit. Die Besatzung ist klein, aber elitaer."
  STR_MIB_DOMINATION: "MiB-Dominanz"
  STR_MIB_DOMINATION_UFOPEDIA: "Wenn die Men in Black provoziert werden, koennen sie versuchen, den Luftraum der Erde durch eine Machtdemonstration zu kontrollieren. Mehrere Kriegsschiffe werden den Himmel durchkaemmen und jedes X-Com-Fahrzeug abschiessen wollen, das ihnen begegnet. Diese Mission ist fuer X-Coms Mittel ebenso wie fuer seinen Ruf ausserordentlich gefaehrlich."
  STR_MIB_DROPSHIP: "Men in Black-Landungsschiff"
  STR_MIB_DROPSHIP_FRAME: "MiB-Landungsschiff-Rumpfgeruest"
  STR_MIB_DROPSHIP_RETALIATION: "Men in Black-Vergeltung"
  STR_MIB_DROPSHIP_UFOPEDIA: "Ein leichter Truppentransporter, der nach denselben Prinzipien wie ausserirdische Schiffe gebaut wurde. Er befoerdert eine kleine Kampfgruppe durchschnittlich ausgeruesteter Truppen und Feldagenten fuer kleinere Interventionen und Untersuchungen."
  STR_MIB_ENFORCER: "Men in Black-Vollstrecker"
  STR_MIB_ENFORCER_ARMOR: "Kampfanalyse: Men in Black-Vollstrecker"
  STR_MIB_ENFORCER_UFOPEDIA: "Men in Black-Vollstrecker sind Supersoldaten, zah und gut ausgerustet. Sie agieren regelmaig in den Schatten, meistens als Leibwachter und Assassinen, und besitzen daher vielleicht Informationen uber ihre Organisation."
  STR_MIB_ENGINEERING_SHIP: "Men in Black-Pionierschiff"
  STR_MIB_ENGINEERING_SHIP_FRAME: "MiB-Ingenieursschiff-Rumpfgeruest"
  STR_MIB_ENGINEERING_SHIP_UFOPEDIA: "Ein riesiges, eleriumbetriebenes Gefahrt, das die Men in Black fur schwere Bauarbeiten benutzen. Es ist mit fortschrittlichen Maschinen irdischen und auerirdischen Ursprungs bestuckt, darunter ein Plasmaverdampfer, der fur improvisierte Luftabwehr benutzt werden kann. Die schiere Groe macht es sehr widerstandsfahig."
  STR_MIB_ESCORT_SHIP: "Men in Black-Begleitschiff"
  STR_MIB_ESCORT_SHIP_FRAME: "MiB-Begleitschiff-Rumpfgeruest"
  STR_MIB_ESCORT_SHIP_UFOPEDIA: "Ein leichtes Kampfgefahrt, mit dem die Men in Black verwundbare Schiffe beschutzen. Seine Plasmakanone macht es fur X-Com-Fahrzeuge hochgefahrlich. Die Bodenmannschaft ist rudimentar."
  STR_MIB_EXECUTOR: "Men in Black-Kaderagent"
  STR_MIB_EXECUTOR_UFOPEDIA: "Kader-Agenten fungieren als niedrige Offiziere, sind aber den hoechsten Rangen der Men in Black unterstellt - oder vielleicht deren Geldgebern. Sie fuehren kleine Trupps der Men in Black in Operationen gegen die Menschheit und verfuegen ueber seltene Fertigkeiten. Ihre Koerper sind sichtbar durch Kybernetik und Drogen modifiziert."
  STR_MIB_FREIGHT: "Men in Black-Fracht"
  STR_MIB_FREIGHT_SHIP: "Men in Black-Frachtschiff"
  STR_MIB_FREIGHT_SHIP_FRAME: "MiB-Frachtschiff-Rumpfgeruest"
  STR_MIB_FREIGHT_SHIP_UFOPEDIA: "Ein groes Schiff der Men in Black, fur rapide Umverlagerung von Vorraten. Nur maig gefahrlich, wird es aber oft von anderen Men in Black-Schiffen beschutzt."
  STR_MIB_FREIGHT_UFOPEDIA: "Men-in-Black-Basen sind von ihrem Netz abgeschottet, muessen aber dennoch versorgt werden. Alles, was nicht lokal beschafft werden kann, wird mit Tarnflugzeugen transportiert, die mit Alien-Technologie gebaut wurden. Diese Transporte zu erbeuten waere fuer X-Com aeusserst nuetzlich, doch sie werden stets von einem bewaffneten Militaerfahrzeug begleitet."
  STR_MIB_GROUND_SUPPLY: "Men in Black-Ueberlandversorgung"
  STR_MIB_HEAVY_TROOPER: "Men in Black-Schwerer Agent"
  STR_MIB_HEAVY_TROOPER_UFOPEDIA: "Diese Individuen sind Vollstrecker, die sich auf Exoskelettoperationen spezialisieren. Ihre Ausruestung ist beeindruckend, aber sie verfuegen ueber keine besonderen Faehigkeiten - jedenfalls nicht fuer Einheiten der Men in Black."
  STR_MIB_IDENTITY: "Men in Black"
  STR_MIB_IDENTITY_PREQ: "Men in Black-Voraussetzung"
  STR_MIB_IDENTITY_UFOPEDIA: "Die Men in Black und X-Com sind zwei Seiten derselben Medaille. Beide Organisationen wurden von den Spitzen der Gesellschaft gegruendet. Waehrend X-Com mit der Bekaempfung der Ausserirdischen beauftragt ist, sollen die Men in Black mit ihnen verhandeln. Es scheint, als wollten sich die Staatsoberhaeupter alle Tueren offen halten."
  STR_MIB_LUNAR_BASE: "Men in Black-Mondbasis"
  STR_MIB_LUNAR_BASE_ASSAULT_UNDERGROUND: "Men in Black-Mondbasis-Untergrund"
  STR_MIB_LUNAR_BASE_ASSAULT_UNDERGROUND_BRIEFING: "Sie haben den eigentlichen Stuetzpunkt erreicht, in dem sich die Men in Black mit ausserirdischen Anfuehrern treffen. Rechnen Sie mit schwerem Widerstand. Ihr Ziel ist das Hauptlogbuch der Men in Black, das sich derzeit in den Haenden des Stuetzpunkt-Kommandanten befindet. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MIB_LUNAR_BASE_LANDING: "Men in Black-Mondbasislandung"
  STR_MIB_LUNAR_BASE_LANDING_BRIEFING: "Diese Einrichtung dient als Treffpunkt fuer die Zusammenarbeit zwischen Ausserirdischen und den Men in Black. Dies ist unsere einzige Gelegenheit, wichtige Daten ueber zentrale Operationen der Invasoren zu erbeuten. Kaempfen Sie sich ueber die Mondoberflaeche zu einem unterirdischen Aufzug vor, der Ihre Agenten in den eigentlichen Stuetzpunkt bringt. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MIB_LUNAR_BASE_LANDING_DESCRIPTION: "Diese lunare Einrichtung dient als Treffpunkt fuer ausserirdische Zusammenarbeit mit den Men in Black. Dies ist unsere einzige Gelegenheit, wichtige Daten ueber zentrale Operationen der Ausserirdischen zu erobern. Erwarten Sie schweren Widerstand von Eliteeinheiten der Men in Black."
  STR_MIB_LUNAR_BASE_UFOPEDIA: "Die Men in Black betreiben ihre Kollaboration mit Aliens meistens auf der Erde, aber die hochsten Range der Auerirdischen weigern sich aus Sicherheitsgrunden, den Planeten zu betreten (auer in bestimmten verdeckten Operationen, an denen die Men in Black nicht unmittelbar beteiligt sind). Als einen sicheren Treffpunkt fur auerirdische VIPs unterhalten die Men in Black eine Geheimbasis auf der dunklen Seite des Monds, wo UFOs ungehindert landen konnen, weit weg von neugierigen Augen. Die Lage dieses Stutzpunkts ist nur den hochsten Rangen der Organisation bekannt und wird von machtigen Verteidigungsanlagen vor unerlaubten Landungen beschutzt. Ohne ein echt weltraumtaugliches Militar mit Raumbombern konnen wir die Basis nicht frontal angreifen."
  STR_MIB_MAGMA_ARCTIC_BASE_RAID: "Angriff der Men in Black auf eine M.A.G.M.A.-Basis"
  STR_MIB_MAGMA_ARCTIC_BASE_RAID_BRIEFING: "Eine geheime M.A.G.M.A.-Anlage fuer Waffentests in dieser Region wird angegriffen. M.A.G.M.A. bittet uns um Unterstuetzung bei der Abwehr der Men in Black. Offenbar wollen die Angreifer dort illegale ausserirdische Technologie bergen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MIB_MAGMA_ARCTIC_BASE_RAID_DESCRIPTION: "Eine geheime M.A.G.M.A.-Anlage fuer Waffentests in dieser Region wird angegriffen. M.A.G.M.A. bittet uns um Unterstuetzung bei der Abwehr der Men in Black. Offenbar wollen die Angreifer dort illegale ausserirdische Technologie bergen."
  STR_MIB_MASTER_LOG: "Hauptlogbuch der Men in Black"
  STR_MIB_MUDRANGER: "Men in Black-Mudranger"
  STR_MIB_MUDRANGER_CONVOY: "Men in Black-Mudranger-Konvoi"
  STR_MIB_MUDRANGER_CONVOY_LOADED: "Men in Black-Mudranger-Konvoi"
  STR_MIB_MUDRANGER_FRAME: "MiB-Mudranger-Rumpfgeruest"
  STR_MIB_MUDRANGER_UFOPEDIA: "Ein Mudranger, ahnlich wie unsere, den die Men in Black fur verdeckte Konstruktions-Operationen benutzten. Fur komplexere Aufgaben werden mehrere Mudranger eingesetzt. Transportiert nur grundlegende Waffen, ist aber ziemlich robust fur seine Groe und technologischem Level."
  STR_MIB_OBJECTIVE: "Ziel der Men in Black"
  STR_MIB_OBJECTIVE_UFOPEDIA: "Offenbar wurden die Men in Black von Majestic 12 geschaffen und stehen bis heute weitgehend unter ihrer Kontrolle. Ihre Entstehung geht auf das wiederholte Scheitern von Majestic 12 zurueck, die fuehrende Stellung im Rat den Illuminati wieder abzunehmen. Da diese Fraktion auf konventionellem Weg nicht an die Macht zurueckkehren konnte, entschied sie sich fuer ein Buendnis mit der neuen Kraft auf dem Spielfeld: den Ausserirdischen. Waehrend X-Com in der Praxis dafuer sorgen soll, dass die Ausserirdischen keinen Einfluss auf die Politik der Erde gewinnen, ist es die Aufgabe der Men in Black, den Ausserirdischen zuzuarbeiten, damit ihre Herren die Illuminati entmachten und mithilfe ausserirdischer Technologie das vermeintlich wahre Potenzial der Menschheit entfalten koennen."
  STR_MIB_OLD_UFO_CRASH_SITE_BRIEFING: "Die Luftwaffe hat ein UFO orten und abschiessen koennen. Allerdings sind bereits Men in Black vor Ort und haben begonnen, das Wrack zu bergen. Wir muessen mit erheblichem Widerstand der Men in Black rechnen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_MIB_OLD_UFO_CRASH_SITE_DESCRIPTION: "Die Luftwaffe konnte ein UFO orten und abschiessen. Allerdings sind die Men in Black bereits vor Ort und haben mit der Bergung des Wracks begonnen. Wenn wir uns beeilen, koennen wir noch einige ausserirdische Materialien erbeuten, muessen aber mit erheblichem Widerstand rechnen."
  STR_MIB_OLD_UFO_LANDING_SITE_BRIEFING: "Wir haben an diesem entlegenen Ort Aktivitaeten der Men in Black beobachtet. Offenbar ist hier vor einiger Zeit ein UFO kurz gelandet, und nun beseitigen die Men in Black alle verbliebenen Spuren. Das ist eine Gelegenheit, wertvolle ausserirdische Materialien sicherzustellen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MIB_OLD_UFO_LANDING_SITE_DESCRIPTION: "Wir haben an diesem entlegenen Ort Aktivitaeten der Men in Black beobachtet. Offenbar ist hier vor einiger Zeit ein UFO kurz gelandet, und nun beseitigen die Men in Black alle verbliebenen Spuren. Das ist eine Gelegenheit, wertvolle ausserirdische Materialien sicherzustellen."
  STR_MIB_OUTPOST: "Men in Black-Auenposten"
  STR_MIB_OUTPOST_: "Men in Black-Auenposten-{0}"
  STR_MIB_OUTPOST_BRIEFING: "Sie haben eine Einrichtung der Men in Black geortet. Ihre Mission ist es, sie lahmzulegen. Der Einsatz gilt als erfolgreich, wenn alle feindlichen Einheiten eliminiert oder ausgeschaltet wurden. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MIB_OUTPOST_DESCRIPTION: "Sie haben eine Einrichtung der Men in Black entdeckt, die ausserirdische Propaganda verbreitet und Forschung betreibt. Dieser Aussenposten ist erst der Anfang ihrer Aktivitaeten in der Region, entwickelt sich aber allmaehlich zu einem echten Stuetzpunkt. Wir muessen ihn zerstoeren, bevor er seinen schaendlichen Zweck erfuellt."
  STR_MIB_OUTPOST_UFOPEDIA: "Men-in-Black-Einrichtungen sind streng geheim, doch gelegentlich brauchen sie einen Standort, um Einfluss auf externe Akteure wie Regierungen oder Geheimorganisationen auszuueben. Um nicht ihre gesamte Struktur zu gefaehrden, errichten sie dann einen isolierten Aussenposten mit nur minimaler Anbindung an andere Standorte. Solche Orte dienen allen moeglichen Feldaktivitaeten, von Propaganda bis zu kleineren bewaffneten Vorstoessen. Laesst man sie gewaehren, entwickeln sie sich mit der Zeit zu vollwertigen Untergrundbasen, die fuer X-Com ein noch groesseres Problem darstellen."
  STR_MIB_PILOT: "Men in Black-Pilot"
  STR_MIB_PILOT_ARMOR: "Kampfanalyse: Men in Black-Pilot"
  STR_MIB_PILOT_CORPSE: "Toter Men in Black-Pilot"
  STR_MIB_PILOT_UFOPEDIA: "Diese Agenten der Men in Black sind nicht nur fuer den Betrieb von Fahrzeugen, sondern fuer fast jede Art von Maschine hervorragend ausgebildet. Zahlreiche kybernetische Implantate verstaerken ihre Reflexe und erleichtern die Interaktion mit den Systemen, denen sie zugeteilt werden. Ihre Persoenlichkeit verraet die rohe Intensitaet, die fuer die Men in Black typisch ist, doch sie halten sich aus direkten sozialen Konflikten eher heraus als andere Agenten. Wichtige Geheimnisse kennen sie nur selten, doch sie koennten sich an entscheidende Details ihrer Einsaetze erinnern."
  STR_MIB_POWER_SUIT: "Kampfanalyse: Schwerer Infanterist der Men in Black"
  STR_MIB_POWER_SUIT_ADAPTATION: "Men in Black-Energieanzug-Adaptation"
  STR_MIB_PSI_OPS: "Men in Black-Psi-Ops"
  STR_MIB_PSI_OPS_ARMOR: "Kampfanalyse: Men in Black-PsiOps"
  STR_MIB_PSI_OPS_ARMOR_ADAPTATION: "Men in Black-PsiOps-Abwicklung"
  STR_MIB_PSI_OPS_ARMOR_UFOPEDIA: "Men in Black-PsiOps sind stark genug um Grune Kraftschilde zu erzeugen. (Kapazitat: 125. Wiederherstellung: 20/Runde)"
  STR_MIB_PSI_OPS_CORPSE: "Toter Men in Black-Psi-Ops"
  STR_MIB_PSI_OPS_SYNTHMUSCLES_EXTRACTION: "Men in Black-PsiOps-Ruestungs-Entnahme"
  STR_MIB_PSI_OPS_UFOPEDIA: "PsiOps sind Vollstrecker, die sich auf Psi-Kampf spezialisieren. Sie sind hochgradige Psione, konnen Massenpaniken auslosen und den Willen einer durchschnittlichen Person in Sekunden brechen. Wir sollten sie ausschalten, sobald wir Sichtkontakt haben."
  STR_MIB_RETALIATION: "Men in Black-Vergeltung"
  STR_MIB_SCIENCE_SHIP: "Men in Black-Forschungsschiff"
  STR_MIB_SCIENCE_SHIP_FRAME: "MiB-Wissenschaftsschiff-Rumpfgeruest"
  STR_MIB_SCIENCE_SHIP_UFOPEDIA: "Ein leichtes Men in Black-Gefahrt mit auerirdischer Technik, fur Forschungseinsatze und Untersuchungen. Bemannt von einer kleinen Gruppe Men in Black-Wissenschaftler. Kein Kriegsschiff, aber gut bewaffnet fur seine Groe und Funktion."
  STR_MIB_SCIENTIST: "Men in Black-Wissenschaftler"
  STR_MIB_SCIENTIST_UFOPEDIA: "Wissenschaftler sind die gesichtslosen Supergehirne hinter den Wissensprojekten der Men in Black. Sie sind nicht sehr gut ausgebildet, aber auerst intelligent und haben Zugriff zu sehr interessanten Daten. Einige der hellsten Kopfe unseres Jahrhunderts sind Men in Black-Wissenschaftler, obwohl die Welt ihre Namen nie erfahren wird."
  STR_MIB_SCOUT_SHIP: "MiB-Aufklaerungsschiff"
  STR_MIB_SCOUT_SHIP_FRAME: "MiB-Aufklaerungsschiff-Rumpfgeruest"
  STR_MIB_SCOUT_SHIP_UFOPEDIA: "Ein kleines Men-in-Black-Schiff, ausgeruestet mit fuer seine Groesse erstaunlich effektiven Ortungssystemen und vor allem fuer Aufklaerung genutzt. Obwohl es kein echtes Kriegsschiff ist, uebertrifft es Jaeger mit normaler irdischer Technik deutlich und sollte als genauso gefaehrlich wie ein echtes UFO betrachtet werden. Die rudimentaere Besatzung wird von einem jungen Offizier gefuehrt."
  STR_MIB_SECTOPOD: "Men in Black-Sectopod"
  STR_MIB_SECTOPOD_CORPSE: "Men in Black-Sektopod-Wrack"
  STR_MIB_SECTOPOD_TERRORIST: "Men in Black-Sectopod-Terrorist"
  STR_MIB_SHOCK_TROOPER: "Men in Black-Stotruppagent"
  STR_MIB_SHOCK_TROOPER_ARMOR: "Kampfanalyse: Men in Black-Stosstrupp-Agent"
  STR_MIB_SHOCK_TROOPER_ARMOR_ADAPTATION: "Men in Black-Stosstrupp-Agent-Ruestungsanpassung"
  STR_MIB_SHOCK_TROOPER_CORPSE: "Toter Men in Black-Stotruppagent"
  STR_MIB_SHOCK_TROOPER_UFOPEDIA: "Dieser Men in Black-Agent wurde kybernetisch schwer modifiziert und an ein uberschweres Exoskelett angeschlossen. Eine Kombination aus auerirdischer Technologie mit radikaler Ausbildung die praktisch unaufhaltsam ist und keine Schwachpunkte hat. Die Rustung kann nicht fur normale Menschen mit einfacheren kybernetischen Implantaten angepasst werden."
  STR_MIB_STEALTH_BOMBER: "Men in Black-Tarn-Bomber"
  STR_MIB_STEALTH_BOMBER_FRAME: "MiB-Tarnbomber-Rumpfgeruest"
  STR_MIB_STEALTH_BOMBER_RETALIATION: "Men in Black-Vergeltung"
  STR_MIB_STEALTH_BOMBER_UFOPEDIA: "Dieses Kampfschiff wurde fuer Angriffe auf Bodenziele entwickelt. Dank ausserirdischer Technik ist es schnell und zugleich schlagkraeftig. Fuer Infanterieangriffe eignet es sich besonders gut, da es eine kleine, aber anpassungsfaehige und gut ausgeruestete Kampfeinheit transportiert."
  STR_MIB_STORMTROOPER: "Men in Black-Sturmtruppler"
  STR_MIB_STORMTROOPER_ARMOR: "Kampfanalyse: Men in Black-Sturmtrupp-Agent"
  STR_MIB_STORMTROOPER_ARMOR_ADAPTATION: "Men in Black-Stormtrooper-Ruestungs-Adaptation"
  STR_MIB_STORMTROOPER_ARMOR_DISASSEMBLY: "Z/L: MiB-Sturmtruppenruestung"
  STR_MIB_STORMTROOPER_UFOPEDIA: "Sturmtruppler sind die besten Angriffs-Spezialisten unter den schlagkraftigen Men in Black. Sie tragen leichte Energierustung mit Anti-Grav-Modulen und einem fast perfekten Tarnfeld. Letzteres ist leider nicht kompatibel mit unserer Ausrustung."
  STR_MIB_STRIKE_SHIP: "Men in Black-Angriffsschiff"
  STR_MIB_STRIKE_SHIP_FRAME: "MiB-Angriffsschiff-Rumpfgeruest"
  STR_MIB_STRIKE_SHIP_UFOPEDIA: "Ein uberschweres Kriegsschiff, fur Luftuberlegenheit und groere Bodenangriffe. Seine schwere Bewaffnung und Verteidigung machen es auerst gefahrlich fur X-Com. Es kann eine groe Menge Elite-Truppen tragen, darunter schwere Angriffseinheiten, und wird von hochrangigen Men in Black-Offizieren befehligt."
  STR_MIB_SUPPLY: "Men in Black-Versorgung"
  STR_MIB_SUPPLY_UFOPEDIA: "Die Versorgung von Men-in-Black-Basen ist schwierig, da sie exotische Materialien und Technologie benoetigen. Diese werden mit spezialisierten Technikschiffen herangeschafft. Das gibt X-Com eine gute Gelegenheit, ein solches Fahrzeug zu erbeuten."
  STR_MIB_TERROR: "Men in Black-Terror"
  STR_MIB_TERRORISE: "Men in Black-Saeuberungsoperation"
  STR_MIB_TERROR_MISSION: "Men in Black-Terrormission"
  STR_MIB_TERROR_MISSION_BRIEFING: "Die Men in Black loeschen eine ganze Siedlung aus, um alle Zeugen zu beseitigen. Die Mission ist erfolgreich, wenn alle gegnerischen Einheiten eliminiert oder neutralisiert wurden. Versuchen Sie mit allen Mitteln, so viele Zivilisten wie moeglich zu retten. Um die Mission abzubrechen, muessen sich alle X-Com-Agenten zum Flugzeug begeben und mit einem Klick auf 'Mission abbrechen' den Rueckzug bestaetigen."
  STR_MIB_TRANSPORTER: "Men in Black-Transporter"
  STR_MIB_TRANSPORTER_FRAME: "MiB-Transportschiff-Rumpfgeruest"
  STR_MIB_TRANSPORTER_UFOPEDIA: "Ein leichtes Mehrzweckgefahrt, mit auerirdischer Technologie konstruiert. Seine Hauptfunktion ist der schnelle, diskrete Transport wertvoller Objekte oder Mitarbeiter, aber es wird auch fur andere Zwecke eingesetzt, einschlielich Aufklarung. Es hat eine kleine Mannschaft von Spezialisten der Men in Black."
  STR_MIB_TRITANIUM_AMMO_SHIPMENT: "Men in Black-Tritanium-Munitionslieferung"
  STR_MIB_TRITANIUM_AMMO_SHIPMENT_DESCRIPTION: "Unsere Aufklaerung hat eine Lieferung an Verbuendete der Men in Black aufgespuert und abgefangen. Das sollte den Ruf unserer Feinde schaedigen, und die Fracht selbst koennte sich als nuetzlich erweisen.{NEWLINE}[100 Punkte, Tritanium-Muni-Kiste erhalten]"
  STR_MIB_WEAPONS_DISTRIBUTION: "MiB-Waffenverteilung"
  STR_MIB_WEAPONS_DISTRIBUTION_SITE: "MiB-Waffenverteilungsort"
  STR_MIB_WEAPONS_DISTRIBUTION_SITE_BRIEFING: "Die Men in Black laden Militaerlieferungen fuer ihre lokale Zweigstelle aus. Das bietet eine wertvolle Gelegenheit, etwas von ihrer Ausruestung zu erbeuten. Um die Mission abzubrechen, bringen Sie X-Com-Agenten zum Transportfahrzeug zurueck und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MIB_WEAPONS_DISTRIBUTION_SITE_DESCRIPTION: "Die Men in Black laden Militaerlieferungen fuer ihre lokale Zweigstelle aus. Das bietet eine wertvolle Gelegenheit, etwas von ihrer Ausruestung zu erbeuten. Allerdings ist Zeit entscheidend, denn der Vorgang wird voraussichtlich nur wenige Stunden dauern."
  STR_MIB_WEAPONS_DISTRIBUTION_UFOPEDIA: "Die Men in Black unterhalten ein Netz kleiner Aussenposten in grossen Staedten. Diese Standorte arbeiten weitgehend autonom, muessen aber in seltenen Faellen nachversorgt werden - typischerweise fuer Sonderauftraege oder nach unerwarteten Verlusten. Diese Aufgabe uebernehmen Waffenschiffe. Die Men in Black halten solche Einsaetze fuer von Natur aus riskant und fuehren sie nur widerwillig durch, also sollten wir jede Gelegenheit nutzen, ihre Ausruestung zu erbeuten."
  STR_MIB_XENOTECHNOLOGIST: "MiB-Xenotechnologe"
  STR_MIB_XENOTECHNOLOGIST_CORPSE: "Leiche eines MiB-Xenotechnologen"
  STR_MIB_XENOTECHNOLOGIST_POWER_SUIT: "Kampfanalyse: MiB-Xenotechnologe"
  STR_MIB_XENOTECHNOLOGIST_UFOPEDIA: "Diese Ingenieure sind hochqualifiziert und kybernetisch verbessert. Ihre Hauptaufgabe besteht darin, die von den Men in Black eingesetzte Alien-Technologie zu erforschen und instand zu halten, einschliesslich Waffen und Antriebssystemen ihrer Fahrzeuge. Aus Sicherheitsgruenden und wegen ihres anspruchsvollen Arbeitsalltags sind sie im Feld nur selten - wenn ueberhaupt - zu sehen. Sie tragen spezielle Kraftanzuege fuer schwere Arbeiten und beherrschen diese aussergewoehnlich gut. So viele wie moeglich von ihnen zu fangen und zu verhoeren ist entscheidend, denn dadurch koennten wir alienhafte Geheimnisse entschluesseln."
  STR_MILESTONE_1: "X-Com-Lagebericht Nr. 1"
  STR_MILESTONE_1_PREQ: "Voraussetzung fuer Befoerderung I"
  STR_MILESTONE_1_SUMMARY: "Befoerderung I"
  STR_MILESTONE_1_SUMMARY_UFOPEDIA: "IHNEN WURDEN ZUSAETZLICHE VOLLMACHTEN UEBERTRAGEN.{NEWLINE}SIE TRAGEN NUN DEN NAMEN X-COM: PARANORMAL ACTIVITY UNIT{NEWLINE}{NEWLINE}Neu zum Kauf verfuegbar: Schutzanzug, Rauchgranate."
  STR_MILESTONE_1_UFOPEDIA: "Von: X-Com: Global Investigation Bureau{NEWLINE}An: Komitee der Vereinten Nationen{NEWLINE}Betreff: Paranormale Aktivitaet{NEWLINE}Unsere Untersuchungen anomaler Vorfaelle rund um den Globus haben bestaetigt, dass diese Ereignisse tatsaechlich durch Faktoren verursacht werden, die sich mit herkoemmlichem wissenschaftlichem Wissen nicht erklaeren lassen. Zu den auffaelligsten Beispielen gehoeren abnorme biologische Organismen (siehe Anhang Nr. 2), doch wir glauben, dass der groesste Anlass zur Sorge fuer die UN im Auftreten geheimer terroristischer Organisationen liegt, die offenbar in irgendeiner Verbindung zu diesen paranormalen Aktivitaeten stehen. Wir empfehlen dem Komitee der Vereinten Nationen nachdruecklich, zusaetzliche Schritte zur Aufklaerung dieser Gruppen einzuleiten."
  STR_MILESTONE_2: "X-Com-Lagebericht Nr. 2"
  STR_MILESTONE_2_SUMMARY: "Befoerderung II"
  STR_MILESTONE_2_SUMMARY_UFOPEDIA: "IHNEN WURDEN ZUSAETZLICHE VOLLMACHTEN UEBERTRAGEN.{NEWLINE}SIE TRAGEN NUN DEN NAMEN X-COM: PARANORMAL SECURITY AGENCY"
  STR_MILESTONE_2_UFOPEDIA: "Von: X-Com: Paranormal Activity Unit{NEWLINE}An: Komitee der Vereinten Nationen{NEWLINE}Betreff: UFO: Unbekannter Feind{NEWLINE}Unsere Untersuchungen der juengsten paranormalen Aktivitaeten haben handfeste Beweise dafuer geliefert, dass die 'Kulte' mit einer ausserirdischen Macht verbunden sind, die diese Organisationen aktiv unterstuetzt. Dieselbe Macht scheint auch hinter den ungewoehnlichen biologischen Phaenomenen zu stehen, die wir auf der Erde genauer untersuchen konnten. Wir kennen weder die Ziele noch die Vorgehensweise dieser Aliens, doch ihre Aktivitaeten wirken koordiniert und global. Da diese Aktivitaeten offenbar Unordnung foerdern und Menschenleben gefaehrden, empfehlen wir, die Aliens bis auf Weiteres als der Menschheit feindlich gesinnt einzustufen und groessere Mittel fuer die weitere Aufklaerung dieser Bedrohung bereitzustellen."
  STR_MILESTONE_3: "X-Com-Lagebericht Nr. 3"
  STR_MILESTONE_3_PREQ: "Voraussetzung fuer Befoerderung III"
  STR_MILESTONE_3_SUMMARY: "Befoerderung III"
  STR_MILESTONE_3_SUMMARY_UFOPEDIA: "IHNEN WURDEN ZUSAETZLICHE VOLLMACHTEN UEBERTRAGEN.{NEWLINE}SIE TRAGEN NUN DEN NAMEN X-COM: UFO DEFENSE"
  STR_MILESTONE_3_UFOPEDIA: "Von: X-Com: Paranormal Security Agency{NEWLINE}An: Komitee der Vereinten Nationen{NEWLINE}Betreff: Alien-Verschwoerung{NEWLINE}Unsere Schlussfolgerungen zu allen alienhaften Aktivitaeten sind duenster: Nicht nur werden wir von feindlichen Alienkraeften belaagert, auch unsere hoechsten Machtzentren sind bereits tiefgreifend infiltriert. Zudem bedroht uns nicht nur eine einzige Macht, sondern mehrere moegliche Rivalen: die geheimnisvollen Aliens aus dem Himmel, die Unterwasserzivilisation der Deep Ones, eine unbekannte Welt unter der Erdoberflaeche und schliesslich menschliche Kollaborateure. Wir gehen davon aus, dass keine dieser Gruppen bereits bereit fuer eine offene Invasion ist, doch alle werden tun, was sie koennen, um uns zu schwaechen und zu verwirren.{NEWLINE}Deshalb empfehle ich mit Nachdruck einen fokussierteren Aufbau der Verteidigungskraefte der Erde, beginnend damit, X-Com volle militaerische Interventionsrechte zu verleihen - nicht nur im Namen der UN, sondern im Namen der gesamten Menschheit."
  STR_MILITARY_ENVOY_CONTACT: "Militaerbeauftragten rekrutieren"
  STR_MILITARY_ENVOY_CONTACT_UFOPEDIA: "Gruesse, Komm'dant! Ihr neuer Militaerbeauftragter meldet sich zum Dienst. Man hat mich im Eiltempo hergeschickt, weil hier irgendwelche ausserirdischen Unruhestifter ihr Unwesen treiben. Fragen Sie lieber nicht, woher ich das weiss - ich habe meine Verbindungen. Deshalb wollten Sie mich doch hierhaben, oder?{NEWLINE}Wie auch immer, ich habe bereits mit einem Ihrer Agenten gesprochen, demjenigen, der mich hergebracht hat, und wir sind offenbar bitter unterausgestattet. Atomsprengkoepfe kann ich Ihnen im Moment noch nicht versprechen, aber ueber ein paar alte Freunde bekomme ich vielleicht etwas zusaetzliches Material organisiert. Was Sie mit 'Ist das legal?' meinen? Natuerlich ist das legal! Wenn wir illegales Zeug einfach so ohne Folgen einsetzen koennten, waere vieles deutlich leichter. Aehm - nicht dass ich Ihnen bei so etwas ueberhaupt helfen duerfte, Komm'dant."
  STR_MINOTAUR: "Minotaur"
  STR_MINOTAUR_ARMOR: "Kampfanalyse: Minotaur"
  STR_MINOTAUR_AUTOPSY: "Autopsie: Minotaur"
  STR_MINOTAUR_AUTOPSY_UFOPEDIA: "Dieses 300 Kilogramm schwere Biest wird unter grossen Teilen seiner Haut von implantierten Panzerplatten geschuetzt. Der Schaedel ist extrem robust und widerstandsfaehig. Seine Hoerner sind mit einer Titanlegierung beschichtet, was sie zu einer noch gefaehrlicheren Waffe macht."
  STR_MINOTAUR_CORPSE: "Leiche eines Minotaurs"
  STR_MINOTAUR_TAMED: "Gezaehmter Minotaur"
  STR_MINOTAUR_TAMING: "Minotaur-Zaehmung"
  STR_MINOTAUR_TAMING_UFOPEDIA: "Mit den Fruechten unserer Forschung und etwas altmodischer Viehzucht koennen wir gefangene Minotauren recht leicht fuer unsere Kampfzwecke abrichten. Solche Wesen eignen sich nicht fuer heikle Feldeinsaetze, doch sie werden unsere Basen bereitwillig gegen feindliche Angriffe verteidigen. Ein Minotaur kann grundsaetzlich jede Ausruestung nutzen, die auch ein Agent tragen kann, doch wegen seines besonderen Faehigkeitsprofils sollten wir ihn moeglichst mit einfachen Waffen ausruesten, die vor allem rohe Kraft verlangen."
  STR_MINOTAUR_TERRORIST: "Minotaur"
  STR_MINOTAUR_UFOPEDIA: "Diese massige Monstrositaet vereint menschliche und bovine Merkmale zu einem beinahe unaufhaltsamen Krieger. Ihre Intelligenz ist stark begrenzt und reicht nicht einmal fuer echte Sprache, doch einfache Kampfkommandos kann sie ausfuehren und selbst taktische Situationen bis zu einem gewissen Grad einschaetzen. Meist verhaelt sie sich eher folgsam und eignet sich sogar als unbewachte Wachkraft, im Gefecht aber geraet sie augenblicklich in Raserei und greift jeden sichtbaren Feind mit brutaler Entschlossenheit an."
  STR_MINOTAUR_WEAPON: "Minotaur-Ansturm"
  STR_MISSIONS_AND_RESEARCH_UFOPEDIA: "Bestimmte Forschungsprojekte andern, welche Missionen X-Com erhalten kann. Zum Beispiel kann die Befragung der Mitglieder eines bestimmten Kults X-Com auf die Fahrte seiner Plane und Hauptquartiere locken. Solche Forschung ist in der Techbaumansicht mit \\\"Betrifft Spielfortschritt!\\\" gekennzeichnet.{NEWLINE}Eine Mission so ab- oder freizuschalten betrifft die Haufigkeit anderer Missionen nicht. Zum Beispiel verringert die Untersuchung eines Kults weder die Missionen gegen fremdartige Kreaturen, noch wurde die Vermeidung dieser Forschung fremdartigen Kreaturen haufiger machen."
  STR_MONGORN_ANZUG: "Mongorn-Anzug"
  STR_MONGORN_ANZUG_H_UC: "ANZUG (H)"
  STR_MONGORN_ANZUG_INFERNAL_UC: "ANZUG (INF)"
  STR_MONGORN_ANZUG_KYBEROS_UC: "ANZUG (KYB)"
  STR_MONGORN_ANZUG_OLYMPIAN_UC: "ANZUG (OLY)"
  STR_MONGORN_ANZUG_PROTEAN_UC: "ANZUG (PRO)"
  STR_MONGORN_ANZUG_SPARTAN_UC: "ANZUG (SPT)"
  STR_MONGORN_ANZUG_UC: "ANZUG"
  STR_MONGORN_ANZUG_UFOPEDIA: "Mongorn-Felle lassen sich zu weichen Lederanzuegen verarbeiten, die sowohl robust als auch ausgesprochen markant sind. Die einzigartigen und nur unvollstaendig verstandenen Eigenschaften dieses Materials machen Agenten, die solche Anzuege tragen, mutiger und gefasster."
  STR_MONGORN_ARMOR: "Kampfanalyse: Mongorn"
  STR_MONGORN_AUTOPSY: "Autopsie: Mongorn"
  STR_MONGORN_AUTOPSY_UFOPEDIA: "Diese Kreatur ist ganz eindeutig das Ergebnis genetischer Experimente. Sie traegt Gene von Menschen sowie anderen Primaten in sich, dazu Muster, die der irdischen Wissenschaft unbekannt sind. Mongorns werden fast drei Meter gross, verfuegen ueber enorme Kraft und ein zaehes Fell. Ihr Pelz ist leicht entflammbar, was sich im Kampf ausnutzen lassen koennte."
  STR_MONGORN_CORPSE: "Leiche eines Mongorn"
  STR_MONGORN_CULTURE: "Mongorn-Kultur"
  STR_MONGORN_CULTURE_UFOPEDIA: "Die Untersuchung dieses ungewoehnlichen Mongorn laesst darauf schliessen, dass es sich um eine Art Stammesfuehrer handelt. Durch staerkere Muskulatur und groessere Faenge unterscheidet er sich deutlich von seinen Verwandten und ist weit aggressiver. Darueber hinaus zeigt er weiter entwickelte geistige Faehigkeiten: Er kann Werkzeuge benutzen, fuerchtet kein Feuer und ist vielleicht sogar in der Lage, es selbst einzusetzen. Wenn ihm langweilig ist, malt er seltsame Muster an die Waende.{NEWLINE}Das veraendert unser Bild von der Kultur der Mongorns grundlegend. Wir verstehen zwar nicht, warum nur sein Gehirn so tiefgreifende Veraenderungen durchlaufen hat, waehrend der Rest des Koerpers weitgehend gleich blieb, doch alles deutet auf eine Form kuenstlicher Mutagenese hin, die weit ausserhalb der Grenzen zeitgenoessischer Wissenschaft liegt."
  STR_MONGORN_KING: "Mongorn-Koenig"
  STR_MONGORN_KING_ALERT: "MONSTER SAMMELN SICH!"
  STR_MONGORN_KING_ARMOR: "Kampfanalyse: Mongorn-Koenig"
  STR_MONGORN_KING_BRIEFING: "In diesem Gebiet hat die Aktivitaet seltsamer Kreaturen stark zugenommen, waehrend sich gleichzeitig Geruechte ueber verschwundene Menschen haeufen. Die Einheimischen stellten einen kleinen Trupp erfahrener Jaeger und Spurensucher zusammen, um nach den Vermissten zu suchen, doch seit Tagen hat niemand mehr etwas von ihnen gehoert. Untersuchen Sie den Fall und beseitigen Sie die Bedrohung fuer die Anwohner, wenn es noetig ist. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_MONGORN_KING_CAVE: "Versammlung der Mongorns"
  STR_MONGORN_KING_DESCRIPTION: "In diesem Gebiet hat die Aktivitaet seltsamer Kreaturen stark zugenommen, waehrend sich gleichzeitig Geruechte ueber verschwundene Menschen haeufen. Die Einheimischen stellten einen kleinen Trupp erfahrener Jaeger und Spurensucher zusammen, um nach den Vermissten zu suchen, doch seit Tagen hat niemand mehr etwas von ihnen gehoert."
  STR_MONGORN_UFOPEDIA: "Mongorns wurden erstmals in der Mongolei entdeckt und streifen seither auf Nahrungssuche durch die eurasischen Ebenen. Sie sind ausserordentlich aggressiv. Obwohl ihnen echte Intelligenz offenbar fehlt, scheinen Mongorns den groessten Teil dessen zu verstehen, was wir ihnen mitteilen, reagieren darauf aber fast immer mit Gewalt. Es ist schwer zu sagen, wie eine derart unvernuenftige Kreatur in freier Wildbahn ueberhaupt ueberleben konnte. Moeglicherweise wurden sie in irgendeiner Weise darauf konditioniert, Menschen zu hassen und bei jeder Gelegenheit anzugreifen. Wegen ihrer scharfen Sinne und tierischen Schlauheit sind diese Wesen aus der Luft nur schwer zu jagen."
  STR_MONGORN_WEAPON: "Mongorn-Faust"
  STR_MONSTERS_FINAL_SOLUTION_UFOPEDIA: "Es hat sich herausgestellt, dass die Kreaturen, die wir standig bekampfen, von einem Netzwerk bestimmter Syndikatagenten regelmaig uber die Erde verteilt werden. Abnorme Lebensformen werden in die Wildnis entlassen, wo sie sich vermehren und die Einheimischen bedrohen.{NEWLINE}Nicht mehr. Es war nicht leicht, Kommandant, aber mit Syndikatsdaten habe ich geschafft, eine chemische Verbindung zu erstellen, die heftig mit mutiertem Blutplasma reagiert, schnellen Tod und manchmal Einascherung verursacht. Sie ist harmlos fur Menschen und kann aus der Luft verteilt werden, was Ausbruche leicht kontrollierbar macht.{NEWLINE}Wir haben die Formel bereits mit den geldgebenden Regierungen geteilt. Jetzt sind die Ungeheuer ihr Problem. Das heit nicht, dass wir die Monster nie wieder sehen, aber wenigstens nicht jeden Tag."
  STR_MONSTERS_HUNT_GENERIC_BRIEFING: "In der Gegend sind Menschen verschwunden, einige wurden zerfleischt aufgefunden - anscheinend von einem wilden Tier. Mit der Beihilfe ortlicher Krafte haben wir eine mogliche Ursache gefunden: eine unidentifizierte Kreatur. Wir sollten diese Bedrohung identifizieren und beenden. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_MONSTERS_HUNT_LOTS_BRIEFING: "Eine kleine Siedlung in der Gegend wurde massakriert, und die Uberlebenden schildern einen Angriff wilder Bestien, die sich anschlieend in die Wildnis zuruckzogen. Wir sollten diese Gefahr identifizieren und beenden. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_MONSTERS_HUNT_MIB_BRIEFING: "Wir hatten erwartet, auf ausserirdische Kreaturen zu stossen, doch offenbar waren wir zu spaet: Die Men in Black haben das Gebiet bereits uebernommen. Vielleicht ist dies eine gute Gelegenheit, mehr ueber sie herauszufinden, wenn wir sie besiegen koennen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MONSTERS_HUNT_SINGLE_BRIEFING: "Ein Einheimischer wurde tot aufgefunden, anscheinend von einem rasenden Tier getotet. Wir sollten diese Bedrohung identifizieren und beenden. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_MONSTERS_INC: "Monsters-Inc.-Akten"
  STR_MONSTERS_INC_UFOPEDIA: "Diese Dokumente beweisen zweifelsfrei, dass das Syndikat fuer das Klonen und Verbreiten von Chupacabras, die Zucht von Fenrir-Woelfen sowie fuer das Einfangen und Experimentieren an wilden Schlurfern und Mongorns verantwortlich ist. Die Liste ist lang. Auch wenn das Syndikat diese Organismen nicht selbst erschaffen hat, wird ihre Praesenz auf der Erde ohne seine Unterstuetzung deutlich abnehmen.{NEWLINE}Um dieses Problem ein fuer alle Mal zu loesen, muessen wir zu einem verlassenen Labor der Morgenroete reisen. Es wimmelt dort inzwischen von Riesenspinnen, aber genau dort finden wir den Schluessel, um diese Bedrohung endgueltig zu besiegen."
  STR_MONSTERS_UNLEASHED: "Entfesselte Monster"
  STR_MONSTERS_UNLEASHED_DESCRIPTION: "Der Rat zeigte sich mit X-Coms juengsten Operationen unzufrieden und verwies auf unser anhaltendes Versagen, die Bedrohung durch fremdartige Lebensformen einzudaemmen. Die Bemerkungen waren deutlich sarkastisch gefaerbt und liessen durchblicken, dass man auf Besserung hofft.{NEWLINE}[-400 Punkte]"
  STR_MONSTER_TERROR_BRIEFING: "Fremde Kreaturen erschienen plotzlich in der Stadt und greifen die Bevolkerung an. Wir mussen sie aufhalten, bevor die Sache aus dem Ruder lauft, und jeden retten, den wir konnen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_MONSTER_VS_MILITARY_BRIEFING: "Die Regierung hat bewaffnete Truppen mobilisiert und ruckt gegen die abartigen Kreaturen vor, die dieses Gebiet heimsuchen. Wir sollen assistieren. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_MONSTER_VS_MOB_BRIEFING: "Heftige Aktivitat unbekannter Lebensformen hat die Einheimischen dazu aufgewiegelt, die Sache selbst zu regeln. Eliminieren Sie die Gefahrenquellen, bevor alle tapferen Burger getotet werden. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_MONSTER_VS_MOB_DESCRIPTION: "Heftige Aktivitat unbekannter Lebensformen hat die Einheimischen dazu aufgewiegelt, die Sache selbst zu regeln. Eliminieren Sie die Gefahrenquellen, bevor alle tapferen Burger getotet werden."
  STR_MONSTER_VS_POLICE_BRIEFING: "Lokale Aktivitat exotischer Lebensformen hat die Regierung in Aufruhr versetzt. Ortliche Polizeikrafte haben trotz unseres Abratens mit einer Sauberungsaktion begonnen. Wir mussen ihnen helfen, so gut wir konnen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_MOON_ALIEN_COLONY_CORE_BRIEFING: "Wir stehen kurz davor, die tiefste Ebene der ausserirdischen Kolonie auf dem Mond zu stuermen. Unser Ziel sind Navigations- und Militaerdaten zu dem Ort, von dem aus die Aliens ihre Aktivitaeten im gesamten Sonnensystem koordinieren. Ausserdem brauchen wir einen Aetherer-Grossmeister, der diese Daten fuer uns entschluesseln kann. Um die Mission abzubrechen, fuehren Sie die X-Com-Kraefte in den Ausgangsbereich und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MOON_ALIEN_COLONY_MAIN_BRIEFING: "Mit den Informationen, die wir vom Aetherer-Sprecher und aus den Mondcomputern gewonnen haben, konnten wir einen Weg ausarbeiten, bis ins Herz der unterirdischen ausserirdischen Stadt auf dem Mond vorzudringen. Unsere Aufgabe ist es, einen Ritter festzunehmen - einen hochrangigen Aetherer, der fuer die Kontrolle eines bestimmten Basisabschnitts verantwortlich ist. Zusaetzlich muessen wir weitere Daten aus den Alien-Computern sichern, um unsere Forschung ueber die ausserirdische Zentrale voranzutreiben. Um die Mission abzubrechen, fuehren Sie die X-Com-Kraefte in den Ausgangsbereich und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MOON_ALIEN_COLONY_SUBURBS_BRIEFING: "Dies ist der aeussere Bereich der Mondkolonie, der sogenannte Vorstadtsektor. Er enthaelt wertvolle Hinweise auf den Standort der ausserirdischen Hauptbasis. Wir muessen in die Anlage eindringen, ihren kommandierenden Offizier festnehmen und alle Datenspeicher sichern. Um die Mission abzubrechen, fuehren Sie die X-Com-Kraefte in den Ausgangsbereich und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MOON_HYPERWAVE_RELAY_ANALYSIS: "Analyse des Mond-Aussenpostens"
  STR_MOON_HYPERWAVE_RELAY_ANALYSIS_UFOPEDIA: "Wir haben das gesamte ausserirdische Bauwerk auf dem Mond eingehend analysiert. Es stellte sich als automatisches Hyperwellenrelais heraus, eines von vielen identischen Bauwerken, die ueber die Mondoberflaeche verteilt sind. Zusammengenommen verwandeln diese Installationen den gesamten Mond in einen riesigen Hyperwellen-Decoder, der selbst schwache Signaturen aus dem Sonnensystem und moeglicherweise noch aus groesserer Entfernung auffangen kann.{NEWLINE}Besonders interessant ist die Verbindung des Gebaeudes zu einem unterirdischen Tunnel, der tief in die Mondkruste fuehrt. Offenbar wird der Aussenposten von dort aus mit Energie versorgt, auch wenn wir noch nicht wissen, woher sie stammt."
  STR_MOON_HYPERWAVE_RELAY_BRIEFING: "Unsere Scans haben auf dem Mond, suedlich des Bailly-Kraters, ein kleines Bauwerk ausserirdischen Ursprungs entdeckt. Es koennte sich um einen Kommunikationsposten oder um eine Einrichtung zur Energieverteilung handeln. Wir sollten dieses Objekt sowohl als moegliches Sicherheitsrisiko als auch als Quelle wertvoller Daten ueber die Alien-Invasoren untersuchen. Um die Mission abzubrechen, fuehren Sie die X-Com-Kraefte in das Transportfahrzeug zurueck und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MOON_MAGMA_RESCUE: "Rettung der M.A.G.M.A.-Kosmonauten"
  STR_MOON_MAGMA_RESCUE_BRIEFING: "Soeben hat uns ein Vertreter der M.A.G.M.A.-Korporation um Hilfe gebeten. Der Konzern unterhaelt einen kleinen Aussenposten auf dem Mond, um dort He3-Vermessungen durchzufuehren.{NEWLINE}Die Kosmonauten haben ein Notsignal abgesetzt und melden einen Angriff durch unbekannte Kraefte. Ausschnitte aus der Uebertragung zeigen dunkle Gestalten mit nicht identifizierten Waffen.{NEWLINE}Achtung: Beim Anflug haben unsere Sensoren Energieemissionen nahe dem Einsatzort erfasst. Das koennte auf ein noch andauerndes Gefecht hindeuten. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MOON_MAGMA_RESCUE_DESCRIPTION: "Soeben hat uns ein Vertreter der M.A.G.M.A.-Korporation um Hilfe gebeten. Der Konzern unterhaelt einen kleinen Aussenposten auf dem Mond, um dort He3-Vermessungen durchzufuehren.{NEWLINE}Die Kosmonauten haben ein Notsignal abgesetzt und melden einen Angriff durch unbekannte Kraefte. Ausschnitte aus der Uebertragung zeigen dunkle Gestalten mit nicht identifizierten Waffen.{NEWLINE}Da wir inzwischen ueber die Technik verfuegen, rasch Agenten zum Mond zu schicken, wurden wir gebeten einzugreifen, die Kosmonauten zu evakuieren und nach Moeglichkeit die Angreifer zu identifizieren. Das Zeitfenster fuer diesen Einsatz ist aeusserst knapp, da der Aussenposten beschaedigt wurde und die Besatzung nur noch ueber begrenzte Lebenserhaltung verfuegt."
  STR_MOON_UAC_BASE_EXPLORATION: "Erkundung der VAST-Mondbasis"
  STR_MOON_UAC_BASE_EXPLORATION_BRIEFING: "Ihre Agenten haben die aeusseren Verteidigungen der Mondbasis durchbrochen und betreten nun vertraut wirkende VAST-Anlagen. Doch diese Ebene scheint nicht das experimentelle Dimensionsportal zu enthalten, nach dem wir suchen. Finden Sie den Zugang zu den tieferen Ebenen, markiert durch gelbe Felder. Sobald sich alle Agenten im Aufzugsbereich befinden, klicken Sie auf das Symbol 'Mission abbrechen', um die naechste Phase zu erreichen."
  STR_MOON_UAC_BASE_LANDING: "Landung auf der VAST-Mondbasis"
  STR_MOON_UAC_BASE_LANDING_BRIEFING: "Ihr Schiff ist auf dem Mond in der Naehe der VAST-Anlage gelandet. Lokalisieren Sie den Eingang und bewegen Sie alle Agenten auf die gelb markierte Aufzugsflaeche. Sobald sich alle Agenten im Aufzugsbereich befinden, klicken Sie auf das Symbol 'Mission abbrechen', um zur naechsten Phase ueberzugehen. Halten Sie Ausschau nach Plasmageschuetzen."
  STR_MOON_UAC_BASE_LANDING_DESCRIPTION: "Eine Gelegenheit, eine VAST-Basis auf dem Mond anzugreifen und ihr Dimensionsportalprogramm endlich endgueltig zu zerschlagen. Um dorthin zu gelangen, brauchen wir allerdings ein geeignetes Raumschiff - ein einfaches Orbitalfahrzeug reicht fuer den Mondflug nicht aus."
  STR_MOON_UAC_BASE_TAKEN: "VAST-Mondbasis eingenommen"
  STR_MOON_UNDERGROUND_CONDUITS_BRIEFING: "Gewaltige unterirdische Tunnel ziehen sich kilometerweit unter der Mondoberflaeche entlang, bevor sie jenseits der Reichweite unserer Scanner tiefer absinken. Auf den ersten Blick wirken sie wie technische Versorgungskanaele, die Oberflaechenrelais mit einem unbekannten Ort tief im Inneren verbinden. Unsere Aufgabe ist es, einen solchen Tunnel fuer kuenftige Untersuchungen zu kartieren. Um die Mission abzubrechen, fuehren Sie die X-Com-Kraefte in den Ausgangsbereich und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MOON_UNDERGROUND_CONDUITS_CHAMBER_BRIEFING: "Wir haben eine lokale Kontrollanlage erreicht, die Daten ueber das unterirdische Tunnelsystem enthalten sollte. Nehmen Sie diese Einrichtung ein, damit unsere Techniker die Datenbanken bergen und auswerten koennen. Um die Mission abzubrechen, fuehren Sie die X-Com-Kraefte in den Ausgangsbereich und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MORTAR_SHELL_ELERIUM: "Moerser-Elerium-Granate"
  STR_MORTAR_SHELL_EMP: "Moerser-EMP-Granate"
  STR_MORTAR_SHELL_GAS: "Moerser-Gasgranate"
  STR_MORTAR_SHELL_GAS_BUY: "Beschaffung: Moerser-Gasgranate"
  STR_MOTOR_MAN: "Motor Man"
  STR_MOTOR_MAN_ARMOR: "Kampfanalyse: Motor Man"
  STR_MUCKSTAR_UFOPEDIA: "Diese bizarre Kreatur ist ein Raubtier, das sowohl ueber als auch unter der Wasseroberflaeche jagt. Sie verfolgt Beute mittels psionischer Wellen und bringt sie mit maechtigen elektrischen Entladungen zu Fall."
  STR_MUDRANGER_CONTRACTED: "Experimenteller Truppentransporter"
  STR_MUDRANGER_CONTRACTED_DESCRIPTION: "Kommandant, ich habe da etwas fuer Sie. Der Rat entwickelt gerade einen Kurzstreckentransporter fuer wissenschaftliche Teams - offenbar fuer eine Raumfahrtinitiative - und wollte wissen, ob wir Interesse haetten. Ueber einen Sondervertrag koennten wir ein paar Prototypen zu einem sehr vernuenftigen Preis bekommen.{NEWLINE}Da das Ding offiziell als wissenschaftliche Ausruestung zertifiziert ist, koennte es uns helfen, die ueblichen Beschraenkungen beim Einsatz groesserer Agentengruppen im Feld zu umgehen. Taktische Vorteile koennte es ebenfalls bieten. Allerdings... das Design hat ein paar, aeh, Eigenheiten.{NEWLINE}Sie sollten es sich wohl selbst ansehen."
  STR_MULTI_PHASED_PSIONICS: "Mehrphasige Psionik"
  STR_MULTI_PHASED_PSIONICS_UFOPEDIA: "Juengste Entdeckungen in Psionik und KI haben zu innovativen technischen Loesungen gefuehrt. Durch optronische Leitungsbahnen, gesteuert mit fortschrittlicher Alien-Programmierung, koennen wir psionische Wellen effizienter verstaerken. Die daraus entstehenden Geraete sind robuster und praeziser, aber auch schwerer und weniger energieeffizient."
  STR_MUMMY_ABODE: "Mumienhort"
  STR_MUMMY_ABODE_ALTAR: "Tempelbezirk der Mumien"
  STR_MUMMY_ABODE_ALTAR_BRIEFING: "Dieses Gebiet besitzt fuer vernunftbegabte Zombies grosse religioese Bedeutung. Wir muessen das goldene Ankh bergen, das auf einem Altar ruht. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Ausgangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MUMMY_ABODE_ALTAR_DESCRIPTION: "Dieses Gebiet besitzt fuer vernunftbegabte Zombies grosse religioese Bedeutung. Wir muessen das gestohlene Artefakt bergen, das Anexi erwaehnt hat. Der Ort wimmelt nur so vor Feinden."
  STR_MUMMY_ABODE_BRIEFING: "Wir haben eine unterirdische Zombiegemeinschaft lokalisiert, die von einer maechtigen Herrscherin angefuehrt wird. Ihre Aufgabe besteht darin, diese Anfuehrerin lebend festzusetzen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Ausgangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_MUMMY_ABODE_DESCRIPTION: "Wir haben eine unterirdische Zombiegemeinschaft lokalisiert, die von einer maechtigen Herrscherin angefuehrt wird. Nehmen Sie diese Herrscherin lebend gefangen, denn sie koennte der Schluessel zur Loesung der Zombiekrise sein."
  STR_MUMMY_ARMOR: "Kampfanalyse: Mumie"
  STR_MUMMY_ARMOR_UFOPEDIA: "Mumien verfuegen ueber maechtige psionische Faehigkeiten und koennen dadurch einen gruenen Schildtyp aufrechterhalten (Kapazitaet: 100, Regeneration: 25 pro Runde)."
  STR_MUMMY_AUTOPSY: "Autopsie: Mumie"
  STR_MUMMY_AUTOPSY_UFOPEDIA: "Diese Form aehnelt einem Vampir, weist jedoch einige subtile, aber wichtige Unterschiede auf. Der Stoffwechsel ist aehnlich, doch die Mumie speichert zusaetzlich energiereiches Blutplasma in ihrem Koerper, ganz wie eine Strix. Das Gehirn ist ausserordentlich gut entwickelt. Abgesehen von den Verletzungen, die sie direkt getoetet haben, zeigt die Leiche keinerlei Schaeden oder Makel."
  STR_MUMMY_CORPSE: "Leiche einer Mumie"
  STR_MUMMY_MATRIARCH: "Mumien-Matriarchin"
  STR_MUMMY_UFOPEDIA: "Noch maechtiger als Vampire stellen Mumien die ultimative Form des Zombies dar. Mit extrem hohen Energiewerten und perfekter Effizienz nutzen sie das volle Potential von Geist und Koerper. Sie stecken selbst schwere Schaeden weg, halten einen Psi-Schild aufrecht und koennen rohe Energie in Form brutaler Explosionen manifestieren. Durch ihre vollstaendige Kontrolle ueber niedere Zombies sind sie in der Lage, ganze Parasitenarmeen zu fuehren und kleine unterirdische Reiche zu beherrschen."
  STR_MUTANT_PHYSIOLOGY_UFOPEDIA: "Ich habe viele Proben dieser groen Kreatur analysiert, und bin zu interessanten Schlussen gekommen. Zum ersten haben wir zwar keine direkten Beweise fur den Einsatz von Biotechnik gefunden, aber es gibt viele Indizien, dass sie fur einen bestimmten Zweck entworfen wurde. Zum zweiten haben wir eine seltsame chemische Verbindung im Blutkreislauf der Kreatur gefunden, die ich trotz zahlreicher Querverweise nicht identifizieren kann. Das bringt uns allerdings zum dritten: diese Verbindung ist auerst energiereich und ich konnte beobachten, dass das Gewebe dieser Kreatur diese Energie umsetzt. Diese Spur weiterzuverfolgen liegt leider auerhalb meines Feldes. Aber wenn wir es schaffen, dieses ratselhafte Molekul zu knacken, habe ich eine Idee, wie wir es zur Verbesserung unserer Sanitatsausrustung benutzen konnten."
  STR_MYSTERIES_OF_APOCALYPSE_UFOPEDIA: "Kommandant, es tut mir leid, aber obwohl wir bis an die Spitze des Kults der Apokalypse vorgedrungen sind, haben wir nichts wirklich Besonderes gefunden. Sie begannen eines Tages einfach damit, sich zu versammeln - spontan, ohne klare Organisation und ohne Befehlskette. Doch sie brauchten Geld, und irgendwie fanden sie einen ueberaus wohlhabenden Sponsor. Ich vermute, dass sie finanzielle Unterstuetzung erhalten, die weit ueber den Kreis ihrer unmittelbaren Anhaenger hinausgeht, aber selbst sie scheinen nicht zu wissen, wer ihr geheimer Foerderer ist. Es ist die einzige Spur, die ich im Moment habe, also werde ich darueber weiter nachdenken."
  STR_MYSTERIOUS_SPONSOR_1000000_DESCRIPTION: "1 000 000$ wurden von einer unbekannten Person auf unser Konto eingezahlt. Es ist beruhigend zu wissen, dass unsere Sache auch ueber den blossen Vertragswortlaut hinaus auf echte materielle Unterstuetzung zaehlen kann."
  STR_MYSTERIOUS_SPONSOR_2500000_DESCRIPTION: "2 500 000$ wurden von einer unbekannten Person auf unser Konto eingezahlt. Es ist beruhigend zu wissen, dass unsere Sache auch ueber den blossen Vertragswortlaut hinaus auf echte materielle Unterstuetzung zaehlen kann."
  STR_MYSTERIOUS_SPONSOR_250000_DESCRIPTION: "250 000$ wurden von einer unbekannten Person auf unser Konto eingezahlt. Es ist beruhigend zu wissen, dass unsere Sache auch ueber den blossen Vertragswortlaut hinaus auf echte materielle Unterstuetzung zaehlen kann."
  STR_MYSTERIOUS_SPONSOR_500000_DESCRIPTION: "500 000$ wurden von einer unbekannten Person auf unser Konto eingezahlt. Es ist beruhigend zu wissen, dass unsere Sache auch ueber den blossen Vertragswortlaut hinaus auf echte materielle Unterstuetzung zaehlen kann."
  STR_NACHTFALL: "Nachtfall"
  STR_NACHTFALL_UFOPEDIA: "Auf den ersten Blick ein gewoehnliches, wenn auch uebertrieben verziertes Langschwert. Bei naeherer Betrachtung zeigt sich jedoch, dass der Edelstein in seinem Kern eine spuerbare Praesenz besitzt. Er trieft vor Boshaftigkeit und kann schwaechere Geister beeinflussen. Der Stein scheint aus Alenium zu bestehen, unterscheidet sich aber leicht von allem, was wir bisher gesehen haben. Wenn Nachtfall trifft, wird der verursachte Schaden in Gesundheit fuer den Fuehrenden umgewandelt, sofern das Ziel biologisch ist."
  STR_NAPALM_GRENADE_UFOPEDIA: "Diese furchterregende Brandwaffe kann einen ganzen Trupp in schwelende Asche verwandeln. Sie verursacht erheblich mehr Schaden als eine normale Brandgranate vergleichbarer Leistung.{NEWLINE}{NEWLINE}Fuer die Herstellung dieser Waffe benoetigt: Promotion III, Brandgranate, Sprengstofflizenz, Werkstatt."
  STR_NATASHAS_HOUSE: "Natashas Haus"
  STR_NATASHA_MOROZOVA_HIDEOUT_BRIEFING: "Wir konnten die Offizierin der Morgenroete, Natasha Morozova, ausfindig machen. Laut Geheimdienstberichten plant sie ein politisches Attentat, um gesellschaftliche Unruhen gegen das X-Com-Projekt auszuloesen. Sie muss festgenommen oder ausgeschaltet werden. Sie ist eine Meisterin der Tarnung, daher wird es keine zweite Gelegenheit zum Zuschlagen geben. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in den Ausgangsbereich zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_NATASHA_MOROZOVA_HIDEOUT_DESCRIPTION: "Wir konnten die Offizierin der Morgenroete, Natasha Morozova, ausfindig machen. Laut Geheimdienstberichten plant sie ein politisches Attentat, um gesellschaftliche Unruhen gegen das X-Com-Projekt auszuloesen.{NEWLINE}Sie muss festgenommen oder ausgeschaltet werden. Sie ist eine Meisterin der Tarnung, daher wird es keine zweite Gelegenheit zum Zuschlagen geben."
  STR_NIGHTOPS_ARMOR_UFOPEDIA: "Inspiriert von einer Kombination aus EXALT- und Red-Dawn-Entwuerfen verbindet der Night-Ops-Anzug fortschrittliche Nacht- und Waermebildmodi mit guter Tarnung. Sein aufwendiges Visier kann die Reaktionsgeschwindigkeit allerdings leicht beeintraechtigen."
  STR_NIGHTVISION_UFOPEDIA: "Wahrend Nachtmissionen konnen Sie zum Nachtsichtmodus wechseln, indem Sie Rollen drucken oder die Leertaste halten (kann in den Optionen geandert werden.) Dies gibt eine klare Sicht auf das Schlachtfeld."
  STR_NIGHT_AT_THE_MUSEUM: "Nachts im Museum"
  STR_NIGHT_AT_THE_MUSEUM_BRIEFING: "Es gibt Berichte ueber seltsame Vorkommnisse in einem naturhistorischen Museum der Region, darunter geisterhafte Tierlaute, schwere Schritte und sogar Sachschaeden. Vorlaeufige Nachforschungen deuten darauf hin, dass die kuerzlich ausgestellten Fossilien eine Rolle spielen koennten. Untersuchen Sie die Einrichtung und stellen Sie sicher, dass sie keine Gefahr fuer Besucher darstellt. Um die Mission abzubrechen, bringen Sie X-Com-Agenten zum Transportfahrzeug zurueck und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_NIGHT_AT_THE_MUSEUM_COMPLETED: "Das Museum ist wieder normal."
  STR_NIGHT_AT_THE_MUSEUM_DESCRIPTION: "Es gibt Berichte ueber seltsame Vorkommnisse in einem naturhistorischen Museum der Region, darunter geisterhafte Tierlaute, schwere Schritte und sogar Sachschaeden. Vorlaeufige Nachforschungen deuten darauf hin, dass die kuerzlich ausgestellten Fossilien eine Rolle spielen koennten. Ist das eine neue Stufe paranormaler Aktivitaet?"
  STR_NIGHT_HOWLERS_DESCRIPTION: "Ein Paar wilder Fenrir-Woelfe ist tief in besiedeltes Gebiet bei {0} vorgedrungen und hat zahlreiche Zwischenfaelle mit Nutztieren und Menschen verursacht. Die Einheimischen machen nun Jagd auf alle gewoehnlichen Woelfe, die sie erwischen koennen, obwohl die meisten Wildtiere bereits vor ihren monstroesen Verwandten geflohen sind. Der Rat haelt die Lage noch unter Kontrolle, erwartet aber, dass wir solche Vorfaelle kuenftig verhindern.{NEWLINE}[-66 Punkte]"
  STR_NIGHT_OF_THE_LOBSTERS_BRIEFING: "Fremdartige, humanoide Seewesen krochen aus dem Meer und greifen Menschen an! Nur X-Com kann sie retten. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_NINJA_SCROLL_UFOPEDIA: "Dieses handschriftliche Dokument enthaelt Geheimnisse einiger mystischer Kuenste von Black Lotus. Ohne einen echten Lehrer laesst sich daraus nichts unmittelbar Praktisches lernen, aber aufschlussreich ist es allemal."
  STR_NOT_ENOUGH_ITEMS: "Nicht genug Gegenstaende!{NEWLINE}Wir benoetigen {1}x {0}{NEWLINE}um diese Anlage zu bauen!"
  STR_NO_ALIEN_CONTAINMENT_FOR_TRANSFER_3: "KEINE GEISTERTANKS FUER DEN TRANSFER!{SMALLLINE}Geister benoetigen spezielle Einrichtungen im Stuetzpunkt."
  STR_OBSERVER_FRAME: "Observer-Huellenrahmen"
  STR_OBSERVER_UFOPEDIA: "Dieses hochentwickelte UFO wird nur selten auf der Erde gesichtet. Es wird fur Spahmissionen und einfache Hilfsaufgaben benutzt. Es hat ausgezeichnete Flugeigenschaften und ublicherweise eine Mannschaft von Elite-Auerirdischen, was es zu einem schwierigen Ziel fur unsere Flieger macht."
  STR_OLD_ARCHIVES_DEFENSE_SYNDICATE: "Ueberfall des Syndikats auf Geheimarchive"
  STR_OLD_ARCHIVES_DEFENSE_SYNDICATE_BRIEFING: "Das Syndikat greift eine geheime Militaeranlage an, die wichtige Daten unbekannter Herkunft enthaelt. Wir muessen verhindern, dass diese Daten in die Haende des Syndikats fallen. Zusaetzlich sollten wir das Magnetband finden und untersuchen, nach dem sie suchen, sonst bleiben uns ihre eigentlichen Ziele verborgen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen in die Ausgangszone zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_OLD_ARCHIVES_DEFENSE_SYNDICATE_DESCRIPTION: "Das Syndikat greift eine geheime Militaeranlage an, die wichtige Daten unbekannter Herkunft enthaelt. Wir muessen die oertlichen Kraefte unterstuetzen, verhindern, dass diese Daten in die Haende des Syndikats fallen, und sie zugleich fuer uns selbst sichern. Warnung: Eliteeinheiten des Syndikats wurden in der Gegend gesichtet."
  STR_OOZE_AUTOPSY_UFOPEDIA: "Diese Gallert-Masse ist eine Anhaufung von Einzellern. Ihre Eigenschaften sind vollig verschieden von irdischen Lebensformen und sie sind in der Tat hoch toxisch fur alle Lebewesen. Der Blob wird von zahlreichen venenartigen Gefaen durchzogen, die Blut und chemische Information durch die Kolonie bewegen."
  STR_OOZE_NEST_BRIEFING: "Gallertartige Entitaten unbekannten Ursprungs haben sich lange genug in den Abwasserkanalen eingenistet, um das Mikroklima zu einem sehr menschenfeindlichen zu verandern! Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_OOZE_UFOPEDIA: "Diese Lebensform muss aus einer sehr exotischen Umwelt stammen. Es spurt Beute mit starken Psiwellen auf. Sie kann auf der Erde uberleben, aber nur gerade so; Temperaturschwankungen haben eine starke Wirkung auf es. Seine chemischn Eigenschaften scheinen verwandt mit dem geheimnisvollen 'Raumhydra'-Phanomen, das von den Kiryu-Kai im Orionnebel beobachtet wurde."
  STR_OSIRON_AA_AMMO_TRADE: "Osiron-Handel mit Tritaniummunition"
  STR_OSIRON_AA_AMMO_TRADE_BRIEFING: "Wie einige von uns bereits befuerchtet hatten, ist die Alien-Alloy-Munitionstechnologie, die wir mit M.A.G.M.A. geteilt haben, auf dem Schwarzmarkt aufgetaucht. Wir muessen ein Lagerhaus von Osiron stuermen und die unerlaubten Waffen beschlagnahmen, sonst wird der Rat uns fuer die unkontrollierte Verbreitung ausserirdischer Technologie verantwortlich machen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_OSIRON_AA_AMMO_TRADE_DESCRIPTION: "Die Alien-Alloy-Munitionstechnologie, die wir mit M.A.G.M.A. geteilt haben, ist auf dem Schwarzmarkt gelandet. Osiron unterhaelt an diesem Ort ein Lager, von dem aus unerlaubte Waffen weiterverteilt werden. Wir muessen die Ware sicherstellen, um den Rat zu besaenftigen.{NEWLINE}Rechnen Sie mit mehreren schwer bewaffneten Zivilisten."
  STR_OSIRON_ACADEMY_TOWER_ASSAULT: "Golden-Academy-Turm"
  STR_OSIRON_ACADEMY_TOWER_ASSAULT_: "Golden-Academy-Turm-{0}"
  STR_OSIRON_BROKER_ARRESTED: "Osiron-Broker verhaftet"
  STR_OSIRON_BROKER_ARRESTED_DESCRIPTION: "Es ist uns gelungen, einen Agenten von Osiron festzusetzen und einige Waren sicherzustellen, die er gerade an eine andere Schattenorganisation verkaufen wollte.{NEWLINE}[25 Punkte, 20.000 $, Verstaerkte Osiron-Kiste erhalten]"
  STR_OSIRON_CONTACTS_WITCHES: "Osiron hat Hexen kontaktiert"
  STR_OSIRON_CRUISE: "Osiron-Kreuzfahrtschiff"
  STR_OSIRON_CRUISE_BRIEFING: "Wir haben ein Schmugglerschiff von Osiron entdeckt, das sich als Kreuzfahrtschiff tarnt. Unser Auftrag lautet, an Bord zu gehen, die Besatzung festzusetzen und jede illegale Fracht zu sichern. Ein Rueckzug ist in dieser Mission nicht moeglich."
  STR_OSIRON_CRUISE_DESCRIPTION: "Wir haben ein Schmugglerschiff von Osiron entdeckt, das sich als Kreuzfahrtschiff tarnt. Unser Auftrag lautet, an Bord zu gehen, die Besatzung festzusetzen und jede illegale Fracht zu sichern. Rechnen Sie mit Widerstand durch Agenten von Osiron und das Sicherheitspersonal. Ein Rueckzug ist in dieser Mission nicht moeglich."
  STR_OSIRON_GOLDEN_ACADEMY_ESTABLISHED: "Golden Academy gegruendet"
  STR_OSIRON_GOLDEN_ACADEMY_ESTABLISHED_DESCRIPTION: "Osiron hat einen grossen Schritt gemacht und einigen ehemaligen Psionikern von Black Lotus dabei geholfen, eine offizielle Organisation namens 'The Golden Academy' zu gruenden. Nach aussen gibt sie sich als Stiftung aus, die Bildungs-, Kultur- und Sozialinitiativen in Suedostasien und darueber hinaus foerdern will. Offiziell betreibt sie Schulen, Museen, Forschungseinrichtungen und Waisenhaeuser, und viele Regierungen der Region reagieren darauf bisher ueberaus positiv. Was hinter diesen Mauern jedoch wirklich vor sich geht, wuesste ich nur allzu gern. [-250 Punkte]"
  STR_OSIRON_GOON_DISGUISE_H_UC: "VERKLEIDUNG ALS OSIRON-SCHLAEGER (H)"
  STR_OSIRON_GOON_DISGUISE_INFERNAL_UC: "VERKLEIDUNG ALS OSIRON-SCHLAEGER (INF)"
  STR_OSIRON_GOON_DISGUISE_KYBEROS_UC: "VERKLEIDUNG ALS OSIRON-SCHLAEGER (KYB)"
  STR_OSIRON_GOON_DISGUISE_OLYMPIAN_UC: "VERKLEIDUNG ALS OSIRON-SCHLAEGER (OLY)"
  STR_OSIRON_GOON_DISGUISE_PROTEAN_UC: "VERKLEIDUNG ALS OSIRON-SCHLAEGER (PRO)"
  STR_OSIRON_GOON_DISGUISE_SPARTAN_UC: "VERKLEIDUNG ALS OSIRON-SCHLAEGER (SPT)"
  STR_OSIRON_GOON_DISGUISE_UC: "VERKLEIDUNG ALS OSIRON-SCHLAEGER"
  STR_OSIRON_GOON_DISGUISE_UC_UFOPEDIA: "Osiron verfuegt ueber zahlreiche wichtige Kontakte auf dem Schwarzmarkt. Es liegt nur nahe, dass wir versuchen, diese Verbindungen zu kapern, indem wir uns als die Verbrecher ausgeben."
  STR_OSIRON_HACIENDA_BRIEFING: "Dieses luxurioese Anwesen, sicher vor neugierigen Blicken verborgen, gehoert einem hochrangigen Operativen von Osiron. Schalten Sie den Hausherrn aus und sichern Sie alle illegalen Gueter in seinem Besitz. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_OSIRON_HACIENDA_DESCRIPTION: "Dieses luxurioese Anwesen, sicher vor neugierigen Blicken verborgen, gehoert einem hochrangigen Operativen von Osiron. Schalten Sie den Hausherrn aus und sichern Sie alle illegalen Gueter in seinem Besitz. Das Anwesen ist gut verteidigt, also stellen Sie sich auf zahlreiche Gangstersoldaten ein."
  STR_OSIRON_HACKED: "Osiron-Hackangriff"
  STR_OSIRON_HACKED_DESCRIPTION: "Unzureichende Sicherheitsmassnahmen haben dazu gefuehrt, dass geheime Daten und ein Teil unserer Gelder abgeflossen sind. Wir vermuten, dass ein Hacker von Osiron dahintersteckt. Das wird uns beim Rat kaum Sympathien einbringen.{NEWLINE}[-100 Punkte, -50.000 $]"
  STR_OSIRON_NEST: "Sturm auf verborgenes Osiron-Lagerhaus"
  STR_OSIRON_NEST_BRIEFING: "Ermittler der oertlichen Polizei haben ein grosses Lagerhaus entdeckt, das Osiron zur Lagerung von Schmuggelware nutzt. Beim Zugriff leisteten die Verdaechtigen erbitterten Widerstand, und inzwischen ist ein ernstes Feuergefecht zwischen den Kraeften von Osiron und der Polizei entbrannt. Die Kriminellen haben sich im Gebaeude verschanzt und unterdruecken jeden Zugriff mit Sperrfeuer. Schalten Sie alle Kraefte von Osiron in diesem Bereich aus und halten Sie die Verluste unter den Polizeieinheiten so gering wie moeglich. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_OSIRON_NEST_DESCRIPTION: "Ermittler der oertlichen Polizei haben ein grosses Lagerhaus entdeckt, das Osiron zur Lagerung von Schmuggelware nutzt. Beim Zugriff leisteten die Verdaechtigen erbitterten Widerstand, und inzwischen ist ein ernstes Feuergefecht zwischen den Kraeften von Osiron und der Polizei entbrannt. Offenbar haben die Beamten die Kriminellen drastisch unterschaetzt; jetzt sind sie deutlich in Unterzahl und unterlegen bewaffnet. Wir sollten ihnen besser helfen."
  STR_OSIRON_STAKEOUT: "Osiron-Beschattung"
  STR_OSIRON_STAKEOUT_BRIEFING: "Wir haben einen Unterschlupf von Osiron-Gangstern in einem verlassenen Teil der Stadt lokalisiert. Sie beobachten die Gegend aufmerksam, daher muessen wir mit einem Zivilfahrzeug und leichter Ausruestung operieren, um keinen Verdacht zu erregen. Unser Ziel ist es, ihren Anfuehrer festzunehmen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_OSIRON_STAKEOUT_DESCRIPTION: "Wir haben einen Unterschlupf von Osiron-Gangstern in einem verlassenen Teil der Stadt lokalisiert. Unser Ziel ist es, ihren Anfuehrer fuer ein Verhoer festzunehmen.{NEWLINE}Nur verdeckbare Ausruestung und Zivilkleidung erlaubt!"
  STR_OSIRON_TRADE_BUST: "Osiron-Handel zerschlagen"
  STR_OSIRON_TRADE_BUST_DESCRIPTION: "Wir haben eine Operation von Osiron erfolgreich unterbunden und ihre Ware sichergestellt.{NEWLINE}[50 Punkte, 50.000 $, Verstaerkte Osiron-Kiste x3 erhalten]"
  STR_OSIRON_UFOPEDIA: "Osiron ist eine kriminelle Organisation, die sich auf alle Arten ungewoehnlicher Ware spezialisiert hat - ausserirdische Artefakte, uralte Relikte und seltsame Kreaturen. Trotz ihrer vergleichsweise geringen Zahl operieren ihre Zellen auf der ganzen Welt und suchen staendig nach neuen Wegen, gefaehrliche Ware zu beschaffen oder zu verkaufen. Ihre Aktivitaeten sind nicht nur illegal, sondern eine direkte Bedrohung fuer die Erde, weil sie ihre Gueter und besonderen Dienste regelmaessig auch gefaehrlichen Organisationen wie Alienkulten anbieten."
  STR_OUTPOST_OF_APOCALYPSE: "Aussenposten der Apokalypse"
  STR_OUTPOST_OF_APOCALYPSE_BRIEFING: "Wir haben einen befestigten Tempel des Kults der Apokalypse gefunden. Wir muessen seine Verteidigung brechen und die Anlage unter unsere Kontrolle bringen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_OUTPOST_OF_APOCALYPSE_DESCRIPTION: "Wir haben einen befestigten Tempel des Kults der Apokalypse gefunden. Wir muessen seine Verteidigung brechen und die Anlage unter unsere Kontrolle bringen."
  STR_OUTPOST_OF_APOCALYPSE_DESERT: "Aussenposten der Apokalypse"
  STR_OUTPOST_OF_APOCALYPSE_TEMPERATE: "Aussenposten der Apokalypse"
  STR_OUTPOST_OF_APOCALYPSE_UFOPEDIA: "Die Verhoere eines Bruders der Apokalypse haben es uns ermoeglicht, die moeglichen Standorte mehrerer dauerhafter Aussenposten dieses seltsamen Kults einzugrenzen. Wir hoffen, an diesen Orten weitere ihrer Geheimnisse aufzudecken."
  STR_OUTSOURCING_THROUGH_ASSIMILATION: "Outsourcing durch Assimilation"
  STR_OUTSOURCING_THROUGH_ASSIMILATION_UFOPEDIA: "Die Alien-Intelligenzen aus Dimension X sind fuer unsere Umwelt schlecht geeignet. Deshalb rekrutierten sie Menschen als Drohnen fuer ihre Einsaetze auf der Erde. Die Brainsucked sind fuer diese Rolle trotz aller Unvollkommenheiten geeignet: stark, widerstandsfaehig, verhaeltnismaessig intelligent und mit dem noetigen Mindestwissen ausgeruestet, um ihre Aufgabe zu erfuellen.{NEWLINE}Das bedeutet im Umkehrschluss, dass die Aliens aus Dimension X zu ausserordentlich komplexen medizinischen Eingriffen in der Lage sind, aber dennoch die vergleichsweise einfache Aufgabe vernachlaessigen, ihre eigenen Truppen an die Umwelt der Erde anzupassen. Ob das eine strategische Entscheidung, eine technische Grenze oder eine kulturelle Vorliebe ist, koennen wir derzeit nicht sagen."
  STR_OWLMAN_ARMOR_UFOPEDIA: "Keine Beschreibung verfuegbar."
  STR_PHANTASMAL_TENTACLE: "Phantasmal Tentacle"
  STR_PHANTASMAL_TENTACLE_ARMOR: "Kampfanalyse: Phantasmal Tentacle"
  STR_PHANTASMAL_TENTACLE_UFOPEDIA: "Diese gespenstischen Auswuechse koennen von bestimmten Geisterkraeften manifestiert werden, ueber die einige ausserordentlich maechtige psionische Wesen verfuegen. Ihre Form scheint nur einem einzigen Zweck zu dienen: dem Fressen. Da sie sich nicht aktiv neu positionieren koennen, schlengeln sie sich ueber das Schlachtfeld, reagieren auf Lebewesen in ihrer Naehe und versuchen, sie mit ihrem Geisterangriff zu packen, der zudem Zeiteinheiten abzieht. Fuer sich allein sind sie nicht allzu gefaehrlich, doch eine ganze Gruppe von ihnen kann selbst eine ueberschaubare Mission schnell kippen."
  STR_PHANTASMAL_TENTACLE_WEAPON: "Angriff des Phantasmal Tentacle"
  STR_PHANTASMAL_TENTACLE_XCOM: "Phantasmal Tentacle"
  STR_PHANTASMAL_TENTACLE_XCOM_ARMOR: "Kampfanalyse: Phantasmal Tentacle"
  STR_PHARAOH_TOMB: "Gruft des Pharaos"
  STR_PHARAOH_TOMB_BRIEFING: "In Zusammenarbeit mit dem Zirkel fuehren wir einen Ueberraschungsangriff direkt ins Herz der feindlichen Streitkraefte. Wir muessen den raetselhaften Pharao und seine Armeen zu Fall bringen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Ausgangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_PHARAOH_TOMB_DESCRIPTION: "In Zusammenarbeit mit dem Zirkel fuehren wir einen Ueberraschungsangriff direkt ins Herz der feindlichen Streitkraefte. Wir muessen den raetselhaften Pharao und seine Armeen zu Fall bringen."
  STR_PICKUP_OSIRON: "Osiron-SUV"
  STR_PINKY_DEVIL: "Pinky Devil"
  STR_PINKY_DEVIL_ARMOR: "Kampfanalyse: Pinky Devil"
  STR_PINKY_DEVIL_CRONE: "Pinky Devil-Crone"
  STR_PINKY_DEVIL_CRONE_ARMOR: "Kampfanalyse: Pinky Devil-Crone"
  STR_PINKY_DEVIL_CRONE_ARMOR_UFOPEDIA: "Eine Crone ist von andersweltlichen Energien geschuetzt und kann dadurch dauerhaft einen roten Schild aufrechterhalten (Kapazitaet: 80, Regeneration: 10 pro Runde)."
  STR_PINKY_DEVIL_CRONE_UFOPEDIA: "Crones sind die spirituelle Elite der Pinky Devils und herrschen aus dem Schatten durch Weisheit und geschickte Manipulation. Waehrend gewoehnliche Pinky Devils meist in staedtischen Gebieten agieren, dort ihre Spionagenetze pflegen und Gesellschaften schrittweise verderben, findet man Crones eher in der Wildnis. Sie sind maechtige Psionikerinnen, die eldritchartige Wesen verehren, welche ihnen angeblich fuer den Preis menschlicher Leben und ihres eigenen Verstandes schreckliche Kraefte verleihen. Sie unterhalten Beziehungen zu anderen laendlichen Organisationen, die mit dem Kult der Apokalypse verbunden sind."
  STR_PINK_CAVES_BRIEFING: "Hinter dem Portal, betreten Sie eine Art auerirdische Hohle. Finden Sie den Weg zur Oberflache, durch braune Ausgangsfelder markiert. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_POLAR_BASE_THE_THING_BRIEFING: "Eine Forschungsstation nahe des Sudpols entdeckte gefrorene Uberreste einer urzeitlichen Lebensform. Bald danach verloren wir den Kontakt mit der Station. Untersuchen Sie den Vorfall und suchen Sie nach Uberlebenden. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_POLICE_REINFORCEMENTS: "POLIZEIVERSTAERKUNG IST EINGETROFFEN"
  STR_POLICE_REINFORCEMENTS_DESCRIPTION: "Weitere Polizeikraefte sind am Einsatzort eingetroffen. Sie greifen nun den Feind an."
  STR_POLTERGEIST_ARMOR: "Kampfanalyse: Poltergeist"
  STR_POLTERGEIST_UFOPEDIA: "Eine boshafte, maechtige Erscheinung, die typischerweise Haeuser heimsucht. Anders als die meisten Geister entsteht sie nicht aus einem einzelnen emotionalen Ereignis, sondern aus lang anhaltender Verzweiflung ueber viele Monate oder Jahre hinweg. Dieses 'langsame Glimmen' ist die zuverlaessigste Art, einen Poltergeist hervorzubringen, doch gelegentlich kann er auch spontan aus verschiedenen miteinander verschmolzenen Erinnerungen entstehen. Dieser Vorgang ist ebenso wenig vollstaendig verstanden wie der Poltergeist selbst. Sicher wissen wir nur, dass er weit komplexer ist als die meisten anderen Geister und dass seine telekinetischen Angriffe extrem schmerzhaft und potenziell toedlich sind."
  STR_PONTIFF_OF_APOCALYPSE_ARMOR: "Kampfanalyse: Pontifex der Apokalypse"
  STR_PONTIFF_OF_APOCALYPSE_UFOPEDIA: "Der Kult der Apokalypse ist zwar nicht besonders hierarchisch organisiert, doch Pontifexe sind hoch angesehene Kleriker, die Klosteranlagen verwalten und die Lehre weiterentwickeln. Darueber hinaus verfuegen sie ueber geistige Kraefte, die weit ueber jene gewoehnlicher Kultisten hinausgehen und ihnen erlauben, hoellisches Feuer auf ihre Feinde niedergehen zu lassen."
  STR_PORTABLE_PLAYER_FROM_HELL: "Kassettenplayer aus der Hoelle"
  STR_PORTABLE_PLAYER_FROM_HELL_UFOPEDIA: "Unter den Wizkids kursiert eine Geschichte, die viele von ihnen fuer mehr als nur eine urbane Legende halten: ein geheimnisvoller Player, der mit einer Kassette ausgeliefert wird, die sich ausschliesslich auf genau diesem Geraet abspielen laesst. Ueber die Jahre wurde dieses Geraet von vielen Menschen gefunden, gekauft oder auf andere Weise in Besitz genommen. Aeusserlich wirkt es vollkommen gewoehnlich, doch seine inneren Bauteile bestehen aus einer seltsamen, nicht identifizierbaren Legierung. Auf der Kassette befindet sich eine sanfte, tieffrequente Musik, die der neue Besitzer unaufhoerlich anhoert. In den folgenden Wochen verwandelt sich diese Person fast in einen lebenden Heiligen, frei von Zorn, Angst, Eifersucht und anderen negativen Emotionen. Am Ende wird der Besitzer jedoch stets brutal ermordet aufgefunden, uebersaet mit Spuren bestialischer Krallen und grausamer Verbrennungen. Auch der Player selbst ist jedes Mal zerstoert, scheinbar von innen heraus, und die Kassette bleibt verschwunden."
  STR_POSTAL3_ARMOR_ADAPTATION: "Dark-One-Verarbeitung"
  STR_POSTAL_DIARY: "Tagebuch eines Wahnsinnigen"
  STR_POSTAL_DIARY_UFOPEDIA: "'Die Mauern von Byzanz broeckeln langsam. Das Gold blaettert vom Schaedel-Zikkurat unter zornigem Himmel. Ein Sturm braut sich zusammen. Die ersten Tropfen sickern durch die Risse des Betons, hinab, hinab in die Kanaele, wo sie leben. Die Ratten. Sie vermehren sich, fressen, intrigieren. Nachts kommen sie in die Stadt, lassen ihre gotteslaesterlichen Fetische zurueck, fangen Menschen, betaeuben jene, die sie sehen, betaeuben mich... Ich werde nicht mehr lange durchhalten. Die Goetter sind zornig, der Himmel steht fast jede Nacht in Flammen vor Blitzen. Der Turm wird fallen, von Feuer getroffen. Die Ratten koennen ueberall sein, Ratten in menschlicher Gestalt. Die Ratten muessen sterben, wenn der Mensch die grosse Saeuberung ueberleben will. Wie Prometheus habe ich ihr geheimes Feuer gestohlen, und ich werde es nutzen, um meinen Zorn zu vollstrecken. Der Blitz...! Er kommt wieder... In hohen Himmeln wie in hoellischen Abgruenden ist die Zeit gekommen.'"
  STR_POSTAL_RAMPAGE_BRIEFING: "Ein Extremist und selbst-erklarter Racher erfuhr streng gehutete Geheimnisse uber die Auerirdischen, die Regierung, und andere anverwandte Themen. Dieser Schock radikalisierte ihn weiter(dieses Mal richtig), und er plant einen Terrorangriff, um die Aufmerksamkeit der Bevolkerung auf den laufenden geheimen Krieg zu lenken. Wir mussen ihn konfrontieren und ausschalten, bevor er zu viele Menschen totet. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_POSTAL_RAMPAGE_DESCRIPTION: "Ein Extremist und selbst-erklarter Racher erfuhr streng gehutete Geheimnisse uber die Auerirdischen, die Regierung, und andere anverwandte Themen. Dieser Schock radikalisierte ihn weiter, und er plant einen Terrorangriff, um die Aufmerksamkeit der Bevolkerung auf den laufenden geheimen Krieg zu lenken.{NEWLINE}Wir mussen ihn konfrontieren und ausschalten, bevor er zu viele Menschen totet. Behandeln Sie ihn als bewaffnet (bis zum Exzess) und als eine echte Bedrohung fur Ihre Agenten."
  STR_PRIEST_OF_DAGON_ARMOR: "Kampfanalyse: Priester Dagons"
  STR_PRIEST_OF_DAGON_UFOPEDIA: "Priester sind die Anfuehrer der Kirche Dagons. Aeusserlich sind sie weniger stark vom Dagon-Syndrom betroffen und daher fuer den Kontakt mit Aussenstehenden zustaendig. Dennoch sind sie fuer Menschen ausserordentlich zaeh, und ihr Denken unterscheidet sich deutlich von unserem - vermutlich durch die Indoktrination einer fremden Intelligenz oder vielleicht durch eine besondere Auspraegung des Dagon-Syndroms. Priester sind fuer die Kirche Dagons von zentraler Bedeutung und sollten moeglichst unverzueglich festgesetzt werden."
  STR_PROJECT_SAMAEL_BRIEFING: "Wir haben Samaels unheiliges Labor gefunden, von dem aus er die Welt mit seinen daemonischen Legionen ins Chaos stuerzen will. Jetzt ist es Zeit zuzuschlagen! Um die Mission abzubrechen, fuehren Sie die X-Com-Kraefte in den Ausgangsbereich und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_PROTEANISM_UFOPEDIA: "Durch die dauerhafte Verschmelzung mit Zombieparasiten koennen unsere Agenten bestimmte zombieaehnliche Faehigkeiten erhalten, darunter hoehere koerperliche Widerstandsfaehigkeit und bessere Nachtsicht. Besonders bemerkenswert ist, dass solche Agenten selbst vom Tod zurueckkehren koennen, solange ihre Leiche geborgen wird. Dieser Vorteil hat jedoch seinen Preis: Proteaner werden merklich traeger und weniger psi-begabt. Gluecklicherweise bleiben ihre Identitaet und ihre Erinnerungen weitgehend erhalten.{NEWLINE}{NEWLINE}Proteanismus steht im Transformationsbildschirm zur Verfuegung. WARNUNG: Entfernen Sie vor dem Eingriff unbedingt die Ruestung, damit sie nicht gewaltsam zerstoert wird."
  STR_PROTEAN_REVIVAL_UFOPEDIA: "Proteaner, die mit arkaner Mumientechnologie erschaffen wurden, sind ausserordentlich schwer zu vernichten. Selbst schwere Schaeden an lebenswichtigen Organen reichen oft nicht aus, um einen Proteaner endgueltig zu toeten, da seine Regenerationsfaehigkeiten extrem robust sind. Sie koennen sich sogar von schweren Hirnverletzungen erholen, weil ihr Nervensystem diffuser aufgebaut ist als das eines normalen Menschen und zusaetzlich psionisch vom Zombieparasiten unterstuetzt wird. Wenn wir also einen 'toten' Proteaner vom Schlachtfeld bergen und in den Operationssaal bringen, kann er innerhalb von etwa zwei Wochen wieder einsatzbereit sein. Ein gewisser Verlust an Erinnerungen und Kampffaehigkeit ist moeglich, bis er wieder auf seinem alten Stand ist. Falls noetig, laesst sich dieser Prozess theoretisch unbegrenzt wiederholen.{NEWLINE}Die Wiederbelebung steht ebenfalls im Transformationsbildschirm zur Verfuegung."
  STR_PSICLONE_UFOPEDIA: "Dieses seltsame Geraet hat eine starke psychoaktive Wirkung. Es verbessert die Reflexe und die Moral des Opfers deutlich, greift jedoch zugleich massiv in seinen Geist ein und verursacht komplexe Halluzinationen. EXALT-Mitglieder behaupten allerdings, diese Halluzinationen seien in Wahrheit Visionen echter psionischer Aktivitaet: Das Geraet steigere die psionische Wahrnehmung und ermoegliche es Menschen, sich - wenn auch unzuverlaessig - auf diese fremden Signale einzustimmen."
  STR_PSI_VISION: "Psisicht"
  STR_PSI_VISION_UFOPEDIA: "Diese Wahrnehmungsform beruht auf psionischer Sensitivitaet, die bestimmten Lebensformen natuerlich zur Verfuegung steht. Sie erkennt lebende Wesen, indem sie das umliegende psionische Feld abtastet und Stoerungen darin wahrnimmt. Geistlose Materie ist fuer Psisicht transparent, deshalb verdecken unbelebte Objekte wie Waende sie nicht. Der gleiche Grundsatz gilt aber auch fuer Roboter, die fuer Psi unsichtbar bleiben. Mit Ausnahme weniger Spezialwesen hat Psisicht meist nur sehr geringe Reichweite. Sie ist ausserdem gerichtet wie normales Sehen, obwohl sie nicht ueber Augen funktioniert."
  STR_PSYCHEMICALS_UFOPEDIA: "Diese chemischen Wirkstoffe sind nicht sehr schadlich, aber konnen uber jahrelange Anhaufung Gehirnschaden verursachen. Der Zweck ist angeblich, die Weltbevolkerung abzustumpfen und indifferent fur die Zukunft der Erde zu machen."
  STR_PULSE_WEAPONS_UFOPEDIA: "Pulswaffen sind fortschrittliche Feuerwaffen, deren Batterie einen elektronischen Puls erzeugt, um das Geschoss zu beschleunigen. Dieses Konzept erlaubt den besonders effizienten Einsatz nichtmetallischer Keramikgeschosse, die wegen ihrer hohen Antipersonenwirkung die Standardmunition dieser Waffenfamilie bilden.{NEWLINE}Standard-Pulsmunition verursacht zusaetzlich 25 % Schaden an der Gesundheit des Ziels, nachdem die Ruestung beruecksichtigt wurde. Dieser Effekt entfaellt bei jeder Sondermunition, die nicht auf Keramikbasis arbeitet."
  STR_QUARTERMASTER_INTRODUCTION_DESCRIPTION: "Na so was, der Kommandant! Schoen, Sie endlich einmal persoenlich kennenzulernen. Ich kuemmere mich um unsere Vorraete und die Ausruestung fuer den Feldeinsatz. Sagen Sie, moechten Sie sich meine kleine private Werkstatt ansehen? Unter uns: Fuer so einen Anlass habe ich einen guten Whiskey zurueckgelegt.{NEWLINE}{NEWLINE}Aber vorher habe ich noch eine Kleinigkeit, die ich immer fuer schlechte Zeiten aufbewahre. Und ich fuerchte, uns steht ein ziemlich hartes Jahr bevor, also ist es wohl Zeit, den Staub davon zu pusten. Viel ist es nicht, aber im Moment sind wir ohnehin nicht besonders gut ausgeruestet."
  STR_RANDOM_LAND_SURVEY_DESCRIPTION: "Das Bergungskorps des Erdenrats hat uns ein paar Zufallsfunde ueberlassen. Sehen wir uns an, was dabei herausgekommen ist.{NEWLINE}[Landvermessung x3 erhalten]"
  STR_RANDOM_OCEAN_FINDINGS_DESCRIPTION: "Hydrospace Dynamics ist eher zufaellig auf ausserirdische Technologie gestossen und hat den Fund umgehend an uns weitergeleitet.{NEWLINE}[Meeres-Expedition x3 erhalten]"
  STR_REACTOR_DEFENSE_SYNDICATE: "Ueberfall des Syndikats auf einen Reaktor"
  STR_REACTOR_DEFENSE_SYNDICATE_BRIEFING: "Das Syndikat greift ein geheimes experimentelles Fusionskraftwerk an. Wir muessen die oertlichen Kraefte dabei unterstuetzen, die Sabotage der Anlage sowie den Diebstahl von Daten und Material zu verhindern. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_REACTOR_DEFENSE_SYNDICATE_DESCRIPTION: "Das Syndikat greift ein geheimes experimentelles Fusionskraftwerk an. Wir muessen die oertlichen Kraefte dabei unterstuetzen, die Sabotage der Anlage sowie den Diebstahl von Daten und Material zu verhindern. Warnung: Eliteeinheiten des Syndikats wurden in der Gegend gesichtet."
  STR_REACTOR_SAVED_FROM_SYNDICATE: "Der Fusionsreaktor wurde gesichert."
  STR_READINESS_UFOPEDIA: "Nervenkraft misst, wie traumatisiert ein X-Com-Agent ist. Missionen ins Ubernaturliche zehren an der Nervenkraft: oft um 1 Punkt pro Runde, wobei anstrengende Missionen mehr kosten. Andere mogliche Verlustquellen sind Kampfdrogen und mentale Krafte.{NEWLINE}Agenten gewinnen jeden Tag ein wenig Nervenkraft zuruck. Der genaue Betrag beruht auf den Einrichtungen im Stutzpunkt; je mehr und je komfortabler, desto schneller die Erholung. Normale Quartiere geben 3 Nervenkraft pro Tag.{NEWLINE}Nervenkraft muss im Auge behalten werden, da sie die Leistungsfahigkeit beeinflusst. Gute Werte erlauben Topleistung, und volle Nervenkraft steigert sogar Energie- und Moral-Regeneration. Im Gegensatz werden Agenten mit niedriger Nervenkraft schneller mude und angstlich. Sehr niedrige Nervenkraft kostet sogar Zeiteinheiten, die sich normalerweise am Anfang jeder Runde voll auffullen."
  STR_RECLAMATION_OF_AETHER: "Reclamation of Aether"
  STR_RECLAMATION_OF_AETHER_FEMALE_INITIATE: "Novizin der Reclamation of Aether"
  STR_RECLAMATION_OF_AETHER_FEMALE_INITIATE_ARMOR: "Kampfanalyse: RoA-Novizin"
  STR_RECLAMATION_OF_AETHER_FEMALE_JOURNEYMAN: "Gesellin der Reclamation of Aether"
  STR_RECLAMATION_OF_AETHER_FEMALE_JOURNEYMAN_ARMOR: "Kampfanalyse: RoA-Gesellin"
  STR_RECLAMATION_OF_AETHER_INITIATE: "Novize der Reclamation of Aether"
  STR_RECLAMATION_OF_AETHER_INITIATE_UFOPEDIA: "Novizen werden aus gewoehnlichen Zivilisten mit hoher psionischer Affinitaet rekrutiert. Sie tragen ektoplasmatische Technik und Waffen, die sie entweder selbst bauen koennen oder die man ihnen anvertraut hat, doch letztlich bleiben sie Zivilisten ohne nennenswerte militaerische Ausbildung. Alle berichten aehnliche Geschichten: Traeume, die ihnen im Alltag halfen, weckten langsam ihr Interesse am Uebernatuerlichen. Hilfe wurde ihnen gewaehrt, solange sie Befehle befolgten. Wir vermuten, dass zudem unterschwellige psychische Manipulation im Spiel ist, die sie so bereitwillig macht. Was mit jenen geschieht, die sich weigern, ist unbekannt."
  STR_RECLAMATION_OF_AETHER_JOURNEYMAN: "Geselle der Reclamation of Aether"
  STR_RECLAMATION_OF_AETHER_JOURNEYMAN_UFOPEDIA: "Die Gesellen der Reclamation of Aether bilden die ausgebildete Elite dieser losen Organisation. Sie verfuegen ueber mehr Einsatzerfahrung, haben Kampfausbildung erhalten oder stammen aus militaerischen Zusammenhaengen. Zusaetzlich wurden sie mit speziellen ektoplasmatischen Handschuhen und Gesichtsmasken versehen und mit Ektoplasma direkt in ihren Koerpern angereichert, um ihre Kampffaehigkeit zu steigern."
  STR_RECLAMATION_OF_AETHER_LABORATORY: "Labor der Reclamation of Aether"
  STR_RECLAMATION_OF_AETHER_LABORATORY_BRIEFING: "Das Labor befindet sich in einem verlassenen Einkaufszentrum. Rechnen Sie in der Umgebung mit grossen Mengen spektraler Entitaeten und Kraeften der Reclamation of Aether. Schalten Sie ihre Truppen aus, uebernehmen Sie das Labor, bevor sie ihre Daten vernichten koennen, und sichern Sie ihre Ausruestung fuer unsere Analyse. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_RECLAMATION_OF_AETHER_LABORATORY_COMPLETED: "Das Aether-Labor ist gesichert."
  STR_RECLAMATION_OF_AETHER_LABORATORY_DESCRIPTION: "Die Verhoere von Mitgliedern der 'Reclamation of Aether' haben es uns ermoeglicht, den Standort eines ihrer Hauptlabore einzugrenzen. Wir muessen die Anlage stuermen und alles bergen, was uns mehr ueber ihre Faehigkeit verraet, spirituelle Manifestationen aufzuspuren."
  STR_RECLAMATION_OF_AETHER_LABORATORY_UFOPEDIA: "Dank der Erkenntnisse aus den Verhoeren von Mitgliedern der Reclamation of Aether und der Bergung verschiedener Rest-Psi-Artefakte verstehen wir die mentalen Energien, mit denen diese Gruppe arbeitet, inzwischen deutlich besser. Wir kennen nun auch mehrere Orte, an denen sie sich vermutlich sammeln. Mit etwas Zeit koennen wir Gebiete nach ungewoehnlicher psionischer Aktivitaet absuchen, die mit ihren inzwischen angesammelten Artefakten zusammenhaengt, und so einen ihrer Treffpunkte aufspueren."
  STR_RECLAMATION_OF_AETHER_MALE_INITIATE: "Novize der Reclamation of Aether"
  STR_RECLAMATION_OF_AETHER_MALE_INITIATE_ARMOR: "Kampfanalyse: RoA-Novize"
  STR_RECLAMATION_OF_AETHER_MALE_JOURNEYMAN: "Geselle der Reclamation of Aether"
  STR_RECLAMATION_OF_AETHER_MALE_JOURNEYMAN_ARMOR: "Kampfanalyse: RoA-Geselle"
  STR_RECLAMATION_OF_AETHER_MASTER: "Meister der Reclamation of Aether"
  STR_RECLAMATION_OF_AETHER_MASTER_ARMOR: "Kampfanalyse: RoA-Meister"
  STR_RECLAMATION_OF_AETHER_MASTER_UFOPEDIA: "Die Meister der Reclamation of Aether wirken kaum noch menschlich. Sie sind dauerhaft in einem gepanzerten Anzug eingeschlossen, waehrend gasfoermiges Ektoplasma ihre Koerper durchstroemt. Diese Anordnung erlaubt es ihnen, ektoplasmatische Wesen mit einem lebenden Menschen zu verschmelzen, was einen maechtigen psionischen Anwender mit direktem Zugang zum Geisterfluestern erschafft. Sie dienen der Organisation als Fuehrer und Visionaere. Sie sind widerstandsfaehig und fuehren maechtige ektoplasmatische Waffen."
  STR_RECLAMATION_OF_AETHER_OBLIVIONIST: "Oblivionist der Reclamation of Aether"
  STR_RECLAMATION_OF_AETHER_OBLIVIONIST_ARMOR: "Kampfanalyse: RoA-Oblivionist"
  STR_RECLAMATION_OF_AETHER_OBLIVIONIST_UFOPEDIA: "Diese fanatischen Aether-Kultisten sind eine Verschmelzung aus lebendem Menschen und Geist und bilden rohe, aber maechtige Kampfeinheiten. Die spektrale Entitaet ist an die eigenen Engramme des Kultisten gebunden und steigert dadurch seine Kampffaehigkeiten massiv. Sobald der Oblivionist ausser Gefecht gesetzt wird, destabilisiert sich das Konstrukt und bricht augenblicklich zusammen, wobei der zornige Geist aus seinem fleischlichen Gefaengnis entweicht."
  STR_RECLAMATION_OF_AETHER_ORGANIZATION: "Organisation der Reclamation of Aether"
  STR_RECLAMATION_OF_AETHER_ORGANIZATION_UFOPEDIA: "Wir haben neue Erkenntnisse ueber die 'Reclamation of Aether' gewonnen. Es handelt sich um eine dezentrale Organisation, die von 'spirituellen Fuehrern' zusammengehalten wird, die Menschen mit hoher psychischer Begabung in ihren Traeumen erscheinen. Der Geist schenkt ihnen Inspiration oder Einsicht und fuehrt sie langsam an das Uebernatuerliche heran. Anschliessend werden sie unter der Leitung eines 'Gesellen' mit anderen Menschen zusammengebracht, die dasselbe 'schicksalhafte Ziel' durchlaufen. Was mit jenen geschieht, die sich widersetzen, wissen wir nicht.{NEWLINE}Danach jagen sie spirituellen Orten nach, um ihre von Geisterfluestern inspirierte Technologie anzutreiben, gewinnen Ektoplasma aus 'wilden Geistern' und haeufen Verbesserungen an, bis hin zur Injektion ektoplasmatischer Mixturen in ihre eigenen Koerper.{NEWLINE}Wenn wir mehr herausfinden wollen, muessen wir einen 'Meister' in die Haende bekommen, von dem die Novizen nur fluestern."
  STR_RECLAMATION_OF_AETHER_PREREQUISITE: "Voraussetzung: Reclamation of Aether"
  STR_RECLAMATION_OF_AETHER_UFOPEDIA: "Die Reclamation of Aether, auch als Children of Aether bekannt, ist eine lose Organisation aus Nethermanten, Psychotronikern und aehnlichen Gestalten, deren Verstand durch jahrelangen Kontakt mit der Psisphaere unseres Planeten etwas zu weit aus dem Gleichgewicht geraten ist. Sie stoeren vermutlich immer wieder die oeffentliche Ordnung, meist durch die Beschwoerung atypischer Effekte und mitunter sogar durch lebende Opfer fuer psionische Entitaeten."
  STR_RECORD_MICROWAVE: "Erstaunliche Mikrowelle"
  STR_RECORD_MICROWAVE_UFOPEDIA: "Kommandant, in den entschluesselten Militaerdaten bin ich auf eine erstaunliche Berechnung zur Erzeugung gebuendelter magnetischer Wellen aus kohaerenten Quellen gestossen. Wissen Sie, was das bedeutet? Wir koennen eine Mikrowelle bauen, die nicht den Teller erwaermt! Das ist schlicht ein Wunder! Veranlassen Sie sofort die Fertigung eines ersten Musters. Nach den vorgeschriebenen Tests wird das Geraet im Speisesaal installiert."
  STR_RED_DAWN_KEYCARD: "Speicherkarte der Morgenroete"
  STR_RED_DAWN_KEYCARD_UFOPEDIA: "Wir haben die Speicherkarte erfolgreich entschlüsselt. Alle Geheimnisse der Morgenroete, einschließlich Namen, Adressen, Logbücher, Quittungen, Kontakte, Aliasse, Landurkunden - wir haben sie alle, Kommandant. Ihre Zukunft liegt in unseren Händen.{NEWLINE}Ich halte die Daten bereit, um sie den richtigen Leuten offenzulegen. Wenn wir das tun, ist die Morgenroete erledigt. Aber letztlich ist es Ihre Entscheidung, ob und wann wir das tun. Ich unterstütze Ihre Entscheidung.{NEWLINE}{NEWLINE}- Stabs-Aufklärungsoffizierin"
  STR_RED_MOON_CURSE: "Fluch des Roten Mondes"
  STR_RED_MOON_CURSE_UFOPEDIA: "Unter den zahllosen Legenden, die Westmen auf der ganzen Welt erzaehlen, gibt es eine, die aussergewoehnlich populaer ist und zugleich viel ernster genommen wird, als man erwarten wuerde: die Geschichte von der verfluchten Scheune. Einer Erzaehlung zufolge belegte einst ein rachsuechtiger Geist leichtsinnige Dorfbewohner mit einem Fluch, weil sie einen uralten Mondkultplatz entweiht hatten. Ihre eigenen Nutztiere richteten sie zugrunde, und sogar die Gebaeude wurden zu Ruinen - bis auf die Scheune, in der das Unheil begann; sie verschwand spurlos. Nun heisst es, dass diese Scheune bei Vollmond an zufaelligen Orten auf dem Land wieder auftaucht, mit Waenden, so rot wie der Mond selbst. Und wehe jedem, der ihr zu nahe kommt: wilde Rinder zertrampeln ihn und blutduerstiges Federvieh pickt ihn zu Tode..."
  STR_REPAIR_SUCCESSFUL: "Reparatur erfolgreich!"
  STR_REPTIFORMER_TOWER_BRIEFING: "Reptoiden haben eine geheimnisvolle Struktur an diesem abgeschiedenen Ort errichtet. Unser Ziel ist die unheimliche Maschine im Inneren des Turms, die das umliegende Gebiet totet und transfiguriert. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_REPTOIDS_THREAT: "Die Reptoiden-Bedrohung"
  STR_REPTOIDS_THREAT_DESCRIPTION: "Wir haben eine dringende Nachricht vom Rat erhalten. Offenbar versucht eine neue, finstere Macht die Menschheit zu untergraben: eine unterirdische Zivilisation mit dem Codenamen Reptoiden. Diese Aliens scheinen fuer verdeckte Operationen hochbegabt zu sein und unsere Institutionen womoglich bereits tief infiltriert zu haben. Auch unsere politischen Gegner aeussern Besorgnis ueber diese Aktivitaeten, was darauf hindeutet, dass die Reptoiden nicht mit unseren anderen Feinden verbuendet sind. X-Com und alle anderen Kraefte des Rats wurden damit beauftragt, diese neue Bedrohung zu erforschen und zu vereiteln."
  STR_REPTOID_AFTERMATH: "Nachspiel mit den Reptoiden"
  STR_REPTOID_AFTERMATH_UFOPEDIA: "Kommandant, es sieht so aus, als wuerden die Reptoiden uns inzwischen tatsaechlich als legitime Macht anerkennen. Wir sind zwar noch lange keine Freunde, doch sie haben ihre antihumanen Aktivitaeten eingestellt und werden den Nichtangriffspakt vermutlich einhalten. Auch wenn unsere Beziehungen offenkundig schwierig bleiben, glaube ich, dass wir an einer Normalisierung arbeiten muessen. Ein erster Schritt sollte ein wissenschaftlicher und kultureller Austausch sein."
  STR_REPTOID_ASSASSINATION_SQUAD_BRIEFING: "Ein kleines Kommando reptoidischer Attentaeter hat einen Regierungskomplex infiltriert und will seine Feinde terrorisieren, indem es lokale Fuehrungspersonen und Mitarbeiter ermordet. Retten Sie die VIPs und andere Zivilisten, um unseren guten Ruf zu verbessern. Um die Mission abzubrechen, bringen Sie X-Com-Agenten zum Transportfahrzeug zurueck und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_REPTOID_ASSASSINATION_SQUAD_DESCRIPTION: "Ein kleines Kommando reptoidischer Attentaeter hat einen Regierungskomplex infiltriert und will seine Feinde terrorisieren, indem es lokale Fuehrungspersonen und Mitarbeiter ermordet. Retten Sie die VIPs und andere Zivilisten, um X-Coms guten Ruf zu staerken. Da andere Reptoiden das Gebiet mit Sicherheit beobachten, muessen Sie sich mit ausschliesslich verbergbarer Ausruestung einschleichen.{NEWLINE}Die gesamte Operation findet in Innenraeumen statt. Lassen Sie sich nicht ueberrumpeln."
  STR_REPTOID_BASE_BRIEFING: "Wir haben einen reptoiden Befehlsstand infiltriert. Wir mussen alles reptoide Personal bezwingen, um ihnen eine deutliche Botschaft zu schicken, dann erreichen wir vielleicht doch eine diplomatische Losung. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_REPTOID_CAVE_SETTLEMENT_BRIEFING: "Wir sind an einer kleinen Reptoidensiedlung angelangt, in den Auenbereichen ihres Siedlungsgebiets in Tief-Shogg. Wir mussen einen Aufzug finden, der uns Zugang zu einem dortigen Militargelande verschafft. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_REPTOID_RECRUITMENT: "Reptoiden-Rekrutierung"
  STR_REPTOID_SHIP_ANALYSIS: "Analyse des Reptoidenschiffs"
  STR_REPTOID_SHIP_ANALYSIS_UFOPEDIA: "Kommandant, ich habe das Reptoidenschiff fuer unseren Einsatz instand gesetzt und angepasst. Ausserdem habe ich eine neue Benutzerschnittstelle eingebaut, die etwas menschenfreundlicher ausfaellt. Im Echsenland wuerde sie vermutlich keine Abnahme bestehen, aber sie wird unsere Leute bis in die tiefsten Kavernen bringen. Und auch wieder zurueck, selbstverstaendlich."
  STR_RIFLE_M16_UFOPEDIA: "Dieses Sturmgewehr ist nicht besonders durchschlagskraeftig, dafuer aber leicht und praezise. Das M16 findet sich haeufig in den Haenden von EXALT-Operativen. Es verschiesst 5,56-mm-NATO-Munition mit besserer Panzerungsdurchdringung als die meisten Gewehre.{NEWLINE}{NEWLINE}Voraussetzung fuer den Kauf: Befoerderung II."
  STR_RIFTER_SUIT: "Rifter-Anzug"
  STR_RIFTER_SUIT_H_UC: "RIFTER-ANZUG (H)"
  STR_RIFTER_SUIT_INFERNAL_UC: "RIFTER-ANZUG (INF)"
  STR_RIFTER_SUIT_KYBEROS_UC: "RIFTER-ANZUG (KYB)"
  STR_RIFTER_SUIT_OLYMPIAN_UC: "RIFTER-ANZUG (OLY)"
  STR_RIFTER_SUIT_PROTEAN_UC: "RIFTER-ANZUG (PRO)"
  STR_RIFTER_SUIT_SPARTAN_UC: "RIFTER-ANZUG (SPT)"
  STR_RIFTER_SUIT_UC: "RIFTER-ANZUG"
  STR_RIFTER_SUIT_UFOPEDIA: "Diese schwere Ruestung treibt das Konzept des ungepowerten Kampfanzugs an seine Grenzen. Von dicken Terramit-Platten bedeckt, widersteht sie Kleinwaffenfeuer ebenso gut wie Hitze, Schockwellen und Nahkampfangriffen. Sie funktioniert hervorragend in lebensfeindlichen Umgebungen."
  STR_ROBOSPHERE_LASER_WEAPON: "Robosphere-Laser"
  STR_ROBOTURRET_LASER_CANNON: "Roboturret-Laserkanone"
  STR_ROBOTURRET_LASER_WEAPON: "Roboturret-Lasergewehr"
  STR_ROBOTURRET_MINIGUN_WEAPON: "Roboturret-Minigun"
  STR_ROBOTURRET_MINIGUN_WEAPON_CLIP: "Roboturret-Minigun-Magazin"
  STR_ROBOTURRET_PLASMA_CANNON: "Roboturret-Plasmakanone"
  STR_SABOTEUR_FRAME: "Saboteur-Huellenrahmen"
  STR_SACRIFICIAL_RING_CHURCH_OF_DAGON_DESCRIPTION: "Ein lokaler Ermittler aus {0} stiess auf Anweisungen fuer rituelle Opferungen junger Frauen an die Menschen des Meeres, angeblich im Austausch gegen Wohlstand. Nachdem die Bergungstrupps den Fall uebernommen hatten, bestaetigten sie, dass diese Opferungen regelmaessig stattfinden. Durch Observation und einen Hinterhalt gegen den juengsten Fall konnte die Operation gestoppt werden.{NEWLINE}[Leiche eines Tiefen Wesens, Tiefenspeer erhalten]"
  STR_SAMAEL_OF_APOCALYPSE_ARMOR: "Kampfanalyse: Samael der Apokalypse"
  STR_SAMAEL_OF_APOCALYPSE_UFOPEDIA: "Offenbar ist 'Samael' nicht nur ein Name, sondern auch ein einzigartiger Rang: Pro Jahrhundert darf es nicht mehr als einen Samael geben. Dieser Pontifex wurde in einem verbotenen Ritual, das mit Maechten von Chaos und Blutvergiessen arbeitete, zum Samael erhoben und zum Champion dieser Kraefte auf Erden gemacht. Er ist nicht nur so nuetzlich wie ein gewoehnlicher Pontifex, sondern deutlich gefaehrlicher. Mit seinem mysterioesen Geraet kann er Imps aus Zeit und Raum herbeirufen. Wie dieses Geraet funktioniert, versteht weder er noch wir."
  STR_SCARAB: "Scarab"
  STR_SCARAB_FRAME: "Scarab-Huellenrahmen"
  STR_SCARAB_MIN: "BIOSHOCK SCARAB"
  STR_SCARAB_MIN_UFOPEDIA: "Diese Variante des Scarab transportiert ein Team aus 6 gezaehmten Minotauren sowie einen Agenten zur Einsatzaufsicht."
  STR_SCARAB_UFOPEDIA: "Dieses VAST-Fahrzeug soll schnelle Verlegungen in feindlicher Umgebung revolutionieren. Es verfuegt ueber eine fortschrittliche Panzerung, die seine Insassen auch bei besonders riskanten Einsaetzen schuetzen soll. Mit leistungsstarken Triebwerken und praeziser Navigationstechnologie kann der Scarab selbst in schwierigstem Gelaende schnell und zielgenau landen."
  STR_SCOPED_HUNTING_RIFLE_MANUFACTURING: "Herstellung Zielfernrohr-Jagdgewehr"
  STR_SCOPED_HUNTING_RIFLE_UFOPEDIA: "Wir koennen diese verbesserte Version des normalen Jagdgewehrs herstellen. Sie besitzt bessere Reichweite und Genauigkeit fuer Schnellschuesse."
  STR_SCORPOID_PALACE_TAKEOVER_BRIEFING: "Die Skorpoiden Kampfen um eine Fuhrungsposition in einem ortlichen Machtsitz. Helfen Sie verbundeten Mitgliedern der Opposition, lokale Wachen auszuschalten. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_SECRETS_OF_JARHEADS: "Geheimnisse der Jarheads"
  STR_SECRETS_OF_JARHEADS_UFOPEDIA: "Jarheads sind Infiltratoren, keine Sturmtruppen. Das Grundkonzept stammt aus dem Umfeld Dagons, wurde hier jedoch mit minderwertiger menschlicher Technik nachgebaut. Ihnen fehlen die neuralen Implantate, welche die meisten Kreaturen Dagons an ihr arkanes Kontrollnetz anbinden. Stattdessen nutzt man eine grobe psionische Loesung, die Jarheads in schwaechere Schwarmverbunde zwingt und mit Informationen aus fremden psionischen Geraeten versorgt. So handeln sie im Sinne der Kirche, waehrend unerwuenschte Gedanken unterdrueckt werden. Solche psionischen Systeme sind jedoch instabil und koennen dazu fuehren, dass ganze Gruppen durchdrehen.{NEWLINE}Warum sollte Dagon solche Einheiten ueberhaupt brauchen, wo der Kult doch bereits so viele fanatische menschliche Anhaenger hat? Offenbar war dies Teil einer Vereinbarung mit der Kirchenfuehrung, die an T'leths technologischem Vorsprung teilhaben wollte. Eine Sklavenarmee zu kommandieren, erfuellte nicht nur diesen Wunsch, sondern hatte auch religioese Bedeutung. Schliesslich passt die Nutzung lebender Menschen als Komponenten gut zu T'leths Philosophie der Zweckmaessigkeit."
  STR_SECRETS_OF_LO_WO_UFOPEDIA: "Diese Schriftrollen beschreiben uralte Shinobi-Techniken, wie sie von den Assassinen von Black Lotus genutzt werden. Die Kunst des Ninpou zu meistern, dauert Jahre, doch mit genuegend Geduld und Einsicht koennten wir dieses Wissen kuenftig vielleicht selbst nutzbar machen ..."
  STR_SECRETS_OF_THE_SUCKED_BRAIN: "Geheimnisse des ausgesaugten Gehirns"
  STR_SECRETS_OF_THE_SUCKED_BRAIN_UFOPEDIA: "Trotz ihrer geistigen Instabilitaet sprachen gefangene Brainsucked-Technomads verhaeltnismaessig offen ueber ihre persoenliche Vergangenheit und ihren aktuellen Zustand. Wurden sie jedoch ueber ihre neuen Herren befragt, zerfielen ihre Nervensysteme in kuerzester Zeit - was zu Bewusstlosigkeit und schliesslich zum Tod fuehrte. Das war fast sicher ein absichtlicher Sicherungsmechanismus zum Schutz ihrer Geheimnisse; die Brainsucked warnten uns sogar, dass genau dies geschehen wuerde, wenn wir fortfuehren. Die Autopsie bestaetigt, dass die Alien-Mikroorganismen in ihrem Gehirn die Todesursache waren. Die Parasiten setzen Gifte direkt in die Gehirn-Rueckenmarksfluessigkeit frei, zerstoeren Hirnzellen und stoeren neurologische Funktionen. Unklar bleibt, was diese Reaktion ausloest und wie die Parasiten ihr selbstzerstoererisches Verhalten so praezise koordinieren.{NEWLINE}Wenn wir diese Gifte neutralisieren koennten, waere es vielleicht moeglich, Patienten am Leben zu halten oder sogar zu heilen; doch bislang fehlen uns dafuer schlicht die noetigen Erkenntnisse ueber die Physiologie dieser Parasiten."
  STR_SECRET_LIFE_OF_UAC: "Das geheime Innenleben von VAST"
  STR_SECRET_LIFE_OF_UAC_UFOPEDIA: "Unsere Informationen waren korrekt: VAST hat seine Ausgaben fuer Raumfahrttechnik drastisch erhoeht. Das war zwar schon immer eine ihrer Staerken, doch ein solcher Sprung laesst sich nur durch eine neue und bislang unklare Geldquelle erklaeren. Ausserdem hat VAST eine neue Sparte fuer exotische Physik aufgebaut, die ebenfalls von geheimnisvollen Foerderern finanziert zu werden scheint. Die Summen bewegen sich auf dem Niveau nationaler Raumfahrtprogramme, und dennoch weiss niemand, woher sie stammen.{NEWLINE}Ein weiterer Hinweis ist die grosse Zahl neuer Gesichter in der oberen Fuehrungsebene, die von ausserhalb fuer Spezialisten- und Assistentenstellen angeheuert wurden. Dass diese Leute scheinbar aus dem Nichts auftauchen und bald darauf wieder verschwinden, sorgt bei juengeren Managern fuer erhebliche Frustration. Sie haben das Gefuehl, dass ihre Karriere nirgendwohin fuehrt.{NEWLINE}Um dieses Raetsel zu loesen, muessen wir mit einem dieser Leute in Kontakt kommen. Vielleicht kann unser geheimnisvoller Informant uns dabei einen entscheidenden Hinweis geben."
  STR_SECTOID_GUARD_UFOPEDIA: "Die Sektoide Wache ist eine Organisation aus Sektoiden, die von der normalen Befehlskette der Sektoiden ausgenommen sind und von den Atherern selbst ausgebildet werden. Diese Wachter werden dann mit hochstwichtigen Missionen betraut, etwa Schlusselstellungen zu beschutzen, und werden fur zusatzlichen Schutz mit Korperrustung versehen. Sie begleiten manchmal normale Sektoiden als Berater, aber interagieren sonst selten mit anderen Auerirdischen, auer den Atherern. Wir konnen mehr von ihnen erwarten, je naher wir der Kommandostruktur der Auerirdischen kommen."
  STR_SECTOPOD_MASS_DRIVER_ARMOR_UFOPEDIA: "Dieser Roboter ist eine robuste Konstruktion, eine KI-gesteuerte Ruestung, die den meisten Angriffsformen widersteht, insbesondere Plasmawaffen. Er ist mit einer Mass-Driver-Projektilwaffe ausgeruestet."
  STR_SEEKER_DRONE_ADAPTATION: "Seeker-Drohnen-Anpassung"
  STR_SEEKER_DRONE_AUTOPSY: "Untersuchung einer zerstoerten Seeker-Drohne"
  STR_SEEKER_DRONE_PROCESSING: "Seeker-Drohnen-Verarbeitung"
  STR_SENTIENT_GHOST: "Sentient Ghost"
  STR_SENTIENT_ZOMBIE: "Vernunftbegabte Zombies"
  STR_SENTIENT_ZOMBIE_UFOPEDIA: "Die Entdeckung vernunftbegabter Zombies - sofern man Grabwaechter noch als solche bezeichnen will - hat unser Verstaendnis dieser Wesen, ihres Lebenszyklus und ihres Status als lebendige Kreaturen vollkommen veraendert. Dank zusaetzlicher Hirnmasse verhalten sich Grabwaechter beinahe wie Menschen: Sie sprechen, benutzen Werkzeuge und sind zu einem gewissen Mass faehig, abstrakt zu denken. Dennoch bleiben sie keine Menschen. Ihr Selbst ist eingeschraenkter, und ihre fremdartige Biologie beeinflusst ihre Wahrnehmung der Welt. Trotzdem muessen wir sie als vernunftbegabt betrachten.{NEWLINE}Ein weiterer wichtiger Aspekt dieser Zombie-Stufe ist die Synthese hyperenergetischen Plasmas. Gerade diese Faehigkeit hat ihre Entwicklung erst ermoeglicht: Sie sind nicht mehr ausschliesslich darauf angewiesen, Blutplasma zu erbeuten, sondern koennen es langsam selbst produzieren. Ihren Aussagen zufolge existieren sogar noch geistig weiter entwickelte Zombieformen - ihre 'Meister'. Diese hochintelligenten Zombies muessen ueber noch bessere Physiologien verfuegen. Offen gesagt ist das beunruhigend."
  STR_SENTRY_SHIP_FRAME: "Sentry-Huellenrahmen"
  STR_SHADOW_OVER_TOWN_CHURCH_OF_DAGON: "Schatten ueber der Stadt"
  STR_SHADOW_OVER_TOWN_CHURCH_OF_DAGON_DESCRIPTION: "Ein Video zeigt Jugendliche, die beobachten, wie humanoide Gestalten aus dem Meer kommen. Laut ihrer Aussage waren diese Wesen nicht menschlich und bewegten sich auf eine nahegelegene Ortschaft zu. Der Rat hat das Leck geschlossen und Bergungstrupps zur Untersuchung entsandt. Als diese eintrafen, waren die Bewohner des Dorfes entweder tot oder verschwunden. Offenbar hatte in der oertlichen Taverne ein heftiger Kampf stattgefunden. Was genau dort geschah, bleibt unklar.{NEWLINE}[-100 Punkte]"
  STR_SHADOW_OVER_UAC: "Schatten ueber VAST"
  STR_SHADOW_OVER_UAC_UFOPEDIA: "Die Vernehmung eines VAST-Soeldners hat uns einige vielversprechende Spuren geliefert, um dieser Organisation weiter nachzugehen. Sicherlich haben ihre Kontakte inzwischen einen Teil ihrer Spuren verwischt, doch irgendwo werden sie einen Fehler machen - schliesslich sind es immer noch Menschen. Zumindest nehmen wir das an ...{NEWLINE}Mit Ihrer Erlaubnis werde ich mich darauf konzentrieren, VAST-Standorte zu identifizieren, die in kriminelle Aktivitaeten verwickelt sind. Mein Gefuehl sagt mir, dass das nicht leicht wird, aber keine Sorge - ich bin dafuer ausgebildet worden. Und zwar gruendlich."
  STR_SHADOW_SUIT: "Schattenanzug"
  STR_SHADOW_SUIT_H_UC: "SCHATTENANZUG (H)"
  STR_SHADOW_SUIT_INFERNAL_UC: "SCHATTENANZUG (INF)"
  STR_SHADOW_SUIT_KYBEROS_UC: "SCHATTENANZUG (KYB)"
  STR_SHADOW_SUIT_OLYMPIAN_UC: "SCHATTENANZUG (OLY)"
  STR_SHADOW_SUIT_PROTEAN_UC: "SHADOW-ANZUG (PRO)"
  STR_SHADOW_SUIT_SPARTAN_UC: "SCHATTENANZUG (SPT)"
  STR_SHADOW_SUIT_UC: "SCHATTENANZUG"
  STR_SHADOW_SUIT_UFOPEDIA: "Psionik und Optronik haben uns zu dieser Ruestung gefuehrt, die auf Tarnung und Aufklaerung ausgelegt ist. Neben hervorragender Tarnung besitzt sie ein Geraet zum Erzeugen und Aufrechterhalten autonomer Hologramme. Diese sind unbeweglich, koennen aber Feinde erspaehen und melden. Beide Effekte verlangen staendige Konzentration des Benutzers und blockieren damit praktisch eine Hand."
  STR_SHARE_ALIEN_GARDENS_TECH_UFOPEDIA: "Kommandant, die M.A.G.M.A.-Korporation hat unser Angebot mit beinahe beunruhigender Begeisterung angenommen und sofort in ihren geheimen Chemiewerken umgesetzt. Ich weiss nicht, wer ihre Kunden sind - abgesehen von uns natuerlich - aber ich hoffe instandig, dass sie diese Technologie niemals einsetzen. Es duerfte ausgesprochen schwer sein, ihren Gebrauch zu verbergen, wenn man bedenkt, was sie mit Menschen, Fahrzeugen und Gebaeuden anrichtet ...{NEWLINE}{NEWLINE}Dem Rat ist das natuerlich ebenfalls klar, und ich bin sehr gespannt, mit welcher Begruendung Sie sich da herausreden wollen. Sie haben doch eine, oder? (-1500 Punkte)"
  STR_SHARE_ALLOY_AMMO_TECH_UFOPEDIA: "Nun gut, Kommandant. Wir haben alle unsere Daten ueber Tritaniummunition direkt an die Server von M.A.G.M.A. uebermittelt. Ich hoffe sehr, dass uns das am Ende wirklich nuetzt und uns nicht spaeter um die Ohren fliegt.{NEWLINE}{NEWLINE}Uebrigens ist der Rat deshalb gerade ausgesprochen schlecht auf uns zu sprechen. (-500 Punkte)"
  STR_SHARE_ELERIUM_EXPLOSIVES_TECH_UFOPEDIA: "Nun, Kommandant, eigentlich muesste ich Ihnen jetzt eine Vorlesung ueber das Verbot der Verbreitung ausserirdischer Waffentechnik halten, aber dafuer duerfte es schon zu spaet sein. Ich hoffe wirklich, dass Sie wissen, was Sie tun, denn in diesem Tempo verlieren wir beide bald unsere Posten ... (-1500 Punkte)"
  STR_SHARE_POWER_SOURCE_MINIATURIZATION_TECH_UFOPEDIA: "Kommandant, wir haben M.A.G.M.A. damit die Mittel in die Hand gegeben, eine eleriumbetriebene Armee aufzubauen - oder wenigstens das Machtgleichgewicht in etlichen Weltregionen vollstaendig zu verschieben. Rueckblickend war das moeglicherweise keine brillante Idee.{NEWLINE}{NEWLINE}Der Rat ist jedenfalls ausser sich, weil wir das Embargo auf Energiequellen gebrochen haben. (-1500 Punkte)"
  STR_SHARE_TERRAMITE_TECH_UFOPEDIA: "Also gut, Kommandant. Ich habe diesem M.A.G.M.A.-Vertreter saemtliche Unterlagen ueber Terramit uebergeben. Der Kerl jagt mir einen Schauer ueber den Ruecken, also hoffe ich sehr, dass sich dieser Schritt fuer uns nicht bitter raecht.{NEWLINE}{NEWLINE}Natuerlich ist der Rat deshalb wieder ausser sich und wuerde uns am liebsten auf Spiessen sehen. Verdammt. (-500 Punkte)"
  STR_SHOGG_STINGRIFLE_UFOPEDIA: "Diese Handwaffe schiet nadelscharfe Stacheln biologischen Ursprungs. Dank einzigartiger Materialeigenschaften konnen sie leichte Rustung durchdringen, schaffen ein winziges Loch, durch das ein machtiger chemischer Wirkstoff spritzt. Diese Waffe verursacht schwere Verbrennungen tief unter der Haut des Opfers, was oft zu einem grasslichen Tod fuhrt."
  STR_SHOGG_VILLAGE_BRIEFING: "Sie werden eine unterirdische militarische Siedlung von nicht-Menschen angreifen. Finden und fangen Sie den Anfuhrer, um Infos uber die Politik in Shogg zu erhalten. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_SIEGFRIED_VON_HAGEN: "Siegfried von Hagen"
  STR_SIEGFRIED_VON_HAGEN_ARMOR: "Kampfanalyse: Siegfried von Hagen"
  STR_SIEGFRIED_VON_HAGEN_UFOPEDIA: "Siegfried von Hagen ist ein echtes Relikt des Mittelalters und ein einzigartiges Zombiesubjekt. Wenig ueberraschend erinnert er sich nicht mehr an sein frueheres Leben als Mensch, doch er spricht von einer 'Nachtkoenigin', einer geheimnisvollen Gestalt, die ihm Intelligenz und Macht verliehen haben soll. Siegfried bleibt dieser raetselhaften Wohltaeterin fanatisch ergeben. Auch seine Waffe Nachtfall sei ein Geschenk von ihr. Seine Hauptaufgabe besteht darin, die Reihen der Zombies unter seinem Kommando zu vergroessern und sie auf einen bevorstehenden Krieg vorzubereiten."
  STR_SILO_ATTACK_BRIEFING: "Auerirdische terrorisieren die Regierung, indem sie Getreidevorrate angreifen. Um die Ernte zu retten, entscharfen Sie alle 4 Bomben nahe der Silos. Sie haben 15 Runden bevor sie anfangen, hochzugehen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_SKI_RESORT_BRIEFING: "Ein Wintersport-Ressort wird von Kriminellen zur Geldwasche benutzt. Sie sind gut verknupft, sodass der Rat sie nicht offen angehen will.  Mischen Sie sich unter die Touristen, benutzen sie nur Sportausrustung und ein ziviles Fahrzeug. Seien Sie vorsichtig, da die Kriminellen sich in ihrem eigenen Revier kaum um Waffengesetze kummern mussen. Sie konnen sich von dieser Mission nicht zuruckziehen."
  STR_SKI_RESORT_DESCRIPTION: "Ein Wintersport-Ressort wird von Kriminellen zur Geldwasche benutzt. Sie sind gut verknupft, sodass der Rat sie nicht offen angehen will. Mischen Sie sich unter die Touristen, benutzen sie nur Sportausrustung und ein ziviles Fahrzeug. Schalten Sie die Kultisten aus. Sie konnen sich von dieser Mission nicht zuruckziehen."
  STR_SKULLS_AND_ROSES: "Schaedel und Rosen"
  STR_SKULLS_AND_ROSES_UFOPEDIA: "Die Kultur der Luchadores ist voller Geschichten ueber Zombies aus alten Tagen, und eine davon handelt von einer rachsuechtigen Zauberin mit furchterregenden Zombie-Kraeften. Je nach Version wechseln Name und Aufenthaltsort, doch der Kern der Erzaehlung bleibt derselbe: Sie verfluchte den Boden, damit er Zombie-Rosen hervorbringe. Ihre bluetroten Blaetter lockten arglose Seelen an. Wer sie pflueckte, war verloren: Fleisch wurde zu Dornen, Haut zu Bluetenblaettern und das Herz zu Faeulnis. Viele sagen, die Zauberin selbst, nun ein ruheloser Geist, pflege noch immer ihren Garten des Verderbens, und in mondlosen Naechten hungerten ihre Rosen nach Leben. Manche Geschichtenerzaehler unter den Luchadores vermuten, dass diese Legende eine verzerrte Erinnerung an irgendeinen mit Zombies verwandten Superorganismus ist, waehrend andere sie eher als Metapher fuer einen entgleisten Zombifizierungsprozess verstehen."
  STR_SKULL_WRAITH: "Spectral Entity"
  STR_SKULL_WRAITH_ARMOR: "Kampfanalyse: Spectral Entity"
  STR_SKULL_WRAITH_UFOPEDIA: "Diese Ansammlung psionischer Energie ist aussergewoehnlich maechtig. Sie naehrt sich von negativen menschlichen Emotionen und wandelt psionische Energie in Ektoplasma um. Ihre Jagdmethode besteht darin, Opfern Angst einzujagen und ihnen dann mentale Energie zu entziehen, waehrend sie vor Schrecken gelaehmt sind. Verlaesslich reagiert sie nur auf heftige Energieausbrueche und auf Psi."
  STR_SLEEP_WAVE_EMITTER_ASSAULT_BRIEFING: "Eine seltsame psychische Strahlung kommt von hier unter der See, erzeugt Schlafrigkeit und Betaubung in vielen Menschen in der Region. In seltenen Fallen scheinen diese Wellen bei zufalligen Burgern erhohte Aggression und psychotische Episoden hervorzurufen. Wir mussen das Problem an der Wurzel packen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das U-Boot zuruckkehren und klicken das Icon 'Mission abbrechen' an. Viel Gluck!"
  STR_SMALL_ENVOY_SHIP_FRAME: "Kleines Gesandtschaftsschiff-Huellenrahmen"
  STR_SMALL_SCOUT_FRAME: "Kleiner Scout-Huellenrahmen"
  STR_SNAKEMEN_HOMEWORLD_UFOPEDIA: "Ein Schlangenmensch konnte sich im Verhor an seine Heimatwelt erinnern - anscheinend ein seltener Fall, da die meisten Schlangenleute, denen wir auf der Erde begegnen, in auerirdischen Basen gezuchtet werden. Unser Exemplar war Mitglied einer primitiven Jager-Kultur, einer von vielen solchen Stammen auf einem fernen Planeten mit wenig Wasserflachen. Der Schlangenmensch sprach von einem vergilbten Himmel mit 3 Sonnen, versengte Hochebenen, und Flusstalern, wo die Auerirdischen leben. Eines Tages wurden sie von 'Gottern' besucht, weiter entwickelten Fremden,  und viele Schlangenmenschen traten der 'Groen Jagd unter Sternen' bei, auch unser Gefangener. Er scheint seine Heimat zu vermissen; ein seltenes Beispiel einer auerirdischen Emotion, die wir leicht verstehen und nachempfinden konnen."
  STR_SOLDIER_RAMPAGE_BRIEFING: "Ein Mitglied einer militarischen Elite-Einheit erfuhr streng gehutete Geheimnisse uber die Auerirdischen, die Regierung, und andere anverwandte Themen. Dieser Schock lie ihn zum Extremisten werden, und er plant einen Terrorangriff, um die Aufmerksamkeit der Bevolkerung auf den laufenden geheimen Krieg zu lenken. Wir mussen ihn konfrontieren und ausschalten, bevor er zu viele Menschen totet. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_SOLDIER_RAMPAGE_DESCRIPTION: "Ein Mitglied einer militarischen Elite-Einheit erfuhr streng gehutete Geheimnisse uber die Auerirdischen, die Regierung, und andere anverwandte Themen. Dieser Schock lie ihn zum Extremisten werden, und er plant einen Terrorangriff, um die Aufmerksamkeit der Bevolkerung auf den laufenden geheimen Krieg zu lenken.{NEWLINE}Wir mussen ihn konfrontieren und ausschalten, bevor er zu viele Menschen totet. Unterschatzen Sie seine militarische Bewaffnung nicht."
  STR_SORCERER_OF_DAGON_ARMOR: "Kampfanalyse: Zauberer Dagons"
  STR_SORCERER_OF_DAGON_AUTOPSY: "Autopsie: Dagon-Morph"
  STR_SORCERER_OF_DAGON_CORPSE: "Leiche eines Dagon-Morphs"
  STR_SORCERER_OF_DAGON_UFOPEDIA: "Zauberer geniessen das Privileg, mit den Boten Dagons in Verbindung zu treten, und behaupten sogar, ihre Unterwassertempel bereist zu haben. Sie verfuegen ueber seltsame telepathische Kraefte, die sich mit einem besonderen Geraet auf unterschiedliche Wirkungen fokussieren lassen. Diese Faehigkeiten machen sie zu ausserordentlich gefaehrlichen Gegnern. Menschliche Sprachen sprechen sie nur noch schlecht, doch ihre Anhaenger werden telepathisch gefuehrt und befolgen ihre Befehle bereitwillig."
  STR_SOUL_HARVEST_CHURCH_OF_DAGON_BRIEFING: "Die Kirche Dagons hat sich in diesem Dorf gezeigt und schlachtet Zivilisten im Namen ihres dunklen Gottes ab. Wir muessen dem ein Ende setzen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_SOUL_HARVEST_CHURCH_OF_DAGON_DESCRIPTION: "Die Kirche Dagons tritt in diesem Dorf immer offener auf und schlachtet Zivilisten im Namen ihres dunklen Gottes ab. Wir muessen dem ein Ende setzen!{NEWLINE}Rechnen Sie in halbwegs dicht bebautem Gebiet mit nennenswerten Kraeften der Kirche Dagons. Berichten zufolge setzen sie auch Wasserkreaturen bei der Jagd auf Menschen ein."
  STR_SO_WHAT_NOW_ANEXI: "Und was nun, Anexi?"
  STR_SPECTRAL_CORPSE_HAND: "Spektrale Leichenhand"
  STR_SPECTRAL_CORPSE_HAND_UFOPEDIA: "Eine stark verweste menschliche Hand, ueberzogen von einer Schicht Ektoplasma, die dem toten Fleisch den Anschein von 'Leben' verleiht. Die Finger zucken gelegentlich ganz von selbst. Angeblich gehoerte sie einst einem alten Geizhals."
  STR_SPECTRAL_NODE_DESTROYED: "SPEKTRALKNOTEN ZERSTOERT"
  STR_SPECTRAL_SCYTHE: "Spectral Scythe"
  STR_SPECTRAL_SCYTHE_UFOPEDIA: "Diese arkane Alienwaffe nutzt psionische Felder auf kaum aussprechbare Weise und erzielt dadurch verheerende Nahkampfangriffe. Sie ist in der Lage, nahezu jede Art von Panzerung zu ignorieren. Wir koennen dieses Geraet weder begreifen noch reproduzieren."
  STR_SPIDER_SIBERIA: "Verlassenes Labor des Syndikats"
  STR_SPIDER_SIBERIA_BRIEFING: "Diese aufgegebene Basis birgt wichtige Geheimnisse des Syndikats. Offenbar haben Riesenspinnen dort die Kontrolle uebernommen, und in den nuklear beheizten Tunneln bruetet ein gewaltiger Schwarm. Wir muessen die Anlage saeubern und die Proben sichern. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_SPIDER_SIBERIA_DESCRIPTION: "Diese aufgegebene Basis birgt wichtige Geheimnisse des Syndikats. Sie wimmelt nur so vor ausserirdischen Monstrositaeten."
  STR_SPIRITUAL_MANIFESTATION_SITES_UFOPEDIA: "Wir haben Beweise fuer die Existenz von Wesen gefunden, die man gemeinhin als 'Geister' bezeichnen wuerde: psychisch resonante, weitgehend koerperlose Entitaeten, die beim Zerfall Ektoplasma hinterlassen. Viel wissen wir noch nicht. Wir brauchen mehr Proben, und es waere unklug, bekannte Folklore einfach fuer bare Muenze zu nehmen. Unsere Nachrichtendienste pruefen nun mehrere moegliche Spukorte, damit wir einen echten Schauplatz fuer eine Geistermanifestation identifizieren koennen."
  STR_STAFF_001_UFOPEDIA: "Kommandant! Ich bin hier, um formell wegen meiner Arbeitsbedingungen Beschwerde einzureichen. In aller Fruhe weckte mich der trottelige Quartiermeister weil er irgendwas hammern musste. Nachdem ich ihm die Meinung gesagt hatte, drohnte Heavy Metal in voller Lautstarke aus dem Autopsieraum, was ich nicht mal kommentieren will. Und als ich zuruckkam und mich endlich an den Stapel Rechnungen setzte, begann so ein armer Scheikerl im Untersuchungsgefangnis wie am Spie zu brullen, was durchaus wortlich gemeint sein konnte, also musste ich auch noch mit dem rothaarigen Miststuck reden! Und der Scheikerl wusste nicht mal irgendwas Wichtiges.{NEWLINE}Im Ernst, wenn Sie den Larm nicht unterbinden, werde ICH's, und sie werden ALLE LEIDEN. Eines Tages."
  STR_STAFF_004_UFOPEDIA: "Kommandant, zum Verhoer dieses Black-Lotus-Kerls habe ich schlechte und gute Nachrichten. Die schlechte: Er hat tatsaechlich irre Ninja-Faehigkeiten gezeigt - ist aus einem Hochsicherheitsraum ausgebrochen, obwohl er in Handschellen lag, hat eine Metallverkleidung aus der Wand gerissen, unser Belueftungssystem schwer beschaedigt und zwei Reinigungskraefte zu Tode erschreckt. Die gute: Als ich ihn gestellt und wieder eingesperrt habe, habe ich mir einen riiichtig schoenen Move von ihm abgeschaut. Vielleicht nenne ich ihn den 'fabelhaften akrobatischen Ninja-Genickbrecher-Sprung'. Wollen Sie ihn sehen?"
  STR_STAFF_005_UFOPEDIA: "Kommandant, haben Sie den Kerl von der Morgenroete im Verhoer gesehen? Ein grossartiger Bursche! Er wusste zwar kaum mehr als wir ohnehin schon, aber dafuer ist er ein fantastischer Akkordeonspieler. Und was fuer eine Stimme! Es tut mir fast leid, ihn in irgendein Gefaengnis zu schicken, wo seine Talente brachliegen. Koennen wir ihn nicht behalten, wenigstens fuer einen dringend noetigen Schub fuer die Arbeitsmoral?"
  STR_STAFF_009_UFOPEDIA: "Kommandant, ich hatte einen schragen Traum letzte Nacht... darin kampfte X-Com mit nackten, misgestalteten Riesen, die nur gegen Nahkampfwaffen empfindlich waren, und nur von der Ruckseite angreifbare Rustung hatten. Es war ziemlich gruslig, aber die Chef-Wissenschaftlerin war wenigstens eine absolut scharfe verruckte Schnitte, also immerhin.{NEWLINE}Ich frage mich, ob dieser Traum je eine Fortsetzung haben wird! Ich bin richtig aufgeregt!"
  STR_STAFF_010_UFOPEDIA: "Kommandant, die Einheimischen hatten Sichtungen einer eigenartigen Kreatur gemeldet. Ich schaute mich auf meinem Spaziergang mal um, hatte Gluck und erschoss es - es schaut aus wie ein Riesenmolch mit Beinen und Zahnen. Das Problem ist Geschichte, aber ich empfehle, unsere Kanalisation besser zu uberwachen."
  STR_STAFF_017: "Stabseintrag: Blasphemische Kreuzung"
  STR_STAFF_017_UFOPEDIA: "Nein, Kommandant, ich versichere Ihnen, dass es NICHT moeglich ist, Deep Ones mit Menschen zu kreuzen. Es gibt keinerlei Weg, wie diese beiden Lebensformen irgendeine Art von Nachkommen hervorbringen koennten; ihre Genome sind dafuer viel zu unterschiedlich.{NEWLINE}Andererseits haben wir bereits Dinge gesehen, die buchstaeblich nicht existieren duerften..."
  STR_STAFF_029_UFOPEDIA: "Kommandant, dieses Minotauros-Ding... es scheint absurd fur moderne Menschen, sogar lustig. Ein Mann mit einem Ochsenkopf... Es ist ein Wunder, dass so etwas in der echten Welt uberhaupt leben kann, so schrag, so naiv ist die Idee.{NEWLINE}...warum also schauert es mich bis ins Mark... Ich kann es nicht ansehen, nicht daruber nachdenken, ohne Grauen zu fuhlen. Und ich finde diese Phobie faszinierend. Aus all dem kosmischen Horror, warum Minotauros... Warum nicht etwas Fremderes, Machtigeres...  Ernsteres... Zuerst dachte ich, weil es meinen wissenschaftlichen Sinn fur das Mogliche bedrohte, aber jetzt verstehe ich: es ist die Fleischwerdung der alten Sage von Theseus' Reise, eines der altesten Ungeheuer, die wir kennen. Es ist der blanke Horror der Blasphemie, eine Mischung aus Mensch und Tier, das schlimmste von beiden. Es ist eine Erinnerung, wer wir sind: Tiere unter einer dunnen Schicht aus Zivilisation und Kultur."
  STR_STAFF_030_UFOPEDIA: "Men in Black zu verhoren ist wirklich frustrierend. Wenn man endlich einen ihrer Kontakte erfahrt, geht man den Kerl verhaften, aber raten Sie mal, er ist nicht daheim! Er wurde gestern dort gesehen, aber jetzt ist er verschwunden! Das passiert, so ungefahr, absolut jedesmal... Hrmpf.{NEWLINE}Ehrlich gesagt, manchmal frage ich mich ob sie sich nicht in der Kanalisation verstecken. Sie sehen aus, als ob sie sich nicht gut mit den Ninja Turtles verstehen wurden."
  STR_STAFF_036_UFOPEDIA: "Oh, Kommandant! Womit belastigen Sie mich heute... Was, es geht um den Etat... Also, zuerst habe ich eine lustige Geschichte. Ich war gerade im Pausenraum, um Tee aufzusetzen, weil mein damlicher Assistent keinen anstandigen Earl Grey machen kann, wo ich Zeuge wurde. wie zwei Bauern sich vor dem Abtransport die Zeit vertrieben - mit wissenschaftlichem Diskurs!{NEWLINE}Drollig, wie solche Landmause sich uber aktuelle akademische Entdeckungen austauschten. Ein Beispiel... Och, etwa Stickstofffixierung durch Bradyrhizobia in Beziehung zu Hulsenfruchten. Da ich gerade Zeit hatte. klarte ich sie naturlich grundlich auf.{NEWLINE}Jedenfalls, worum ging's... Oh, dass ich fur Hunderte von Dollar Sachbucher uber Hortikultur und Biochemie bestellt habe... Fur Recherchen. Hochgeheim! Dammich, ich bezahle sie von meinem Gehalt, wenn Sie mich in Ruhe lassen."
  STR_STAFF_041: "Stabskommentar: Gar nicht so anders"
  STR_STAFF_041_UFOPEDIA: "Kommandant, ich muss leider melden, dass das Alien waehrend des Verhoers ploetzlich... verendet ist, ohne offensichtliche Ursache. Seine letzten Worte waren: 'Der Schwarmgeist der Menschheit ist schwach und schlecht vernetzt.' Aehm, ich glaube, das war eine Beleidigung..."
  STR_STARCHILD: "Starchild"
  STR_STARCHILD_UFOPEDIA: "Durch die behutsame Anwendung ausserirdischer Medizintechniken koennen wir die Sectoid-Anteile in der DNA unserer Hybriden stimulieren und so ihre allgemeine Kampftauglichkeit steigern. Das geht allerdings mit erheblichen Kosten fuer ihre geistige Stabilitaet einher.{NEWLINE}Erfordert Krankenstation.{NEWLINE}WARNUNG: SCHLIESST EARTHBORN AUS."
  STR_STARTING_CONDITION_CRAFT: "Dieses Fahrzeug ist fur diese Mission nicht geeignet.{NEWLINE}{NEWLINE}Erlaubte Fahrzeuge: {0}"
  STR_STARTING_CONDITION_SOLDIER_TYPE: "Manche Agenten konnen an dieser Mission nicht teilnehmen."
  STR_STONE_OF_DISCORDIA_UFOPEDIA: "Ein legendaeres Artefakt, das bis ins alte Aegypten zurueckreichen soll, angeblich jedoch noch aelter ist und nicht von Menschenhand geschaffen wurde. Es handelt sich um einen 16-seitigen Edelstein, auf dessen Flaechen jeweils ein anderes urzeitliches Ungeheuer eingraviert ist. Jede dieser Darstellungen soll einen Aspekt der menschlichen Natur und damit der Wirklichkeit selbst veranschaulichen. Im Lauf der Jahrhunderte ging der Stein durch die Haende vieler Entdecker, nicht zuletzt wegen seiner laestigen Angewohnheit, spurlos zu verschwinden und Jahre spaeter in einem anderen Land wieder aufzutauchen. Sein Aufenthaltsort ist daher nur selten bekannt. Sicher ist, dass er psionische Eigenschaften besitzt; ueber seine Wirkungen kursieren jedoch wilde Berichte, von der Verstaerkung eigener Psi-Kraefte ueber empathische Meisterschaft bis hin zur vollstaendigen Manipulation der Wirklichkeit. Man sagt, der Stein sei ein Tor in eine Welt reiner Gedanken, bewohnt von alptraumhaften Wesen und beherrscht von ebenjenen sechzehn Monstrositaeten. Natuerlich ist dieses Artefakt ausserordentlich gefaehrlich und greift die geistige Stabilitaet seines Benutzers staendig an, indem es jede denkbare Schwachstelle austestet. Viele Besitzer verfielen dem Wahnsinn, noch bevor der Stein sie wieder verliess, doch fuer jeden ernsthaften Magier bleibt er ein begehrtes Objekt."
  STR_STORM_SEIZURE_BRIEFING: "Wir haben eine Gruppe Storm-Missbraucher entdeckt. Da das verbotene Technologie ist, mussen wir ihren Vorrat beschlagnahmen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_STORM_SEIZURE_DESCRIPTION: "Wir haben eine Gruppe Storm-Missbraucher entdeckt. Da das verbotene Technologie ist, mussen wir ihren Vorrat beschlagnahmen."
  STR_STORM_UFOPEDIA: "Diese verdachtige Substanz wird als ein Muskelaufbau-Serum beschrieben. Ihre chemische Zusammensetzung weist auf Ursprung in sehr fremdartiger Wissenschaft hin. Nicht zum Verzehr empfohlen."
  STR_STRANGE_CREATURE_BREEDING: "Zucht seltsamer Kreaturen"
  STR_STRANGE_CREATURE_BREEDING_PREQ: "Voraussetzung fuer die Zucht seltsamer Kreaturen"
  STR_STRANGE_CREATURE_BREEDING_UFOPEDIA: "Kommandant, einige der Kreaturen, die wir gefangen haben, zeigen sich Menschen gegenueber erstaunlich friedfertig, sobald wir sie besser kennenlernen. So befremdlich das auch wirken mag, vielleicht koennten wir sie als eine Art Haustiere oder Nutztiere einsetzen. Unter diesem Gesichtspunkt erscheint die Idee, diese Wesen gezielt zu zuechten, gar nicht mehr so weit hergeholt.{NEWLINE}Um dieses Ziel zu erreichen, muessen wir jedoch ihr Fortpflanzungsverhalten genauer erforschen und eine geeignete Zuchtanlage errichten."
  STR_STRIKER_FRAME: "Striker-Huellenrahmen"
  STR_STRIKER_UFOPEDIA: "Dieses auerst fortschrittliche UFO wird nur wahrend auerirdischer Missionen der hochsten Wichtigkeit beobachtet. Es ist auf die Jagd auf feindliche Elite-Flugobjekte spezialisiert, aber transportiert auch eine gut ausgerustete Mannschaft."
  STR_STRIX_ARMOR: "Kampfanalyse: Strix"
  STR_STRIX_AUTOPSY: "Autopsie: Strix"
  STR_STRIX_AUTOPSY_UFOPEDIA: "Offenkundig handelt es sich um eine weitere Entwicklungsstufe des Infektors. Dieser Zombietyp speichert enorme Mengen an Bioenergie, scheint sie jedoch eher zu horten als unmittelbar zu verbrauchen. Nichtsdestoweniger sind seine Organe hoch entwickelt, vor allem Gehirn und Verdauungstrakt. Trotz ihrer fremdartigen Biologie erscheint die Strix menschenaehnlicher als ein Infektor. Sie besitzt modifizierte Milchdruesen, die naehrstoffreiches Plasma absondern koennen."
  STR_STRIX_CORPSE: "Leiche einer Strix"
  STR_STRIX_UFOPEDIA: "Trotz ihrer exotischen Biologie erinnert diese Kreatur eher an einen Menschen als an den Infektor, aus dem sie hervorgegangen ist. Sie ist recht intelligent und zu einfacher Sprache faehig, auch wenn ihre Psyche schlicht und beinahe kindlich wirkt. Da sie Blutplasma selbst synthetisieren kann, frisst die Strix nur selten andere Zombies; gelegentlich ernaehrt sie sich jedoch von grossen Tieren oder sogar Menschen. Sie kann niedere Zombies mit Nahrung anlocken und zu ihren persoenlichen Drohnen machen. Im Gegensatz zu frueheren Zombieformen besitzt sie eine stabile Physiologie und eine deutlich laengere Lebensspanne."
  STR_STRIX_WEAPON: "Strix-Angriff"
  STR_SUPERCONDUCTIVE_CIRCUITS_UFOPEDIA: "Diese exotische Verdrahtung besteht hauptsaechlich aus Tritanium, das mit einer besonderen Nanostruktur versehen wurde, um seine supraleitenden Eigenschaften zu verbessern. Diese einzigartige atomare Anordnung ermoeglicht es der Legierung, Energie mit beispielloser Effizienz zu speichern und zu uebertragen. Wird sie jedoch als Energiespeicher genutzt, zerfaellt die Struktur bei der Entladung, wodurch sie zu einer Wegwerfbatterie wird."
  STR_SUPERLASKA_APPREHENSION_BRIEFING: "Hybridspione infiltrieren die Sex-Industrie um Informationen und genetische Proben zu sammeln, und vielleicht zur Rekrutierung. Um die Zelle auszuschalten, wird sich ein X-Com-Agent als Kunde ausgeben und die Klonagentin verhaften, die die Falle vermutlich schnell erkennt und Widerstand leisten wird. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Cafe zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_SUPERLASKA_APPREHENSION_DESCRIPTION: "Hybridspione infiltrieren die Sex-Industrie um Informationen und genetische Proben zu sammeln, und vielleicht zur Rekrutierung.{NEWLINE}Ein X-Com-Agent wird sich als Kunde ausgeben und die Klonagentin verhaften. Sie beginnen in einem Cafe und durchkammen dann das Gebiet. Da dies eine Aufklarungsmission ist, kann nur Verbergbare Ausrustung benutzt werden."
  STR_SUPPLY_SHIP_FRAME: "Versorgungsschiff-Huellenrahmen"
  STR_SUPPORTER_OF_DAGON: "Anhaenger Dagons"
  STR_SUPPORTER_OF_DAGON_ARMOR: "Kampfanalyse: Anhaenger Dagons"
  STR_SUPPORTER_OF_DAGON_UFOPEDIA: "Diese Personen sind einfache Mitglieder einer quasi-religioesen Organisation namens Kirche Dagons. Sie sprechen von geheimen Ritualen mit Menschenopfern, durch die sie sich die Gunst von Meeresgottheiten sichern wollen, leben ansonsten aber recht gewoehnliche Leben. Im Grunde sind es meist nur Zivilisten, doch sie sind fanatisch, bewaffnet und gefaehrlich."
  STR_SURFTIME: "Surf Time"
  STR_SURFTIME_BRIEFING: "Dieser herrliche Strand wird von Kriminellen genutzt, um illegale Alien-Technologie zu vertreiben. Schalten Sie sie aus und sichern Sie ihre Ware. Ein Rueckzug ist in dieser Mission nicht moeglich."
  STR_SURFTIME_DESCRIPTION: "Dieser herrliche Strand dient Kriminellen als Umschlagplatz fuer illegale Alien-Technologie. Wir sollen uns als Touristen tarnen und unauffaellig unter die Menge mischen. Da sie uns genau beobachten werden, duerfen wir nur Strandausruestung und einige Surfbretter mitnehmen. Falls etwas schiefgeht, koennen wir unser Team aus dieser Mission nicht einfach wieder herausziehen."
  STR_SYNDICATE_AGENT_DISGUISE_H_UC: "VERKLEIDUNG ALS AGENT DES SYNDIKATS (H)"
  STR_SYNDICATE_AGENT_DISGUISE_INFERNAL_UC: "VERKLEIDUNG ALS AGENT DES SYNDIKATS (INF)"
  STR_SYNDICATE_AGENT_DISGUISE_KYBEROS_UC: "VERKLEIDUNG ALS AGENT DES SYNDIKATS (KYB)"
  STR_SYNDICATE_AGENT_DISGUISE_OLYMPIAN_UC: "VERKLEIDUNG ALS AGENT DES SYNDIKATS (OLY)"
  STR_SYNDICATE_AGENT_DISGUISE_PROTEAN_UC: "VERKLEIDUNG ALS AGENT DES SYNDIKATS (PRO)"
  STR_SYNDICATE_AGENT_DISGUISE_SPARTAN_UC: "VERKLEIDUNG ALS AGENT DES SYNDIKATS (SPT)"
  STR_SYNDICATE_AGENT_DISGUISE_UC: "VERKLEIDUNG ALS AGENT DES SYNDIKATS"
  STR_SYNDICATE_AGENT_DISGUISE_UC_UFOPEDIA: "Mit dem Impersonatron koennen unsere Operativen jede Einrichtung des Syndikats infiltrieren."
  STR_SYNDICATE_BIO_TERROR: "Bioterror des Syndikats"
  STR_SYNDICATE_BIO_TERROR_UFOPEDIA: "Wir haben inzwischen genug Beweise zusammengetragen, um zu bestaetigen, dass das Syndikat fuer viele, wenn nicht sogar fuer die meisten Monsterangriffe verantwortlich ist und dabei ausgesprochen systematisch vorgeht. Abnorme Kreaturen werden heimlich in der Naehe bewohnter Gebiete ausgesetzt, waehrend Feldwissenschaftler die Folgen genau beobachten. Eine ganze Abteilung scheint ausschliesslich dafuer zustaendig zu sein, diese Spezies zu zuechten, freizusetzen, zu ueberwachen und ihre Wirkung auf Menschen zu dokumentieren. Ob sie biologische Waffen testen oder ein anderes Ziel verfolgen, koennen wir noch nicht sicher sagen."
  STR_SYNDICATE_CHRYSSALID_RESEARCH: "Bioforschung des Syndikats"
  STR_SYNDICATE_CHRYSSALID_RESEARCH_UFOPEDIA: "Laut dem gefangenen Wissenschaftler des Syndikats betreibt die Organisation umfangreiche Forschung an den ausserirdischen Kreaturen, denen wir immer wieder begegnen. Ihre Forschung scheint unserer weit voraus zu sein und ist daher potenziell unbezahlbar.{NEWLINE}Die Forschungslabore des Syndikats sind gut geschuetzt und schwer zu finden, doch es gibt eine Gelegenheit, die wir nutzen koennen: Eines dieser Labore, in einer ehemaligen Basis der Morgenroete, erlitt einen Monsterausbruch und wurde daraufhin hastig aufgegeben. Wir sollten dorthin gehen, die Bedrohung ausschalten und die Proben sichern. Seien Sie nur vorsichtig - es wimmelt dort von diesen daemonischen Spinnen."
  STR_SYNDICATE_CHUPACABRAS_LAB_BRIEFING: "Die M.A.G.M.A.-Korporation hat kuerzlich versucht, mit dem Syndikat zu 'verhandeln', indem sie einem ihrer Labore einen 'Besuch' abstattete. Leider befanden sich dort mehrere Chupacabra-Exemplare, die prompt aus ihrer Verwahrung ausbrachen. Jetzt muessen wir dieses Chaos beseitigen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_SYNDICATE_CHUPACABRAS_LAB_DESCRIPTION: "Die M.A.G.M.A.-Korporation hat kuerzlich versucht, mit dem Syndikat zu 'verhandeln', indem sie einem ihrer Labore einen 'Besuch' abstattete. Leider befanden sich dort mehrere Chupacabra-Exemplare, die prompt aus ihrer Verwahrung ausbrachen. Da M.A.G.M.A. ungern mit diesem Vorfall in Verbindung gebracht werden moechte, bittet man uns nun, an ihrer Stelle einzugreifen. Ignorieren wir diese Bitte, wird der Rat uns ebenfalls kritisieren."
  STR_SYNDICATE_EXPERIMENTS: "Experimente des Syndikats"
  STR_SYNDICATE_EXPERIMENTS_UFOPEDIA: "Die Verhoere eines Wissenschaftlers des Syndikats haben uns mehrere Spuren zu den Monstern geliefert, die auf der Erde umherstreifen. Tatsachlich scheint die Organisation fuer einen guten Teil dieser Erscheinungen verantwortlich zu sein. Auch wenn ihre Motive noch unklar bleiben, muessen wir eines ihrer Klonlabore finden und genug Daten abfangen, um diese globale Verschwoerung offenzulegen.{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}Neues Ziel: Geheime Dateien ueber Monsterexperimente finden. Sie sollten sich bei Wissenschaftlern des Syndikats in ihren Geheimbasen befinden."
  STR_SYNDICATE_FIELD_TEST: "Feldtest des Syndikats"
  STR_SYNDICATE_FIELD_TEST_BRIEFING: "Eine Wissenschaftlerin des Syndikats plant, eine Horde blutruenstiger Monster auf eine friedliche Kleinstadt loszulassen. Wir muessen ihren grauenhaften Plan vereiteln und so viele Zivilisten wie moeglich retten. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_SYNDICATE_FIELD_TEST_DESCRIPTION: "Eine Wissenschaftlerin des Syndikats plant, eine Horde blutruenstiger Monster auf eine friedliche Kleinstadt loszulassen. Wir muessen ihren grauenhaften Plan vereiteln und so viele Zivilisten wie moeglich retten."
  STR_SYNDICATE_HQ: "HQ des Syndikats"
  STR_SYNDICATE_HQ_ACCESS: "Zugang zum HQ des Syndikats"
  STR_SYNDICATE_HQ_ACCESS_UFOPEDIA: "Gut, wir haben einen ... kuehnen Plan. Die Idee ist, das HQ des Syndikats zu betreten, indem wir uns als ihre Agenten ausgeben. Wir haben inzwischen genug Identitaeten gesammelt, um einige davon zu nutzen. Mit Impersonatronen werden wir das Aussehen unserer Operativen entsprechend anpassen.{NEWLINE}Wenn ich von uns spreche, meine ich natuerlich unsere Agenten und nicht mich selbst ... was eigentlich schade ist, denn das ist wirklich aufregend."
  STR_SYNDICATE_HQ_BRIEFING: "Unsere Agenten haben sich mit Impersonatronen getarnt, und wir stehen kurz davor, in das HQ des Syndikats einzudringen. Unser Ziel ist es, die gesamte Anlage einzunehmen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen in den Ausgangsbereich zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_SYNDICATE_HQ_DEFEATED: "Das Syndikat wurde geschlagen."
  STR_SYNDICATE_HQ_DESCRIPTION: "Hier erhaelt das Syndikat seine Befehle. Unser Ziel ist es, die gesamte Anlage einzunehmen.{NEWLINE}Wir muessen mit extremem Widerstand durch Kraefte des Syndikats rechnen. Die Basis duerfte aus standardisierten Korridoren und Raeumen unterschiedlicher Groesse bestehen."
  STR_SYNDICATE_HQ_UFOPEDIA: "Selbst das Syndikat muss seine Operationen von irgendwo aus beaufsichtigen. Dank der Informationen, die wir dem CEO-Mutanten entlockt haben, koennen wir diesen Ort nun aufspueren und die Verantwortlichen festsetzen.{NEWLINE}Leichter gesagt als getan: Alle Zugangswege zum HQ sind so stark ueberwacht, dass wir uns nicht unbemerkt hindurchschmuggeln koennen. Einen Frontalangriff will der Rat ebenfalls nicht genehmigen, aus Sorge, die Fuehrung koennte entkommen, und damit liegt er wohl richtig. Der einzige Weg hinein fuehrt ueber eine Tarntechnologie, auf die das Syndikat nicht vorbereitet ist. Also vielleicht ... den Impersonatron?"
  STR_SYNDICATE_LAB: "Labor des Syndikats"
  STR_SYNDICATE_LABS_NETWORK: "Labornetzwerk des Syndikats"
  STR_SYNDICATE_LABS_NETWORK_UFOPEDIA: "Das Herzstueck der Aktivitaeten des Syndikats liegt in der Entwicklung, Nutzung und dem Verkauf exotischer Technologien. Die Organisation unterhaelt ein grosses Netz geheimer Labore, meist verborgen innerhalb ganz gewoehnlicher Forschungseinrichtungen, die verschiedenen Firmen gehoeren, welche vom Syndikat kontrolliert werden. Dieses Netz zu kartieren, ist ein notwendiger Teil unseres Kampfes gegen das Syndikat."
  STR_SYNDICATE_LAB_BRIEFING: "Wir haben ein Labor des Syndikats lokalisiert. Wir muessen einen der Wissenschaftler festnehmen und fuer Informationen verhoeren. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_SYNDICATE_LAB_DESCRIPTION: "Wir haben ein Labor des Syndikats lokalisiert. Wir muessen einen der Wissenschaftler festnehmen und fuer Informationen verhoeren.{NEWLINE}Rechnen Sie mit gut ausgeruesteten Sicherheitskraeften des Syndikats."
  STR_SYNDICATE_MONSTER_LAB: "Monsterlabor des Syndikats"
  STR_SYNDICATE_MONSTER_LAB_BRIEFING: "Sie sollen in einen unterirdischen Laborkomplex eindringen. Der bequeme Weg hinein ist unmoeglich, daher muessen Sie sich durch natuerliche Hoehlen vorarbeiten. Suchen Sie nach den persoenlichen Dateien der Wissenschaftler des Syndikats. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen in die Ausgangszone zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_SYNDICATE_MONSTER_LAB_DESCRIPTION: "Unser Ziel ist ein geheimes Labor des Syndikats. Wir muessen die entscheidenden Dateien zu den Monsteraktivitaeten sicherstellen. Durchsuchen Sie die Wissenschaftler, um diese Unterlagen zu finden.{NEWLINE}Rechnen Sie mit zahlreicher und gut ausgeruesteter Sicherheit des Syndikats."
  STR_SYNDICATE_MYSTERIOUS_PARCEL: "Geheimnisvolles Paket des Syndikats"
  STR_SYNDICATE_MYSTERIOUS_PARCEL_DESCRIPTION: "Kommandant, wir haben ein Paket erhalten, das niemand bestellt hat. Es wirkt harmlos, traegt aber eindeutig das Logo des Syndikats ..."
  STR_SYNDICATE_MYSTERIOUS_PARCEL_RECEIVED: "Geheimnisvolles Paket des Syndikats eingetroffen"
  STR_SYNDICATE_MYSTERIOUS_PARCEL_UFOPEDIA: "Trotz allem, was geschehen ist, haben wir noch gemeinsame Feinde. Nehmen Sie dieses Wissen und nutzen Sie es, um die Welt zu saeubern."
  STR_SYNDICATE_NETWORK: "Netzwerk des Syndikats"
  STR_SYNDICATE_NETWORK_UFOPEDIA: "Unsere ersten Ermittlungen gegen das Syndikat haben mehrere Verbindungen in den Konzernsektor sichtbar gemacht. Die Organisation stuetzt sich auf ein weltweites Netz von Unternehmen, die ihr Geld einspielen und sie nach aussen repraesentieren, teilweise sogar ohne es selbst zu wissen.{NEWLINE}Wenn wir das Syndikat daran hindern wollen, weiteren Schaden anzurichten, muessen wir diese Firmen identifizieren und ihre Daten fuer unsere Untersuchung beschlagnahmen. Doch wir koennen dort nicht einfach mit Kanonen aus dem Himmel hereinbrechen; wir muessen diskret vorgehen. Ich besorge uns den Standort, und Sie schicken ein ziviles Fahrzeug mit Agenten in ziviler Kleidung. Sonst sind die Daten weg, bevor wir auch nur anklopfen."
  STR_SYNDICATE_OPERATIONS: "Operationen des Syndikats"
  STR_SYNDICATE_OPERATIONS_UFOPEDIA: "Wir haben die im Buerogebaeude sichergestellten Daten ausgewertet und mehrere Unternehmen kartiert, die heimlich dem Syndikat gehoeren oder von ihm gelenkt werden. Und was finden wir auf der Liste? BlackOps Industries. Offenbar ist unser Zulieferer kaum mehr als eine Marionette des Syndikats, genutzt, um nebenbei gutes Geld zu verdienen ... wobei keineswegs sicher ist, ob man dort ueberhaupt weiss, fuer wen man wirklich arbeitet.{NEWLINE}Das bringt BlackOps in eine aeusserst unangenehme Lage. Mit dieser Information koennten wir ihren Ruf ernsthaft beschaedigen oder sie sogar ganz zu Fall bringen, doch ich haette da eine bessere Idee: ein wenig Druck beim naechsten Geschaeftstreffen. Ich bin mir sicher, dass man uns danach sehr gern mit Sonderkonditionen entgegenkommt."
  STR_SYNDICATE_PHASE_1: "Datenbeschlagnahmung beim Syndikat"
  STR_SYNDICATE_PHASE_1_BRIEFING: "Ihre Agenten dringen in ein Tochterunternehmen des Syndikats ein. Ihre Aufgabe besteht darin, eine Datendiskette aus dem obersten Stockwerk zu bergen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_SYNDICATE_PHASE_1_DESCRIPTION: "Ihre Agenten dringen in ein Tochterunternehmen des Syndikats ein. Ihre Aufgabe besteht darin, eine Datendiskette aus dem obersten Stockwerk zu bergen.{NEWLINE}Rechnen Sie mit Sicherheitskraeften des Syndikats in einem Buerogebaeude und seiner unmittelbaren Umgebung.{NEWLINE}Nur verdeckbare Gegenstaende und zivile Kleidung sind erlaubt!"
  STR_SYNDICATE_PHASE_2: "Festnahme eines CEO des Syndikats"
  STR_SYNDICATE_PHASE_2_BRIEFING: "Ihre Agenten dringen in ein groesseres Buerogebaeude des Syndikats ein. Ihr Auftrag ist es, den CEO fuer ein Verhoer festzunehmen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_SYNDICATE_PHASE_2_DESCRIPTION: "Ihre Agenten dringen in ein groesseres Buerogebaeude des Syndikats ein. Ihr Auftrag ist es, den CEO fuer ein Verhoer festzunehmen. Weitere Regeln gibt es nicht, handeln Sie also nach Ermessen!{NEWLINE}Rechnen Sie mit zahlreichen Kraeften des Syndikats unterschiedlicher Qualitaet in einem Buerogebaeude und dessen unmittelbarer Umgebung."
  STR_SYNDICATE_PISSED: "Das Syndikat ist wuetend. Glueckwunsch."
  STR_SYNDICATE_REPULSED: "Das Syndikat wurde zurueckgeschlagen ... vorerst."
  STR_SYNDICATE_RETALIATION: "Vergeltung des Syndikats"
  STR_SYNDICATE_SUMMARY: "Lagebericht zum Syndikat"
  STR_SYNDICATE_SUMMARY_UFOPEDIA: "Von: Komitee der Vereinten Nationen{NEWLINE}Betreff: Das Syndikat{NEWLINE}Kommandant,{NEWLINE}der Rat hat Ihren Bericht ueber die internationale Verbrecherorganisation mit dem Namen Syndikat erhalten und geprueft. Die von Ihnen vorgelegten Beweise wurden als stichhaltig bewertet, und der Rat hat beschlossen, direkt gegen diese Organisation vorzugehen.{NEWLINE}Ihre Anweisungen lauten, das Syndikat anzugreifen und seine wichtigste Operationsbasis auszuschalten. Dazu muessen Sie einen ihrer regionalen Fuehrer verhaften und verhoeren, um den Standort des HQ zu erfahren. Gehen Sie dabei vor, wie Sie es fuer notwendig halten, aber vermeiden Sie uebermaessige Oeffentlichkeit.{NEWLINE}Gute Arbeit bisher, Kommandant. Wir sind zuversichtlich, dass Sie diese Angelegenheit rasch beenden werden. Bedenken Sie: Wir behalten Sie im Blick."
  STR_SYNDICATE_SUPERMUTANT: "Supermutant des Syndikats"
  STR_SYNDICATE_SUPERMUTANT_UFOPEDIA: "Supermutanten werden vom Syndikat erschaffen, indem freiwillige Menschen mit einem besonderen Mutagen infiziert werden. Die ueberlebenden Exemplare verfuegen ueber enorme koerperliche Kraft und beachtliche mentale Faehigkeiten. Zudem koennen sie ihre wahre Gestalt verbergen und als normale Menschen durchgehen. Der Prozess hat jedoch eine extrem hohe Sterblichkeitsrate, und es gibt auch ... andere Fehlversuche."
  STR_SYNDICATE_TESTAMENT: "Testament des Syndikats"
  STR_SYNDICATE_TESTAMENT_DECRYPTED: "Entschluesseltes Testament des Syndikats"
  STR_SYNDICATE_TESTAMENT_DECRYPTION: "Entschluesselung der letzten Botschaft des Syndikats"
  STR_SYNDICATE_TESTAMENT_ENCRYPTED: "Letzte Botschaft des Syndikats"
  STR_SYNDICATE_TESTAMENT_ENCRYPTED_UFOPEDIA: "Aus dem unterirdischen Komplex haben wir eine verschluesselte Nachricht geborgen, die vom eigentlichen Oberhaupt des Syndikats zu stammen scheint. Offenbar laesst sie sich mit einem der Ringe entschluesseln, die wir bei Personal des Syndikats sichergestellt haben. Soll ich es versuchen?"
  STR_SYNDICATE_TESTAMENT_UFOPEDIA: "Gruesse, X-Com-Kommandant.{NEWLINE}{NEWLINE}Indem Sie unsere Zelle des Syndikats auf der Erde zerschlagen haben, haben Sie Ihre Ueberlegenheit ueber die tumben Massen bewiesen. Sie besitzen das Potenzial zu wahrer Uebermenschlichkeit. Alles, was Sie dafuer tun muessen, ist Ihre Bindung an die sogenannten Erleuchteten abzuwerfen, deren einziges Ziel darin besteht, den Menschen im Dunkeln zu halten, und nach Herrschaft ueber Natur und Selbst zu streben.{NEWLINE}{NEWLINE}Entweder Sie schliessen sich uns an, oder Sie werden gemeinsam mit allen anderen Untermenschen vernichtet. Waegen Sie Ihre Entscheidung sorgfaeltig ab."
  STR_SYNDICATE_UFOPEDIA: "Das Syndikat ist eine riesige und maechtige Geheimorganisation, die mehrere globale Konzerne faktisch besitzt und viele weitere kontrolliert. Vorerst scheint ihr Hauptziel darin zu bestehen, ausserirdisches Wissen und ausserirdische Technologie um jeden Preis zu Geld zu machen, doch wir vermuten dahinter eher einen langfristigen Griff nach weltweiter Macht. Angesichts ihrer Mittel verfuegt die Organisation praktisch ueber unbegrenzte Ressourcen und geniesst offenbar sogar Rueckendeckung durch einige unserer politischen Gegner. Damit ist sie selbst im Vergleich zu aliennahen Kulten ausserordentlich gefaehrlich."
  STR_SYNDICATE_WAREHOUSE: "Lagerhaus des Syndikats"
  STR_SYNDICATE_WAREHOUSE_BRIEFING: "Wir haben ein Lagerhaus des Syndikats lokalisiert. Wir muessen verhindern, dass die dort gelagerten Gueter ihr Ziel erreichen. Das Lager wird von hochqualifizierter Sicherheit mit fortschrittlicher Ausruestung geschuetzt. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_SYNDICATE_WAREHOUSE_DESCRIPTION: "Wir haben ein Lagerhaus des Syndikats lokalisiert. Wir muessen verhindern, dass die dort gelagerten Gueter ihr Ziel erreichen. Das Lager wird von hochqualifizierter Sicherheit mit fortschrittlicher Ausruestung geschuetzt."
  STR_SYNDICATE_WEAPON_BOX: "Waffenkiste des Syndikats"
  STR_SYNDICATE_WEAPON_BOX_OPENING: "Waffenkiste des Syndikats oeffnen"
  STR_SYNDICATE_WEAPON_BOX_UFOPEDIA: "Eine unauffaellige, aber geraeumige Kiste, die fuer den Transport von Waffen und Militaerausruestung des Syndikats verwendet wird."
  STR_TACTICAL_GRENADE_LAUNCHER_UFOPEDIA: "Diese schwere Waffe aus dem Hause M.A.G.M.A. verschiesst grosse Granaten mit erstaunlicher Feuerrate.{NEWLINE}{NEWLINE}Voraussetzungen fuer den Kauf: Befoerderung III, Sprengstoffschein."
  STR_TACTICAL_NEURAL_IMPLANT_UFOPEDIA: "Unsere juengsten Fortschritte in der Medizin erlauben es uns, Agenten mit einem speziellen Mikrocomputer auszuruesten, der direkt mit dem Gehirn verbunden wird. Das Taktische Neuralimplantat verbessert Reaktionen und andere Kampffaehigkeiten deutlich, kostet aber 10 Nervenkraft. Zudem gehen 20% neu gewonnener Nervenkraft verloren und muessen erneut durch Erfahrung aufgebaut werden. Das Implantat kann in der Krankenstation eingesetzt werden.{NEWLINE}Voraussetzungen: Mut 50, Reaktionen 50"
  STR_TARGET_CANNOT_BE_FURTHER_REPAIRED: "Diese Einheit kann nicht weiter repariert werden!"
  STR_TARGET_IS_NOT_A_MACHINE: "Diese Einheit ist keine Maschine und kann damit nicht repariert werden!"
  STR_TASOTH_ARMOR: "Kampfanalyse: Tasoth"
  STR_TASOTH_AUTOPSY: "Autopsie: Tasoth"
  STR_TASOTH_AUTOPSY_UFOPEDIA: "Die Sektion hat einen cybernetischen Organismus von bemerkenswerter Kraft offenbart. In der Koerperhoehle befindet sich eine kleine Energieeinheit, jedoch keine identifizierbaren Organe. Die Energie wird ueber ein bioelektrisches Leitungssystem durch den ganzen Koerper verteilt. Knochen oder andere stuetzende Strukturen fehlen vollstaendig. Nach dem Tod bricht die Energiezufuhr ab, und die Kreatur sackt als lebloser Fetzen aus alienhaftem Fleisch und Fluessigkeiten zusammen. Die einzige weitere innere Struktur ist ein Paar keramischer Zellen, die die Kreatur bei kurzer Aufladung voruebergehend reaktivieren koennen."
  STR_TASOTH_CORPSE: "Leiche eines Tasoth"
  STR_TASOTH_DATA_PAD: "Datenpad zur Tasoth-Erschaffung"
  STR_TASOTH_DATA_PAD_UFOPEDIA: "Dieses Geraet enthaelt vollstaendige Informationen darueber, wie Tasoths von Grund auf erschaffen werden. Es ist von entscheidender Bedeutung fuer den Aufbau der unaufhaltsamen Armee Dagons.{NEWLINE}Zwar koennen wir den Prozess selbst nicht reproduzieren, aber wir verstehen genug, um ihn zu sabotieren. Wir sollten den Hauptrechner der alienhaften Fabrik hacken und die Originaldaten durch unsere eigenen ersetzen. Das wird die gesamte Anlage aus dem Gleichgewicht bringen, bis die Zrbite-Ansammlung im System die kritische Masse erreicht und alles explodiert. Damit sollten wir die Tasoth-Bedrohung beseitigen - oder sie zumindest fuer lange Zeit zurueckwerfen."
  STR_TASOTH_FACTORY_BRIEFING: "Sie sind tief in den Ozean hinabgestiegen, um den Industriekomplex zu infiltrieren, in dem Tasoth-Truppen produziert werden. Ihr Ziel ist es, ein Datenspeichergeraet zu bergen. Nehmen Sie sich vor den alienhaften Soldaten in Acht, vor allem vor den Tasoths. Viel Glueck!"
  STR_TASOTH_FACTORY_DESCRIPTION: "Der Plan besteht darin, einen Industriekomplex tief unter dem Ozeanboden zu infiltrieren, in dem Tasoth-Truppen produziert werden. Unser Ziel ist es, ein Datenspeichergeraet zu bergen, um die Schwachstellen der Anlage zu ermitteln. Nehmen Sie sich vor den alienhaften Soldaten in Acht, vor allem vor den Tasoths.{NEWLINE}Nur unterwasserfaehige Ausruestung erlaubt, aber Sie koennen so viele Soldaten mitnehmen, wie Ihr Oberflaechenfahrzeug transportieren kann."
  STR_TASOTH_SOLDIER: "Tasoth-Kommando"
  STR_TASOTH_UFOPEDIA: "Der Tasoth ist einem Menschen an roher Kraft weit ueberlegen, ein echter Alien, dessen Verhalten und fleischfressende Natur auf der Erde ihresgleichen suchen. Er scheint wie geschaffen, die Speerspitze eines alienhaften Angriffs zu bilden, denn selbst angesichts ueberwaeltigender Uebermacht zeigt er keine Spur von Rueckzug."
  STR_TECH_WIZARD_ARMOR: "Kampfanalyse: Wizkid"
  STR_TELEVISED_GHOST_HUNTING_BRIEFING: "Einige junge Ermittler mit allerlei Ausruestung sind in ein Haus eingebrochen, das wir ueberwachen. Entweder haben sie von unseren Nachforschungen Wind bekommen oder sie sind denselben Spuren gefolgt wie wir. So oder so muessen wir nachsehen, ihre Ausruestung sichern und sie festnehmen, sofern sie noch leben. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_TELEVISED_GHOST_HUNTING_COMPLETED: "Das Spukhaus ist gesichert."
  STR_TELEVISED_GHOST_HUNTING_DESCRIPTION: "Einige junge Ermittler mit allerlei Ausruestung sind in ein Haus eingebrochen, das wir ueberwachen. Entweder haben sie von unseren Nachforschungen Wind bekommen oder sie sind denselben Spuren gefolgt wie wir. So oder so muessen wir nachsehen, ihre Ausruestung sichern und sie festnehmen, sofern sie noch leben."
  STR_TELEVISED_GHOST_HUNTING_INVESTIGATION: "Untersuchung: Geisterjagd im Fernsehen"
  STR_TELEVISED_GHOST_HUNTING_INVESTIGATION_UFOPEDIA: "Wir beobachten ein Haus, in dem ein Dreifachmord geschah und in das seither kein neuer Bewohner dauerhaft einziehen konnte. Depressionen, lebhafte Albtraeume, extremer Stress und panische Flucht aus dem Gebaeude gehoeren zu den gemeldeten Phaenomenen. Wir bereiten eine Legende vor, um das Haus selbst zu untersuchen, und geben uns dabei als angehende 'Geisterjaeger' aus, damit die lokalen Behoerden keinen Verdacht schoepfen."
  STR_TEMPLE_OF_DAGON_ASSAULT: "STURM AUF DEN TEMPEL DAGONS"
  STR_TEMPLE_OF_DAGON_ASSAULT_: "TEMPEL DAGONS-{0}"
  STR_TEMPLE_OF_DAGON_ASSAULT_BRIEFING: "Sie greifen eine bedeutende unterirdische Anlage der Kirche Dagons an. Schalten Sie alle Kultisten und sonstigen Verteidiger aus oder nehmen Sie sie fest. Falls Sie sich zum Rueckzug entschliessen, sammeln Sie die verbleibenden Agenten in der gruenen Ausgangszone und klicken Sie auf das Symbol Mission abbrechen."
  STR_TEMPLE_OF_DAGON_ASSAULT_DESCRIPTION: "Unter der Stadt wurde ein unterirdischer Tempel errichtet, in dem Anhaenger Dagons unsaegliche Rituale fuer ihren dunklen Gott vollziehen. Unbemerkt von der Bevoelkerung beherbergt er arkane Maschinen unirdischen Ursprungs, waehrend sich im Inneren unmenschliche Kreaturen sammeln."
  STR_TEMPLE_OF_DAGON_RETALIATION: "Vergeltung der Kirche Dagons"
  STR_TEMPLE_OF_DAGON_USO_INTERCEPTION: "Abfangen am Tempel Dagons"
  STR_TENTACULAT_AUTOPSY_UFOPEDIA: "Die Autopsie erwies, da zahllose kleine kybernetische Implantate im Gehirn der Kreatur vorhanden sind. Das Sehsystem ist eine komplexe Kombination aus sichtbarem Licht und thermischem Bilderwerb. Selbst in den grossten Tiefen des Ozeans kann dieses Monster mit unfehlbarer Genauigkeit navigieren. Rudimentare Organe sind vorhanden, die das reine Uberleben sichern. Jede Kreatur besitzt einen kleinen Magen mit einer Verbindung nach auen. Das Wesen wird durch direkte Nahrstoffzufuhr ernahrt."
  STR_TERRAMACE: "Terramace"
  STR_TERRAMACE_UFOPEDIA: "Diese Nahkampfwaffe wird aus exotischen Shogg-Materialien gefertigt und speziell fuer den menschlichen Gebrauch entworfen. Sie besitzt eine extrem dichte Struktur, und ihre Aufschlagflaeche ist mit Tritanium-Stacheln besetzt. Dadurch durchschlaegt sie Ruestung besonders gut und erzeugt zusaetzlich einen starken Betaeubungseffekt."
  STR_TERRAMITE_ARMOR: "Terramit-Ruestung"
  STR_TERROR_FROM_THE_DEEP_UFOPEDIA: "Wir haben endlich den schrecklichen Plan von T'leth aufgedeckt: Offenbar errichten sie eine Armee unaufhaltsamer Krieger namens Tasoths, um die Erde zu ueberrennen.{NEWLINE}Zu unserem Glueck wird diese Armee in einer isolierten Anlage produziert, weil der Prozess instabile und heikle Maschinerie erfordert. Das gibt uns die Chance zur Infiltration. Wir sollten genug Daten sammeln, um moeglichst bald einen Plan zu entwickeln, wie wir die Anlage ausschalten koennen."
  STR_TERROR_SHIP_FRAME: "Terrorschiff-Huellenrahmen"
  STR_THEIR_DARKEST_HOUR: "Ihre dunkelste Stunde"
  STR_THEIR_DARKEST_HOUR_DESCRIPTION: "Die Kraefte des Rats waren recht erfolgreich dabei, verbliebene Technomads einzudaemmen. Sie uebernahmen mehrere ueber den Planeten verstreute Cyberweb-Anlagen; einige wurden stillgelegt, andere bleiben in Betrieb. Auch die Alienstadt ist weiterhin inaktiv, was ebenfalls gute Nachrichten sind.{NEWLINE}Allerdings liegt die Zahl der festgenommenen oder getoeteten Technomads weit unter der geschaetzten Gesamtstaerke des Cyberweb-Personals. Was ist mit den anderen geschehen? Sind sie irgendwie zur Erde zurueckgekehrt? Oder hat sie ein anderes Schicksal ereilt? Vielleicht wird die Zeit es zeigen..."
  STR_THEY_CALL_HIM_SMILEY_UFOPEDIA: "Ein Luchador mit dem Spitznamen 'Smiley' war beruehmt fuer seinen aussergewoehnlichen Geruchssinn, mit dem er angeblich sogar abtruennige Zombies ueber offenes Gelaende verfolgen konnte. Ob das nun stimmt oder nicht: Er war ein herausragender Zombiejager und nahm grosse Mengen 'Zombiesaft' zu sich. Eines Tages verfolgte er eine Gruppe Zombies zu einem alten Schrottplatz auf dem Land. Dort fand er sie alle tot vor, niedergemetzelt von einer unbekannten Macht. Smiley entwickelte eine Besessenheit fuer dieses Raetsel und beschloss, diese unbekannten Wesen selbst zu jagen. Ueber Wochen sammelte er Berichte ueber hoellische, feuerspeiende Bestien, die durchs Land streifen. Schliesslich machte er sich auf, um ihnen zu begegnen, und kehrte nie wieder zurueck. Dennoch fluestern einige Luchadores, Smiley tauche seither selbst auf - monstroes entstellt -, um seine eigenen Leute zu jagen und zu verschlingen..."
  STR_THEY_CAME_FROM_THE_SEA_BRIEFING: "Eine Horde aquatischer Kreaturen, die meisten davon humanoid, terrorisiert einen Seehafen. Kultisten Dagons unterstuetzen sie dabei. Stellen Sie sich den Schrecken aus dem Meer entgegen und schuetzen Sie die Bevoelkerung. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_THEY_CAME_FROM_THE_SEA_DESCRIPTION: "Eine Horde aquatischer Kreaturen, die meisten davon humanoid, terrorisiert einen Seehafen. Kultisten Dagons unterstuetzen sie dabei. Stellen Sie sich den Schrecken aus dem Meer entgegen und schuetzen Sie die Bevoelkerung."
  STR_THEY_SET_US_UP_DESCRIPTION: "Eine False-Flag-Operation der Men in Black hat uns vor dem Rat schlecht aussehen lassen. Wir haben unser Bestes gegeben, um unsere Unschuld zu beweisen, aber einige Ratsmitglieder liessen sich nicht ueberzeugen.{NEWLINE}[-200 Punkte]"
  STR_THE_ASPHALT_ENTITY: "Das Asphaltwesen"
  STR_THE_ASPHALT_ENTITY_UFOPEDIA: "Zahlreiche urbane Legenden ranken sich um die Tuen Mun Road, eine Autobahn in Hongkong, die fuer ihre Sicherheitsprobleme beruechtigt ist. Die meisten Geschichten handeln von Geistern oder aehnlichen Wesen, die die Sinne von Reisenden beeinflussen und Maschinen stoeren, doch keine oeffentliche oder geheime Quelle konnte diese Behauptungen je belegen. Dennoch glauben viele Easy Riders an eine besondere Entitaet, die mit diesem Ort verbunden ist: kein Geist im eigentlichen Sinn, sondern die spirituelle Verkoerperung der Strasse und ihrer Infrastruktur. Laut einem Chronisten der Easy Riders, der vor Ort nur als 'Uncle Wong' bekannt ist, ist dieses Wesen ebenso launisch wie die alten Meeresgoetter: zufrieden gewaehrt es sichere Durchfahrt, erzuernt zeigt es grundlose Bosheit. Wong behauptet, der Geist lasse sich mit Opfern besaenftigen, die die Easy Riders ungefaehr einmal im Jahr waehrend eines geheimen Festes darbringen. Diese Gaben seien in der Regel harmlos, doch in mindestens einem Fall soll ein Mensch geopfert worden sein, weil das Asphaltwesen damals besonders ungehalten gewesen sei. Der Rat konnte keine dieser Geschichten bestaetigen, doch die lokalen Easy Riders beharren weiterhin darauf, dass sie im Wesentlichen wahr sind."
  STR_THE_BANQUET_DESCRIPTION: "Zu Ihren Aufgaben als X-Com-Kommandant gehoert es auch, bei Empfaengen mit Mitgliedern des Rats in Kontakt zu bleiben und sie im Auge zu behalten. Die Etikette verlangt nun einmal, dass man gelegentlich selbst als Gastgeber auftritt. Genau so ein Anlass ist jetzt gekommen.{NEWLINE}[100 Punkte, -500 000$]"
  STR_THE_BRAINSUCKED: "The Brainsucked"
  STR_THE_BRAINSUCKED_AUTOPSY: "Autopsie: Brainsucked"
  STR_THE_BRAINSUCKED_AUTOPSY_UFOPEDIA: "Dieser Mensch weist die fuer ein Cyberweb-Mitglied typischen kybernetischen Augmentationen auf. Zusaetzlich wurde sein Koerper durch einen alienhaften biologischen Wirkstoff veraendert, der ein robustes Netzwerk ausgebildet hat, das einem zusaetzlichen Gefaesssystem aehnelt. Dieses Netzwerk verbindet verschiedene Organe, erhoeht ihre Widerstandsfaehigkeit erheblich und verbessert moeglicherweise auch ihre Funktionen. Das Gehirn ist nicht Teil dieses Netzwerks, scheint jedoch von zahlreichen mikroskopischen Organismen ausserirdischen Ursprungs bewohnt zu werden."
  STR_THE_BRAINSUCKED_CORPSE: "Brainsucked-Leiche"
  STR_THE_BRAINSUCKED_HARVEST: "Interdimensionale Schnitter"
  STR_THE_BRAINSUCKED_HARVEST_BRIEFING: "In der Gegend sind Personen mit exotischen Strahlenwaffen aufgetaucht. Sie schiessen auf Menschen und Tiere gleichermassen und zerstoeren zudem die Vegetation. Offenbar werden sie von Robotern des Cyberweb begleitet. Wir muessen sie aufhalten, bevor die Lage ausser Kontrolle geraet. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_THE_BRAINSUCKED_HARVEST_DESCRIPTION: "In der Gegend sind Personen mit exotischen Strahlenwaffen aufgetaucht. Sie schiessen auf Menschen und Tiere gleichermassen und zerstoeren zudem die Vegetation. Offenbar werden sie von Robotern des Cyberweb begleitet. Wir muessen sie aufhalten, bevor die Lage ausser Kontrolle geraet."
  STR_THE_BRAINSUCKED_HARVEST_WON: "Interdimensionale Schnitter siegreich."
  STR_THE_BRAINSUCKED_LAIR: "Ehemaliges Cyberweb-Versteck"
  STR_THE_BRAINSUCKED_LAIR_BRIEFING: "Ein ehemaliges Cyberweb-Mitglied versteckt sich tief in der staedtischen Kanalisation. Wir sollten ihn festsetzen und zum Verhoer bringen. Wie beim Cyberweb ueblich, wird er von mehreren robotischen Einheiten bewacht. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_THE_BRAINSUCKED_LAIR_DESCRIPTION: "Ein verlassenes Cyberweb-Versteck in der Kanalisation ist wieder aktiv geworden. Sein neuer Bewohner sorgt an der Oberflaeche fuer Aerger, indem er Haustiere entfuehrt, Topfpflanzen stiehlt und Muellsaecke aufreisst. Als die Polizei zugriff, entkam der Verdaechtige unter dem Schutz bestaetigter Cyberweb-Drohnen. Da der Fall zunehmend aus dem Ruder laeuft, muessen wir ihn schnell loesen, bevor der Rat uns zur Rechenschaft zieht."
  STR_THE_BRAINSUCKED_PARTY: "Unheimliche Gruppe"
  STR_THE_BRAINSUCKED_PARTY_BRIEFING: "In der Gegend sind Personen mit exotischen Strahlenwaffen aufgetaucht. Offenbar werden sie von Robotern des Cyberweb begleitet. Wir sollten sie festsetzen und diese Bedrohung eindaemmen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_THE_BRAINSUCKED_PARTY_DESCRIPTION: "In der Gegend sind Personen mit exotischen Strahlenwaffen aufgetaucht. Offenbar werden sie von Robotern des Cyberweb begleitet. Wir sollten sie festsetzen und diese Bedrohung eindaemmen."
  STR_THE_BRAINSUCKED_PROPHET_AUTOPSY: "Autopsie: Brainsucked-Prophet"
  STR_THE_BRAINSUCKED_PROPHET_AUTOPSY_UFOPEDIA: "Dieses ehemalige Cyberweb-Mitglied wurde umfassend umgebaut, um sich in die alienhafte Infrastruktur von Dimension X einzufuegen. Mehrere Organe wurden entfernt, besonders die Leber und der Kehlkopf. Andere, etwa Herz oder Gliedmassen, sind noch vorhanden, scheinen aber keine lebenswichtige Funktion mehr zu haben. Zahlreiche roehrenartige Leitungen verbinden den Koerper mit externer Stuetze und mutmasslich auch mit Steuersystemen. Das Gehirn ist in bislang ungekanntem Ausmass von Xenoorganismen befallen. Da die meisten biologischen Funktionen durch Alien-Technik ersetzt wurden, kann dieses Wesen sich weder bewegen noch sprechen noch allein ueberleben."
  STR_THE_BRAINSUCKED_PROPHET_CORPSE: "Brainsucked-Prophet-Leiche"
  STR_THE_BRAINSUCKED_UFOPEDIA: "Diese ehemaligen Cyberweb-Mitglieder wurden von einer Alien-Intelligenz weiter veraendert, vermutlich um deren Zwecken zu dienen. Sie sind robuster geworden und besser an die Umwelt von Dimension X angepasst, brauchen fuer ein langfristiges Ueberleben in der Alienwueste aber weiterhin Technologie. Mental sind sie instabil und neigen zu atavistischem Verhalten, behalten jedoch ihre Erinnerungen und sind zu normaler Interaktion faehig. Obwohl sie sich leicht in unsere Gesellschaft einfuegen koennten, meiden sie menschlichen Kontakt und scheinen sich lieber auf den Diebstahl unserer Ressourcen zu konzentrieren."
  STR_THE_COUNCIL_BACKTRACKS: "Der Rat rudert zurueck"
  STR_THE_COUNCIL_BACKTRACKS_DESCRIPTION: "Der Rat hat endlich eingeraeumt, dass es eine vorschnelle Entscheidung war, X-Com von Dimension X abzuschneiden. Zwar ist es den Ratskraeften gelungen, ehemalige X-Com-Einrichtungen zu uebernehmen, Forschung und Erkundung anzustossen und die verbliebene Cyberweb-Praesenz weitgehend zu zerschlagen, doch fuer feinere Operationen fehlt ihnen die noetige Expertise. Kuenftig koennte der Rat uns daher mit ausgesuchter Hoeflichkeit um Unterstuetzung jenseits der Tore bitten.{NEWLINE}[1000 Punkte]"
  STR_THE_EXORCISM_BRIEFING: "Ortliche Priester wollen 'bose Geister' aus einem verlassenen Spukhaus verbannen. Schicken Sie Agenten zur Unterstutzung. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_THE_HOLLOW_MAN_PROJECT_UFOPEDIA: "Der 'Hohle Mann' ist eine Technik im Besitz der Men in Black, die die Erinnerungen des Opfers versiegelt und mit kunstlichen ersetzt. Das Ergebnis dieser Prozedur wird ebenfalls 'Hohler Mann' genannt - das perfekte Bauernopfer, das den Willen seines Schopfers ohne Zogern ausfuhrt. Diese Technologie ist hochgefahrlich, weil das Opfer seine vollen mentalen Fahigkeiten und Fertigkeiten beibehalt, auer seine Empathie, die durch die Konditionierung unterdruckt wird."
  STR_THE_KEY_TO_UAC: "Der Schluessel zu VAST"
  STR_THE_KEY_TO_UAC_UFOPEDIA: "{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}An: X-Com{NEWLINE}Von: B.A.A.L.-Kommunikationsknoten{NEWLINE}{NEWLINE}Willkommen, Kommandant. Nach Ihren juengsten Handlungen zu urteilen, war mein Vertrauen in Sie nicht fehl am Platz. Ich komme direkt zur Sache: Die derzeitige Fuehrung von VAST arbeitet daran, unsere Technologie mit uralten magischen Verfahren zu verschmelzen. Ich habe die Ergebnisse gesehen, und in vielerlei Hinsicht sind sie alles andere als schoen. Irgendwie haengt das Ganze auch mit dem Weltraum zusammen.{NEWLINE}Was auch immer ihre Ziele sein moegen: Wenn wir zulassen, dass sie sie erreichen, werden wir das bitter bereuen. Ich glaube, ich habe eine wichtige Forschungseinrichtung gefunden, die der Schluessel zu allem sein koennte. Hoffentlich kann ihr leitender Forscher Ihnen alles sagen, was Sie wissen muessen. Die Koordinaten werde ich Ihnen bald senden.{NEWLINE}Ich werde nicht zulassen, dass diese Degenerierten meine Firma ruinieren."
  STR_THE_MAGMA_MASSACRE: "Das Magma-Massaker"
  STR_THE_MAGMA_MASSACRE_UFOPEDIA: "Die blutigste und schaurigste Geschichte der Easy Riders erzaehlt vom entsetzlichen Schicksal einer bestimmten nomadischen Gruppe. Ein Jahrzehnt zuvor beschloss eines ihrer Lager, sich in der Naehe eines aktiven Vulkans niederzulassen. Abgesehen von Geologen wagten sich nur wenige Menschen in diese Gegend, was den Easy Riders ausgesprochen gut gefiel. Der Ort war zweifellos unheimlich, doch weder Lava noch Hitze noch giftige Gase besiegelten angeblich das Ende des Verstecks - zumindest, wenn man der Legende glauben darf. Dem Volksmund zufolge wurden diese Menschen von alienartigen Echsen niedergemetzelt, die aus dem Boden hervorbrachen. Angebliche Zeugen berichteten von leuchtend roten Augen, Feueratem und einer erschreckenden Leichtigkeit, mit der die Bestien eine Gruppe von mehr als dreissig bewaffneten Maennern und Frauen zerfetzten. Nur wenige entkamen ihren riesigen Zaehnen lange genug, um die Geschichte weitererzaehlen zu koennen. Ungluecklicherweise wurde der Ort schon am naechsten Tag von Lava ueberrollt, was eine ernsthafte Untersuchung unmoeglich machte. Die offizielle Schlussfolgerung lautete, vulkanische Gase haetten die Todesfaelle und Halluzinationen verursacht."
  STR_THE_NEPHILIM_UFOPEDIA: "In alter Vorzeit besuchten Auerirdische bereits die Erde. Wie heute mischten sie ihre DNS mit der von Menschen, und schufen Hybriden. Damals stammte das Erbgut von Atherern, nicht Sektoiden. Diese Hybriden waren intelligent, psi-begabt und ungewohnlich langlebig. Allerdings scheinen ihre Meister sie verlassen zu haben, oder vielleicht lehnten sie sich auf: jedenfalls begannen sie, mit antiken Menschen zusammen zu leben, haufig als Anfuhrer. Vielleicht sind sie sogar die Quelle menschlichen Psi-Potentials. Wir wissen nicht, was mit ihnen geschah, aber es ist nicht unmoglich, dass sie da drauen sind, dass sie aus den Schatten die Faden ziehen. Wer wei..."
  STR_THE_OBLIVIATRIX_UFOPEDIA: "Manche sagen, zielloses Netzsurfen fuehre eines Tages zu dieser mysterioesen Entitaet. Unter zahlreichen Aliasnamen taucht sie in verschiedensten Textkanaelen auf, waehlt ihre Opfer aus und zieht sie immer tiefer in private Gespraeche, waehrend sie ihren Geist methodisch nach Schwachstellen absucht. Gelingt dieser Versuch der Gedankenkontrolle, wechselt der Bildschirm zu einem monochromen, verpixelten Bild eines weiblichen Gesichts, begleitet von einem unirdischen Summen aus den Lautsprechern. Das Opfer ist wie gelaehmt und kann nur noch auf den Bildschirm starren, waehrend die Obliviatrix ihm gierig Erinnerungen und Gedanken entreisst. Nach vielen Stunden kommt die betroffene Person wieder zu sich, meist jedoch mit seelischen Narben und ausgepraegter Technophobie.{NEWLINE}Das Phaenomen wurde zweimal dokumentiert, auch wenn ueber die Echtheit der Aufnahmen gestritten wird."
  STR_THE_SOUND_OF_GRAVES_BRIEFING: "Wir haben das Grab dieses sogenannten Geizkragen gefunden. Wahrhaftig, in dem alten Friedhof gehen spirituelle Manifestationen um. Er liegt tief in verwaisten Waldern, fast vergessen. Wir mussen uns Zugang verschaffen und die Ursache dieses jahen Spukes erforschen. Wahrscheinlich ist ein spirituell aufgeladener Gegenstand beteiligt. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_THE_SOUND_OF_GRAVES_INVESTIGATION: "Untersuchung: Klang der Graeber"
  STR_THE_SOUND_OF_GRAVES_INVESTIGATION_UFOPEDIA: "Wir verfolgen Hinweise auf einen moeglichen Spukfall in Nordamerika. Der Legende nach lebte dort vor rund einem Jahrhundert ein alter Geizhals, der mit seinem gesamten Vermoegen begraben wurde. Jedes Jahr an seinem Geburtstag soll er aus dem Grab steigen, um seinen Schatz weiter zu mehren. Niemand kann sich jedoch darauf einigen, wo dieses Grab ueberhaupt liegt. Das hat natuerlich allerlei Schatzsucher angelockt. Die meisten finden nichts, einige wenige verschwinden spurlos. Unsere Agenten arbeiten mit Hochdruck an dem Fall. Wenn dort wirklich ein Geist umgeht, werden wir ihn finden."
  STR_THE_SPECTRAL_INVASION: "Die spektrale Invasion"
  STR_THE_SPECTRAL_INVASION_UFOPEDIA: "Einst wurde ein Dorf nahe der Seidenstrasse von einem Schrecken heimgesucht, wie ihn niemand zuvor gesehen hatte. Ein Haendler brachte ein seltsames Artefakt mit, ein Relikt, das angeblich von einem verschmaehten Zauberer verflucht worden war. In der Nacht nach seiner Ankunft erhoben sich die Toten aus ihren Graebern; ihre Seelen waren von einer dunklen Kraft neu belebt worden. Es waren nicht laenger die geliebten Verstorbenen des Dorfes, sondern gierige Spektren mit unersaettlichem Hunger nach Lebenskraft. Schon bald wurde das Dorf von wuetenden Geistern ueberrannt. Inmitten der Verzweiflung entdeckte jedoch eine Gruppe von Moenchen, dass das Artefakt die Quelle des Uebels war. Mit maechtigen Beschwoerungen schwaechten sie die Spektren und versiegelten schliesslich das Relikt. Das Dorf war gerettet, doch die Legende des verfluchten Artefakts blieb als warnende Geschichte ueber Untote bestehen. Niemand weiss, was spaeter aus dem Relikt wurde, aber viele wuerden nur zu gern seinen Aufenthaltsort kennen."
  STR_THE_SPECTRAL_MIND: "Der spektrale Verstand"
  STR_THE_SPECTRAL_MIND_UFOPEDIA: "Viele Geister wiederholen weiterhin die Bewegungen, die sie schon zu Lebzeiten ausgefuehrt haben: Ein spektraler Gaertner koennte zum Beispiel Pflanzen pflegen, die laengst nicht mehr existieren. In gewisser Weise sind sie nur noch Echos dessen, was sie einmal waren. Es ist jedoch moeglich, dass Spektren aus diesem automatenhaften Zustand 'erwachen' und sich ihrer Lage bewusst werden - ausgeloest durch aeussere Reize oder Veraenderungen ihrer Umgebung. In manchen Faellen fuehrt das Trauma eines solchen Erwachens dazu, dass sie langsam zerfallen. In vielen anderen aber erlaubt es ihnen, sich in neue Richtungen zu entwickeln und ueber ihre urspruenglichen Obsessionen hinaus zu handeln. Ein Kernzwang bleibt dennoch erhalten - um beim Beispiel zu bleiben: der Drang, Pflanzen zu pflegen. Doch dieser Zwang wird eher zu einem Grundbeduerfnis wie Essen und ist nicht mehr die Summe ihrer gesamten Existenz. Stillstand bleibt trotzdem ihr natuerlicher Zustand, denn ein Leben nach dem Tod ist kein guter Naehrboden fuer schnellen Wandel."
  STR_THE_UAC_THREAT_UFOPEDIA: "Obwohl uns noch immer wichtige Einzelheiten fehlen, wird VAST im Geheimen von einigen maechtigen Ratsmitgliedern unterstuetzt. In deren Auftrag arbeitet die Firma mit Kultisten an einer Art dimensionsuebergreifender Bruecke, die als neue Energiequelle dienen soll. VAST ist sich der ausserirdischen Bedrohung zumindest vage bewusst und betreibt diese Forschung als verzweifelten Versuch, die technologischen Faehigkeiten der Erde voranzutreiben. Um moegliche Zwischenfaelle von unserem Planeten fernzuhalten, wurde das Hauptlabor auf den Mond verlegt.{NEWLINE}Trotz aller vermeintlich guten Absichten ist VAST eindeutig nur ein Werkzeug in einem noch groesseren politischen Spiel, das hoechstwahrscheinlich eine Gefahr fuer die Erde darstellt. Die Motive ihrer geheimnisvollen Foerderer bleiben unklar, doch ihre Aktivitaeten wirken unautorisiert und sind ganz offensichtlich illegal. VAST muss unter Kontrolle gebracht und gruendlich untersucht werden. Der Schluessel zu allem duerfte irgendwo in ihrer Mondanlage verborgen sein."
  STR_THE_XCOM_HANGOVER_DESCRIPTION: "Um die Moral zu staerken, organisieren Sie ein paar teambildende Massnahmen fuer den gesamten Stab und einige Gaeste. Ein anwesender Vertreter des Rats bezeichnete den Abend als 'durchaus angemessen unterhaltsam'. Vielleicht sollten wir so etwas oefter machen.{NEWLINE}[50 Punkte, -20 000$]"
  STR_THRASHER_SHOTGUN_UFOPEDIA: "Offizieller Name: TRSh-Nahkampfwaffe; Strassenname: Thrasher. Gefertigt von der M.A.G.M.A.-Korporation, verkoerpert diese uebergrosse Waffe eine ausgesprochen oestliche Interpretation der Schrotflinte. Ihre Wirkung ist verheerend."
  STR_TLETH_BEACH_SIGHTINGS_DESCRIPTION: "Einige Strandbesucher in {0} beobachteten eine seltsame, nicht ganz menschliche Gestalt, die aus einem Kuestenwald schlich und im Meer verschwand. Die Lokalpresse hat sich mit Wonne auf die naechste Monstergeschichte gestuerzt. Noch geht sie in zahllosen Falschmeldungen unter, aber darauf koennen wir uns nicht ewig verlassen.{NEWLINE}[-25 Punkte]"
  STR_TLETH_BLUEPRINTS: "Bauplaene von T'leth"
  STR_TLETH_BLUEPRINTS_UFOPEDIA: "Verschiedene technische Unterlagen, die wir in einer alienhaften Anlage geborgen und anschliessend entschluesselt haben. Fuer unsere unmittelbaren Beduerfnisse sind sie nur begrenzt relevant, doch fuer Xenologen koennten sie von grossem Interesse sein. Ausserdem helfen sie uns, die Schallwaffentechnik von T'leth deutlich besser zu verstehen."
  STR_TLETH_CABLE_CUT: "Durchtrenntes Kabel"
  STR_TLETH_CABLE_CUT_DESCRIPTION: "Ein transatlantisches Kabel wurde durchtrennt. Die Massenmedien geben weltweit einem Hai die Schuld, aber der Rat ist gluecklicherweise nicht ganz so leichtglaeubig.{NEWLINE}[-250 Punkte]"
  STR_TLETH_DEEP_SEA_HORROR: "Tiefsee-Horror"
  STR_TLETH_DEEP_SEA_HORROR_DESCRIPTION: "Nahe Australien wurde ein gewaltiger, bereits toter Anglerfisch gefangen. Die Besatzung musste einen Kran benutzen, um ihn an Deck zu hieven, und waere das Tier noch am Leben gewesen, haette es das Schiff womoeglich zerschmettert. Das wird kaum dazu beitragen, die Bevoelkerung ruhig, fuegsam und ahnungslos zu halten...{NEWLINE}[-60 Punkte]"
  STR_TLETH_GEOTHERMAL_COLLECTOR: "Geothermalkollektor von T'leth"
  STR_TLETH_GEOTHERMAL_COLLECTOR_BRIEFING: "In der Naehe eines Unterwasservulkans wurde eine grosse Gruppe von Tiefenbewohnern gesichtet. Laut Hydrospace Dynamics errichten sie dort provisorische Energiefarmen, um geothermische Energie abzuschoepfen und in grosse Mengen Zrbite umzuwandeln. Wir werden HSD-Marines dabei unterstuetzen, diese Kollektoren auszuschalten. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zur Tauchkapsel zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_TLETH_GEOTHERMAL_COLLECTOR_DESCRIPTION: "In der Naehe eines Unterwasservulkans wurde eine grosse Gruppe von Tiefenbewohnern gesichtet. Laut Hydrospace Dynamics errichten sie dort provisorische Energiefarmen, um geothermische Energie abzuschoepfen und in grosse Mengen Zrbite umzuwandeln. Wir koennen nur raten, wofuer sie derart viel Brennstoff benoetigen, aber es verhiess nichts Gutes.{NEWLINE}Hydrospace Dynamics plant einen Angriff auf die alienhafte Anlage und braucht unsere Unterstuetzung. Eine Weigerung wuerde unsere Glaubwuerdigkeit ernsthaft beschaedigen.{NEWLINE}Nur unterwasserfaehige Ausruestung erlaubt!"
  STR_TLETH_GHOST_SHIP_DESCRIPTION: "Im {0} wurde ein treibendes Schiff ohne Besatzung entdeckt. Es gibt keine Spuren eines Kampfes, und man fand sogar halb verzehrte Mahlzeiten an Bord. Kein Notsignal, kein Logbucheintrag und keinerlei Hinweis darauf, was geschehen ist. Weil wir nun einmal die paranormale Ermittlungsabteilung der UN sind, hat man diesen ungeklaerten Fall natuerlich an uns weitergereicht.{NEWLINE}[-75 Punkte]"
  STR_TLETH_HATCHET: "Deep-One-Beil"
  STR_TLETH_HATCHET_UFOPEDIA: "Eine vergleichsweise normale Nahkampfwaffe, allerdings aus einem unbekannten gehaerteten Kunststoff gefertigt. Das macht sie leichter und haltbarer als Metall. Sie ist fuer Benutzer mit guter Kraft und soliden Wurffaehigkeiten ausbalanciert."
  STR_TLETH_MESSENGERS: "Boten von T'leth"
  STR_TLETH_RECON: "Erkundung von T'leth"
  STR_TLETH_SPEAR: "Deep-One-Speer"
  STR_TLETH_SPEAR_UFOPEDIA: "Ein Speer, wie ihn viele menschliche Kulturen verwendet haben - nur besteht er aus einem unbekannten gehaerteten Kunststoffmaterial. Dadurch ist er ausserordentlich scharf und beinahe unzerbrechlich. Leichte Panzerung durchdringt er muhelos und kann das Ziel aus dem Gleichgewicht bringen."
  STR_TLETH_SURVEY: "Vermessung von T'leth"
  STR_TLETH_TECH: "Technologie von T'leth"
  STR_TLETH_TIDAL_WAVE_OF_MADNESS: "Welle des Wahnsinns"
  STR_TLETH_TIDAL_WAVE_OF_MADNESS_DESCRIPTION: "Ueberall auf der Welt wurden zur exakt gleichen Zeit zahlreiche Menschen wahnsinnig. Unter den Betroffenen sind ueberproportional viele Kuenstler, Medien und Drogenabhaengige, und ihr wirres Gerede weist in manchen Details beunruhigende Uebereinstimmungen auf. Wir vermuten, dass Dagon in irgendeiner Form dahintersteckt.{NEWLINE}[-150 Punkte]"
  STR_TOMB_GUARD: "Grabwaechter"
  STR_TOMB_GUARD_AUTOPSY: "Autopsie: Grabwaechter"
  STR_TOMB_GUARD_AUTOPSY_UFOPEDIA: "Dieses Exemplar besitzt ein gut entwickeltes Gehirn, in dessen Innerem der Alienparasit tief vergraben liegt. Die Biochemie bleibt exotisch, doch der Koerper verfuegt ueber Entsprechungen zu saemtlichen menschlichen Grundfunktionen, einschliesslich spezialisierter Organe wie Kehlkopf und Gonaden - auch wenn eine Fortpflanzung mit Menschen mit Sicherheit ausgeschlossen ist."
  STR_TOMB_GUARD_CORPSE: "Leiche eines Grabwaechters"
  STR_TOMB_GUARD_FEMALE_ARMOR: "Kampfanalyse: Grabwaechterin"
  STR_TOMB_GUARD_FEMALE_CORPSE: "Leiche einer Grabwaechterin"
  STR_TOMB_GUARD_FEMALE_TERRORIST: "Grabwaechterin"
  STR_TOMB_GUARD_MALE_ARMOR: "Kampfanalyse: Grabwaechter"
  STR_TOMB_GUARD_MALE_CORPSE: "Leiche eines Grabwaechters"
  STR_TOMB_GUARD_MALE_TERRORIST: "Grabwaechter"
  STR_TOMB_GUARD_TERRORIST: "Grabwaechter"
  STR_TOMB_GUARD_UFOPEDIA: "Dank nachgewachsenen menschlichen Nervengewebes sind diese ehemaligen Infektoren intelligent genug, um ein eigenes Bewusstsein zu entwickeln. Ganz Mensch sind sie nicht mehr, doch sie kommen uns ueberraschend nahe: Sie koennen einfach kommunizieren, bis zu einem gewissen Grad abstrakt denken und soziale Beziehungen eingehen. Ihre Gehirne sind nahezu vollstaendig menschlich; der Parasit sitzt noch immer darin, aber seine primitive Struktur begrenzt seinen Einfluss auf den Denkprozess. Grabwaechter kommandieren niedere Zombies ueber biochemische Signale und setzen sie als Drohnen, Soldaten und notfalls als Nahrung ein. Da sie ueber die Welt nur wenig wissen, sammeln sie begierig alle moeglichen Gegenstaende, um sie zu untersuchen."
  STR_TOWER_OF_APOCALYPSE_BRIEFING: "Wir haben ein abgeschiedenes Kloster des Kults der Apokalypse gefunden. Unsere Aufgabe ist es, die Kultisten auszuschalten und Informationen ueber den Kult zu sichern. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_TOWER_OF_APOCALYPSE_DESCRIPTION: "Wir haben ein abgeschiedenes Kloster des Kults der Apokalypse gefunden. Unsere Aufgabe ist es, die Kultisten auszuschalten und Informationen ueber den Kult zu sichern."
  STR_TOWER_OF_APOCALYPSE_UFOPEDIA: "Tuerme der Apokalypse sind geheime Klosteranlagen, in denen Mitglieder des Kults ihren blasphemischen Praktiken ungestoert nachgehen koennen. Gewoehnliche Sympathisanten haben dort keinen Zutritt; eingelassen werden nur vollwertige Mitglieder. Jeder Turm wird von einem erfahrenen Kleriker mit dem Titel Pontifex geleitet, der wahrscheinlich deutlich mehr ueber die Angelegenheiten des Kults weiss als gewoehnliche Kleriker."
  STR_TOXIGUN_UFOPEDIA: "Diese Waffe spritzt eine komplexe Mischung starker chemischer Wirkmittel, die fast jedes der Wissenschaft bekanntes Material innerhalb von Sekunden auflosen kann. Naturlich ist sie todlich gegen alle Lebewesen."
  STR_TRADING_WITH_THE_WIZKIDS_BRIEFING: "Eine lokale Gruppe von Alien-Tech-Enthusiasten hat ein Treffen mit Osiron arrangiert, um illegale Waren zu kaufen. Das ist unsere Gelegenheit, uns als Osiron auszugeben und die Schuldigen festzunehmen. Eine Evakuierung ist in dieser Mission nicht moeglich."
  STR_TRADING_WITH_THE_WIZKIDS_DESCRIPTION: "Eine lokale Gruppe von Alien-Tech-Enthusiasten hat ein Treffen mit Osiron arrangiert, um illegale Waren zu kaufen. Das ist unsere Gelegenheit, uns als Osiron auszugeben und die Schuldigen festzunehmen. Denken Sie daran: Ein Rueckzug ist in dieser Mission unmoeglich - wir muessen siegen oder untergehen.{NEWLINE}Nur verdeckbare Ausruestung und Zivilkleidung erlaubt!"
  STR_TRANSDIMENSIONAL_DEFECT: "Transdimensionaler Defekt"
  STR_TRANSDIMENSIONAL_DEFECT_AVERTED: "Transdimensionaler Defekt"
  STR_TRANSDIMENSIONAL_DEFECT_AVERTED_DESCRIPTION: "Unser Transdimensionaler Empfaenger erlitt waehrend des Routinebetriebs eine Stoerung und musste voruebergehend abgeschaltet werden. Die Reparaturen waren teuer, aber wir konnten ihn ohne weitere Zwischenfaelle wieder in Betrieb nehmen.{NEWLINE}[-$150,000]"
  STR_TRANSDIMENSIONAL_DEFECT_DESCRIPTION: "Unser Transdimensionaler Empfaenger erlitt waehrend des Routinebetriebs eine Stoerung und verursachte erhebliche Schaeden an der Anlage. Der Rat erinnerte uns natuerlich trocken an unsere Verantwortung.{NEWLINE}[-100 Punkte, -$250,000]"
  STR_TRANSDIMENSIONAL_ENERGETICS: "Transdimensionale Energetik"
  STR_TRANSDIMENSIONAL_POLICY_DEBATE: "Transdimensionale Politikdebatte"
  STR_TRANSDIMENSIONAL_POLICY_DEBATE_DESCRIPTION: "Unsere politischen Gegner im Rat werfen uns vor, mit unverantwortlicher Technologie unsere Ziele voranzutreiben, vor allem mit dem Transdimensionalen Empfaenger. Sie hoben den angeblichen oekologischen Schaden hervor und nannten uns 'eine Heilung, die schlimmer ist als die Krankheit'. Dadurch hat unser Ruf etwas gelitten.{NEWLINE}[-250 Punkte]"
  STR_TRANSDIMENSIONAL_RECEIVER: "Transdimensionaler Empfaenger"
  STR_TRANSDIMENSIONAL_RECEIVER_UFOPEDIA: "Die Aufgabe dieser Anlage besteht darin, eine stabile Verbindung zur Energieinfrastruktur in Dimension X aufrechtzuerhalten, damit wir dimensionale Technik herstellen koennen. Sie ist Teil einer Vereinbarung mit dem Rat, der diese Infrastruktur betreibt, was die hohen monatlichen Kosten erklaert.{NEWLINE}WARNUNG: Dimensionstore sind instabil und koennen lokale Raumzeitverzerrungen, heftige Energieladungen oder Sicherheitsverletzungen ausloesen. Deshalb wird diese Technik allgemein misstrauisch betrachtet und kann unvorhersehbare Schaeden verursachen."
  STR_TRITANIUM_ASSASSIN_DESCRIPTION: "In {0} wurde der CEO eines grossen Unternehmens ermordet. Das Opfer hatte bereits Todesdrohungen erhalten, weshalb saemtliche relevanten Fahrzeuge und Anlagen zusaetzlich verstaerkt und kugelsicher gemacht wurden. Dennoch gelang es dem Taeter, mit einem Praezisionsschuss selbst durch eine verstaerkte Stahlwand zu feuern. Das duerfte nur mit Tritaniummunition moeglich gewesen sein, und nach Ansicht des Rates ist M.A.G.M.A. die einzig plausible Quelle fuer eine solche Waffe. In ihren Augen tragen wir damit eine indirekte Mitschuld.{NEWLINE}[-500 Punkte]"
  STR_TRITANIUM_CONTRABAND_DESCRIPTION: "Regierungsbeamte haben in {0} eine Lieferung Tritaniummunition abgefangen. In seltener Einigkeit gibt der Rat uns die Schuld an dem Vorfall, weil wir diese Technologie mit der M.A.G.M.A.-Korporation geteilt haben. Das folgende Gespraech war ausgesprochen unerquicklich, aber immerhin hat uns der Rat das Schmuggelgut 'zur weiteren Verwendung nach eigenem Ermessen' ueberlassen.{NEWLINE}[-350 Punkte]"
  STR_TRITANIUM_THROWING_AXES: "Tritanium-Wurfbeile"
  STR_TRITANIUM_THROWING_AXES_UFOPEDIA: "Eine verbesserte Version des klassischen Wurfbeils, gefertigt aus Leichtmetallen und einem kleinen Anteil Tritanium. Es ist deutlich toedlicher und durchschlaegt Ruestung besser, verlangt aber weiterhin einen erfahrenen Werfer, um sein volles Potenzial zu entfalten."
  STR_TROOP_SHIP_FRAME: "Truppenschiff-Huellenrahmen"
  STR_UAC_ASSASSINATIONS: "Mordserie bei VAST"
  STR_UAC_ASSASSINATIONS_DESCRIPTION: "In den vergangenen Tagen sind weltweit mehrere Personen unter verschiedenen Umstaenden ums Leben gekommen. Fuer die oeffentlichen Behoerden gibt es keinen offensichtlichen Zusammenhang zwischen diesen Faellen, doch unser Zugang zu vertraulichen Informationen zeigt, dass alle Betroffenen bei VAST in leitenden oder spezialisierten Positionen beschaeftigt waren. Angesichts unserer juengsten Erkenntnisse ueber VAST liegt der Verdacht nahe, dass sie Opfer eines internen Machtkampfs wurden. Was geht dort eigentlich vor sich?"
  STR_UAC_BATTERY_BUY: "VAST-Batterien - Beschaffung"
  STR_UAC_BFG_BATTERY: "VAST-BFG-Batterie"
  STR_UAC_BFG_BATTERY_UFOPEDIA: "Diese grosse Energiequelle verhaelt sich zu kleineren VAST-Magazinen wie ein Loewe zu einem Wurf Kaetzchen. Ihr staendiges Brummen ist ein unheilvolles Zeichen der daemonischen Kraefte, die sie antreiben - vermutlich mit keinem anderen Ziel, als die Welt ins Chaos zu stuerzen.{NEWLINE}Wenn wir uns dazu entschliessen, dieses Monstrum in unserer Werkstatt herzustellen, werden wir dafuer grosse Mengen Ektoplasma benoetigen."
  STR_UAC_BFG_UFOPEDIA: "Eine experimentelle VAST-Waffe, gedacht fuer angeblich geplante motorisierte Exoskelett-Einheiten. Sie arbeitet nach denselben Grundsaetzen wie die leichteren VAST-Plasmawaffen, verlangt aber erwartungsgemaess einen noch staerkeren Geist.{NEWLINE}Ihr Herstellungsprozess ist derart komplex, dass VAST derzeit nicht in der Lage ist, innerhalb eines vernuenftigen Zeitraums weitere Exemplare zu produzieren. Vielleicht ist das sogar eine gute Nachricht: Diese Waffe wirkt so offensichtlich boesartig, dass nur wenige Agenten es ueberhaupt wagen, sie zu beruehren."
  STR_UAC_CHAINGUN: "VAST-Chaingun"
  STR_UAC_CHAINGUN_BUY: "VAST-Chaingun - Beschaffung"
  STR_UAC_CHAINGUN_UFOPEDIA: "Diese kompakte schwere Waffe verschiesst einen Kugelhagel, der auf kurze bis mittlere Distanz fuer nahezu jede Lebensform toedlich ist. Dauerfeuer wirkt zudem verheerend auf Panzerungen. Sie ist fuer den Einsatz im Weltraum geeignet."
  STR_UAC_CODE_BOOK: "VAST-Codebuch"
  STR_UAC_CONSPIRACY: "Die VAST-Verschwoerung"
  STR_UAC_CONSPIRACY_UFOPEDIA: "Der VAST-Ingenieur weiss nichts ueber die illegale Verteilung von VAST-Waffen, doch es kursieren zahlreiche Geruechte ueber sonderbare Aktivitaeten innerhalb des Konzerns, die sich nicht mit rein geschaeftlichen Gruenden erklaeren lassen. VAST war nie ein Vorbild an Transparenz, aber in letzter Zeit scheint dort alles aus dem Ruder zu laufen: radikale Wechsel in der Fuehrung, Produktionslinien, die in Rekordtempo aufgebaut und wieder geschlossen werden, unbegreifliche Prioritaeten und ein allgegenwaertiges Gefuehl von Verschwoerung lassen selbst einfache Mitarbeiter an den wahren Zielen der Firma zweifeln. Es wirkt, als gaebe es innerhalb der ohnehin halbgeheimen Organisation eine zweite Ebene der Abschottung, die vom Management oder einem Teil davon aufrechterhalten wird. Angesichts der juengsten Entdeckung ihrer Zusammenarbeit mit dem Kult der Apokalypse sowie der besonderen Verbindung von VAST zum Rat rechtfertigt das eine 'Ermittlung mit hoher Intensitaet' unsererseits. Genauer gesagt sollten wir einige Hoeherrangige gefangen nehmen und verhoeren, um der Sache auf den Grund zu gehen."
  STR_UAC_CONTACT: "Kontakt: VAST"
  STR_UAC_CONTACT_UFOPEDIA: "Vanguard Aero-Space Technologies ist ein Hersteller modernster Flugzeuge und luftgestuetzter Ausruestung. Ueber mehrere Grossinvestoren ist das Unternehmen ausserdem lose mit BlackOps Industries verbunden, was es zu einem naheliegenden Kandidaten fuer einen Lieferanten von X-Com macht."
  STR_UAC_CRAFT_CANNON_BUY: "VAST-Bordkanone - Beschaffung"
  STR_UAC_DISSENT: "Dissens bei VAST"
  STR_UAC_DISSENT_UFOPEDIA: "{NEWLINE}{NEWLINE}An: X-Com{NEWLINE}Von: B.A.A.L.-Kommunikationsknoten{NEWLINE}Ich wende mich im Namen des wahren VAST an Sie, jenes VAST, das sich dem Fortschritt und der Verbesserung der Menschheit verschrieben hat. Mit grossem Bedauern muss ich Ihnen mitteilen, dass unsere Organisation kuerzlich fast vollstaendig von einer extremistischen Fraktion uebernommen wurde. Diese Fraktion scheint mit boesartigen Kulten zusammenzuarbeiten, um Technologien zu entwickeln, die sich als aeusserst gefaehrlich erweisen koennten. Wie Sie bereits wissen, hat sie auch jede ernstzunehmende Opposition, die sich offen gegen diese Ziele stellte, brutal ausgeschaltet. Ich selbst war vorsichtig genug, nicht denselben Fehler zu machen, doch ich fuerchte, dass meine Sicherheit nur voruebergehend ist.{NEWLINE}Ich weiss nicht, wie Sie zu VAST stehen, Kommandant - ob Sie legitimen VAST-Mitarbeitern Freund oder Feind sind. Deshalb werde ich weder meinen Namen nennen noch Einzelheiten preisgeben, die meine Gruppe kompromittieren koennten. X-Com ist jedoch die einzige Organisation, bei der ich zumindest hoffen kann, dass sie auf unserer Seite steht. Aus diesem Grund lege ich einige Daten ueber die illegalen Aktivitaeten von VAST rund um den Globus bei. Ich hoffe, Sie wissen sie zu nutzen."
  STR_UAC_DOOMZONE_CHAINGUN: "VAST-Doomzone-Chaingun"
  STR_UAC_DOOMZONE_CHAINGUN_BUY: "VAST-Doomzone-Chaingun - Beschaffung"
  STR_UAC_DOOMZONE_CHAINGUN_CLIP: "VAST-Doomzone-Chaingun-Magazin"
  STR_UAC_DOOMZONE_CHAINGUN_UFOPEDIA: "Diese arkane Waffe verwendet Munition, die mit Hoellenessenz angereichert wurde, um zusaetzlichen Schaden und bessere Panzerungsdurchdringung zu erzielen. Mit ihrer infernalischen Kraft kann sie sogar Braende entfachen. Eine starke mentale Disziplin ist dabei wichtig, denn die Waffe neigt zu einem ausgesprochen schwierigen Eigenwillen."
  STR_UAC_ENGINEER: "VAST-Ingenieur"
  STR_UAC_ENGINEER_ARMOR: "Kampfanalyse: VAST-Ingenieur"
  STR_UAC_ENGINEER_CORPSE: "Leiche eines VAST-Ingenieurs"
  STR_UAC_ENGINEER_UFOPEDIA: "Diese Ingenieure sind fuer die Spitzentechnologie verantwortlich, die vom VAST-Konzern entwickelt wird. In der Regel sind sie keine Frontkaempfer und sollten fuer X-Com keine ernste Bedrohung darstellen, aber sie wissen sehr genau, wie man die Waffen benutzt, die sie selbst mit entworfen haben."
  STR_UAC_HEAVY_NAILGUN: "VAST-Schwerer Nagler"
  STR_UAC_HEAVY_NAILGUN_BUY: "VAST-Schwerer Nagler - Beschaffung"
  STR_UAC_HEAVY_NAILGUN_CLIP: "VAST-Schwere Nagelbox"
  STR_UAC_HEAVY_NAILGUN_UFOPEDIA: "Der schwere Nagler nutzt elektromagnetische Kraft, um Metallspitzen zu verschiessen. Er kann durchaus als Waffe eingesetzt werden; Reichweite und Praezision sind allerdings eher maessig. Dafuer durchschlaegt er die meisten kugelsicheren Westen sehr zuverlaessig. Energie bezieht er aus supraleitenden Batterien."
  STR_UAC_INFIGHTING: "Machtkampf bei VAST"
  STR_UAC_INFIGHTING_UFOPEDIA: "Kommandant, unsere ersten Erkenntnisse deuten darauf hin, dass es innerhalb dieses VAST-Konzerns einen ernsten internen Konflikt gibt, und dass dort niemand davor zurueckschreckt, sich die Haende schmutzig zu machen. Worum genau es geht, wissen wir noch nicht, aber das koennte unsere Chance sein, einen Fuss in die Tuer zu bekommen.{NEWLINE}Mit Ihrer Erlaubnis moechte ich eine kleine Operation starten, um Unzufriedene in ihren Reihen ausfindig zu machen und moeglicherweise fuer unsere Sache zu gewinnen - oder ihnen zumindest Informationen zu entlocken. Uebrigens, finden Sie dieses schwarze Kleid schick? Ich kann es kaum erwarten, an diesen Leuten zu arbeiten."
  STR_UAC_LIGHT_PLASMA_GUN: "VAST-Leichte Plasmawaffe"
  STR_UAC_LIGHT_PLASMA_GUN_BUY: "VAST-Leichte Plasmawaffe - Beschaffung"
  STR_UAC_LIGHT_PLASMA_GUN_CLIP: "VAST-Leichte-Plasmawaffe-Batterie"
  STR_UAC_LIGHT_PLASMA_GUN_CLIP_UFOPEDIA: "Ein Energiepaket fuer die VAST-Leichte Plasmawaffe. Seine Energie - unter der Bezeichnung 'Hoellenessenz' - beruht auf extrem maechtiger psionischer Kraft aus der Hoelle, einer immateriellen Ebene daemonischer Wesen, die mit dem Kult der Apokalypse verbunden ist."
  STR_UAC_LIGHT_PLASMA_GUN_UFOPEDIA: "Diese arkane Waffe verschiesst Plasmabolzen. Die ungestueme Natur ihrer Energiequelle macht sie schwer zu kontrollieren, doch ein aussergewoehnlich starker Geist kann sie in eine besonders toedliche Waffe verwandeln."
  STR_UAC_MANAGER: "VAST-Manager"
  STR_UAC_MANAGER_ARMOR: "Kampfanalyse: VAST-Manager"
  STR_UAC_MANAGER_CORPSE: "Leiche eines VAST-Managers"
  STR_UAC_MANAGER_UFOPEDIA: "Diese Manager der mittleren Ebene koordinieren den taeglichen Betrieb von VAST, darunter viele rechtlich und moralisch zweifelhafte Geschaefte. Wie viel sie ueber solche Vorgange wissen, schwankt erheblich; selbst vergleichsweise gut informierte Personen sind ueber Unternehmensprojekte im Unklaren, an denen sie nicht unmittelbar beteiligt waren. Das zeigt, wie streng VAST seinen Informationsfluss kontrolliert. Dennoch sind diese Manager fuer unsere Ermittlungen gegen VAST von grosser Bedeutung und sollten nach Moeglichkeit immer verhoert werden - selbst dann, wenn sie sich der Festnahme widersetzen. Eigentlich gerade dann."
  STR_UAC_MASTER_RESEARCHER: "Leitender VAST-Forscher"
  STR_UAC_MASTER_RESEARCHER_ARMOR: "Kampfanalyse: Leitender VAST-Forscher"
  STR_UAC_MASTER_RESEARCHER_CORPSE: "Leiche eines leitenden VAST-Forschers"
  STR_UAC_MASTER_RESEARCHER_UFOPEDIA: "Diese brillantesten und skrupellosesten Koepfe auf der Gehaltsliste von VAST leiten experimentelle Projekte zu aeusserst ungewoehnlicher Physik, fremden Dimensionen und psionischen Erscheinungen. Diese selbsternannten Herren der Technokratie herrschen mit beinahe vollstaendiger Autonomie ueber ihre wissenschaftlichen Lehen und stellen Fortschritt konsequent ueber Sicherheit und Ethik."
  STR_UAC_MILITARY: "VAST-Sicherheitssoeldner"
  STR_UAC_MILITARY_ARMOR: "Kampfanalyse: VAST-Sicherheitssoeldner"
  STR_UAC_MILITARY_CORPSE: "Leiche eines VAST-Sicherheitssoeldners"
  STR_UAC_MILITARY_UFOPEDIA: "Formal gesehen sind diese Personen Soeldner, entweder unabhaengig taetig oder an kleine Sicherheitsfirmen gebunden. In der Praxis arbeiten sie eng mit VAST zusammen, das oft ihr einziger Auftraggeber ist. Sie sind sehr gut ausgebildet und ausgeruestet und sollten selbst dann nicht unterschaetzt werden, wenn wir ihnen aeusserlich ueberlegen erscheinen."
  STR_UAC_MOON_BASE_DESTROYED: "VAST-Mondbasis zerstoert"
  STR_UAC_MOON_BASE_DESTROYED_UFOPEDIA: "Durch die Eingabe der richtigen Sequenz loesen wir aus der Ferne die Selbstzerstoerung der VAST-Mondbasis aus. Die verbliebene Besatzung kann den Vorgang nicht mehr aufhalten und flieht groesstenteils an die Oberflaeche, nur um dort von VAST-Sicherheitskraeften in Gewahrsam genommen zu werden. Kurz darauf wird der gesamte Komplex durch eine gewaltige unterirdische Explosion vernichtet.{NEWLINE}Wir werden nie erfahren, welche dunklen Schaetze bei diesem Vorfall verloren gingen. Entscheidend ist, dass das Programm beendet wurde und VAST wieder unter die Kontrolle des Rates geraten ist. Was auch immer die Zukunft bringen mag - wir muessen uns um ein chaotisches Element weniger sorgen. Auch der Rat scheint zufrieden zu sein."
  STR_UAC_MOON_BASE_DIMENSIONAL_PORTAL: "VAST-Mondbasis: Dimensionsportal"
  STR_UAC_MOON_BASE_DIMENSIONAL_PORTAL_BRIEFING: "Sie naehern sich dem Hauptlabor, tief unter der Oberflaeche verborgen. Doch ploetzlich erwacht die arkane Maschinerie zum Leben und reisst einen voruebergehenden Dimensionsspalt auf. Aus ihm stroemt eine Horde Daemonen in die Anlage! Besiegen Sie diesen Feind und bringen Sie das Portal unter Kontrolle, um VAST endlich von diesem feindlichen Einfluss zu reinigen. Solange nicht alle Daemonen vernichtet sind, werden weitere in unsere Welt eindringen!{NEWLINE}Alternativ koennen Sie in der Naehe des Eingangs ein VAST-Codebuch finden und anschliessend evakuieren (Mission abbrechen). Bringen Sie es zur Basis und erforschen Sie es; dadurch wird die Selbstzerstoerung der Anlage eingeleitet. Sie koennen den Fall so ebenfalls abschliessen, werden dabei aber einige Erkenntnisse verpassen."
  STR_UAC_OFFICE: "VAST-Buero"
  STR_UAC_OFFICE_BRIEFING: "Unsere Ermittlungen tragen Fruechte: Wir haben ein VAST-Gebaeude lokalisiert, das mit bekannten illegalen Aktivitaeten in Verbindung steht. Wir muessen das Gebaeude betreten, seine Sicherheit umgehen oder ueberwaeltigen und den leitenden Manager festnehmen. Das ist die einzige Prioritaet dieser Mission. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_UAC_OFFICE_DESCRIPTION: "Unsere Ermittlungen tragen Fruechte: Wir haben ein VAST-Gebaeude lokalisiert, das mit bekannten illegalen Aktivitaeten in Verbindung steht. Wir muessen das Gebaeude verkleidet betreten, seine Sicherheit umgehen oder ueberwaeltigen und den leitenden Manager festnehmen."
  STR_UAC_OUTSOURCING: "VAST-Auslagerung"
  STR_UAC_OUTSOURCING_PREQ: "Voraussetzung: VAST-Auslagerung"
  STR_UAC_OUTSOURCING_UFOPEDIA: "Die Herstellung bestimmter fortschrittlicher luft- und raumfahrttechnischer Ausruestung ist fuer uns angesichts begrenzter Flaechen und Ressourcen problematisch. Unsere neue Sondervereinbarung mit VAST erlaubt es uns, solche Systeme in ihren Fabriken fertigen zu lassen - auf Grundlage von Blaupausen, die wir selbst entwickelt haben. X-Com bleibt alleiniger Eigentumer dieser Entwuerfe, sodass wir VAST nur Materialkosten, Arbeitszeit des Personals und natuerlich eine 'kleine Gebuehr' bezahlen."
  STR_UAC_PERPLEXING_MESSAGE: "Verblueffende Nachricht"
  STR_UAC_PERPLEXING_MESSAGE_DESCRIPTION: "Kommandant, was unsere geheime VAST-Operation angeht: Offenbar haben wir bereits etwas in Bewegung gesetzt, im Guten wie im Schlechten. Wir haben einen Typen kontaktiert, der einen Typen kannte, der wieder jemanden kannte, und eins fuehrte zum anderen ... Entscheidend ist aber, dass wir eine unerwartete und ziemlich aufschlussreiche Nachricht von einem wichtigen VAST-Mitarbeiter erhalten haben. Die Person hat ihre Identitaet nicht preisgegeben und wirkt ziemlich paranoid, aber auch verzweifelt. Vielleicht lesen Sie den Brief lieber selbst."
  STR_UAC_PISTOL_AA_CLIP: "VAST-Pistolen-Tritaniummagazin"
  STR_UAC_PISTOL_AA_CLIP_MANUFACTURING: "Herstellung von VAST-Pistolen-Tritaniummagazinen"
  STR_UAC_PISTOL_AA_CLIP_XXX: "VAST-Pistolen-Tritaniummagazin (x6)"
  STR_UAC_PISTOL_BUY: "VAST-Pistole - Beschaffung"
  STR_UAC_PISTOL_UFOPEDIA: "Die VAST-Pistole ist eine durchschlagskraeftige Seitenwaffe, die fuer den Einsatz im Weltraum entwickelt wurde. Sie verschiesst drei Geschosse in schneller Folge."
  STR_UAC_PLASMA_RIFLE: "VAST-Plasmagewehr"
  STR_UAC_PLASMA_RIFLE_BUY: "VAST-Plasmagewehr - Beschaffung"
  STR_UAC_PLASMA_RIFLE_CLIP: "VAST-Plasmagewehr-Batterie"
  STR_UAC_PLASMA_RIFLE_CLIP_UFOPEDIA: "Ein Energiepaket fuer das VAST-Plasmagewehr. Seine Energie - unter der Bezeichnung 'Hoellenessenz' - beruht auf extrem maechtiger psionischer Kraft aus der Hoelle, einer immateriellen Ebene daemonischer Wesen, die mit dem Kult der Apokalypse verbunden ist."
  STR_UAC_PLASMA_RIFLE_UFOPEDIA: "Diese Plasmawaffe bezieht ihre Energie aus Batterien mit 'Hoellenessenz'. Sie verlangt erhebliche geistige Staerke von ihrem Benutzer, und ungeeignete Anwender scheinen deutlich haeufiger Unfaelle zu erleiden, als es statistisch zu erwarten waere."
  STR_UAC_RESOLVED: "VAST-Fall geloest"
  STR_UAC_RIFLE_AA_CLIP: "VAST-Gewehr-Tritaniummagazin"
  STR_UAC_RIFLE_AA_CLIP_MANUFACTURING: "Herstellung von VAST-Gewehr-Tritaniummagazinen"
  STR_UAC_RIFLE_AA_CLIP_XXX: "VAST-Gewehr-Tritaniummagazin (x5)"
  STR_UAC_RIFLE_BUY: "VAST-Gewehr - Beschaffung"
  STR_UAC_RIFLE_UFOPEDIA: "Das VAST-Gewehr verschiesst drei Geschosse in schneller Folge und erlaubt dadurch eine sehr praezise Feuerkontrolle. Wie jede VAST-Ausruestung ist es fuer den Einsatz im Weltraum geeignet."
  STR_UAC_ROCKET_LAUNCHER_BUY: "VAST-Raketenwerfer - Beschaffung"
  STR_UAC_ROCKET_LAUNCHER_CLIP: "VAST-Raketenwerfermagazin"
  STR_UAC_ROCKET_LAUNCHER_UFOPEDIA: "Ein kompakter Werfer fuer leichte Raketenmunition. Er ist mit einem Fuenf-Schuss-Magazin ausgestattet."
  STR_UAC_SHOTGUN_AA_SHELLS: "VAST-Tritanium-Schrotpatronen"
  STR_UAC_SHOTGUN_AA_SHELLS_MANUFACTURING: "Herstellung von VAST-Tritanium-Schrotpatronen"
  STR_UAC_SHOTGUN_AA_SHELLS_XXX: "VAST-Tritanium-Schrotpatronen (x5)"
  STR_UAC_SHOTGUN_BUY: "VAST-Schrotflinte - Beschaffung"
  STR_UAC_SHOTGUN_UFOPEDIA: "Diese schwere Schrotflinte wurde entwickelt, um leicht gepanzerte Ziele auszuschalten. Auch im Weltraum arbeitet sie zuverlaessig."
  STR_UAC_SMG: "VAST-MPi"
  STR_UAC_SMG_AA_CLIP: "VAST-MPi-Tritaniummagazin"
  STR_UAC_SMG_AA_CLIP_MANUFACTURING: "Herstellung von VAST-MPi-Tritaniummagazinen"
  STR_UAC_SMG_AA_CLIP_XXX: "VAST-MPi-Tritaniummagazin (x7)"
  STR_UAC_SMG_BUY: "VAST-MPi - Beschaffung"
  STR_UAC_SMG_CLIP: "VAST-MPi-Magazin"
  STR_UAC_SMG_UFOPEDIA: "Eine fortschrittliche Maschinenpistole fuer ausgebildete Spezialisten. Sie wurde fuer den Einsatz im Weltraum entwickelt."
  STR_UAC_SPACE_LAB_SURFACE: "VAST-Raumfahrtlabor"
  STR_UAC_SPACE_LAB_SURFACE_BRIEFING: "Wir haben erfolgreich eine geheime VAST-Einrichtung lokalisiert, in der illegale Forschung zur Kriegsfuehrung im Weltraum betrieben wird. Wir muessen die Anlage infiltrieren und bis zum grossen Aufzug vordringen, der in einen unterirdischen Forschungskomplex fuehrt. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_UAC_SPACE_LAB_SURFACE_DESCRIPTION: "Wir haben erfolgreich eine geheime VAST-Einrichtung lokalisiert, in der illegale Forschung zur Kriegsfuehrung im Weltraum betrieben wird. Der Rat will wissen, was dort verborgen wird. Unsere Foerderer wollen, dass wir die Anlage angreifen und alle Daten sicherstellen, bevor ihre Konkurrenz die Oberhand gewinnt. Und da unser Auftrag darin besteht, die Erde vor verborgenen Bedrohungen zu schuetzen und VAST offenbar mit dem Kult der Apokalypse kooperiert, haben wir ohnehin allen Grund, diese Sache nicht zu ignorieren."
  STR_UAC_SPACE_LAB_UNDERGROUND: "Unterirdisches VAST-Raumfahrtlabor"
  STR_UAC_SPACE_LAB_UNDERGROUND_BRIEFING: "Ihre Truppen haben den tief unter der Erde gelegenen Bereich des VAST-Raumfahrtlabors betreten. Stellen Sie sicher, dass der leitende Forscher lebend gefangen wird, und sichern Sie anschliessend den Standort, damit unsere Agenten alle Daten von den Servern herunterladen koennen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Ausgangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_UAC_SPACE_LAB_UNDERGROUND_TAKEN: "Unterirdisches VAST-Raumfahrtlabor eingenommen"
  STR_UAC_SPACE_MARINE: "VAST-Raumjaeger"
  STR_UAC_SPACE_MARINE_ARMOR: "Kampfanalyse: VAST-Raumjaeger"
  STR_UAC_SPACE_MARINE_CORPSE: "Leiche eines VAST-Raumjaegers"
  STR_UAC_SPACE_MARINE_UFOPEDIA: "Diese koerperlich und mental beeindruckenden Personen wurden sorgfaeltig fuer den Krieg im Weltraum ausgewaehlt und intensiv ausgebildet. Offenbar hat VAST sehr ambitionierte Plaene fuer die Zukunft und moechte fuer alles geruestet sein. Der Gefangene sprach von Orbital-Landeuebungen, an denen er teilnahm, und von fortgeschrittenen Raumfahrzeugen, die VAST angeblich regelmaessig einsetzt. Viel mehr liess sich allerdings nicht aus ihm herausbekommen."
  STR_UAC_STAPLER: "VAST-Tacker"
  STR_UAC_STAPLER_BUY: "VAST-Tacker - Beschaffung"
  STR_UAC_STAPLER_CLIP: "VAST-Tackerklammern"
  STR_UAC_STAPLER_UFOPEDIA: "Ein Werkzeug aus dem Hause VAST. Laut Hersteller funktioniert es in jeder Umgebung, einschliesslich des Weltraums. Im Notfall kann es wie eine Pistole verwendet werden. Seine Reichweite ist sehr begrenzt, doch im Nahkampf ist es erstaunlich wirksam - sofern man die noetige Chuzpe mitbringt."
  STR_UAC_THE_UAC_WAR_IS_OVER_1_DESCRIPTION: "Kommandant, Sie haben VAST und dem ganzen Planeten einen grossen Dienst erwiesen. Nachdem dieses verfluchte Labor abgebrannt war, liessen die Geldgeber meiner Feinde das Projekt rasch fallen. Das gab meinem Team die Gelegenheit, die Verraeter zu verhaften und ... sich um sie zu kuemmern. Nun versuchen wir, ihre Verbindungen zum Rat aufzudecken, was sich allerdings als schwierig erweist.{NEWLINE}Leider haben wir keine besondere Technologie mehr, die wir Ihnen als Zeichen unserer Dankbarkeit ueberlassen koennten. Nehmen Sie daher bitte einige uebrig gebliebene Batterien an - wenn jemand ausserhalb von VAST sie haben sollte, dann Ihre Organisation."
  STR_UAC_THE_UAC_WAR_IS_OVER_2_DESCRIPTION: "Kommandant, Sie haben VAST und dem ganzen Planeten einen grossen Dienst erwiesen. Ihr Team ist ueber das Ziel hinausgegangen und hat diese verfluchte Einrichtung gesichert, sodass wir sie gruendlich untersuchen und mit den Verraetern abrechnen koennen. Wir versuchen nun, ihre Verbindungen zum Rat aufzudecken, was sich allerdings als schwierig erweist.{NEWLINE}Das Labor enthielt eine beachtliche Menge experimenteller militaerischer Ausruestung, die ich Ihnen bereitwillig ueberlasse. Billig ist sie nicht, aber Sie werden sie sonst nirgendwo bekommen. Wenn jemand ausserhalb von VAST darauf Zugriff haben sollte, dann Ihre Organisation."
  STR_UAC_TURNING_POINT_DESCRIPTION: "Kommandant, raten Sie mal, wer uns geschrieben hat. Genau: unser kleiner Freund bei VAST. Ich frage mich, was drinsteht. Nein, ich habe ihn diesmal wirklich nicht vorher gelesen - ich wollte Ihnen die Ehre ueberlassen."
  STR_UAC_TURRET: "VAST-Geschuetzturm"
  STR_UAC_TURRET_ARMOR: "Kampfanalyse: VAST-Geschuetzturm"
  STR_UAC_TURRET_CORPSE: "Wrack eines VAST-Geschuetzturms"
  STR_UAC_TURRET_UFOPEDIA: "Eine stationaere Plasmawaffe, die von VAST zum Schutz ihrer ausserirdischen Aussenposten eingesetzt wird."
  STR_UAC_TURRET_WEAPON: "Waffe eines VAST-Geschuetzturms"
  STR_UAC_UNDERGROUND_WEAPON_DISTRIBUTION: "Illegale VAST-Waffenverteilung"
  STR_UAC_UNDERGROUND_WEAPON_DISTRIBUTION_UFOPEDIA: "Da der VAST-Konzern Verbindungen zu BlackOps hat, gingen wir zunaechst davon aus, dass dieselbe Organisation auch VAST kontrolliert. Unsere Ermittlungen im Umfeld der BlackOps haben jedoch ergeben, dass dem nicht so ist: VAST steht nicht unter der Kontrolle des Syndikats.{NEWLINE}Dennoch bleibt VAST hochgradig verdaechtig, denn ihre experimentellen Handfeuerwaffen, die angeblich fuer kuenftige Weltraumtruppen entwickelt wurden, tauchen regelmaessig in den Haenden ganz bestimmter krimineller Gruppen auf. Diese Regelmaessigkeit, kombiniert mit ihrer geringen Verbreitung auf dem allgemeinen Schwarzmarkt, deutet darauf hin, dass die Verteilung zumindest mit Billigung des Herstellers erfolgt.{NEWLINE}Unsere Quellen im Rat aeussern sich in dieser Angelegenheit ungewoehnlich vage, haben uns aber keineswegs davon abgeraten, der Spur weiter nachzugehen - wenn Sie verstehen, was ich meine."
  STR_UAC_WEAPON_BOX: "VAST-Waffenkiste"
  STR_UAC_WEAPON_BOX_OPENING: "VAST-Waffenkiste oeffnen"
  STR_UAC_WEAPON_BOX_UFOPEDIA: "Eine verstaerkte Transportkiste fuer die sichere Lagerung und Beforderung von Feuerwaffen. Sie traegt ein kleines VAST-Logo."
  STR_UAC_WEAPON_DELIVERY: "VAST-Waffenlieferung"
  STR_UAC_WEAPON_DELIVERY_BRIEFING: "VAST-Agenten liefern Waffen an eine lokale Zelle des Kults der Apokalypse. Wir werden uns als Hoehlenmenschen ausgeben und am Einsatzort erscheinen, bevor die eigentlichen Gangmitglieder eintreffen. Unser Ziel ist es, die Lieferung abzufangen und Beweise fuer die illegalen Aktivitaeten von VAST zu sichern. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_UAC_WEAPON_DELIVERY_DESCRIPTION: "VAST-Agenten liefern Waffen an eine lokale Zelle des Kults der Apokalypse. Wir werden uns als Hoehlenmenschen ausgeben und am Einsatzort erscheinen, bevor die eigentlichen Gangmitglieder eintreffen. Unser Ziel ist es, die Lieferung abzufangen und Beweise fuer die illegalen Aktivitaeten von VAST zu sichern.{NEWLINE}Nur verdeckbare Gegenstaende und zivile Kleidung erlaubt!"
  STR_UAC_WEAPON_LAB: "VAST-Waffenlabor"
  STR_UAC_WEAPON_LAB_BRIEFING: "Wir haben einen VAST-Standort fuer Forschung und Entwicklung lokalisiert, an dem experimentelle Waffen hergestellt werden. Wir sollten das Personal festnehmen und verhoeren. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_UAC_WEAPON_LAB_DESCRIPTION: "Wir haben einen VAST-Standort fuer Forschung und Entwicklung lokalisiert, an dem experimentelle Waffen hergestellt werden. Wir sollten das Personal festnehmen und verhoeren."
  STR_UCITY_BRIEFING: "Wir haben die Unterseestadt infiltriert. Unser Ziel ist es, einen hochrangigen Aquatoid aufzuspuren, festzunehmen und zur Tauchkapsel zurueckzubringen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zur Tauchkapsel zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_UCITY_DESCRIPTION: "Hier liegt die grosse Unterseestadt, bewohnt von Deep Ones und Aquatoids. Unser Ziel ist es, einen hochrangigen Aquatoid aufzuspuren und gefangen zu nehmen.{NEWLINE}Denken Sie daran, dass Menschen unter Wasser nur eingeschraenkt sehen und sich bewegen koennen.{NEWLINE}Nur unterwasserfaehige Ausruestung erlaubt!"
  STR_UCITY_UFOPEDIA: "{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}Offenbar leben nicht alle Deep Ones in nomadischen Gemeinschaften: Einige bewohnen tiefe Unterwasserkomplexe, die Rohstoffe fuer 'Dagon' foerdern. Diese Deep Ones wirken zivilisierter und stehen unter der Aufsicht von Aquatoids.{NEWLINE}{NEWLINE}Das koennte ein ausgezeichneter Ort sein, um einen hochrangigen Aquatoid fuer ein Verhoer zu fassen. Vielleicht bringt uns das etwas Licht in die Plaene dieser seltsamen Wesen.{NEWLINE}{NEWLINE}Und ehrlich gesagt muessen wir nicht ewig nur ihre Lieferungen ueberfallen. Wir koennen endlich direkt gegen ihre Stadt vorgehen."
  STR_UFO_FRAME: "UFO-Huellenrahmen"
  STR_UFO_NAVIGATION_DISASSEMBLY: "D/A: UFO-Navigation"
  STR_UFO_POWER_SOURCE_DISASSEMBLY: "D/A: UFO-Energiequelle"
  STR_UNARMED_ALENHEAD: "Unbewaffneter Angriff (Alenhead)"
  STR_UNARMED_DEEP_ONE: "Unbewaffneter Angriff eines Deep One"
  STR_UNARMED_TASOTH: "Unbewaffneter Angriff eines Tasoth"
  STR_UNDERWATER_OPERATIONS_UFOPEDIA: "X-Com hat die Moglichkeit, Unterwassermissionen durchzufuhren, falls notwendig. Im Falle einer solchen Mission erreichen Sie den Einsatzort mit normalen Transportmitteln. Ein spezielles X-Com 'Kalypso' U-Boot wird dort zur Verfugung stehen.{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}Bedenken Sie, dass die Kalypso nur 7 Agenten beherbergen kann; uberschussige Agenten mussen den Einsatz aussitzen. {NEWLINE}Achtung: alle Hunde auf diesen Missionen werden ertrinken!"
  STR_USO_CRUISER_FRAME: "Huellenrahmen: T'leth-Kreuzer"
  STR_USO_CRUISER_UFOPEDIA: "Der T'leth-Kreuzer ist ein Mehrzweckfahrzeug und das Rueckgrat der Alienflotte. Er wird fuer alle Arten von Missionen eingesetzt und ist ein gefaehrlicher Gegner."
  STR_USO_ESCORT_FRAME: "Huellenrahmen: T'leth-Eskorte"
  STR_USO_ESCORT_UFOPEDIA: "Ein mittelgrosses Begleitschiff, das fuer sich allein nur eine begrenzte Gefahr darstellt. Dieses Fahrzeug geht groesseren Schiffen und anschliessend verstaerkter Aktivitaet voraus."
  STR_USO_FLEET_CRUISER: "T'leth-Flottenversorgungskreuzer"
  STR_USO_FLEET_CRUISER_FRAME: "Huellenrahmen: T'leth-Flottenversorgungskreuzer"
  STR_USO_FLEET_CRUISER_UFOPEDIA: "Dieses Versorgungsschiff wird beim Bau von Alienkolonien oder zur Versorgung bestehender Kolonien verwendet. Es transportiert Alien-Naehrstoffe, DNS, Foeten und andere biologische Komponenten."
  STR_USO_HEAVY_CRUISER: "Schwerer T'leth-Kreuzer"
  STR_USO_HEAVY_CRUISER_FRAME: "Huellenrahmen: Schwerer T'leth-Kreuzer"
  STR_USO_HEAVY_CRUISER_UFOPEDIA: "Der Schwere Kreuzer ist maechtiger als der normale Kreuzer; groessere Waffen- und Antriebssysteme steigern seine Kampfkraft. Er wird fuer Ressourcenmissionen genutzt, um grosse Mengen an Mineralien und Ausruestung zu transportieren."
  STR_USO_SURVEY_SHIP_FRAME: "Huellenrahmen: T'leth-Aufklaerer"
  STR_USO_SURVEY_SHIP_UFOPEDIA: "Dieses winzige U-Boot wird fuer Aufklaerungs- und Vermessungsmissionen eingesetzt. In der Regel geht es groesseren Schiffen zu Beginn einer Alien-Einsatzgruppe voraus."
  STR_USTATION_BRIEFING: "Ihr Schiff hat die ausserirdische Raumstation erreicht. Um den Invasoren Paroli zu bieten, muessen wir diese Orbitalanlage stuermen und einen mit orangefarbenen Bodenfeldern markierten Ausgangsbereich erreichen. Um die Mission abzubrechen, fuehren Sie die X-Com-Kraefte in das Transportfahrzeug zurueck und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_USTATION_DESCRIPTION: "Das Zeitfenster, um die ausserirdische Raumstation zu erreichen, ist jetzt offen. Um die Invasoren zurueckzuschlagen, muessen wir diese Orbitalanlage stuermen und eines der einzigartigen Wesen fassen, die dort das Kommando haben.{NEWLINE}ACHTUNG: Dies ist eine Raummission. Stellen Sie sicher, dass nur raumtaugliche und fuer Schwerelosigkeit geeignete Ruestungen getragen werden. Ungeeignete Ausruestung wird automatisch durch einen Standard-Raumanzug ersetzt."
  STR_USTATION_INSIDE_BRIEFING: "Der Sturm auf die ausserirdische Raumstation verlaeuft planmaessig. Unser Ziel ist es, Ueberreste eines lebenden ausserirdischen Netzwerkknotens zu bergen. Sein gewaltiger Hauptkoerper nimmt einen grossen Teil der Station ein, daher koennen Sie sichtbare Abschnitte ohne Zoegern zerstoeren. Der Einsatz gilt als erfolgreich, wenn alle Feinde ausgeschaltet sind oder wenn Sie die 'Leiche' des sichtbaren Abschnitts bergen. Um die Mission abzubrechen, fuehren Sie die X-Com-Kraefte in den Ausgangsbereich und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_VAMPIRE_CASTLE_BRIEFING: "Zombies haben hier eine monumentale Hoehlenfestung errichtet. Raeumen Sie diese Brutstaette aus, um die Bedrohung fuer die Oberwelt zu beenden. Ihr Hauptziel bleibt jedoch, die schreckliche Herrscherin lebend fuer ein Verhoer in unsere Gewalt zu bringen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Ausgangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_VAMPIRE_CASTLE_DESCRIPTION: "Zombies haben hier eine monumentale Hoehlenfestung errichtet. Raeumen Sie diese Brutstaette aus, um die Bedrohung fuer die Oberwelt zu beenden. Ihr Hauptziel bleibt jedoch, die schreckliche Herrscherin lebend fuer ein Verhoer in unsere Gewalt zu bringen. Rechnen Sie mit einer sehr grossen Zahl von Zombies unterschiedlichster Typen."
  STR_VAMPIRE_KNIGHT_ARMOR: "Kampfanalyse: Vampirritter"
  STR_VAMPIRE_KNIGHT_AUTOPSY: "Autopsie: Vampirritter"
  STR_VAMPIRE_KNIGHT_AUTOPSY_UFOPEDIA: "Dieser Zombie wirkt aeusserlich sehr menschlich. Seine innere Chemie unterscheidet sich jedoch vollkommen von der frueherer Entwicklungsstufen: Die Zellenergie liegt jenseits normaler Skalen, waehrend kaum echter Stoffwechsel stattfindet. Gleichzeitig enthaelt das Blut nur sehr wenig nutzbare Energie. Das bedeutet, dass Vampire die hyperenergetische Chemikalie frueherer Formen gar nicht mehr im selben Sinn verwenden. Fangzaehne gibt es uebrigens keine; stattdessen koennen parasitaere Organe aus dem Mund des Vampirs hervortreten, um gefangene Menschen anzuzapfen."
  STR_VAMPIRE_KNIGHT_CORPSE: "Leiche eines Vampirritters"
  STR_VAMPIRE_KNIGHT_UFOPEDIA: "Diese Zombieform ist vernunftbegabt und recht intelligent, wenn auch mit begrenztem Verstaendnis fuer Menschen. Dank ihrer uebernatuerlichen Physiologie gewinnt sie Energie direkt aus dem Planeten selbst, in verschiedensten Formen; den Rest bezieht sie waehrend des Winterschlafs aus dem Boden oder durch das Aussaugen anderer Organismen. Sie ist deutlich proaktiver und neugieriger als fruehere Formen. Sie verfuegt ueber gute soziale Faehigkeiten, pflegt Beziehungen zu anderen Zombies hoher Stufe und kommandiert niedere Zombies mittels grosser empathischer Macht."
  STR_VAMPIRE_QUEEN: "Vampirkoenigin"
  STR_VAMPIRE_QUEEN_ARMOR: "Kampfanalyse: Vampirkoenigin"
  STR_VAMPIRE_QUEEN_ARMOR_UFOPEDIA: "Vampirkoeniginnen koennen das Blut ihrer Feinde absorbieren, um sich selbst zu heilen und zu staerken."
  STR_VAMPIRE_QUEEN_AUTOPSY: "Autopsie: Vampirkoenigin"
  STR_VAMPIRE_QUEEN_AUTOPSY_UFOPEDIA: "Dieses Exemplar ist biologisch beinahe identisch mit dem Vampirritter, abgesehen von geringerer Muskelmasse und einem leicht besser entwickelten Gehirn - insbesondere in jenen Strukturen, die vermutlich mit Psionik zusammenhaengen."
  STR_VAMPIRE_QUEEN_COMMANDER: "Vampirkoenigin"
  STR_VAMPIRE_QUEEN_CORPSE: "Leiche einer Vampirkoenigin"
  STR_VAMPIRE_QUEEN_UFOPEDIA: "Die Vampirkoenigin tritt meist in groesseren Vampirgruppen auf. Ihre Stellung ist zum Teil ein soziales Konstrukt, da Vampire zu hierarchischen Beziehungen neigen, doch ihre Autoritaet wird durch psionische und chemische Kontrolle ueber ihre Untergebenen abgesichert. Sie ist hochintelligent und verfuegt ueber ein starkes Selbstbewusstsein. Mit ihrer Faehigkeit, grosse Gruppen zu kommandieren, und ihrer eigenen Macht ist die Vampirkoenigin ein toedlicher Feind - oder eine faszinierende Gespraechspartnerin."
  STR_VON_HAGEN_REFUGE: "Von Hagens Zuflucht"
  STR_VON_HAGEN_REFUGE_BRIEFING: "Ihre Aufgabe besteht darin, eine unterirdische Festung zu stuermen und zu sichern, die Siegfried von Hagen als Hochburg dient. Die Stellung ist schwer befestigt, daher muessen Sie die Zombiekraefte ausschalten, das Gebiet unter Kontrolle bringen und den Anfuehrer beseitigen oder gefangen nehmen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Ausgangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_VON_HAGEN_REFUGE_DESCRIPTION: "Dies ist eine unterirdische Festung, von der aus Siegfried von Hagen seine persoenlichen Zombiekraefte aussendet, um die Bevoelkerung zu terrorisieren. Sie ist stark befestigt und wird von zahlreichen Zombies verteidigt - ganz zu schweigen von Siegfried von Hagen selbst. Wenn wir Erfolg haben, wird dieser Ort eine unschaetzbare Quelle von Erkenntnissen ueber die Zombies sein.{NEWLINE}Angesichts Von Hagens unnatuerlich langen Aktivitaetsdauer gilt: Wenn wir ihn diesmal nicht festsetzen, bekommen wir vermutlich nie wieder eine Chance."
  STR_WEREWOLF_ARMOR: "Kampfanalyse: Werwolf"
  STR_WEREWOLF_AUTOPSY: "Autopsie: Werwolf"
  STR_WEREWOLF_AUTOPSY_UFOPEDIA: "Werwoelfe tragen sowohl menschliche als auch canide DNA, kombiniert auf eine Weise, die der Wissenschaft bislang unbekannt ist. Sie verfuegen ueber stark ausgepraegte Muskulatur, Zaehne und Klauen. Das grosse Gehirn spricht fuer gute Sinne und eine beachtliche Intelligenz."
  STR_WEREWOLF_CORPSE: "Leiche eines Werwolfs"
  STR_WEREWOLF_PSI_PANIC_WEAPON: "Blick des Schreckens"
  STR_WEREWOLF_PSI_PANIC_WEAPON_UFOPEDIA: "Alpha-Werwoelfe geniessen unter ihresgleichen uebernatuerlichen Respekt und koennen auch ihren Opfern Furcht einjagen. Hueten Sie sich vor diesem Schreckensblick."
  STR_WEREWOLF_UFOPEDIA: "Wie sein legendaerer Namensvetter ist dieses Wesen ein Humanoid mit wolfsartigen Merkmalen. Es ist extrem muskuloes und hochaggressiv, besitzt eine beinahe affenartige Intelligenz und ausgepraegte Raeuberinstinkte. Befehlen folgt es nur widerwillig und begegnet unserem Personal lieber mit offener Feindseligkeit, selbst wenn es hungrig ist oder unter Schmerzen steht. Seine Gene deuten auf ein vollstaendig kuenstliches Design hin."
  STR_WEREWOLF_WHITE: "Alpha-Werwolf"
  STR_WEREWOLF_WHITE_ARMOR: "Kampfanalyse: Alpha-Werwolf"
  STR_WEREWOLF_WHITE_CORPSE: "Leiche eines Alpha-Werwolfs"
  STR_WEREWOLF_WHITE_LEADER: "Alpha-Werwolf"
  STR_WEREWOLF_WHITE_UFOPEDIA: "Diese Werwoelfe sind groesser und staerker als ihre gewoehnlichen Artgenossen. Offenbar koennen sie anderen Werwoelfen ihren Willen aufzwingen, moeglicherweise ueber eine psi-aehnliche Form der Dominanz. Bekannt ist ausserdem, dass sie Menschen mit psionisch projizierter Angst lahmen koennen."
  STR_WESTMAN: "Westman"
  STR_WESTMAN_ARMOR: "Kampfanalyse: Westman"
  STR_WESTMEN_INFORMANT: "Westmen-Informant"
  STR_WESTMEN_TAVERN_EXTRACTION_BRIEFING: "Wir sind am Treffpunkt angelangt, aber unser Kontakt wurde aufgedeckt und seine Kameraden wollen ihn toten. Im Moment ist er im Obergeschoss und versucht zu entkommen. Schutzen und extrahieren sie ihn. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_WESTMEN_TAVERN_INVESTIGATION_BRIEFING: "Etwas ist schiefgelaufen: unser Kontakt ist nirgends zu sehen, und die Einheimischen scheinen aufgeregt. Wenn wir jetzt auftauchen, werden sie uns sicherlich erkennen und Widerstand leisten. Wenn wir wollen, konnen wir die Situation noch retten indem wir ein paar Gefangene nehmen und befragen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_WESTMEN_TAVERN_MIB_TRAP_BRIEFING: "Zu spaet. Der Informant wurde bereits von den Men in Black ausgeschaltet, die uns einen Hinterhalt gelegt haben. Vielleicht koennen wir diese Gelegenheit nutzen, um mehr ueber diese ominoese Organisation zu erfahren, wenn es uns gelingt, Gefangene zu machen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_WESTMEN_TAVERN_PICKUP_BRIEFING: "Wir sind am Treffpunkt angelangt. Alles scheint nach Plan zu laufen. Vorsicht, dieser Kerl ist nervos - erschieen Sie einander nicht! Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an, aber warum sollten Sie das tun..."
  STR_WESTMEN_TAVERN_RAID_BRIEFING: "Das Treffen war eine Falle! Die Einheimischen gehen mit Waffen auf unseren Agenten los. Wir konnen die Situation noch retten indem wir ein paar Gefangene nehmen und befragen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_WETWARE_JOB_DESCRIPTION: "Jemand hat Staatsgeheimnisse im Internet verbreitet. Der Rat konnte die Person zwar festsetzen, aber nicht bevor bereits gefaehrliche Informationen nach aussen gelangten. Noch besorgniserregender ist allerdings, wie sie ueberhaupt an diese Daten gekommen ist. Der Rat verweigert jede weitere Stellungnahme.{NEWLINE}[-150 Punkte, Gedankensonde x1 erhalten]"
  STR_WHAT_DO_NOW_MILESTONE_0: "X-Com GIB: Allgemeine Strategie"
  STR_WHAT_DO_NOW_MILESTONE_0_UFOPEDIA: "Als ersten Schritt muessen wir unsere Position absichern, denn die UN nimmt uns bislang nicht besonders ernst. Wir sollten daher Beweise dafuer sammeln und vorlegen, dass Kraefte am Werk sind, die den Weltfrieden gefaehrden koennten.{NEWLINE}Das erste Problem, dem wir nachgehen muessen, ist der gleichzeitige Anstieg krimineller Organisationen und religioeser Sekten auf allen Kontinenten. Wir sollten mehr ueber sie in Erfahrung bringen, vorzugsweise indem wir ihre Mitglieder festnehmen und verhoeren. Das duerfte uns helfen, dieses gesellschaftliche Phaenomen besser zu verstehen und ihm Einhalt zu gebieten.{NEWLINE}Das zweite Problem ist vielleicht noch auffaelliger: Weltweit haeufen sich Berichte ueber seltsame Kreaturen, Monster und aehnliche Erscheinungen. Auch das muessen wir untersuchen. Wenn auch nur ein Koernchen Wahrheit daran ist, muessen wir eine solche Kreatur lebend fangen oder notfalls sezieren."
  STR_WHAT_DO_NOW_MILESTONE_1: "X-Com PAU: Allgemeine Strategie"
  STR_WHAT_DO_NOW_MILESTONE_1_UFOPEDIA: "Kommandant, unsere bisherigen Bemuehungen zahlen sich aus: Die UN ist eher bereit, uns Gehoer zu schenken. Das ist eine wichtige Chance, unsere Gegner zu untergraben, also muessen wir jetzt nachsetzen.{NEWLINE}Nach einigen Beratungen schlage ich vor, als naechsten Schritt unseren Stab vor Ort zu vergroessern. Erstens benoetigen wir einen echten Stabswissenschaftler, idealerweise mit Erfahrung in Biochemie und exotischer Physik. Zweitens brauchen wir, da wir es eindeutig mit ausserirdischer Intelligenz zu tun haben, einen professionellen Xenologen, der ihre Geheimnisse aufdeckt. Dann muessen wir unsere Kontakte ins Militaer vertiefen, um Zugang zu moderner Bewaffnung zu sichern. Und schliesslich brauchen wir einen Stabsingenieur, der sich um geborgene Artefakte kuemmert. Leider koennen wir diese Leute nicht einfach entfuehren; sie muessen aus eigenem Antrieb zu uns kommen. Deshalb sollten wir unsere Ermittlungen fortsetzen und hoffen, etwas zu finden, das interessant genug ist, um ihre Mitarbeit zu gewinnen."
  STR_WHAT_DO_NOW_MILESTONE_2: "X-Com PSA: Allgemeine Strategie"
  STR_WHAT_DO_NOW_MILESTONE_2_UFOPEDIA: "Kommandant, die UN ist von unseren Erkenntnissen zugleich beeindruckt und erschuettert. Wir sollten ihr noch mehr Beweise fuer eine ausserirdische Praesenz auf der Erde vorlegen, denn unsere Gegner werden nicht ruhen, bis wir aus dem Verkehr gezogen sind.{NEWLINE}Unser Ziel sollte nun sein, die Kultbedrohung zumindest teilweise einzudaemmen, indem wir in die obersten Ebenen mindestens einer dieser Organisationen eindringen und ihre wahren Ziele sowie Identitaeten aufdecken. Zugleich muessen wir mehr ueber die Aliens und ihre Herkunft herausfinden.{NEWLINE}Dafuer brauchen wir ausserdem ein fortschrittlicheres Labor mit besserer Ausruestung und mehr Forschungsplaetzen."
  STR_WHAT_DO_NOW_MILESTONE_3_UFOPEDIA: "Endlich, Kommandant, haben wir freie Hand im Umgang mit den Feinden der Erde. Wir sollten diese Gelegenheit zuerst nutzen, um unsere militaerischen Faehigkeiten weiter auszubauen, waehrend wir weiterhin auf Alarme reagieren. Anschliessend muessen wir alles ueber den Feind lernen, seine Technologie rueckentwickeln, alienhafte Spezialisten und Anfuehrer verhoeren und schliesslich eine Strategie fuer den Gegenangriff entwickeln. Zugleich duerfen wir den Feind im Inneren nicht vergessen - und jene Weltfuehrer, die X-Com selbst fuer einen Fehler halten. Wir muessen also auch in den Augen der UN gut dastehen.{NEWLINE}Nur wir koennen die Invasion aufhalten. Ich bin ueberzeugt, dass wir das gemeinsam schaffen."
  STR_WILD_PINK_CAVES_BRIEFING: "Die in Dimension X operierenden Kraefte des Rats bitten uns um Hilfe bei der Kartierung eines tief unter der Oberflaeche gelegenen Hoehlensystems. Diese Hoehlen zeichnen sich durch hohe Biodiversitaet aus und scheinen von den lokalen Kraeften der Dimension X nicht ueberwacht zu werden. Wir hoffen, Proben zu sammeln, fuer die wir sonst einen unerwuenschten Konflikt mit der lokalen Zivilisation riskieren muessten. Um die Mission abzubrechen, bringen Sie X-Com-Agenten zum Ausgangsbereich zurueck und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_WILD_PINK_CAVES_DESCRIPTION: "Die in Dimension X operierenden Kraefte des Rats bitten uns um Hilfe bei der Kartierung eines tief unter der Oberflaeche gelegenen Hoehlensystems. Diese Hoehlen zeichnen sich durch eine hohe Biodiversitaet aus. Der Rat glaubt, dass unsere Erfahrung dabei nuetzlich sein koennte.{NEWLINE}Wir koennen diesen Auftrag ohne Strafe ablehnen, doch wenn wir teilnehmen, tragen wir die Verantwortung fuer die Sicherheit der Exotrooper."
  STR_WIZKID_SMALL_TANK_ROCKET_LAUNCHER: "Wizkid-Raketendrohne"
  STR_WIZKID_SMALL_TANK_ROCKET_LAUNCHER_ARMOR: "Kampfanalyse: Wizkid-Raketendrohne"
  STR_WIZKID_SMALL_TANK_ROCKET_LAUNCHER_CORPSE: "Wrack einer Wizkid-Raketendrohne"
  STR_WIZKID_SMALL_TANK_ROCKET_LAUNCHER_UFOPEDIA: "Ein kleiner kettengetriebener Wachroboter, bewaffnet mit einem starken Raketenwerfer."
  STR_WIZKID_TURRET: "Wizkid-Geschuetzturm"
  STR_WIZKID_TURRET_ARMOR: "Kampfanalyse: Wizkid-Geschuetzturm"
  STR_WIZKID_TURRET_CORPSE: "Wrack eines Wizkid-Geschuetzturms"
  STR_WIZKID_TURRET_UFOPEDIA: "Eine billig produzierte automatische Sicherheitsmassnahme, die 5,56-mm-Projektile mit maessiger Praezision verschiesst."
  STR_WIZKID_TURRET_WEAPON: "Wizkid-Turmwaffe"
  STR_WRAITH_BY_THE_BAR_UFOPEDIA: "Eines Nachts betrat eine seltsame Gestalt einen Nachtclub. Sein - man nimmt an, dass es ein Mann war - ganzer Koerper war in graue Roben gehuellt, einschliesslich des Gesichts. Er war sehr gross, auffallend hager, sagte kein Wort und stellte sich lediglich in die Naehe der Bar. So verdaechtig er auch wirkte, niemand stellte seine Anwesenheit infrage oder reagierte ueberhaupt auf ihn. Etwa eine halbe Stunde lang stand der Gast nur da, beobachtete schweigend die anderen Besucher und verliess dann den Club. Erst in diesem Moment begriffen die Einheimischen, dass etwas mit ihrer eigenen Gleichgueltigkeit nicht stimmte, ohne es sich erklaeren zu koennen. Einige Tage spaeter kehrte er zurueck; der Ablauf war beinahe derselbe, nur dass er diesmal etwa zwei Stunden blieb und die Bar wie reglos musterte. Das wiederholte sich noch mehrere Male, und das Personal gewoehnte sich allmaehlich an seine stille Gegenwart. Doch bei einem dieser Besuche rollte kurz nach seinem Weggang eine Welle kalter, unnatuerlicher Angst ueber die Gegend. Zeugen berichteten von dunklen Gestalten in schwarzen Umhaengen, die ueber dem Ort schwebten. Aus der Umgebung der Bar waren zudem seltsame Geraeusche und gruene Lichtblitze zu sehen. Der geheimnisvolle Besucher wurde nie wieder gesehen."
  STR_WRAP_UP_DIMENSION_X_EXPLORATION_UFOPEDIA: "Unsere Arbeit in der Dimension X ist getan. Wir haben das Kybernetz abgewehrt und unbezahlbare Daten uber die Auerirdischen gesammelt. Nun ist es Zeit, heimzukehren.{NEWLINE}Ja, diese fremde Welt ist sehr interessant. Aber der Rat denkt, dass es zu fruh fur ernsthafte Erforschung ist. Auerdem... habe ich den Verdacht, dass sie bereits Zugang zu anderen Welten wie dieser haben. Also beginnen sie, die Basis endgultig zu evakuieren.{NEWLINE}Was auch immer ihre Grunde sind, sie sind sehr zufrieden mit unserer Leistung. Hoffen wir, dass uns dies in diesem sturmischen Meer aus Geheimnissen und Verrat uber Wasser halt."
  STR_WRECKED_BLACK_LOTUS_STORMCLOUD_DISASSEMBLY: "D/M: Black-Lotus-Stormcloud-Wrack"
  STR_WRECKED_CENTURION_DISASSEMBLY: "D/M: beschaedigter Cyberweb-Centurion"
  STR_WRECKED_ROBOSPHERE_DISASSEMBLY: "D/M: beschaedigte Cyberweb-Robosphere"
  STR_WRECKED_ROBOTURRET_DISASSEMBLY: "D/M: beschaedigter Cyberweb-Roboturret"
  STR_XARQUID: "Xarquid"
  STR_XARQUID_ARMOR: "Kampfanalyse: Xarquid"
  STR_XARQUID_AUTOPSY: "Autopsie: Xarquid"
  STR_XARQUID_AUTOPSY_UFOPEDIA: "Dieser uebergrosse Nautilus wurde mit ausserirdischen Drogen gemaestet und durch chirurgische Eingriffe massiv veraendert. Jenseits aller natuerlichen Grenzen pervertiert, versehen mit zusaetzlichen mechanischen Steuersystemen und zahlreichen weiteren kuenstlichen Merkmalen, ist diese Kreatur nichts als eine vielseitige Kriegswaffe. Als organische Waffenplattform machen die harte Schale und die hohe Beweglichkeit des Xarquid ihn zu einem ausserordentlich gefaehrlichen Gegner."
  STR_XARQUID_CORPSE: "Leiche eines Xarquid"
  STR_XARQUID_GRAPPLE: "Xarquid-Griff"
  STR_XARQUID_GRAPPLE_UFOPEDIA: "Im Notfall kann ein Xarquid seine zahlreichen Tentakel auch zur Selbstverteidigung einsetzen. Zwar ist dieser Nahkampfangriff nicht so gefaehrlich wie seine Fernwaffe, doch diese gelenkigen Gliedmassen sind stark und sollten keinesfalls unterschaetzt werden."
  STR_XARQUID_TERRORIST: "Xarquid"
  STR_XARQUID_UFOPEDIA: "Der Xarquid ist ein weiteres modifiziertes wirbelloses Landtier und eine Kreatur von zugleich grosser Schoenheit und grosser Gefahr. Dieser schnell schwimmende Gigant birgt eine maechtige Schallkanone in seinem Koerper. Seit unseren ersten Begegnungen mit diesem beeindruckenden Wesen sind wir nicht nur gegenueber seiner Macht wachsam, sondern auch gegenueber jenen heimtueckischen Deep Ones, die es kontrollieren."
  STR_XARQUID_WEAPON: "Xarquid-Kanone"
  STR_XARQUID_WEAPON_UFOPEDIA: "Das markanteste Implantat eines Xarquid ist seine halbbiologische schwere Schallkanone, die muhelos selbst grosse Loecher in die Panzerung militaerischer Schiffe reissen kann."
  STR_XCOM_AIRCAR_UFOPEDIA: "Ruecksichtslos vom Hybridennetzwerk kopiert, kann der Luftwagen bis zu 4 Agenten transportieren. Er nutzt Alien-Treibstoff als Energiespeicher, nicht als Energiequelle. WPN: CANN x 1"
  STR_XCOM_ENHANCEMENT_UFOPEDIA: "Wir verfuegen jetzt ueber die Technologie, unsere Agenten auf dieselbe Weise zu verbessern wie die Morgenroete: Staerke und Zaehigkeit koennen damit auf uebermenschliche Werte gesteigert werden. Diese Aufwertung ist jedoch fuer Personen ohne ausreichende koerperliche Vorbereitung sehr gefaehrlich und wird deshalb auf erfahrenere Agenten beschraenkt. Sie senkt die Sanity dauerhaft um 10.{NEWLINE}Voraussetzungen: Energie 60, Gesundheit 40, Staerke 35{NEWLINE}Benoetigt Krankenstation."
  STR_XCOM_FLYERS_UFOPEDIA: "Kommandant! Unsere Agenten sind im Feld zunehmend in der Unterzahl gegen alle diese Typen mit komischen Huten, aber heimliches Reisen hat seine Grenzen. Wir brauchen eigene Transportmittel, damit uns niemand in die Karten oder Koffer schauen kann! Flugzeuge allerdings brauchen Piloten. Wir haben keine ausreichend vertrauliche Bezugsquelle fur Piloten, die sich in unserem Stutzpunkt herumtreiben wurden. Wer wei, mit wem sie unter einer Decke stecken... Also habe ich ein paar Leute kontaktiert, denen ich vertraue, und sie werden unsere Agenten an den Maschinen ausbilden! Glauben Sie mir, es wird zwar lange dauern, aber es ist nicht so schwierig, wenn man keine Angst vor Turbulenzen hat!"
  STR_XCOM_HYBRIDS_UFOPEDIA: "Viele Hybriden sind mit ihrem Dienst unter fremden Meistern ungluecklich und bereit, gegen ihr grausames Schicksal zu kaempfen. Wir koennen ihnen eine neue Heimat bieten, solange sie uns bei der Verteidigung der Erde unterstuetzen - und dazu sind sie mehr als bereit.{NEWLINE}Hybrid-Agenten sind leichter gebaut als Menschen, verfuegen jedoch ueber ausgepraegte mentale und beobachtende Faehigkeiten. Sie besitzen ueberlegene Nachtsicht, eine hervorragende Hand-Auge-Koordination und starke psionische Anlagen. Ausserdem koennen sie einen psionischen Schild aufrechterhalten, aehnlich wie Sectoids (20 Punkte, Regeneration 4 pro Runde). Hybriden koennen sich in den Staedten der Erde frei bewegen, da ihre psychogene Tarnung sie fuer das ungeuebte Auge wie Menschen erscheinen laesst."
  STR_XCOM_LANDER: "Lander"
  STR_XCOM_LANDER_UFOPEDIA: "Diese von den Hybriden uebernommene Konstruktion dient als schneller Transporter fuer bis zu 14 Agenten. Dank des Grav-Lift-Systems kann er auch grosse Einheiten aufnehmen. WPN: CANN x 2"
  STR_XCOM_LIQUIDATOR_ARMOR_UFOPEDIA: "BlackOps AG verfuegt sowohl ueber die technischen als auch die rechtlichen Mittel, unsere eigene Version des EXALT-Liquidator-Anzugs herzustellen. Es handelt sich um eine Variante der Ballistischen Weste mit besserer Nachtsicht, die jedoch etwas staerker einschraenkt."
  STR_XCOM_MINOTAURS: "X-Com-Minotauren"
  STR_XCOM_MINOTAURS_DESCRIPTION: "Kommandant, haetten Sie kurz einen Moment? Ich wuerde gern etwas mit Ihnen besprechen ..."
  STR_XCOM_MINOTAURS_NO: "Sturm-Minotauren? Schlechte Idee ..."
  STR_XCOM_MINOTAURS_NO_UFOPEDIA: "Nach gruendlicher Abwaegung verwerfen Sie den Vorschlag, bewaffnete Minotaur-Einheiten fuer X-Com aufzubauen. Der Rat begruesst diese Entscheidung [+150 Punkte], doch Ihr Gesandter wirkt ungewoehnlich enttaeuscht."
  STR_XCOM_MINOTAURS_UFOPEDIA: "Kommandant, wir haben immer wieder ueber die Idee gestritten, Minotauren nicht nur zur Basisverteidigung einzusetzen, sondern auch im Felde. Ja, der Vorschlag wurde bisher jedes Mal abgeschmettert, und ich verstehe auch warum: Diese Brocken passen nicht gerade zu unserem Image als Weltpolizei. Sie sind zu auffaellig, zu begriffsstutzig und viel zu schwer zu disziplinieren. Schwer, dagegen zu argumentieren. Aber ich muss trotzdem staendig an das Syndikat denken und daran, wie erfolgreich sie diese Viecher einsetzen. Ich sage nicht, dass wir ihren Weg kopieren sollten, aber ... vielleicht koennten wir uns ja eine Seite aus ihrem Handbuch ausleihen?{NEWLINE}Als regulaere Feldtruppe taugen Minotauren weiterhin nur bedingt, aber wir koennten einen speziellen Transporter entwickeln, um sie fuer gezielte Einsaetze auszubringen. Dazu muessten wir einige Exemplare in autonome Kampfeinheiten ueberfuehren. Vorteile: enorme Schlagkraft bei minimalem Agenteneinsatz. Nachteile: Es sind immer noch Minotauren. Was meinen Sie?"
  STR_XCOM_MINOTAURS_YES: "Sturm-Minotauren? Gute Idee!"
  STR_XCOM_MINOTAURS_YES_UFOPEDIA: "Ha, ausgezeichnet! Ich kuemmere mich sofort darum. Ich kann es kaum erwarten, diese Biester in Aktion zu sehen. Haben Sie diese Muskeln mal genauer betrachtet? Was fuer eine Kraft!"
  STR_XCOM_PARAMILITARY_OPERATIONS: "X-Com: Paramilitaerische Operationen"
  STR_XCOM_PARAMILITARY_OPERATIONS_UFOPEDIA: "Kommandant, mir ist aufgefallen, dass Ihr wagemutiger Stab mit sehr begrenzten Mitteln bereits einige, hehe, beeindruckende Beschaffungen auf die Beine gestellt hat. Aber Hand aufs Herz: Fuer ernsthafte Operationen reicht das bei weitem nicht. Ich habe ein paar Freunde an den richtigen Stellen kontaktiert und uns die Gelegenheit verschafft, auf ganz legalem Wege einige nicht ganz militaerische Luftfahrzeuge zu beschaffen, zwinker, zwinker. Was sagen Sie dazu, Kommandant?"
  STR_XCOM_PERSONNEL_UFOPEDIA: "Unsere Feldagenten werden normalerweise aus verschiedenen Regierungsbehoerden rekrutiert, die sich mit Ermittlungen oder Nachrichtendienst befassen. Besonders geeignet sind jene, die in ihrem frueheren Beruf bereits paranormalen Aktivitaeten begegnet sind und an topgeheime Arbeitsumgebungen gewoehnt sind. Andere stammen aus zivilen Lebenslaeufen, die sie mit dem Okkulten in Beruehrung brachten. Alle wurden gruendlich auf Loyalitaet geprueft, besitzen Grundausbildung an Feuerwaffen und ein solides Verstaendnis fuer Feldeinsatzgeraet. Viele betreiben in gewissem Umfang Kampfsport und sind koerperlich gut in Form. Die meisten sind jedoch keine Berufssoldaten, daher muss fortgeschrittene militaerische Ausbildung bei Bedarf von X-Com selbst vermittelt werden."
  STR_XCOM_ROBOTURRET_CORPSE: "Beschaedigter Roboturret"
  STR_XCOM_ROBOTURRET_LASER: "X-Com-Roboturret/Laserkanone"
  STR_XCOM_ROBOTURRET_MINIGUN: "X-Com-Roboturret/Minigun"
  STR_XCOM_ROBOTURRET_PLASMA: "X-Com-Roboturret/Plasmakanone"
  STR_XCOM_SEEKER_DRONE_UFOPEDIA: "Das fuer unsere KIs angepasste Seeker-Drohnen-Chassis ist mit derselben Plasmawaffe ausgeruestet wie das originale ausserirdische Modell. Anstelle eines Selbstzerstoerungssystems besitzt unsere Version einen robusten roten Schildtyp (Kapazitaet: 75, Wiederherstellung: 25/Runde). Sie kann unter Wasser funktionieren, aber nicht im Vakuum."
  STR_XCOM_SLANDER_BLACK_LOTUS_UNFINISHED: "X-Com-Verleumdung (Black Lotus noch nicht zerschlagen)"
  STR_XCOM_SLANDER_BLACK_LOTUS_UNFINISHED_BRIEFING: "Einige Leute im Rat kritisieren uns offen dafuer, dass wir Black Lotus noch nicht ausgeschaltet haben, obwohl wir dazu faehig waeren. Ihr Handlanger ist bereits unterwegs, um unseren Ruf bei einigen unserer weniger standfesten Unterstuetzer zu zerstoeren. Wie durch ein Wunder sind wir diesmal rechtzeitig vor Ort, um ihn fuer immer zum Schweigen zu bringen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_XCOM_SLANDER_BLACK_LOTUS_UNFINISHED_DESCRIPTION: "Einige Leute im Rat kritisieren uns offen dafuer, dass wir Black Lotus noch nicht ausgeschaltet haben, obwohl wir dazu faehig waeren. Ihr Handlanger ist bereits unterwegs, um unseren Ruf bei einigen unserer weniger standfesten Unterstuetzer zu zerstoeren. Wir muessen ihn stoppen, auch wenn es realistisch betrachtet schwer wird, rechtzeitig dort zu sein."
