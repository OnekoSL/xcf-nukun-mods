  STR_ALIEN_ABDUCTION_SITE: "Ort der Alien-Entfuehrung"
  STR_ALIEN_ABDUCTION_SITE_BRIEFING: "Ein Alien-Schiff ist in der Gegend gelandet und greift die lokale Bevoelkerung an. Um die Mission abzubrechen, bringen Sie X-Com-Agenten zum Transportfahrzeug zurueck und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_ALIEN_ABDUCTION_SITE_DESCRIPTION: "Ein Alien-Schiff ist in der Gegend gelandet und greift die lokale Bevoelkerung an. Wir muessen dem sofort ein Ende setzen."
  STR_ALIEN_BIG_BASE_ASSAULT_BRIEFING: "Nach dem Abkommen mit dem Gastgeberland haben die Auerirdischen einen groen Stutzpunkt an diesem Ort eingerichtet. Sein Kontrollzentrum muss zerstort werden, um ihn stillzulegen. Die Mission endet, wenn alle Feinde ausgeschaltet sind. Wenn Sie sich zum Ruckzug entschlieen, sammeln Sie die verbleibenden Agenten im grunen Ausgangsbereich und klicken sie das 'Mission abbrechen'-Icon."
  STR_ALIEN_BIOCHEMISTRY_UFOPEDIA: "Die Analyse des auerirdischen Gewebes hat bestatigt, was die Biochemiker seit Jahrzehnten vermuten: verschiedene Ursprunge fuhren zu verschiedener Biochemie. Sie beruhen alle auf organischer Chemie, aber drastisch anders angewendet als bei uns. Die Auerirdischen benotigen mehr Ubergangsmetalle und Beryllium in ihren biologischen Verbindungen als wir, was impliziert, dass sie wahrend der Biogenese einfacher verfugbar waren - wenn sie denn spontan war. Interessanterweise scheint ihre Biochemie an das selbe Temperaturband angepasst wie die unsere.{NEWLINE}Diese Entdeckungen befriedigen nicht nur unsere wissenschaftliche Neugier. Mit diesem Wissen konnen wir effizientere Waffen erschaffen und neue chemische Methoden entwickeln, um die Auerirdischen abzuwehren."
  STR_ALIEN_BIOLOGY: "Ausserirdische Biologie"
  STR_ALIEN_BIOLOGY_UFOPEDIA: "Unsere vorlaeufigen Untersuchungen zeigen, dass Aliens ueber DNS verfuegen, die der unseren aehnelt, zugleich aber so fremdartig ist, dass wir von einem ausserirdischen Ursprung ausgehen muessen - oder zumindest von etwas aus unvorstellbaren Tiefen der Zeit. Ausserdem scheinen bestimmte Fragmente kuenstlich hinzugefuegt worden zu sein, vermutlich aus irdischen Organismen gewonnen. Das hilft den Aliens offenbar, sich an unsere Umwelt anzupassen, jedoch nur unvollstaendig oder fuer begrenzte Zeit: Da sie auf vorverarbeitete Naehrstoffe angewiesen sind und ueber ein schwaches Immunsystem verfuegen, koennen sie auf der Erde nicht lange ueberleben. Deshalb muessen wir besondere Vorkehrungen treffen, wenn wir ein lebendes Exemplar untersuchen wollen."
  STR_ALIEN_CHEMISTRY_UFOPEDIA: "Die Auerirdischen verfugen uber ausfuhrliches Wissen von exotischer und gewohnlicher Materie, weit jenseits von dem, was die Menscheit erreicht hat. Ihre Materialtechnik dreht sich vor allem um Kristallformen, vermischt anorganische und biologische Herstellungsweisen, um Materialien mit fantastischen Eigenschaften zu erschaffen: ultra-harte Legierungen, hyperaktive Chemikalien, intelligente biologische Verbindungen. Die Auerirdischen glanzen auch in der Medizin, nutzen hochentwickelte Chemie um, Kybernetik makellos mit lebendem Fleish zu verschmelzen."
  STR_ALIEN_COLONY_UFOPEDIA: "Nach der erfolgreichen Infiltration eines Landes, werden die Auerirdischen in der Region einen groen Stutzpunkt bauen. Diese Kolonie wiederum leitet andere Missionen ein, von Streifen hin zu weiterer Subversion. Wir mussen mit solchen Bruckenkopfen als eine absolute Prioritat verfahren, aber die Invasoren werden sicherlich ernsten Widerstand leisten."
  STR_ALIEN_DRONE_CORPSE: "Zerstoerte Alien-Drohne"
  STR_ALIEN_ENGINEERS_UFOPEDIA: "Ingenieure sind eine besondere Kaste unter den Auerirdischen, betraut mit Wissen uber arkane auerirdische Ausrustung - oder Bruchstucke davon. Unter Soldaten rekrutiert, verbringen sie ihr Leben in total abgeschotteten Gemeinschaften in den auerirdischen Stutzpunkten -fast wie Kloster- bis sie als einsatzbereit eingestuft werden. Ingenieure arbeiten normalerweise in Fabriken, setzen Waffen fur den Einsatz gegen die Erde zusammen oder warten Schiffe auf Missionen. Jedoch besitzen sie trotz ihrer Intelligenz nur wenig echtes wissenschaftliches Wissen: Ihre Fertigkeiten beruhen auf Ubung und Wiederholung ohne tieferes Verstandnis."
  STR_ALIEN_ENVOY_UFOPEDIA: "Dann und wann senden  die Auerirdischen ihre Gesandten zur Erde um (uberlicherweise diplomatische) Missionen groer Bedeutsamkeit zu erfullen. Fur diesen Zweck werden besondere Schiffe benutzt, anhand ihrer goldenen Auenhulle zu erkennen. Passagiere dieser Schiffe sind von groer Wichtigkeit fur uns, sie lebend zu fangen und zu verhoren hat Prioritat."
  STR_ALIEN_GOVERNANCE_UFOPEDIA: "Manchmal senden die Auerirdischen besondere Gesandte zur Erde, um spezielle Befehle zu ubertragen oder um wichtige Projekte der Invasion zusatzlich zu uberwachen. Diese Missionen stellen kein direktes Risiko fur X-Com dar, aber sie gewahren eine Gelegenheit, seltene Auerirdische gefangen zu nehmen und zu verhoren, und so die Entwicklung unserer Verteidigung voranzutreiben."
  STR_ALIEN_HIERARCHY: "Alien-Hierarchie"
  STR_ALIEN_HIERARCHY_UFOPEDIA: "Die Alien-Gesellschaft setzt sich aus mehreren Spezies zusammen, die zumeist kaum miteinander interagieren. Darueber hinaus sind die Aliens in strikte Rangstufen getrennt, vom gewoehnlichen Soldaten bis zum Elitekommandanten, und auch jede Rangstufe lebt in relativer Isolation. Diese ruecksichtslose Trennung stuetzt sich auf hochentwickelte, psionisch verstaerkte soziale Mechanismen - ein duesterer Beleg fuer den Entwicklungsstand der Aliens und die Gefahr, die sie fuer unsere eigene Gesellschaft darstellen."
  STR_ALIEN_INFILTRATION_UFOPEDIA: "Es kann vorkommen, da die Regierungen der Erde von den Agenten der Auerirdischen, die das Aussehen von Menschen angenommen haben, infiltriert werden. Dadurch kommen offizielle Kontakte in hochsten Regierungskreisen zustande. Den Hohepunkt dieser Aktivitaten bilden zahlreiche Erscheinungen von UFOs in der Nahe groerer Stadte. Die Auerirdischen versuchen, Vertrage mit den Regierungen abzuschlieen, indem sie ihnen Erkenntnisse ihrer uberlegenen Technologien anbieten. Als Gegenleistung soll die jeweilige Regierung den Auerirdischen gestatten, ihre Aktivitaten ungehindert auszufuhren. Diese Missionen stellen die grote Bedrohung fur die X-Com dar. Stimmt eine Regierung einem Abkommen zu, dann wird sie der X-Com keine finanziellen Mittel mehr zur Verfugung stellen."
  STR_ALIEN_LEADERS_UFOPEDIA: "Anfuhrer werden ublicherweise aus Navigatoren, Ingenieuren und Arzten ausgewahlt, die auerordentlichen Intellekt und Befehlsvermogen unter Beweis stellen. Wenn die Kriegsnot nicht anderes bedingt, sind sie normalerweise viel alter und erfahrener als durchschnittliche auerirdische Krieger. Bevor sie auf Missionen geschickt werden, unterziehen sie sich rigoroser Ausbildung und psionischer Konditionierung, um ihre Fertigkeiten und Moral zu verbessern. Trotz ihrer Machtposition erhalten Anfuhrer wenig echte Privilegien, auer Zugang zu vertraulichen Daten.{NEWLINE}Infos von einem Anfuhrer ermoglichte uns die Identifikation verschiedener auerirdischer Auenposten durch das Sonnensystem, einschlielich eines Beobachtungsposten und Auftankstation auf dem Mond, eine groe Basis auf dem Mars, und mehrere Bergbaustationen im Asteroidengurtel. Unser Anfuhrer war auf dem Mars stationiert, aber kann nicht sagen, ob sich dort das Hauptquartier befindet."
  STR_ALIEN_LEGATES_UFOPEDIA: "Auerirdische Legaten sind privilegierte Mitglieder des Atherischen Ordens, die wichtige diplomatische Missionen wahrnehmen. Ublicherweise besteht ihr Gefolge aus niederern Wesen, die ihnen in der Vertretung der Interessen des Ordens assistieren. Legaten sind sicherlich nicht die besten Kampfer ihrer Art und tragen keine ernsten Waffen, aber sie haben fast unschlagbare Psi-Krafte und sind daher auerst gefahrlich. Das Verhor eines Legaten konnte helfen, ihre Mission klarzustellen, und uns notwendige Informationen liefern, wie die Plane der Auerirdischen auf der Erde aufzuhalten sind."
  STR_ALIEN_LUNAR_COLONY_DATA: "Daten zur ausserirdischen Mondkolonie"
  STR_ALIEN_LUNAR_COLONY_DATA_UFOPEDIA: "Dank der erbeuteten Daten verfuegen wir nun ueber grobe Plaene der ausserirdischen Stadt auf dem Mond. Sie scheint aus drei Ebenen zu bestehen: Ganz oben liegen die 'Vorstaedte', in denen unsere Agenten gekaempft haben, darunter befindet sich der Hauptbereich mit der hoechsten ausserirdischen Aktivitaet, und noch weiter unten erstreckt sich eine bislang unbekannte dritte Ebene.{NEWLINE}Beim naechsten Vorstoss muessen wir noch tiefer vordringen. Wir brauchen mehr Daten - Daten, die nur in dieser ausserirdischen Stadt zu finden sind."
  STR_ALIEN_MIB_COMMUNICATIONS: "Alien/Men in Black-Dialog"
  STR_ALIEN_MIB_COMMUNICATIONS_UFOPEDIA: "Um mit ihren Verbundeten auf der Erde zu kommunizieren, nutzen die Auerirdischen eine Verschlusselung, die im Prinzip nicht sehr komplex ist, aber die physischen Eigenschaften von optronischen Systemen voll ausnutzt, und damit sogar unsere theoretische Quantenentschlusselung ubertrifft. Es ist zwar praktisch unmoglich, eine eigentliche Nachricht der Auerirdischen zu entschlusseln, aber wir konnten das Problem in Theorie umgehen, indem wir uns als die andere Seite ausgeben, solange wir die Log-in-Sequenz beider Seiten haben. Es ist unsere einzige Chance, die geheimen Einrichtungen zu infiltrieren, wo wichtige Kooperation zwischen Auerirdischen und Men in Black stattfindet."
  STR_ALIEN_MIB_MEETING: "Alien/Men in Black-Treffen"
  STR_ALIEN_MIB_MEETING_BRIEFING: "Ein ausserirdisches Raumschiff ist in der Naehe dieser Stadt gelandet, und die Men in Black helfen den Besuchern dabei, die menschliche Welt fuer ihre schaedlichen Zwecke zu unterwandern. Stellen Sie sicher, dass beide Streitkraefte neutralisiert werden. WARNUNG: Verstaerkungen der Men in Black werden zu Beginn der zweiten Runde eintreffen. Bereiten Sie sich darauf vor, sie abzufangen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_ALIEN_MIB_MEETING_DESCRIPTION: "Ein ausserirdisches Raumschiff ist in der Naehe dieser Stadt gelandet, und die Men in Black helfen den Besuchern dabei, die menschliche Welt fuer ihre schaedlichen Zwecke zu unterwandern. Stellen Sie sicher, dass beide Streitkraefte neutralisiert werden."
  STR_ALIEN_MIB_MEETING_FLOATER: "Alien/Men in Black-Treffen (Schweber)"
  STR_ALIEN_MIB_MEETING_MUTON: "Alien/Men in Black-Treffen (Mutone)"
  STR_ALIEN_MIB_MEETING_SECTOID: "Alien/Men in Black-Treffen (Sectoid)"
  STR_ALIEN_MIB_MEETING_UFOPEDIA: "Es ist bekannt, dass die Men in Black die Aliens bei der Unterwanderung der Erde unterstuetzen, sei es fuer Diplomatie oder Sabotage. Beide Gruppen haben einen Treffpunkt vereinbart, an dem die Ausserirdischen von einem Spezialtrupp der Men in Black abgeholt und an ihren Zielort gebracht werden. Solche Missionen sollten wir abfangen, wann immer sich die Gelegenheit bietet."
  STR_ALIEN_NAVIGATORS_UFOPEDIA: "Die Kaste der Navigatoren steht deutlich uber den Soldaten, fungiert oft als Unteroffiziere auf weniger wichtigen Missionen. Sie haben Zugang zu bestimmten Geheiminformationen, notwendig fur das Steuern von UFOs und andere besondere Aufgaben. Navigatoren werden normalerweise getrennt von Soldaten untergebracht, um Infolecks und ungewollte Verbruderung zu vermeiden. Trotz ihrer privilegierten Stellung wissen auch sie nicht, wo die Auerirdischen herkommen, nur, dass es irgendwo im Sonnensystem ist."
  STR_ALIEN_NEUROPSYCHOLOGY: "Ausserirdische Neuropsychologie"
  STR_ALIEN_NEUROPSYCHOLOGY_UFOPEDIA: "Es gibt viele verschiedene ausserirdische Lebensformen, doch sie teilen bestimmte neuropsychologische Merkmale, die entweder ihrer Natur entsprechen oder ihnen kuenstlich eingepflanzt wurden. Diese Eigenschaften erlauben den Aliens trotz ihrer biologischen Unterschiede eine schwarmartige Zusammenarbeit. Die gemeinsamen Muster betreffen vor allem nonverbale Kommunikation, innere Visualisierung und die Uebertragung einfacher Emotionen. Damit koennen wir nun hoffen, ihre zwischenmenschlichen Kommunikationskanaele anzuzapfen und moeglicherweise zu unserem Vorteil zu nutzen."
  STR_ALIEN_ORBITAL_UFOPEDIA: "Aus dem Hauptlogbuch der Men in Black haben wir von einer gewaltigen Orbitalstation erfahren, von der die Ausserirdischen ihre Expeditionen auf diesen Planeten koordinieren. Dieser kuenstliche Satellit ruht auf einer hohen Umlaufbahn und waere von der Erde aus leicht zu beobachten, wenn nicht sein eigenartiges Tarnfeld ihn fuer EM-Strahlung nahezu unsichtbar machen wuerde. Solange wir ausserirdische Kommunikation entschluesseln koennen, koennen wir dieses Objekt genau genug verfolgen, um es mit einem weltraumtauglichen Gefaehrt zu erreichen. Wir muessen nur warten, bis der Stuetzpunkt in der richtigen Position ist, Kommandant."
  STR_ALIEN_POLITIES: "Alien-Politaeten"
  STR_ALIEN_POLITIES_UFOPEDIA: "Unsere Alienfeinde treten in Gestalt mehrerer Spezies auf, deren Loyalitaet stark kontrolliert wird. Doch die Galaxis ist voller technologischer Zivilisationen, von denen selbst unsere Alien-Quellen manche nur in Raetseln beschreiben. Diese Zivilisationen koennen kooperieren, Krieg fuehren oder ganz andere Beziehungen zueinander unterhalten. Deshalb gehoeren manche Aliens, die auf der Erde auftauchen, moeglicherweise gar nicht zu der Gesellschaft, die uns belaestigt, sondern sind externe Helfer - oder im Gegenteil Feinde oder Parasiten jener Wesen, die uns bedrohen. Solche Besucher sind jedoch aeusserst selten und duerften das grosse Ganze kaum beeinflussen."
  STR_ALIEN_PURGE_BRIEFING: "Die Auerirdischen haben Spezialstreitkrafte ausgesandt um eine unfreundliche Fraktion einer Landesregierung auszuschalten. Schutzen sie die Zivilisten, vor allem die VIPs. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_ALIEN_RESEARCH_UFOPEDIA: "Die auerirdische Forschungsmission sammelt Daten uber die Erde und ihre Einwohner. Es werden vor allem kleine Flugobjekte benutzt, die gelegentlich in  verlassenen Gebieten zwischenlanden. Diese Art von auerirdischer Aktivitat stellt die geringste Bedrohung fur X-Com dar, mit wenig Beachtung von den Regierungen oder der Offentlichkeit."
  STR_ALIEN_SURGERY_DISASSEMBLY: "D/A: Alien-Chirurgie"
  STR_ALIEN_TUTELAGE: "Unterweisung durch Aliens"
  STR_ALIEN_TUTELAGE_UFOPEDIA: "Obwohl die Aliens ihre fortschrittliche Technologie mit den Men in Black teilen, scheinen sie sehr vorsichtig zu sein, was genau offengelegt wird. Am leichtesten werden direkte Anwendungen geteilt, etwa E-115-Triebwerke oder Plasma-Sprengstoffe. Eine eingeschraenktere, aber immerhin teilweise verfuegbare Kategorie umfasst Alien-Aeronautik, genetisches Design und Psionik. Grundwissen ueber die Alien-Wirtschaft, etwa die Herkunft und wahre Natur des Elements E-115, bleibt dagegen streng gehuetet. Die wissenschaftlichen Teams der Men in Black sind mit diesen Bedingungen alles andere als zufrieden und versuchen nach Kraeften, die Prinzipien hinter jeder Alien-Technologie zu verstehen, die sie in die Haende bekommen. Das ist heikel, denn niemand weiss, wie die Aliens darauf reagieren werden, wenn ihre Verbuendeten sensible Technik rueckentwickeln. Die Men in Black halten das Risiko jedoch zumindest gelegentlich fuer vertretbar."
  STR_ALL_STAFF_CONTACTED: "Gesamter Stab kontaktiert"
  STR_ANCIENT_GHOUL_WARRIOR: "Uralter Ghoul-Krieger"
  STR_ANCIENT_KATANA_UFOPEDIA: "Diese einzigartige Waffe gehoerte Meister Lo Wo, einem hochrangigen Ausbilder der Assassinen von Black Lotus. Ihr Griff enthaelt einen geheimen Mechanismus, der einem Unkundigen ohne Weiteres die Hand abtrennen kann. Nach einiger Tueftelei koennen wir sie nun mit vertretbarem Risiko benutzen. Die Klinge ist ungewoehnlich leicht und robust, laesst sich hervorragend schaerfen und wirkt in einer Hand deutlich handlicher als ein gewoehnliches Katana. Zudem scheint ihr eine geheimnisvolle Kraft innezuwohnen."
  STR_ANCIENT_MUMMY_ABODE: "Uralter Mumienhort"
  STR_ANCIENT_MUMMY_ABODE_BRIEFING: "Eine aggressive Zombieeinheit unter dem Kommando einer Mumien-Matriarchin greift eine uralte Siedlung von Mumien an. Wir sollten diese Gelegenheit nutzen, um diplomatische Kontakte zu diesen alten Mumien zu knuepfen. Finden und schuetzen Sie die einheimische Mumie. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Ausgangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_ANCIENT_MUMMY_ABODE_DESCRIPTION: "Eine aggressive Zombieeinheit unter dem Kommando einer Mumien-Matriarchin greift eine uralte Siedlung von Mumien an. Wir sollten diese Gelegenheit nutzen, um diplomatische Kontakte zu diesen alten Mumien zu knuepfen - vorausgesetzt, wir finden eine lebende neutrale Mumie."
  STR_ANCIENT_MUMMY_MATRIARCH: "Uralte Mumien-Matriarchin"
  STR_ANCIENT_SEA_GHOST: "Ancient Sea Ghost"
  STR_ANCIENT_SEA_GHOST_ARMOR: "Kampfanalyse: Ancient Sea Ghost"
  STR_ANCIENT_SEA_GHOST_UFOPEDIA: "Diese meergeborene spirituelle Entitaet ist das Resultat heftiger Emotionen rund um Tod und Terror. Weil komplexes Denken auf offener See selten ist, loesen sich solche Manifestationen nur langsam auf und koennen sich teilweise ueber Hunderte von Jahren erhalten, indem sie primitive geistige Energie verzehren. Eine solche psionische Entitaet kann sich als Gespenst manifestieren und traegt genug psionische Kraft in sich, um einen Menschen durch die Stoerung seines Biofeldes ernsthaft zu verletzen."
  STR_ANCIENT_SHIP_COMPUTER_UFOPEDIA: "Das Wrack war einmal ein Konstruktionsschiff, mit einer einzigartigen Energiequelle vom Mars ausgestattet. Seine Mission war, eine Sternenbrucke fur Weltraumerkundung zu spannen. Anscheinend standen zu dieser Zeit die Untersee-Auerirdischen im Krieg mit einer anderen irdischen Fraktion, den 'Nephilim'. Diese Nephilim sabotierten das Schiff, verursachten einen kaskadierenden Effekt, der das Schiff durch ein Dimensionstor warf.{NEWLINE}Dank einer gewaltigen Bibliothek von Energiesignaturen konnen wir nun einen Einblick in das Verteidigungssystem des auerirdischen HQs erhalten. Das sollte in der Zukunft sehr nutzlich werden."
  STR_ANCIENT_TABLET_UFOPEDIA: "Vor einigen Jahren trat eine mysterioese Gestalt an einen Kreis von Archaeologiestudenten heran und zeigte ihnen eine Tafel aus einer unbekannten Legierung, die er angeblich aus Nepal mitgebracht hatte. Zugleich bat er sie dringend, die Existenz der Tafel geheim zu halten, weil gefaehrliche Leute hinter ihr her seien. Obwohl das Stueck zweifellos sehr alt war, liess es sich keiner bekannten Kultur zuordnen und zunaechst nicht entziffern. Erst nach Ruecksprache mit einem Biologen stellte sich heraus, dass es Anweisungen zur Synthese bestimmter Proteine in Reptilien und Voegeln enthielt. Die Gruppe setzte diese Anweisungen in einem Labor um und erschuf Berichten zufolge eine Art Quasi-Dinosaurier, der jedoch getoetet werden musste, nachdem er mehrere Mitglieder in einem Berserkeranfall schwer verletzt hatte.{NEWLINE}Angeblich machten sich einige der Ueberlebenden spaeter auf den Weg nach Nepal, um den Ursprung der Tafel zu finden. Seitdem hat niemand mehr von ihnen gehoert, doch in ihrer letzten Nachricht war von einem gewaltigen Hoehlensystem die Rede, das sie erkunden wollten."
  STR_ANCIENT_TOMB_GUARD_FEMALE_TERRORIST: "Uralte Grabwaechterin"
  STR_ANCIENT_ZOMBIES_UFOPEDIA: "Wir haben eine erstaunliche Erkenntnis gewonnen: Auf der Erde hat offenbar bereits mindestens einmal eine kleinere Zombie-Apokalypse stattgefunden. Vor Tausenden von Jahren brach in Afrika eine Zombie-Seuche aus, verursacht durch denselben Parasitentyp. Daraus gingen Zombieformen hervor, die den uns bekannten sehr aehneln und schliesslich in den maechtigen Mumien gipfelten. Diese Mumien fuehrten Kriege gegeneinander und gegen Nicht-Zombies, bis sich die meisten von ihnen in den Untergrund zurueckzogen, um sich vor der Welt zu verbergen. Diese uralten Mumien existieren noch heute dort unten, nur ein Schatten ihrer frueheren Macht, aber immer noch ungeheuer klug und erfahren. Nun ist an der Oberflaeche eine neue Generation von Zombies aufgetaucht, die die Reiche, das Wissen und die Artefakte ihrer aelteren Schwestern an sich reissen will.{NEWLINE}Vielleicht waere es klug, mit diesen alten Mumien zu reden. Sie scheinen der Menschheit nicht feindlich gesinnt zu sein, und wir haben einen gemeinsamen Gegner."
  STR_ANEXIS_OFFER_UFOPEDIA: "Ich bin Anexi aus dem Haus der Brennenden Himmel, Schwester des Schlangenpropheten. Ich danke euch dafuer, dass ihr fuer uns eingegriffen und die Armee der Neugeborenen geschlagen habt. Wir leben seit Jahrtausenden in diesen Kavernen, doch die Neugeborenen versuchen nun, unseren heiligen Boden an sich zu reissen. Sie sind jung und dumm, aber zahlreich. Unser Geist ist staerker als ihrer, doch wir sind wenige und die Front ist lang. Eure Gegenwart ist willkommen, denn ihr verfuegt ueber viele faehige Diener. Haettet ihr Interesse an einer... diskreten Allianz?"
  STR_ANTEDILUVIAN_GHOST: "Antediluvian Ghost"
  STR_ANTEDILUVIAN_GHOST_ARMOR: "Kampfanalyse: Antediluvian Ghost"
  STR_ANTEDILUVIAN_GHOST_TERROR_BOLT: "Schreckensbolzen des Antediluvian Ghost"
  STR_ANTEDILUVIAN_GHOST_TOUCH_WEAPON: "Beruehrung des Antediluvian Ghost"
  STR_ANTEDILUVIAN_GHOST_UFOPEDIA: "Aus dem Abgrund der Zeit sickern diese aetherischen Wesen in unsere Wirklichkeit und drohen unser Verstaendnis von Realitaet zu zerbrechen. Sie sind unvorstellbar alt, vermutlich aelter als die Menschheit. Obwohl sie Human Ghosts aehneln, muessen sie also eine andere Quelle haben - vielleicht Tiere, vielleicht eine uralte nichtmenschliche Spezies, vielleicht etwas voellig anderes. Statt der psionischen Angriffe gewoehnlicher Human Ghosts verdichten sie ihre Kraft zu einem spektralen Geschoss, das selbst einen abgebruehten Agenten mit einem Hauch von Wahnsinn ausser Gefecht setzen kann. Zudem scheinen sie erheblich mehr Energie zu speichern als die 'gewoehnlichen' Geisterformen."
  STR_ANTI_E115_WEAPONS_UFOPEDIA: "Viele der auerirdischen Kreaturen, darunter Chryssalide, nutzen sogenanntes Auerirdisches Plasma in ihrem Stoffwechsel. Dieses Molekul ist Elerium 115, offenbar eine auerirdische Technologie. E-115 einzubinden steigert die Energieeffizienz eines Organismus' erheblich, und ermoglicht so Leistungen, die mit irdischem Energiehaushalt normal nicht erreichbar sind. Allerdings konnte dies auch der Pfad zu ihrem Untergang sein: Der richtige chemische Wirkstoff kann das inaktive Elerium in ihren Korpern anregen und entladt sofort alle gespeicherte Energie. Eine solche Waffe ware harmlos gegen menschliches und alles irdische Leben, aber jedes Wesen mit Elerium in seinen Adern wurde wortwortlich von innen her verbrennen. Wir reden hier von etwas wie spontaner Selbstentzundung."
  STR_ANTMAN_QUEEN_UFOPEDIA: "Dieser hochspezialisierte Typ eines Ameisenmenschen wurde mit einer Spezialmischung aus Nahrstoffen gefuttert, um zu einer unbewegliche Masse aus Drusen und Nervenzellen heranzuwachsen. Sie fungiert als die Fortpflanzerin der Kolonie, aber auch als eine Wissensbank und chemische Regulatorin. Koniginnen regieren nicht direkt, aber ihr Einfluss auf die Kolonie als Informationsknoten ist enorm. Es gibt normalerweise nur eine Konigin pro Nest, aber groere Kolonien konnen mehrere Koniginnen beherbergen."
  STR_ANY_RECLAMATION_OF_AETHER_INTERROGATED: "Beliebiges Mitglied der Reclamation of Aether verhoert"
  STR_AN_INCONVENIENT_TRUTH_DESCRIPTION: "Die Men in Black haben dem Rat peinliche Beispiele dafuer vorgelegt, wie unzureichend wir bislang gegen die ausserirdische Bedrohung vorgehen. Wir duerfen also mit einer eher 'erzieherischen' Reaktion der Vertreter rechnen.{NEWLINE}[-250 Punkte]"
  STR_APOCALYPSE_WINNERS_DONT_USE_DRUGS_DESCRIPTION: "Ein prominenter Boxstar aus {0} wurde kuerzlich wegen Dopings festgenommen. Ermittler des Rats, die den ploetzlichen Karrieresprung des Sportlers ohnehin bereits im Blick hatten, fanden unter den beschlagnahmten Substanzen auch eine gewisse Menge Storm. Die Probe wurde uns zur freien Verwendung ueberlassen.{NEWLINE}[Storm erhalten]"
  STR_AQUATOID: "Aquatoid"
  STR_AQUATOID_ARMOR: "Kampfanalyse: Aquatoid"
  STR_AQUATOID_AUTOPSY: "Autopsie: Aquatoid"
  STR_AQUATOID_AUTOPSY_UFOPEDIA: "Eine eingehende Analyse dieser Kreatur erlaubt einige grundlegende Rueckschluesse. Rudimentaere Lungen erlauben das Atmen von Luft und eine begrenzte Beweglichkeit an der Oberflaeche. Im gesamten Koerper finden sich cybernetische Implantate, die die Kraft der verkuemmerten Gliedmassen und die Leistung der Organe steigern. Da alle Vertreter dieser Spezies identisch erscheinen, liegt die Vermutung nahe, dass es sich um Klone handelt."
  STR_AQUATOID_CORPSE: "Leiche eines Aquatoid"
  STR_AQUATOID_NAVIGATOR: "Aquatoid-Navigator"
  STR_AQUATOID_SOLDIER: "Aquatoid-Soldat"
  STR_AQUATOID_SQUAD_LEADER: "Aquatoid-Truppfuehrer"
  STR_AQUATOID_TRAP_BRIEFING: "Unser Plan hat funktioniert: Die Aliens bringen Nachschub fuer den Stamm der Deep Ones, den wir imitiert haben. Wir sollten ihr Schiff uebernehmen, sobald es landet, und moeglichst einige von ihnen lebend in unsere Haende bekommen. Denken Sie daran, dass Menschen unter Wasser nur eingeschraenkt sehen und sich bewegen koennen. Viel Glueck!"
  STR_AQUATOID_TRAP_DESCRIPTION: "Wir senden gefaelschte Signale der Deep Ones aus, in der Hoffnung, ihre Versorger an diesen Ort zu locken. Begeben Sie sich dorthin und bereiten Sie einen Hinterhalt vor, um ihr Schiff anzugreifen, sobald es landet. Denken Sie daran, dass Menschen unter Wasser nur eingeschraenkt sehen und sich bewegen koennen.{NEWLINE}Nur unterwasserfaehige Ausruestung erlaubt!"
  STR_AQUATOID_UFOPEDIA: "Die Aquatoids bilden eine uralte Zivilisation, die bereits Jahrtausende existierte, bevor der Mensch seine ersten unsicheren Schritte auf dieser Welt machte. Ihre kompakte Gestalt und die knolligen Zuege erinnern deutlich an ihre raumfahrenden Verwandten, die Sectoids. Aquatoids versuchen, ihre sterile Spezies durch genetische Veraenderung anderer Voelker fortzupflanzen. Wie sich zeigt, sind Menschen dafuer ideale Versuchssubjekte. Ihre Experimente haben zahlreiche Hybridrassen hervorgebracht."
  STR_ARACHNOQUAKE_SURFACE_BRIEFING: "Bergbauarbeiten haben ein groes unterirdisches Nest von Riesenspinnen aufgestort, die jah in der Stadt aufgetaucht sind. Wir mussen das betroffene Gebiet absichern und alle gefahrdeten Zivilisten schutzen. Dann mussen wir in den Untergrund vorrucken und die Quelle des Problems eliminieren. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_ARACHNOQUAKE_UNDERGROUND_BRIEFING: "Nachdem wir die Straen von allen Riesenspinnen gesaubert haben, fanden wir einen Durchgang von der Kanalisation in einer groe unterirdische Hohle. Wir mussen die Spinnenkonigin toten, damit die Arachniden die Bevolkerung nicht weiter bedrohen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_ARASAKA_3000_UFOPEDIA: "Dieses Praezisionsgewehr ist eine Modifikation des Walther WA 2000, die von einem kleinen japanischen Hersteller gefertigt wurde. In geuebten Haenden ist es besonders wirksam.{NEWLINE}{NEWLINE}>Voraussetzung fuer den Kauf: Befoerderung II, Einkauf bei Black-Lotus-Zulieferern"
  STR_ARBITER_FRAME: "Arbiter-Huellenrahmen"
  STR_ARMORED_ROBBERY_DESCRIPTION: "In {0} wurde ein Buerogebaeude eines fuehrenden Forschungsunternehmens von einer unbekannten Gruppe ueberfallen. Die Taeter entwendeten streng geheime Daten und verschwanden, nachdem sie auf ihrem Rueckzug erhebliches Chaos angerichtet hatten. Laut Berichten trugen sie eine Art gepanzertes Exoskelett, gegen das die oertlichen Sicherheitsmassnahmen wirkungslos blieben. Der Rat argumentiert, der Vorfall waere nie passiert, wenn wir eingeschraenkte Technologien nicht mit M.A.G.M.A. geteilt haetten.{NEWLINE}[-500 Punkte]"
  STR_ARMORY_OF_APOCALYPSE: "Arsenal der Apokalypse"
  STR_ARMORY_OF_APOCALYPSE_BRIEFING: "Lokale Polizeikraefte haben einen unterirdischen Ring illegaler Waffenschmuggler aufgespuert und stehen kurz davor, deren Lagerhaus zu stuermen. Ohne Wissen der Cops handelt es sich um eine Operation des Kults der Apokalypse, um seine lokalen Anhaenger angemessen zu bewaffnen. Wir sollten diese Antiterroreinheit unterstuetzen, um sie zu schuetzen und vor allem zu verhindern, dass exotische Technik in ihre Haende faellt. Um die Mission abzubrechen, bringen Sie X-Com-Agenten zum Transportfahrzeug zurueck und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_ARMORY_OF_APOCALYPSE_DESCRIPTION: "Lokale Polizeikraefte haben einen unterirdischen Ring illegaler Waffenschmuggler aufgespuert und stehen kurz davor, deren Lagerhaus zu stuermen. Ohne Wissen der Cops handelt es sich um eine Operation des Kults der Apokalypse, um seine lokalen Anhaenger angemessen zu bewaffnen. Wir sollten diese Antiterroreinheit unterstuetzen, um sie zu schuetzen und vor allem zu verhindern, dass exotische Technik in ihre Haende faellt."
  STR_ASMODEAN_COBRA_UFOPEDIA: "An dieser hochaggressiven Schlange wurde eindeutig herumgepfuscht. Wie normale Speikobras kann sie ihr Gift recht weit schieen, aber es ist besonders todlich und sogar korrosiv. Der Biss der Schlange ist extrem gefahrlich und schmerzhaft, aber nicht giftig. Asmodaus-Kobras sind sehr kraftig fur ihre Groe und konnen leicht viel groere Beute schlagen, oft sogar ohne ihr Gift einzusetzen. Anders als normale Schlangen jagen sie oft auch ohne Hunger; eine Eigenschaft, die ihrem Uberleben abtragig ist, aber auch auerst problematisch fur die einheimischen Menschen und Wildtiere."
  STR_ASSASSIN_CLANS_BANK_ROBBERY_BRIEFING: "Ein abtruenniger Assassine von Black Lotus versucht, eine Bank auszurauben. Gleichzeitig gehen chaotische Berichte ueber toedliche Roboter-Ninjas ein. Die Polizei kann das nicht allein bewaeltigen - helfen Sie ihr! Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_ASSASSIN_CLANS_BANK_ROBBERY_DESCRIPTION: "Ein abtruenniger Assassine von Black Lotus versucht, eine Bank auszurauben. Gleichzeitig gehen chaotische Berichte ueber toedliche Roboter-Ninjas ein. Die Polizei kann das nicht allein bewaeltigen - helfen Sie ihr!"
  STR_ASSASSIN_CLANS_UFOPEDIA: "Obwohl die Sekte Black Lotus zerschlagen wurde, entgingen viele prominente Mitglieder der Verhaftung - besonders die Assassinen. Manche verloren nach der Verbannung ihrer Goettin jeden Lebenssinn oder nahmen sich sogar selbst das Leben, andere beschlossen dagegen, ihre einzigartigen Faehigkeiten gewinnbringend einzusetzen. Mit ausserirdischer Technik von den Feinden der Menschheit versorgt, wurden sie zu Meisterverbrechern. Es ist X-Coms Aufgabe, sich um sie zu kuemmern."
  STR_ASSAULT_ENERGY_SHIELD: "Sturm-Energieschild"
  STR_ASSAULT_ENERGY_SHIELD_UFOPEDIA: "Dieser Schild kann optional an einem Sturmanzug montiert werden. Er erhoeht die Frontpanzerung und ist zugleich eine handliche Elektroschock-Waffe. Aufgrund seiner Funktionsweise ist er beinahe schwerelos."
  STR_ASSAULT_SUIT_H_SHIELD_UC: "STURMANZUG/SCHILD (H)"
  STR_ASSAULT_SUIT_INFERNAL_SHIELD_UC: "STURMANZUG/SCHILD (INF)"
  STR_ASSAULT_SUIT_KYBEROS_SHIELD_UC: "STURMANZUG/SCHILD (KYB)"
  STR_ASSAULT_SUIT_OLYMPIAN_SHIELD_UC: "STURMANZUG/SCHILD (OLY)"
  STR_ASSAULT_SUIT_PROTEAN_SHIELD_UC: "STURMANZUG/SCHILD (PRO)"
  STR_ASSAULT_SUIT_SHIELD_UC: "STURMANZUG/SCHILD"
  STR_ASSAULT_SUIT_SHIELD_UFOPEDIA: "Ein Sturmanzug, der mit einem handgehaltenen Barrieregenerator ausgestattet ist."
  STR_ASSAULT_SUIT_SPARTAN_SHIELD_UC: "STURMANZUG/SCHILD (SPT)"
  STR_ASTRAL_WEREWOLF_ARMOR_UFOPEDIA: "So manifestieren sich Hundeverstaende innerhalb der Traumebene. Beachten Sie die humanoide Gestalt: ein deutlicher Hinweis darauf, dass Hunde als Spezies auf eigentuemliche Weise eng mit uns verbunden sind."
  STR_ASTRONAUT: "M.A.G.M.A.-Kosmonaut"
  STR_ASTRONAUT_ARMOR: "M.A.G.M.A.-Kosmonaut"
  STR_ASTRONAUT_CORPSE: "Leiche eines M.A.G.M.A.-Kosmonauten"
  STR_ASYLUM_APPARITIONS_BRIEFING: "Sie haben die spukende psychiatrische Station infiltriert, verkleidet als Doktoren. Finden Sie die Quelle der paranormalen Aktivitat und zerstoren Sie sie. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_ASYLUM_APPARITIONS_DESCRIPTION: "Jede Nacht wird dieses psychiatrische Krankenhaus von seltsamen Phanomenen heimgesucht: Phantome greifen Patienten und Personal an, erschrecken sie halb zu Tode und entkraften sie. Wir mussen dieses Haus infiltrieren und die Sache beenden.{NEWLINE}Diese Mission bedingt Infiltrationsausrustung, wenn wir die Schreckgespenster nicht verschrecken wollen. Es ist eine Nachtmission, aber bei guter Beleuchtung. Erwarten Sie nicht, dass Kugeln etwas gegen 'Geister' ausrichten werden, oder andere Standardwaffen was das angeht."
  STR_ATLANTIS_TEMPLE_BRIEFING: "Wir sind bereit, die geheimnisvollen Ruinen unter der Tasoth-Fabrik zu untersuchen. Wir muessen sie saeubern, um alle Artefakte zu bergen, die einer genaueren Untersuchung wert sind. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zur Ausgangszone zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_ATLANTIS_TEMPLE_DESCRIPTION: "Wir sind bereit, die geheimnisvollen Ruinen unter der Tasoth-Fabrik zu untersuchen. Offenbar wurde diese Anlage nicht ohne Grund genau an diesem Ort errichtet..."
  STR_ATLANTIS_TEMPLE_RUMORS: "Geruechte ueber den Atlantis-Tempel"
  STR_ATLANTIS_TEMPLE_RUMORS_UFOPEDIA: "Kommandant, wir sind auf eine bemerkenswerte Information gestossen: Offenbar existiert irgendwo auf dem Meeresboden ein uralter Ort des Wissens und der Verehrung, errichtet von einer lange vergessenen Zivilisation unklaren Ursprungs. So fantastisch das klingt, die Information erscheint glaubwuerdig. Wenn wir diesen geheimnisvollen Ort finden, werden wir mit Sicherheit interessante Daten bergen koennen."
  STR_ATLANTIS_TEMPLE_UFOPEDIA: "Nachdem wir die geheimen Inschriften auf der Dagon-Statue entziffert haben, wissen wir nun ziemlich genau, wo der Atlantis-Tempel liegt. Den Quellen zufolge befindet er sich 'direkt unter einer Tasoth-Fabrik'.{NEWLINE}Also los - finden wir ihn! Wer weiss, was sich in diesen Ruinen verbergen mag?"
  STR_AUTO_CANNON_UFOPEDIA: "Die Auto-Kanone verbindet die Vielseitigkeit und Durchschlagskraft einer schweren Kanone mit einer deutlich hoeheren Feuerrate.{NEWLINE}{NEWLINE}Der Kauf dieser Waffe setzt ein Sonderabkommen mit M.A.G.M.A. voraus."
  STR_A_DESPERATE_ALLIANCE: "Ein Buendnis aus Verzweiflung"
  STR_A_DESPERATE_ALLIANCE_UFOPEDIA: "Nachdem das Dreadnought ausser Dienst gestellt und der Rat die Kontrolle uebernommen hatte, waren Cyberweb-Aussenposten in Dimension X abgeschnitten. Einige behielten ihre Reisefaehigkeit zwischen den Dimensionen und hielten an ihrer bisherigen Lebensweise fest oder flohen zurueck zur Erde; die meisten hatten dieses Glueck jedoch nicht. Ein paar ergaben sich den Kraeften des Rats, aber der von Natur aus rebellische Charakter der Cyberweb-Bewegung trieb viele dazu, engere Beziehungen zur lokalen Zivilisation zu suchen.{NEWLINE}Es kam zu einem Handel: Im Austausch gegen materielle Hilfe und fortschrittliche Technologie unterstuetzten sie die Gewinnung wertvoller Ressourcen von der Erde. Die Aliens veraenderten die Koerper ihrer neuen Verbuendeten, damit diese besser an die Umwelt von Dimension X angepasst waren, infizierten aber zugleich ihre Gehirne mit Xenoorganismen. Diese Organismen veraenderten Persoenlichkeit und Wertvorstellungen der Menschen drastisch und gliederten sie effektiv in die schwaermartige Aliengesellschaft ein. Ob dies eine gezielte Taeuschung oder ein verzweifelter Versuch war, die Menschen vor dem Aussterben zu bewahren, ist nach wie vor unklar."
  STR_BADASS_CHRYSSALID_AUTOPSY_UFOPEDIA: "Dieser gewaltige Chryssalid ist schwer gepanzert, und tragt Eier, die eindeutig fur Wirte viel groer als Menschen gedacht sind. Wir haben chemische Spuren verschiedener anderer Exemplare im Korper gefunden."
  STR_BARN_OF_GORE_BRIEFING: "Eine unabhangige Gruppe infiziert Burger mit Zombieparasiten und verzehrt sie dann, um ihre Krafte zu erhalten. Wir mussen dem einen Riegel vorschieben. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_BASE_DEFENSE_BLACK_LOTUS: "BASISVERTEIDIGUNG (BLACK LOTUS)"
  STR_BASE_DEFENSE_CHURCH_OF_DAGON: "STUETZPUNKTVERTEIDIGUNG (KIRCHE DAGONS)"
  STR_BASE_DEFENSE_CULT_BRIEFING: "Eine groe Gruppe Kultisten steht vor unseren Toren. Unsere Basis ist in groer Gefahr. Gema Standardverfahren wurden alle XCom-Flugzeuge evakuiert. Auerirdische Einheiten betreten die Basis uber Hangarturen oder den Zugangslift. Verteidige die Basis und ihre lebenswichtigen Anlagen um jeden Preis - das ist ein Kampf bis zum Tod. Wenn du auf das Symbol \\\"Mission abbrechen\\\" klickst, wirst du eine Niederlage einraumen und die Basis verlieren."
  STR_BASE_DEFENSE_DIMENSION_X: "STUETZPUNKTVERTEIDIGUNG (DIMENSION X)"
  STR_BASE_DEFENSE_DIMENSION_X_BRIEFING: "Durch eine Fehlfunktion des Transdimensionalen Empfaengers sind zahlreiche extraplanare Lebensformen aus ihm hervorgebrochen. Unser Stuetzpunkt ist in schwerer Gefahr. Gemaess Standardverfahren wurden alle nicht kampffaehigen Mitarbeiter und alle X-Com-Fahrzeuge evakuiert. Feinde dringen ueber Hangartore oder den Zugangslift ein. Verteidigen Sie den Stuetzpunkt und seine lebenswichtigen Anlagen um jeden Preis - dies ist ein Kampf bis zum Tod. Wenn Sie auf das Symbol 'Mission abbrechen' klicken, geben Sie die Niederlage ein und verlieren den Stuetzpunkt."
  STR_BASE_DEFENSE_EXALT: "BASISVERTEIDIGUNG (EXALT)"
  STR_BASE_DEFENSE_HYBRID: "BASISVERTEIDIGUNG (HYBRIDEN)"
  STR_BASE_DEFENSE_MIB: "STUTZPUNKTVERTEIDIGUNG (Men in Black)"
  STR_BASE_DEFENSE_MIB_DROPSHIP: "STUTZPUNKTVERTEIDIGUNG (Men in Black)"
  STR_BASE_DEFENSE_MIB_STEALTH_BOMBER: "STUTZPUNKTVERTEIDIGUNG (Men in Black)"
  STR_BASE_DEFENSE_SYNDICATE: "BASISVERTEIDIGUNG (SYNDIKAT)"
  STR_BASE_DEFENSE_TEMPLE_OF_DAGON: "STUETZPUNKTVERTEIDIGUNG (KIRCHE DAGONS)"
  STR_BATTLESAGE: "Kampfweiser"
  STR_BATTLESAGE_H_UC: "KAMPFWEISER"
  STR_BATTLESAGE_UFOPEDIA: "Mit einer innovativen psionischen Schnittstelle verwandelt diese Ruestung das Gehirn eines Hybriden in einen vollwertigen taktischen Quantencomputer und steigert Reaktionen sowie Gefechtsuebersicht des Benutzers erheblich, einschliesslich Nachtsicht und Psisicht. Sie ist hermetisch abgeschlossen."
  STR_BATTLESHIP_FRAME: "Schlachtschiff-Huellenrahmen"
  STR_BEAM: "Strahl"
  STR_BEASTMAN_FORMULA_UFOPEDIA: "Die M.A.G.M.A.-Korporation hat uns einige aeusserst interessante Daten ueber Mensch-Tier-Hybriden ueberlassen. Offenbar gelangte sie in den Besitz einer altassyrischen Tafel, auf der mit wissenschaftlicher Praezision entscheidende Aspekte der Kombination menschlicher DNA mit der DNA anderer Saeugetiere beschrieben werden. Wir haben keine Ahnung, woher die Assyrer dieses Wissen hatten, doch an der Echtheit der Tafel besteht kaum ein Zweifel."
  STR_BEYOND_THE_DOOM_PORTAL_BRIEFING: "Ihre Agenten haben das Portal mutig durchschritten und werden nun die fremdartige Taschendimension auf der anderen Seite erkunden. Finden Sie eine schwebende schwarze Sphaere und sichern Sie sie, indem Sie alle Gegner ausschalten oder kampfunfaehig machen. Um die Mission abzubrechen, fuehren Sie die X-Com-Kraefte in den Ausgangsbereich und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_BIODRONE_UFOPEDIA: "Die Bio-Drohne ist ein Gehirn (menschlich oder fremd), in Fruchtwasser schwebend und mit einer motorisierten Grundeinheit verbunden, die fliegen und tauchen kann. Jede Bio-Drohne ist mit einem schlagkraftigen akustischen Storer ausgestattet, teils Maschine, teils Organismus: Diese ungluckselige Kreatur schreit ihre Feinde wortwortlich zu Tode. Das Gehirn ist umfassend modifiziert und kann nicht angesprochen werden, auer durch direkte elektrochemische Stimulation."
  STR_BLACKOPS_ASSAULT_LMG: "BlackOps Assault LMG"
  STR_BLACKOPS_ASSAULT_LMG_BUY: "BlackOps Assault LMG - Beschaffung"
  STR_BLACKOPS_ASSAULT_LMG_CRAFT_WEAPON_UC: "BlackOps Assault LMG"
  STR_BLACKOPS_ASSAULT_LMG_UFOPEDIA: "Eine schwere Variante der BlackOps-Gewehre mit massiverem Lauf. Der starke Rueckstoss und die sperrige Handhabung machen die Waffe fuer weite Distanzen ungeeignet.{NEWLINE}{NEWLINE}Voraussetzung fuer den Kauf: Befoerderung II, Kontakt: BlackOps Industries."
  STR_BLACKOPS_AUTO_SNIPER_RIFLE: "BlackOps Auto-Sniper Rifle"
  STR_BLACKOPS_AUTO_SNIPER_RIFLE_AA_CLIP: "BlackOps-Auto-Sniper-Rifle-Tritanium-Magazin"
  STR_BLACKOPS_AUTO_SNIPER_RIFLE_AA_CLIP_MANUFACTURING: "Herstellung: BlackOps-Auto-Sniper-Rifle-Tritanium-Magazin"
  STR_BLACKOPS_AUTO_SNIPER_RIFLE_AA_CLIP_XXX: "BlackOps-Auto-Sniper-Rifle-Tritanium-Magazin (x2)"
  STR_BLACKOPS_AUTO_SNIPER_RIFLE_BUY: "BlackOps Auto-Sniper Rifle - Beschaffung"
  STR_BLACKOPS_AUTO_SNIPER_RIFLE_CLIP: "BlackOps-Auto-Sniper-Rifle-Magazin"
  STR_BLACKOPS_AUTO_SNIPER_RIFLE_UFOPEDIA: "Dieses hochentwickelte Praezisionsgewehr ist schneller als klassische Scharfschuetzengewehre und erlaubt sogar Autofeuer, allerdings auf Kosten der Genauigkeit. Das elektronische Zielsystem hilft, sofern der Schuetze ueber gute Reflexe verfuegt.{NEWLINE}{NEWLINE}Voraussetzung fuer den Kauf: Befoerderung II, Kontakt: BlackOps Industries."
  STR_BLACKOPS_CONTACT: "Kontakt: BlackOps Industries"
  STR_BLACKOPS_CONTACT_UFOPEDIA: "BlackOps Industries ist ein streng geheimer Hersteller modernster Militaerausruestung. Das Unternehmen beliefert zahlreiche verdeckte Regierungsdienste auf der ganzen Welt mit Waffen und Geraeten. Die Produkte sind teuer, liegen qualitativ jedoch ueber fast allem, was sonst auf dem Markt zu finden ist. Mit wachsender Autoritaet erweitern sich auch unsere Bezugsmoeglichkeiten."
  STR_BLACKOPS_LMG_AA_CLIP: "BlackOps-LMG-Tritanium-Magazin"
  STR_BLACKOPS_LMG_AA_CLIP_MANUFACTURING: "Herstellung: BlackOps-LMG-Tritanium-Magazin"
  STR_BLACKOPS_LMG_CLIP: "BlackOps-LMG-Magazin"
  STR_BLACKOPS_LMG_UFOPEDIA: "Dieses leichte Maschinengewehr ist mit fortschrittlichen Stabilisatoren und einem integrierten Zweibein ausgeruestet, wodurch automatische Feuerstoesse deutlich praeziser werden. Es verwendet herkoemmliche LMG-Munition.{NEWLINE}{NEWLINE}Voraussetzung fuer den Kauf: Maschinengewehrlizenz, Kontakt: BlackOps Industries."
  STR_BLACKOPS_MAGNUM_UFOPEDIA: "Diese von BlackOps Industries gefertigte Variante des Magnum-Revolvers ist etwas schwerer als das Basismodell, dafuer aber auch praeziser.{NEWLINE}{NEWLINE}Voraussetzung fuer den Kauf: Kontakt: BlackOps Industries und Magnum."
  STR_BLACKOPS_PREMIUM: "BlackOps Premium"
  STR_BLACKOPS_PREMIUM_UFOPEDIA: "Mit wachsendem Einfluss hat BlackOps angeboten, uns auf seine Premium-Kundenliste zu setzen. Das verschafft uns Zugang zu einer breiten Auswahl hochmoderner experimenteller Ausruestung, solange wir mit konkreten Wuenschen an sie herantreten."
  STR_BLACKOPS_SHOTGUN: "BlackOps Shotgun"
  STR_BLACKOPS_SHOTGUN_BUY: "BlackOps Shotgun - Beschaffung"
  STR_BLACKOPS_SHOTGUN_CONT: "BlackOps Shotgun (Fortsetzung)"
  STR_BLACKOPS_SHOTGUN_UFOPEDIA: "Eine verbesserte Version der klassischen Schrotflinte, hergestellt von BlackOps Industries. Ihre Feuerrate wurde drastisch verbessert, waehrend die Genauigkeit nur geringfuegig leidet."
  STR_BLACKOPS_SMARTGUN: "BlackOps Smartgun"
  STR_BLACKOPS_SMARTGUN_UFOPEDIA: "Dieses computergestuetzte Maschinengewehr ist ausserordentlich praezise. Es verwendet normale LMG-Munition.{NEWLINE}{NEWLINE}Voraussetzung fuer den Kauf: Befoerderung III, BlackOps Premium."
  STR_BLACKOPS_SMARTPISTOL: "BlackOps Smart Pistol"
  STR_BLACKOPS_SMARTPISTOL_BUY: "BlackOps Smart Pistol - Beschaffung"
  STR_BLACKOPS_SMARTPISTOL_CLIP: "BlackOps Smart-Pistol-Magazin"
  STR_BLACKOPS_SMARTPISTOL_UFOPEDIA: "Diese Pistole ist mit einem fortschrittlichen Computer und Sensoren ausgestattet, die ihre Genauigkeit deutlich verbessern.{NEWLINE}{NEWLINE}Voraussetzung fuer den Kauf: Befoerderung II, BlackOps Premium."
  STR_BLACKOPS_SMARTRIFLE: "BlackOps Smart Rifle"
  STR_BLACKOPS_SMARTRIFLE_AA_CLIP: "BlackOps Smart-Rifle-Tritanium-Magazin"
  STR_BLACKOPS_SMARTRIFLE_AA_CLIP_MANUFACTURING: "Herstellung: BlackOps Smart-Rifle-Tritanium-Magazin"
  STR_BLACKOPS_SMARTRIFLE_AA_CLIP_XXX: "BlackOps Smart-Rifle-Tritanium-Magazin (x6)"
  STR_BLACKOPS_SMARTRIFLE_BUY: "BlackOps Smart Rifle - Beschaffung"
  STR_BLACKOPS_SMARTRIFLE_CLIP: "BlackOps Smart-Rifle-Magazin"
  STR_BLACKOPS_SMARTRIFLE_UFOPEDIA: "Dieses computergestuetzte Gewehr besitzt eine sehr hohe Feuerrate und eine ausgezeichnete Praezision.{NEWLINE}{NEWLINE}Voraussetzung fuer den Kauf: Befoerderung II, BlackOps Premium."
  STR_BLACKOPS_SNIPER_RIFLE: "BlackOps Sniper Rifle"
  STR_BLACKOPS_SNIPER_RIFLE_AA_CLIP: "BlackOps-Sniper-Rifle-Tritanium-Magazin"
  STR_BLACKOPS_SNIPER_RIFLE_AA_CLIP_MANUFACTURING: "Herstellung: BlackOps-Sniper-Rifle-Tritanium-Magazin"
  STR_BLACKOPS_SNIPER_RIFLE_AA_CLIP_XXX: "BlackOps-Sniper-Rifle-Tritanium-Magazin (x7)"
  STR_BLACKOPS_SNIPER_RIFLE_BUY: "BlackOps Sniper Rifle - Beschaffung"
  STR_BLACKOPS_SNIPER_RIFLE_CLIP: "BlackOps-Sniper-Rifle-Magazin"
  STR_BLACKOPS_SNIPER_RIFLE_UFOPEDIA: "Dieses Praezisionsgewehr ist staerker als ein normales Gewehr und verfuegt ueber ausgezeichnete Zielgenauigkeit. Dafuer ist es schwieriger zu handhaben und besitzt nur eine geringe Feuerrate.{NEWLINE}{NEWLINE}Voraussetzung fuer den Kauf: Befoerderung II, Kontakt: BlackOps Industries."
  STR_BLACKOPS_SPYPISTOL: "BlackOps Spypistol"
  STR_BLACKOPS_SPYPISTOL_AA_CLIP: "BlackOps-Spypistol-Tritanium-Magazin"
  STR_BLACKOPS_SPYPISTOL_AA_CLIP_MANUFACTURING: "Herstellung: BlackOps-Spypistol-Tritanium-Magazin"
  STR_BLACKOPS_SPYPISTOL_AA_CLIP_XXX: "BlackOps-Spypistol-Tritanium-Magazin (x6)"
  STR_BLACKOPS_SPYPISTOL_BUY: "BlackOps Spypistol - Beschaffung"
  STR_BLACKOPS_SPYPISTOL_CLIP: "BlackOps-Spypistol-Magazin"
  STR_BLACKOPS_SPYPISTOL_UFOPEDIA: "Diese kleine, aber vergleichsweise praezise Schusswaffe ist in erster Linie fuer verdeckte Einsaetze gedacht.{NEWLINE}{NEWLINE}Voraussetzung fuer den Kauf: Kontakt: BlackOps Industries."
  STR_BLACK_LOTUS: "Black Lotus"
  STR_BLACK_LOTUS_AFTER_HQ: "Die Goettin spricht"
  STR_BLACK_LOTUS_AFTER_HQ_EVENT: "Black-Lotus-Nachricht abgefangen"
  STR_BLACK_LOTUS_AFTER_HQ_EVENT_DESCRIPTION: "Kommandant, wir haben wichtige interne Kommunikation von Black Lotus entschluesselt. Ich blende sie jetzt ein ..."
  STR_BLACK_LOTUS_AFTER_HQ_UFOPEDIA: "Meine erleuchteten Geschwister!{NEWLINE}Es endet. Unsere Klause ist entdeckt und der Griff zieht sich zu. Bald beginnt die Pruefung. Der Drache wird uns gewiss verschlingen. Doch wir wissen: Dies ist kein Ende, sondern ein Anfang. Sie steht ueber ihnen, und darin liegt die Wahrheit. Wir sind bereit. Lasst uns den kommenden Tagen mit dem Mut begegnen, den sie verlangen.{NEWLINE}Moege die Lady uns sehen."
  STR_BLACK_LOTUS_AFTER_NETWORK: "Die Goettin spricht"
  STR_BLACK_LOTUS_AFTER_NETWORK_EVENT: "Black-Lotus-Nachricht abgefangen"
  STR_BLACK_LOTUS_AFTER_NETWORK_EVENT_DESCRIPTION: "Kommandant, wir haben wichtige interne Kommunikation von Black Lotus entschluesselt. Ich blende sie jetzt ein ..."
  STR_BLACK_LOTUS_AFTER_NETWORK_UFOPEDIA: "Meine erleuchteten Geschwister!{NEWLINE}Leider ist eingetreten, was vorhergesehen wurde. Aus den Schatten heraus schlaegt der Drache zu: in schwarze Schuppen gehuellt, hinter spiegelnden Augen verborgen. Mitglieder unseres aeussersten Kreises verschwinden und hinterlassen nichts als Blutspuren und Zeichen im Staub. Wir sehen sie nicht, wir kennen sie nicht, doch wenn alles weiter seinen Lauf nimmt, ist dies erst der Anfang. Wir muessen uns wappnen.{NEWLINE}Moege die Lady uns sehen."
  STR_BLACK_LOTUS_AFTER_OPERATIONS: "Die Goettin spricht"
  STR_BLACK_LOTUS_AFTER_OPERATIONS_EVENT: "Black-Lotus-Nachricht abgefangen"
  STR_BLACK_LOTUS_AFTER_OPERATIONS_EVENT_DESCRIPTION: "Kommandant, wir haben wichtige interne Kommunikation von Black Lotus entschluesselt. Ich blende sie jetzt ein ..."
  STR_BLACK_LOTUS_AFTER_OPERATIONS_UFOPEDIA: "Meine erleuchteten Geschwister!{NEWLINE}Es geht weiter. Alle Zeichen stehen, wie wir es kennen: Die Reichweite des Drachen waechst. Krieger und Eingeweihte fallen. Unsere geheimen Orte werden entbloesst und gepluendert. Rings um uns schauen die anderen zu und warten. Das Schicksal ist vorerst unausweichlich. Vom blindesten Haupt so grausam geschlagen zu werden, ist eine Demuetigung. Doch noch ist es nicht vorbei. Wenn sie unsere Macht nicht sehen koennen, dann werden wir sie ihnen zeigen.{NEWLINE}Moege die Lady uns sehen."
  STR_BLACK_LOTUS_ASSASSIN: "Black-Lotus-Assassine"
  STR_BLACK_LOTUS_ASSASSIN_ARMOR: "Kampfanalyse: Black-Lotus-Assassine"
  STR_BLACK_LOTUS_ASSASSIN_DESCRIPTION: "Ein Lokalpolitiker in {0}, der mit dem Rat verbuendet war, wurde vor Kurzem ermordet. Nach den vorliegenden Beweisen war ein Agent von Black Lotus der Taeter. Der Rat erwartet von uns, dass sich solche Vorfaelle in Zukunft nicht wiederholen. Die sichergestellte Mordwaffe wurde uns als Mahnung uebergeben und sollte in Kuerze eintreffen.{NEWLINE}[-50 Punkte]"
  STR_BLACK_LOTUS_ASSASSIN_UFOPEDIA: "Assassinen sind die Elite von Black Lotus und werden fuer die haertesten und geheimsten Missionen eingesetzt. Sie leben in Anwesen von Black Lotus, trainieren unablaessig und nehmen an mystischen Ritualen teil. Sie beherrschen die einzigartige und raetselhafte Faehigkeit, aus einiger Entfernung vollstaendig mit ihrer Umgebung zu verschmelzen. Die Assassinen selbst koennen diese Begabung nur als uralte Kunst beschreiben, deren Beherrschung viele Jahre verlangt, doch unsere Tests deuten eher auf einen mentalen Effekt als auf echte Unsichtbarkeit hin. Im Kampf setzen sie vor allem lautlose Waffen wie Schwerter oder Wurfklingen ein."
  STR_BLACK_LOTUS_AVATAR: "Black-Lotus-Avatar"
  STR_BLACK_LOTUS_AVATAR_ARMOR: "Kampfanalyse: Black-Lotus-Avatar"
  STR_BLACK_LOTUS_AVATAR_ARMOR_UFOPEDIA: "Der Black-Lotus-Avatar kann einen Gold-Schild aufrechterhalten (Kapazitaet: 50, Regeneration: 25 pro Runde), der ihn gegen die meisten Angriffe schuetzt."
  STR_BLACK_LOTUS_AVATAR_AUTOPSY: "Autopsie eines Black-Lotus-Avatars"
  STR_BLACK_LOTUS_AVATAR_AUTOPSY_UFOPEDIA: "Diese Kreatur wirkt bis hinunter auf die genetische Ebene vollstaendig menschlich. Zunaechst ist an ihr nichts Besonderes zu erkennen. Deshalb fuehrte ich eine aussergewoehnlich gruendliche Autopsie durch und stellte fest, dass diese Person keinerlei Anzeichen von Krankheit, Fehlbildung oder Alterung aufwies. Volles Gebiss, weiche Fusssohlen - alles deutet auf extreme Jugend und koerperliche Perfektion hin. Danach liess ich die DNA mit unseren Daten abgleichen, und sie gehoerte zu einem maennlichen Buerger aus Kagoshima, 41 Jahre alt, Mitglied von Black Lotus. Irgendwie wurde er zu ... ihr. Wie und warum, wissen wir noch immer nicht."
  STR_BLACK_LOTUS_AVATAR_CORPSE: "Ueberreste eines Black-Lotus-Avatars"
  STR_BLACK_LOTUS_AVATAR_GRAPPLE: "Griff des Black-Lotus-Avatars"
  STR_BLACK_LOTUS_AVATAR_UFOPEDIA: "Der Avatar ist die Stimme der Goettin: ein menschlicher Wirt, der vollstaendig von einem fremden Geist uebernommen und in die Gestalt einer schwebenden Frau umgeformt wurde. Das Wort des Avatars ist fuer die Mitglieder des Kults absolut."
  STR_BLACK_LOTUS_AVATAR_WEAPON: "Waffe des Black-Lotus-Avatars"
  STR_BLACK_LOTUS_FOLLOWER: "Black-Lotus-Anhaenger"
  STR_BLACK_LOTUS_FOLLOWER_ARMOR: "Kampfanalyse: Black-Lotus-Anhaenger"
  STR_BLACK_LOTUS_FOLLOWER_UFOPEDIA: "Diese niederrangigen Mitglieder von Black Lotus sind dem Kult fanatisch ergeben und gut im Nahkampf ausgebildet, auch wenn sie durchaus Feuerwaffen einsetzen. Sie werden aus unterschiedlichen Laendern und sozialen Schichten rekrutiert und fuehren ihr gewoehnliches Leben weiter, um ihre Tarnung nicht zu gefaehrden. Dennoch wirken sie eher wie Moenche als wie normale Buerger. Abgesehen von poetischen Glaubensformeln liefern sie kaum nuetzliche Informationen, doch ihre Hingabe an Black Lotus ist Grund genug, sie festzunehmen."
  STR_BLACK_LOTUS_FOOTMAN: "Black-Lotus-Fusssoldat"
  STR_BLACK_LOTUS_FOOTMAN_ARMOR: "Kampfanalyse: Black-Lotus-Fusssoldat"
  STR_BLACK_LOTUS_FOOTMAN_UFOPEDIA: "Diese Waechter von Verstecken von Black Lotus durchlaufen eine rigorose militaerische Ausbildung. Sie sind ordentlich bewaffnet, doch ihr groesster Vorteil liegt in Tarnung und Heimlichkeit."
  STR_BLACK_LOTUS_GOLDEN_ACADEMY_ESTABLISHED: "Golden Academy gegruendet"
  STR_BLACK_LOTUS_GOLDEN_ACADEMY_ESTABLISHED_DESCRIPTION: "Der Einfluss von Black Lotus waechst stetig. Nun hat die Organisation auch noch eine oeffentliche Fassade unter dem wenig originellen Namen 'Golden Academy' geschaffen. Nach aussen gibt sie sich als Einrichtung zur Foerderung von Bildungs-, Kultur- und Sozialprojekten in Suedostasien und darueber hinaus. Offiziell betreibt sie Schulen, Museen, Forschungseinrichtungen und Waisenhaeuser, und viele Lokalregierungen reagieren bislang ausgesprochen positiv. Doch was geschieht wirklich hinter ihren Mauern? Das wuerde ich nur zu gern wissen! [-250 Punkte]"
  STR_BLACK_LOTUS_HOST: "Black-Lotus-Host"
  STR_BLACK_LOTUS_HOST_ARMOR: "Kampfanalyse: Black-Lotus-Host"
  STR_BLACK_LOTUS_HOST_AUTOPSY: "Autopsie eines Black-Lotus-Hosts"
  STR_BLACK_LOTUS_HOST_AUTOPSY_UFOPEDIA: "Der Koerper dieser Person setzte unmittelbar nach dem Tod einen rapiden Zerfall in Gang und verfluessigte oder verdampfte sich groesstenteils selbst. Zurueck blieben nur Reste auf der Kleidung des Wirts. Diese Biomasse traegt Spuren menschlichen Erbguts. Der rapide Zerfall weist auf eine hochgradig exotische Biochemie hin, die sehr wahrscheinlich durch ein starkes psionisches Feld verursacht wurde."
  STR_BLACK_LOTUS_HOST_CORPSE: "Ueberreste eines Black-Lotus-Hosts"
  STR_BLACK_LOTUS_HOST_UFOPEDIA: "Hexen, die den Hoehepunkt der meditativen Techniken von Black Lotus erreichen, treten durch einen telepathischen Link mit ihrer Goettin in Kontakt. Ist eine solche Hexe besonders kompatibel mit der Golden Lady, kann ihre Abstimmung so weit gehen, dass Koerper und Geist mit dem 'Hoeheren Wesen' verschmelzen. Der daraus hervorgehende Host wird zu einer Erweiterung des goettlichen Willens - faehig, die Welt zugleich mit menschlichen Augen und fremdem Verstand zu sehen. Hosts gelten innerhalb von Black Lotus als geringere Verkoerperungen ihrer Goettin. Ihre Hauptaufgabe besteht darin, die Golden Lady dort zu repraesentieren, wo sich kein echter Avatar manifestieren kann oder soll, und zugleich goettliche Weisheit wie auch Zerstoerung zu verbreiten."
  STR_BLACK_LOTUS_HOST_WEAPON: "Angriff des Black-Lotus-Hosts"
  STR_BLACK_LOTUS_HQ: "Black-Lotus-HQ"
  STR_BLACK_LOTUS_HQ_UFOPEDIA: "Wir wissen inzwischen, dass die Sekte Black Lotus von einer ausserirdischen Intelligenz gegruendet wurde und noch immer direkt von ihr gelenkt wird. Diese Entitaet ist als Golden Lady bekannt und kann sich durch psionische Besitzergreifung koerperlich in ihren Dienern manifestieren. Auch wenn wir ihre wahre Natur noch nicht vollstaendig verstehen, wissen wir inzwischen recht genau, wie sie vorgeht: Sie nutzt einen psionischen Verstaerker, um ihren mentalen Fokus zu buendeln und Menschen in Besitz zu nehmen.{NEWLINE}Dieser Verstaerker befindet sich im Hauptquartier von Black Lotus, im Inneren einer goldenen Statue, die die Golden Lady darstellt. Wenn wir das Geraet bergen, sollten wir sein Signalmuster entschluesseln und einen Weg finden koennen, es zu stoeren. Damit waeren wir in der Lage, dieser ausserirdischen Herrin die Faehigkeit zu nehmen, ihre Diener zu kontrollieren und sich zu manifestieren.{NEWLINE}Wir haben inzwischen genug Aufklaerungsdaten, um das HQ zu lokalisieren und einen guenstigen Zeitpunkt fuer den Schlag zu bestimmen. Rechnen Sie mit starkem Widerstand."
  STR_BLACK_LOTUS_KILLING_INTENT: "Toedliche Absicht"
  STR_BLACK_LOTUS_KILLING_INTENT_DESCRIPTION: "Black Lotus hat in {0} ein geheimes Turnier organisiert, um neue Mitglieder zu rekrutieren und seine Praesenz zu demonstrieren. Die Veranstaltung war ein Erfolg und hat den Einfluss der Gruppe in Teilen der Unterwelt vergroessert. Solche Machtdemonstrationen unserer erklaerten Feinde muessen wir kuenftig verhindern.{NEWLINE}[-175 Punkte]"
  STR_BLACK_LOTUS_MANDARIN: "Black-Lotus-Mandarin"
  STR_BLACK_LOTUS_MANDARIN_ARMOR: "Kampfanalyse: Black-Lotus-Mandarin"
  STR_BLACK_LOTUS_MANDARIN_UFOPEDIA: "Reiche Vertreter ostasiatischer Wirtschafts-, Verbrechens- und Politikeliten mit engen Verbindungen zu Black Lotus. Im Gegenzug fuer ihre Foerderung bietet Black Lotus ihnen verschiedene Dienste an, darunter auch psionische Ausbildung. Unterschaetzen Sie ihr Kung-Fu nicht."
  STR_BLACK_LOTUS_MASHINOBI: "Mashinobi"
  STR_BLACK_LOTUS_MASHINOBI_ARMOR: "Kampfanalyse: Mashinobi"
  STR_BLACK_LOTUS_MASHINOBI_UFOPEDIA: "Diese Cyborgs sind aufgeruestete Krieger von Black Lotus, die nun fuer die Restkraefte des Kults kaempfen. Sie sind hervorragend ausgebildete Kampfspezialisten und koennen es mit den besten Nahkaempfern aufnehmen. Ausserdem agieren sie ausgesprochen unauffaellig, besonders bei Tageslicht."
  STR_BLACK_LOTUS_NETWORK: "Black-Lotus-Netzwerk"
  STR_BLACK_LOTUS_NETWORK_UFOPEDIA: "Die Aktivitaeten von Black Lotus beschraenken sich nicht auf Aussenposten; das eigentlich Interessante beginnt erst eine Stufe darueber, in ihren dauerhaften Verstecken. Diese Gebaeude gehoeren auf dem Papier verschiedenen Organisationen, stehen in Wirklichkeit aber ausschliesslich im Dienst von Black Lotus. Sie dienen als lokale Datenzentren, Ausbildungsstaetten und Lager. Das ist unsere Chance, ein hoeherrangiges Mitglied dieses Kults zu fassen - allerdings duerften solche Orte von gut ausgebildeten Leibwaechtern geschuetzt werden."
  STR_BLACK_LOTUS_OPERATIONS: "Black-Lotus-Operationen"
  STR_BLACK_LOTUS_OPERATIONS_UFOPEDIA: "Kommandant, ein Netzwerk dubioser ostasiatischer Unternehmen zu infiltrieren war nicht einfach, aber durchaus aufregend. Jedenfalls haben wir nun Zugriff auf einige ihrer vertraulichen Quellen, vor allem Rechner, Server und aehnliches, und koennen uns ein Bild davon machen, wo ihre Anfuehrer leben koennten. Datenanalyse ist nie perfekt, doch wir haben inzwischen eine reale Chance, ein hochrangiges Mitglied von Black Lotus zu orten, wenn es eine E-Mail empfaengt oder mit einem uns bekannten Konto Lebensmittel bezahlt. Ich habe unser Hackerteam konsultiert - also mich selbst - und wir sind einsatzbereit!{NEWLINE}{NEWLINE}{NEWLINE}Ausserdem werden wir uns von nun an nicht mehr mit Unterschluepfen von Black Lotus aufhalten; solche Aufgaben gehen kuenftig an die Rats-Bergungstrupps."
  STR_BLACK_LOTUS_PARTY: "Black-Lotus-Empfang"
  STR_BLACK_LOTUS_PARTY_BRIEFING: "Es findet ein Treffen auf hoechster Ebene zwischen Black Lotus und einigen ihrer wohlhabenden Foerderer statt. Das ist eine gute Gelegenheit, beide Seiten gleichzeitig hochzunehmen, die Operationen von Black Lotus zu stoeren und unsere eigenen Ziele voranzubringen. Falls etwas schiefgeht, bleibt nur die Flucht ueber das Dach. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen in die Ausgangszone zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_BLACK_LOTUS_PARTY_DESCRIPTION: "Es findet ein Treffen auf hoechster Ebene zwischen Black Lotus und einigen ihrer wohlhabenden Foerderer statt. Das ist eine gute Gelegenheit, beide Seiten gleichzeitig hochzunehmen, die Operationen von Black Lotus zu stoeren und unsere eigenen Ziele voranzubringen.{NEWLINE}Der gesamte Einsatz spielt sich innerhalb eines Gebaeudes ab. Rechnen Sie mit intensiven Gefechten auf kurze Distanz gegen Kraefte von Black Lotus. Falls etwas schiefgeht, bleibt nur die Flucht ueber das Dach."
  STR_BLACK_LOTUS_PROTESTED_TOO_MUCH: "Zu laut protestiert"
  STR_BLACK_LOTUS_PROTESTED_TOO_MUCH_DESCRIPTION: "Agenten von Black Lotus haben einen Politiker aus {0} ermordet, der ihren Geheimnissen zu eifrig nachging. Das daraus entstandene politische Chaos hat dem Rat ganz und gar nicht gefallen.{NEWLINE}[-175 Punkte]"
  STR_BLACK_LOTUS_PSI_GENERATOR: "Black-Lotus-Psi-Generator"
  STR_BLACK_LOTUS_PSI_GENERATOR_UFOPEDIA: "Dieses seltsame Geraet war in die Avatar-Statue der Hauptbasis von Black Lotus eingebaut. Es dient dazu, psionische Wellen aus einem Punkt im Weltraum zu empfangen und zu verstaerken und so die 'Besessenheit' von Menschen durch die Goettin zu ermoeglichen.{NEWLINE}Auch wenn wir seine genaue Funktionsweise nicht vollstaendig verstehen, koennten wir ihn theoretisch dazu nutzen, solche psionischen Wellenfronten zu orten. Gelingt uns das, waere Black Lotus als Organisation praktisch ausgeschaltet, denn die Gruppe koennte ihre Herrin nicht mehr kontaktieren, ohne dass wir es sofort bemerken."
  STR_BLACK_LOTUS_RATIONALE: "Black Lotus: Beweggruende"
  STR_BLACK_LOTUS_RATIONALE_UFOPEDIA: "Fuer einen religioesen Kult ist die Agenda von Black Lotus erstaunlich pragmatisch - zumindest bei jenen Mitgliedern, die nicht ununterbrochen dem Willen ihrer Goettin ausgesetzt sind. Die Menschheit steht allein gegen eine gewaltige Schar von Feinden, von denen viele weder wir noch Black Lotus ohne Hilfe von aussen wirklich verstehen oder bekaempfen koennen.{NEWLINE}Die Golden Lady stellt aus ihrer Sicht genau eine solche Hilfe dar.{NEWLINE}Auch wenn sie ihre Anhaenger eher als Spielzeug betrachtet, hat sie doch mehrere Mittel geliefert, um eine wirksamere Antwort auf die Feinde der Menschheit zu organisieren: psionisches Training, das in fernoestliche Meditations- und Kampftraditionen eingebettet und an sie angepasst wurde.{NEWLINE}Fuer jene, die nicht psionisch von ihrer Goettin beherrscht werden, erscheint sie daher als das geringere von zwei - oder sogar mehreren - Uebeln."
  STR_BLACK_LOTUS_RETALIATION: "Vergeltung von Black Lotus"
  STR_BLACK_LOTUS_SHADOW: "Der Schatten von Black Lotus"
  STR_BLACK_LOTUS_SHADOW_DESCRIPTION: "So schwer fassbar das Netzwerk von Black Lotus auch bleibt, sein Einfluss auf die Welt waechst stetig. In {0} hat die Organisation kuerzlich genug Unterstuetzung gesammelt, um sich erhebliches politisches Gewicht zu sichern. Unsere Foerderer sind zutiefst beunruhigt.{NEWLINE}[-300 Punkte]"
  STR_BLACK_LOTUS_SHRINE: "Die Wurzel allen Uebels"
  STR_BLACK_LOTUS_SHRINE_BRIEFING: "Tief im Dschungel liegt ein versteckter Schrein von Black Lotus, der ihrer Goettin geweiht ist. Dem Kult zufolge ist dies der Ort, an dem sie einst von den Sternen fiel. Das Gebiet ist unbewohnt, wimmelt jedoch von Patrouillen von Black Lotus. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_BLACK_LOTUS_SHRINE_DESCRIPTION: "Tief im Dschungel liegt ein versteckter Schrein von Black Lotus, der ihrer Goettin geweiht ist. Dem Kult zufolge ist dies der Ort, an dem sie einst von den Sternen fiel. Das Gebiet ist unbewohnt, wimmelt jedoch von Patrouillen von Black Lotus."
  STR_BLACK_LOTUS_SHRINE_EXPLORED: "Black-Lotus-Schrein erkundet."
  STR_BLACK_LOTUS_STORMCLOUD: "Black-Lotus-Stormcloud"
  STR_BLACK_LOTUS_STORMCLOUD_ARMOR: "Kampfanalyse: Black-Lotus-Stormcloud"
  STR_BLACK_LOTUS_STORMCLOUD_AUTOPSY: "Untersuchung eines Black-Lotus-Stormcloud-Wracks"
  STR_BLACK_LOTUS_STORMCLOUD_AUTOPSY_UFOPEDIA: "Dieses automatisierte Fahrzeug wurde vollstaendig aus irdischen Materialien hergestellt, doch der Fertigungsprozess scheint unserer Technologie deutlich voraus zu sein. Die einzige wirklich ausserirdische Komponente ist eine optronische Verarbeitungseinheit. Der Stormcloud nutzt Hochleistungsbatterien, um in Betrieb zu bleiben, weshalb seine Einsatzdauer fuer X-Com letztlich zu gering ausfaellt."
  STR_BLACK_LOTUS_STORMCLOUD_CANNON: "Black-Lotus-Stormcloud-Kanone"
  STR_BLACK_LOTUS_STORMCLOUD_CORPSE: "Black-Lotus-Stormcloud-Wrack"
  STR_BLACK_LOTUS_STORMCLOUD_UFOPEDIA: "Ein automatisiertes Allterrain-Kampffahrzeug: schnell, robust und gut gepanzert. Es ist mit einer leistungsstarken Laserkanone bewaffnet. Die Hauptaufgabe des Stormcloud ist die Sicherung des Perimeters."
  STR_BLACK_LOTUS_UFOPEDIA: "Black Lotus ist eine hochgradig verschlossene spirituelle Gesellschaft, die in Ostasien unter Reichen wie Armen Anhaenger hat. Ihre Mitglieder behaupten, eine Art 'Goettin der Morgenroete' zu verehren - ein uebernatuerliches Wesen, das ihnen persoenlich erscheint, um sie auf mystische Weise 'mit Frieden zu erfuellen'. Black Lotus sammelt seit Jahrzehnten Macht an und ist reich genug, Maerkte zu beeinflussen und sogar Regierungen zu destabilisieren. Viele Aktivitaeten dieses Kults sind illegal und folgen dem Willen unbekannter Maechtiger. Das kann nicht hingenommen werden."
  STR_BLACK_LOTUS_WARRIOR: "Black-Lotus-Krieger"
  STR_BLACK_LOTUS_WARRIOR_ARMOR: "Kampfanalyse: Black-Lotus-Krieger"
  STR_BLACK_LOTUS_WARRIOR_UFOPEDIA: "Diese Kaempfer werden aus den niederrangigen Anhaengern ausgewaehlt und zusaetzlich geschult, um ihre Kampf- und Spionagefaehigkeiten zu steigern. Es ist fuer sie Brauch, ihren eigenen Tod vorzutaeuschen, um die Bindungen an ihr frueheres Leben zu kappen, und ausserhalb ihrer Missionen treten sie nur selten mit normalen Buergern in Kontakt. Krieger von Black Lotus sichern Unterschlupfe, sammeln Informationen und fuehren Attentate aus. Auch wenn sie meist nicht schwer bewaffnet sind, muessen wir ihre Faehigkeiten und ihre Moral sehr ernst nehmen."
  STR_BLACK_LOTUS_WAR_WITCH: "Black-Lotus-Kriegshexe"
  STR_BLACK_LOTUS_WAR_WITCH_ARMOR: "Kampfanalyse: Black-Lotus-Kriegshexe"
  STR_BLACK_LOTUS_WAR_WITCH_ARMOR_UFOPEDIA: "Kriegshexen von Black Lotus tragen ein Geraet, das ihnen hilft, einen psionischen Schild vom Typ Gold zu projizieren (Kapazitaet: 40, Regeneration: 20 pro Runde)."
  STR_BLACK_LOTUS_WAR_WITCH_UFOPEDIA: "Kriegshexen sind eine neue Generation psionischer Kaempferinnen von Black Lotus. Sie werden unter den besten Schuelern der Golden Academy ausgewaehlt und gruendlich in Psionik, Kampfkuensten und moderner Gefechtstaktik ausgebildet. Dank Polymerpanzerung und Kraftfeld sind sie gegen gewoehnliches Handfeuer nahezu immun. Ihre psi-verstaerkten Kampffaehigkeiten uebertreffen die konventioneller Spezialeinheiten deutlich, und ihre fanatische Hingabe an den Kult ist unerschuetterlich."
  STR_BLACK_LOTUS_WITCH: "Black-Lotus-Hexe"
  STR_BLACK_LOTUS_WITCH_ARMOR: "Kampfanalyse: Black-Lotus-Hexe"
  STR_BLACK_LOTUS_WITCH_UFOPEDIA: "Die sogenannten Hexen sind hochrangige Mitglieder von Black Lotus, die zugleich lokale Kommandeurinnen und Repraesentantinnen des Kults in der gehobenen Gesellschaft sind. Sie verfuegen ueber besondere mentale Faehigkeiten, mit denen sie spezielle Geraete bedienen koennen, deren Bauplaene dem Kult angeblich von seiner 'Goettin' uebermittelt wurden. Zusaetzlich koennen sie einen telekinetischen Schutzschild gegen Handfeuerwaffen aufrechterhalten. Sie sind gut informiert, fuer viele Verbrechen des Kults verantwortlich und damit vorrangige Ziele fuer Festnahmen."
  STR_BLACK_MOON_BRIEFING: "Ungewohnliche Werkatzen-Aktivitat findet in diesem Siedlungsgebiet statt. Sichern Sie den Ort und beschutzen Sie die Burger. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_BLACK_SPHERE_REPORT: "Bericht zur Schwarzen Sphaere"
  STR_BLACK_SPHERE_REPORT_UFOPEDIA: "Was immer diese Sphaere auch sein mag, sie wirkt wie eine Art Matrix - ein analoger Datenprozessor, der bestimmte Muster in anderen psionischen Entitaeten innerhalb seiner Reichweite auspraegt. Zudem kann das Artefakt seine psionischen Schwingungen an die Frequenz anderer Wesen angleichen und so Informationen mit ihnen austauschen. Was bedeutet das konkret? Kurz gesagt beeinflusst die Sphaere Lebewesen in ihrer Naehe: langsam, schrittweise, aber bestaendig veraendert sie ihre psionischen Muster. Wir wissen nicht, ob die Opfer rein zufaellig betroffen sind oder ob die Sphaere sie gezielt auswaehlt, doch ihre Hirnaktivitaet - und in der Folge auch ihr Verhalten - beginnt in eine, nun ja, ausgesprochen beunruhigende Richtung abzudriften. Dieser psionische Effekt ist gefaehrlich, laesst sich mit spezieller Ausruestung jedoch abschirmen. Es sollte also keine weiteren ... Zwischenfaelle mehr geben. Bleibt die Frage: Was machen wir nun mit diesem Wissen?"
  STR_BLACK_SUN_UFOPEDIA: "Die Schwarze Sonne ist eine Mond-Gesellschaft, die von einem geheimen Nazi-Weltraumprogramm gefuhrt von Thule-Magiern abstammt. Sie leben in straffer Organisation, jedes Mitglied muss eine gegebene Rolle fullen, und Beforderung ist die grote Belohnung. Ihre Kultur basiert auf einer Mischung aus bizarrer, selbst-verherrlichender Religion und fanatischem Personenkult. Die Gesellschaft wird vom Erzmeister gefuhrt, ein auf Lebenszeit gewahlter Funktionar, der immense mystische Krafte haben soll. Die meisten Mitglieder werden in Mondkolonien durch kunstliche Befruchtung geboren. Diese Sekte is gegenwartig fixiert auf das Uberleben der menschlichen Rasse im Angesicht auerer Bedrohungen, mittels Militarisierung und Gen-Manipulation, und behauptet, dass die gegenwartigen Herrscher zu ineffektiv seien. Um auerste Geheimhaltung zu wahren, kontaktieren sie die Erde selten direkt und arbeiten durch Vertreter, vor allem das Syndikat."
  STR_BLANKS: "Leeres Inventar"
  STR_BLOOD_MOON_BRIEFING: "Ungewohnliche Werwolf-Aktivitat findet in diesem Siedlungsgebiet statt. Sichern Sie den Ort und beschutzen Sie die Burger. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_BLOOD_PLASMA_EXTRACTION_CHUPACABRA: "Blutplasma: Leichen von Chupacabras"
  STR_BLOOD_PLASMA_EXTRACTION_CHUPACABRA_LIVING: "Blutplasma: Lebende Chupacabra"
  STR_BLOOD_PLASMA_EXTRACTION_FENRIR: "Blutplasma: Leiche eines Fenrir-Wolfs"
  STR_BLOOD_PLASMA_EXTRACTION_FENRIR_LIVING: "Blutplasma: Lebender Fenrir-Wolf"
  STR_BLOOD_PLASMA_EXTRACTION_MEGAZOMBIE: "Blutplasma: Leiche eines Megazombies"
  STR_BLOOD_PLASMA_EXTRACTION_MEGAZOMBIE_LIVING: "Blutplasma: Lebender Megazombie"
  STR_BLOOD_PLASMA_EXTRACTION_MONGORN: "Blutplasma: Leiche eines Mongorn"
  STR_BLOOD_PLASMA_EXTRACTION_MONGORN_LIVING: "Blutplasma: Lebender Mongorn"
  STR_BLOOD_PLASMA_EXTRACTION_STRIX: "Blutplasma: Leiche einer Strix"
  STR_BLOOD_PLASMA_EXTRACTION_STRIX_LIVING: "Blutplasma: Lebende Strix"
  STR_BLOOD_PLASMA_EXTRACTION_TOMB_GUARD: "Blutplasma: Leiche eines Grabwaechters"
  STR_BLOOD_PLASMA_EXTRACTION_TOMB_GUARD_FEMALE_LIVING: "Blutplasma: Lebende Grabwaechterin"
  STR_BLOOD_PLASMA_EXTRACTION_TOMB_GUARD_MALE_LIVING: "Blutplasma: Lebender Grabwaechter"
  STR_BLOOD_PLASMA_EXTRACTION_WEREWOLF: "Blutplasma: Leiche eines Werwolfs"
  STR_BLOOD_PLASMA_EXTRACTION_WEREWOLF_LIVING: "Blutplasma: Lebender Werwolf"
  STR_BLOOD_PLASMA_EXTRACTION_WHITE_WEREWOLF_LIVING: "Blutplasma: Lebender Alpha-Werwolf"
  STR_BLOOD_PLASMA_EXTRACTION_ZOMBIE_BOOMER: "Blutplasma: Leiche eines Sprengzombies"
  STR_BLOOD_PLASMA_EXTRACTION_ZOMBIE_BOOMER_LIVING: "Blutplasma: Lebender Sprengzombie"
  STR_BLOOD_PLASMA_EXTRACTION_ZOMBIE_GRUBAS: "Blutplasma: Leiche eines Fetten Zombies"
  STR_BLOOD_PLASMA_EXTRACTION_ZOMBIE_GRUBAS_LIVING: "Blutplasma: Lebender Fetter Zombie"
  STR_BLOOD_PLASMA_EXTRACTION_ZOMBIE_INFECTOR: "Blutplasma: Leiche eines Zombie-Infektors"
  STR_BLOOD_PLASMA_EXTRACTION_ZOMBIE_INFECTOR_LIVING: "Blutplasma: Lebender Zombie-Infektor"
  STR_BLOOD_PLASMA_EXTRACTION_ZOMBIE_STERILE: "Blutplasma: Leiche eines Zombies"
  STR_BLOOD_PLASMA_EXTRACTION_ZOMBIE_STERILE_LIVING: "Blutplasma: Lebender Zombie"
  STR_BLOOD_PLASMA_EXTRACTION_ZOMBIE_TROOPER: "Blutplasma: Leiche eines Zombie-Trupplers"
  STR_BLOOD_PLASMA_EXTRACTION_ZOMBIE_TROOPER_1_LIVING: "Blutplasma: Lebender Zombie-Truppler"
  STR_BLOOD_PLASMA_EXTRACTION_ZOMBIE_TROOPER_2_LIVING: "Blutplasma: Lebender angeschlagener Zombie-Truppler"
  STR_BOMB_TERROR_DESCRIPTION: "{0} wurde heute von einer Explosion erschuettert, die schwere Sachschaeden verursachte und mehrere Menschenleben kostete. Obwohl die Taeter unbekannt sind, legt uns der Rat den Vorfall als Unfaehigkeit aus.{NEWLINE}[-150 Punkte]"
  STR_BRAINSUCKED_PROPHET: "Brainsucked-Prophet"
  STR_BRAINSUCKED_PROPHET_ARMOR: "Kampfanalyse: Brainsucked-Prophet"
  STR_BRAINSUCKED_PROPHET_UFOPEDIA: "Diese Person wurde in einem derart grotesken Ausmass veraendert, dass unklar bleibt, ob diese Form beabsichtigt war, ein fehlgeschlagenes Experiment darstellt oder irgendwo dazwischen liegt. Die einzige verfuegbare Kommunikationsform scheint Telepathie zu sein, doch das Wesen errichtet formidable Abwehrmechanismen und stellt seine biologischen Funktionen ein, sofern man dies nicht pharmakologisch verhindert."
  STR_BRAINSUCKED_TECHNOMAD: "Brainsucked-Technomad"
  STR_BRAINSUCKED_TECHNOMAD_ARMOR: "Kampfanalyse: Brainsucked-Technomad"
  STR_BRAINSUCKED_TECHNOMAD_UFOPEDIA: "Einst rebellische Wissenschaftler und Kolonisten zwischen den Ebenen, waren diese Individuen viel zu lange auf einem Alienplaneten gestrandet. Heute sind sie nur noch Verlaengerungen des Willens jener seltsamen Welt, waehrend von ihrer Menschlichkeit kaum mehr etwas uebrig ist. Mit Alienwaffen bewaffnet schlagen sie aus dem Schatten gegen ahnungslose Menschen zu."
  STR_BRASS_KNUCKLES: "Schlagring"
  STR_BRASS_KNUCKLES_UFOPEDIA: "Ein Satz zusammengeschweisster Ringe, der an den Fingern getragen wird, um die Schlagkraft zu erhoehen. Eines der aeltesten Waffendesigns, die weltweit noch immer in Gebrauch sind - vor allem im 'Strassenkampf'."
  STR_BREAKDOWN_STR_HEAVY_PLASMA_CLIP: "D/A: Schwerer-Plasma-Clip"
  STR_BREAKDOWN_STR_HUMAN_SONIC_HEAVY_CANNON_FOCUSED_CLIP: "D/A: Schwerer-Kanonen-Fokus-Clip"
  STR_BREAKDOWN_STR_KLEIN_BOTTLE_GRENADE: "D/M: Klein-Bottle-Granate"
  STR_BREAKDOWN_STR_LAUNCHER_ELERIUM: "D/A: E-115-46mm-Granate"
  STR_BREAKDOWN_STR_MILKOR_MGL_CLIP_ELERIUM: "D/A: E-115-Milkor-MGL-Clip"
  STR_BREAKDOWN_STR_PLASMA_SNIPER_RIFLE_CLIP: "D/A: Plasma-Scharfschuetzen-Clip"
  STR_BRIGHT_IN_THE_NIGHT_DESCRIPTION: "Nach einem Sturm fiel in {0} grossflaechig der Strom aus - nur ein einzelnes Gebiet blieb weiterhin hell erleuchtet. Nach einer Untersuchung durch den Rat wurde die Energiequelle entdeckt: Offenbar handelt es sich um eine Art Labor, das in grosser Hast verlassen wurde.{NEWLINE}[UFO-Energiequelle x1, Organprobe x1, Toter Zivilist x5 erhalten]"
  STR_BROTHER_OF_APOCALYPSE_ARMOR: "Kampfanalyse: Bruder der Apokalypse"
  STR_BROTHER_OF_APOCALYPSE_UFOPEDIA: "An diesem Mann ist etwas Unmenschliches - und zwar nicht die ausserirdische Art. Seine Augen brennen vor intensiver, archaischer Leidenschaft. Brueder der Apokalypse werden aus den Aermsten der Erde ausgewaehlt und zu fanatischen Missionaren von Chaos und Zerstoerung geformt. Sie sind in ihrem Evangelium gut unterrichtet und sollen das Feuer der Rebellion unter den unzufriedenen Massen schueren. Zugleich zeigen sie aussergewoehnliche Loyalitaet gegenueber ihren geheimnisvollen Oberen sowie grosse Zaehigkeit und Widerstandsfaehigkeit im Kampf."
  STR_BUG_EYE_GHOST: "Bug Eye Ghost"
  STR_BUG_EYE_GHOST_ARMOR: "Kampfanalyse: Bug Eye Ghost"
  STR_BUG_EYE_GHOST_UFOPEDIA: "Diese boshafte Erscheinung ist in Wahrheit ein Knoten psionischer Energie, der sich als 'Kreatur' manifestiert. Sie besteht groesstenteils aus Energie und ignoriert die meisten Umweltgefahren, abgesehen von heftigen Energieentladungen und Psi-Angriffen. Geist im eigentlichen Sinn besitzt sie nicht, doch sie nimmt menschliche Verstaende wahr und jagt deren Psi-Energie. Fuer das Opfer ist das aeusserst unangenehm und mitunter toedlich. Um die Klassiker zu zitieren: Es ist Leben, aber nicht so, wie wir es kennen."
  STR_BULLFROG_AUTOPSY_UFOPEDIA: "Dieses riesige, froschartige Exemplar ist entweder eine unentdeckte Spezies oder ein kunstlich geschaffener Organismus. Anders als die groen Amphibien der Urzeit, zeigt diese Kreatur Anzeichen eines schnellen Stoffwechsels, was erklart, wie es in irdischem Umfeld leben und gedeihen kann. Spuren einer auerst energetischer chemischer Verbindung wurden in seinem Blut gefunden."
  STR_BUY_BLACK_LOTUS_WEAPONS: "Bei Black-Lotus-Zulieferern einkaufen"
  STR_BUY_BLACK_LOTUS_WEAPONS_UFOPEDIA: "Black Lotus ist zwar nicht so gut mit militaerischen Waffen versorgt wie viele andere Organisationen, denen wir begegnen, doch das vorhandene Material ist meist von hoher Qualitaet. Wir haben beschlossen, ihrem Beispiel zu folgen und dieselben Waffenhaendler mit einem Kaufangebot zu kontaktieren - und das Angebot wurde akzeptiert. Wir koennen die Vereinbarung nun abschliessen.{NEWLINE}Selbstverstaendlich ist das ein glasklarer Gesetzesverstoss, also bereiten Sie sich darauf vor, ihn dem Rat am Monatsende zu erklaeren. [-50 Punkte]"
  STR_BUY_CHURCH_OF_DAGON_WEAPONS: "Bei Ausruestern der Kirche Dagons einkaufen"
  STR_BUY_CHURCH_OF_DAGON_WEAPONS_UFOPEDIA: "Der Rat zoegert weiterhin, uns den Kauf echter Militaerausruestung zu genehmigen, obwohl die Kirche Dagons an keine vergleichbaren Beschraenkungen gebunden ist. Anstatt uns darueber zu aergern, koennen wir den gleichen Markt nutzen wie unser Feind. Mit oder ohne den Segen des Rates haben wir damit Zugriff auf Waffen, die die Kirche Dagons regelmaessig beschafft.{NEWLINE}Der Rat wird sich natuerlich beschweren... [-50 Punkte]"
  STR_BUY_EXALT_WEAPONS: "Bei EXALT-Zulieferern einkaufen"
  STR_BUY_EXALT_WEAPONS_UFOPEDIA: "Die sorgfaeltige Untersuchung der EXALT-Waffenversorgung hat uns zu ihren Auftragnehmern gefuehrt. Erwartungsgemaess interessieren sich diese Leute weder fuer Politik noch fuer Religion oder gar fuer Ausserirdische - sie interessieren sich nur fuer Geld. Und davon haben wir reichlich, weshalb es nicht allzu schwer war, uns in ihre Kundenliste aufnehmen zu lassen. Wir koennen nun die Beschaffung verschiedener Waffentypen aushandeln.{NEWLINE}Der Rat wird darueber murren, dass wir hinter seinem Ruecken Geschaefte abschliessen, doch da es sich bei diesen Waffen um ganz gewoehnliche Modelle handelt, sollte das am Ende keine allzu grosse Sache werden. [-50 Punkte]"
  STR_BUY_ZSRR_WEAPONS: "Bei Ausruestern der Morgenroete einkaufen"
  STR_BUY_ZSRR_WEAPONS_UFOPEDIA: "Wir nutzen bereits Waffen, die wir verhafteten Feinden abgenommen haben, obwohl wir dafuer keinerlei Freigabe besitzen, und niemand im Rat greift ein. Es sollte also keinen allzu grossen Unterschied machen, wenn wir noch einen Schritt weitergehen und direkt mit den Ausruestern der Kultisten reden, richtig? Wir haben nun Zugang zu Waffen, die von der Morgenroete haeufig beschafft werden.{NEWLINE}Der Rat wird uns dafuer vermutlich die Ohren langziehen, doch es liegt im Interesse aller, dass wir gut versorgt bleiben. [-50 Punkte]"
  STR_CALL_OF_TLETH: "Ruf von T'leth"
  STR_CALL_OF_TLETH_UFOPEDIA: "Wenn Deep Ones etwas benoetigen, suchen sie den naechsten Aussenposten auf und rufen nach Hilfe. Wir verstehen inzwischen, wie ihr Kommunikationsgeraet funktioniert. Wenn wir eine gefaelschte Nachschubanfrage aussenden, sollten ihre Vorgesetzten auftauchen - nur um dann in unsere Haende zu fallen."
  STR_CARAPACE_PLATE_UFOPEDIA: "Diese erstaunlich widerstandsfahige Riesenkaferpanzer sind zu klein, um sie zu verarbeiten, aber mit der richtigen elektrischen und chemischen Stimulation eines Zombie-Parasiten konnen wir sie dazu zwingen, in ein spezielles Durafaden-Gerust hineinzuwachsen! Nicht auf die Groe einer Korperrustung, aber ausgewahlte Verstarkung der verletzlichsten Punkte verbessert die Resistenz gegen Schockwellen.{NEWLINE}Verringert erhaltenen Schockwellenschaden um bis zu 1/5, bis zu einer Maximal-Resistenz von 50%."
  STR_CARCHARODON_AUTOPSY_UFOPEDIA: "Diese Kreatur ist gegen die Cybernetik von T'leth ungewoehnlich widerstandsfaehig. Obwohl ihr Koerper mehr als ein Dutzend cybernetischer Verbesserungen aufweist, funktionieren die meisten davon nur teilweise, insbesondere die MC-Implantate im Schaedel. Offenbar ist das eine Nebenwirkung ihrer starken regenerativen Faehigkeiten: Das Fleisch beginnt die Implantate mit der Zeit abzustossen. Diese Probleme deuten darauf hin, dass es sich bei dieser Spezies um eine vergleichsweise junge Entwicklung handelt."
  STR_CARCHARODON_FERAL_AUTOPSY_UFOPEDIA: "Diese seltsame Kreatur, offenbar ein Versuch, menschliche DNS mit der eines Hais zu mischen, hat eine Haut aus einem stahlharten biologischen Polymer aus Aqua-Plastik. Dieses Exemplar hat keine der kybernetischen Eingriffe typisch fur Dagon-verknupfte Organismen."
  STR_CARCHARODON_HUNT_BRIEFING: "Berichte tropfeln ein uber seltsame Kreaturen, als 'Hai-Leute' beschrieben, die Kustengebiete heimsuchen. Finden und fangen Sie eines dieser fremden Wesen, bevor sie Schwimmer oder Frachtschiffe bedrohen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_CARCHARODON_USO_HEAVY_CRUISER: "Schwerer T'leth-Kreuzer"
  STR_CARCHARODON_USO_HEAVY_CRUISER_BRIEFING: "Unsere Freunde bei Hydrospace Dynamics wurden von einem Begleitschiff angegriffen, als sie einen Versorgungskreuzer zur Landung zwingen wollten. Letzterer ist entkommen, aber das Begleitschiff wurde abgeschossen. Unser Ziel ist, das Objekt anzugreifen und so viel aquatische Technologie und so viele Gefangene wie moglich zu erbeuten. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_CAREERS_UC: "KARRIEREN"
  STR_CAREER_ADEPT: "Adept"
  STR_CAREER_ADEPT_UFOPEDIA: "Diese Person erforschte einst die Grenzen des menschlichen Bewusstseins durch Mystik, ESP oder aehnliche Praktiken. Damit war sie erfolgreich, was sie schliesslich zu uns fuehrte.{NEWLINE}{NEWLINE}+3 Psi-Faehigkeit, +1 Gesundheit, +1 Geisteskraft"
  STR_CAREER_ARISTOCRAT: "Aristokrat"
  STR_CAREER_ARISTOCRAT_UFOPEDIA: "Dieser Agent wurde in beste Verbindungen hineingeboren und verbrachte einen grossen Teil seines Lebens Schulter an Schulter mit den Eliten der Welt. Dadurch erfuhr er vieles, was der Oeffentlichkeit verborgen bleibt. Als integere Person entschied er sich, uns beim Erhalt der Weltordnung zu helfen.{NEWLINE}{NEWLINE}+2 Psi-Staerke, +2 Nahkampf"
  STR_CAREER_ASTRONAUT: "Astronaut"
  STR_CAREER_ASTRONAUT_UFOPEDIA: "Diese Person arbeitete fuer eine Raumfahrtagentur und war vielleicht sogar selbst im All. Dabei kam sie mit ungewoehnlichen Phaenomenen in Kontakt, und ihre Ausbildung macht sie fuer das X-Com-Programm nuetzlich.{NEWLINE}{NEWLINE}+2 Gesundheit, +2 Reaktionen, +1 Moral-Erholung"
  STR_CAREER_ASTRONOMER: "Astronom"
  STR_CAREER_ASTRONOMER_UFOPEDIA: "Der Nachthimmel war das ganze Leben dieser Person, bis sie Himmelsphaenomene beobachtete, die sich mit konventioneller Wissenschaft nicht erklaeren liessen. Sie trat X-Com bei, um mehr zu erfahren.{NEWLINE}{NEWLINE}+2 Nachtsicht, -6 Geisteskraft"
  STR_CAREER_ATHLETE: "Athlet"
  STR_CAREER_ATHLETE_UFOPEDIA: "Diese Person hatte frueher eine Sportkarriere, sei es im Fussball, Bogenschiessen, Snooker oder HEMA. Als sie ueber die globale Geheimhaltung stolperte, nahm sie es als neue Herausforderung an und trat X-Com bei.{NEWLINE}{NEWLINE}+5 Wurf"
  STR_CAREER_BODYGUARD_UFOPEDIA: "Diese Person schuetzte frueher wichtige Persoenlichkeiten vor allen erdenklichen Bedrohungen. Wie sich herausstellte, waren manche Bedrohungen nicht das, was man erwartet, und so wurde ihr ein Teil der globalen Verschwoerung sichtbar. Schliesslich trat sie X-Com bei, um ihre Faehigkeiten fuer einen groesseren Zweck einzusetzen.{NEWLINE}{NEWLINE}+3 Staerke, +3 Reaktionen"
  STR_CAREER_COACH: "Trainer"
  STR_CAREER_COACH_UFOPEDIA: "Die Aufgabe dieser Person war es, anderen bei ihren Problemen zuzuhoeren und ihnen aus der Patsche zu helfen. Aber was, wenn diese Probleme nicht von dieser Welt sind? Diese Person nimmt auch das gern an. X-Com-Agent zu werden ist ein seltsamer Weg, aber hier sind wir nun.{NEWLINE}{NEWLINE}+3 Moral-Erholung, -1 Reaktionen"
  STR_CAREER_COMMONER: "Gewoehnlicher Buerger"
  STR_CAREER_COMMONER_UFOPEDIA: "Diese Person war frueher der gewoehnlichste Buerger, den man sich vorstellen kann. Durch eine Laune des Schicksals geriet sie mitten in eine seltsame Verschwoerung. Nun arbeitet sie fuer uns.{NEWLINE}{NEWLINE}+4 Geisteskraft, +2 Moral-Erholung"
  STR_CAREER_DATA_ANALYST: "Datenanalyst"
  STR_CAREER_DATA_ANALYST_UFOPEDIA: "Diese Person fuehrte einst ein banales Leben zwischen endlosen Datenstroemen... Bis sie eines Tages ein Muster bemerkte und es einfach nicht mehr loslassen konnte.{NEWLINE}{NEWLINE}+4 Geisteskraft, +2 Psi-Staerke"
  STR_CAREER_DELIVERY_MAN: "Lieferfahrer"
  STR_CAREER_DELIVERY_MAN_UFOPEDIA: "Entgegen der landlaeufigen Meinung ist das Zustellen von Waren mit erstaunlich hohem Risiko verbunden, etwas zu sehen, das ein Zivilist niemals sehen sollte. Diese Person liess sich nicht abschrecken und tauschte schliesslich den Lieferwagen gegen den Dienst bei X-Com.{NEWLINE}{NEWLINE}+10 Ausdauer"
  STR_CAREER_DETECTIVE_UFOPEDIA: "Die Aufgabe dieser Person war es, Ermittlungen zu fuehren, sei es bei der Polizei oder in einer privaten Firma. Es ist leicht zu erraten, wie sie in unseren Reihen gelandet ist.{NEWLINE}{NEWLINE}+2 Gesundheit, +2 Nahkampf, +4 Geisteskraft"
  STR_CAREER_DRIVER: "Fahrer"
  STR_CAREER_DRIVER_UFOPEDIA: "Im frueheren Leben dieses Agenten ging es darum, Menschen oder Waren ueber Land zu transportieren. Etwas, dem er auf einer dieser Fahrten begegnete, hinterliess einen so starken Eindruck, dass er sich immer mehr vom Uebernatuerlichen angezogen fuehlte und schliesslich auf unseren Rekrutierungslisten landete.{NEWLINE}{NEWLINE}+5 Reaktionen"
  STR_CAREER_ENGINEER_UFOPEDIA: "Das ganze Leben dieser Person bestand daraus, mit schlecht abgesicherten Maschinen zu arbeiten. X-Com kann doch kaum schlimmer sein, oder?{NEWLINE}{NEWLINE}+1 Panzerung"
  STR_CAREER_ENTERTAINER: "Entertainer"
  STR_CAREER_ENTERTAINER_UFOPEDIA: "Dieser Agent arbeitete frueher in der weiten Welt der Unterhaltung als Kellner, Musiker, Kurtisane, Gastgeber oder sogar TV-Promi. Man glaubt gar nicht, was man in diesem Gewerbe alles zu sehen bekommt. Doch diese Person glaubte es, und war so entschlossen, aus diesem Wissen Konsequenzen zu ziehen, dass sie schliesslich X-Com beitrat.{NEWLINE}{NEWLINE}+1 Moral-Erholung, +1 Energie-Erholung, +1 Betaeubungs-Erholung"
  STR_CAREER_EXPLORER_UFOPEDIA: "Alte Ruinen, fremde Kulturen oder exotische Tiere zu erforschen ist ein Hochrisikoberuf, wenn es um ungewoehnliche Phaenomene geht. X-Com nimmt solche Experten gern in die eigenen Reihen auf.{NEWLINE}{NEWLINE}+2 ZE, +2 Gesundheit, +4 Ausdauer"
  STR_CAREER_FARMER_UFOPEDIA: "Dieser alte Agent hatte einen Bauernhof. Alles war in Ordnung, bis es das ploetzlich nicht mehr war, wegen Aliens, Zombies, Monstern oder anderen ungewoehnlichen Bedrohungen, denen Menschen auf dem Land begegnen. Er ueberlebte und trat X-Com bei, um zu zeigen, dass man sich mit ihm nicht anlegt.{NEWLINE}{NEWLINE}+4 Ausdauer, +2 Gesundheit, +2 Staerke"
  STR_CAREER_FENCER_UFOPEDIA: "Das ganze Leben dieser Person drehte sich um Nahkampf, meist als Wettkampfsport. Die unerbittliche Suche nach staerkeren und ungewoehnlicheren Gegnern fuehrte sie schliesslich zu einem Mysterium und danach in unsere Reihen.{NEWLINE}{NEWLINE}+5 Nahkampf"
  STR_CAREER_FIREMAN: "Feuerwehrmann"
  STR_CAREER_FIREMAN_UFOPEDIA: "Feuerwehr- und Rettungseinsaetze fuehren einen an die seltsamsten Orte. Wenn das passiert, wirkt X-Com als naechster Schritt erstaunlich logisch.{NEWLINE}{NEWLINE}+3 ZE, +2 Wurf, +1 Staerke"
  STR_CAREER_HISTORIAN: "Historiker"
  STR_CAREER_HISTORIAN_UFOPEDIA: "Das Studium alter Dokumente wurde fuer diese Person zum Tor in eine zweite, verborgene Ebene unserer Welt, zu der auch X-Com gehoert. Sie entschied sich, uns beizutreten, um mehr zu erfahren.{NEWLINE}{NEWLINE}+1 Moral-Erholung, +1 Nahkampf, +2 Psi-Staerke, +6 Geisteskraft, -5 Gesundheit"
  STR_CAREER_HUNTER_UFOPEDIA: "Diese Person begegnete in der Wildnis etwas, das sich nicht als natuerlich wegerklaeren liess. Sie trat unserer Organisation bei, um groessere Beute zu jagen, als sie es sich je haette vorstellen koennen.{NEWLINE}{NEWLINE}+3 Schiessen, +3 Gesundheit"
  STR_CAREER_ILLUSIONIST: "Illusionist"
  STR_CAREER_ILLUSIONIST_UFOPEDIA: "Diese Person kam frueher mit geschickten Fingern durchs Leben und lenkte andere ab oder fuehrte sie in die Irre. Sie glaubte, jedes Mysterium sei nur Rauch und Spiegel - bis sie eines Besseren belehrt wurde und schliesslich X-Com beitrat.{NEWLINE}{NEWLINE}+5 ZE"
  STR_CAREER_INSTITUTIONALIZED: "Institutionalisiert"
  STR_CAREER_INSTITUTIONALIZED_UFOPEDIA: "Diese Person verbrachte den groessten Teil ihres Lebens in einem weich gepolsterten Raum. Nun hat sie die Chance, die Quelle ihres Leidens zu begreifen und zurueckzuschlagen.{NEWLINE}{NEWLINE}+1 Frontpanzerung, +2 Reaktionen, +2 Psi-Faehigkeit, -10 Geisteskraft, -1 Moral-Erholung"
  STR_CAREER_JOURNALIST: "Journalist"
  STR_CAREER_JOURNALIST_UFOPEDIA: "Diese Person verbrachte Jahre damit, Geheimnisse aufzudecken, die Regierungen vor der Oeffentlichkeit verbergen wollten. Mit dem Beitritt zu X-Com wechselte sie von blosser Beobachtung zum aktiven Schutz.{NEWLINE}{NEWLINE}+1 Psi-Staerke, +1 Moral-Erholung, +1 Energie-Erholung"
  STR_CAREER_LABORER: "Arbeiter"
  STR_CAREER_LABORER_UFOPEDIA: "Diese Person hat an ihrem Arbeitsplatz Dinge gesehen, die noch seltsamer waren als ein nuechterner Kranfuehrer... Sie haette sie ignorieren koennen, doch stattdessen widmete sie ihre Kraft dem Kampf gegen die Bedrohungen, die ueber unserem Planeten schweben.{NEWLINE}{NEWLINE}+5 Staerke"
  STR_CAREER_MARINE_UFOPEDIA: "Ein erfahrener Veteran elitaerer Sturmtruppen. Seltsame Erfahrungen aus seiner Dienstzeit fuehrten ihn schliesslich zu unserer geheimen Initiative.{NEWLINE}{NEWLINE}+3 Schiessen, +3 Staerke"
  STR_CAREER_MARKSMAN: "Scharfschuetze"
  STR_CAREER_MARKSMAN_UFOPEDIA: "Dieser Agent schlug eine militaerische Laufbahn als Scharfschuetze ein. Seltsame Phaenomene oder eine Schattenorganisation, auf die er im Einsatz stiess, brachten ihn schliesslich in unsere Reihen.{NEWLINE}{NEWLINE}+5 Schiessen"
  STR_CAREER_MARTIAL_ARTIST: "Kampfsportler"
  STR_CAREER_MARTIAL_ARTIST_UFOPEDIA: "Einen grossen Teil des Lebens dieser Person nahm das Training toedlicher Nahkampffertigkeiten ein. Fuer sie ist X-Com der ultimative Ort, um sich zu beweisen.{NEWLINE}{NEWLINE}+4 Nahkampf, +4 Ausdauer"
  STR_CAREER_MEDIC: "Sanitaeter"
  STR_CAREER_MEDIC_UFOPEDIA: "Eine medizinische Laufbahn laesst einen Dinge sehen, die normale Menschen leicht als offensichtlichen Schwindel abtun wuerden. Dieser Agent ging diesen Weg und schloss sich schliesslich unseren Reihen an.{NEWLINE}{NEWLINE}+8 Geisteskraft, +1 Energie-Erholung"
  STR_CAREER_MERCENARY: "Soeldner"
  STR_CAREER_MERCENARY_UFOPEDIA: "Dieser Agent kaempfte frueher fuer jeden, der ihn in bewaffneten Konflikten bezahlte. Dadurch bekam er Gelegenheit, die Welt so zu sehen, wie sie ist: voller Mysterien und Korruption. Der Beitritt zu X-Com war fuer ihn keine grosse Umstellung - aber wir zahlen gut.{NEWLINE}{NEWLINE}+2 Schiessen, +2 Wurf, +4 Geisteskraft"
  STR_CAREER_MOUNTAINEER: "Bergsteiger"
  STR_CAREER_MOUNTAINEER_UFOPEDIA: "Diese Person verbrachte einen grossen Teil ihres Lebens in den Bergen, bis die Dinge kompliziert wurden und sie sich unseren Reihen anschloss.{NEWLINE}{NEWLINE}+5 Gesundheit"
  STR_CAREER_MYSTERY_HUNTER: "Mysterienjaeger"
  STR_CAREER_MYSTERY_HUNTER_UFOPEDIA: "Alte Ruinen zu erforschen, seltsame Tiere zu verfolgen oder Geister zu jagen liegt dieser Person im Blut. Der Beitritt zu X-Com war der natuerliche Schritt, aus dieser Leidenschaft einen Beruf zu machen.{NEWLINE}{NEWLINE}+10 Tapferkeit"
  STR_CAREER_MYSTIC_UFOPEDIA: "Ein einziges Ziel bestimmte ihr Leben: geistige Staerke. Der strenge Lebensstil dieser Person liess sie einen Teil der globalen Verschwoerung erkennen und machte sie zu einer attraktiven Wahl fuer unsere Rekrutierer.{NEWLINE}{NEWLINE}+3 Psi-Staerke, -2 Ausdauer"
  STR_CAREER_NEGOTIATOR: "Verhandler"
  STR_CAREER_NEGOTIATOR_UFOPEDIA: "Die Karriere dieser Person beruhte ganz auf Charisma und Empathie, meist in Wirtschaft oder Strafverfolgung. Durch ungewoehnliche Informationen im Dienst landete sie schliesslich bei X-Com.{NEWLINE}{NEWLINE}+3 Frontpanzerung, +1 Psi-Staerke"
  STR_CAREER_PILOT: "Pilot"
  STR_CAREER_PILOT_UFOPEDIA: "Diese Person steuerte frueher gewoehnliche Fluggeraete wie Verkehrsmaschinen, Frachtflugzeuge oder Rettungshubschrauber. Ob sie schon einmal ein UFO gesehen hat?{NEWLINE}{NEWLINE}+4 Reaktionen, +2 Schiessen"
  STR_CAREER_POLICE_OFFICER: "Polizist"
  STR_CAREER_POLICE_OFFICER_UFOPEDIA: "Waehrend der Arbeit im Polizeidienst stolperte diese Person ueber ein grosses Geheimnis, das mit einem Alienkult, einer irregulaeren Lebensform oder etwas Aehnlichem zusammenhing. Sie konnte dieser Spur nicht offiziell nachgehen und liess sich deshalb hierher versetzen.{NEWLINE}{NEWLINE}+3 Schiessen, +3 Nahkampf"
  STR_CAREER_PRIEST_UFOPEDIA: "Dieser Agent war frueher Geistlicher oder ist es vielleicht noch immer. Nachdem er ueberzeugende Hinweise auf etwas Finsteres in seinem religioesen Dienst erlebt hatte, entschied er sich, unseren Reihen beizutreten und diesen Bedrohungen direkter entgegenzutreten.{NEWLINE}{NEWLINE}+2 Moral-Erholung, +1 Psi-Staerke, +2 Geisteskraft"
  STR_CAREER_PSYCHOLOGIST: "Psychologe"
  STR_CAREER_PSYCHOLOGIST_UFOPEDIA: "Wer mit psychischer Gesundheit arbeitet, stolpert manchmal ueber Fragmente geheimen Wissens, die am Rand der kollektiven menschlichen Erfahrung treiben. Fuer manche ist der Beitritt zu X-Com ein Weg, diesem Pfad weiter zu folgen.{NEWLINE}{NEWLINE}+1 Psi-Staerke, +2 Psi-Faehigkeit, +1 Gesundheit"
  STR_CAREER_PUNK: "Punk"
  STR_CAREER_PUNK_UFOPEDIA: "Dieser Agent verbrachte einen grossen Teil seines Lebens damit, die harte Wirklichkeit des Strassenlebens zu ueberstehen. Dieser unkonventionelle Lebensstil setzte ihn dem Unbekannten aus, und Konflikte schrecken ihn nicht ab - deshalb ist er jetzt hier.{NEWLINE}{NEWLINE}+3 Betaeubungs-Erholung, -2 Geisteskraft"
  STR_CAREER_RANGER: "Ranger"
  STR_CAREER_RANGER_UFOPEDIA: "Dieser Agent stammt aus einer paramilitaerischen Truppe, die sich ganz auf Angriffe hinter feindlichen Linien spezialisiert hat. Das macht Organisationen wie X-Com fuer ihn besonders attraktiv, denn deren Einsaetze passen genau zu seinem Profil - angefangen bei der Entdeckung ihrer Existenz.{NEWLINE}{NEWLINE}+2 Reaktionen, +2 Schiessen, +4 Ausdauer"
  STR_CAREER_SABOTEUR_UFOPEDIA: "Dieser Agent verfuegt ueber eine genaue Vorgeschichte in der Kunst verdeckter Zersetzung im Dienst eines Staates oder Konzerns. Was er dort erlebte, fuehrte ihn schliesslich in die Welt geheimer Organisationen. X-Com kann seine Faehigkeiten und Erfahrungen zum Schutz der Erde nutzen.{NEWLINE}{NEWLINE}+2 Reaktionen, +1 Nachtsicht"
  STR_CAREER_SAILOR: "Seemann"
  STR_CAREER_SAILOR_UFOPEDIA: "Dieser Agent arbeitete frueher auf einem Seefahrzeug. Auf dem Meer gibt es seltsame Phaenomene, und manche davon bringen einen Menschen dazu, sich auf das Uebernatuerliche einzulassen.{NEWLINE}{NEWLINE}+4 Staerke, +2 Nahkampf"
  STR_CAREER_SAPPER: "Pionier"
  STR_CAREER_SAPPER_UFOPEDIA: "Diese Person ist ein zertifizierter Sprengstoffexperte, sei es militaerisch oder zivil. Man koennte meinen, das fuehre selten zum Uebernatuerlichen - aber weit gefehlt: Ein grosser Teil solcher Arbeit besteht darin, dubiose Industrie- und Militaeranlagen zu zerlegen. Wenn man einmal weiss, was man dort alles finden kann, wirkt der Beitritt zu X-Com fast wie die natuerliche Folge.{NEWLINE}{NEWLINE}+2 Betaeubungs-Erholung, +2 Wurf"
  STR_CAREER_SECRET_AGENT: "Geheimagent"
  STR_CAREER_SECRET_AGENT_UFOPEDIA: "Nicht offengelegt.{NEWLINE}{NEWLINE}+1 ZE, +1 Ausdauer, +1 Gesundheit, +1 Reaktionen, +1 Schiessen, +1 Wurf, +1 Staerke, +1 Geisteskraft"
  STR_CAREER_SOLDIER_UFOPEDIA: "Als ausgebildeter Soldat hatte diese Person reichlich Gelegenheit, mit Geheimorganisationen und anderen ueberweltlichen Bedrohungen in Beruehrung zu kommen. Das machte sie zu einem natuerlichen Kandidaten fuer die Rekrutierung durch X-Com.{NEWLINE}{NEWLINE}+2 Schiessen, +2 Gesundheit, +4 Ausdauer"
  STR_CAREER_SPY: "Spion"
  STR_CAREER_SPY_UFOPEDIA: "Diese Person arbeitete frueher fuer einen Geheimdienst. Waehrend des Dienstes stiess sie auf Geheimnisse, die fuer Uneingeweihte nicht bestimmt waren, und fand schliesslich ihren Weg in die Reihen von X-Com.{NEWLINE}{NEWLINE}+2 Reaktionen, +4 Geisteskraft, +1 Moral-Erholung"
  STR_CAREER_STUDENT: "Student"
  STR_CAREER_STUDENT_UFOPEDIA: "Dieser Agent hat einen akademischen Hintergrund und verpasst keine Gelegenheit, ein seltsames Phaenomen entschlossen zu rationalisieren. Das haelt ihn jedoch nicht davon ab, solchen Phaenomenen weiter nachzugehen - und so kam er hierher.{NEWLINE}{NEWLINE}+10 Geisteskraft"
  STR_CAREER_THIEF: "Dieb"
  STR_CAREER_THIEF_UFOPEDIA: "Frueher ein Krimineller, trat diese Person X-Com bei, um ihre Faehigkeiten besser einzusetzen und vielleicht sogar Wiedergutmachung zu finden.{NEWLINE}{NEWLINE}+2 ZE, +1 Nachtsicht"
  STR_CAREER_TRADER: "Haendler"
  STR_CAREER_TRADER_UFOPEDIA: "Jahre harter Arbeit auf dem offenen Markt gaben dieser Person einen scharfen Sinn fuer Profit und machten sie zaeh. So gelang ihr ein Blick hinter die Geheimnisse dieser Welt.{NEWLINE}{NEWLINE}+3 Energie-Erholung, -1 Gesundheit"
  STR_CARLOS_TANAKA: "Dr. Carlos Tanaka"
  STR_CARLOS_TANAKA_ARMOR: "Kampfanalyse: Dr. Carlos Tanaka"
  STR_CARLOS_TANAKA_ARMOR_UFOPEDIA: "Dr. Tanaka ist einer der sogenannten 'Osiron-Prinzen' und selbst fuer die Massstaebe von Osiron aussergewoehnlich gut vernetzt. Er hat ueber Jahrzehnte hinweg ein Netz aus Kunden und Kontakten aufgebaut und haelt Verbindung zu Fuehrungspersonal zahlreicher Untergrundorganisationen. Die Informationen, die wir von ihm erhalten, werden uns noch sehr nuetzen."
  STR_CAVEMEN_CAMPING_BRIEFING: "Die 'Hohlenmenschen' stellten sich als feindselig gegen unsere Agenten heraus, und sie sind bis zu den Zahnen mit primitiven Waffen ausgerustet. Sichern Sie das Gebiet und sichten Sie alle unublichen Artefakte, die sie noch besitzen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_CAVE_GIRL: "Cave Girl"
  STR_CAVE_GIRL_ARMOR: "Kampfanalyse: Cave Girl"
  STR_CAVE_GUY: "Cave Guy"
  STR_CAVE_GUY_ARMOR: "Kampfanalyse: Cave Guy"
  STR_CELATID_WEAPON_UFOPEDIA: "Celatidenspucke ist eine hochkorrosive Mischung aus Enzymen und anderen todlichen Chemikalien."
  STR_CEREAL_CULT: "Getreidekult"
  STR_CEREAL_CULT_BRIEFING: "Ein seltsamer Orden hat sich in ein friedliches Dorf eingeschlichen und die Einwohner gegen uns aufgebracht. Wir vermuten eine paranormale Macht hinter dieser Entwicklung. Finden und neutralisieren Sie die Quelle der Stoerung, aber vermeiden Sie nach Moeglichkeit Verletzte unter den Zivilisten. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CEREAL_CULT_DESCRIPTION: "Ein seltsamer Orden hat sich in ein friedliches Dorf eingeschlichen und die Einwohner gegen uns aufgebracht. Wir vermuten eine paranormale Macht hinter dieser Entwicklung. Finden und neutralisieren Sie die Quelle der Stoerung, aber vermeiden Sie nach Moeglichkeit Verletzte unter den Zivilisten."
  STR_CHAINGUN_AA_CLIP: "VAST-Chaingun-Tritaniummagazin"
  STR_CHAINGUN_AA_CLIP_MANUFACTURING: "Herstellung von VAST-Chaingun-Tritaniummagazinen"
  STR_CHAINGUN_AA_CLIP_XXX: "VAST-Chaingun-Tritaniummagazin (x5)"
  STR_CHAINGUN_CLIP: "VAST-Chaingun-Magazin"
  STR_CHAOS_WAND: "Stab des Chaos"
  STR_CHAOS_WAND_UFOPEDIA: "Diese beeindruckende, aber unberechenbare psionische Waffe nutzt den gesteigerten Gefuehlszustand ihres Traegers, um einen verheerenden Vernichtungsstrahl zu entfesseln. Jeder Einsatz bringt den Benutzer naeher an den Wahnsinn; nur die faehigsten Psioniker koennen hoffen, ihre Macht zu beherrschen."
  STR_CHAOS_WAND_USE: "Stab des Chaos einsetzen"
  STR_CHEMICAL_FLARE_UFOPEDIA: "Dieses kompakte Gerat erzeugt in jeglicher Tiefe Licht durch eine chemische Reaktion mit Wasser. Fur effizienten Gebrauch muss es eine Stunde vor Gebrauch mit Reagenzien gefullt werden, und dann gezundet, indem man die Membran platzen lasst, um es hell aufleuchten zu lassen.{NEWLINE}Das Leuchtfeuer auerhalb des Wassers zu benutzen zerstort es sofort durch Hitzeentwicklung."
  STR_CHEMICAL_SPILL_DESCRIPTION: "Ein Wasserreservoir nahe {0} wurde kontaminiert, woraufhin die oertlichen Lebensformen sich buchstaeblich verfluessigten. Der bizarre Vorfall fuehrte umgehend zu einer offiziellen Untersuchung. Der Rat konnte die Lage eindaemmen und feststellen, dass die Quelle ein kleines Labor einer Osiron-Zelle war, die eine Woche zuvor Chemikalien aus einem Lagerhaus von M.A.G.M.A. fuer einen unbekannten Zweck gestohlen hatte. Da wir diese Technologie mit M.A.G.M.A. geteilt haben, macht uns der Rat mitverantwortlich.{NEWLINE}[-300 Punkte]"
  STR_CHEMOGUN_UFOPEDIA: "Diese Waffe verschiet Dusenstrahlen hochaktiver Chemikalien. Sie ist absolut todlich gegen lebende Ziele und ungeschutzte Maschinerie. Die chemische Mischung kann aus gewohnlichen Zutaten hergestellt werden, aber ist hochst ungewohnlich und wurde wahrscheinlich unter auerirdischer Anleitung entwickelt."
  STR_CHEMPISTOL_UFOPEDIA: "Diese Waffe verschiet Dusenstrahlen hochaktiver Chemikalien. Sie ist absolut todlich gegen lebende Ziele und ungeschutzte Maschinerie. Die chemische Mischung kann aus gewohnlichen Zutaten hergestellt werden, aber ist hochst ungewohnlich und wurde wahrscheinlich unter auerirdischer Anleitung entwickelt."
  STR_CHEMTHROWER_UFOPEDIA: "Diese Waffe bedeckt das Zielgebiet mit einer Wolke aus chemischen Kampfstoffen, die aus einem Drucktank ausgestoen werden. Besondere Vorsicht ist geboten, da es sich um eine Waffe mit kurzer Reichweite, aber groen Wirkungsbereich handelt."
  STR_CHEMTRAILS_BRIEFING: "Dieser Hof wird von den Hybriden benutzt um gefahrliche Chemikalien auf die Verteilung uber den Luftweg vorzubereiten. Wir mussen sie aufhalten, bevor wir alle vergiftet oder gehirngewaschen werden. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_CHEMTRAILS_UFOPEDIA: "Eine der Hauptaufgaben der Hybriden ist, komplexe chemische Mixturen uber bevolkerten Gebiet zu verteilen. Dies wird manchmal durch kleine, unauffalige Flugzeuge erledigt, aber meistens wird die Mischung einfach zivilem Luftfahrttreibstoff zugefugt. Die Chemikalien konnen eine Reihe milder Effekte auf das Verhalten von Leuten haben, was Teil einer groeren Strategie ist, die Erdbevolkerung tumb und gefugsam zu machen."
  STR_CHIEF_ACCOUNTANT_INTRODUCTION_DESCRIPTION: "Ah, der neue Kommandant. Ich beaufsichtige saemtliche Finanzangelegenheiten dieser Organisation. Kann ich Sie spaeter in meinem Buero erwarten? Ich wuerde gerne einige Punkte mit Ihnen durchgehen.{NEWLINE}Zuvor muessten Sie jedoch noch dieses Paket gegenzeichnen. Es steht hier bereits seit geraumer Zeit herum und ist an den X-Com-Kommandanten adressiert. Ich weiss nicht, was sich darin befindet, also seien Sie bitte so freundlich und oeffnen Sie es nicht in meiner Gegenwart. Unterschreiben Sie einfach hier und hier ..."
  STR_CHIEF_ACCOUNTANT_INTRODUCTION_UFOPEDIA: "Ich bin hier die Hauptbuchhalterin, und bin damit fur alle Geldtransfers zustandig bin, die Sie anfordern, also zugeln Sie bitte Ihre Verschwendungssucht.{NEWLINE}{NEWLINE}Sie haben also das Kommando uber dieses Chaos. Ich hoffe, dass Sie fur den Job geeignet sind, denn es sieht nicht sehr gut aus. Sie wissen genauso gut wie ich, dass wir nur eine Nebenoperation sind, damit die UN zeigen kann, wie wichtig ihr dieser unerklarliche Mist ist. Aber was auch immer Ihre Meinung dazu ist, ich werde dieses Projekt am Laufen halten und ich versichere Ihnen, ich werde hier mindestens so lange arbeiten wie Sie!"
  STR_CHIEF_ENGINEER_CONTACT_UFOPEDIA: "Hallo, Kumpel. Ihre Nachricht habe ich bekommen, und deshalb bin ich hier: Ihr neuer Stabsingenieur.{NEWLINE}Hoeren Sie, ich bin wegen der Spielzeuge hier, verstanden? Ich bin kein grosser Politiker, und ob Ihr Drei-Manegen-Zirkus fuer die Welt besser ist als die anderen Drei-Manegen-Zirkusse, ist mir ehrlich gesagt egal. Aber ich helfe Ihnen gern, solange Sie mir weiter spannendes Zeug vorsetzen.{NEWLINE}Also, wo ist meine Werkstatt? WIE BITTE, WIR HABEN NOCH KEINE? Donnerwetter, dann hat meine Arbeit wohl schon angefangen. Wir brauchen dringend einen richtigen Arbeitsbereich: gute Ausruestung, reichlich Platz und einen Rechner mit vernuenftigem Sprachsystem. Wissen Sie was? Lassen Sie mich einfach loslegen, dann bringe ich Ihnen die Bauplaene, sobald sie fertig sind."
  STR_CHIEF_MEDICAL_OFFICER_INTRODUCTION_DESCRIPTION: "Hallo, Kommandant. Ich bin die Stabsaerztin dieses Stuetzpunkts. Ich habe bereits viel Gutes ueber Sie gehoert und setze deshalb grosse Hoffnungen in dieses Projekt. Ehrlich gesagt interessieren mich die moeglichen Entdeckungen mehr als das Geld, und da ich nicht gerade mittellos bin, habe ich beschlossen, der Sache eine kleine Spende zukommen zu lassen. Ich habe sie in einem sicheren Schliessfach fuer Sie hinterlegt."
  STR_CHIEF_MEDICAL_OFFICER_INTRODUCTION_UFOPEDIA: "Ich vermute, ich sollte Ihnen mehr uber mich erzahlen. Wie Sie wissen, ist es meine Aufgabe, unsere Feldagenten am Leben zu erhalten, wenn... naja, Sie wissen, wie es bei zwielichtigen Geschaften wie diesem zugeht. Allerdings bin ich auch qualifiziert, wissenschaftliche Analysen an interessanten biologischen Materialien vorzunehmen, einschlielich Autopsien, Vivisektionen und biochemische Proben. Besuchen Sie mich ruhig, wann immer Sie wollen. Entschuldigen Sie den Gestank der Desinfektionsmittel, aber glauben Sie mir, das ist besser so."
  STR_CHIEF_RESEARCHER_CONTACT_UFOPEDIA: "Guten Abend, Kommandant. Ihr Angebot, als Stabswissenschaftler einzusteigen, hat mein Interesse in der Tat geweckt. Ich war anfangs skeptisch, doch einige gut vernetzte Kollegen versicherten mir, dass Sie ueber stichhaltige Belege fuer diese seltsamen Ereignisse verfuegen. Da konnte ich nicht widerstehen, mir das alles persoenlich anzusehen.{NEWLINE}Offen gesagt sind unsere Forschungseinrichtungen noch recht bescheiden, aber fuer den Anfang muessen sie genuegen. Wenn es Ihnen recht ist, werde ich mich nach dem Einzug sofort mit Ihren Mitarbeitern zusammensetzen, um Verbesserungen an den Laboren zu besprechen. Wir haben doch ein ordentliches Doppelzimmer fuer mich, nicht wahr?"
  STR_CHOSEN_OF_DAGON: "Auserwaehlter Dagons"
  STR_CHOSEN_OF_DAGON_ARMOR: "Kampfanalyse: Auserwaehlter Dagons"
  STR_CHOSEN_OF_DAGON_UFOPEDIA: "Dieses Mitglied der Kirche Dagons aehnelt aeusserlich den Juengern Dagons, behaelt aber deutlich mehr Intelligenz und sogar Charisma. In Gefangenschaft verbringt der sogenannte Auserwaehlte den Groessteil seiner Zeit in meditativer Trance. Diese Trance fuehrt zu kleinen koerperlichen Veraenderungen wie Schwimmhaeuten oder schuppenartigen Wucherungen, die nach dem Ende der Trance wieder zurueckgehen. Auserwaehlte scheinen im Kult keine besondere Funktion zu haben, ausser als Vorbilder zu dienen, und gelten unter ihren Glaubensgenossen als erleuchtete Mystiker."
  STR_CHRYSSALID_GAS_GRENADE_UFOPEDIA: "Diese Granate enthalt eine chemische Verbindung, die den Elerium-Stoffwechsel bestimmter auerirdische Lebensformen uberladt, wodurch das Elerium im Ziel seine Energie unkontrolliert freisetzt. Je nach E-115 Dichte im Ziel reicht das Ergebnis von Verbrennungen zu einer feurigen Explosion."
  STR_CHRYSSALID_VILLAGE_BRIEFING: "Ein entsetzliches auerirdisches Ungeheuer greift dieses friedliche Dorf an! Tun Sie, was Sie konnen, um den Horror aufzuhalten. Bedenken Sie, Zeit ist der Haupt-Faktor! Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_CHTONITE_MINIBASE_ASSAULT_BRIEFING: "Wir haben die Hohlen infiltriert, um einen nahen Vorposten der Chtoniten anzugreifen. Dies ist eine gute Gelegenheit, auerirdische Exemplare und Ausrustung zu erobern. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter zum Eingangsbereich zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_CHUPACABRA_ARMOR: "Kampfanalyse: Chupacabra"
  STR_CHUPACABRA_AUTOPSY: "Autopsie: Chupacabra"
  STR_CHUPACABRA_AUTOPSY_UFOPEDIA: "Dieser Organismus ist eindeutig ausserirdischen Ursprungs und weist viele Merkmale auf, die auf der Erde unbekannt sind. Er besitzt ein Exoskelett wie unsere Wirbellosen, doch sein Nerven- und Kreislaufsystem entspricht in seiner Komplexitaet eher grossen Saeugetieren. Chupacabras verfuegen ueber sehr einfache Augen, doch ihre gesamte Morphologie und Biochemie deutet klar auf einen schnellen Raeuber mit scharfen Klauen und peitschenartigem Schwanz hin. Ihre aeussere Schale bietet einen gewissen Schutz gegen physische Angriffe."
  STR_CHUPACABRA_CORPSE: "Leiche einer Chupacabra"
  STR_CHUPACABRA_EMBRYO_UFOPEDIA: "Offenbar sind Chupacabras doch keine reinen ausserirdischen Aliens - oder zumindest ist die Sache deutlich komplizierter. Wir haben Beweise dafuer, dass das Syndikat sie kuenstlich erschafft, und zwar nicht nur fuer begrenzte Forschungszwecke: Die untersuchte Probe deutet auf klar definierte Verfahren und weitreichende Erfahrung mit dem Zuchtprozess hin, was bedeutet, dass diese Kreaturen in grossem Massstab geklont werden.{NEWLINE}Es ist schwer zu sagen, was M.A.G.M.A. mit dieser Information anfangen wird, aber zumindest verstehen wir nun besser, wie gefaehrlich das Syndikat wirklich ist."
  STR_CHUPACABRA_GORE_PILE: "Chupacabra-Schlachtfest"
  STR_CHUPACABRA_GORE_PILE_DESCRIPTION: "Eine Familie wurde tot in ihrem Haus in {0} aufgefunden. Die halb gefressenen Leichen waren zu einem Haufen zusammengeschleift und mit einer Schleimschicht ueberzogen. Die Bissspuren deuten auf Chupacabras hin, doch wir wissen nicht, weshalb die Kreaturen ihre Opfer auf diese Weise arrangiert haben. Der Rat ist von diesem makabren Schauspiel ausserirdischen Verhaltens deutlich beunruhigt.{NEWLINE}[-66 Punkte]"
  STR_CHUPACABRA_UFOPEDIA: "Diese Kreatur ist ein extrem schnelles und gefaehrliches Raubtier. Ihre Intelligenz ist begrenzt, doch zum Jagen und Verstecken auf der Erde ist sie hervorragend angepasst. Ihr einziger wirklicher Makel besteht darin, dass sie sich offenbar nicht selbst erfolgreich fortpflanzen kann. Moeglicherweise existiert jedoch eine Art Koenigin, die diese Jaeger hervorbringt. Wenn es irgend moeglich ist, sollten wir solche Kreaturen auf grosse Distanz bekaempfen."
  STR_CHUPACABRA_WEAPON: "Chupacabra-Biss"
  STR_CHURCH_OF_DAGON_AFTER_HQ: "Moege Dagon ueber uns wachen"
  STR_CHURCH_OF_DAGON_AFTER_HQ_EVENT: "Nachricht der Kirche Dagons abgefangen"
  STR_CHURCH_OF_DAGON_AFTER_HQ_EVENT_DESCRIPTION: "Kommandant, wir haben wichtige interne Kommunikation der Kirche Dagons entschluesselt. Ich blende sie jetzt ein."
  STR_CHURCH_OF_DAGON_AFTER_HQ_UFOPEDIA: "An alle Brueder und Schwestern im Glauben: Das Schlimmste ist eingetreten. Unsere Heiligtuemer wurden von jenen ueberfallen, die unserer gerechten Sache entgegentreten. Diese selbsternannten Retter der dem Untergang geweihten Welt wissen weder, was sie tun, noch, wogegen sie stehen. Dennoch haben wir sie unterschaetzt. Zwar werden sie die hoeheren Geheimnisse nie erblicken, doch sie haben sich als faehig erwiesen, unser Werk zu zerstoeren. Selbst jetzt raunen die Tiefen, dass sie von unserem Grossen Tempel wissen und einen Angriff vorbereiten. Die Abgesandten Dagons werden an unserer Seite stehen, doch wenn unser Glaube wankt, koennen auch wir fallen. Dann bleibt uns nur noch der Trost der Tiefen.{NEWLINE}Bis die Sterne richtig stehen"
  STR_CHURCH_OF_DAGON_AFTER_NETWORK: "Moege Dagon ueber uns wachen"
  STR_CHURCH_OF_DAGON_AFTER_NETWORK_EVENT: "Nachricht der Kirche Dagons abgefangen"
  STR_CHURCH_OF_DAGON_AFTER_NETWORK_EVENT_DESCRIPTION: "Kommandant, wir haben wichtige interne Kommunikation der Kirche Dagons entschluesselt. Ich blende sie jetzt ein."
  STR_CHURCH_OF_DAGON_AFTER_NETWORK_UFOPEDIA: "Brueder und Schwestern im Glauben, leider bleibt unsere gerechte Sache nicht unbeobachtet. Tapfere Eingeweihte und unsere aeussersten Posten verschwinden, ueberfallen von irgendeinem Arm dieser dem Untergang geweihten Welt. Noch wissen wir nicht, wer oder was gegen uns handelt. Abgesandte unserer geliebten Goenner haben einem Treffen zugestimmt, um darueber zu beraten. Man versicherte uns, die Neuankoemmlinge seien von geringer Bedeutung. Angesichts ihrer schwachen Bewaffnung neige ich dazu zuzustimmen: Sie wirken wie ein weiterer Satz Hirten fuer die Massen, die unsere wahre Lage noch nicht begreifen. Bis wir mehr wissen, lasst uns sie wie jeden anderen bekaempfen, der sein Vertrauen in das Land setzt.{NEWLINE}Bis die Sterne richtig stehen"
  STR_CHURCH_OF_DAGON_AFTER_OPERATIONS: "Moege Dagon ueber uns wachen"
  STR_CHURCH_OF_DAGON_AFTER_OPERATIONS_EVENT: "Nachricht der Kirche Dagons abgefangen"
  STR_CHURCH_OF_DAGON_AFTER_OPERATIONS_EVENT_DESCRIPTION: "Kommandant, wir haben wichtige interne Kommunikation der Kirche Dagons entschluesselt. Ich blende sie jetzt ein."
  STR_CHURCH_OF_DAGON_AFTER_OPERATIONS_UFOPEDIA: "Brueder im Glauben, die Bedrohung durch die Pluenderer aus der dem Untergang geweihten Welt waechst. Die Weissagungen unserer Abgesandten in die Tiefen haben Licht auf sie geworfen: Es handelt sich um ein letztes blindes Aufbaeumen der Welt, die wir hinter uns lassen, um einen verzweifelten Schlag der Uneingeweihten gegen uns. Sie halten die Beruehrung unseres Meisters fuer eine Bedrohung, unfaehig zu begreifen, dass nur unser Weg Rettung verspricht. Gluecklicherweise sehen ihre eigenen Herren keinen Grund, sie zu segnen: Sie belagern den Leib unseres Glaubens, doch sie durchdringen kaum die Haut. Aussenposten moegen fallen, aber unsere wahren Heimstaetten und der Tempel bleiben fern ihrer Reichweite. Treten wir ihnen entgegen und geben wir ihnen den Kampf, den sie suchen.{NEWLINE}Bis die Sterne richtig stehen"
  STR_CHURCH_OF_DAGON_ALTAR_OF_DAGON: "Altar Dagons"
  STR_CHURCH_OF_DAGON_ALTAR_OF_DAGON_DESCRIPTION: "Nach einer Reihe von Berichten ueber paranormale Vorgaenge in der Umgebung eines abgeschiedenen Dorfs fanden Agenten des Rates den Ort verlassen vor. Auf den Gebaeuden waren Zeichen der Kirche Dagons verschmiert, und mitten auf dem Marktplatz stand ein grober Steinaltar. Man draengt uns, die Anstrengungen gegen den Kult zu verstaerken.{NEWLINE}[-25 Punkte]"
  STR_CHURCH_OF_DAGON_DEATH_GRIP_DESCRIPTION: "Einige lokale Ratsagenten in {0} wurden tot aufgefunden, die Herzen im Brustkorb zerquetscht. Diese Agenten hatten uns dabei geholfen, Unterschlupfe der Kirche Dagons in der Gegend aufzuspuren...{NEWLINE}[-25 Punkte]"
  STR_CHURCH_OF_DAGON_GONE_WITH_THE_FISH_DESCRIPTION: "Die Bevoelkerung eines ganzen Fischerdorfs in {0} ist spurlos verschwunden. Der einzige Hinweis sind blutige Symbole der Kirche Dagons, die ueberall hinterlassen wurden. Der Rat hat uns diesen Bericht ohne weiteren Kommentar zugespielt.{NEWLINE}[-50 Punkte]"
  STR_CHURCH_OF_DAGON_GRIM_RITUAL_SITE: "Makabrer Ritualplatz"
  STR_CHURCH_OF_DAGON_GRIM_RITUAL_SITE_DESCRIPTION: "Touristen entdeckten in einem Wald bei {0} ein makabres Totem aus frischen Menschenknochen. Es sieht ganz danach aus, als haette die Kirche Dagons es errichtet. Der Rat legt uns nahe, unsere Anstrengungen gegen diese Bedrohung zu verstaerken.{NEWLINE}[-25 Punkte]"
  STR_CHURCH_OF_DAGON_HQ: "HQ der Kirche Dagons"
  STR_CHURCH_OF_DAGON_HQ_UFOPEDIA: "Den Informationen zufolge, die wir dem Zauberer entlockt haben, unterhaelt die Kirche Dagons ein Netzwerk steinerner Pyramiden im aequatorialen Afrika. Diese Pyramiden dienen als Basen, und eine davon - der Hohe Tempel - beherbergt eine goldene Statue, die offenbar das heiligste Objekt des Kults ist, Dagons groesstes Geschenk. Wir wissen nicht genau, was diese Statue ist, aber wenn wir sie erbeuten, duerfte das den Kult schwerer treffen als alles andere.{NEWLINE}Das Problem ist nur, dass die Statue haeufig zwischen den Pyramiden verlegt wird. Dennoch koennen wir ihre Spur mit brauchbarer Genauigkeit verfolgen. Schliesslich ist ein Hoher Tempel ein Hoher Tempel, oder nicht?{NEWLINE}Ich melde mich, sobald wir die goldene Statue lokalisiert haben, und dann entscheiden Sie, ob wir fuer einen Angriff bereit sind."
  STR_CHURCH_OF_DAGON_NETWORK: "Netzwerk der Kirche Dagons"
  STR_CHURCH_OF_DAGON_NETWORK_UFOPEDIA: "Die Kirche Dagons ist eine verschlossene Organisation, und viele ihrer Mitglieder verlassen kaum jemals ihre Siedlungen. Dennoch unterhaelt sie ein Netzwerk von Notlagern, meist in abgelegenen Gebieten verborgen und stets von einer Gruppe Kultisten bewacht. Diese Einrichtungen sind unsere beste Chance, Fuehrungsfiguren des Kults festzusetzen, denn sie werden haeufig genutzt, um Kontakt zu halten und die Zusammenarbeit zwischen den Doerfern zu koordinieren. Wir wissen nicht genau, was dort vor sich geht, aber es riecht eindeutig nach Fisch."
  STR_CHURCH_OF_DAGON_OPERATIONS: "Operationen der Kirche Dagons"
  STR_CHURCH_OF_DAGON_OPERATIONS_UFOPEDIA: "Kommandant, ich habe einen Plan ausgearbeitet, wie wir einen Kultfuehrer fassen koennen. Wir wissen bereits, dass solche Personen bei Feiern zu Ehren Dagons auftauchen, wo sie allerlei boese Rituale vollziehen und sich vermutlich auch noch daran erfreuen. Inzwischen habe ich eine recht gute Vorstellung davon, wie wir Zeitpunkt und Ort der naechsten Zeremonie berechnen koennen. Ich gebe Bescheid, sobald ich etwas Belastbares habe.{NEWLINE}{NEWLINE}{NEWLINE}Von nun an werden wir uns auch nicht mehr selbst um Unterschlupfe der Kirche Dagons kuemmern; solche Aufgaben gehen an die Bergungstrupps des Rates."
  STR_CHURCH_OF_DAGON_RATIONALE: "Kirche Dagons: Beweggruende"
  STR_CHURCH_OF_DAGON_RATIONALE_UFOPEDIA: "Das zentrale Ziel der Kultisten Dagons ist das Ende der Welt, wie wir sie kennen. Sie wollen ihren fremden Gott erwecken, damit er den Planeten uebernimmt und in etwas anderes verwandelt. Warum sollte jemand so etwas wollen? Offenbar sehen sie die Wirklichkeit ausserordentlich pessimistisch: Nach ihrer Vorstellung ist das Universum voller Maechte, die zu gross und zu gefaehrlich sind, als dass Menschen allein darin bestehen koennten. In ihren Augen muessen wir Teil einer solchen Macht werden, um zu ueberleben, und unsere Menschlichkeit zu bewahren ist ein Luxus, den wir uns nicht leisten koennen.{NEWLINE}Hoffen wir, dass sie irren und nicht wir."
  STR_CHURCH_OF_DAGON_RETALIATION: "Vergeltung der Kirche Dagons"
  STR_CHURCH_OF_DAGON_SHADOW: "Der Schatten der Kirche Dagons"
  STR_CHURCH_OF_DAGON_SHADOW_DESCRIPTION: "So schwer greifbar das Netzwerk der Kirche Dagons auch bleibt, ihr Einfluss auf die Welt waechst stetig. In {0} hat sie inzwischen genug Unterstuetzung gesammelt, um spuerbare politische Macht auszuueben. Unsere Sponsoren sind zunehmend besorgt.{NEWLINE}[-300 Punkte]"
  STR_CHURCH_OF_DAGON_UFOPEDIA: "Die Kirche Dagons ist eine verschlossene religioese Organisation aus dem Mittelmeerraum. Ihre Anhaenger verehren einen Meeresgott namens Dagon und bringen ihm Menschenopfer dar. Hoeherrangige Mitglieder stehen angeblich in direktem Kontakt mit den Boten Dagons, die unter dem Meer leben sollen. Die Kirche ist seit Jahrzehnten in Europa und Afrika praesent und verfuegt ueber beachtlichen Einfluss, auch wenn echte Kultisten durch koerperliche und psychosoziale Veraenderungen immer schlechter mit normalen Menschen zurechtkommen."
  STR_CLAIM_HYBRID_DEFECTOR: "Hybriden-Ueberlaeufer anfordern"
  STR_CLERIC_OF_APOCALYPSE_ARMOR: "Kampfanalyse: Kleriker der Apokalypse"
  STR_CLERIC_OF_APOCALYPSE_UFOPEDIA: "Kleriker fuehren Aussenposten der Apokalypse, also unabhaengige Orden von Bruedern. Bemerkenswerterweise kennen sie keine eigentlichen Vorgesetzten; als Anarchisten im Herzen weigern sich diese Kultisten, eine komplexe Hierarchie aufzubauen. Neue Kleriker werden aus den Reihen der Brueder von einem Gremium aus drei oder mehr aelteren Klerikern ausgewaehlt, und zwar auf Grundlage ihrer intellektuellen und psychosozialen Faehigkeiten."
  STR_COLD_PACKAGE_DESCRIPTION: "Eine Regierungsbehoerde hat uns kommentarlos die Leiche einer ausserirdischen Kreatur zugeschickt. Wie sie daran gelangt ist, wollte man uns nicht sagen. Der Rat schweigt ebenfalls."
  STR_COMMUNION_OF_APOCALYPSE_BRIEFING: "Hier versammeln sich verschiedenste Gangs, um ihre unheiligen Ziele zu feiern. Nehmen Sie die Gefolgsleute und Gesandten fest. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_COMMUNION_OF_APOCALYPSE_DESCRIPTION: "Hier versammeln sich verschiedenste Gangs im Wald, um ihre unheiligen Ziele zu feiern. Nehmen Sie die Gefolgsleute und Gesandten fest. Seien Sie vorsichtig: Die Feinde sind zahlreich und gut bewaffnet."
  STR_COMMUNION_OF_APOCALYPSE_UFOPEDIA: "Der einzige Kontakt gewoehnlicher Gangs mit ihren Oberen findet bei besonderen Zusammenkuenften statt. Diese Treffen sind eine Mischung aus religioesem Ritual, Geschaeftsbesprechung, Lehrveranstaltung und militaerischer Nachbesprechung. Dort sollten wir jemanden finden koennen, der deutlich besser informiert ist."
  STR_CONCEALABLE_ITEMS_UFOPEDIA: "Manchmal mussen X-Com-Agenten eine feindliche Einrichtung infiltrieren, ohne Aufmerksamkeit zu erregen. Ein verbergbarer Gegenstand kann auf so eine Mission mitgenommen werden, aufgrund kleiner Groe, Unauffalligkeit, besonderen Aufbaus oder so fort. Alle mitgebrachten nicht-verbergbaren Gegenstande werden zum Stutzpunkt zuruckgeschickt.{NEWLINE}Es gibt verschiedene Beschrankungen fur Ausrustung. Missionsbeschreibungen geben diese an, wenn nicht offensichtlich (wie etwa Unterwassereinsatze). Um Gegenstande nach Typ zu organisieren, gibt es Filter in den Gegenstandslisten."
  STR_CONTACT_SHIP_FRAME: "Kontaktschiff-Huellenrahmen"
  STR_CONTACT_SHIP_UFOPEDIA: "Dieses mittelgrosse UFO dient dazu, niederrangige ausserirdische Vertreter zu Treffen mit ihren irdischen Verbuendeten zu transportieren. Es ist schnell und gut geschuetzt, wenn auch nicht so gefaehrlich wie ein ausserirdisches Angriffsschiff."
  STR_CONTAINMENT_EXCEEDED_3: "GEISTERTANK-KAPAZITAET UEBERSCHRITTEN!{SMALLLINE}In {0} fehlen geeignete Zellen. Ueberzaehlige Geister muessen aus der Einrichtung entfernt werden und loesen sich dann auf."
  STR_CORRUPTED_DATA: "Beschaedigte Daten"
  STR_CORRUPTED_DATA_UFOPEDIA: "Waehrend der Entschluesselung wurde unerwartet ein Schutzmechanismus ausgeloest, was zu einer irreversiblen Datenbeschaedigung fuehrte."
  STR_CORRUPT_POLITICIAN_BLACK_LOTUS_DESCRIPTION: "Ein Lokalpolitiker aus {0} wurde wegen Korruptionsverdachts festgenommen und wartet nun auf seinen Prozess. Der eigentliche Grund fuer die Verhaftung waren sorgfaeltig zusammengestellte Beweise Ihrer verlaesslichen Operativen, dass diese Person heimlich Black Lotus unterstuetzt hat. Es fuehlt sich gut an, hier einmal die Oberhand zu haben.{NEWLINE}[150 Punkte]"
  STR_CORRUPT_POLITICIAN_CHURCH_OF_DAGON_DESCRIPTION: "Ein Lokalpolitiker aus {0} wurde wegen Korruptionsverdachts festgenommen und wartet nun auf seinen Prozess. Der wahre Grund fuer die Festnahme sind sorgfaeltig zusammengestellte Beweise, dass diese Person heimlich die Kirche Dagons unterstuetzt hat. Es tut gut, hier einmal die Oberhand zu behalten.{NEWLINE}[150 Punkte]"
  STR_CORRUPT_POLITICIAN_EXALT_DESCRIPTION: "Ein Lokalpolitiker aus {0} wurde wegen Korruptionsverdachts festgenommen und wartet nun auf seinen Prozess. Der eigentliche Grund fuer die Verhaftung waren sorgfaeltig zusammengestellte Beweise Ihrer verlaesslichen Operativen, dass diese Person heimlich EXALT unterstuetzt hat. Es fuehlt sich gut an, hier einmal die Oberhand zu haben.{NEWLINE}[150 Punkte]"
  STR_CORRUPT_POLITICIAN_ZSRR_DESCRIPTION: "Ein Lokalpolitiker aus {0} wurde wegen Korruptionsverdachts festgenommen und wartet nun auf seinen Prozess. Der wahre Grund fuer die Festnahme sind Beweise, die Ihre verlaesslichen Operativen sorgfaeltig zusammengetragen haben: Diese Person unterstuetzte die Morgenroete heimlich. Es tut gut, hier einmal die Oberhand zu behalten.{NEWLINE}[150 Punkte]"
  STR_COUNCIL_APPEARS_UFOPEDIA: "{NEWLINE}{NEWLINE}{NEWLINE}Nicht lange nachdem der letzte Schuss verklungen ist, werden Sie von einem Vertreter des Erdenrats kontaktiert.{NEWLINE}'Glueckwunsch zu Ihrer Mission, Kommandant. Die Erde ist Ihnen dankbar. Wir werden das eroberte Schiff nun mit unserer ausgebildeten Besatzung uebernehmen.{NEWLINE}Danke, Kommandant, fuer Ihre gewaltige Leistung bei der Sicherung von Dimension X. Jetzt sind wir an der Reihe, dafuer zu sorgen, dass das so bleibt. Und dieses Schiff wird uns helfen, unseren Hauptstuetzpunkt hier zu verteidigen.'"
  STR_COUNCIL_MEMBER: "Kommissar des Erdenrats"
  STR_COUNCIL_MEMBER_ARMOR: "Kampfanalyse: Kommissar des Erdenrats"
  STR_COUNCIL_OF_EARTH: "Erdenrat"
  STR_COUNCIL_OF_EARTH_CLUE: "Hinweis zum Erdenrat"
  STR_COUNCIL_OF_EARTH_UFOPEDIA: "Inzwischen ist klar, dass der Rat die Vereinten Nationen nur als sein sichtbarstes Gesicht benutzt. In Wahrheit handelt es sich um eine verschlossene Machtstruktur, die unabhaengig von den Nationalstaaten operiert und erheblichen Einfluss auf sie ausuebt. Der Rat setzt sich aus Menschen unterschiedlichster Herkunft zusammen, die aus dem einen oder anderen Grund zur verborgenen Herrscherklasse gehoeren. Gleichgesinnte Mitglieder organisieren sich in Fraktionen, die politischen Parteien aehneln und unablaessig um Macht und Einfluss auf dem Planeten ringen."
  STR_COUNCIL_OUR_FRIENDLY_ENEMY: "Der Rat: unser freundlicher Feind"
  STR_COUNCIL_OUR_FRIENDLY_ENEMY_CLUE: "Hinweis: Der Rat, unser freundlicher Feind"
  STR_COUNCIL_OUR_FRIENDLY_ENEMY_UFOPEDIA: "Obwohl X-Com vom Rat ins Leben gerufen wurde, war diese Entscheidung keineswegs einstimmig. Der Rat wirkt tief gespalten, wenn es um den Umgang mit unbekannten Maechten geht, und ein Teil von ihm sieht unsere Existenz mit offenem Missfallen. Wir muessen vor diesen Kreisen und allen Handlangern auf der Hut sein, die sie entsenden koennten, um unsere Operationen zu stoeren. Unsere Foerderer haben die X-Com-Initiative zwar durchgesetzt, doch sie bleibt politisch umstritten, was uns in eine prekaere Lage bringt. Wir duerfen unseren politischen Gegnern keine Munition liefern und den Rat nicht gegen uns aufbringen, denn unsere Organisation koennte jederzeit aufgeloest werden."
  STR_COUNCIL_POWER_CHAIN: "Machtstruktur des Erdenrats"
  STR_COUNCIL_POWER_CHAIN_CLUE: "Hinweis zur Machtstruktur des Erdenrats"
  STR_COUNCIL_POWER_CHAIN_UFOPEDIA: "Es gibt zwei Hauptkategorien von Organisationen, die dem Erdenrat dienen. Die erste Kategorie wird als 'technisch' bezeichnet und deckt die globale Verwaltung ab, etwa die Weltbank. Von diesen Organisationen wird erwartet, dass sie ihre Aufgaben effizient erfuellen und so die globale Ordnung sichern. Ihre Angelegenheiten werden in Ratssitzungen in der Regel nicht im Detail besprochen; ueberwacht werden vor allem ihre Ergebnisse. Jede von ihnen untersteht einem Hochkommissar - einem Mitglied des inneren Zirkels des Erdenrats, aber keinem der eigentlichen Entscheidungstraeger - und wird von anderen Hochkommissaren geprueft. Die zweite Kategorie wird meist 'politisch' genannt. Diese Organisationen sind oft kleiner als manche 'technischen', gelten aber als Teil des offenen Machtkampfs. Solche Einrichtungen schaden bestimmten grossen Fraktionen und nuetzen anderen, weshalb sie erbittert umkaempft werden. Wie Sie sich denken koennen, gehoeren wir zur zweiten Kategorie: von einem Teil des Rates gefoerdert, zum Nachteil anderer Fraktionen. Daher haben wir so viele Feinde und absurde Hindernisse - aber eben auch so viel Nachsicht fuer unsere Fehler."
  STR_COUNCIL_SALVAGER: "Berger des Erdenrats"
  STR_COUNCIL_SALVAGER_ARMOR: "Kampfanalyse: Berger des Erdenrats"
  STR_COUNCIL_SALVAGE_CORPS: "Bergungskorps des Erdenrats"
  STR_COUNCIL_SALVAGE_CORPS_UFOPEDIA: "Das Bergungskorps des Erdenrats besteht aus technischen Einheiten, die nach jeder X-Com-Mission eingesetzt werden. Sie arbeiten bemerkenswert effizient; geborgene Materialien treffen oft noch vor unseren Agenten auf dem Stuetzpunkt ein. Darueber hinaus uebernehmen sie unterstuetzende Aufgaben wie Untersuchungen, Absperrungen und Sicherungsmassnahmen in Einsatzgebieten. Erwarten Sie allerdings nicht, dass sie eine echte Schlacht fuer uns gewinnen."
  STR_COVEN_REWARD_UFOPEDIA: "Tapfere Sterbliche, wir sind euch wahrhaft dankbar fuer eure Hilfe beim Sturz des Drachendieners. Wir wissen, dass ihr viele weitere Feinde habt, darunter auch die hinterhaeltigen Sky Men. Als Zeichen unserer Dankbarkeit offenbaren wir euch hiermit ein Geheimnis, mit dem sich Unsterblichkeit erreichen laesst: die Verschmelzung mit einem Essentor. In eurem Krieg koennte euch dieses Wissen von grossem Nutzen sein."
  STR_CRAFT_EQUIPMENT_TYPES_UFOPEDIA: "Welche Waffen an einem X-Com-Fahrzeug montiert werden koennen, haengt von ihrem Typ ab; kinetische Waffen brauchen passende Munitionslager, Strahlwaffen eine eigene Energiequelle. Hier eine Uebersicht ueber alle Waffentypen und die zugehoerigen Slots:{NEWLINE}Kanone [CANN]: kinetische Waffen, abgefeuert durch Sprengtreibmittel oder fortschrittlichere Methoden wie elektromagnetische Spulen.{NEWLINE}Strahl [BEAM]: Energie-Direktfeuerwaffen.{NEWLINE}Leichte Rakete [LTMS]: typische Raketenwaffen.{NEWLINE}Schwere Rakete [HVMS]: uebergrosse Raketenwaffen mit groesserer Nutzlast und weniger Munition.{NEWLINE}Lafettenmontiert [PM]: Infanteriewaffen, die auf einem Fahrzeug montiert sind.{NEWLINE}{NEWLINE}Ein Fahrzeug kann ausserdem nicht-waffenbezogene Spezialslots besitzen, die fuer besondere Systeme gedacht sind. Es gibt drei Typen davon:{NEWLINE}Schild [SHLD]: energiebasierte Deflektoren zum Schutz vor eingehenden Angriffen.{NEWLINE}Antriebsmodul [ENGN]: Erweiterungen zur Verbesserung von Geschwindigkeit, Ausweichleistung oder anderen schubbezogenen Eigenschaften.{NEWLINE}Elektronik [ELEC]: zusaetzliche Datenverarbeitungssysteme, typischerweise zur Verbesserung von Ortung oder Genauigkeit."
  STR_CRASHED_STARFIGHTER_DATA: "Absturz eines geheimnisvollen Sternenjaegers"
  STR_CRASHED_STARFIGHTER_DATA_ANALYSIS: "Analyse des geheimnisvollen Sternenjaegers"
  STR_CRASHED_STARFIGHTER_DATA_ANALYSIS_CONT: "(Forts.)"
  STR_CRASHED_STARFIGHTER_DATA_ANALYSIS_UFOPEDIA_1: "Seit wir im verbesserten Labor die Daten aus unserer frueheren Untersuchung auswerten konnten, haben wir einiges gelernt. Das Schiff scheint ein Raumjaeger zu sein, der den Weltraum, nicht aber den interstellaren Raum bereisen kann. Wir vermuten, dass fuer Reisen jenseits des Erde-Mond-Systems eine Art Sternentor noetig ist.{NEWLINE}{NEWLINE}Sein Antrieb basiert auf einem kompakten Fusionsreaktor, dessen Bauplaene weit jenseits dessen liegen, was wir heute nachbilden koennten. Auch die Ionenaggregate des Schiffs sind ausserordentlich fortschrittlich und verwenden Wasserstoff als Treibstoff. Wir koennen ihn im Hangar herstellen, doch der Auftankvorgang wird einige Zeit in Anspruch nehmen.{NEWLINE}{NEWLINE}                                        (Siehe naechste Seite)"
  STR_CRASHED_STARFIGHTER_DATA_ANALYSIS_UFOPEDIA_2: "Wir konnten die Bewaffnung des Schiffs bergen: zwei Laserkanonen. Im Inneren ist kaum Platz fuer etwas anderes als Strahlenwaffen.{NEWLINE}{NEWLINE}Ein Teil der urspruenglichen Faehigkeiten des Schiffs ist fuer immer verloren, weil Abschnitte des Speicherverbunds seines Rechnerkerns zerfallen sind. Gluecklicherweise ist seine fortschrittliche Avionik noch intakt genug, um uns weiterhin einen Vorteil gegen feindliche Fluggeraete zu verschaffen.{NEWLINE}{NEWLINE}Ich habe bereits veranlasst, den Sternenjaeger an unseren Stuetzpunkt zu ueberfuehren. Bevor wir dieses Schmuckstueck wieder in die Luft bringen koennen, muessen unsere Werkstaetten allerdings noch einige zusaetzliche Reparaturen durchfuehren.{NEWLINE}{NEWLINE}- Stabs-Xenologe"
  STR_CRASHED_STARFIGHTER_DATA_CONT: "(Forts.)"
  STR_CRASHED_STARFIGHTER_DATA_DESCRIPTION: "Kommandant, ich habe fantastische Neuigkeiten zu einem geheimnisvollen Wrack, das ein Bergungsteam des Erdenrats entdeckt hat. Bitte lesen Sie meinen Bericht umgehend.{NEWLINE}{NEWLINE}- Stabs-Xenologe"
  STR_CRASHED_STARFIGHTER_DATA_UFOPEDIA_1: "Wir erhielten einen anonymen Hinweis auf ein seltsames Artefakt am Grund des Michigansees nahe Chicago in den USA. Die Taucher des Bergungskorps des Erdenrats bargen, was sie zunaechst fuer das Wrack eines Alienschiffs hielten.{NEWLINE}{NEWLINE}Nach einer ersten Untersuchung stellte sich jedoch heraus, dass es sich um eine Art Raumjaeger handelt.{NEWLINE}{NEWLINE}Wir fanden keinerlei Spur eines Piloten oder Passagiers, doch das Schiff ist eindeutig fuer eine humanoide Besatzung ausgelegt. An der Huelle entdeckten wir Einschlagsspuren, wie sie typischerweise von UFO-Plasmawaffen verursacht werden.{NEWLINE}{NEWLINE}                                        (Siehe naechste Seite)"
  STR_CRASHED_STARFIGHTER_DATA_UFOPEDIA_2: "Wir werden die Ueberreste des Schiffs an einem sicheren Ort aufbewahren, bis wir Zugang zu einem verbesserten Labor haben und die Untersuchung abschliessen koennen.{NEWLINE}{NEWLINE}Kommandant, ich schoepfe Hoffnung: Vielleicht sind wir nicht die einzige Zivilisation in der Galaxis, die sich den Alien-Invasoren entgegenstellt. Wenn wir gruendlich genug suchen, finden wir womoeglich freundliche Ausserirdische, mit denen wir ein Buendnis schliessen koennen - und vielleicht werden wir an ihrer Seite tatsaechlich zu einer raumfahrenden Spezies.{NEWLINE}{NEWLINE}- Stabs-Xenologe"
  STR_CRAZED_ANTMEN_VILLAGE_BRIEFING: "Diese Ameisenmenschen leiden an einem chemischen Ungleichgewicht, das die gesamte Kolonie krankhaft aggressiv gegen ihre Nachbarn macht. Schalten Sie sie zum Wohl aller aus. Um die Mission abzubrechen, fuehren Sie die X-Com-Kraefte in den Ausgangsbereich und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CRAZED_ANTMEN_VILLAGE_DESCRIPTION: "Der Skorpionkonig will, dass wir einen gefahrlichen Ameisenmenschenstamm angreifen. Diese Ameisenmenschen leiden unter einem chemischen Ungleichgewicht, das die ganze Kolonie krankhaft aggressiv gegen ihre Nachbarn macht. Die Reptoiden werden sich irgendwann um sie kummern, aber weder der Konig noch wir wollen ihre Streitmacht in der Nahe haben. Daher ware es besser, die Drecksarbeit selber zu erledigen."
  STR_CRIB: "Unterschlupf"
  STR_CRIMINAL_RECORDS: "Verbrechensregister"
  STR_CROC_RAID_BRIEFING: "Ein Heer echsenartiger Krieger erschien plotzlich in einem Dorf. Sie knallen die Leute von allen Seiten ab! Dammen Sie die Bedrohung ein und retten Sie, wen Sie retten konnen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_CROP_CIRCLES_BRIEFING: "Wir reagieren auf einen Bericht uber seltsame, geometrische Muster, die in einem Feld gefunden wurden. Wir mussen die Anwohner befragen, und Informationen aus ihnen herausquetschen bevor es jemand anderes tut. Tun Sie, was sie konnen, um ihre Leben zu bewahren, obwohl wir nicht erwarten, dass sie sehr empfanglich sind. Wenn es unmoglich ist, sie lebend zu fassen, tun Sie was Sie mussen. Sie haben nur 10 Runden, bevor der Feind eintrifft. Wenn Sie nicht schnell genug sind, bereiten Sie sich auf das Schlimmste vor! Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zuruckkehren und klicken das Icon 'Mission abbrechen' an."
  STR_CROP_CIRCLES_MIB_BRIEFING: "Wir reagieren auf einen Bericht ueber seltsame geometrische Muster in einem Feld. Doch unsere Feinde waren schneller. Wir werden ihre Kraefte ueberfallen, um die Einheimischen zu retten und zu befragen. Sie haben nur 10 Runden, bevor feindliche Verstaerkungen eintreffen. Wenn Sie die Mission bis dahin nicht abschliessen, muessen Sie mit der Vernichtung rechnen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CROP_CIRCLES_ZOMBIE_BRIEFING: "Wir reagieren auf einen Bericht ueber seltsame, regelmaessige Muster auf einem Feld. Laut den Informationen sollten wir nach verdaechtigen Personen in der Umgebung Ausschau halten und sie festnehmen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CROP_CIRCLES_ZOMBIE_DESCRIPTION: "Wir reagieren auf einen Bericht ueber seltsame, regelmaessige Muster auf einem Feld. Wir muessen mit den Anwohnern sprechen und ihnen Informationen entlocken, bevor es jemand anderes tut.{NEWLINE}Tun Sie, was Sie koennen, um ihr Leben zu schuetzen, auch wenn wir nicht erwarten, dass sie uns sonderlich entgegenkommen. Falls eine lebende Festnahme unmoeglich ist, tun Sie, was noetig ist."
  STR_CRUISER_FRAME: "Kreuzer-Huellenrahmen"
  STR_CRUISE_LINER_MIB: "Geheimes MIB-See-Labor"
  STR_CRUISE_LINER_MIB_BRIEFING: "Dieser Luxusliner ist lediglich die Tarnung fuer eine Forschungsoperation der Men in Black, die eine bedeutende Artefaktstaette von T'leth untersuchen. Ihr Ziel ist es, jeden Widerstand auszuschalten und den leitenden Wissenschaftler festzusetzen. Das Schiff wird von Elitekraeften der Men in Black schwer bewacht. Diese Mission kann nicht abgebrochen werden."
  STR_CRUISE_LINER_MIB_DESCRIPTION: "Dieser Luxusliner ist lediglich die Tarnung fuer eine Forschungsoperation der Men in Black, die eine bedeutende Artefaktstaette von T'leth untersuchen. Wenn wir diesen Ort ueberfallen, duerften wir wertvolle Forschungsdaten, Materialien und Personal in die Haende bekommen. Allerdings ist das Schiff bei jeder Sicherheitsverletzung vermutlich zur Selbstzerstoerung vorbereitet, daher muessen wir Infiltrationsausruestung verwenden. Ausserdem wird das Schiff schwer von Elitekraeften der Men in Black bewacht. Ein Rueckzug kommt in dieser Mission natuerlich nicht infrage."
  STR_CRUISE_LINER_RAID_BRIEFING: "Wir haben ein Mayday von einem zivilen Schiff unter Angriff von Seeungeheuern erhalten. Wir mussen herausfinden, was mit dem Schiff passiert ist. Sie konnen die Mission nicht abbrechen."
  STR_CRUISE_LINER_RAID_DESCRIPTION: "Wir haben ein Mayday von einem zivilen Schiff unter Angriff von Seeungeheuern erhalten. Wir mussen herausfinden, was mit dem Schiff passiert ist. Sie konnen die Mission nicht abbrechen."
