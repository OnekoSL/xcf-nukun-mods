  STR_CULT_HQ_BLACK_LOTUS: "Black-Lotus-HQ"
  STR_CULT_HQ_BLACK_LOTUS_BRIEFING: "Wir stehen kurz davor, die Hauptbasis von Black Lotus tief unter der Erde zu stuermen. Wir muessen eine goldene Avatar-Statue lokalisieren und das darin eingebaute psionische Geraet bergen. Rechnen Sie mit heftigem Widerstand durch die besten Agenten von Black Lotus, also bleiben Sie fokussiert. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen in die Ausgangszone zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CULT_HQ_BLACK_LOTUS_DESCRIPTION: "Dies ist die Hauptbasis von Black Lotus, tief unter der Erde verborgen. Wir muessen eine goldene Avatar-Statue lokalisieren und das darin eingebaute psionische Geraet bergen.{NEWLINE}Wir muessen mit heftigem Widerstand durch die besten Agenten von Black Lotus rechnen. Die Anlage duerfte aus den ueblichen Korridoren und Raeumen unterschiedlicher Groesse bestehen."
  STR_CULT_HQ_CHURCH_OF_DAGON: "HQ der Kirche Dagons"
  STR_CULT_HQ_COLD_ZSRR: "HQ der Morgenroete"
  STR_CULT_HQ_COLD_ZSRR_BRIEFING: "Unsere Mission ist ein Frontalangriff auf die Morgenroete-Basis. Unser Ziel ist, kritische Informationen zu sammeln, die ihre Anführer der Weltöffentlichkeit preisgeben, was die gesamte Organisation neutralisieren wird. Der gesamte Komplex ist sehr gut verteidigt, also nutzen Sie alle verfügbaren Methoden, um die Mission abzuschließen, und die Bedrohung durch die Morgenroete für immer zu beenden. Viel Glück."
  STR_CULT_HQ_COLD_ZSRR_DESCRIPTION: "Der Plan ist die Morgenroete-Hauptbasis hier zu stürmen. Unser Ziel ist, kritische Informationen zu sammeln, die ihre Anführer der Weltöffentlichkeit preisgeben.{NEWLINE}Die Basis ist größtenteils unterirdisch, mit mehreren Zugängen von der Oberfläche. Der gesamte Komplex ist äußerst gut verteidigt."
  STR_CULT_HQ_EXALT: "EXALT-HQ"
  STR_CULT_HQ_EXALT_BRIEFING: "Dies ist das Hauptquartier der kriminellen Organisation EXALT. Wir muessen es infiltrieren und ihren Anfuehrer finden, einen halbmenschlichen Hybriden, und ihn entweder festnehmen oder zumindest seine Leiche fuer Untersuchungen bergen. Viel Glueck."
  STR_CULT_HQ_EXALT_DESCRIPTION: "Dies ist das Hauptquartier der kriminellen Organisation EXALT. Wir muessen es infiltrieren und ihren Anfuehrer finden, einen halbmenschlichen Hybriden, und ihn entweder festnehmen oder zumindest seine Leiche fuer Untersuchungen bergen.{NEWLINE}Der gesamte Einsatz wird innerhalb eines Gebaeudes stattfinden."
  STR_CULT_HQ_EXALT_UFOPEDIA: "Wir sind bereit, den Ort zu stuermen, von dem aus die Fuehrung von EXALT operiert. Wegen ihrer gehobenen politischen Stellung muessen wir still und leise vorgehen. Unser Ziel ist es, ihren Anfuehrer lebend zu fassen. Geben Sie auf sich acht."
  STR_CULT_HQ_JUNGLE_CHURCH_OF_DAGON: "HQ der Kirche Dagons"
  STR_CULT_HQ_JUNGLE_CHURCH_OF_DAGON_BRIEFING: "Wir sind im Begriff, den Hohen Tempel der Kirche Dagons anzugreifen, das Zentrum all ihrer Aktivitaeten. Unser Ziel ist eine goldene Statue, die angeblich der Schluessel zur Struktur der Kirche ist. Bergen Sie diesen Gegenstand. Der Tempel wimmelt von Kultisten und ihren unmenschlichen Verbuendeten, also gehen Sie vorsichtig vor. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_CULT_HQ_JUNGLE_CHURCH_OF_DAGON_DESCRIPTION: "Dies ist der Hohe Tempel der Kirche Dagons, das Zentrum all ihrer Aktivitaeten. Unser Ziel ist eine goldene Statue, die angeblich der Schluessel zur Struktur der Kirche ist.{NEWLINE}Wir muessen diesen Gegenstand aus dem Tempel bergen. Das Gelaende ist dicht bewachsen, und der Tempel wimmelt von Kultisten und ihren unmenschlichen Verbuendeten."
  STR_CULT_HQ_ZSRR: "HQ der Morgenroete"
