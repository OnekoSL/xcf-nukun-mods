  STR_XCOM_SLANDER_SHARE_TERRAMITE_TECH_DESCRIPTION: "Einige Leute im Rat sind aeusserst unzufrieden damit, dass wir die Terramit-Technologie mit M.A.G.M.A. geteilt haben. Ihr Handlanger ist bereits unterwegs, um unseren Ruf bei einigen weniger standfesten Unterstuetzern zu zerstoeren. Wir muessen ihn stoppen, auch wenn es realistisch betrachtet unwahrscheinlich ist, dass wir rechtzeitig dort sind."
  STR_XCOM_SLANDER_ZSRR_UNFINISHED: "X-Com-Verleumdung (Morgenroete noch nicht zerschlagen)"
  STR_XCOM_SLANDER_ZSRR_UNFINISHED_BRIEFING: "Einige Leute im Rat kritisieren uns offen dafuer, dass wir die Morgenroete noch nicht ausgeschaltet haben, obwohl wir dazu in der Lage waeren. Ihr Handlanger ist bereits unterwegs, um unseren Ruf bei einigen unserer weniger standhaften Unterstuetzern zu zerstoeren. Wie durch ein Wunder sind wir diesmal rechtzeitig vor Ort, um ihn fuer immer zum Schweigen zu bringen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol Mission abbrechen."
  STR_XCOM_SLANDER_ZSRR_UNFINISHED_DESCRIPTION: "Einige Leute im Rat kritisieren uns offen dafuer, dass wir die Morgenroete noch nicht ausgeschaltet haben, obwohl wir dazu in der Lage waeren. Ihr Handlanger ist bereits unterwegs, um unseren Ruf bei einigen unserer weniger standhaften Unterstuetzern zu zerstoeren. Wir muessen ihn stoppen, auch wenn es realistisch betrachtet schwer wird, rechtzeitig dort zu sein."
  STR_XENOLOGIST_CONTACT: "Xenologe rekrutieren"
  STR_XENOLOGIST_CONTACT_UFOPEDIA: "Ah, guten Tag, guten Tag! Ich freue mich ausserordentlich, Ihr Stabs-Xenologe zu werden. Sie wirken wie eine faehige Fuehrungsperson, Kommandant; ich erwarte viel von dieser Operation.{NEWLINE}Sie fragen sich vermutlich, warum ich ueberhaupt hier bin, richtig? Nun, ganz ehrlich: Ich frage mich das im Moment ebenfalls. Es sieht noch nicht so aus, als gaebe es hier bereits etwas, wofuer meine besonderen Faehigkeiten unmittelbar gebraucht werden. Aber keine Sorge, ich bin sicher, dass Ihre Aufklaerungsoffizierin, Ihr Stabsingenieur oder wer sonst hier Forschung betreibt, meine Hilfe schon bald benoetigen wird. Sie werden es nicht bereuen, mich hergebeten zu haben, Kommandant ... und ich bin sicher, ich ebenso wenig."
  STR_XENONAUTS_UFOPEDIA: "Es scheint, dass Kiryu-Kai und ahnliche Initiativen nicht der erste Versuch sind, die auerirdische Bedrohung anzugehen. Wir haben ein streng geheimes Projekt aus den 70ern entdeckt, verzeichnet als 'Xenonaut-Verteidigungskrafte', eine NATO-Warschauer Pakt-Kooperation. Sein Hauptziel war Gedankenkontrolle zu bekampfen, aber es etablierte auch eine Reihe anderer wissenschaftlicher und Ausbildungs-Programme.{NEWLINE}Die Initiative war kurzlebig; sie krankte an schwacher Aufklarung, Budget und Fehlentscheidungen, ganz abgesehen vom Missbrauch des 'Geisterweiterungsserums' durch die Agenten (daher der Spitzname Psychonauten). Seine einzigartige Rolle wahrend des Kalten Krieges allerdings sollte nicht unterschatzt werden, noch seine wissenschaftlichen Leistungen, wie der Xeno-Kampfschild."
  STR_XENOPHYTE_FOR_A_FAVOR: "Xenophyt gegen einen Gefallen"
  STR_XENOPHYTE_SHARD: "Xenophyt-Scherbe"
  STR_XENOPHYTE_SHARD_UFOPEDIA: "Ein biologisch abgeleitetes Material, das von der Zivilisation der Dimension X aus unklaren Gruenden kultiviert wurde - vielleicht nur als Nebenprodukt ihrer fortschrittlichen Biotechnologie. Diese Kristalle sind selten und werden gelegentlich in abgelegenen Gebieten gefunden, in denen Alienleben ohne Aufsicht gedeiht. Der Erdenrat begehrt sie wegen ihrer einzigartigen wissenschaftlichen Eigenschaften, auch wenn sie keine direkten technologischen Anwendungen bieten. Fuer ihre Bergung hat der Rat uns eine Belohnung zugesagt."
  STR_XMINOTAUR: "X-Minotaur"
  STR_XMINOTAUR_ARMOR: "Kampfanalyse: X-Minotaur"
  STR_ZEPHYR_SERUM_FROM_CHUPACABRA: "Zephyr-Serum (aus Chupacabra)"
  STR_ZOMBIES_AT_PEACE_UFOPEDIA: "Nach dem Sturz des Pharaos konnten die Uralten diplomatischen Kontakt zu den Neugeborenen aufnehmen. Auf einen Waffenstillstand folgten Verhandlungen und schliesslich eine Einigung, die beide Seiten zusammenfuehrte. Alle Beteiligten profitierten davon: Die Neugeborenen wurden eingeladen, als Gleichgestellte einer geordneten und kulturell reichen Gesellschaft beizutreten, waehrend die Uralten durch neues Blut an Kraft gewannen. Auch fuer X-Com war das von Vorteil: Mit dem Ende des Krieges konnten wir die verbliebenen Zombies an der Oberflaeche besser kontrollieren, denn die restlichen Exemplare sollten vom Zirkel aufgespuert und unter die Erde gebracht werden, wo sie als Diener weiterexistieren."
  STR_ZOMBIES_ITS_THE_ZOMBIES: "Da sind die Zombies!"
  STR_ZOMBIES_ITS_THE_ZOMBIES_DESCRIPTION: "Uns liegen zahlreiche Berichte ueber eine Krankheit vor, die Menschen in der Naehe von {0} in aggressive Bestien verwandelt, nicht unaehnlich den Monstern aus klassischen Zombiefilmen. Trotz unserer Bemuehungen dringen diese Berichte langsam in die Massenmedien durch, und die Seuche selbst koennte bereits fuer Vermisstenfaelle in kleinen Doerfern und abgelegenen Gehoeften verantwortlich sein. Solche Geruechte schuern die Unruhe weiter.{NEWLINE}[-150 Punkte]"
  STR_ZOMBIES_PATIENT_ZERO_DESCRIPTION: "Unser Geheimdienst fing einen Polizeibericht ab, in dem von einem schwerkranken, aggressiven Individuum die Rede ist, das Bewohner einer Kleinstadt nahe {0} angegriffen hat. Bei naeherer Untersuchung identifizierten wir die Person als Opfer eines Zombieparasiten. Vertreter des Rats ueberredeten die lokalen Behoerden, uns den Infizierten zu ueberstellen.{NEWLINE}[Zombie erhalten]"
  STR_ZOMBIE_AQUATIC: "Wasserzombie"
  STR_ZOMBIE_ARE_BREEDING: "'Sie vermehren sich!'"
  STR_ZOMBIE_ARE_BREEDING_UFOPEDIA: "Kommandant, die Nachrichten ueber sich vermehrende Zombies sind duester: Sie fressen Menschen nicht nur, sie nutzen sie auch, um ihre Zahl zu vergroessern. Das geschieht, indem Zombies einander verschlingen, bis sie sich in Fette Zombies verwandeln; diese koennen ihren Wirt weiter regenerieren und schliesslich zur Infektor-Stufe heranreifen. Das koennte das eigentliche Ziel der Zombie-Evolution sein: Fortpflanzung.{NEWLINE}Dennoch passt etwas nicht zusammen. Zombies leben von einer hyperenergetischen chemischen Substanz, und gerade deshalb fressen sie einander - aber sie produzieren diese Substanz selbst nicht. Langfristig muessten sie also immer aussterben. Warum also vermehren, wenn die gesamte Population letztlich zugrunde geht? Falls Zombies eine Biowaffe sind, koennte das eine Sicherheitsmassnahme gegen einen unkontrollierten Ausbruch sein. Oder eine technische Grenze, die nie ueberwunden wurde.{NEWLINE}Wir sollten die Regierungen ueber dieses Problem informieren. Das duerfte zumindest einige der Epidemien eindaemmen."
  STR_ZOMBIE_BOOMER_ARMOR: "Kampfanalyse: Sprengzombie"
  STR_ZOMBIE_BOOMER_AUTOPSY: "Autopsie: Sprengzombie"
  STR_ZOMBIE_BOOMER_AUTOPSY_UFOPEDIA: "Die urspruengliche Hypothese wurde bestaetigt: Im Koerper dieses degenerierenden Fetten Zombies befinden sich mehrere Hohlraeume voller fluechtiger, instabiler Chemikalien. Diese Organe lassen sich bergen und koennten als wirksame, wenn auch abseitige Waffe dienen. Anmerkung: Lassen Sie keine Hunde auf geborgenen Organen herumkauen."
  STR_ZOMBIE_BOOMER_CORPSE: "Leiche eines Sprengzombies"
  STR_ZOMBIE_BOOMER_UFOPEDIA: "Wegen eines entgleisten Stoffwechsels koennen diese Zombies die hyperenergetischen Verbindungen aus dem Verzehr anderer Zombies nicht verarbeiten. Stattdessen sammeln sie sich in ihrem Koerper wie Tumore an. Ihr geringeres Gewicht macht sie schneller, doch diese erbarmungswuerdigen Kreaturen leben nur fuer wenige Stunden. Wird ein Sprengzombie toedlich verletzt, verliert der Parasit die Kontrolle ueber den Koerper, und die gesamte gespeicherte Energie entlaedt sich in einer heftigen Explosion, die das Wesen zerreisst. Mit der richtigen Forschung koennten wir diese Tumore vielleicht als Energiequelle nutzen - sofern wir sie vor der Detonation ernten."
  STR_ZOMBIE_CATACOMBS_BRIEFING: "Wir sollten dieses Zombienest so schnell wie moeglich ausraeuchern. Aber Vorsicht: Irgendeine Art von Intelligenz scheint diese sonst geistlosen Kreaturen zu koordinieren. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Ausgangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_ZOMBIE_CATACOMBS_DESCRIPTION: "Unser Team aus 'Zombie-Oekologen' hat eine unterirdische Anlage entdeckt, in der diese Kreaturen leben und sich vermehren. Wir sollten sie so schnell wie moeglich ausraeuchern. Rechnen Sie mit dunklen, engen Korridoren und vielen Zombies. Nehmen Sie Sprengstoff oder andere Ausruestung zum Aufbrechen von Waenden mit."
  STR_ZOMBIE_CORPSE: "Leiche eines Chryssalid-Zombies"
  STR_ZOMBIE_DOGE_ARMOR: "Kampfanalyse: Zombiehund"
  STR_ZOMBIE_DOGE_CORPSE: "Leiche eines Zombiehundes"
  STR_ZOMBIE_EVOLUTION_HYPOTHESIS: "Hypothese zur Zombie-Evolution"
  STR_ZOMBIE_EVOLUTION_HYPOTHESIS_UFOPEDIA: "Kommandant, unsere Analyse beider bislang bekannter Zombievarianten - der 'normalen' und der 'fetten' - legt nahe, dass innerhalb dieser Kreaturen eine Art Evolutionsprozess stattfindet. Ich halte es fuer sehr wahrscheinlich, dass es weitere Stufen dieses Prozesses gibt.{NEWLINE}Ich werde die Forschung in dieser Richtung fortsetzen, muss dabei aber Schritt fuer Schritt vorgehen, wenn ich zu verlaesslichen Ergebnissen kommen will. Anders gesagt: Falls wir weitere Entwicklungsstufen von Zombies entdecken, sollten wir sie in der Reihenfolge ihres mutmasslichen Evolutionsverlaufs untersuchen. Vorausgesetzt natuerlich, sie entwickeln sich wirklich."
  STR_ZOMBIE_GRUBAS_ARMOR: "Kampfanalyse: Fetter Zombie"
  STR_ZOMBIE_GRUBAS_AUTOPSY: "Autopsie: Fetter Zombie"
  STR_ZOMBIE_GRUBAS_AUTOPSY_UFOPEDIA: "Dieser Zombie ist besonders gross und schwer. Seine Biochemie unterscheidet sich grundlegend von der eines gewoehnlichen Zombies und enthaelt deutlich mehr hochenergetische Verbindungen. In seinem Verdauungssystem fanden wir die Ueberreste eines anderen Zombies."
  STR_ZOMBIE_GRUBAS_CORPSE: "Leiche eines Fetten Zombies"
  STR_ZOMBIE_GRUBAS_UFOPEDIA: "Fette Zombies sind abartige Zombieformen, die ihre gewoehnlichen Artgenossen verschlingen. Da alle Zombies Parasiten tragen, die sich von hyperenergetischen Chemikalien ernaehren, verfuegt ein frisch gefuetterter Fetter Zombie ueber einen doppelten Energievorrat. Dieser Ueberschuss ermoeglicht eine Reihe physiologischer Veraenderungen, die zu effizienterem Stoffwechsel und laengerer Lebensdauer fuehren. Die graue Haut dieses Wesens ist ein deutlicher Hinweis darauf, wie tiefgreifend diese Mutation bereits ist: Biochemisch hat es mit einem Menschen fast nichts mehr gemeinsam."
  STR_ZOMBIE_HIVE: "Zombie-Hort"
  STR_ZOMBIE_HIVE_BRIEFING: "Wir haben einen unterirdischen Ort mit starker Zombie-Praesenz lokalisiert. Wir muessen ihre Absichten aufdecken und eine moegliche Katastrophe verhindern. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Ausgangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_ZOMBIE_HIVE_DESCRIPTION: "Wir haben einen unterirdischen Ort mit starker Zombie-Praesenz lokalisiert. Wir muessen ihre Absichten aufdecken und eine moegliche Katastrophe verhindern. Diese Mission findet in dunklen Hoehlen statt."
  STR_ZOMBIE_IMPLANT: "Zombie-Truppler-Implantat"
  STR_ZOMBIE_IMPLANT_INVESTIGATION: "Untersuchung: Zombie-Implantat"
  STR_ZOMBIE_IMPLANT_INVESTIGATION_UFOPEDIA: "Der festgesetzte Osiron-Anfuehrer hat uns einige hochinteressante Informationen ueber das Zombie-Implantat von M.A.G.M.A. geliefert. Offenbar war die Gruppe, die ein entsprechendes Werkzeug in Auftrag gab, niemand anderes als das geheimnisvolle Syndikat - eine internationale Schattenfirma, die einen Grossteil des organisierten Verbrechens kontrolliert. Der technische Dienstleister war wiederum eine andere abtruennige Gruppierung: Cyberweb.{NEWLINE}Warum sollte das Syndikat die Forschung von M.A.G.M.A. sabotieren wollen? Zunaechst einmal sind beide seit Langem Rivalen und stehen auf denkbar schlechtem Fuss. Doch mein Instinkt sagt mir, dass sich hinter diesem Konflikt noch mehr verbirgt.{NEWLINE}Vorerst muessen wir Syndikat-Personal finden und verhaften. Hoffentlich lernen wir danach mehr."
  STR_ZOMBIE_IMPLANT_ORIGINS: "Urspruenge des Zombie-Implantats"
  STR_ZOMBIE_IMPLANT_ORIGINS_UFOPEDIA: "Informationen des EXALT-Meisters haben es uns ermoeglicht, unsere Untersuchung des Zombie-Truppler-Hirnimplantats voranzutreiben. Offenbar wandte sich im vergangenen Jahr eine nicht identifizierte Person mit einem sehr speziellen Auftrag an die tiefe kriminelle Unterwelt: Es sollte ein Computervirus geschaffen werden, das psionische Geraete infizieren kann. Diese Person schloss eine Art Abkommen mit einer Gruppe namens Osiron, die behauptete, dafuer genau die richtigen Leute zu kennen. Unsere weiteren Ermittlungen bestaetigten das und legen zudem nahe, dass das eigentliche Ziel der Infektion das Zombie-Implantat gewesen sein koennte.{NEWLINE}Wir muessen nun pruefen, ob uns fruehere Untersuchungen bereits eine Spur geliefert haben. Falls ja, gut. Falls nicht, muessen wir als Naechstes einen Osiron-Boss aufspueren und ihn freundlich zu seinem geheimnisvollen Auftraggeber und dessen technischem Zulieferer befragen. Ich bin sicher, dass M.A.G.M.A. stark daran interessiert sein wird, diese Informationen zu erhalten. Fuer diese Mission muessen wir ein ziviles Fahrzeug und verdeckbare Ausruestung einsetzen."
  STR_ZOMBIE_IMPLANT_PREQ: "Voraussetzung: Zombie-Truppler-Implantat"
  STR_ZOMBIE_IMPLANT_UFOPEDIA: "Dies ist ein spezielles kybernetisches Implantat mit direkter Hirnverbindung. Es erlaubt Zombie-Trupplern, bestimmte komplexe Aufgaben auszufuehren, etwa den Einsatz von Schusswaffen - wenn auch nicht besonders effizient. Das Implantat erinnert funktional an Psiclone, weshalb man annehmen kann, dass es als Gedankenkontrollvorrichtung gedacht war, um das Verhalten des Zombies gezielt zu beeinflussen. Ganz offenbar arbeitet das System jedoch nicht fehlerfrei, denn der Zombie-Truppler reagiert auf jede Form von Implantat-Stimulation ausgesprochen schlecht."
  STR_ZOMBIE_IMPLANT_VIRUS: "Zombie-Implantat-Virus"
  STR_ZOMBIE_IMPLANT_VIRUS_UFOPEDIA: "Wir haben endlich alle Puzzleteile zusammen, um diesen Fall zu loesen. Es stellt sich heraus, dass das Syndikat - als erklaerter Rivale von M.A.G.M.A. - Osiron beauftragt hat, einen Handel mit Cyberweb einzufaedeln. Ziel war ein Computervirus, der die Funktion der Zombie-Implantate von M.A.G.M.A. stoeren sollte. Dieses Virus wurde anschliessend in mehrere M.A.G.M.A.-Labore eingeschleust und begann dort langsam und unregelmaessig, die Implantate gefangener Zombies nacheinander zu infizieren. Gerade diese Langsamkeit und Unberechenbarkeit machten es so schwierig, das Problem einzugrenzen. Zusaetzlich war das Virus so raffiniert konstruiert, dass selbst die Spezialisten von M.A.G.M.A. lange nichts bemerkten.{NEWLINE}Nach all dem duerfte M.A.G.M.A. uns wohl etwas Dankbarkeit schulden. Wir sollten ihre Reaktion abwarten."
  STR_ZOMBIE_INFECTOR_ARMOR: "Kampfanalyse: Zombie-Infektor"
  STR_ZOMBIE_INFECTOR_AUTOPSY: "Autopsie: Zombie-Infektor"
  STR_ZOMBIE_INFECTOR_AUTOPSY_UFOPEDIA: "Dieser Zombie verfuegt ueber gut entwickeltes Muskelgewebe sowie ueber ein stark ausgebautes Herz-Kreislauf- und Nervensystem. Die meisten Zellen wirken jung, als waeren sie erst kuerzlich neu gebildet worden. Auch der Parasit selbst unterliegt erheblichen physiologischen Veraenderungen, die ganz offenbar seiner Fortpflanzung dienen."
  STR_ZOMBIE_INFECTOR_CORPSE: "Leiche eines Zombie-Infektors"
  STR_ZOMBIE_INFECTOR_UFOPEDIA: "Infektoren sind Fette Zombies, die infolge einer energiereichen Diaet aus anderen Zombies eine massive koerperliche Umwandlung durchlaufen haben. Sie sind viel schneller und koordinierter als ihre Artgenossen und stellen deshalb eine deutlich groessere Gefahr dar. Der Parasit nutzt das neue energiereiche Umfeld, um sich zu vermehren; sein Nachwuchs wird anschliessend lebenden Menschen implantiert, die dadurch zu gewoehnlichen Zombies werden. Auch die Lebensspanne dieses Wesens ist, teilweise dank des verbesserten Stoffwechsels, laenger."
  STR_ZOMBIE_INFECTOR_WEAPON: "Biss des Zombie-Infektors"
  STR_ZOMBIE_INFECTOR_WEAPON_UFOPEDIA: "Der Biss eines Zombie-Infektors implantiert ein Parasitenei, das den neuen Wirt augenblicklich und dauerhaft uebernimmt."
  STR_ZOMBIE_INFESTATION: "Zombiebefall"
  STR_ZOMBIE_INFESTATION_BASIC: "Zombiebefall"
  STR_ZOMBIE_INFESTATION_BASIC_BRIEFING: "In dieser Region wurde eine Gruppe aggressiver 'Zombies' gesichtet. Wir muessen das Gebiet sichern und sicherstellen, dass nichts entkommt. Wenn moeglich, sollten wir zudem unbekannte lebende Exemplare festsetzen."
  STR_ZOMBIE_INFESTATION_BASIC_DESCRIPTION: "In dieser Region wurde eine Gruppe aggressiver 'Zombies' gesichtet. Wir muessen das Gebiet sichern und sicherstellen, dass nichts entkommt. Wenn moeglich, sollten wir zudem unbekannte lebende Exemplare festsetzen."
  STR_ZOMBIE_INFESTATION_MEDIUM: "Groesserer Zombiebefall"
  STR_ZOMBIE_INFESTATION_MEDIUM_BRIEFING: "In dieser Region wurde eine grosse Gruppe aggressiver 'Zombies' gesichtet. Wir muessen das Gebiet sichern und sicherstellen, dass nichts entkommt. Wenn moeglich, sollten wir zudem unbekannte lebende Exemplare festsetzen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_ZOMBIE_INFESTATION_MEDIUM_DESCRIPTION: "In dieser Region wurde eine grosse Gruppe aggressiver 'Zombies' gesichtet. Wir muessen das Gebiet sichern und sicherstellen, dass nichts entkommt. Wenn moeglich, sollten wir zudem unbekannte lebende Exemplare festsetzen."
  STR_ZOMBIE_INFESTATION_PACK_COLD: "Zombie-Alarm"
  STR_ZOMBIE_INFESTATION_PACK_DESERT: "Zombie-Alarm"
  STR_ZOMBIE_INFESTATION_PACK_JUNGLE: "Zombie-Alarm"
  STR_ZOMBIE_INFESTATION_PACK_TEMPERATE: "Zombie-Alarm"
  STR_ZOMBIE_INTERROGATED: "Zombie verhoert"
  STR_ZOMBIE_ISOLATION: "Zombie-Isolation"
  STR_ZOMBIE_ISOLATION_BRIEFING: "Ein kleines Krankenhaus hat einen Patienten mit ungewoehnlichen neurologischen Symptomen aufgenommen. Die Laborergebnisse haben das lokale Personal ratlos zurueckgelassen, aber wir glauben zu wissen, worum es sich handelt: ein fruehes Stadium der Zombifizierung. Wir sollten diskret vorgehen, uns als medizinische Spezialisten ausgeben und den Infizierten direkt vor Ort behandeln. Wir muessen uns beeilen; die Zombie-Party kann jeden Moment beginnen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Ausgangsbereich zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_ZOMBIE_ISOLATION_DESCRIPTION: "Ein kleines Krankenhaus hat einen Patienten mit ungewoehnlichen neurologischen Symptomen aufgenommen. Die Laborergebnisse haben das lokale Personal ratlos zurueckgelassen, aber wir glauben zu wissen, worum es sich handelt: ein fruehes Stadium der Zombifizierung. Wir sollten diskret vorgehen, uns als medizinische Spezialisten ausgeben und den Infizierten direkt vor Ort behandeln. Wir muessen uns beeilen; die Zombie-Party kann jeden Moment beginnen."
  STR_ZOMBIE_OVERLORDS: "Zombie-Oberherren"
  STR_ZOMBIE_OVERLORDS_UFOPEDIA: "Vampirkoeniginnen behaupten, bei all ihrer Macht nur einen Schatten des wahren Hoehepunkts im Lebenszyklus der Zombies darzustellen. Diese geheimnisvollen Oberherren sollen riesige Armeen befehligen, ueber Elite-Zombies verfuegen und unuebertroffene psionische Kraft projizieren koennen. Man sagt, sie lebten noch tiefer unter der Erde als die Vampire, dort, wo Gestein und Boden bereits unter ihrer Gegenwart zerbrechen... zumindest wenn man der Koenigin Glauben schenkt.{NEWLINE}Auch wenn die Suche nach solchen mythischen Wesen nicht gerade ermutigend klingt, haben wir offenbar wenig Wahl. Und trotz all ihrer Macht sind Zombies - selbst Vampire - eher naiv und leicht zu beeindrucken. Vielleicht wird es also gar nicht so schlimm."
  STR_ZOMBIE_PARASITE_UFOPEDIA: "Dieser kleine Organismus ist darauf vorbereitet, in einen Menschen eingefuehrt zu werden und ihn in einen Zombie zu verwandeln. Sein Ursprung ist eindeutig ausserirdisch."
  STR_ZOMBIE_PLOT: "Die Zombie-Verschwoerung"
  STR_ZOMBIE_PLOT_UFOPEDIA: "Wir konnten bestaetigen, dass die sogenannten Zombieparasiten in Gebieten mit nachweisbarer Alienaktivitaet auftauchen. Die Besatzung eines Alien-Schiffs entfuehrt einen Menschen, versetzt ihn in einen hypnoseaehnlichen Zustand und gibt ihm mehrere Zombieparasiten mit, die anschliessend in der oertlichen Bevoelkerung ausgesetzt werden. Da das Opfer am Ende meist selbst als letzter Wirt der Charge endet, bleibt die ganze Angelegenheit geheim. Leider koennen wir ueber die eigentlichen Motive der Aliens bislang nur spekulieren."
  STR_ZOMBIE_SERVITOR_CORPSE: "Leiche eines Zombiedieners"
  STR_ZOMBIE_STERILE_ARMOR: "Kampfanalyse: Zombie"
  STR_ZOMBIE_STERILE_AUTOPSY: "Autopsie: Zombie"
  STR_ZOMBIE_STERILE_AUTOPSY_UFOPEDIA: "Diese Kreatur war einst mit Sicherheit ein Mensch, doch ihr zentrales Nervensystem wurde von einem Parasiten unbekannter Herkunft uebernommen. Der Parasit ist etwa erbsengross und besitzt lange Fortsaetze, die sich in verschiedene Organe hineinziehen. Er scheint mit keinem bekannten lebenden oder ausgestorbenen Organismus verwandt zu sein. Die Wirkung auf den Wirtskoerper ist eine nahezu vollstaendige Umgehung des Stoffwechsels, was grosse Widerstandsfaehigkeit und Schmerzlosigkeit erklaert, aber auch den baldigen Verfall."
  STR_ZOMBIE_STERILE_CORPSE: "Leiche eines Zombies"
  STR_ZOMBIE_STERILE_UFOPEDIA: "Diese infizierten Menschen wurden vollstaendig von einem fremdartigen Parasiten uebernommen. Sie besitzen kaum noch kognitive Faehigkeiten und keinerlei hoehere Hirnaktivitaet; tatsaechlich wurde ihr Gehirn zum groessten Teil vom Parasiten aufgezehrt. Schlechte Motorik, primitive Reiz-Reaktion, aber keinerlei Schmerzempfinden. Werkzeuge koennen Zombies nicht benutzen, es sei denn, man drueckt ihnen etwas in die Hand, das sie dann wie eine stumpfe Waffe schwingen. Auch wenn sie noch in ihren alten Koerpern stecken, sind sie keine Menschen mehr, und aufgrund ihres entgleisten Stoffwechsels ist ihre Lebensdauer kurz. Deshalb halten wir sie in Kaefigen und nicht in Zellen."
  STR_ZOMBIE_TROOPER_1_ARMOR: "Kampfanalyse: Zombie-Truppler"
  STR_ZOMBIE_TROOPER_AUTOPSY: "Autopsie: Zombie-Truppler"
  STR_ZOMBIE_TROOPER_AUTOPSY_UFOPEDIA: "Dieser Zombie wurde mit moderner Gefechtsruestung ausgeruestet und sein Rest-Nervensystem ebenso wie der Parasit mit speziellen kybernetischen Implantaten verkabelt. Abgesehen davon scheint es sich um einen gewoehnlichen, gut genaehrten Zombie zu handeln."
  STR_ZOMBIE_TROOPER_CORPSE: "Leiche eines Zombie-Trupplers"
  STR_ZOMBIE_TROOPER_UFOPEDIA: "Dieses Monstrum ist eindeutig das Ergebnis gezielter wissenschaftlicher Experimente an einem gewoehnlichen Zombie. Bemerkenswert ist, dass es bestimmte Objekte wie Waffen und militaerische Ausruestung benutzen kann, waehrend es sehr viel einfachere Mechanismen nicht versteht. Es liegt nahe, dass es fuer bestimmte Aufgaben programmiert wurde, vermutlich ueber ein kybernetisches Implantat, das wir in seinem Gehirn fanden."
  STR_ZOMBIE_WEAPON: "Zombieschlag"
  STR_ZSRR: "Morgenroete"
  STR_ZSRR_AFTER_HQ: "LAGEAKTUALISIERUNG"
  STR_ZSRR_AFTER_HQ_EVENT: "Nachricht der Morgenroete abgefangen"
  STR_ZSRR_AFTER_NETWORK: "LAGEAKTUALISIERUNG"
  STR_ZSRR_AFTER_NETWORK_EVENT: "Nachricht der Morgenroete abgefangen"
  STR_ZSRR_AFTER_OPERATIONS: "LAGEAKTUALISIERUNG"
  STR_ZSRR_AFTER_OPERATIONS_EVENT: "Nachricht der Morgenroete abgefangen"
  STR_ZSRR_ARMORED_CAR: "Panzerwagen der Morgenroete"
  STR_ZSRR_BIO_ENHANCEMENT: "Biologische Aufruestung der Morgenroete"
  STR_ZSRR_BIO_ENHANCEMENT_UFOPEDIA: "Alle Mitglieder der Morgenroete werden einem medizinischen Verfahren unterzogen, das ihre grundlegenden Kampffaehigkeiten deutlich steigert, vor allem Widerstandsfaehigkeit gegen Schaden und koerperliche Staerke. Selbst die niedrigsten Raenge werden aufgeruestet; tatsaechlich scheint dies ein zentraler Bestandteil ihres Rekrutierungsprozesses zu sein. Das deutet darauf hin, dass das Verfahren weit verbreitet und billig ist, obwohl es jeder herkoemmlichen medizinischen Behandlung weit voraus ist. Es basiert auf retroviralen Wirkstoffen, die den Stoffwechsel der Person so veraendern, dass kuenstliche Proteine erzeugt werden, welche das Muskelwachstum foerdern und Muskelgewebe effizienter machen."
  STR_ZSRR_GANGER: "Morgenroete-Mitglied"
  STR_ZSRR_GANGER_ARMOR: "Kampfanalyse: Morgenroete-Mitglied"
  STR_ZSRR_GANGER_UFOPEDIA: "Mitglieder sind die rangniedrigsten Kraefte der Morgenroete. Sie sind zwar nicht besonders gut ausgebildet, verfuegen aber ueber ausgezeichnete Reflexe, Kraft und Ausdauer, was nach naeherer Untersuchung eindeutig auf kuenstliche Verbesserung zurueckzufuehren ist. Als Gegenleistung fuer ihre Dienste verspricht man ihnen koerperliche Macht und einen Anteil an der Kriegsbeute. Mitglieder operieren in der Regel in Staedten und lassen sich leicht mit gewoehnlichen Schlaegern verwechseln, werden aber meist von besser informierten und besser ausgeruesteten Soldaten der Morgenroete beaufsichtigt."
  STR_ZSRR_GANG_WAR_BRIEFING: "Die Morgenroete konkurriert mit einer anderen Bande um die Kontrolle ueber dieses Gebiet. Der Konflikt ist inzwischen zu einer offenen Schlacht eskaliert. Wir muessen die Gegenseite unterstuetzen, die Kraefte der Morgenroete niederkaempfen und die Ordnung wiederherstellen. Um die Mission abzubrechen, lassen Sie die X-Com-Mitarbeiter in das Transportfahrzeug zurueckkehren und klicken das Icon Mission abbrechen an."
  STR_ZSRR_GANG_WAR_DESCRIPTION: "Die Morgenroete konkurriert mit einer anderen Bande um die Kontrolle ueber dieses Gebiet. Der Konflikt ist inzwischen zu einer offenen Schlacht eskaliert. Wir muessen die Gegenseite unterstuetzen, die Kraefte der Morgenroete niederkaempfen und die Ordnung wiederherstellen.{NEWLINE}Der Kampf findet in weitgehend offenem Gelaende statt. Planen Sie ausreichend Deckung und viele Gegner unterschiedlicher Qualitaet ein."
  STR_ZSRR_GOPNIK_DREAM: "Gopnik-Traum"
  STR_ZSRR_HQ: "HQ der Morgenroete"
  STR_ZSRR_HQ_UFOPEDIA: "Wir wissen inzwischen genug ueber die Struktur der Morgenroete: Es handelt sich um eine parasitaere Organisation, die in verschiedenen Militaer- und Regierungsapparaten Osteuropas und Asiens gedeiht. Fast alle hoeheren Mitglieder sind Militaer- oder Geheimdienstoffiziere mit Zugang zu streng geheimen Daten und vielfaeltigen Ressourcen. Das ist eine ihrer groessten Staerken, doch wir koennen sie in eine Schwaeche verwandeln: Jedes enttarnte Mitglied der Morgenroete sollte sich von seinem offiziellen Arbeitgeber leicht aufspueren und neutralisieren lassen, ohne dass wir einen Finger ruehren muessen.{NEWLINE}Der Plan ist einfach: Wir orten die Hauptbasis der Morgenroete irgendwo innerhalb des Polarkreises und beschaffen so viele Personaldaten wie moeglich. Mit diesen Informationen sollten wir die Organisation schwer treffen und moeglicherweise ganz ausloeschen koennen. Ich melde mich, sobald wir eine Gelegenheit zum Angriff haben. Rechnen Sie allerdings mit massivem Widerstand und bereiten Sie sich auf eine schwere Schlacht vor."
  STR_ZSRR_MATROS: "Morgenroete-Matrose"
  STR_ZSRR_MATROS_ARMOR: "Kampfanalyse: Morgenroete-Matrose"
  STR_ZSRR_MATROS_UFOPEDIA: "Matrosen sind Mitglieder der Morgenroete, die fuer Logistik, Kommunikation und Aufsicht zustaendig sind. Ihr Name und ihr Auftreten spiegeln die Tatsache wider, dass es sich um aktive oder ehemalige Angehoerige der russischen Marine handelt, die von der Morgenroete tief infiltriert und mitunter fuer inoffizielle Ziele eingesetzt wird. Ihre Ausruestung stellt im Gefecht nur eine mittlere Bedrohung dar, doch ihre bioengineerten Koerper sollten nicht unterschaetzt werden."
  STR_ZSRR_MOLOLEC: "Morgenroete-Bursche"
  STR_ZSRR_MOLOLEC_ARMOR: "Kampfanalyse: Morgenroete-Bursche"
  STR_ZSRR_MOLOLEC_UFOPEDIA: "Ein Bursche, oder Molodets, ist eine gaengige Bezeichnung fuer einen Soldaten der Morgenroete. Diese Leute verfuegen dank des Verbesserungsprozesses ueber solides Militaertraining und hervorragende koerperliche Eigenschaften. Sie sind zwar nicht besonders gut informiert, aber dennoch ziemlich kompetent. Man setzt sie breit gefaechert zum Schutz von Infrastruktur der Morgenroete, fuer Soeldnerauftraege und bei Terrorangriffen ein. Meist fuehren sie Militaerwaffen."
  STR_ZSRR_NETWORK: "Netzwerk der Morgenroete"
  STR_ZSRR_NETWORK_PREREQUISITE: "Voraussetzung: Netzwerk der Morgenroete"
  STR_ZSRR_NETWORK_UFOPEDIA: "Die Morgenroete verfuegt ueber gute Verbindungen sowohl zur Armee als auch in Geschaeftskreisen. Damit meine ich nicht nur Grossunternehmen, sondern auch Ladenbesitzer, Automechaniker und aehnliche Leute. Sie alle stellen geeignete Orte fuer die verschiedensten Aktivitaeten bereit, von Treffen und militaerischen Lagebesprechungen bis hin zu Kampftraining und moeglicherweise sogar Forschung. Wenn wir diese Orte unter Beobachtung stellen, haben wir vielleicht eine Chance, die Organisation dort zu ueberraschen, hoffentlich in Gegenwart eines hoeheren Offiziers. Vorausgesetzt natuerlich, wir schaffen es ueberhaupt, an sie heranzukommen."
  STR_ZSRR_OPERATIONS: "Operationen der Morgenroete"
  STR_ZSRR_OPERATIONS_UFOPEDIA: "Kommandant, es sieht so aus, als kaemen wir bei der Struktur der Morgenroete voran. Ich habe inzwischen eine Liste prominenter Unterstuetzer der Organisation erstellt, und es ist nur eine Frage der Zeit, bis wir einen hochrangigen Offizier der Morgenroete bei einem Besuch erwischen oder vielleicht sogar eine ganze Zusammenkunft aufspueren. Das waere ein grosser Schritt, um die Morgenroete empfindlich zu treffen.{NEWLINE}Natuerlich sind diese Haeuser gross und schwer bewacht, also liegt es bei Ihnen, ob wir zuschlagen oder auf eine bessere Gelegenheit warten.{NEWLINE}{NEWLINE}{NEWLINE}Ausserdem werden wir uns von jetzt an nicht mehr mit Unterschlupfen der Morgenroete aufhalten; solche Aufgaben gehen kuenftig an die Rats-Bergungstrupps."
  STR_ZSRR_PIONEER: "Morgenroete-Pionier"
  STR_ZSRR_PIONEER_FEMALE: "Morgenroete-Pionierin"
  STR_ZSRR_PIONEER_FEMALE_ARMOR: "Kampfanalyse: Morgenroete-Pionierin"
  STR_ZSRR_PIONEER_MALE: "Morgenroete-Pionier"
  STR_ZSRR_PIONEER_MALE_ARMOR: "Kampfanalyse: Morgenroete-Pionier"
  STR_ZSRR_PIONEER_UFOPEDIA: "Pioniere sind Offiziere in Ausbildung, die hoeherrangigen Offizieren der Morgenroete als Assistenten, Leibwaechter und Boten dienen. Sie sind nicht so gut informiert wie ihre Vorgesetzten, aber gut ausgebildet und entschlossen."
  STR_ZSRR_POWER_STRUGGLE_ON_THE_STREETS: "Machtkampf auf den Strassen"
  STR_ZSRR_RATIONALE: "Morgenroete: Beweggruende"
  STR_ZSRR_RATIONALE_UFOPEDIA: "Die Morgenroete besteht groesstenteils aus ehemaligen sowjetischen Funktionaeren, die mit der neuen Ordnung der Dinge unzufrieden sind, und verbindet Ideologie mit Pragmatismus auf bemerkenswert effiziente Weise. Sie betrachtet die ausserirdische Gesellschaft - oder zumindest das, was sie aus Beweismitteln aus alten UdSSR-Lagerhallen ueber sie weiss - als technologisch ueberlegen und moeglicherweise auch moralisch uebergeordnet. Ihr Ziel ist es, die unvermeidliche Eroberung durch die Ausserirdischen zu ueberleben und moeglicherweise sogar davon zu profitieren. Sie haelt die Ausserirdischen fuer uns gar nicht so unaehnlich und glaubt, dass wir ihnen aehnlicher werden sollten, um unseren Platz in ihrem Reich zu finden. Ausserdem geht sie davon aus, dass die Ausserirdischen ueber eine Art inneren Diskurs verfuegen, auf den sich mit klassischer Politik Einfluss nehmen laesst. Ein grosser Teil ihrer Anstrengungen gilt daher dem Sammeln von Ressourcen fuer spaetere Verhandlungen mit den Invasoren, nachdem wir uns ihnen angeschlossen haben."
  STR_ZSRR_RED_OPS_FEMALE: "RotOps-Soldatin"
  STR_ZSRR_RED_OPS_FEMALE_ARMOR: "Kampfanalyse: RotOps-Soldatin"
  STR_ZSRR_RED_OPS_MALE: "RotOps-Soldat"
  STR_ZSRR_RED_OPS_MALE_ARMOR: "Kampfanalyse: RotOps-Soldat"
  STR_ZSRR_RED_OPS_UFOPEDIA: "RotOps ist eine militaerische Formation aus Elitekraeften der Morgenroete mit erheblicher Kampferfahrung. Diese Leute sind zugleich sehr faehig und sehr gut ausgeruestet, was sie im Gefecht ausserordentlich gefaehrlich macht. Normalerweise setzt man sie fuer Spezialaufgaben ein, wenn schwere Kaempfe zu erwarten sind, doch gluecklicherweise verhindert ihre geringe Zahl einen allzu haeufigen Einsatz. Wie andere Mitglieder der Morgenroete sind auch sie biologisch verbessert, um ihre koerperlichen Eigenschaften zu steigern."
  STR_ZSRR_RETALIATION: "Vergeltung der Morgenroete"
  STR_ZSRR_SHADOW: "Der Schatten der Morgenroete"
  STR_ZSRR_STORM_TRADE: "Storm-Handel der Morgenroete"
  STR_ZSRR_STORM_TRADE_UFOPEDIA: "Um ihre Operationen zu finanzieren, vertreibt die Morgenroete ein bestimmtes chemisches Produkt, das dem Aufbau von Muskelgewebe dient. Diese geheimnisvolle Mischung mit dem Namen Storm steht in direktem Zusammenhang mit der andersweltlichen Technologie der Morgenroete, ist absurd teuer und in den meisten Faellen voellig nutzlos oder sogar schaedlich. Es gibt jedoch seltene Faelle ausserordentlich erfolgreicher Storm-Konsumenten, die ohne Nebenwirkungen uebermenschliche Faehigkeiten entwickeln. Genau diese Geruechte halten die Morgenroete im Geschaeft.{NEWLINE}Wir sollten uns dieses Geschaeft genauer ansehen..."
  STR_ZSRR_TRAINING_CAMP: "Trainingslager"
  STR_ZSRR_TRAINING_CAMP_BRIEFING: "Wir haben ein kleines Lager in der Wildnis aufgespuert, in dem Kraefte der Morgenroete fuer den kommenden Weltkonflikt trainieren, junge Offiziere ihre Fuehrungsfaehigkeiten beweisen wollen und einfache Mitglieder hart arbeiten, um die Offiziere zu beeindrucken. Da es sich um eine Uebung handelt, sind alle Teilnehmer mit Militaerwaffen ausgeruestet. Nehmen Sie das Lager ein und verhaften Sie, wen Sie koennen. Um die Mission abzubrechen, bringen Sie X-Com-Agenten zum Transportfahrzeug zurueck und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_ZSRR_TRAINING_CAMP_DESCRIPTION: "Wir haben ein kleines Lager in der Wildnis aufgespuert, in dem Kraefte der Morgenroete fuer den kommenden Weltkonflikt trainieren, junge Offiziere ihre Fuehrungsfaehigkeiten beweisen wollen und einfache Mitglieder hart arbeiten, um die Offiziere zu beeindrucken. Da es sich um eine Uebung handelt, sind alle Teilnehmer mit Militaerwaffen ausgeruestet. Nehmen Sie das Lager ein und verhaften Sie, wen Sie koennen."
  STR_ZSRR_UBEK: "Morgenroete-Koordinator"
  STR_ZSRR_UBEK_ARMOR: "Kampfanalyse: Morgenroete-Koordinator"
  STR_ZSRR_UBEK_UFOPEDIA: "Die Elite der Morgenroete besteht aus Aufsehern und Kontrolleuren, die aus den Reihen desillusionierter ehemaliger Berufsoffiziere verschiedener postsowjetischer Spezialeinheiten stammen, darunter Fallschirmjaeger, Antiterroreinheiten wie Alpha oder Vympel und GRU-Spetsnaz. Sie haben vollen Zugriff auf alle Ressourcen der Morgenroete, einschliesslich umfangreicher biologischer Aufruestung."
