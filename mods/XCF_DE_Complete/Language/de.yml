  STR_CULT_ASSASSINATION_BLACK_LOTUS: "Kult-Attentat"
  STR_CULT_ASSASSINATION_BLACK_LOTUS_DESCRIPTION: "Killer von Black Lotus bereiten einen Hinterhalt vor, um einen lokalen Funktionaer zu ermorden, der ihrer Sache im Weg steht. Wir muessen die VIP schuetzen. Unsere Reaktionsgeschwindigkeit ist entscheidend!"
  STR_CULT_ASSASSINATION_BRIEFING: "Kult-Auftragsmoerder stellen einem lokalen Amtstraeger eine Falle, der ihrer Sache entgegensteht. Wir muessen den VIP schuetzen. Zusaetzlich uebernehmen wir die Kontrolle ueber sein Sicherheitspersonal. Um die Mission abzubrechen, bringen Sie X-Com-Agenten zum Transportfahrzeug zurueck und klicken Sie auf das Symbol 'Mission abbrechen'."
