  STR_CULT_HIDEOUT_BLACK_LOTUS: "Kult-Aussenposten"
  STR_CULT_HIDEOUT_BLACK_LOTUS_BRIEFING: "Wir haben einen Aussenposten von Black Lotus lokalisiert, der zur Koordination von Agenten und zur Lagerung von Nachschub genutzt wird. Wir muessen alle Anwesenden ausschalten oder festsetzen - idealerweise lebend fuer spaetere Verhoere. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
