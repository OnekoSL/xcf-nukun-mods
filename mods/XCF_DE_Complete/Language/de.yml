  STR_AGENT_WILHEARD_ARMOR: "Kampfanalyse: Agent Wilheard"
  STR_AGENT_WILHEARD_CRUISE_BRIEFING: "Bei der Annaherung an das Wasserfahrzeug kann man keine Spuren von Menschen an Bord ausmachen. Obwohl es mit Hochstgeschwindigkeit fahrt, scheint das Schiff verlassen. Allerdings rasteten unsere ektoplasmatischen Aktivitatssensoren vollig aus, und in der Ferne kann man die verzweifelten Schreie der Mannschaft horen...{NEWLINE}Sie konnen diese Mission nicht abbrechen."
  STR_AGENT_WILHEARD_CRUISE_DESCRIPTION: "Wir konnten endlich den schattenhaften Agenten Wilheard lokalisieren: er wurde vor Kurzem auf diesem Schiff gesehen. Wir sollten diese einmalige Gelegenheit nutzen um diesen gefahrlichen Offizier festzunehmen oder zumindest auszuschalten. Wir vermuten ektoplasmatische Wesen auf dem Schiff.{NEWLINE}Es gibt keinen Fluchtweg, wenn sich die Mission schwierig gestaltet, aber dies ist unsere einzige Chance, Agent Wilheard zu fassen."
  STR_AGENT_WILHEARD_UFOPEDIA: "Ein uraltes Gespenst, das nach eigenen, aeltesten Erinnerungen bereits seit dem Mittelalter mit der Bruderschaft zusammenarbeitet. Im Laufe der Jahrhunderte hat es unzaehlige Geisterwesen absorbiert und in sich aufgenommen, was seine Macht und geistige Stabilitaet erheblich vergroessert hat. Innerhalb der Bruderschaft diente es zuerst als Spion und Assassine, wobei es seine Geisterkraefte auf kreative Weise einsetzte, spaeter dann als Psi-Ingenieur. Seine Herkunft verstehen wir nicht vollstaendig, doch seine Existenz liegt jenseits dessen, was die Technik der Men in Black damals wie heute erklaeren kann, und sollte daher als natuerliche Anomalie gelten. Sein Erfahrungsschatz koennte eine wertvolle Quelle fuer Wissen ueber unsere Feinde und ueber die Geschichte der Alten Welt sein."
