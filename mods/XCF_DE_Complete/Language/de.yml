  STR_CULT_MANOR_ZSRR_ASSAULT: "Anwesen der Morgenroete"
  STR_CULT_MANOR_ZSRR_ASSAULT_: "Anwesen der Morgenroete-{0}"
  STR_CULT_MANOR_ZSRR_ASSAULT_BRIEFING: "Sie stehen kurz davor, eine grosse, dauerhafte Basis der Morgenroete zu stuermen. Die Organisation hat das umliegende Gebiet politisch dominiert, daher ist X-Com bei diesem Einsatz auf sich allein gestellt. Nehmen Sie alle Kultmitglieder fest oder schalten Sie sie aus. Falls Sie sich zum Rueckzug entschliessen, sammeln Sie die verbleibenden Agenten in der gruenen Ausgangszone und klicken Sie auf das Symbol Mission abbrechen."
  STR_CULT_MANOR_ZSRR_ASSAULT_DESCRIPTION: "Die Morgenroete hat in dieser Stadt eine dauerhafte Basis eingerichtet. Wir muessen sie zerstoeren, bevor sie unserer Sache zu grossen Schaden zufuegt. Das umliegende Gebiet steht politisch bereits unter ihrem Einfluss, daher ist X-Com bei dieser Operation auf sich allein gestellt."
  STR_CULT_MANSION_DEFENSE_EXALT: "EXALT-Liquidierung"
  STR_CULT_MANSION_DEFENSE_EXALT_BRIEFING: "EXALT fuehrt einen Ueberfall auf das Haus eines politischen Gegners durch. Wir muessen die Bewohner schuetzen! Rechnen Sie mit gut ausgeruesteten und entschlossenen Angreifern und achten Sie auf Feinde, die das Gebaeude moeglicherweise bereits infiltriert haben."
  STR_CULT_MANSION_DEFENSE_EXALT_DESCRIPTION: "EXALT fuehrt einen Ueberfall auf das Haus eines politischen Gegners durch. Wir muessen die Bewohner schuetzen!{NEWLINE}Rechnen Sie mit gut ausgeruesteten und entschlossenen Angreifern. Sie beginnen im Haus und kaempfen sich nach aussen, um Widerstand auszuschalten und nach Ueberlebenden zu suchen. Seien Sie ausserdem auf Feinde vorbereitet, die das Gebaeude vielleicht bereits infiltriert haben. Und packen Sie besser auch ein paar Mittel gegen Fahrzeuge ein - nur fuer den Fall. Diese Mission laesst keinen Rueckzug zu."
  STR_CULT_OF_APOCALYPSE_CITY_RIOT: "Kult der Apokalypse: Stadtaufstand"
  STR_CULT_OF_APOCALYPSE_CITY_RIOT_BRIEFING: "Der Kult der Apokalypse hat einen Aufstand angestachelt, und viele ganz normale Zivilisten wurden in den Taumel hineingezogen. Zwischen diesen Gruppen und der oertlichen Polizei ist ein regelrechtes Gefecht ausgebrochen, mit zahlreichen Opfern auf beiden Seiten. Wir muessen eingreifen und die Kontrolle ueber das Gebiet zurueckgewinnen, bevor sich das Militaer einschaltet - sonst leidet unser Ruf beim Rat. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CULT_OF_APOCALYPSE_CITY_RIOT_DESCRIPTION: "Mitglieder des sogenannten Kults der Apokalypse haben einen Stadtaufstand ausgeloest. Zwischen den Aufstaendischen und der oertlichen Polizei ist ein offenes Gefecht entbrannt, bei dem es auf beiden Seiten viele Opfer gibt. Wir muessen eingreifen und die Kontrolle ueber das Gebiet zurueckerlangen, bevor das Militaer aktiv wird."
  STR_CULT_OF_APOCALYPSE_PREQ_CAVEMEN: "Voraussetzung: Kult der Apokalypse (Cavemen)"
  STR_CULT_OF_APOCALYPSE_PREQ_EASY_RIDERS: "Voraussetzung: Kult der Apokalypse (Easy Riders)"
  STR_CULT_OF_APOCALYPSE_PREQ_LUCHADORES: "Voraussetzung: Kult der Apokalypse (Luchadores)"
  STR_CULT_OF_APOCALYPSE_PREQ_PINKY_DEVILS: "Voraussetzung: Kult der Apokalypse (Pinky Devils)"
  STR_CULT_OF_APOCALYPSE_PREQ_TECH_WIZARDS: "Voraussetzung: Kult der Apokalypse (Wizkids)"
  STR_CULT_OF_APOCALYPSE_PREQ_WESTMEN: "Voraussetzung: Kult der Apokalypse (Westmen)"
  STR_CULT_OF_APOCALYPSE_PRISON_BREAK: "Kult der Apokalypse: Gefaengnisausbruch"
  STR_CULT_OF_APOCALYPSE_PRISON_BREAK_BRIEFING: "In einem Gefaengniskomplex kam es zu einem ploetzlichen und unerklaerlichen Gewaltausbruch. Nachdem die Haeftlinge die Einrichtung uebernommen hatten, wurde sie von der Polizei umstellt. Entkommenes Personal berichtete, dass irgendeine Art Kult in den Vorfall verwickelt ist. Es liegt also an uns, die Ordnung wiederherzustellen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CULT_OF_APOCALYPSE_PRISON_BREAK_DESCRIPTION: "In einem Gefaengniskomplex kam es zu einem ploetzlichen und unerklaerlichen Gewaltausbruch. Nachdem die Haeftlinge die Einrichtung uebernommen hatten, wurde sie von der Polizei umstellt. Entkommenes Personal berichtete, dass irgendeine Art Kult in den Vorfall verwickelt ist. Es liegt also an uns, die Ordnung wiederherzustellen. Der Feind verfuegt nur ueber Waffen, die er dem Sicherheitspersonal abnehmen konnte, besitzt dafuer aber einen deutlichen numerischen Vorteil."
  STR_CULT_OF_APOCALYPSE_TOWN_CLEANUP: "Kult der Apokalypse: Stadtsaeuberung"
  STR_CULT_OF_APOCALYPSE_TOWN_CLEANUP_BRIEFING: "In einer Kleinstadt kam es zu einer Sicherheitsluecke. Sensible Informationen ueber Alien- und Kultaktivitaeten wurden von einer unbekannten Quelle verbreitet und in der Bevoelkerung verteilt. Der Rat entsandte das Bergungskorps, um die Lage einzudaemmen, stiess dabei jedoch auf ueberraschend gut bewaffneten und organisierten Widerstand. Ihre Aufgabe ist es, diesen Widerstand niederzuschlagen, damit das Leck geschlossen werden kann. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CULT_OF_APOCALYPSE_TOWN_CLEANUP_DESCRIPTION: "In einer Kleinstadt kam es zu einer Sicherheitsluecke. Sensible Informationen ueber Alien- und Kultaktivitaeten wurden von einer unbekannten Quelle verbreitet und in der Bevoelkerung verteilt. Der Rat entsandte das Bergungskorps, um die Lage einzudaemmen, stiess dabei jedoch auf ueberraschend gut bewaffneten und organisierten Widerstand. Ihre Aufgabe ist es, diesen Widerstand niederzuschlagen, damit das Leck geschlossen werden kann."
  STR_CULT_OF_APOCALYPSE_UFOPEDIA: "Neben all den anderen Gefahren verbirgt sich unter den Menschen der Erde eine geheimnisvolle Kraft, die darauf hinarbeitet, die Welt im Chaos zu ertraenken - und die doch scheinbar nichts mit bekannten Alienkulten oder xeno-inspirierten Verschwoerungen zu tun hat. Ueber viele Jahre hat diese Praesenz unterschiedliche Banden und Sekten mit rebellischen Zielen gefoerdert, Verbuendete gesammelt und Feinde studiert. Nun scheint der Augenblick nahe, in dem sie sich der Welt offenbart, und das verheisst gewiss nichts Gutes."
  STR_CULT_SEARCH_WARRANT_EXALT: "EXALT-Durchsuchungsbeschluss"
  STR_CULT_SEARCH_WARRANT_EXALT_BRIEFING: "Ungluecklicherweise hat die Regierung Wind von den Aktivitaeten von EXALT bekommen, und die lokalen Polizeikraefte bereiten sich darauf vor, das Viertel einer ihrer Zellen zu stuermen. Trotz des Unbehagens der Beamten werden wir sie unterstuetzen, um sicherzustellen, dass keinerlei direkte Beweise fuer EXALT an die Oeffentlichkeit gelangen. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
  STR_CULT_SEARCH_WARRANT_EXALT_DESCRIPTION: "Ungluecklicherweise hat die Regierung Wind von den Aktivitaeten von EXALT bekommen, und die lokalen Polizeikraefte bereiten sich darauf vor, das Viertel einer ihrer Zellen zu stuermen. Trotz des Unbehagens der Beamten werden wir sie unterstuetzen, um sicherzustellen, dass keinerlei direkte Beweise fuer EXALT an die Oeffentlichkeit gelangen. Die Antiterroreinheit wird losschlagen, sobald Ihre Agenten vor Ort sind."
  STR_CULT_STREET_FIGHTING_BLACK_LOTUS: "Strassenkaempfe"
  STR_CULT_STREET_FIGHTING_BLACK_LOTUS_BRIEFING: "Black Lotus kaempft mit einer anderen kriminellen Gruppierung um die Vorherrschaft. Wegen des Einflusses des Kults koennen wir uns nicht auf die Polizei verlassen. Unsere Aufgabe ist es, den lokalen Gangstern dabei zu helfen, ihr Revier zu halten. Um die Mission abzubrechen, lassen Sie die X-Com-Operativen zum Transportfahrzeug zurueckkehren und klicken Sie auf das Symbol 'Mission abbrechen'."
